<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap');
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; background:#0a0910; color:#e2d6bb;
    font-family:'Cormorant Garamond', Georgia, serif; }
  body{ display:flex; align-items:center; justify-content:center; padding:2vh 2vw; }

  /* the case, and everything on it placed as a percentage of it */
  /* The case must fit the viewport in BOTH directions. Sized by height alone it
     ran off the sides of a phone and the shelves were cut in half. 1064/992 is the
     case's own proportion, so this is the tallest it can be and still fit across. */
  #case{ position:relative; flex:none; aspect-ratio:992/1064;
    --h: min(95vh, calc(96vw * 1.0726), 1064px);
    height:var(--h); --u: calc(var(--h) / 1064); }
  #case > img.wood{ width:100%; height:100%; display:block; }

    width:14.718%; height:4.887%; }

    width:7.863%; height:9.774%; }
  #c-conometer{ left:37.063%; top:16.541%;

  #c-chimes{ left:66.255%; top:45.771%;

  #p-systema{ left:26.210%; top:56.203%;

  #c-birds{ left:31.225%; top:60.432%;
    width:7.863%; height:9.774%; }
  #c-fireflies{ left:48.740%; top:60.432%;

  #oval{ position:absolute; display:flex; align-items:center; justify-content:center;
    font-size:calc(var(--u) * 40px); font-weight:700; letter-spacing:.16em;
    /* engraved: cut dark into the brass, with a bright lip on the lower edge where
       the light catches the cut */
    color:#33230a; text-shadow:0 1px 0 rgba(255,238,196,.5), 0 -1px 1px rgba(0,0,0,.35);
    pointer-events:none; }

  /* the name of the type, engraved on the plate of the shelf it labels */
  .plate{ position:absolute; display:flex; align-items:center; justify-content:center;
    font-size:calc(var(--u) * 15px); font-weight:600; letter-spacing:.02em;
    color:#3b2807; text-shadow:0 1px 0 rgba(255,238,196,.42), 0 -1px 1px rgba(0,0,0,.3);
    white-space:nowrap; pointer-events:none; }
  .plate i{ font-style:normal; }

  /* the pieces, standing face front on their shelf */
  .piece{ position:absolute; display:block; text-decoration:none;
    transition:transform .25s cubic-bezier(.2,.7,.3,1), filter .25s ease;
    transform-origin:50% 100%; }
  .piece img{ width:100%; height:100%; object-fit:cover; display:block;
    border-radius:2px; box-shadow:0 3px 7px rgba(0,0,0,.75), 0 0 0 1px rgba(0,0,0,.5); }
  .piece b{ position:absolute; left:50%; bottom:100%; transform:translateX(-50%);
    margin-bottom:calc(var(--u) * 7px); font-size:calc(var(--u) * 17px); font-weight:600;
    letter-spacing:.08em; color:#e8dcbd; opacity:0; white-space:nowrap;
    transition:opacity .25s ease; text-shadow:0 1px 4px #000; pointer-events:none; }
  .piece:hover{ transform:scale(1.14) translateY(calc(var(--u) * -4px)); z-index:5; }
  .piece:hover b{ opacity:1; }
  .piece:focus-visible{ outline:2px solid #b8903f; outline-offset:2px; }

<script>
(function(){
  // Fit each engraved name to its own plate by MEASURING it rather than guessing a
  // character width. Two goes at estimating it by hand both overran the brass onto
  // the wood -- the face is wider than it looks and the letter-spacing compounds it.
  // This also survives the webfont arriving late, which an estimate would not.
  // Measure the TEXT, not the box. The plate is a centred flex container, so its
  // scrollWidth just reports the container however far the words overflow it — the
  // first attempt at this drove every name down to the 4px floor and still called
  // them too wide. Wrapping the words lets them be measured directly.
  document.querySelectorAll('.plate').forEach(function(el){
    if(!el.firstElementChild) el.innerHTML = '<i>' + el.textContent + '</i>';
  });
  function fit(){
    document.querySelectorAll('.plate').forEach(function(el){
      var inner = el.firstElementChild, box = el.clientWidth * 0.92;
      if(!inner || !box) return;
      el.style.fontSize = '';
      var size = parseFloat(getComputedStyle(el).fontSize), guard = 0;
      while(inner.offsetWidth > box && size > 4 && guard++ < 60){
        size -= 0.3;
        el.style.fontSize = size + 'px';
      }
    });
  }
  fit();
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  addEventListener('resize', fit);
})();
</script>
