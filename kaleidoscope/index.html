<style>
  :root{ --bg1:#11161f; --bg2:#080a0f; --brass:#c9974e; --dim:#8b93a1; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{ height:100%; margin:0;
    background:radial-gradient(ellipse at 50% 30%, var(--bg1) 0%, var(--bg2) 78%);
    overflow-x:hidden; }
  #backlink{ position:fixed; top:18px; left:22px; z-index:50; color:#dfe6ea; opacity:.5;
    text-decoration:none; font-family:Georgia,serif; font-size:14px; letter-spacing:.04em;
    text-shadow:0 1px 3px rgba(0,0,0,.85), 0 0 9px rgba(0,0,0,.55); transition:opacity .3s ease; }
  #backlink:hover{ opacity:.9; }

  #wrap{ min-height:100vh; min-height:100dvh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:64px 16px 32px; gap:18px; }

  .disc{ position:relative; border-radius:50%; }

  #scopeWrap{ width:min(50vh,400px); aspect-ratio:1/1; cursor:grab; touch-action:none; }
  #scopeWrap:active{ cursor:grabbing; }
  #scopeRing{ position:absolute; inset:0; border-radius:50%; pointer-events:none;
    background: repeating-conic-gradient(from 0deg, #7c5c2c 0deg 3deg, #e3bd7c 3deg 5deg, #a9793c 5deg 6deg);
    box-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 6px 22px rgba(0,0,0,.55), inset 0 0 10px rgba(0,0,0,.55); }
  #scopeInner{ position:absolute; inset:6.5%; border-radius:50%; overflow:hidden; background:#050608;
    box-shadow: inset 0 0 26px rgba(0,0,0,.85), 0 0 0 1px rgba(0,0,0,.5); }
  #scopeInner canvas{ position:absolute; inset:0; width:100%; height:100%; }
  #scopeInner::after{ content:''; position:absolute; inset:0; border-radius:50%; pointer-events:none;
    box-shadow: inset 0 0 18px rgba(0,0,0,.7); }

  #trayWrap{ width:min(20vh,160px); aspect-ratio:1/1; cursor:default; margin-bottom:8px; }
  #trayWrap canvas{ position:absolute; inset:0; width:100%; height:100%; border-radius:50%; }

  #controls{ display:flex; align-items:flex-end; justify-content:center; gap:44px; flex-wrap:wrap; }
  #leftCluster{ display:flex; flex-direction:column; align-items:center; gap:10px; }
  #rightCluster{ display:flex; flex-direction:column; align-items:center; gap:10px; }

  #palette{ display:grid; grid-template-columns:repeat(4, 44px); gap:8px; }
  .piece{ width:44px; height:44px; border-radius:8px; overflow:hidden; cursor:grab;
    border:1.5px solid rgba(236,227,208,.16); opacity:.75; touch-action:none;
    transition:opacity .2s ease, transform .2s ease; background:#0a0b0d; }
  .piece:hover{ opacity:1; transform:translateY(-2px); }
  .piece img{ width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; }
  .piece.add-tile{ position:relative; display:flex; align-items:center; justify-content:center; border-style:dashed; }
  .piece.add-tile img{ display:none; }
  .piece.add-tile.has-image img{ display:block; }
  .add-plus{ font-size:20px; line-height:1; color:rgba(236,227,208,.55); pointer-events:none; }
  .piece.add-tile.has-image .add-plus{ display:none; }
  .swap-btn{ display:none; position:absolute; right:2px; bottom:2px; width:16px; height:16px; border-radius:50%;
    border:none; background:rgba(8,9,12,.8); color:#f2e9d8; font-size:10px; line-height:1; cursor:pointer; padding:0; }
  .piece.add-tile.has-image .swap-btn{ display:block; }

  input[type=range]{ -webkit-appearance:none; appearance:none; width:184px; height:6px; border-radius:4px;
    outline:none; cursor:pointer; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:16px; height:16px; border-radius:50%;
    background:#fff; border:2px solid rgba(0,0,0,.4); cursor:pointer; box-shadow:0 0 6px rgba(0,0,0,.5); }
  input[type=range]::-moz-range-thumb{ width:14px; height:14px; border-radius:50%; background:#fff;
    border:2px solid rgba(0,0,0,.4); cursor:pointer; }
  #hueSlider{ background:linear-gradient(to right, hsl(0,85%,60%), hsl(60,85%,60%), hsl(120,85%,60%),
      hsl(180,85%,60%), hsl(240,85%,60%), hsl(300,85%,60%), hsl(360,85%,60%)); }
  #sizeSlider{ background:linear-gradient(to right, rgba(236,227,208,.15), rgba(236,227,208,.5)); }

  #mirrors{ display:grid; grid-template-columns:repeat(2, 44px); gap:8px; }
  .mbtn{ width:44px; height:44px; border-radius:8px; border:1.5px solid rgba(236,227,208,.18);

    transition:opacity .2s ease, border-color .2s ease, background .2s ease; }
  .mbtn svg{ width:100%; height:100%; }
  .mbtn:hover{ opacity:.9; }
  .mbtn.active{ opacity:1; border-color:var(--brass); background:rgba(201,151,78,.12); }

    box-shadow:0 6px 18px rgba(0,0,0,.5); display:none; }

<div id="music" title="play your own music">
  <button id="musicBtn" aria-label="play your own music">🎧</button>
  <span id="musicName"></span>
</div>
<input type="file" id="musicPick" accept="audio/*" multiple hidden>
<audio id="musicEl"></audio>
<script>
(function(){
  const pick=document.getElementById('musicPick'), el=document.getElementById('musicEl'),
        btn=document.getElementById('musicBtn'), name=document.getElementById('musicName');
  let list=[], idx=0;
  const label=f=> f ? f.name.replace(/\.[^.]+$/,'') : '';
  function load(i){ if(el.src) URL.revokeObjectURL(el.src); el.src=URL.createObjectURL(list[i]); name.textContent=label(list[i]); }
  function sync(){ btn.textContent = !el.src ? '🎧' : (el.paused ? '▶' : '❚❚'); btn.classList.toggle('playing', !!el.src && !el.paused); }
  btn.addEventListener('click', ()=>{ if(!list.length){ pick.click(); return; } el.paused ? el.play() : el.pause(); });
  name.addEventListener('click', ()=> pick.click());
  pick.addEventListener('change', ()=>{ if(!pick.files.length) return; list=[...pick.files]; idx=0; el.loop=(list.length===1); load(0); el.play(); });
  el.addEventListener('ended', ()=>{ if(list.length>1){ idx=(idx+1)%list.length; load(idx); el.play(); } });
  el.addEventListener('play', sync); el.addEventListener('pause', sync); el.addEventListener('loadeddata', sync);
  sync();
})();
</script>

<script>
(function(){
  // draw the mirror-count line diagrams procedurally so the icon always
  // matches the real N exactly, rather than hand-drawing four separate svgs
  document.querySelectorAll('.mbtn').forEach(btn=>{
    const n=parseInt(btn.dataset.n,10);
    const g=btn.querySelector('g');
    const cx=20,cy=20,r=15.5;
    let d='';
    for(let i=0;i<n;i++){
      const a=(Math.PI*2/n)*i - Math.PI/2;
      const x=cx+Math.cos(a)*r, y=cy+Math.sin(a)*r;
      d+=`M${cx},${cy} L${x.toFixed(2)},${y.toFixed(2)} `;
    }
    g.innerHTML = `<path d="${d}" />`;
  });

  function loadImg(src){ const im=new Image(); im.src=src; return im; }
  const srcImgs = {
    gem: loadImg('kaleidoscope-gem.png'),
    glass: loadImg('kaleidoscope-glass.png'),
    nail: loadImg('kaleidoscope-nail.png'),
    gear: loadImg('kaleidoscope-gear.png'),
    bead_clear: loadImg('kaleidoscope-bead-clear.png'),
    bead_black: loadImg('kaleidoscope-bead-black.png'),
    bead_silver: loadImg('kaleidoscope-bead-silver.png'),
    bead_gold: loadImg('kaleidoscope-bead-gold.png'),
    stainedglass: loadImg('kaleidoscope-stainedglass.png'),
    china: loadImg('kaleidoscope-china.png'),
  };
  const trayImg = loadImg('kaleidoscope-tray.jpg');

  const trayWrap=document.getElementById('trayWrap'), trayCanvas=document.getElementById('tray');
  const trayCtx=trayCanvas.getContext('2d');
  const scopeWrap=document.getElementById('scopeWrap'), scopeInner=document.getElementById('scopeInner');
  const scopeRing=document.getElementById('scopeRing'), scopeCanvas=document.getElementById('scope');
  const scopeCtx=scopeCanvas.getContext('2d');
  const hueSlider=document.getElementById('hueSlider'), sizeSlider=document.getElementById('sizeSlider');
  const ghost=document.getElementById('ghost'), ghostImg=document.getElementById('ghostImg');

  let DPR=Math.min(2,window.devicePixelRatio||1);
  let traySize=0, scopeSize=0;
  let mirrors=6, turn=0.5;

  // placed objects, in tray-normalized 0..1 coordinates so they stay put
  // correctly regardless of on-screen size
  // the scope only ever shows a wedgeAngle-wide sliver of the tray at a time (that
  // sliver gets mirrored around to fill the circle) — the narrower that sliver is
  // (high mirror counts), the easier it is for a turn to land on a moment where none
  // of the pieces fall inside it, reading as a fully black scope even though pieces
  // are clearly on the tray. The one placement that defeats this for every mirror
  // count and every turn is a piece whose own circle contains the tray's exact
  // centre point (0.5,0.5) — every angle passes through that piece near the centre,
  // so the wedge sliver can never be empty. That piece needs to actually READ as
  // visible too, not just be geometrically present — a gem works far better than
  // glass here since its colour tint (below) makes it solid and bright, where the
  // glass art is mostly pale, thin outlines that all but disappear against the dark
  // tray. So the centred piece is a gem; glass and the second gem fill out the rest.
  let placed=[
    {type:'gem', x:0.42, y:0.55, size:0.3, hue:200},
    {type:'glass', x:0.66, y:0.34, size:0.18},
    {type:'gem', x:0.27, y:0.4, size:0.16, hue:30},
  ];

  // every non-gem piece used to drop at one flat 0.28 size regardless of type — on a tray
  // this small that's most of the working area, so placing more than 2-3 pieces buried
  // earlier ones completely under later ones with no way to tell they were even there.
  // Sized per type instead, closer to how big each object actually reads at the curated
  // defaults' scale above.
  const DROP_SIZE = {
    gem:0.22, gear:0.15, nail:0.16, bead_clear:0.13, bead_black:0.13, bead_silver:0.13, bead_gold:0.13,
    china:0.20, stainedglass:0.20, glass:0.20, custom:0.20
  };
  const SIZE_SLIDER_DEFAULT = 22;
  // nudges a freshly-dropped piece away from ones already sitting where it landed —
  // real small objects in a tray do rest touching or slightly overlapping each other,
  // they just don't land dead-center on top of one another and vanish from view
  function separateFromPlaced(p, size){
    for(let iter=0; iter<4; iter++){
      let moved=false;
      for(const o of placed){
        const dx=p.x-o.x, dy=p.y-o.y, d=Math.hypot(dx,dy)||0.0001;
        const minD=(size+o.size)/2*0.72;
        if(d<minD){ const push=minD-d; p.x+=(dx/d)*push; p.y+=(dy/d)*push; moved=true; }
      }
      const cx=0.5, cy=0.5, dx=p.x-cx, dy=p.y-cy, dist=Math.hypot(dx,dy)||0.0001, maxR=0.5-size/2-0.02;
      if(dist>maxR){ p.x=cx+dx/dist*maxR; p.y=cy+dy/dist*maxR; }
      if(!moved) break;
    }
    return p;
  }

  function resize(){
    DPR=Math.min(2,window.devicePixelRatio||1);
    const tr=trayWrap.getBoundingClientRect();
    traySize=Math.round(tr.width*DPR);
    trayCanvas.width=traySize; trayCanvas.height=traySize;
    const sr=scopeInner.getBoundingClientRect();
    scopeSize=Math.round(sr.width*DPR);
    scopeCanvas.width=scopeSize; scopeCanvas.height=scopeSize;
    drawAll();
  }
  window.addEventListener('resize', resize);

  function updateRing(){
    scopeRing.style.transform = `rotate(${(turn*180/Math.PI)}deg)`;
  }

  function drawObject(ctx, o, size){
    const img=srcImgs[o.type];
    if(!img || !img.complete || !img.naturalWidth) return;
    const px=o.x*size, py=o.y*size, s=o.size*size;
    ctx.save();
    ctx.beginPath(); ctx.arc(px,py,s/2,0,Math.PI*2); ctx.clip();
    // center-crop to square first — the built-in pieces are already square, but a
    // visitor's own photo rarely is, and this keeps it from stretching in the circle
    const iw=img.naturalWidth, ih=img.naturalHeight, sq=Math.min(iw,ih);
    ctx.drawImage(img, (iw-sq)/2, (ih-sq)/2, sq, sq, px-s/2, py-s/2, s, s);
    if(o.type==='gem'){
      ctx.globalCompositeOperation='color';
      ctx.fillStyle=`hsl(${o.hue}, 85%, 50%)`;
      ctx.fillRect(px-s/2, py-s/2, s, s);
      ctx.globalCompositeOperation='source-over';
    }
    ctx.restore();
  }

  function drawTray(){
    if(!traySize) return;
    trayCtx.clearRect(0,0,traySize,traySize);
    if(trayImg.complete && trayImg.naturalWidth){
      trayCtx.drawImage(trayImg,0,0,traySize,traySize);
    }
    for(const o of placed) drawObject(trayCtx, o, traySize);
  }

  // the tray photo is a real tin with its own gold rim baked in — the velvet
  // interior only fills the inner portion of the frame before that rim
  // starts. Panning the sample far enough (see the translate below) can
  // otherwise sweep past the velvet into that rim, mirroring fragments of
  // it into the pattern as a stray pale shape that doesn't belong there.
  // 0.78 was checked empirically across a full turn of the ring at every
  // mirror count, comfortably inside the real boundary rather than right
  // up against it.
  const TRAY_SAFE_FRACTION = 0.78;

  function drawScope(){
    if(!scopeSize) return;
    scopeCtx.clearRect(0,0,scopeSize,scopeSize);
    const cx=scopeSize/2, cy=scopeSize/2, R=scopeSize/2;
    const wedgeAngle=(Math.PI*2)/mirrors;
    scopeCtx.save();
    scopeCtx.beginPath(); scopeCtx.arc(cx,cy,R,0,Math.PI*2); scopeCtx.clip();
    // fill with the tray's own velvet tone first so gaps between mirrored
    // objects read as more tray, not flat black
    scopeCtx.fillStyle='#0c0a08'; scopeCtx.fillRect(0,0,scopeSize,scopeSize);
    for(let i=0;i<mirrors;i++){
      scopeCtx.save();
      scopeCtx.translate(cx,cy);
      scopeCtx.rotate(i*wedgeAngle);
      if(i%2===1) scopeCtx.scale(1,-1);
      scopeCtx.beginPath();
      scopeCtx.moveTo(0,0);
      scopeCtx.arc(0,0,R,-wedgeAngle/2,wedgeAngle/2);
      scopeCtx.closePath();
      scopeCtx.clip();
      const s=R*2.4;
      scopeCtx.rotate(turn);
      // no pan offset here, on purpose: the centre of the mirror formation is the
      // tray's own true centre, always, so it never depends on where `turn` happens
      // to be. Two earlier attempts panned the sample away from centre instead (first
      // by a lot, then by a little) to let rim-placed pieces eventually sweep into
      // view — both wrong, because that offset also orbits the tray's OWN centre (and
      // anything placed there, the common case) out of the wedge's narrow slice for
      // real stretches of a turn, reading as objects going missing. Turning still
      // rotates the whole pattern (see the rotate above), just around a fixed middle
      // instead of a wandering one. s is already zoomed in past the wedge's own radius
      // R (s/2 = 1.2R), so a real, sizeable ring around the centre — not just a pinprick
      // — is visible without any pan at all; only the tray's outer rim stays out of reach.
      if(trayCanvas.width){
        // constrain painting to the tray's own safe velvet circle (in
        // addition to the wedge clip already active) so the rim can never
        // show up here, no matter how far the pan/turn reaches
        scopeCtx.save();
        scopeCtx.beginPath();
        scopeCtx.arc(0, 0, TRAY_SAFE_FRACTION*(s/2), 0, Math.PI*2);
        scopeCtx.clip();
        scopeCtx.drawImage(trayCanvas, -s/2, -s/2, s, s);
        scopeCtx.restore();
      }
      scopeCtx.restore();
    }
    scopeCtx.restore();
    const g=scopeCtx.createRadialGradient(cx,cy,R*0.15,cx,cy,R);
    g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,.42)');
    scopeCtx.fillStyle=g;
    scopeCtx.beginPath(); scopeCtx.arc(cx,cy,R,0,Math.PI*2); scopeCtx.fill();
  }

  function drawAll(){ drawTray(); drawScope(); }

  // ---------- turning the scope ----------
  let scopeDragging=false, lastX=0;
  scopeWrap.addEventListener('pointerdown', e=>{ scopeDragging=true; lastX=e.clientX; scopeWrap.setPointerCapture(e.pointerId); });
  scopeWrap.addEventListener('pointermove', e=>{
    if(!scopeDragging) return;
    turn += (e.clientX-lastX)*0.012; lastX=e.clientX;
    updateRing();
    drawScope();
  });
  scopeWrap.addEventListener('pointerup', ()=>scopeDragging=false);
  scopeWrap.addEventListener('pointercancel', ()=>scopeDragging=false);

  // ---------- mirror count ----------
  document.querySelectorAll('.mbtn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.mbtn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      mirrors=parseInt(btn.dataset.n,10);
      drawScope();
    });
  });

  // ---------- gem colour + size ----------
  hueSlider.addEventListener('input', ()=>{
    // colours the piece currently being dragged (if a gem) and sets the
    // colour new gems will be placed with
    currentHue = parseInt(hueSlider.value,10);
    if(dragging && dragging.type==='gem'){ dragging.hue=currentHue; drawAll(); }
  });
  let currentHue = parseInt(hueSlider.value,10);

  // one slider, every piece — it scales each type's own base size up or down together
  // (so a nail stays smaller than a china shard at any setting) rather than only ever
  // affecting gems while every other piece stayed fixed at its default size
  sizeSlider.addEventListener('input', ()=>{
    sizeMul = parseInt(sizeSlider.value,10)/SIZE_SLIDER_DEFAULT;
    if(dragging){ dragging.size=(DROP_SIZE[dragging.type]||0.2)*sizeMul; drawAll(); }
  });
  let sizeMul = parseInt(sizeSlider.value,10)/SIZE_SLIDER_DEFAULT;

  // ---------- dragging pieces onto / around the tray ----------
  let dragging=null; // the object currently being moved (from palette or already placed)
  let dragFromPalette=false;

  function trayRect(){ return trayWrap.getBoundingClientRect(); }
  function clientToTray(clientX, clientY){
    const r=trayRect();
    return { x:(clientX-r.left)/r.width, y:(clientY-r.top)/r.height };
  }
  function withinTray(clientX, clientY){
    const r=trayRect();
    const cx=r.left+r.width/2, cy=r.top+r.height/2;
    const dx=clientX-cx, dy=clientY-cy;
    return Math.hypot(dx,dy) <= r.width/2;
  }

  const imgPick=document.getElementById('imgPick'), customPiece=document.getElementById('customPiece');
  let customLoaded=false, customObjectURL=null;

  document.querySelectorAll('.piece').forEach(piece=>{
    piece.addEventListener('pointerdown', e=>{
      const type=piece.dataset.type;
      if(type==='custom' && !customLoaded){ imgPick.click(); e.preventDefault(); return; }
      dragging={ type, x:0.5, y:0.5, size: (DROP_SIZE[type]||0.2)*sizeMul, hue: type==='gem'?currentHue:undefined };
      dragFromPalette=true;
      ghost.style.display='block';
      ghostImg.src = piece.querySelector('img').src;
      moveGhost(e.clientX, e.clientY);
      e.preventDefault();
    });
  });

  customPiece.querySelector('.swap-btn').addEventListener('pointerdown', e=>{
    e.stopPropagation(); e.preventDefault();
    imgPick.click();
  });
  imgPick.addEventListener('change', ()=>{
    if(!imgPick.files.length) return;
    if(customObjectURL) URL.revokeObjectURL(customObjectURL);
    customObjectURL=URL.createObjectURL(imgPick.files[0]);
    const im=new Image();
    im.onload=()=>{
      srcImgs.custom=im;
      customPiece.querySelector('img').src=customObjectURL;
      customPiece.classList.add('has-image');
      customLoaded=true;
      drawAll();
    };
    im.src=customObjectURL;
  });

  function moveGhost(x,y){ ghost.style.left=x+'px'; ghost.style.top=y+'px'; }

  function hitTestPlaced(clientX, clientY){
    const p = clientToTray(clientX, clientY);
    let best=null, bestD=Infinity;
    for(const o of placed){
      const d=Math.hypot(o.x-p.x, o.y-p.y);
      if(d < o.size/2 + 0.02 && d < bestD){ best=o; bestD=d; }
    }
    return best;
  }

  trayWrap.addEventListener('pointerdown', e=>{
    const hit=hitTestPlaced(e.clientX, e.clientY);
    if(hit){ dragging=hit; dragFromPalette=false; e.preventDefault(); }
  });

  window.addEventListener('pointermove', e=>{
    if(!dragging) return;
    if(dragFromPalette){
      moveGhost(e.clientX, e.clientY);
    } else {
      const p=clientToTray(e.clientX, e.clientY);
      dragging.x=Math.min(1,Math.max(0,p.x));
      dragging.y=Math.min(1,Math.max(0,p.y));
      drawAll();
    }
  });

  window.addEventListener('pointerup', e=>{
    if(!dragging) return;
    if(dragFromPalette){
      if(withinTray(e.clientX, e.clientY)){
        const p=separateFromPlaced(clientToTray(e.clientX, e.clientY), dragging.size);
        dragging.x=p.x; dragging.y=p.y;
        placed.push(dragging);
      }
      ghost.style.display='none';
    } else {
      // dragging an already-placed piece — drop outside the tray removes it
      if(!withinTray(e.clientX, e.clientY)){
        placed = placed.filter(o=>o!==dragging);
      }
    }
    dragging=null; dragFromPalette=false;
    drawAll();
  });

  updateRing();
  let ready=0;
  const total=Object.keys(srcImgs).length+1;
  function onOneReady(){ ready++; if(ready>=total) resize(); }
  Object.values(srcImgs).forEach(im=>im.onload=onOneReady);
  trayImg.onload=onOneReady;
  resize();
})();
</script>
</body>
</html>
