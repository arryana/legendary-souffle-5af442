<style>
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{ height:100%; margin:0; overflow:hidden; background:#14100c; color:#e7ddc9;
    font-family:Georgia, serif; user-select:none; }
  /* the real wood/terracotta photo behind this page is light and warm throughout, so pale
     text (the shared pattern on darker-background pieces) reads too faint here — dark
     text against the light wood instead. */
  #backlink{ position:fixed; top:18px; left:22px; z-index:50; color:#000; opacity:.85;
    font-weight:700; text-decoration:none; font-size:14px; letter-spacing:.04em;
    text-shadow:0 1px 2px rgba(255,250,240,.6); transition:opacity .3s ease; }
  #backlink:hover{ opacity:1; }
  canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  #dock{ position:fixed; bottom:0; left:0; right:0; display:flex; align-items:center; justify-content:space-between;
    padding:16px 22px 26px; z-index:40; flex-wrap:wrap; gap:14px 0;
    background:linear-gradient(to top, rgba(8,7,5,.85), rgba(8,7,5,0)); }
  /* The row wants 369px laid out end to end. It never wrapped, so on anything
     narrower the LAST thing in it -- the flower, the whole object chooser --
     was simply pushed off the right edge, and with the page unable to scroll
     there was no way to reach it at all. It fitted a 390px phone by 22px, which
     is why this only shows up on a small one. Below that the two groups take a
     line each; there is nothing under the bowl but water, so the room is free. */
  @media (max-width: 379px){
    /* right-aligned, not centred: the music button is pinned in the bottom-left
       corner, and a centred second row lands straight on top of it. */
    #dock{ justify-content:flex-end; }
    .dockGroup{ flex:0 0 auto; }
  }
  .dockGroup{ display:flex; align-items:center; gap:14px; }
  .glyph{ font-size:15px; opacity:.7; }
  .divider{ width:1px; height:22px; background:rgba(231,221,201,.2); }
  input[type=range]{ -webkit-appearance:none; appearance:none; width:140px; height:3px; border-radius:3px;
    background:rgba(231,221,201,.25); outline:none; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
    background:#e9d9a8; cursor:pointer; box-shadow:0 0 8px rgba(233,217,168,.6); }
  input[type=range]::-moz-range-thumb{ width:14px; height:14px; border:none; border-radius:50%; background:#e9d9a8; cursor:pointer; }
  #dirDial{ width:32px; height:32px; border-radius:50%; border:1.5px solid rgba(231,221,201,.35);
    position:relative; cursor:grab; touch-action:none; flex:0 0 auto; }
  #dirDial:active{ cursor:grabbing; }
  #dirNeedle{ position:absolute; left:50%; top:50%; width:2px; height:13px; background:#e9d9a8;
    margin-left:-1px; margin-top:-13px; border-radius:2px; transform-origin:50% 100%;
    box-shadow:0 0 6px rgba(233,217,168,.6); pointer-events:none; }
  .pickerTrigger{ background:none; border:none; font-size:17px; opacity:.75; cursor:pointer;
    padding:2px 4px; line-height:1; color:inherit; border-radius:50%;
    transition:opacity .2s ease, background .2s ease; }
  .pickerTrigger:hover{ opacity:1; background:rgba(231,221,201,.14); }
  .pickerOverlay{ display:none; position:fixed; inset:0; z-index:60; background:rgba(8,7,5,.6);
    align-items:center; justify-content:center; }
  .pickerOverlay.open{ display:flex; }
  .pickerPopup{ background:#1c1712; border-radius:14px; padding:20px; box-shadow:0 12px 40px rgba(0,0,0,.5); }
  .pickerList{ display:grid; grid-template-columns:repeat(4,64px); gap:10px; }
  /* The popup was a fixed 326px grid. On a 240px screen it hung 43px off BOTH
     edges, so half the flowers could not be reached even once the chooser was
     open -- the fault behind the fault. Narrow screens get three slightly
     smaller tiles; above 379px nothing here applies and it is the same 4x64
     grid it always was. */
  .pickerPopup{ box-sizing:border-box; max-width:calc(100vw - 12px); }

  .pickerOption{ position:relative; width:64px; height:64px; border-radius:10px; border:2px solid transparent;
    background:#0f0d0a; padding:0; cursor:pointer; overflow:hidden; opacity:.4;
    transition:opacity .2s ease, border-color .2s ease; }
  .pickerOption.active{ opacity:1; border-color:#e8c383; }
  .pickerOption img{ width:100%; height:100%; object-fit:contain; padding:7px; box-sizing:border-box; display:block; }
  .pickerOption.bowlThumb img{ object-fit:cover; padding:0; }
  .pickerOption.objOption img{ padding-right:18px; }
  .qtyCol{ position:absolute; right:4px; top:4px; bottom:4px; width:11px;
    display:flex; flex-direction:column; align-items:center; justify-content:space-between; gap:2px; }
  .qtyDot{ width:9px; height:9px; flex:0 0 auto; border-radius:50%; padding:0; cursor:pointer;
    background:transparent; border:1.3px solid rgba(232,195,131,.65); transition:background .15s ease, border-color .15s ease; }
  .qtyDot.filled{ background:#e8c383; border-color:#e8c383; }
  .qtyClear{ width:11px; height:11px; flex:0 0 auto; border-radius:50%; padding:0; cursor:pointer;
    background:transparent; border:1.3px solid rgba(232,195,131,.65); position:relative; }
  .qtyClear::after{ content:''; position:absolute; left:1px; right:1px; top:50%; height:1.3px;
    background:rgba(232,195,131,.85); transform:translateY(-50%) rotate(-45deg); }
  /* Her ask off the machines, Aug 2026: "the menu could pop up larger on both the
     jelly star and the kindle". It was a fixed 4x64 grid that dropped to 3x60 on a
     narrow screen and never grew for a wide one -- so a Kindle showed a laptop's
     tiles with a third of the room going spare. The tile size follows the width
     it is given now. Sizes are explicit rather than fractional on purpose: a Fire
     tablet's browser is the oldest of her four and `aspect-ratio` is not a thing
     to rely on there. A desktop (1024 and up) is left exactly as it was. */
  @media (max-width: 379px){
    .pickerPopup{ padding:8px; }
    .pickerList{ grid-template-columns:repeat(3, 66px); gap:6px; }
    .pickerOption{ width:66px; height:66px; }
  }
  @media (min-width: 380px) and (max-width: 519px){
    .pickerList{ grid-template-columns:repeat(4, 72px); gap:12px; }
    .pickerOption{ width:72px; height:72px; }
  }
  @media (min-width: 520px) and (max-width: 1023px){
    .pickerList{ grid-template-columns:repeat(4, 92px); gap:12px; }
    .pickerOption{ width:92px; height:92px; }
  }
  /* and nothing is ever out of reach on a short screen */
  .pickerPopup{ max-height:calc(100vh - 20px); overflow-y:auto; }
</style>

<div id="music" title="play your own music">
  <button id="musicBtn" aria-label="play your own music">🎧</button>
  <span id="musicName"></span>
</div>
<input type="file" id="musicPick" accept="audio/*" multiple hidden>
<audio id="musicEl"></audio>
<script>
(function(){
  const pick=document.getElementById('musicPick'), el=document.getElementById('musicEl'),
        btn=document.getElementById('musicBtn'), name=document.getElementById('musicName');
  let list=[], idx=0;
  const label=f=> f ? f.name.replace(/\.[^.]+$/,'') : '';
  function load(i){ if(el.src) URL.revokeObjectURL(el.src); el.src=URL.createObjectURL(list[i]); name.textContent=label(list[i]); }
  function sync(){ btn.textContent = !el.src ? '🎧' : (el.paused ? '▶' : '❚❚'); btn.classList.toggle('playing', !!el.src && !el.paused); }
  btn.addEventListener('click', ()=>{ if(!list.length){ pick.click(); return; } el.paused ? el.play() : el.pause(); });
  name.addEventListener('click', ()=> pick.click());
  pick.addEventListener('change', ()=>{ if(!pick.files.length) return; list=[...pick.files]; idx=0; el.loop=(list.length===1); load(0); el.play(); });
  el.addEventListener('ended', ()=>{ if(list.length>1){ idx=(idx+1)%list.length; load(idx); el.play(); } });
  el.addEventListener('play', sync); el.addEventListener('pause', sync); el.addEventListener('loadeddata', sync);
  sync();
})();
</script>
<canvas id="scene"></canvas>
<div id="dock">
  <div class="dockGroup">
    <span class="glyph" aria-hidden="true">🌊</span>
    <input type="range" id="speedSlider" min="0" max="100" value="20" aria-label="speed">
  </div>
  <div class="dockGroup">
    <button id="bowlTrigger" class="pickerTrigger" aria-label="choose the bowl">🥣</button>
    <div class="divider"></div>
    <div id="dirDial" aria-label="direction" role="slider" tabindex="0"><div id="dirNeedle"></div></div>
    <div class="divider"></div>
    <button id="objTrigger" class="pickerTrigger" aria-label="choose what's floating">🌸</button>
  </div>
</div>
<div id="bowlOverlay" class="pickerOverlay"><div class="pickerPopup"><div id="bowlList" class="pickerList"></div></div></div>
<div id="objOverlay" class="pickerOverlay"><div class="pickerPopup"><div id="objList" class="pickerList"></div></div></div>
<script>
(function(){
  const canvas=document.getElementById('scene'), ctx=canvas.getContext('2d');
  const speedSlider=document.getElementById('speedSlider');
  const dirDial=document.getElementById('dirDial'), dirNeedle=document.getElementById('dirNeedle');
  let W=0,H=0,DPR=1, cx=0, cy=0, waterR=0;
  let speedAmt=speedSlider.value/100;
  speedSlider.addEventListener('input', ()=>{ speedAmt=speedSlider.value/100; });

  // ---------- direction dial: drag to set the wind/current heading ----------
  let dirAngle=-Math.PI*0.65;
  function updateNeedle(){ dirNeedle.style.transform=`rotate(${dirAngle*180/Math.PI+90}deg)`; }
  function setDirFromPointer(e){
    const rect=dirDial.getBoundingClientRect();
    dirAngle=Math.atan2(e.clientY-(rect.top+rect.height/2), e.clientX-(rect.left+rect.width/2));
    updateNeedle();
  }
  let dragging=false;
  dirDial.addEventListener('pointerdown', e=>{ dragging=true; dirDial.setPointerCapture(e.pointerId); setDirFromPointer(e); });
  dirDial.addEventListener('pointermove', e=>{ if(dragging) setDirFromPointer(e); });
  dirDial.addEventListener('pointerup', ()=>{ dragging=false; });
  dirDial.addEventListener('pointercancel', ()=>{ dragging=false; });
  updateNeedle();

  // ---------- image loading ----------
  function loadImg(src){
    return new Promise(res=>{ const im=new Image(); im.onload=()=>res(im); im.src=src; });
  }

  // ---------- bowl: a real top-down photograph, "cover"-fit into the frame ----------
  // each bowl's water circle was measured by hand against its source photo
  // (1408x768) — center and interior radius vary slightly bowl to bowl since the
  // photos aren't all framed identically.
  const PHOTO_W=1408, PHOTO_H=768;
  const BOWLS = [
    {id:'terracotta', img:'bowl-terracotta.png', cx:707, cy:377, waterR:278},
    {id:'travertine', img:'bowl-travertine.png', cx:701, cy:371, waterR:288},
    {id:'slate',      img:'bowl-slate.png',      cx:703, cy:373, waterR:252},
    {id:'teak',       img:'bowl-teak.png',       cx:705, cy:379, waterR:282},
    {id:'riverstone', img:'bowl-riverstone.png', cx:698, cy:358, waterR:219},
    {id:'silver',     img:'bowl-silver.png',     cx:700, cy:380, waterR:277},
    {id:'stone',      img:'bowl-greystone.png',  cx:701, cy:377, waterR:282},
    {id:'copper',     img:'bowl-copper.png',     cx:700, cy:376, waterR:269},
    {id:'glazed',     img:'bowl-glazed.png',     cx:703, cy:381, waterR:269},
    {id:'porcelain',  img:'bowl-porcelain.png',  cx:703, cy:376, waterR:280},
  ];
  let bowlImgs={}, currentBowl=BOWLS[0], bowlLayer=null;
  const bowlThumbs={};          // the picker's <img> per bowl, filled in as each arrives
  let wantedBowl=null;          // one asked for before its photograph had landed

  /* The other nine come in behind the piece, ONE AT A TIME rather than ten at
     once: a phone that struggles with 15MB struggles more with 15MB in parallel,
     and the piece is already running and wants the frame time. By the time anyone
     has found the picker they are generally all here; if one is not, asking for it
     fetches it and it arrives when it arrives. */
  function preloadOtherBowls(){
    const rest=BOWLS.filter(b=>!bowlImgs[b.id]);
    let i=0;
    const next=()=>{
      if(i>=rest.length) return;
      const b=rest[i++];
      loadImg(b.img).then(im=>{
        bowlImgs[b.id]=im;
        showThumb(b);
        if(wantedBowl===b.id) applyBowl(b);
        next();
      });
    };
    if(window.requestIdleCallback) requestIdleCallback(()=>next(),{timeout:2500});
    else setTimeout(next,1200);
  }
  // a thumbnail's src is set only once its photograph is in the cache, or the
  // picker would pull all ten full-size files at startup on its own account
  function showThumb(b){ const el=bowlThumbs[b.id]; if(el && !el.getAttribute('src')) el.src=b.img; }

  function buildBowl(){
    if(!bowlImgs[currentBowl.id]) return;
    bowlLayer=document.createElement('canvas'); bowlLayer.width=W; bowlLayer.height=H;
    const bc=bowlLayer.getContext('2d');
    const scale=Math.max(W/PHOTO_W, H/PHOTO_H);
    const dw=PHOTO_W*scale, dh=PHOTO_H*scale;
    const ox=(W-dw)/2, oy=(H-dh)/2;
    bc.drawImage(bowlImgs[currentBowl.id], ox, oy, dw, dh);
    cx=ox+currentBowl.cx*scale; cy=oy+currentBowl.cy*scale; waterR=currentBowl.waterR*scale;
  }
  function applyBowl(b){
    currentBowl=b; wantedBowl=null;
    buildBowl();
    seedObjects();
    seedSheen();
    sinkers=[];
  }
  function setBowl(id){
    const b=BOWLS.find(b=>b.id===id);
    if(!b || b===currentBowl) return;
    if(!bowlImgs[b.id]){
      // asked for before its photograph landed: fetch it now and take it the
      // moment it does, rather than swapping to an empty bowl
      wantedBowl=b.id;
      loadImg(b.img).then(im=>{ bowlImgs[b.id]=im; showThumb(b); if(wantedBowl===b.id) applyBowl(b); });
      return;
    }
    applyBowl(b);
  }

  // ---------- bowl picker ----------
  const bowlTrigger=document.getElementById('bowlTrigger'), bowlOverlay=document.getElementById('bowlOverlay');
  const bowlList=document.getElementById('bowlList');
  function buildBowlOverlay(){
    bowlList.innerHTML='';
    BOWLS.forEach(b=>{
      const btn=document.createElement('button');
      btn.type='button'; btn.className='pickerOption bowlThumb'+(b===currentBowl?' active':'');
      btn.setAttribute('aria-label', b.id);
      const img=document.createElement('img'); img.alt=''; img.decoding='async';
      bowlThumbs[b.id]=img;
      if(bowlImgs[b.id]) img.src=b.img;      // in the cache already: no new request
      btn.appendChild(img);
      btn.addEventListener('click', ()=>{
        setBowl(b.id);
        bowlList.querySelectorAll('.pickerOption').forEach(el=>el.classList.remove('active'));
        btn.classList.add('active');
      });
      bowlList.appendChild(btn);
    });
  }
  bowlTrigger.addEventListener('click', ()=>bowlOverlay.classList.add('open'));
  bowlOverlay.addEventListener('click', e=>{ if(e.target===bowlOverlay) bowlOverlay.classList.remove('open'); });

  // ---------- flow field: correlated, slowly time-varying curl noise, plus a
  // steady directional bias from the direction dial — real wind is a prevailing
  // heading with turbulence riding on top of it, not pure swirl ----------
  function psi(x,y,t){
    return Math.sin(x*0.0065 + t*0.16) * Math.cos(y*0.0055 - t*0.11)
         + 0.5*Math.sin(x*0.015 - t*0.09 + 1.7) * Math.cos(y*0.017 + t*0.12);
  }
  const BIAS_MAG=0.028;
  function flowAt(x,y,t){
    const e=2.4;
    const vx=(psi(x,y+e,t)-psi(x,y-e,t))/(2*e) + Math.cos(dirAngle)*BIAS_MAG;
    const vy=-(psi(x+e,y,t)-psi(x-e,y,t))/(2*e) + Math.sin(dirAngle)*BIAS_MAG;
    return { vx, vy };
  }
  function curlAt(x,y,t){
    const e=2.4;
    const fL=flowAt(x-e,y,t), fR=flowAt(x+e,y,t), fD=flowAt(x,y-e,t), fU=flowAt(x,y+e,t);
    return ((fR.vy-fL.vy)-(fU.vx-fD.vx))/(2*e);
  }

  // ---------- floating objects ----------
  // each references a real cut-out photograph. "refLong" is the object's on-screen
  // long-edge size at a baseline water radius of 278px (the photo's own native scale);
  // actual display size scales with the bowl's current on-screen size. Sized so a
  // rose reads as roughly a quarter of the bowl, other blooms and leaves scaled to
  // feel true to their real relative sizes. "weight" resists the current a little —
  // a heavier bloom drifts less eagerly than a light petal. "count" is the default
  // selection — a curated handful to start, with the rest available (and any of them
  // repeatable) in the picker rather than everything crowding the bowl at once.
  const KIND_MAX=4;
  const KINDS = [
    {id:'camellia', img:'bowl-camellia.png', refLong:230, weight:1.05, count:1},
    {id:'rose',     img:'bowl-rose.png',     refLong:260, weight:1.15, count:1},
    {id:'ginkgo',   img:'bowl-ginkgo.png',   refLong:150, weight:0.85, count:1},
    {id:'oakleaf',  img:'bowl-oakleaf.png',  refLong:130, weight:0.85, count:1},
    {id:'fern',     img:'bowl-fern.png',     refLong:170, weight:0.75, count:1},
    {id:'petal',    img:'bowl-petal.png',    refLong:110, weight:0.9,  count:1},
    {id:'smallpetal',   img:'bowl-smallpetal.png',   refLong:70,  weight:0.95, count:0},
    {id:'feather',      img:'bowl-feather.png',      refLong:190, weight:0.6,  count:0},
    {id:'lavender',     img:'bowl-lavender.png',     refLong:170, weight:0.8,  count:0},
    {id:'elderberries', img:'bowl-elderberries.png', refLong:190, weight:0.9,  count:0},
    {id:'moss',         img:'bowl-moss.png',         refLong:200, weight:1.3,  count:0},
  ];
  let kindImgs={};
  let objs=[];
  function makeObj(k,i,total){
    const im=kindImgs[k.id];
    const scale=waterR/278;
    const long=Math.max(im.naturalWidth, im.naturalHeight);
    const dispScale=(k.refLong*scale)/long;
    const dispW=im.naturalWidth*dispScale, dispH=im.naturalHeight*dispScale;
    const ang=(i/Math.max(1,total))*Math.PI*2 + i*0.7;
    const rad=waterR*(0.15+0.25*((i*37)%5)/5);
    return { id:k.id, img:im, dispW, dispH, r:Math.max(dispW,dispH)*0.42, weight:k.weight,
      x:cx+Math.cos(ang)*rad, y:cy+Math.sin(ang)*rad,
      vx:0, vy:0, angle:Math.random()*Math.PI*2, angVel:0,
      phase:Math.random()*100 };
  }
  function seedObjects(){
    objs=[];
    const total=KINDS.reduce((s,k)=>s+k.count,0);
    let i=0;
    KINDS.forEach(k=>{ for(let n=0;n<k.count;n++){ objs.push(makeObj(k,i,total)); i++; } });
  }
  function setKindCount(id,count){
    const k=KINDS.find(k=>k.id===id);
    if(!k) return;
    count=Math.max(0,Math.min(KIND_MAX,count));
    if(k.count===count) return;
    if(count>k.count){
      for(let n=k.count;n<count;n++) objs.push(makeObj(k,objs.length,objs.length+1));
    } else {
      let toRemove=k.count-count;
      for(let i=objs.length-1;i>=0 && toRemove>0;i--){ if(objs[i].id===id){ objs.splice(i,1); toRemove--; } }
    }
    k.count=count;
  }

  // ---------- picker overlay: choose which objects are in the bowl ----------
  const objTrigger=document.getElementById('objTrigger'), objOverlay=document.getElementById('objOverlay');
  const objList=document.getElementById('objList');
  function buildObjOverlay(){
    objList.innerHTML='';
    KINDS.forEach(k=>{
      const tile=document.createElement('div');
      tile.className='pickerOption objOption'+(k.count>0?' active':'');
      const img=document.createElement('img'); img.src=k.img; img.alt=k.id;
      tile.appendChild(img);

      const col=document.createElement('div'); col.className='qtyCol';

      const clearBtn=document.createElement('button');
      clearBtn.type='button'; clearBtn.className='qtyClear';
      clearBtn.setAttribute('aria-label', k.id+' — remove from bowl');
      clearBtn.addEventListener('click', ()=>{
        setKindCount(k.id,0);
        tile.classList.remove('active');
        col.querySelectorAll('.qtyDot').forEach(d=>d.classList.remove('filled'));
      });
      col.appendChild(clearBtn);

      // top-to-bottom: 4, 3, 2, 1 — so the dots fill from the bottom up, like a level
      for(let n=KIND_MAX;n>=1;n--){
        const dot=document.createElement('button');
        dot.type='button'; dot.className='qtyDot'+(k.count>=n?' filled':'');
        dot.setAttribute('aria-label', k.id+' — set to '+n);
        dot.addEventListener('click', ()=>{
          setKindCount(k.id,n);
          tile.classList.toggle('active',n>0);
          col.querySelectorAll('.qtyDot').forEach((d,i)=>d.classList.toggle('filled', (KIND_MAX-i)<=n));
        });
        col.appendChild(dot);
      }
      tile.appendChild(col);
      objList.appendChild(tile);
    });
  }
  objTrigger.addEventListener('click', ()=>objOverlay.classList.add('open'));
  objOverlay.addEventListener('click', e=>{ if(e.target===objOverlay) objOverlay.classList.remove('open'); });

  const FLOW_SCALE=3200, BASE_JITTER=90, CONTAIN_K=140, ROT_SCALE=420, DAMPING=0.9, BUMP_SPIN_K=0.026;

  function stepObjects(dt,t){
    for(const o of objs){
      const f=flowAt(o.x,o.y,t);
      const resp=1/o.weight;
      let ax=f.vx*FLOW_SCALE*speedAmt*resp;
      let ay=f.vy*FLOW_SCALE*speedAmt*resp;
      // the faintest natural drift, present even with speed at zero — gated by a
      // slow, mostly-shared envelope (quartic, so it lingers near zero far longer
      // than it's up) rather than each object's own independent random phase.
      // Independent phases meant some object was always mid-jitter somewhere in
      // the bowl, so the water as a whole never actually looked calm even though
      // any single object did, briefly, on its own clock — sharing one envelope
      // (with only a small per-object offset, like a breeze catching each petal a
      // moment apart rather than each on its own private schedule) lets the whole
      // bowl visibly rest at once.
      const idleEnvelope = Math.pow(Math.max(0, Math.sin(t*0.055 + o.phase*0.12)), 4);
      const jitter = BASE_JITTER*0.22*idleEnvelope;
      ax += Math.sin(t*0.55+o.phase)*jitter*resp;
      ay += Math.cos(t*0.47+o.phase*1.3)*jitter*resp;

      // stay within the water — soft containment near the inner wall
      const dx=o.x-cx, dy=o.y-cy, dist=Math.hypot(dx,dy)||0.001;
      const maxR=Math.max(waterR*0.35, waterR-o.r-4);
      const edge=maxR*0.78;
      if(dist>edge){
        const p=Math.min(1,(dist-edge)/Math.max(1,maxR-edge));
        ax -= (dx/dist)*p*p*CONTAIN_K;
        ay -= (dy/dist)*p*p*CONTAIN_K;
      }

      o.vx=o.vx*DAMPING+ax*dt; o.vy=o.vy*DAMPING+ay*dt;
      o.x+=o.vx*dt; o.y+=o.vy*dt;

      const curl=curlAt(o.x,o.y,t);
      o.angVel = o.angVel*0.9 + curl*speedAmt*ROT_SCALE*resp*dt;
      // same shared envelope as the positional jitter above — otherwise an object
      // can sit dead still in place and yet visibly keep turning forever, which
      // reads as "never quite still" just as much as drifting does
      o.angle += o.angVel*dt + Math.sin(t*0.3+o.phase)*0.02*idleEnvelope*dt;
    }
    resolveOverlaps();
    for(const o of objs){
      // hard clamp — the overlap solver above can nudge an object toward the rim;
      // never let it actually cross into the bowl wall
      const dx=o.x-cx, dy=o.y-cy, dist=Math.hypot(dx,dy)||0.001;
      const maxR=Math.max(waterR*0.2, waterR-o.r-4);
      if(dist>maxR){ o.x=cx+dx/dist*maxR; o.y=cy+dy/dist*maxR; }
    }
  }

  // objects never overlap — resolved as a direct position correction (not a force),
  // so it holds regardless of how hard the current is pushing them together. A bump
  // hands out a spin to both objects, scaled by how much wind/current is behind it —
  // dead calm, a bump barely turns them; strong current, they spin off each other.
  function resolveOverlaps(){
    for(let iter=0; iter<3; iter++){
      for(let i=0;i<objs.length;i++){
        for(let j=i+1;j<objs.length;j++){
          const a=objs[i], b=objs[j];
          const dx=b.x-a.x, dy=b.y-a.y;
          const d=Math.hypot(dx,dy)||0.001;
          const minD=a.r+b.r+3;
          if(d>=minD) continue;
          const overlap=minD-d;
          const nx=dx/d, ny=dy/d;
          const totalInvW=1/a.weight+1/b.weight;
          const pushA=overlap*(1/a.weight)/totalInvW, pushB=overlap*(1/b.weight)/totalInvW;
          a.x-=nx*pushA; a.y-=ny*pushA;
          b.x+=nx*pushB; b.y+=ny*pushB;

          const tx=-ny, ty=nx;
          const relTangent=(b.vx-a.vx)*tx+(b.vy-a.vy)*ty;
          const spin=(relTangent<0?-1:1)*Math.min(1,overlap*0.08)*speedAmt*BUMP_SPIN_K;
          a.angVel -= spin*(1/a.weight)/totalInvW;
          b.angVel += spin*(1/b.weight)/totalInvW;
        }
      }
    }
  }

  // ---------- water sheen: light catching the moving surface, advected by the
  // same flow field driving the objects — this is what actually reads as "the
  // water itself is moving," not just things sitting on top of it ----------
  const SHEEN_N=18;
  let sheen=[];
  function respawnSheen(s){
    const ang=Math.random()*Math.PI*2, rad=Math.sqrt(Math.random())*waterR*0.88;
    s.x=cx+Math.cos(ang)*rad; s.y=cy+Math.sin(ang)*rad;
    s.vx=0; s.vy=0; s.life=0; s.maxLife=2.2+Math.random()*2.6;
  }
  function seedSheen(){
    sheen=Array.from({length:SHEEN_N},()=>({x:0,y:0,vx:0,vy:0,life:0,maxLife:1}));
    for(const s of sheen) respawnSheen(s);
  }
  function stepSheen(dt,t){
    for(const s of sheen){
      const f=flowAt(s.x,s.y,t);
      s.vx=f.vx*FLOW_SCALE*speedAmt*0.85; s.vy=f.vy*FLOW_SCALE*speedAmt*0.85;
      s.x+=s.vx*dt; s.y+=s.vy*dt; s.life+=dt;
      const d=Math.hypot(s.x-cx,s.y-cy);
      if(d>waterR*0.94 || s.life>s.maxLife) respawnSheen(s);
    }
  }
  function drawSheen(){
    ctx.save();
    ctx.beginPath(); ctx.arc(cx,cy,waterR*0.97,0,7); ctx.clip();
    ctx.globalCompositeOperation='lighter';
    for(const s of sheen){
      const spd=Math.hypot(s.vx,s.vy);
      const ang=Math.atan2(s.vy,s.vx||0.0001);
      const len=Math.min(34, 8+spd*0.4);
      const lifeFrac=Math.min(1,s.life/s.maxLife);
      const fade=Math.sin(lifeFrac*Math.PI);
      const alpha=(0.05+speedAmt*0.24)*fade;
      if(alpha<0.006) continue;
      ctx.save();
      ctx.translate(s.x,s.y); ctx.rotate(ang);
      const g=ctx.createLinearGradient(-len/2,0,len/2,0);
      g.addColorStop(0,'rgba(255,250,225,0)'); g.addColorStop(0.5,`rgba(255,250,225,${alpha})`); g.addColorStop(1,'rgba(255,250,225,0)');
      ctx.strokeStyle=g; ctx.lineWidth=1.8; ctx.beginPath(); ctx.moveTo(-len/2,0); ctx.lineTo(len/2,0); ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  }

  // ---------- sinking stones: unlike the floating objects, a real stone is too
  // heavy for surface tension to hold — tap the water and it drops straight
  // through, darkening, blurring and cooling in colour as it sinks, then rests
  // on the bottom for good, unmoved by the current from here on ----------
  const STONE_REF_LONG=95, SINK_DURATION=1.7, SPLASH_DURATION=0.6, MAX_STONES=10;
  let stoneImg=null, sinkers=[];
  function dropStone(x,y){
    if(!stoneImg || waterR<=0) return;
    if(Math.hypot(x-cx,y-cy) > waterR*0.92) return;
    const scale=waterR/278;
    const long=Math.max(stoneImg.naturalWidth, stoneImg.naturalHeight);
    const dispScale=(STONE_REF_LONG*scale)/long;
    sinkers.push({
      img:stoneImg, x, y, angle:Math.random()*Math.PI*2,
      dispW:stoneImg.naturalWidth*dispScale, dispH:stoneImg.naturalHeight*dispScale,
      spawnT: performance.now()*0.001,
    });
    if(sinkers.length>MAX_STONES) sinkers.shift();
  }
  // settled stones can be picked up and moved; dragging one takes priority
  // over dropping a new one when the pointer starts on top of it.
  //
  // And a TAP takes one out again. Her question off the machines -- "how are the
  // stones removed? a second click on them?" -- and then her answer: yes. A stone
  // dropped in could not come out at all before; the only thing that ever removed
  // one was the tenth pushing the first off the end. Tap to lift out, drag to
  // move: two gestures that cannot be confused for one another, and neither needs
  // explaining. The water is left rocking where it was, because a stone taken out
  // of water disturbs it exactly as much as one put in.
  let draggingStone=null, dragDX=0, dragDY=0;
  const ripples=[];
  let tapStone=null, tapX=0, tapY=0, tapMoved=false;
  function hitTestSinker(x,y){
    for(let i=sinkers.length-1;i>=0;i--){
      const s=sinkers[i];
      const hitR=Math.max(s.dispW,s.dispH)*0.46;
      if(Math.hypot(x-s.x,y-s.y)<=hitR) return s;
    }
    return null;
  }
  canvas.addEventListener('pointerdown', e=>{
    const rect=canvas.getBoundingClientRect();
    const x=e.clientX-rect.left, y=e.clientY-rect.top;
    const hit=hitTestSinker(x,y);
    if(hit){
      draggingStone=hit; dragDX=hit.x-x; dragDY=hit.y-y;
      tapStone=hit; tapX=x; tapY=y; tapMoved=false;
      canvas.setPointerCapture(e.pointerId);
      return;
    }
    dropStone(x,y);
  });
  canvas.addEventListener('pointermove', e=>{
    if(!draggingStone) return;
    const rect=canvas.getBoundingClientRect();
    // a hand is never perfectly still, so a few pixels is still a tap
    if(tapStone && Math.hypot(e.clientX-rect.left-tapX, e.clientY-rect.top-tapY) > 6) tapMoved=true;
    let x=e.clientX-rect.left+dragDX, y=e.clientY-rect.top+dragDY;
    const dx=x-cx, dy=y-cy, d=Math.hypot(dx,dy)||0.001, maxR=waterR*0.92;
    if(d>maxR){ x=cx+dx/d*maxR; y=cy+dy/d*maxR; }
    draggingStone.x=x; draggingStone.y=y;
  });
  canvas.addEventListener('pointerup', e=>{
    if(tapStone && !tapMoved){
      const i=sinkers.indexOf(tapStone);
      if(i>=0){
        sinkers.splice(i,1);
        ripples.push({ x:tapStone.x, y:tapStone.y, dispW:tapStone.dispW,
                       spawnT: performance.now()*0.001 });
      }
    }
    tapStone=null; draggingStone=null;
  });
  canvas.addEventListener('pointercancel', ()=>{ tapStone=null; draggingStone=null; });
  function drawSplash(s,t){
    const age=t-s.spawnT;
    if(age>SPLASH_DURATION || age<0) return;
    const p=age/SPLASH_DURATION;
    const r=6+p*s.dispW*0.9;
    ctx.save();
    ctx.strokeStyle=`rgba(255,250,235,${((1-p)*0.5).toFixed(2)})`;
    ctx.lineWidth=2*(1-p)+0.5;
    ctx.beginPath(); ctx.arc(s.x,s.y,r,0,7); ctx.stroke();
    ctx.restore();
  }
  const sinkerBuf=document.createElement('canvas'), sinkerBufCtx=sinkerBuf.getContext('2d');
  function drawSinker(s,t){
    const age=Math.max(0,t-s.spawnT);
    const p=Math.min(1,age/SINK_DURATION);
    const ease=1-Math.pow(1-p,3);
    const w=s.dispW*(1-0.28*ease), h=s.dispH*(1-0.28*ease);
    const blur=1.5*ease, bright=(1-0.3*ease).toFixed(2);
    // compositing the tint with source-atop only clips to what's already opaque
    // *on this buffer* — done straight on the main canvas that's the whole bowl
    // photo underneath, so it painted a full rectangle instead of just the stone.
    // Building it on a small transparent buffer first keeps the clip honest.
    const pad=Math.ceil(blur*3)+4;
    const bw=Math.max(1,Math.ceil(w+pad*2)), bh=Math.max(1,Math.ceil(h+pad*2));
    sinkerBuf.width=bw; sinkerBuf.height=bh;
    sinkerBufCtx.clearRect(0,0,bw,bh);
    sinkerBufCtx.filter=`blur(${blur.toFixed(2)}px) brightness(${bright})`;
    sinkerBufCtx.drawImage(s.img,pad,pad,w,h);
    sinkerBufCtx.filter='none';
    sinkerBufCtx.globalCompositeOperation='source-atop';
    sinkerBufCtx.fillStyle=`rgba(40,90,95,${(0.26*ease).toFixed(2)})`;
    sinkerBufCtx.fillRect(0,0,bw,bh);
    // a soft oval vignette, cut in with destination-in, guarantees a clean organic
    // edge no matter what the underlying photo's actual silhouette looks like —
    // no straight edges or corners can survive this regardless of rotation
    sinkerBufCtx.globalCompositeOperation='destination-in';
    const vg=sinkerBufCtx.createRadialGradient(bw/2,bh/2,0,bw/2,bh/2,Math.max(bw,bh)/2);
    vg.addColorStop(0,'rgba(0,0,0,1)'); vg.addColorStop(0.72,'rgba(0,0,0,1)'); vg.addColorStop(1,'rgba(0,0,0,0)');
    sinkerBufCtx.fillStyle=vg;
    sinkerBufCtx.fillRect(0,0,bw,bh);
    sinkerBufCtx.globalCompositeOperation='source-over';

    ctx.save();
    ctx.translate(s.x,s.y); ctx.rotate(s.angle);
    ctx.drawImage(sinkerBuf,-bw/2,-bh/2);
    ctx.restore();
  }

  // ---------- object rendering ----------
  function drawShadow(r){
    const g=ctx.createRadialGradient(0,0,0,0,0,r*1.3);
    g.addColorStop(0,'rgba(0,0,0,0.28)'); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,r*1.3,0,7); ctx.fill();
  }
  function drawObj(o){
    ctx.save();
    ctx.translate(o.x,o.y+o.r*0.08);
    drawShadow(o.r);
    ctx.restore();
    ctx.save();
    ctx.translate(o.x,o.y);
    ctx.rotate(o.angle);
    ctx.drawImage(o.img, -o.dispW/2, -o.dispH/2, o.dispW, o.dispH);
    ctx.restore();
  }

  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth; H=window.innerHeight;
    canvas.width=W*DPR; canvas.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
    buildBowl();
    seedObjects();
    seedSheen();
  }

  let last=performance.now();
  function tick(now){
    const dt=Math.min(now-last,50)/1000; last=now; const t=now*0.001;
    stepSheen(dt,t);
    stepObjects(dt,t);

    ctx.clearRect(0,0,W,H);
    ctx.drawImage(bowlLayer,0,0,W,H);
    for(const s of sinkers) drawSinker(s,t);
    drawSheen();
    for(const s of sinkers) drawSplash(s,t);
    for(let i=ripples.length-1;i>=0;i--){
      if(t-ripples[i].spawnT > SPLASH_DURATION) ripples.splice(i,1);
      else drawSplash(ripples[i], t);
    }
    for(const o of objs) drawObj(o);

    requestAnimationFrame(tick);
  }

  /* ---------- what has to be here before anything can be seen ----------
     The ten bowl photographs are 1408x768 and about 1.5MB apiece -- 15.7MB of
     them -- and NOTHING was drawn until every one had arrived, because the first
     resize() and the first frame were both behind one Promise.all over the lot.
     Measured on a 3in phone (CPU six times slower, 1.6Mbps): the bowl had still
     not appeared after 100 seconds and 21.5MB, which from the hand holding it is
     simply "it does not load". The picker made it worse -- it built ten <img>
     thumbnails pointing at the same full-size photographs.
     Only the bowl actually on screen is needed to start. The other nine are what
     the picker is for, and they come in behind the piece once it is running. */
  Promise.all([
    loadImg(currentBowl.img),
    loadImg('bowl-stone.png'),
    ...KINDS.map(k=>loadImg(k.img)),
  ]).then(imgs=>{
    bowlImgs[currentBowl.id]=imgs[0];
    stoneImg=imgs[1];
    KINDS.forEach((k,i)=>{ kindImgs[k.id]=imgs[2+i]; });
    buildObjOverlay();
    buildBowlOverlay();
    window.addEventListener('resize',resize);
    resize();
    requestAnimationFrame(tick);
    preloadOtherBowls();
  });
})();
</script>

<script>
(function(){
  var disc=document.getElementById('shelfdisc'), box=document.getElementById('plates');
  var rows=[].slice.call(box.querySelectorAll('.row'));
  function unroll(){ rows.forEach(function(r){ r.classList.remove('rolled'); }); }
  function shut(){ box.classList.remove('open'); disc.setAttribute('aria-expanded','false'); unroll(); }

  /* The twenty cards behind these plates are 6.2MB and not one of them can be
     seen until a plate is opened, but every page on the site was fetching the lot
     on load, ahead of the piece's own assets. Measured on bowl at 240px with a
     slow phone's CPU and connection, the bowl had still not appeared after 100
     seconds; held back, it is there in 12.
     They are held behind data-src rather than left to loading="lazy" alone,
     because that is a heuristic and not a promise -- the same page deferred them
     on a throttled connection and fetched all twenty on a fast one, since the
     browser's idea of "near the viewport" widens with bandwidth. This is the same
     on every machine. The attribute stays as a second line for anything that
     scrolls them into view another way. */
  var wired=false;
  function fetchCards(){
    if(wired) return; wired=true;
    [].slice.call(box.querySelectorAll('img[data-src]')).forEach(function(im){
      im.src=im.getAttribute('data-src'); im.removeAttribute('data-src');
    });
  }

  disc.addEventListener('click', function(ev){
    ev.stopPropagation();
    var open=box.classList.toggle('open');
    if(open) fetchCards();
    disc.setAttribute('aria-expanded', open?'true':'false');
    if(!open) unroll();
  });

  // Same bargain the case itself strikes: a mouse can hover, so a plate is a link
  // straight to its shelf. A thumb cannot, so the first tap on a plate rolls its
  // pieces out and only the second one goes to the shelf.
  var FINE=matchMedia('(hover: hover) and (pointer: fine)');
  rows.forEach(function(row){
    row.querySelector('.tag').addEventListener('click', function(ev){
      if(FINE.matches) return;
      if(row.classList.contains('rolled')) return;
      ev.preventDefault();
      unroll(); row.classList.add('rolled');
    });
  });

  document.addEventListener('click', function(ev){
    if(!box.contains(ev.target) && ev.target!==disc) shut();
  });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') shut(); });
})();
</script>

  /* GENERATED by tools/touch-targets.js -- do not hand-edit between the markers.
     A 3px-tall slider is a mouse dimension: a mouse is pixel-precise, a thumb is
     about 9mm across and covers the whole track the moment it lands on it. These
     rules grow the BODY that catches a thumb without moving the painted line by a
     pixel -- the padding grows the box, background-clip keeps the paint in the
     content strip, and the matching negative margin gives back the space so
     nothing on the page shifts. Each slider grows only as far as half the gap to
     its nearest neighbour, so no two ever overlap and steal each other's taps. */
  @media (pointer: coarse){

     A 14px tickbox is a mouse dimension, the same way a 3px slider is: a thumb is

     the space is handed straight back, so nothing on the page moves. Each reaches
     only half the gap to its nearest neighbour, so no two can overlap and steal
     each other's taps. Every rule here was screenshotted against the page's own
     rendering and kept only because it came back pixel-identical. */
  @media (pointer: coarse){
    #objTrigger{ position:relative; }
    #objTrigger::after{ content:''; position:absolute; top:-11px; right:-7px; bottom:-11px; left:-7px; }

<script>
/* GENERATED by tools/slider-click.py -- do not hand-edit between the markers.
   A click on a slider's track moves it, in every browser. Safari on macOS does
   not do this natively; Chrome and Firefox do, and there it computes the same
   value, so nothing changes. Capture phase, so a piece that stops propagation on
   its own sliders still gets it. */
addEventListener('pointerdown', function(e){
  var el = e.target;
  if(!el || el.tagName !== 'INPUT' || el.type !== 'range' || el.disabled) return;
  var r = el.getBoundingClientRect();
  if(!r.width) return;
  var min = parseFloat(el.min); if(isNaN(min)) min = 0;
  var max = parseFloat(el.max); if(isNaN(max)) max = 100;
  var step = parseFloat(el.step); if(!(step > 0)) step = 1;
  var frac = (e.clientX - r.left) / r.width;
  frac = frac < 0 ? 0 : frac > 1 ? 1 : frac;
  var v = min + frac * (max - min);
  v = Math.round((v - min) / step) * step + min;
  v = v < min ? min : v > max ? max : v;
  if (String(v) === String(el.value)) return;
  el.value = v;
  el.dispatchEvent(new Event('input',  { bubbles: true }));
  el.dispatchEvent(new Event('change', { bubbles: true }));
}, true);
</script>
