(function(){
  const pick=document.getElementById('musicPick'), el=document.getElementById('musicEl'),
        btn=document.getElementById('musicBtn'), name=document.getElementById('musicName');
  let list=[], idx=0;
  const label=f=> f ? f.name.replace(/\.[^.]+$/,'') : '';
  function load(i){ if(el.src) URL.revokeObjectURL(el.src); el.src=URL.createObjectURL(list[i]); name.textContent=label(list[i]); }
  function sync(){ btn.textContent = !el.src ? '🎧' : (el.paused ? '▶' : '❚❚'); btn.classList.toggle('playing', !!el.src && !el.paused); }
  btn.addEventListener('click', ()=>{ if(!list.length){ pick.click(); return; } el.paused ? el.play() : el.pause(); });
  name.addEventListener('click', ()=> pick.click());
  pick.addEventListener('change', ()=>{ if(!pick.files.length) return; list=[...pick.files]; idx=0; el.loop=(list.length===1); load(0); el.play(); });
  el.addEventListener('ended', ()=>{ if(list.length>1){ idx=(idx+1)%list.length; load(idx); el.play(); } });
  el.addEventListener('play', sync); el.addEventListener('pause', sync); el.addEventListener('loadeddata', sync);
  sync();
})();
</script>

<script>
(function(){
// =============================================================================
// A bulb, and moths losing their bearings on it.
//
// The mechanic is navigational disruption, not attraction. A moth holds a
// straight course by keeping a distant light at a fixed angle off its heading --
// the moon is far enough away that the angle never changes as it flies. A bulb a
// few feet away is not, so holding that same angle wraps the path around the
// light instead of holding it straight. Nothing here steers a moth TOWARD the
// bulb. Every spiral, loop and collision below is that one correction applied
// moment to moment, exactly as the ants' turning rate comes out of the pheromone
// gradient rather than out of a plotted route.
//
// The scene is three-dimensional, because a moth's colour is a readout of where
// it is: dark when it passes in front of the bulb and we see its shadowed side,
// pale when it is behind and the bulb lights the face turned toward us, grey at
// the sides between. One cut of each wing frame serves all of it -- the frames
// are silhouettes with clean alpha, so the colour is painted through the mask at
// the moment of drawing.
// =============================================================================

const cv=document.getElementById('sky'), ctx=cv.getContext('2d');
const dark=document.getElementById('dark'), bright=document.getElementById('bright'),
      count=document.getElementById('count');

// ---- assets -----------------------------------------------------------------
const FRAMES=12, wing=[];
let wingReady=0;
for(let i=1;i<=FRAMES;i++){
  const im=new Image();
  im.onload=()=>{ wingReady++; };
  im.src='moth-'+String(i).padStart(2,'0')+'.png';
  wing.push(im);
}
const bulbImg=new Image(); let bulbReady=false;
bulbImg.onload=()=>{ bulbReady=true; }; bulbImg.src='bulb.png';
// where the filament sits inside bulb.png, as a fraction of the sprite
const FIL_X=70/160, FIL_Y=460/580;

// ---- the scene --------------------------------------------------------------
let W=0,H=0,DPR=1, cx=0, cy=0, scale=1, bulbH=0;
function resize(){
  DPR=Math.min(2, window.devicePixelRatio||1);
  W=innerWidth; H=innerHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  // the bulb is the dominant anchor, large in frame, hanging from the top
  bulbH=Math.min(H*0.52, W*1.15);
  const bulbW=bulbH*160/580;
  scale=bulbW/160;
  cx=W/2; cy=bulbH*FIL_Y;             // the filament is the light, not the glass
  stars.length=0; seedStars();
}
addEventListener('resize', resize);

// ---- stars: fixed, emerging as the sky goes out -----------------------------
const stars=[];
function seedStars(){
  // a fixed field, seeded from position so it does not swim about on resize
  let s=20260819;
  const rnd=()=>{ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; };
  const n=Math.round((W*H)/9000);
  for(let i=0;i<n;i++) stars.push({x:rnd()*W, y:rnd()*H*0.92, m:rnd(), tw:rnd()*6.28});
}

// ---- the moths --------------------------------------------------------------
// Distances are in bulb-heights, so the simulation is the same on any screen.
const moths=[];
function makeMoth(i){
  // Somewhere on a sphere around the bulb, evenly -- not on a ring around its
  // waist. The old version put every moth within a narrow band of the horizontal
  // and launched it sideways, and since the correction only ever turns a moth
  // within the plane holding its heading and the light, whatever plane it started
  // in it kept for good. Every path came out flat and they all looked alike.
  const u=Math.random()*2-1, th=Math.random()*Math.PI*2, sr=Math.sqrt(1-u*u);
  const r=1.35+Math.random()*1.15;
  // No moth here is given a behaviour. Each is given a set of numbers, drawn wide
  // enough apart that the behaviours she asked for come out on their own: the one
  // that smacks the glass and reels away offscreen in a long loop, the one that
  // rebounds and comes straight back at it, the one that takes an age to work its
  // way in and leaves again quickly, and the one that sails past without ever
  // being caught at all. Which moth is which is not decided anywhere -- it falls
  // out of how susceptible it happens to be and how hard a knock leaves it.
  //
  // zeal: how much the light gets to it. Raised to a power so that most moths are
  // middling and only a few are truly taken with it, which is what a real night
  // under a bulb looks like.
  const zeal=Math.pow(Math.random(),1.5);
  const size=0.70+Math.random()*0.66;
  const m={
    x:sr*Math.cos(th)*r, y:u*r, z:sr*Math.sin(th)*r,
    hx:0, hy:0, hz:0,
    // A slow heavy one and a quick light one are different animals, not the same
    // animal at two speeds, so speed and wingbeat and size move together as well
    // as apart: bigger wings beat slower.
    speed:0.40+Math.random()*0.85,
    // How far under a quarter turn it holds the light. Nearly a quarter turn is a
    // moth that circles for a long time and closes on the bulb barely at all; well
    // under is one that winds in within a turn or two.
    pref:Math.PI/2 - (0.05+zeal*0.40),
    // How hard it corrects. At the bottom of this range the correction is too
    // feeble to bend the course much, and that moth simply passes through.
    gain:0.16+zeal*2.35,
    // How long a knock on the glass leaves it flying without a reference. A short
    // fuse rebounds and tries again; a long one is carried right out of the light.
    dazed:0.45+Math.random()*2.3,
    beat:(8.2-2.4*(size-0.70)/0.66)+Math.random()*1.7,
    phase:Math.random()*FRAMES,
    size:size,
    // Flapping flight is not a smooth curve. A moth is thrown about by its own
    // wings on every beat, and how much varies from one to the next. This is not
    // the scripted randomness the brief rules out -- that rule is about the
    // looping, which still comes only from the light. This is the animal's own
    // imprecision, and without it they fly like filings on a magnet.
    flut:0.55+Math.random()*1.5,
    wob:Math.random()*6.28, wob2:Math.random()*6.28, t:Math.random()*40,
    bank:0,
    stun:0, bump:0, blind:0
  };
  // Broadside to the bulb -- the bearing it was already holding when the bulb
  // interfered -- but broadside in a direction picked freely from the whole circle
  // of directions perpendicular to the light. That circle is what sets the plane
  // the moth will loop in, so choosing from all of it is what gives one moth an
  // orbit over the top of the bulb and another one under it.
  const d=Math.hypot(m.x,m.y,m.z)||1;
  const rx=m.x/d, ry=m.y/d, rz=m.z/d;
  let ax=0, ay=1, az=0;
  if(Math.abs(ry)>0.9){ ax=1; ay=0; }              // any vector not along the radius
  let e1x=ay*rz-az*ry, e1y=az*rx-ax*rz, e1z=ax*ry-ay*rx;
  const e1n=Math.hypot(e1x,e1y,e1z)||1; e1x/=e1n; e1y/=e1n; e1z/=e1n;
  const e2x=ry*e1z-rz*e1y, e2y=rz*e1x-rx*e1z, e2z=rx*e1y-ry*e1x;
  const roll=Math.random()*Math.PI*2, cs=Math.cos(roll), sn=Math.sin(roll);
  m.hx=e1x*cs+e2x*sn; m.hy=e1y*cs+e2y*sn; m.hz=e1z*cs+e2z*sn;
  norm(m);
  return m;
}
function norm(m){ const n=Math.hypot(m.hx,m.hy,m.hz)||1; m.hx/=n; m.hy/=n; m.hz/=n; }

function setCount(n){
  while(moths.length<n) moths.push(makeMoth(moths.length));
  while(moths.length>n) moths.pop();
}

// The glass, measured off the sprite: the envelope is 52 of 160 wide in a frame
// 580 tall, so its half-width is 0.09 of the bulb's height on screen -- which in
// world units, with U below, is 0.20.
const GLASS=0.20;
const FAR=4.2;         // beyond this a moth has left, and another arrives

function step(dt, contrast, reach){
  for(const m of moths){
    if(m.stun>0){
      // knocked silly against the glass: tumbling, then it gathers itself
      m.stun-=dt;
      m.x+=m.hx*m.speed*dt*0.35; m.y+=m.hy*m.speed*dt*0.35+dt*0.22; m.z+=m.hz*m.speed*dt*0.35;
      m.phase+=dt*m.beat*FRAMES*0.35;
      continue;
    }
    // A moth that has just hit the glass has lost the very thing it was steering
    // by. It cannot hold an angle to a reference it is no longer reading, so for a
    // while it simply flies -- which is what lets it climb back out of the
    // gradient. Without this the bulb is an absorbing state: measured over
    // thirty-five seconds at full dark, all five moths reached it and not one ever
    // left again, which is not a spiral, it is a trap.
    if(m.blind>0){
      m.blind-=dt;
      const esc=1.15+m.dazed*0.30;
      m.x+=m.hx*m.speed*esc*dt; m.y+=m.hy*m.speed*esc*dt; m.z+=m.hz*m.speed*esc*dt;
      m.phase+=dt*m.beat*FRAMES;
      continue;
    }
    const d=Math.hypot(m.x,m.y,m.z)||1e-6;
    // unit vector from the moth toward the light
    const lx=-m.x/d, ly=-m.y/d, lz=-m.z/d;

    // How strongly the bulb dominates what this moth can see. Falls off with the
    // square of distance, and is judged AGAINST the ambient sky -- which is why
    // the dusk slider matters more than the bulb's own brightness. At dusk the sky
    // still competes and the correction is weak; at full dark nothing competes.
    const lit=reach/(d*d);
    const g=lit/(lit+contrast.ambient+1e-6);

    // the angle the light currently sits at, off the heading
    const dot=Math.max(-1,Math.min(1, m.hx*lx+m.hy*ly+m.hz*lz));
    const ang=Math.acos(dot);
    const err=m.pref-ang;

    // turn within the plane containing the heading and the light: the component of
    // the light direction perpendicular to the heading is the only way to turn
    let px=lx-dot*m.hx, py=ly-dot*m.hy, pz=lz-dot*m.hz;
    const pn=Math.hypot(px,py,pz);
    if(pn>1e-6){
      px/=pn; py/=pn; pz/=pn;
      // How hard it can correct. This is not a free knob: holding a constant angle
      // at radius d needs a turn of about speed/d, which grows without limit as the
      // spiral closes. Set too low and every moth settles into a standoff orbit it
      // can never leave -- measured at a stubborn 0.31 of a bulb-height, never once
      // reaching the glass. A real moth's authority is finite too, but it is enough
      // to carry the spiral in.
      // Squared, not linear. The authority has to be high enough that the spiral
      // can close at all, and at that level a linear response left the moth
      // correcting hard even at dusk, when the sky should still be winning. The
      // square keeps the top end and takes the bottom end away.
      const w=-err*m.gain*g*g*19.0*dt;
      m.hx+=px*w; m.hy+=py*w; m.hz+=pz*w;
      norm(m);
    }
    // --- flutter: thrown about by its own wingbeats -------------------------
    m.t+=dt;
    // two perpendiculars to the heading, to push about within
    let qx=0,qy=1,qz=0;
    if(Math.abs(m.hy)>0.9){ qx=1; qy=0; }
    let u1x=qy*m.hz-qz*m.hy, u1y=qz*m.hx-qx*m.hz, u1z=qx*m.hy-qy*m.hx;
    const u1n=Math.hypot(u1x,u1y,u1z)||1; u1x/=u1n; u1y/=u1n; u1z/=u1n;
    const u2x=m.hy*u1z-m.hz*u1y, u2y=m.hz*u1x-m.hx*u1z, u2z=m.hx*u1y-m.hy*u1x;
    // At the wingbeat, not below it. The first attempt at this ran at two or three
    // cycles a second, which only bent the curve into a smoother curve -- plotted
    // out, six seconds of flight was a clean swoop. A moth is thrown by every
    // stroke of its wings, so the fast term runs at this moth's own beat, with a
    // slower drift under it for the wandering.
    const bw=m.beat*Math.PI*2;
    const wa=Math.sin(m.t*bw+m.wob)*0.85 + Math.sin(m.t*bw*0.31+m.wob2)*0.75;
    const wb=Math.sin(m.t*bw*1.13+m.wob2)*0.75 + Math.sin(m.t*bw*0.19+m.wob)*0.85;
    const fs=m.flut*4.6*dt;
    m.hx+=(u1x*wa+u2x*wb)*fs; m.hy+=(u1y*wa+u2y*wb)*fs; m.hz+=(u1z*wa+u2z*wb)*fs;
    norm(m);
    // how hard it is leaning into the turn, smoothed, for the roll of the body
    m.bank += (wa - m.bank)*Math.min(1, dt*5);
    m.x+=m.hx*m.speed*dt; m.y+=m.hy*m.speed*dt; m.z+=m.hz*m.speed*dt;
    m.phase+=dt*m.beat*FRAMES;

    const nd=Math.hypot(m.x,m.y,m.z);
    if(nd<GLASS){
      // it has found the glass. Not a scripted event -- the spiral simply closed.
      m.stun=0.35+Math.random()*0.4; m.bump=1;
      m.blind=(1.05+Math.random()*0.85)*m.dazed;   // its own fuse, not a shared one
      const s=GLASS/nd; m.x*=s; m.y*=s; m.z*=s;
      // knocked off it, heading outward: it has to climb back out of the gradient
      // before the same correction can wind it in again
      m.hx=-m.x/GLASS*0.75+(Math.random()-0.5)*0.8;
      m.hy=-m.y/GLASS*0.75+(Math.random()-0.5)*0.8;
      m.hz=-m.z/GLASS*0.75+(Math.random()-0.5)*0.8;
      norm(m);
    } else if(nd>FAR){
      // gone off into the dark; another comes in from somewhere else
      Object.assign(m, makeMoth(0));
    }
  }
}

// ---- drawing ----------------------------------------------------------------
const FOCAL=5.2;
// One world unit is a little under half the bulb's height on screen. The whole
// orbit has to happen inside the frame or the spiral -- the only thing there is
// to watch -- takes place off the edge of it.
function U(){ return bulbH*0.45; }
function project(m){
  const p=FOCAL/(FOCAL+m.z);
  return {sx:cx+m.x*U()*p, sy:cy+m.y*U()*p, p};
}

// the tinted wing frame, cached: the frames are alpha masks, so colour is
// painted through them rather than baked into twelve more files
const tintCache=new Map();
function tinted(frame, shade){
  const q=Math.round(shade*10);              // eleven steps is under the eye's threshold
  const key=frame+':'+q;
  let c=tintCache.get(key);
  if(c) return c;
  const im=wing[frame];
  c=document.createElement('canvas'); c.width=im.width; c.height=im.height;
  const g=c.getContext('2d');
  g.drawImage(im,0,0);
  g.globalCompositeOperation='source-in';
  const v=Math.round(255*(q/10));
  g.fillStyle='rgb('+v+','+Math.round(v*0.99)+','+Math.round(v*0.94)+')';
  g.fillRect(0,0,c.width,c.height);
  tintCache.set(key,c);
  return c;
}

function draw(sky, glow, flick){
  // --- the air -------------------------------------------------------------
  const gsky=ctx.createLinearGradient(0,0,0,H);
  gsky.addColorStop(0, sky.top); gsky.addColorStop(0.55, sky.mid); gsky.addColorStop(1, sky.low);
  ctx.fillStyle=gsky; ctx.fillRect(0,0,W,H);

  // --- stars ---------------------------------------------------------------
  if(sky.stars>0.01){
    const t=performance.now()/1000;
    for(const s of stars){
      const a=sky.stars*(0.25+0.75*s.m)*(0.75+0.25*Math.sin(t*0.7+s.tw));
      if(a<=0.01) continue;
      ctx.fillStyle='rgba(226,232,245,'+a.toFixed(3)+')';
      ctx.fillRect(s.x, s.y, s.m>0.85?1.6:1, s.m>0.85?1.6:1);
    }
  }

  // --- the bulb's spill, before anything solid -----------------------------
  const R=bulbH*(0.85+glow*1.5);
  const gg=ctx.createRadialGradient(cx,cy,0,cx,cy,R);
  const A=glow*flick;
  gg.addColorStop(0,   'rgba(255,205,130,'+(0.40*A).toFixed(3)+')');
  gg.addColorStop(0.16,'rgba(255,176,92,' +(0.20*A).toFixed(3)+')');
  gg.addColorStop(0.45,'rgba(232,146,64,' +(0.07*A).toFixed(3)+')');
  gg.addColorStop(1,   'rgba(232,146,64,0)');
  ctx.globalCompositeOperation='lighter';
  ctx.fillStyle=gg; ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='source-over';

  // --- moths behind the bulb, the bulb, then moths in front ----------------
  const order=moths.slice().sort((a,b)=>b.z-a.z);
  const behind=order.filter(m=>m.z>0), infront=order.filter(m=>m.z<=0);

  for(const m of behind) drawMoth(m, flick);

  if(bulbReady){
    const bw=bulbH*160/580;
    ctx.save();
    ctx.globalAlpha=1;
    ctx.drawImage(bulbImg, cx-bw*FIL_X, cy-bulbH*FIL_Y, bw, bulbH);
    // the filament's own output rides the flicker
    ctx.globalCompositeOperation='lighter';
    ctx.globalAlpha=Math.max(0, Math.min(1, glow*flick));
    ctx.drawImage(bulbImg, cx-bw*FIL_X, cy-bulbH*FIL_Y, bw, bulbH);
    ctx.restore();
  }

  for(const m of infront) drawMoth(m, flick);
}

function drawMoth(m, flick){
  if(wingReady<FRAMES) return;
  const {sx,sy,p}=project(m);
  if(p<=0.05) return;
  const d=Math.hypot(m.x,m.y,m.z)||1e-6;
  // Colour is nothing but position: 0 when it is between us and the bulb and we
  // see only its shadow, 1 when the bulb is between us and it, lighting the face
  // turned our way, and half way between at the sides.
  // Nothing but position. There used to be a term here lifting the shade of any
  // moth close to the bulb, meant as light wrapping round its edges -- but it
  // lifted moths IN FRONT of the glass too, which is exactly backwards: a moth
  // between us and the bulb is more thoroughly backlit the closer it gets, not
  // less. It showed up as grey moths in front of the lower third of the bulb,
  // where the filament sits and the term bit hardest.
  const shade=(1 + m.z/d)/2;
  const frame=((Math.floor(m.phase)%FRAMES)+FRAMES)%FRAMES;
  const img=tinted(frame, shade);
  const w=bulbH*0.115*m.size*p, h=w*img.height/img.width;
  // pointed the way it is going
  const nx=cx+(m.x+m.hx*0.05)*U()*(FOCAL/(FOCAL+m.z+m.hz*0.05));
  const ny=cy+(m.y+m.hy*0.05)*U()*(FOCAL/(FOCAL+m.z+m.hz*0.05));
  const rot=Math.atan2(ny-sy, nx-sx)+Math.PI/2;
  // It banks into its turns, and the more it is turned the more of it we see
  // edge-on rather than flat -- so the body narrows as it leans, the way a real
  // one does when it rolls out of the plane of the frame.
  const lean=Math.max(-1.2,Math.min(1.2, m.bank*1.35));
  const narrow=0.34+0.66*Math.abs(Math.cos(lean));
  // and it rises and falls on the beat, because flapping flight does
  const bob=Math.sin(m.phase*Math.PI*2/FRAMES)*h*0.055;
  ctx.save();
  ctx.translate(sx,sy+bob); ctx.rotate(rot+lean*0.42);
  ctx.globalAlpha=Math.max(0,Math.min(1, 0.35+0.65*Math.min(1,p)));
  ctx.drawImage(img, -w*narrow/2, -h/2, w*narrow, h);
  ctx.restore();
}

// ---- the two sliders that shape the air -------------------------------------
function readSky(){
  const k=+dark.value/100;                       // 0 early dusk, 1 full dark
  // contrast between bulb and sky climbs non-linearly as the sky goes out
  // The sky is a competing light, and at dusk it is a strong one -- strong
  // enough that the bulb is just another glow in a bright field and the moth's
  // bearing survives. The weight here is what decides whether early dusk reads as
  // undisturbed drifting or as moths already at the glass.
  const ambient=1.9*Math.pow(1-k, 1.9)+0.004;
  const mix=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));
  const rgb=c=>'rgb('+c[0]+','+c[1]+','+c[2]+')';
  const top=mix([46,64,102],[6,8,14],Math.pow(k,0.85));
  const mid=mix([32,44,76], [4,6,11], Math.pow(k,0.85));
  const low=mix([58,54,72], [3,4,8],  Math.pow(k,0.7));
  return {ambient, stars:Math.max(0,(k-0.28)/0.72),
          top:rgb(top), mid:rgb(mid), low:rgb(low)};
}

// The filament sits nearer its threshold when it is turned down, so the flicker
// belongs to the low end of the brightness slider rather than to a control of its
// own -- one phenomenon, not two.
let flickPhase=0, flickSlow=0;
function flicker(dt, b){
  flickPhase+=dt*100; flickSlow+=dt*(0.6+2.2*(1-b));
  const amp=0.020+0.085*Math.pow(1-b,2.1);
  const mains=Math.sin(flickPhase)*0.35+Math.sin(flickPhase*1.7+1.1)*0.2;
  const wander=Math.sin(flickSlow*2.3)*0.5+Math.sin(flickSlow*0.9+2.0)*0.5;
  return 1+amp*(mains*0.45+wander*0.9);
}

// ---- the loop ---------------------------------------------------------------
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  const sky=readSky();
  const b=+bright.value/100;
  const flick=flicker(dt, b);
  // the bulb's brightness widens the reach of the gradient as well as raising it
  const reach=(0.10+1.30*b)*flick;
  setCount(+count.value);
  step(dt, sky, reach);
  draw(sky, Math.max(0.05, b)*0.9+0.10, flick);
  requestAnimationFrame(frame);
}
resize(); setCount(+count.value);
requestAnimationFrame(frame);

// expose the state for measurement, so the flight can be checked against the
// physics rather than eyeballed
window.__moths={moths, readSky, project:()=>moths.map(project)};
})();
</script>

<script>
(function(){
  var disc=document.getElementById('shelfdisc'), box=document.getElementById('plates');
  var rows=[].slice.call(box.querySelectorAll('.row'));
  function unroll(){ rows.forEach(function(r){ r.classList.remove('rolled'); }); }
  function shut(){ box.classList.remove('open'); disc.setAttribute('aria-expanded','false'); unroll(); }

  disc.addEventListener('click', function(ev){
    ev.stopPropagation();
    var open=box.classList.toggle('open');
    disc.setAttribute('aria-expanded', open?'true':'false');
    if(!open) unroll();
  });

  // Same bargain the case itself strikes: a mouse can hover, so a plate is a link
  // straight to its shelf. A thumb cannot, so the first tap on a plate rolls its
  // pieces out and only the second one goes to the shelf.
  var FINE=matchMedia('(hover: hover) and (pointer: fine)');
  rows.forEach(function(row){
    row.querySelector('.tag').addEventListener('click', function(ev){
      if(FINE.matches) return;
      if(row.classList.contains('rolled')) return;
      ev.preventDefault();
      unroll(); row.classList.add('rolled');
    });
  });

  document.addEventListener('click', function(ev){
    if(!box.contains(ev.target) && ev.target!==disc) shut();
  });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') shut(); });
})();
</script>
