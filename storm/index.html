<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>storm glass — sagne</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<style>
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{ height:100%; margin:0; overflow:hidden; background:#050505; color:#dfe6ea;
    font-family:Georgia, serif; user-select:none; }
  #backlink{ position:fixed; top:18px; left:22px; z-index:50; color:#dfe6ea; opacity:.5;
    text-decoration:none; font-size:14px; letter-spacing:.04em; text-shadow:0 1px 3px rgba(0,0,0,.85), 0 0 9px rgba(0,0,0,.55); transition:opacity .3s ease; }
  #backlink:hover{ opacity:.9; }
  #stage{ height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:6vh 3vw 2vh; gap:2vh; }
  #scene-wrap{ position:relative; height:min(76vh,720px); aspect-ratio:201/504; }
  #scene-wrap img{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain;
    -webkit-user-drag:none; pointer-events:none; transition:opacity .9s ease; }
  #dock{ display:flex; align-items:center; justify-content:center; gap:20px; padding:0 22px; }
  .toggle{ display:flex; align-items:center; gap:8px; cursor:pointer; }
  .toggle input{ appearance:none; width:16px; height:16px; border:1.5px solid rgba(223,230,234,.7);
    border-radius:3px; background:transparent; position:relative; cursor:pointer; flex-shrink:0; }
  .toggle input:checked{ background:#dfe6ea; }
  .toggle input:checked::after{ content:''; position:absolute; left:4px; top:1px; width:4px; height:8px;
    border:solid #050505; border-width:0 2px 2px 0; transform:rotate(40deg); }
  .cloud-icon{ color:#dfe6ea; flex-shrink:0; transition:color .25s ease; }
  .toggle input:not(:checked) ~ .cloud-icon{ color:#7a8388; }
  input[type=range]{ -webkit-appearance:none; appearance:none; width:150px; height:3px; border-radius:3px;
    background:rgba(223,230,234,.25); outline:none; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
    background:#dfe6ea; cursor:pointer; box-shadow:0 0 8px rgba(223,230,234,.5); }
  input[type=range]::-moz-range-thumb{ width:14px; height:14px; border:none; border-radius:50%; background:#dfe6ea; cursor:pointer; }
  #sliderWrap{ display:flex; align-items:center; transition:opacity .3s ease; }
  #sliderWrap.disabled{ opacity:.3; pointer-events:none; }
</style>
</head>
<body>
<a id="backlink" href="../index.html">← sagne</a>
<div id="stage">
  <div id="scene-wrap">
    <img id="frame-a" src="storm-01.png" alt="">
    <img id="frame-b" src="storm-01.png" alt="" style="opacity:0;">
  </div>
  <div id="dock">
    <label class="toggle">
      <input type="checkbox" id="chkLive" checked aria-label="use real local weather">
      <svg class="cloud-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path d="M7 17a4 4 0 0 1-.6-7.96A5 5 0 0 1 16 8.2 4.5 4.5 0 0 1 17.5 17H7Z" fill="none" stroke="currentColor" stroke-width="1.4"/>
      </svg>
    </label>
    <div id="sliderWrap" class="disabled">
      <input type="range" id="instabilitySlider" min="0" max="100" value="30" aria-label="storminess">
    </div>
  </div>
</div>
<script>
(function(){
  const N_FRAMES=7;
  const els={
    frameA: document.getElementById('frame-a'),
    frameB: document.getElementById('frame-b'),
    chkLive: document.getElementById('chkLive'),
    sliderWrap: document.getElementById('sliderWrap'),
    slider: document.getElementById('instabilitySlider'),
  };

  // ---------- weather: the same live/manual pattern as galileo and conometer.
  // storminess is built from three real fields rather than one: cloud cover,
  // how far pressure sits below the standard 1013 hPa baseline (a real proxy
  // for "how unsettled the air is"), and a boost when precipitation is
  // actually falling right now ----------
  let lat=55.19, lon=-1.56; // fallback: north-east England, matching the rest of the site
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      pos=>{ lat=pos.coords.latitude; lon=pos.coords.longitude; fetchWeather(); },
      ()=>{ fetchWeather(); }, { timeout:5000 }
    );
  }
  let liveInstability=null;
  let manualInstability=30;
  function currentInstability(){
    if(els.chkLive.checked) return liveInstability!=null ? liveInstability : manualInstability;
    return manualInstability;
  }
  async function fetchWeather(){
    try{
      const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=cloud_cover,surface_pressure,precipitation`;
      const res=await fetch(url);
      const data=await res.json();
      const c=data && data.current;
      if(c){
        const cloud=typeof c.cloud_cover==='number' ? c.cloud_cover : 50;
        const pressure=typeof c.surface_pressure==='number' ? c.surface_pressure : 1013;
        const precip=typeof c.precipitation==='number' ? c.precipitation : 0;
        const cloudScore=cloud/100;
        const pressureScore=Math.max(0, Math.min(1, (1013-pressure)/40));
        const precipBoost=precip>0 ? Math.min(0.35, 0.15+precip*0.05) : 0;
        liveInstability=Math.max(0, Math.min(100, (0.5*cloudScore+0.5*pressureScore+precipBoost)*100));
        if(els.chkLive.checked) renderStorm();
      }
    }catch(e){ /* keep last known value silently */ }
  }
  fetchWeather();
  setInterval(()=>{ if(els.chkLive.checked) fetchWeather(); }, 10*60*1000);

  // ---------- rendering: exactly conometer's crossfade pattern — one real
  // number picks the nearest of N photographed states and eases between them ----------
  let shownFrame=null;
  function frameUrl(n){ return `storm-${String(n).padStart(2,'0')}.png`; }
  function renderStorm(){
    const v=Math.max(0, Math.min(100, currentInstability()));
    const pos=1 + (v/100) * (N_FRAMES-1);
    const nearest=Math.max(1, Math.min(N_FRAMES, Math.round(pos)));

    if(shownFrame===null){
      els.frameA.src=frameUrl(nearest);
      els.frameA.style.opacity=1;
      els.frameB.style.opacity=0;
      shownFrame=nearest;
      return;
    }
    if(nearest!==shownFrame){
      els.frameB.src=frameUrl(nearest);
      els.frameB.style.opacity=1;
      els.frameA.style.opacity=0;
      shownFrame=nearest;
      window.clearTimeout(renderStorm._settleTimer);
      renderStorm._settleTimer=window.setTimeout(()=>{
        els.frameA.src=frameUrl(nearest);
        els.frameA.style.opacity=1;
        els.frameB.style.opacity=0;
      }, 950); // matches the CSS opacity transition duration
    }
  }

  function setLive(v){
    els.chkLive.checked=v;
    els.sliderWrap.classList.toggle('disabled', v);
    renderStorm();
  }
  els.chkLive.addEventListener('change', ()=>setLive(els.chkLive.checked));
  els.slider.addEventListener('input', ()=>{
    manualInstability=parseFloat(els.slider.value);
    if(!els.chkLive.checked) renderStorm();
  });
  els.sliderWrap.addEventListener('pointerdown', ()=>{ if(els.chkLive.checked) setLive(false); });

  renderStorm();
})();
</script>
</body>
</html>
