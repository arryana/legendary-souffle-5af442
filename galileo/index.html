<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>galileo — sagne</title>
<link rel="icon" type="image/svg+xml" href="galileo-favicon.svg">
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="A Galileo thermometer — the middle float is the current temperature.">
<meta name="theme-color" content="#0e1c30">

<meta property="og:type" content="website">
<meta property="og:site_name" content="sagne">
<meta property="og:title" content="galileo — sagne">
<meta property="og:description" content="A Galileo thermometer — the middle float is the current temperature.">
<meta property="og:url" content="https://sagne.co.uk/galileo/">

<meta name="twitter:title" content="galileo — sagne">
<meta name="twitter:description" content="A Galileo thermometer — the middle float is the current temperature.">
<meta name="twitter:image" content="https://sagne.co.uk/og/galileo.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400&display=swap');

  :root{
    --bg:#171009;
    --brass:#b8903f;
    --brass-lo:#7a5f28;
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    background: radial-gradient(ellipse at 50% 15%, #241a10 0%, var(--bg) 70%);
    color:#e2d6bb;
    font-family:'Jost', sans-serif;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    overflow:hidden;
  }
  #stage{
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:2vh 4vw;
    gap:1.2vh;
  }
  #instrument-wrap{
    width:min(20vw, 190px);
    height:min(78vh, 720px);
    filter:drop-shadow(0 24px 46px rgba(0,0,0,.55));
  }
  /* the flag and its note/search live in one tight cluster so a shown note doesn't add
     a whole extra row of #stage's gap on top of its own height — keeps the bottom of the
     control stack from getting pushed past the fold on shorter screens */
  #loc-cluster{ display:flex; flex-direction:column; align-items:center; gap:2px; }
  #instrument-wrap svg{ width:100%; height:100%; overflow:visible; }

  .bulb-group{ transition: transform 1.4s cubic-bezier(.34,.1,.2,1); }
  .tag-chip{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
  }
  .hover-clone{
    opacity:0;
    transition: opacity .22s ease, transform .22s ease;
    pointer-events:none;
  }
  .hover-clone.show{ opacity:1; }
  .hit-circle{ cursor:pointer; }

  #unit-toggle{
    display:flex;
    align-items:center;
    gap:6px;
    font-family:'Cormorant Garamond', serif;
    font-size:17px;
    letter-spacing:.02em;
  }
  #unit-toggle button{
    background:none;
    border:none;
    color:#7a6b52;
    font:inherit;
    cursor:pointer;
    padding:2px 4px;
    transition:color .3s ease;
  }
  #unit-toggle button.active{ color:var(--brass); }
  #unit-toggle .sep{ color:#5a4c38; }
  #loc-note{
    display:none; font-size:12px; letter-spacing:.02em; color:#7a6b52;
    text-align:center; font-family:'Cormorant Garamond', serif;
  }
  #loc-note.visible{ display:block; }
  #loc-retry{ appearance:none; border:0; background:none; padding:0; margin-left:2px;
    font:inherit; color:inherit; text-decoration:underline; cursor:pointer; }
  #loc-retry:hover{ color:var(--brass); }
  #loc-retry:disabled{ text-decoration:none; opacity:.6; cursor:default; }

  /* a quiet flag, always available, for checking the weather somewhere other than
     wherever the visitor actually is — opens a small search bar, never on by default */
  #loc-flag{
    appearance:none; border:0; background:none; padding:4px 6px; margin-top:2px;
    font-size:15px; line-height:1; cursor:pointer; opacity:.4; transition:opacity .3s ease;
  }
  #loc-flag:hover, #loc-flag.open{ opacity:.85; }
  #loc-search{
    display:flex; align-items:center; gap:6px; max-height:0; overflow:hidden;
    opacity:0; transition:max-height .3s ease, opacity .3s ease, margin .3s ease;
    flex-shrink:0;
  }
  #loc-search.open{ max-height:40px; opacity:1; margin-top:2px; }
  #loc-search input{
    appearance:none; border:0; border-bottom:1px solid rgba(184,144,63,.4); background:none;
    color:#e2d6bb; font:15px/1.3 'Jost', sans-serif; letter-spacing:.02em; padding:3px 2px;
    width:132px; outline:none;
  }
  #loc-search input::placeholder{ color:#7a6b52; }
  #loc-search input:focus{ border-bottom-color:var(--brass); }
  #loc-search-status{
    font-size:11px; letter-spacing:.02em; color:#7a6b52; text-align:center;
    font-family:'Cormorant Garamond', serif; min-height:1.2em;
  }

  @media (orientation:portrait){
    #instrument-wrap{ width:min(52vw, 230px); height:min(66vh, 560px); }
  }
</style>
</head>
<body>
<style>
  #backlink{ position:fixed; top:18px; left:22px; z-index:50; color:#f2e9d8; opacity:.5; text-decoration:none; font-size:14px; letter-spacing:.04em; text-shadow:0 1px 3px rgba(0,0,0,.85), 0 0 9px rgba(0,0,0,.55); transition:opacity .3s ease; }
  #backlink:hover{ opacity:.9; }
</style>
<a id="backlink" href="../index.html">← sagne</a>
<div id="stage">
  <div id="instrument-wrap">
    <svg id="vessel-svg" viewBox="595 20 220 725" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="liquidFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#d2d6d9"/>
          <stop offset="30%" stop-color="#c7cbce"/>
          <stop offset="65%" stop-color="#b3b7bb"/>
          <stop offset="100%" stop-color="#94989c"/>
        </linearGradient>
        <!-- slim reflection running down the left of the glass, beside the lower floats -->
        <linearGradient id="hlX" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#fdfbf5" stop-opacity="0"/>
          <stop offset="0.5" stop-color="#fdfbf5" stop-opacity="0.58"/>
          <stop offset="1" stop-color="#fdfbf5" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="hlY" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff" stop-opacity="0"/>
          <stop offset="0.22" stop-color="#fff" stop-opacity="1"/>
          <stop offset="0.8" stop-color="#fff" stop-opacity="1"/>
          <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <filter id="hlBlur" x="-200%" y="-40%" width="500%" height="180%"><feGaussianBlur stdDeviation="0.7"/></filter>
        <mask id="hlMask"><rect x="649" y="500" width="13" height="138" fill="url(#hlY)"/></mask>
      </defs>
      <g id="bulb-layer"></g>
      <g id="tag-layer"></g>
      <image href="vessel-dark.png" x="595" y="20" width="220" height="725" style="pointer-events:none;"/>
      <rect x="649" y="500" width="13" height="138" fill="url(#hlX)" mask="url(#hlMask)" filter="url(#hlBlur)" style="pointer-events:none;"/>
      <g id="hit-layer"></g>
      <g id="hover-layer"></g>
    </svg>
  </div>

  <div id="unit-toggle">
    <button id="btn-c" aria-label="Celsius">C</button>
    <span class="sep">/</span>
    <button id="btn-f" aria-label="Fahrenheit">F</button>
  </div>
  <div id="loc-cluster">
    <div id="loc-note"><span id="loc-note-text">using an approximate location — check that your browser and device allow it, then</span> <button type="button" id="loc-retry">try again</button></div>
    <button type="button" id="loc-flag" title="check another location" aria-label="check another location" aria-expanded="false">🚩</button>
    <form id="loc-search" autocomplete="off">
      <input type="text" id="loc-search-input" placeholder="postcode or city" aria-label="postcode or city">
    </form>
    <div id="loc-search-status"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  // twelve bulbs at a clean 5°F step (was nine at 7.5°) — finer resolution,
  // same 30-85°F spread the thermometer has always covered
  const BULBS_F = [30, 35, 40, 45, 50, 55, 60, 65, 70, 75, 80, 85];
  const FLOAT_IMAGES = ['blue','aqua','green','yellow','gold','orange','red','pink','palepink','purple','lavender','silver'];
  const X_JITTER = [-22, 18, -10, 24, -19, -27, 11, -16, 21, 26, -13, -5];

  // display size for each float sprite (native crop is 340x435)
  // sized so a bulb reads as roughly a real pea against the tube (tube interior ~130 units wide)
  const FLOAT_W = 48;
  const FLOAT_H = FLOAT_W * (660/370);
  const TAG_FONT_SIZE = FLOAT_W * 0.16;
  const TAG_TEXT_X = 1;
  // coin's true visual center measured at its widest row (y=95 of 107px sprite),
  // plus a baseline correction since SVG text y= is the baseline, not the glyph's visual middle
  const TAG_TEXT_Y = FLOAT_H/2 - FLOAT_H*0.08;

  // tube interior bounds measured from the traced vessel (native SVG coords)
  const TUBE_CX = 703;
  const TUBE_Y_TOP = 163;
  const TUBE_Y_BOTTOM = 632;

  let unit = 'f';
  let currentTempF = 65;
  let lat = null, lon = null;
  let weatherFetchFailures = 0; // consecutive failed weather fetches (location already known) --
  // separate from a geolocation failure, which has its own note text and its own counter-less path

  const bulbLayer = document.getElementById('bulb-layer');
  const tagLayer = document.getElementById('tag-layer');
  const hitLayer = document.getElementById('hit-layer');
  const hoverLayer = document.getElementById('hover-layer');
  const btnC = document.getElementById('btn-c');
  const btnF = document.getElementById('btn-f');

  const HOVER_SCALE = 2.4;

  function fToC(f){ return (f-32)*5/9; }

  const bulbEls = BULBS_F.map((t,i)=>{
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','bulb-group');
    g.innerHTML = `<image href="floats/${FLOAT_IMAGES[i]}.png" x="${-FLOAT_W/2}" y="${-FLOAT_H/2}" width="${FLOAT_W}" height="${FLOAT_H}"/>`;
    bulbLayer.appendChild(g);

    const tg = document.createElementNS('http://www.w3.org/2000/svg','g');
    tg.setAttribute('class','tag-group');
    tg.innerHTML = `<text x="${TAG_TEXT_X}" y="${TAG_TEXT_Y}" text-anchor="middle" font-size="${TAG_FONT_SIZE}" class="tag-chip" fill="#000000">${Math.round(t)}°</text>`;
    tagLayer.appendChild(tg);

    // zoomed-in clone shown on hover, rendered above the glass so it's never clipped
    const hg = document.createElementNS('http://www.w3.org/2000/svg','g');
    hg.setAttribute('class','hover-clone');
    hg.innerHTML = `
      <image href="floats/${FLOAT_IMAGES[i]}.png" x="${-FLOAT_W/2*HOVER_SCALE}" y="${-FLOAT_H/2*HOVER_SCALE}" width="${FLOAT_W*HOVER_SCALE}" height="${FLOAT_H*HOVER_SCALE}"/>
      <text x="${TAG_TEXT_X*HOVER_SCALE}" y="${TAG_TEXT_Y*HOVER_SCALE}" text-anchor="middle" font-size="${TAG_FONT_SIZE*HOVER_SCALE}" class="tag-chip" fill="#000000">${Math.round(t)}°</text>
    `;
    hoverLayer.appendChild(hg);

    // invisible larger hit target, easier to hover/tap than the tiny coin itself
    const hit = document.createElementNS('http://www.w3.org/2000/svg','circle');
    hit.setAttribute('class','hit-circle');
    hit.setAttribute('r', FLOAT_W*0.7);
    hit.setAttribute('fill', 'transparent');
    hitLayer.appendChild(hit);

    function showZoom(){ hg.classList.add('show'); }
    function hideZoom(){ hg.classList.remove('show'); }
    hit.addEventListener('pointerenter', showZoom);
    hit.addEventListener('pointerleave', hideZoom);
    hit.addEventListener('touchstart', (e)=>{ e.preventDefault(); showZoom(); }, {passive:false});
    hit.addEventListener('touchend', hideZoom);

    return { el: g, tagEl: tg, hoverEl: hg, hitEl: hit, hoverText: hg.querySelector('text'), temp: t, x: X_JITTER[i] };
  });

  function tagLabel(tempF){
    if (unit === 'f') return Math.round(tempF);
    return Math.round(fToC(tempF));
  }

  function updateTags(){
    bulbEls.forEach(b=>{
      const textEl = b.tagEl.querySelector('text');
      textEl.textContent = tagLabel(b.temp) + '°';
      b.hoverText.textContent = tagLabel(b.temp) + '°';
    });
  }

  function updatePositions(){
    const n = BULBS_F.length;
    bulbEls.forEach((b,i)=>{
      const buoyancy = b.temp - currentTempF;
      const k = 0.11;
      let frac = 0.5 - 0.5*Math.tanh(buoyancy*k);
      const stagger = (i - (n-1)/2) * 14;
      let y = TUBE_Y_TOP + frac*(TUBE_Y_BOTTOM-TUBE_Y_TOP) + stagger;
      y = Math.max(TUBE_Y_TOP+8, Math.min(TUBE_Y_BOTTOM-8, y));
      const x = TUBE_CX + b.x;
      b.el.setAttribute('transform', `translate(${x},${y})`);
      b.tagEl.setAttribute('transform', `translate(${x},${y})`);
      b.hoverEl.setAttribute('transform', `translate(${x},${y})`);
      b.hitEl.setAttribute('cx', x);
      b.hitEl.setAttribute('cy', y);
    });
  }

  function setUnit(u){
    unit = u;
    btnC.classList.toggle('active', u==='c');
    btnF.classList.toggle('active', u==='f');
    updateTags();
  }
  btnC.addEventListener('click', ()=>setUnit('c'));
  btnF.addEventListener('click', ()=>setUnit('f'));
  setUnit('f');

  async function fetchWeather(){
    if (lat==null || lon==null) return;
    try{
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m&temperature_unit=fahrenheit`;
      const res = await fetch(url);
      const data = await res.json();
      if (data && data.current && typeof data.current.temperature_2m === 'number'){
        currentTempF = data.current.temperature_2m;
        updatePositions();
        if (weatherFetchFailures > 0){ weatherFetchFailures = 0; hideLocationNote(); }
      } else {
        throw new Error('unexpected response shape');
      }
    } catch(e){
      // a single missed refresh isn't worth interrupting anyone over (open-meteo refreshes
      // every 10 minutes, and one blip is normal) -- but silence past that point would mean
      // quietly showing a stale reading as if it were still real, which is the one thing
      // this site promises never to do
      weatherFetchFailures++;
      if (weatherFetchFailures >= 2) showLocationNote("couldn't reach the weather just now — showing the last real reading, still trying quietly");
    }
  }

  // silent until now — if the browser can't (or won't) hand over a real location, the
  // reading was quietly using this fallback with no sign to the visitor that anything was off
  function showLocationNote(msg){
    const note = document.getElementById('loc-note');
    if (msg){ const text = document.getElementById('loc-note-text'); if (text) text.textContent = msg; }
    if (note) note.classList.add('visible');
  }
  function hideLocationNote(){
    const note = document.getElementById('loc-note');
    if (note) note.classList.remove('visible');
  }
  function tryLocationAgain(){
    if (!navigator.geolocation) return;
    const btn = document.getElementById('loc-retry');
    if (btn){ btn.disabled = true; btn.textContent = 'checking…'; }
    navigator.geolocation.getCurrentPosition(
      pos => {
        lat = pos.coords.latitude; lon = pos.coords.longitude;
        hideLocationNote();
        if (btn){ btn.disabled = false; btn.textContent = 'try again'; }
        fetchWeather();
      },
      () => {
        if (btn){ btn.disabled = false; btn.textContent = 'try again'; }
        const text = document.getElementById('loc-note-text');
        if (text) text.textContent = "still couldn't find it — check your browser and device settings, then";
      },
      { timeout: 5000 }
    );
  }
  // the flag: a quiet, always-there way to check the weather somewhere other than
  // wherever the visitor actually is — never open by default, no page text anywhere
  // else hints it exists. Geocoding goes through OpenStreetMap's Nominatim (free, no
  // key) since open-meteo's own geocoder searches place names, not postcodes.
  function initLocationSearch(){
    const flag = document.getElementById('loc-flag');
    const form = document.getElementById('loc-search');
    const input = document.getElementById('loc-search-input');
    const status = document.getElementById('loc-search-status');
    if (!flag || !form || !input) return;

    flag.addEventListener('click', () => {
      const open = form.classList.toggle('open');
      flag.classList.toggle('open', open);
      flag.setAttribute('aria-expanded', open ? 'true' : 'false');
      if (open) input.focus();
      else status.textContent = '';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const q = input.value.trim();
      if (!q) return;
      status.textContent = 'looking…';
      try {
        const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q)}`;
        const res = await fetch(url);
        const results = await res.json();
        if (!results || !results.length) { status.textContent = "couldn't find that"; return; }
        lat = parseFloat(results[0].lat); lon = parseFloat(results[0].lon);
        hideLocationNote();
        await fetchWeather();
        status.textContent = results[0].display_name.split(',').slice(0, 2).join(', ');
        input.value = '';
      } catch (e) {
        status.textContent = "couldn't reach the map — try again";
      }
    });
  }

  function init(){
    updatePositions();
    initLocationSearch();
    const locRetryBtn = document.getElementById('loc-retry');
    if (locRetryBtn) locRetryBtn.addEventListener('click', tryLocationAgain);
    if (navigator.geolocation){
      navigator.geolocation.getCurrentPosition(
        pos => { lat = pos.coords.latitude; lon = pos.coords.longitude; fetchWeather(); },
        () => { lat = 55.19; lon = -1.56; fetchWeather(); showLocationNote(); },
        { timeout: 5000 }
      );
    } else {
      lat = 55.19; lon = -1.56; fetchWeather(); showLocationNote();
    }
    setInterval(fetchWeather, 10*60*1000);
  }

  init();
})();
</script>
</body>
</html>
