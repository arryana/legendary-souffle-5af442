<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400&display=swap');

  :root{
    --bg1:#0f1420;
    --bg2:#1c2433;
    --brass:#c9974e;
    --brass-light:#e8c383;
    --parchment:#f2e9d8;
  }
  *{box-sizing:border-box;}
  html,body{
    min-height:100%; margin:0;
    background: radial-gradient(ellipse at 50% 38%, var(--bg2) 0%, var(--bg1) 72%);
    color:var(--parchment);
    font-family:'Jost', sans-serif;
    overflow-x:hidden;
    overflow-y:auto;
  }
  #wrap{
    min-height:100vh; min-height:100dvh;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:40px 24px;
  }
  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:400; font-style:italic;
    font-size:clamp(30px, 5vw, 46px);
    letter-spacing:.14em;
    margin:0 0 56px;
    color:var(--parchment);
    text-shadow: 0 0 24px rgba(201,151,78,0.25);
  }

  #cards{
    display:flex; gap:28px; align-items:center; justify-content:center;
    flex-wrap:wrap;
    max-width:500px; /* at 4 cards, forces 2x2 pairs per the compositional rule */
  }
  #cards.dice5{
    display:grid;
    grid-template-columns: 220px 220px 220px;
    grid-template-rows: 320px 320px 320px;
    grid-template-areas:
      "tl .  tr"
      ".  c  ."
      "bl .  br";
    gap:24px;
    max-width:none;
  }
  #cards.dice5 a:nth-child(1){ grid-area: tl; }
  #cards.dice5 a:nth-child(2){ grid-area: tr; }
  #cards.dice5 a:nth-child(3){ grid-area: c; }
  #cards.dice5 a:nth-child(4){ grid-area: bl; }
  #cards.dice5 a:nth-child(5){ grid-area: br; }
  #cards.dice6{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:22px;
    width:100%;
    /* caps a row at 5 cards (5*200 + 4*22), so 10 pieces read as a tidy 5 x 2 block;
       as the window narrows the rows re-flow and stay centred, never left-stranded */
    max-width:1088px;
    margin-inline:auto;
  }
  #cards.dice6 .card{ width:200px; height:auto; aspect-ratio:11/16; }
  #cards.dice5 .card{ width:100%; height:auto; aspect-ratio: 11 / 16; }
  .card{
    position:relative;
    width:220px; height:320px;
    border-radius:6px;
    cursor:pointer;
    text-decoration:none;
    display:block;
    background:#0d1119;
    border:1px solid rgba(201,151,78,0.35);
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.4),
      0 20px 60px rgba(0,0,0,0.55),
      0 0 40px rgba(201,151,78,0.08);
    overflow:hidden;
    transition: transform .5s cubic-bezier(.2,.8,.2,1), box-shadow .5s ease, border-color .5s ease;
    animation: cardGlow 5.5s ease-in-out infinite;
  }
  .card img{
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .card:hover{
    transform: translateY(-6px) scale(1.015);
    border-color: rgba(232,195,131,0.75);
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.4),
      0 28px 70px rgba(0,0,0,0.6),
      0 0 70px rgba(201,151,78,0.22);
  }
  @keyframes cardGlow{
    0%, 100% { box-shadow: 0 0 0 1px rgba(0,0,0,0.4), 0 20px 60px rgba(0,0,0,0.55), 0 0 34px rgba(201,151,78,0.06); }
    50%      { box-shadow: 0 0 0 1px rgba(0,0,0,0.4), 0 20px 60px rgba(0,0,0,0.55), 0 0 52px rgba(201,151,78,0.14); }
  }

  /* Mobile: fill the width with a 2-column grid instead of a lone centered column */
  @media (max-width: 560px){
    #wrap{ padding: 28px 14px; justify-content:flex-start; }
    h1{ font-size: clamp(28px, 8vw, 40px); margin: 0 0 32px; }
    #cards.dice6{
      gap: 16px;
      max-width: 460px;
    }
    #cards.dice6 .card{ width: calc(50% - 8px); }
  }
</style>
</head>
<body>
<!-- what-is-this anchor: a quiet "?" that reveals a one-line explanation of sagne -->
<style>
  .anchor{ position:fixed; z-index:30; display:flex; gap:14px; }
  .anchor-q{ appearance:none; border:0; background:none; cursor:pointer; font-family:inherit; font-size:23px; line-height:1; color:#f2e9d8; opacity:.34; transition:opacity .45s ease; padding:4px 10px; border-radius:8px; }
  .anchor-q:hover, .anchor-q:focus-visible{ opacity:.9; }
  .anchor-q:focus-visible{ outline:1px solid rgba(242,233,216,.4); outline-offset:4px; }
  .anchor-copy{ margin:0; font-size:15px; line-height:1.65; color:#9fb2c6; opacity:0; transition:opacity .6s ease, transform .6s ease; pointer-events:none; text-wrap:pretty; }
  .anchor.pos-piece{ top:22px; right:24px; flex-direction:column; align-items:flex-end; }
  .anchor.pos-piece .anchor-copy{ max-width:min(360px,82vw); text-align:left; transform:translateY(-6px); }
  .anchor.pos-home{ left:50%; bottom:26px; transform:translateX(-50%); flex-direction:column-reverse; align-items:center; }
  .anchor.pos-home .anchor-copy{ max-width:min(680px,88vw); text-align:center; transform:translateY(6px); }
  .anchor:hover .anchor-copy, .anchor:focus-within .anchor-copy, .anchor.open .anchor-copy{ opacity:1; transform:none; }
  .anchor:hover .anchor-q, .anchor.open .anchor-q{ opacity:.9; }
  @media (prefers-reduced-motion: reduce){ .anchor-copy{ transition:opacity .2s linear; transform:none; } }
</style>
<div class="anchor pos-home" id="anchor">
  <button class="anchor-q" type="button" aria-expanded="false" aria-controls="anchor-copy" aria-label="what is this?">?</button>
  <p class="anchor-copy" id="anchor-copy">tools and toys for twiddling. no scores, no goals, no timers (except the tools which are timers), no links, no likes, no ads, no in-game purchases. nothing exciting, but hopefully something enjoyable.</p>
</div>
<script>
(function(){
  const anchor = document.getElementById('anchor');
  const btn = anchor.querySelector('.anchor-q');
  btn.addEventListener('click', () => {
    const open = anchor.classList.toggle('open');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  document.addEventListener('click', (e) => {
    if (!anchor.contains(e.target)) {
      anchor.classList.remove('open');
      btn.setAttribute('aria-expanded', 'false');
    }
  });
})();
</script>
