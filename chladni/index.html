<style>
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{ height:100%; margin:0; overflow:hidden; background:#08090b; color:#dfe6ea;
    font-family:Georgia, serif; user-select:none; }
  #backlink{ position:fixed; top:18px; left:22px; z-index:50; color:#dfe6ea; opacity:.5;
    text-decoration:none; font-size:14px; letter-spacing:.04em; text-shadow:0 1px 3px rgba(0,0,0,.85), 0 0 9px rgba(0,0,0,.55); transition:opacity .3s ease; }
  #backlink:hover{ opacity:.9; }
  /* On a phone or tablet, 100% of the page -- like 100vh -- is the whole screen
     with the browser's own address bar counted as though it weren't there, and
     nothing here can scroll, so whatever lands under that bar is unreachable.
     Measured on a Kindle's dimensions that was the hue and grain sliders, which
     are two of the four things this piece does. innerHeight is the honest number
     on every browser there is. The plate is sized off the same figure, or it
     stays scaled to a screen the visitor hasn't got. */
  #stage{ height:100%; height:calc(var(--vh, 1vh) * 100); display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:6vh 3vw 2vh; gap:3vh; }
  #plateWrap{ position:relative; width:min(calc(var(--vh, 1vh) * 72),660px,88vw); height:min(calc(var(--vh, 1vh) * 72),660px,88vw); cursor:pointer; }
  #plateWrap canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  #dock{ display:flex; align-items:center; justify-content:center; gap:16px; padding:0 22px; width:min(360px,80vw); }
  input[type=range]{ -webkit-appearance:none; appearance:none; flex:1; height:3px; border-radius:3px;
    background:rgba(223,230,234,.25); outline:none; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
    background:#dfe6ea; cursor:pointer; box-shadow:0 0 8px rgba(223,230,234,.5); }
  input[type=range]::-moz-range-thumb{ width:14px; height:14px; border:none; border-radius:50%; background:#dfe6ea; cursor:pointer; }
  .pitchIcon{ display:flex; align-items:center; gap:2px; opacity:.5; flex:0 0 auto; color:#dfe6ea; }
  #soundDock{ display:flex; align-items:center; justify-content:center; gap:12px; }
  .toggle{ display:flex; align-items:center; gap:8px; cursor:pointer; }
  .toggle input{ appearance:none; width:16px; height:16px; border:1.5px solid rgba(223,230,234,.7);
    border-radius:3px; background:transparent; position:relative; cursor:pointer; flex-shrink:0; }
  .toggle input:checked{ background:#dfe6ea; }
  .toggle input:checked::after{ content:''; position:absolute; left:4px; top:1px; width:4px; height:8px;
    border:solid #08090b; border-width:0 2px 2px 0; transform:rotate(40deg); }
  .speaker-icon{ color:#dfe6ea; flex-shrink:0; transition:color .25s ease; }
  .toggle input:not(:checked) ~ .speaker-icon{ color:#7a8388; }
  #volumeSlider{ width:100px; flex:0 0 auto; }
  /* what's on the plate — a slider, because the four really are in an order:
     coarsest and heaviest on the left, finest and lightest on the right. That
     ordering is the physics, not a filing decision. Somewhere along it the
     grain gets light enough that the air decides where it goes instead of the
     plate, and the whole figure turns inside out — but the notches are evenly
     spaced and nothing marks where that happens. Finding it is the point.

     The notches are photographs of the four substances, hers, kept as the
     whole tile she made — her call over a tighter crop into the material,
     because the tile reads more clearly at this size. Her cut-in crops are
     kept alongside as chladni-grain-*.png in case that doesn't hold up in her
     own testing; swapping back is this rule's background-image, the notch and
     thumb radii, and nothing else. The lycopodium one is deliberately the
     clubmoss plant rather than the powder: a curious person can cut the
     picture and search it, and there is nothing to see in a photograph of the
     spores themselves. No lettering on any of them. They sit at 40px because a
     photograph of flour and a photograph of sand are the same beige smudge at
     26. The slider is a real range input, so dragging, tapping a notch and the
     arrow keys all come free; its thumb is a ring that closes around whichever
     one it lands on — square, to take the shape of what it's picking up. */
  #grainDock{ position:relative; width:min(320px,86vw); height:46px; flex:0 0 auto; }
  #grainDock::before{ content:''; position:absolute; left:23px; right:23px; top:50%;
    height:3px; margin-top:-1.5px; border-radius:3px; background:rgba(223,230,234,.25); }
  #grainDock .marks{ position:absolute; inset:0; pointer-events:none; }
  #grainDock .marks i{ position:absolute; top:50%;
    left:calc(23px + (100% - 46px) * var(--i) / 3);
    transform:translate(-50%,-50%);
    width:40px; height:40px; border-radius:23%; box-sizing:border-box;
    border:1px solid rgba(223,230,234,.10);
    background-color:#1b1f24; background-size:cover; background-position:center;
    /* dimmed by brightness rather than by opacity — a translucent disc would
       let the slider's own track show straight through its face */
    filter:brightness(.62) saturate(.85); transition:filter .3s ease; }
  #grainDock .marks i.on{ filter:none; }
  #grainSlider{ position:absolute; inset:0; width:100%; height:100%; margin:0;
    flex:none; background:none; cursor:pointer; }
  #grainSlider::-webkit-slider-thumb{ -webkit-appearance:none; width:46px; height:46px;
    border-radius:26%; background:transparent; border:1.5px solid rgba(223,230,234,.8);
    box-shadow:0 0 9px rgba(223,230,234,.3); cursor:pointer; }
  #grainSlider::-moz-range-thumb{ width:43px; height:43px; border-radius:26%;
    background:transparent; border:1.5px solid rgba(223,230,234,.8); cursor:pointer; }  #densityDock{ display:flex; align-items:center; justify-content:center; gap:12px; }
  .grain-icon{ color:#dfe6ea; opacity:.6; flex-shrink:0; }
  #densitySlider{ width:100px; flex:0 0 auto; }
  #hueDock{ display:flex; align-items:center; justify-content:center; gap:12px; }
  .palette-icon{ color:#dfe6ea; opacity:.6; flex-shrink:0; }
  #hueSlider{ width:100px; flex:0 0 auto;
    background:linear-gradient(to right, hsl(0,80%,68%), hsl(60,80%,68%), hsl(120,80%,68%), hsl(180,80%,68%), hsl(240,80%,68%), hsl(300,80%,68%), hsl(360,80%,68%)); }
  #micDock{ display:flex; align-items:center; justify-content:center; gap:8px; }
  /* Everything that isn't the pitch, gathered. On a phone they stay stacked,
     one to a line, because there is no width to spend. A desktop window has
     width and nothing else to do with it, so the same five spread out onto one
     line instead of hanging under the plate as a six-rung ladder. */
  #knobs{ display:flex; flex-direction:column; align-items:center; gap:3vh; }
  @media (min-width:820px){
    #stage{ gap:2.6vh; }
    #knobs{ flex-direction:row; flex-wrap:wrap; justify-content:center;
      align-items:center; gap:22px 38px; max-width:min(1020px,92vw); }
    /* the pitch is the one that changes the figure, so it keeps a line of its
       own above the rest rather than becoming one more knob in the row */
    #dock{ order:-1; flex-basis:100%; width:auto; }
    #pitchSlider{ max-width:500px; }
  }
  .mic-icon{ color:#dfe6ea; flex-shrink:0; transition:color .25s ease; }
  .toggle input:not(:checked) ~ .mic-icon{ color:#7a8388; }
  #pitchSlider.driven{ opacity:.5; pointer-events:none; }

  /* No pulse on the pitch slider. There was one, glowing until a visitor first
     touched it, to point them at the control that changes the pattern -- which
     is exactly the nudge this site does not do. Finding that out is the point. */
</style>

<script>
(function(){
  const pick=document.getElementById('musicPick'), el=document.getElementById('musicEl'),
        btn=document.getElementById('musicBtn'), name=document.getElementById('musicName');
  let list=[], idx=0;
  const label=f=> f ? f.name.replace(/\.[^.]+$/,'') : '';
  function load(i){ if(el.src) URL.revokeObjectURL(el.src); el.src=URL.createObjectURL(list[i]); name.textContent=label(list[i]); }
  function sync(){ btn.textContent = !el.src ? '🎧' : (el.paused ? '▶' : '❚❚'); btn.classList.toggle('playing', !!el.src && !el.paused); }
  btn.addEventListener('click', ()=>{ if(!list.length){ pick.click(); return; } el.paused ? el.play() : el.pause(); });
  name.addEventListener('click', ()=> pick.click());
  pick.addEventListener('change', ()=>{ if(!pick.files.length) return; list=[...pick.files]; idx=0; el.loop=(list.length===1); load(0); el.play(); });
  el.addEventListener('ended', ()=>{ if(list.length>1){ idx=(idx+1)%list.length; load(idx); el.play(); } });
  el.addEventListener('play', sync); el.addEventListener('pause', sync); el.addEventListener('loadeddata', sync);
  sync();
})();
</script>

<script>
/* ---------- the height of the screen you can actually see ----------
   see the note on #stage. Re-measured on resize and rotation, but not while a
   text field has focus: an on-screen keyboard shrinks innerHeight. */
function setVisibleHeight(){
  const el = document.activeElement;
  if (el && el.tagName === 'INPUT' && el.type !== 'range' && el.type !== 'checkbox') return;
  document.documentElement.style.setProperty('--vh', (window.innerHeight / 100) + 'px');
}
setVisibleHeight();
window.addEventListener('resize', setVisibleHeight);
window.addEventListener('orientationchange', () => setTimeout(setVisibleHeight, 120));
document.addEventListener('focusout', () => setTimeout(setVisibleHeight, 60));
</script>
<script>
(function(){
  const wrap=document.getElementById('plateWrap');
  const canvas=document.getElementById('scene');
  const ctx=canvas.getContext('2d');
  const slider=document.getElementById('pitchSlider');


  const chkSound=document.getElementById('chkSound');
  const volumeSlider=document.getElementById('volumeSlider');
  let soundOn=true, volume=parseInt(volumeSlider.value,10)/100;
  chkSound.addEventListener('change', ()=>{
    soundOn=chkSound.checked;
    if(!soundOn && toneGain && actx){
      // cut it fast rather than waiting for the note's own decay to run out
      toneGain.gain.cancelScheduledValues(actx.currentTime);
      toneGain.gain.setTargetAtTime(0, actx.currentTime, 0.08);
    }
  });
  volumeSlider.addEventListener('input', ()=>{ volume=volumeSlider.value/100; });

  const hueSlider=document.getElementById('hueSlider');
  let hue=parseInt(hueSlider.value,10);
  hueSlider.addEventListener('input', ()=>{ hue=parseInt(hueSlider.value,10); });

  // ---------- the physics: a square plate, clamped dead-centre, driven at a
  // chosen pitch. sand doesn't get pushed by hand — it's simulated genuinely
  // rolling downhill on the vibration-amplitude landscape of whichever mode
  // is currently excited, settling into that mode's real nodal lines ----------

  // curated (m,n) mode pairs — every one gives a symmetric, satisfying figure;
  // arranged low-to-high so dragging the slider reads like sweeping a pitch
  // from a slow deep hum up to a fast fine one, the way a real plate would
  const MODES = [
    [1,2],[1,3],[2,3],[1,4],[3,4],[2,5],[1,5],[4,5],
    [3,5],[2,7],[3,7],[5,6],[4,7],[3,8],[5,8],[6,7]
  ];
  // this formula always has a pair of perfectly straight nodal lines along
  // the plate's own diagonals, for *every* (m,n) — a real mathematical
  // property, not a bug, but showing the exact same diagonal cross at
  // every single pitch reads as static/unrealistic across the sweep. A
  // small rotation per pitch (rotating the whole pattern, not the square
  // plate it's clipped against) breaks that up — real plates driven off-
  // centre or asymmetrically don't line up on the geometric diagonal
  // either — while a rotation about the origin still keeps the centre
  // point exactly on a node, so the clamp there stays physically honest
  const ROT_DEG = [0,14,-10,22,8,-18,15,-6,20,-24,6,17,-9,19,-13,11];
  let rotRad=0;

  function pattern(m,n,x,y){
    // classic square-plate Chladni approximation — zero along the nodal
    // lines, and always zero dead-centre regardless of (m,n), matching a
    // plate genuinely clamped at its middle
    if(rotRad){
      const c=Math.cos(rotRad), s=Math.sin(rotRad);
      const rx=x*c-y*s, ry=x*s+y*c;
      x=rx; y=ry;
    }
    return Math.cos(n*Math.PI*x)*Math.cos(m*Math.PI*y) - Math.cos(m*Math.PI*x)*Math.cos(n*Math.PI*y);
  }

  let W=0,H=0,side=0,cx=0,cy=0,DPR=1;
  function resize(){
    DPR=Math.min(2,window.devicePixelRatio||1);
    const r=wrap.getBoundingClientRect();
    W=canvas.width=Math.round(r.width*DPR);
    H=canvas.height=Math.round(r.height*DPR);
    side=Math.min(W,H)*0.82;
    cx=W/2; cy=H/2;
  }
  resize();
  window.addEventListener('resize', resize);

  // plate-normalized coords: x,y in [-1,1] map to the square's own extent
  function toNorm(px,py){ return [ (px-cx)/(side/2), (py-cy)/(side/2) ]; }
  function toPx(x,y){ return [ cx+x*side/2, cy+y*side/2 ]; }

  // ---------- the driving tone — a real Chladni plate is driven by an
  // actual pitch (bow or speaker), which is *why* the sand reorganises;
  // without an audible tone the shape-change reads as unmotivated, so the
  // slider genuinely plays the pitch it's set to, not just a silent knob ----------
  let actx=null, osc=null, toneGain=null, audioReady=false, toneTimer=null;
  function ensureAudio(){
    if(audioReady) return;
    audioReady=true;
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return;
    actx=new AC();
    osc=actx.createOscillator();
    osc.type='sine';
    toneGain=actx.createGain();
    toneGain.gain.value=0;
    osc.connect(toneGain); toneGain.connect(actx.destination);
    osc.start();
  }
  function freqForIdx(idx){
    const t=idx/(MODES.length-1);
    // musical (exponential) sweep — a low hum up to a clear, not shrill, high tone
    return 110*Math.pow(640/110, t);
  }
  function soundTone(freq, peak, hold, decay){
    ensureAudio();
    if(!actx) return;
    if(actx.state==='suspended') actx.resume();
    const now=actx.currentTime;
    osc.frequency.cancelScheduledValues(now);
    osc.frequency.setTargetAtTime(freq, now, 0.035);
    const target=soundOn ? peak*volume : 0;
    toneGain.gain.cancelScheduledValues(now);
    toneGain.gain.setTargetAtTime(target, now, 0.02);
    clearTimeout(toneTimer);
    toneTimer=setTimeout(()=>{
      if(toneGain) toneGain.gain.setTargetAtTime(0, actx.currentTime, decay);
    }, hold);
  }
  // while actually dragging (pointer held on the slider), hold the tone
  // sustained rather than re-arming a short hold timer on every 'input' —
  // a real drag doesn't fire events at a steady rate, so a short hold could
  // let the note gap out audibly mid-drag even though the hand never left
  // the slider; sustaining ends only on release
  let sliderDragging=false;
  function sustainTone(freq){
    ensureAudio();
    if(!actx) return;
    if(actx.state==='suspended') actx.resume();
    const now=actx.currentTime;
    clearTimeout(toneTimer);
    osc.frequency.cancelScheduledValues(now);
    osc.frequency.setTargetAtTime(freq, now, 0.035);
    toneGain.gain.cancelScheduledValues(now);
    toneGain.gain.setTargetAtTime(soundOn ? 0.05*volume : 0, now, 0.03);
  }
  function releaseTone(decay){
    if(!actx) return;
    clearTimeout(toneTimer);
    toneGain.gain.cancelScheduledValues(actx.currentTime);
    toneGain.gain.setTargetAtTime(0, actx.currentTime, decay);
  }

  let modeIdx=0, m=MODES[0][0], n=MODES[0][1];
  let exciteAt=performance.now();
  function setMode(idx){
    modeIdx=idx;
    m=MODES[idx][0]; n=MODES[idx][1];
    rotRad=(ROT_DEG[idx]||0)*Math.PI/180;
    exciteAt=performance.now();
  }
  slider.addEventListener('pointerdown', ()=>{ sliderDragging=true; sustainTone(freqForIdx(modeIdx)); });
  window.addEventListener('pointerup', ()=>{ if(sliderDragging){ sliderDragging=false; releaseTone(0.35); } });
  slider.addEventListener('input', ()=>{
    const idx=Math.round((slider.value/1000)*(MODES.length-1));
    if(sliderDragging){
      // just retune the sustained note to the new pitch, don't re-trigger
      // its own hold/decay cycle
      sustainTone(freqForIdx(idx));
    } else {
      // keyboard-driven (arrow keys, no pointer down) — a short beep per step
      soundTone(freqForIdx(idx), 0.05, 140, 0.3);
    }
    if(idx!==modeIdx) setMode(idx);
  });
  wrap.addEventListener('pointerdown', (e)=>{
    // tapping the plate itself re-strikes it at the current pitch — a
    // little bit of mindless, satisfying re-scatter, no menu needed
    exciteAt=performance.now();
    soundTone(freqForIdx(modeIdx), 0.09, 220, 0.6);
  });

  // ---------- microphone ----------
  // listens to whatever's actually in the room and drives the plate from
  // the loudest pitch it can find, the way a real plate would respond to a
  // speaker or a bowed edge — the pitch slider just goes along for the ride
  // (and turns non-interactive) while this is on
  const chkMic=document.getElementById('chkMic');
  let micStream=null, analyser=null, micBuf=null, micTimer=null;

  // classic autocorrelation pitch-detector (time-domain, no external
  // library) — finds the lag that best repeats the waveform against
  // itself, which is the fundamental period of whatever pitch is loudest
  function autoCorrelate(buf, sampleRate){
    const SIZE=buf.length;
    let rms=0;
    for(let i=0;i<SIZE;i++) rms+=buf[i]*buf[i];
    rms=Math.sqrt(rms/SIZE);
    if(rms<0.01) return -1; // too quiet to bother
    let r1=0, r2=SIZE-1;
    const thres=0.2;
    for(let i=0;i<SIZE/2;i++){ if(Math.abs(buf[i])<thres){ r1=i; break; } }
    for(let i=1;i<SIZE/2;i++){ if(Math.abs(buf[SIZE-i])<thres){ r2=SIZE-i; break; } }
    const trimmed=buf.slice(r1,r2);
    const n=trimmed.length;
    const c=new Float32Array(n);
    for(let i=0;i<n;i++){ for(let j=0;j<n-i;j++) c[i]+=trimmed[j]*trimmed[j+i]; }
    let d=0; while(d<n-1 && c[d]>c[d+1]) d++;
    let maxval=-1, maxpos=-1;
    for(let i=d;i<n;i++){ if(c[i]>maxval){ maxval=c[i]; maxpos=i; } }
    if(maxpos<=0) return -1;
    let T0=maxpos;
    const x1=c[T0-1]||0, x2=c[T0], x3=c[T0+1]||0;
    const a=(x1+x3-2*x2)/2, b=(x3-x1)/2;
    if(a) T0=T0-b/(2*a);
    return T0>0 ? sampleRate/T0 : -1;
  }

  function freqToIdx(freq){
    const t=Math.log(freq/110)/Math.log(640/110);
    return Math.max(0, Math.min(MODES.length-1, Math.round(t*(MODES.length-1))));
  }

  function setDriven(v){
    slider.classList.toggle('driven', v);
  }

  function stopMic(){
    if(micTimer){ clearInterval(micTimer); micTimer=null; }
    if(micStream){ micStream.getTracks().forEach(t=>t.stop()); micStream=null; }
    analyser=null; micBuf=null;
    setDriven(false);
  }

  chkMic.addEventListener('change', async ()=>{
    if(chkMic.checked){
      try{
        micStream=await navigator.mediaDevices.getUserMedia({audio:true});
        ensureAudio();
        if(!actx) throw new Error('no audio context');
        const src=actx.createMediaStreamSource(micStream);
        analyser=actx.createAnalyser();
        analyser.fftSize=2048;
        // analysis only — never connect to destination, or the mic would
        // feed straight back out through the speakers
        src.connect(analyser);
        micBuf=new Float32Array(analyser.fftSize);
        setDriven(true);
        micTimer=setInterval(()=>{
          analyser.getFloatTimeDomainData(micBuf);
          const freq=autoCorrelate(micBuf, actx.sampleRate);
          if(freq>0){
            const clamped=Math.max(110,Math.min(640,freq));
            const idx=freqToIdx(clamped);
            slider.value=Math.round(idx/(MODES.length-1)*1000);
            if(idx!==modeIdx) setMode(idx);
          }
        }, 120);
      }catch(e){
        // permission denied, no mic, or an insecure context — revert
        // quietly rather than showing an error the owner can't act on
        chkMic.checked=false;
        stopMic();
      }
    } else {
      stopMic();
    }
  });

  // ---------- sand ----------
  // a big fixed pool, pre-seeded once — the density slider just decides how
  // many of the pool are simulated/drawn each frame (a plain prefix of the
  // same array), so dragging it never re-scatters or re-allocates anything
  // the old bottom (700) went nearly invisible once a pitch's nodal lines
  // got long enough to spread it thin — the old middle reads as a light
  // dusting instead, so that's the new floor; the top is raised well past
  // the old ceiling for a genuinely thick, heavy-pour extreme
  const NMAX = 15000, N_MIN = 5000, N_DEFAULT = 9400;
  let activeN = N_DEFAULT;
  const px = new Float32Array(NMAX), py = new Float32Array(NMAX);
  const vx = new Float32Array(NMAX), vy = new Float32Array(NMAX);
  const gsize = new Float32Array(NMAX);

  // ---------- what's on the plate ----------
  // Two families, and the difference between them is a real inversion of the
  // figure, not a change of colour.
  //
  //   Heavy grains — sand, salt — are thrown into the air wherever the plate is
  //   moving and land wherever it isn't, so they end up piled along the nodal
  //   lines. That's the classic Chladni figure, and it's what this plate did
  //   before there was anything to choose.
  //
  //   Very fine powder — lycopodium spores, fine flour — is too light to be
  //   thrown. The shaking plate stirs the air just above it into small standing
  //   vortices (acoustic streaming), and that flow sweeps the powder off the
  //   nodes and heaps it at the antinodes instead: the same pattern, inside
  //   out. Chladni saw both; Faraday worked out why, in 1831.
  //
  // seek: +1 gathers at the nodes, -1 at the antinodes. Everything else is that
  // substance's own body — how coarse the grain is, how readily it moves, how
  // much the air drags on it, and its own colour, which the colour slider is
  // still free to override afterwards.
  //
  // One thing here is a drawing decision and not a physical one, and it looks
  // backwards written down: the powders are drawn with the *bigger*, softer,
  // fainter marks. There are only ten thousand or so particles to go round, and
  // the heavy families spend them on thin lines where they read as grains,
  // while a powder spreads its own over a third of the plate. So each powder
  // mark stands for a clump of the stuff rather than one spore — otherwise a
  // bed of lycopodium comes out as a sparse speckle of dots, which is exactly
  // what it isn't.
  const SUBSTANCES = [
    { seek:+1, hue:42, sat:68, light:78, alpha:0.95, size:[0.55,1.45], drift:3.1, jitter:9.0, damp:0.86, blur:1.00, crowd:0   }, // sand
    { seek:+1, hue:46, sat:22, light:90, alpha:0.95, size:[0.85,1.15], drift:3.4, jitter:8.0, damp:0.84, blur:0.85, crowd:0   }, // salt
    { seek:-1, hue:48, sat:60, light:74, alpha:0.70, size:[1.80,3.60], drift:2.4, jitter:6.0, damp:0.80, blur:2.20, crowd:0.9, pack:3.0 }, // lycopodium
    { seek:-1, hue:40, sat:18, light:93, alpha:0.66, size:[1.70,3.40], drift:2.1, jitter:5.5, damp:0.78, blur:2.50, crowd:1.1, pack:2.6 }, // fine flour
  ];
  let subIdx=0, sub=SUBSTANCES[0];

  function pour(){
    for(let i=0;i<NMAX;i++){
      // start scattered across the whole plate, uniform in x/y (not polar,
      // so corners get grains too) — first excite sweeps it into shape
      px[i]=(Math.random()*2-1);
      py[i]=(Math.random()*2-1);
      vx[i]=0; vy[i]=0;
      gsize[i]=sub.size[0]+Math.random()*(sub.size[1]-sub.size[0]);
    }
  }
  pour();

  const grainSlider=document.getElementById('grainSlider');
  const marks=[].slice.call(document.querySelectorAll('#grainDock .marks i'));
  const SUB_NAMES=['sand','salt','lycopodium','fine flour'];
  function setSubstance(i){
    subIdx=i; sub=SUBSTANCES[i];
    marks.forEach((m,j)=> m.classList.toggle('on', j===i));
    grainSlider.setAttribute('aria-valuetext', SUB_NAMES[i]);
    // sweeping the plate clear and pouring the new one on is the whole gesture,
    // and it comes with its own colour — which the colour slider can still move
    hue=sub.hue; hueSlider.value=String(sub.hue);
    pour();
    exciteAt=performance.now();   // and its own strike, so it settles at once
  }
  grainSlider.addEventListener('input', ()=>{
    const i=+grainSlider.value;
    if(i!==subIdx) setSubstance(i);
  });
  // the strike sounds when the hand comes off, not once per notch on the way
  // past — dragging the length of it would otherwise fire four in a second
  grainSlider.addEventListener('change', ()=> soundTone(freqForIdx(modeIdx), 0.09, 220, 0.6));
  setSubstance(0);

  const densitySlider=document.getElementById('densitySlider');
  densitySlider.addEventListener('input', ()=>{
    const t=densitySlider.value/100;
    activeN=Math.round(N_MIN+(NMAX-N_MIN)*t);
  });

  // ---------- crowding: a heap has volume ----------
  // The heavy families gather along the nodal *lines*, and a line has room —
  // jitter alone gives those their real width. The powders gather at antinode
  // *points*, and nothing in the flow above stops a grain once it arrives, so
  // without a pile every last one would end up at the same infinitesimal spot:
  // bare metal with a scatter of dots on it, which is not what lycopodium does.
  // So the powders carry the pile itself — a coarse count of how much is
  // already in each patch of plate, and a shove down that count's own slope.
  //
  // Only once it's actually heaped, though: loose powder lying thin doesn't
  // push on itself at all, so nothing acts until a patch holds more than
  // `pack` times an even spread. That threshold is what keeps the nodal lines
  // swept clean — grains crossing one are never crowded back onto it — and it
  // sets how far a heap spreads: at pack 3 it broadens until it covers about a
  // third of the plate, which is roughly the room the antinodes give it.
  const CG=96, cellCount=new Int32Array(CG*CG);
  const cellPile=new Float32Array(CG*CG);
  function cellXY(v){ return Math.min(CG-1, Math.max(0, ((v+1)*0.5*CG)|0)); }

  const EPS=0.01;
  function grad(x,y){
    const f0=pattern(m,n,x,y);
    const fx=(pattern(m,n,x+EPS,y)-f0)/EPS;
    const fy=(pattern(m,n,x,y+EPS)-f0)/EPS;
    return [f0,fx,fy];
  }

  let last=performance.now();
  function step(now){
    const dt=Math.min(0.033,(now-last)/1000); last=now;
    const age=(now-exciteAt)/1000;
    // agitation: sharp jolt right at strike, decaying over a couple of
    // seconds as the plate's real ring-down would — never fully to zero,
    // so settled sand still has a faint live shimmer
    const agitation = 0.055 + 1.6*Math.exp(-age*1.6);

    if(sub.crowd){
      cellCount.fill(0);
      for(let i=0;i<activeN;i++) cellCount[cellXY(py[i])*CG+cellXY(px[i])]++;
      // how much each patch is holding over and above what it can lie flat in
      const evenly=(CG*CG)/activeN;   // scales a count so that 1 means "an even spread"
      for(let c=0;c<cellPile.length;c++) cellPile[c]=Math.max(0, cellCount[c]*evenly-sub.pack);
    }

    for(let i=0;i<activeN;i++){
      let x=px[i], y=py[i];
      const [f,fx,fy]=grad(x,y);
      // move toward the nearest nodal line at a speed based on how far off
      // it the grain is (|f|), in the *direction* the gradient points —
      // but not scaled by how steep that gradient is. A higher pitch's
      // pattern is spatially finer, so its raw gradient is naturally much
      // steeper; scaling force by that steepness either explodes (if
      // unclamped) or, once clamped for safety, ends up weaker than low
      // pitches (clamped against a much bigger number) — this normalises
      // the direction first so every pitch converges at the same real speed
      const gmag=Math.hypot(fx,fy)||1e-6;
      const ux=fx/gmag, uy=fy/gmag;
      const af=Math.abs(f);
      let dirSign, speed, amp;
      if(sub.seek>0){
        // heavy: downhill to the nearest node, fastest where the plate is
        // loudest, and dead still once it gets there
        dirSign = f>0 ? -1 : 1;
        speed = sub.drift*Math.min(1, af*1.1);
        // jitter scaled by the plate's local amplitude — grains sitting on an
        // antinode dance hard, ones already on a node barely move
        amp = Math.min(1, af*1.4);
      } else {
        // light: uphill instead, away from the node and on to the nearest
        // crest of the standing wave, which is where the stirred air is taking
        // it. The push is hardest exactly on the nodal line (nothing settles
        // there) and fades to nothing at the crest, so that's where it heaps.
        // |f| runs to 2 at a crest, which is what normalises both of these.
        dirSign = f>0 ? 1 : -1;
        const toCrest=Math.max(0, 1-af/2);
        speed = sub.drift*toCrest;
        // and it's restless over the swept nodes, calm in the heaps
        amp = 0.30 + 0.45*toCrest;
      }
      vx[i] += dirSign*ux*speed*dt;
      vy[i] += dirSign*uy*speed*dt;
      const jitter=agitation*amp;
      vx[i] += (Math.random()*2-1)*jitter*dt*sub.jitter;
      vy[i] += (Math.random()*2-1)*jitter*dt*sub.jitter;
      if(sub.crowd){
        const ix=cellXY(x), iy=cellXY(y);
        const l=cellPile[iy*CG+Math.max(0,ix-1)],  r=cellPile[iy*CG+Math.min(CG-1,ix+1)];
        const u=cellPile[Math.max(0,iy-1)*CG+ix],  d=cellPile[Math.min(CG-1,iy+1)*CG+ix];
        // clamped, so a freshly-poured clump can't fling anything off the plate
        const gx=Math.max(-8,Math.min(8,r-l)), gy=Math.max(-8,Math.min(8,d-u));
        vx[i] -= sub.crowd*gx*dt;
        vy[i] -= sub.crowd*gy*dt;
      }
      // damping — the air drags harder on the fine stuff
      vx[i]*=sub.damp; vy[i]*=sub.damp;
      // hard speed limit, independent of pitch — nothing can ever tunnel
      // across the plate in one step, regardless of how fine the pattern is
      const vmag=Math.hypot(vx[i],vy[i]), vmax=2.4;
      if(vmag>vmax){ vx[i]*=vmax/vmag; vy[i]*=vmax/vmag; }
      x+=vx[i]*dt; y+=vy[i]*dt;
      // clamp to the plate's square bounds, killing outward velocity
      if(x<-1){x=-1;vx[i]=Math.abs(vx[i])*0.4;} if(x>1){x=1;vx[i]=-Math.abs(vx[i])*0.4;}
      if(y<-1){y=-1;vy[i]=Math.abs(vy[i])*0.4;} if(y>1){y=1;vy[i]=-Math.abs(vy[i])*0.4;}
      px[i]=x; py[i]=y;
    }
    draw();
    requestAnimationFrame(step);
  }

  function drawPlate(){
    ctx.clearRect(0,0,W,H);
    const half=side/2;
    // soft ambient glow under the plate
    const glow=ctx.createRadialGradient(cx,cy,half*0.2,cx,cy,half*1.5);
    glow.addColorStop(0,'rgba(180,190,200,0.07)');
    glow.addColorStop(1,'rgba(180,190,200,0)');
    ctx.fillStyle=glow;
    ctx.fillRect(cx-half*1.6,cy-half*1.6,half*3.2,half*3.2);

    // brushed steel plate
    const g=ctx.createLinearGradient(cx-half,cy-half,cx+half,cy+half);
    g.addColorStop(0,'#3a3f45');
    g.addColorStop(0.35,'#5b6169');
    g.addColorStop(0.5,'#6b727a');
    g.addColorStop(0.65,'#4d525a');
    g.addColorStop(1,'#2c3035');
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,0.6)';
    ctx.shadowBlur=side*0.06;
    ctx.shadowOffsetY=side*0.02;
    ctx.fillStyle=g;
    ctx.fillRect(cx-half,cy-half,side,side);
    ctx.restore();

    // faint brushed-metal streaks
    ctx.save();
    ctx.beginPath(); ctx.rect(cx-half,cy-half,side,side); ctx.clip();
    ctx.globalAlpha=0.05;
    ctx.strokeStyle='#eef2f5';
    for(let i=0;i<26;i++){
      const yy=cy-half+ (i/26)*side + (Math.random()-0.5)*4;
      ctx.beginPath(); ctx.moveTo(cx-half,yy); ctx.lineTo(cx+half,yy+ (Math.random()-0.5)*6); ctx.lineWidth=1; ctx.stroke();
    }
    ctx.restore();

    // bevel edge
    ctx.strokeStyle='rgba(0,0,0,0.5)';
    ctx.lineWidth=Math.max(1,side*0.006);
    ctx.strokeRect(cx-half,cy-half,side,side);
    ctx.strokeStyle='rgba(255,255,255,0.08)';
    ctx.lineWidth=Math.max(1,side*0.003);
    ctx.strokeRect(cx-half+1,cy-half+1,side-2,side-2);

    // centre clamp bolt
    const r=side*0.028;
    const bg=ctx.createRadialGradient(cx-r*0.3,cy-r*0.3,r*0.1,cx,cy,r);
    bg.addColorStop(0,'#9aa0a6'); bg.addColorStop(1,'#33373c');
    ctx.fillStyle=bg;
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.5)'; ctx.lineWidth=1; ctx.stroke();
  }

  // grains are drawn onto their own offscreen layer first, crisp and cheap
  // (thousands of tiny fillRects), then composited onto the plate with a
  // single blur pass — real sand isn't a field of hard-edged squares, and
  // at a heavy pour it should soften and glow together rather than read as
  // a grid of dots; blurring once per frame as a composite is far cheaper
  // than filtering every individual grain
  let grainCanvas=null, grainCtx=null;
  function ensureGrainCanvas(){
    if(grainCanvas && grainCanvas.width===W && grainCanvas.height===H) return;
    grainCanvas=document.createElement('canvas');
    grainCanvas.width=W; grainCanvas.height=H;
    grainCtx=grainCanvas.getContext('2d');
  }

  function draw(){
    drawPlate();
    ensureGrainCanvas();
    grainCtx.clearRect(0,0,W,H);
    // same soft, pale character at every hue — only the hue itself moves,
    // so it always still reads as fine sand, never a saturated paint colour
    grainCtx.fillStyle=`hsla(${hue}, ${sub.sat}%, ${sub.light}%, ${sub.alpha})`;
    for(let i=0;i<activeN;i++){
      const [x,y]=toPx(px[i],py[i]);
      const s=gsize[i]*DPR*1.1;
      grainCtx.fillRect(x-s/2,y-s/2,s,s);
    }
    // more blur as density rises — a light dusting stays crisp, individual
    // grains; a heavy pour softens into a real, fuzzy-edged glow
    const densityT=Math.max(0,Math.min(1,(activeN-N_MIN)/(NMAX-N_MIN)));
    // powder is a dust, not a scatter of grains — it softens further
    const blur=(0.25+densityT*1.5)*DPR*sub.blur;
    ctx.save();
    ctx.filter=`blur(${blur.toFixed(2)}px)`;
    ctx.drawImage(grainCanvas,0,0);
    ctx.restore();
  }

  requestAnimationFrame(step);
})();
</script>

<script>
(function(){
  var disc=document.getElementById('shelfdisc'), box=document.getElementById('plates');
  var rows=[].slice.call(box.querySelectorAll('.row'));
  function unroll(){ rows.forEach(function(r){ r.classList.remove('rolled'); }); }
  function shut(){ box.classList.remove('open'); disc.setAttribute('aria-expanded','false'); unroll(); }

  disc.addEventListener('click', function(ev){
    ev.stopPropagation();
    var open=box.classList.toggle('open');
    disc.setAttribute('aria-expanded', open?'true':'false');
    if(!open) unroll();
  });

  // Same bargain the case itself strikes: a mouse can hover, so a plate is a link
  // straight to its shelf. A thumb cannot, so the first tap on a plate rolls its
  // pieces out and only the second one goes to the shelf.
  var FINE=matchMedia('(hover: hover) and (pointer: fine)');
  rows.forEach(function(row){
    row.querySelector('.tag').addEventListener('click', function(ev){
      if(FINE.matches) return;
      if(row.classList.contains('rolled')) return;
      ev.preventDefault();
      unroll(); row.classList.add('rolled');
    });
  });

  document.addEventListener('click', function(ev){
    if(!box.contains(ev.target) && ev.target!==disc) shut();
  });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') shut(); });
})();
</script>
