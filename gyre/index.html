<style>
  :root{ --bg1:#0f1420; --bg2:#1c2433; --brass:#c9974e; --parchment:#f2e9d8; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{ height:100%; margin:0; overflow:hidden;
    background: radial-gradient(ellipse at 50% 40%, var(--bg2) 0%, var(--bg1) 80%);
    font-family: Georgia, serif; color:var(--parchment); }
  #backlink{ position:fixed; top:18px; left:22px; z-index:50; color:var(--parchment); opacity:.5; text-decoration:none; font-size:14px; letter-spacing:.04em; text-shadow:0 1px 3px rgba(0,0,0,.85), 0 0 9px rgba(0,0,0,.55); transition:opacity .3s ease; }
  #backlink:hover{opacity:.9;}
  canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #dock{ position:fixed; bottom:0; left:0; right:0; display:flex; align-items:center; justify-content:center; gap:16px;
    padding:14px 18px 24px; background:linear-gradient(to top, rgba(10,13,20,.9), rgba(10,13,20,0)); z-index:40; }
  .toggle{ display:flex; align-items:center; gap:8px; cursor:pointer; }
  .toggle input{ appearance:none; -webkit-appearance:none; width:40px; height:22px; border-radius:11px; background:rgba(242,233,216,.2); position:relative; cursor:pointer; transition:background .25s; outline:none; }
  .toggle input:checked{ background:rgba(201,151,78,.55); }
  .toggle input::after{ content:''; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:var(--parchment); transition:left .22s; }
  .toggle input:checked::after{ left:20px; background:#fff2d8; }
  .glyph{ font-size:15px; opacity:.85; }
  .divider{ width:1px; height:24px; background:rgba(242,233,216,.2); }
  #speedRow{ display:flex; align-items:center; gap:10px; }
  /* The row wants 322px laid out end to end and never wrapped, so on a narrow
     screen it ran off BOTH edges -- the run toggle sat 41px to the left of the
     glass at 240. Below 380 the toggle and the speed take a line each; below
     280 the slider gives up some length as well, because a line of its own is
     still not enough down there. */
  @media (max-width: 379px){ #dock{ flex-wrap:wrap; row-gap:12px; } }
  @media (max-width: 280px){ #speedSlider{ width:120px; } }
  input[type=range]{ -webkit-appearance:none; appearance:none; width:160px; height:3px; border-radius:3px; background:rgba(242,233,216,.25); outline:none; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:14px; height:14px; border-radius:50%; background:var(--brass); cursor:pointer; box-shadow:0 0 6px rgba(201,151,78,.6); }

<style>
  #music{ position:fixed; left:18px; bottom:16px; z-index:60; display:flex; align-items:center; gap:9px; }
  #musicBtn{ width:34px; height:34px; border-radius:50%; border:1px solid rgba(242,233,216,.25); background:rgba(20,24,34,.55); color:#f2e9d8; font-size:15px; line-height:1; cursor:pointer; opacity:.55; transition:opacity .3s, color .3s, border-color .3s; -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); }
  #musicBtn:hover{ opacity:1; }
  #musicBtn.playing{ color:#f0d69a; border-color:rgba(201,151,78,.6); opacity:.9; }
  #musicName{ max-width:40vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; color:#f2e9d8; opacity:0; transition:opacity .3s; letter-spacing:.02em; cursor:pointer; }
  #music:hover #musicName{ opacity:.55; }
  /* a phone has no hover, so the name of the visitor's own track was never
     visible on one at all -- and worse, an invisible thing sat there taking
     taps. While something is playing it simply shows, next to the button.
     Not a caption on the piece: it is their file's name, not the site's words. */
  #musicBtn.playing ~ #musicName{ opacity:.5; }
  /* The music button is pinned in the bottom-left corner and the piece's own
     dock runs the width of the screen, so on a narrow one they land on top of
     each other -- and the button wins, being the higher layer. Rather than
     reshape the dock, the furniture gives way: the headphones sit just above
     it. The offset is this dock's own measured height plus a little. */
  @media (max-width: 420px){ #music{ bottom:74px; } }
  /* below 380 the dock wraps to two lines and grows to 96 */
  @media (max-width: 379px){ #music{ bottom:104px; } }

<div id="music" title="play your own music">
  <button id="musicBtn" aria-label="play your own music">🎧</button>
  <span id="musicName"></span>
</div>
<input type="file" id="musicPick" accept="audio/*" multiple hidden>
<audio id="musicEl"></audio>
<script>
(function(){
  const pick=document.getElementById('musicPick'), el=document.getElementById('musicEl'),
        btn=document.getElementById('musicBtn'), name=document.getElementById('musicName');
  let list=[], idx=0;
  const label=f=> f ? f.name.replace(/\.[^.]+$/,'') : '';
  function load(i){ if(el.src) URL.revokeObjectURL(el.src); el.src=URL.createObjectURL(list[i]); name.textContent=label(list[i]); }
  function sync(){ btn.textContent = !el.src ? '🎧' : (el.paused ? '▶' : '❚❚'); btn.classList.toggle('playing', !!el.src && !el.paused); }
  btn.addEventListener('click', ()=>{ if(!list.length){ pick.click(); return; } el.paused ? el.play() : el.pause(); });
  name.addEventListener('click', ()=> pick.click());
  pick.addEventListener('change', ()=>{ if(!pick.files.length) return; list=[...pick.files]; idx=0; el.loop=(list.length===1); load(0); el.play(); });
  el.addEventListener('ended', ()=>{ if(list.length>1){ idx=(idx+1)%list.length; load(idx); el.play(); } });
  el.addEventListener('play', sync); el.addEventListener('pause', sync); el.addEventListener('loadeddata', sync);
  sync();
})();
</script>
<canvas id="scene"></canvas>
<div id="dock">
  <label class="toggle" title="run"><span class="glyph">⚙</span><input type="checkbox" id="runChk" checked aria-label="run"></label>
  <div class="divider"></div>
  <div id="speedRow"><span class="glyph">🐢</span><input type="range" id="speedSlider" min="0" max="100" value="42" aria-label="speed"><span class="glyph">🐇</span></div>
</div>
<script>
(function(){
  const canvas=document.getElementById('scene'), ctx=canvas.getContext('2d');
  const runChk=document.getElementById('runChk'), speedSlider=document.getElementById('speedSlider');
  // W and H are the board's size in BOARD UNITS, not screen pixels, and SCALE is
  // what stands between them. Everything below -- gear radii, the lamp's
  // footprint, the tray, hit tests -- is written in board units and none of it
  // knows the screen exists.
  //
  // It has to be this way round because the lamp box is 353 board units across
  // and every gear is sized off one fixed MODULE, so on a 240px phone the box was
  // WIDER THAN THE WHOLE SCREEN and a 40-tooth gear came out 227px. Scaling the
  // lamp alone is not available: its two gears are deliberately built to the same
  // MODULE as every other gear so they can mesh with them, and shrinking one side
  // of a mesh is not a thing a mesh survives. So the whole board zooms out
  // together, which keeps every tooth in step and is the only version of this
  // that is still a gear train.
  const BOARD_MIN_W=620, BOARD_MIN_H=560;   // room to lay the lamp down and drive a train into it
  let W=0,H=0,DPR=1,SCALE=1;

  const MODULE=5.4, ADD=MODULE, DED=1.25*MODULE;
  const pitchR=N=>MODULE*N/2, outerR=N=>pitchR(N)+ADD;
  const MESH_TOL=7;      // teeth engage within this of the exact centre distance
  const SNAP_TOL=18;     // on drop, if this close to a valid mesh, nudge to exact distance

  // shared placement counter across BOTH gears and lamps, so whichever
  // piece was set down more recently draws on top of the other — a
  // lamp box is a solid object on the board just like a gear, not a
  // fixed frame that everything else has to sit behind.
  let placeOrder=0;
  let gears=[], idc=0;
  const mk=(N,x,y,fixed)=>({id:idc++,N,x,y,angle:0,fixed:!!fixed,zOrder:placeOrder++});

  // ---- signal-lamp: a real-photo box+lights piece whose screw is its only connection to
  // the gear train (see lamp geometry block below, near the sprite/drawing code)
  let lamps=[], lampIdc=0;
  const mkLamp=(x,y)=>({id:lampIdc++,x,y,facing:0,bigAngle:-0.113,smallAngle:Math.PI/10,phase:0,speed:0,engaged:false,zOrder:placeOrder++});
  const lampPreview=mkLamp(0,0);   // static, never added to lamps[] — only used to draw the tray's catalogue icon (box + its gears + screw), so the picker shows what you're actually picking

  const TRAY=[8,12,16,22,30,40];
  const TRAY_MAX=Math.max(...TRAY);   // the biggest gear sets the scale the rack is drawn at
  let trayRects=[], lampTrayRect=null;
  function layoutTray(){
    const n=TRAY.length+1;
    // On a screen wider than it is tall the parts stand in a column down the left
    // -- her call, and the room it frees is the point: the tray used to run across
    // the top, which is the whole width of the board it is there to help you fill.
    // The band the column has to live in: clear of the brass disc at the top and
    // of the dock and the music button at the bottom. Both are pinned in SCREEN
    // pixels, so how much of the BOARD they eat depends on the zoom -- which is
    // why this is measured rather than assumed. On a 3in phone turned sideways
    // the band is 156 units against the 308 seven parts need, and the column
    // simply does not fit; there it stays a row across the top rather than
    // running off the bottom of the board.
    const bandTop=60/SCALE, bandBot=H-70/SCALE, band=bandBot-bandTop;
    if(W>H && band>=n*44){
      const slot=Math.min(70,band/n);
      const x=Math.max(slot*0.62+18, 30);
      const y0=bandTop+(band-n*slot)/2;
      // the lamp stands at the head of the column -- her call -- and the gears keep
      // the order they were already in, smallest first, behind it
      lampTrayRect={cx:x, cy:y0+slot/2, hit:slot*0.42};
      trayRects=TRAY.map((N,i)=>({N,cx:x,cy:y0+slot*(i+1)+slot/2,hit:slot*0.42}));
      return;
    }
    const slot=Math.min(70,(W*0.82)/n), x0=W/2-(n*slot)/2;
    // The two brass discs are pinned in the top corners in SCREEN pixels, so the
    // further the board is zoomed out the further down it they reach -- on a 3in
    // phone the first gear sat under the back arrow and the lamp under the shelf
    // disc, which is the half-on-half-off reading her conometer rule calls a
    // mistake. The row drops below them. At full zoom this moves it 3px and
    // nothing else.
    const y=Math.max(92, 60/SCALE + slot/2);
    // a row has no top, so the head of it is the near end: the lamp leads here too
    lampTrayRect={cx:x0+slot/2, cy:y, hit:slot*0.42};
    trayRects=TRAY.map((N,i)=>({N,cx:x0+slot*(i+1)+slot/2,cy:y,hit:slot*0.42}));
  }
  let inited=false;
  function initGears(){
    if(inited) return; inited=true;
    const cx=W*0.5, cy=H*0.5;
    const D=mk(20,cx,cy,true);           // driver
    const B=mk(12,cx+(pitchR(20)+pitchR(12)),cy,false);                                        // right
    const C=mk(30,cx-(pitchR(20)+pitchR(30))*0.5, cy+(pitchR(20)+pitchR(30))*0.866, false);    // lower-left
    const E=mk(16,cx, cy-(pitchR(20)+pitchR(16)), false);                                      // top
    gears=[D,B,C,E];
  }
  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    const vw=window.innerWidth, vh=window.innerHeight;
    // never zooms IN: at 1 the board is pixel-for-pixel what it always was, so a
    // desktop is untouched and only a screen too small to hold the pieces zooms out
    SCALE=Math.min(1, vw/BOARD_MIN_W, vh/BOARD_MIN_H);
    W=vw/SCALE; H=vh/SCALE;
    canvas.width=vw*DPR; canvas.height=vh*DPR;
    ctx.setTransform(DPR*SCALE,0,0,DPR*SCALE,0,0);
    layoutTray(); initGears();
  }
  window.addEventListener('resize',resize);

  // ---- gear shape (drawn at current transform origin) ----
  // wornTooth: index of a tooth to render slightly nicked/rounded, for individual character
  function gearOutline(c, N, wornTooth){
    const R=pitchR(N), Ra=R+ADD, Rd=R-DED, pitch=2*Math.PI/N, tRoot=pitch*0.30, tTip=pitch*0.17;
    c.beginPath();
    for(let k=0;k<N;k++){ const a=k*pitch;
      const worn = k===wornTooth;
      const RaK = worn ? Ra - ADD*0.55 : Ra;      // this one tooth sits a little short — a real chip
      const L=(r,g)=>c.lineTo(r*Math.cos(g),r*Math.sin(g));
      if(k===0) c.moveTo(Rd*Math.cos(a-pitch*0.5),Rd*Math.sin(a-pitch*0.5));
      L(Rd,a-tRoot); L(RaK,a-tTip*(worn?0.5:1)); L(RaK,a+tTip*(worn?0.5:1)); L(Rd,a+tRoot); L(Rd,a+pitch*0.5); }
    c.closePath();
  }
  // plain, unmarked body — used for the tray's catalogue icons (stock parts, not yet "real")
  function gearBody(N, driver, dim){
    const R=pitchR(N);
    gearOutline(ctx, N);
    const grad=ctx.createRadialGradient(-R*0.32,-R*0.32,R*0.12,0,0,R+ADD);
    if(dim){ grad.addColorStop(0,'#8f7c56'); grad.addColorStop(0.5,'#7a6338'); grad.addColorStop(1,'#4f3f22'); }
    else   { grad.addColorStop(0,'#eccd8f'); grad.addColorStop(0.45,'#c9974e'); grad.addColorStop(1,'#87672f'); }
    ctx.fillStyle=grad; ctx.fill();
    ctx.lineWidth=1.3; ctx.strokeStyle='rgba(55,38,14,0.65)'; ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,R-DED-3,0,7); ctx.lineWidth=2; ctx.strokeStyle='rgba(80,55,22,0.4)'; ctx.stroke();
    if(N>=15){ const hn=Math.min(6,Math.floor(N/4)), hr=(R-DED)*0.55, hrad=R*0.13;
      for(let i=0;i<hn;i++){ const ha=i/hn*2*Math.PI; ctx.beginPath(); ctx.arc(hr*Math.cos(ha),hr*Math.sin(ha),hrad,0,7);
        ctx.fillStyle='#241b12'; ctx.fill(); ctx.lineWidth=1; ctx.strokeStyle='rgba(90,62,26,0.45)'; ctx.stroke(); } }
    ctx.beginPath(); ctx.arc(0,0,R*0.24,0,7); ctx.fillStyle=dim?'#7a5c30':'#bd8f48'; ctx.fill(); ctx.lineWidth=1.1; ctx.strokeStyle='rgba(55,38,14,0.6)'; ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,R*0.10,0,7); ctx.fillStyle='#20170f'; ctx.fill();
    if(driver){ ctx.beginPath(); ctx.arc(R*0.42,0,R*0.11,0,7); ctx.fillStyle='#e7d7a8'; ctx.fill(); ctx.strokeStyle='rgba(55,38,14,0.6)'; ctx.stroke(); }
  }

  // ---- individual character: once a gear is placed it becomes a specific object, not a
  // stock shape — a seeded PRNG (from its own id) gives it a fixed, never-changing set of
  // small oddities: a lathe-turned brushed surface, a nicked tooth, a scratch, a patina spot,
  // a polish-worn ring round the bore. Rendered once to an offscreen sprite and cached, so it
  // costs nothing extra per frame and never flickers/regenerates.
  function mulberry32(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
  const spriteCache=new Map();
  function buildGearSprite(N, driver, seed){
    const R=pitchR(N), Ra=R+ADD, size=Math.ceil((Ra+4)*2)*2;   // 2x for a crisper texture
    const off=document.createElement('canvas'); off.width=size; off.height=size;
    const c=off.getContext('2d'); c.translate(size/2,size/2); c.scale(2,2);
    const rnd=mulberry32(seed*2654435761>>>0);
    const wornTooth = rnd()<0.8 ? Math.floor(rnd()*N) : -1;   // most gears carry one small chip; a few don't

    const LX=-0.72, LY=-0.68;   // shared light direction — upper-left — for every directional effect below

    gearOutline(c, N, wornTooth);
    // warmer, richer honey-gold than before — closer to real brass under soft studio light
    // rather than a painted metallic yellow
    const grad=c.createRadialGradient(R*LX*0.35,R*LY*0.35,R*0.10,0,0,Ra);
    grad.addColorStop(0,'#f6dfa4'); grad.addColorStop(0.32,'#dcaa5c'); grad.addColorStop(0.68,'#a8752f'); grad.addColorStop(1,'#5e4018');
    c.fillStyle=grad; c.fill();

    // per-tooth relief: each tooth catches the light on its own — the ones facing the lamp
    // read bright, the ones facing away sit in real shadow, rather than one smooth wash
    // across the whole face. This is the single biggest thing separating a flat painted
    // disc from something with actual dimension.
    c.save(); gearOutline(c, N, wornTooth); c.clip();
    { const pitch=2*Math.PI/N, tRoot=pitch*0.30, tTip=pitch*0.17, Rd0=R-DED;
      for(let k=0;k<N;k++){ const a=k*pitch, dx=Math.cos(a), dy=Math.sin(a);
        const lit=Math.max(0,dx*LX+dy*LY), shade=Math.max(0,-(dx*LX+dy*LY));
        if(lit<0.05 && shade<0.05) continue;
        c.beginPath();
        c.moveTo(Rd0*Math.cos(a-tRoot),Rd0*Math.sin(a-tRoot));
        c.lineTo(Ra*Math.cos(a-tTip),Ra*Math.sin(a-tTip));
        c.lineTo(Ra*Math.cos(a+tTip),Ra*Math.sin(a+tTip));
        c.lineTo(Rd0*Math.cos(a+tRoot),Rd0*Math.sin(a+tRoot));
        c.closePath();
        c.fillStyle = lit>shade ? `rgba(255,244,212,${lit*0.30})` : `rgba(25,15,5,${shade*0.34})`;
        c.fill();
      }
    }
    c.restore();

    // lathe-turned brushed texture: concentric tool marks, irregular in spacing/strength —
    // a machined surface, not a painted-smooth one
    c.save(); gearOutline(c, N, wornTooth); c.clip();
    const Rd=R-DED, rings=48+Math.floor(rnd()*16);
    for(let i=0;i<rings;i++){
      if(rnd()<0.12) continue;                               // gaps, so it doesn't read as a perfect target
      const rr=Rd*0.12 + (Ra-Rd*0.12)*(i/rings) + (rnd()-0.5)*1.4;
      c.beginPath(); c.arc(0,0,rr,0,7);
      c.lineWidth=0.5+rnd()*1.0;
      // denser and a touch more contrasty than before — the reference brass has a much more
      // pronounced turned-on-a-lathe grain than a few faint scratches
      c.strokeStyle = rnd()<0.5 ? `rgba(255,238,200,${0.06+rnd()*0.10})` : `rgba(40,26,10,${0.07+rnd()*0.11})`;
      c.stroke();
    }
    // fine speckle — pitting and tiny highlights in the metal
    const speckN=Math.floor(R*2.2);
    for(let i=0;i<speckN;i++){
      const rr=Rd*Math.sqrt(rnd())*0.97, aa=rnd()*7;
      const x=rr*Math.cos(aa), y=rr*Math.sin(aa);
      c.beginPath(); c.arc(x,y,0.4+rnd()*0.7,0,7);
      c.fillStyle = rnd()<0.6 ? `rgba(30,20,8,${0.10+rnd()*0.10})` : `rgba(255,244,214,${0.10+rnd()*0.10})`;
      c.fill();
    }
    // one or two faint scratches — a real straight-line mark, not a smudge
    const nScratch = rnd()<0.7 ? 1 : 2;
    for(let s=0;s<nScratch;s++){
      const aa=rnd()*7, len=Rd*(0.35+rnd()*0.5), cx=(rnd()-0.5)*Rd*0.7, cy=(rnd()-0.5)*Rd*0.7;
      c.beginPath(); c.moveTo(cx-Math.cos(aa)*len/2, cy-Math.sin(aa)*len/2); c.lineTo(cx+Math.cos(aa)*len/2, cy+Math.sin(aa)*len/2);
      c.lineWidth=0.6+rnd()*0.5; c.strokeStyle=`rgba(${rnd()<0.5?'20,13,5':'255,240,210'},${0.14+rnd()*0.12})`;
      c.stroke();
    }
    // a patina/stain blotch — faint, irregular, never centred; sometimes a rust-toned streak
    // near the rim rather than a soft green blob, closer to how real brass actually stains
    if(rnd()<0.85){
      const rusty = rnd()<0.45;
      if(rusty){
        const aa=rnd()*7, rr=Rd*(0.55+rnd()*0.4), bx=rr*Math.cos(aa), by=rr*Math.sin(aa);
        const bg=c.createRadialGradient(bx,by,0,bx,by,R*(0.16+rnd()*0.16));
        bg.addColorStop(0,'rgba(120,58,26,0.16)'); bg.addColorStop(1,'rgba(120,58,26,0)');
        c.fillStyle=bg; c.beginPath(); c.arc(bx,by,R*0.3,0,7); c.fill();
      } else {
        const bx=(rnd()-0.5)*Rd*1.1, by=(rnd()-0.5)*Rd*1.1, br=R*(0.22+rnd()*0.28);
        const bg=c.createRadialGradient(bx,by,0,bx,by,br);
        bg.addColorStop(0, rnd()<0.5?'rgba(70,90,55,0.10)':'rgba(35,22,9,0.13)');
        bg.addColorStop(1, 'rgba(0,0,0,0)');
        c.fillStyle=bg; c.beginPath(); c.arc(bx,by,br,0,7); c.fill();
      }
    }
    // a bright rim where the edge catches the light, and a dark one on the side facing away —
    // real edge thickness rather than a flat disc — clipped to the toothed silhouette so
    // neither ever bleeds past it
    const rimAng=Math.atan2(LY,LX);
    c.beginPath(); c.arc(0,0,Ra-0.8,rimAng-1.1,rimAng+1.1); c.lineWidth=1.3; c.strokeStyle='rgba(255,241,210,0.4)'; c.stroke();
    c.beginPath(); c.arc(0,0,Ra-0.6,rimAng+Math.PI-1.0,rimAng+Math.PI+1.0); c.lineWidth=1.6; c.strokeStyle='rgba(15,9,3,0.4)'; c.stroke();
    c.restore();

    // a small, sharp specular hotspot — a real polished-metal glint, tighter and brighter
    // than the broad ambient gradient beneath it
    c.save(); gearOutline(c, N, wornTooth); c.clip();
    const hx=R*LX*0.42, hy=R*LY*0.42, hr=R*0.22;
    const spec=c.createRadialGradient(hx,hy,0,hx,hy,hr);
    spec.addColorStop(0,'rgba(255,252,238,0.55)'); spec.addColorStop(0.5,'rgba(255,248,225,0.18)'); spec.addColorStop(1,'rgba(255,248,225,0)');
    c.fillStyle=spec; c.beginPath(); c.arc(hx,hy,hr,0,7); c.fill();
    c.restore();

    // structural details, drawn crisp on top — machined precision against the organic wear
    c.lineWidth=1.3; c.strokeStyle='rgba(55,38,14,0.65)'; gearOutline(c,N,wornTooth); c.stroke();
    c.beginPath(); c.arc(0,0,R-DED-3,0,7); c.lineWidth=2; c.strokeStyle='rgba(80,55,22,0.4)'; c.stroke();
    if(N>=15){ const hn=Math.min(6,Math.floor(N/4)), hr=(R-DED)*0.55, hrad=R*0.13;
      for(let i=0;i<hn;i++){ const ha=i/hn*2*Math.PI, hcx=hr*Math.cos(ha), hcy=hr*Math.sin(ha);
        // a real drilled hole has depth — dark on the far side, a thin catch of light on the
        // near side, rather than a flat black disc
        const hg=c.createRadialGradient(hcx+hrad*LX*0.5,hcy+hrad*LY*0.5,0,hcx,hcy,hrad);
        hg.addColorStop(0,'#3a2a15'); hg.addColorStop(0.7,'#20150c'); hg.addColorStop(1,'#120c07');
        c.beginPath(); c.arc(hcx,hcy,hrad,0,7); c.fillStyle=hg; c.fill();
        c.lineWidth=1; c.strokeStyle='rgba(90,62,26,0.45)'; c.stroke();
        c.beginPath(); c.arc(hcx,hcy,hrad,rimAng-1.0,rimAng+0.3); c.lineWidth=0.8; c.strokeStyle='rgba(255,238,200,0.22)'; c.stroke(); } }
    c.beginPath(); c.arc(0,0,R*0.24,0,7); c.fillStyle='#bd8f48'; c.fill(); c.lineWidth=1.1; c.strokeStyle='rgba(55,38,14,0.6)'; c.stroke();
    // a bright polish-worn ring right at the bore, where an axle has turned against it for years
    c.beginPath(); c.arc(0,0,R*0.115,0,7); c.lineWidth=1.4; c.strokeStyle='rgba(255,236,190,0.5)'; c.stroke();
    c.beginPath(); c.arc(0,0,R*0.10,0,7); c.fillStyle='#20170f'; c.fill();
    if(driver){ c.beginPath(); c.arc(R*0.42,0,R*0.11,0,7); c.fillStyle='#e7d7a8'; c.fill(); c.strokeStyle='rgba(55,38,14,0.6)'; c.stroke(); }

    return {canvas:off, size, half:size/2};
  }
  function getGearSprite(g){
    let s=spriteCache.get(g.id);
    if(!s){ s=buildGearSprite(g.N,g.fixed,g.id+1); spriteCache.set(g.id,s); }
    return s;
  }
  function drawGear(g,dim){
    const R=pitchR(g.N);
    ctx.save(); ctx.translate(g.x,g.y);
    ctx.save(); ctx.rotate(g.angle); ctx.translate(3,4.5); gearOutline(ctx,g.N); ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.fill(); ctx.restore();
    ctx.rotate(g.angle);
    const sp=getGearSprite(g);
    if(dim) ctx.filter='saturate(0.42) brightness(0.68)';
    ctx.drawImage(sp.canvas, -sp.half/2, -sp.half/2, sp.half, sp.half);
    if(dim) ctx.filter='none';
    ctx.restore();
  }

  // ---- signal-lamp piece: a real photo (box + red/blue lights) with two drawn gears and a
  // real-photo screw. The screw is its only connection point to the rest of the train — click
  // it to spin the whole tile 90° so it can face whichever side has a neighbour. Everything
  // below is measured in the box photo's own raw pixel space (LAMP_GS was the scale used to
  // work out proportions against the reference photo); it's converted to true board scale by
  // dividing by LAMP_GS once, at draw/hit-test time, so the lamp's own gears end up sized to
  // match every other gear on the board exactly — same MODULE, same pitchR/outerR maths.
  const LAMP_BIG_N=20, LAMP_SMALL_N=10, LAMP_GS=2.475;
  const LB_bx0=114, LB_by0=93, LB_bw=987-114, LB_bh=772-93;      // box bounds, measured on the photo
  const LB_cx=LB_bx0+LB_bw/2, LB_cy=LB_by0+LB_bh/2;               // box's own visual centre -> local origin
  const lampBigLocalRaw={x:LB_bx0+0.522*LB_bw-LB_cx, y:LB_by0+0.670*LB_bh-LB_cy};
  const lampMeshAngle=1.176;
  const lampSmallDistRaw=LAMP_GS*(pitchR(LAMP_BIG_N)+pitchR(LAMP_SMALL_N));
  const lampSmallLocalRaw={x:lampBigLocalRaw.x+lampSmallDistRaw*Math.cos(lampMeshAngle), y:lampBigLocalRaw.y+lampSmallDistRaw*Math.sin(lampMeshAngle)};
  const lampRaRaw=LAMP_GS*outerR(LAMP_SMALL_N), lampWormHalfHRaw=lampRaRaw*0.52;
  const LAMP_CAPL_W=158, LAMP_CAPR_W=78, LAMP_THREAD_W=294, LAMP_PHOTO_H=127;   // real screw-photo dimensions
  const lampWormScale=(lampWormHalfHRaw*2)/LAMP_PHOTO_H;
  const lampCapLW=LAMP_CAPL_W*lampWormScale, lampCapRW=LAMP_CAPR_W*lampWormScale, lampThreadW=LAMP_THREAD_W*lampWormScale;
  const lampWormHalfLenRaw=(lampCapLW+lampThreadW+lampCapRW)/2;
  const lampScrewLocalRaw={x:lampSmallLocalRaw.x, y:lampSmallLocalRaw.y+lampRaRaw+lampWormHalfHRaw*0.68};
  const redJewelLocalRaw={x:385-LB_cx,y:216-LB_cy}, blueJewelLocalRaw={x:735-LB_cx,y:216-LB_cy}, jewelRRaw=95;
  // true board-scale conversions (divide the raw-photo lengths above by LAMP_GS)
  const lampScrewLocalTrue={x:lampScrewLocalRaw.x/LAMP_GS, y:lampScrewLocalRaw.y/LAMP_GS};
  const LAMP_SCREW_ENGAGE_R=lampWormHalfHRaw/LAMP_GS;
  const LAMP_HIT_R=Math.hypot(LB_bw,LB_bh)/2/LAMP_GS;
  const LAMP_HALF_W=LB_bw/2/LAMP_GS, LAMP_HALF_H=LB_bh/2/LAMP_GS;   // the box's true rectangular footprint, for gear/box collision

  function loadImg(src){ const im=new Image(); im.src=src; return im; }
  const lampBoxImg=loadImg('gyre-lamp-box.png'), lampCapL=loadImg('gyre-lamp-screw-capL.png'),
        lampThread=loadImg('gyre-lamp-screw-thread.png'), lampCapR=loadImg('gyre-lamp-screw-capR.png');

  const lampSpriteCache=new Map();
  function getLampSprites(lamp){
    let s=lampSpriteCache.get(lamp.id);
    if(!s){ s={big:buildGearSprite(LAMP_BIG_N,false,lamp.id*7+3), small:buildGearSprite(LAMP_SMALL_N,false,lamp.id*7+5)}; lampSpriteCache.set(lamp.id,s); }
    return s;
  }
  function lampFacingAngle(lamp){ return lamp.facing*Math.PI/2; }
  function lampScrewWorld(lamp){
    const ang=lampFacingAngle(lamp), c=Math.cos(ang), s=Math.sin(ang), lx=lampScrewLocalTrue.x, ly=lampScrewLocalTrue.y;
    return {x:lamp.x+lx*c-ly*s, y:lamp.y+lx*s+ly*c};
  }
  function drawLamp(lamp, dim){
    ctx.save();
    ctx.translate(lamp.x,lamp.y); ctx.rotate(lampFacingAngle(lamp)); ctx.scale(1/LAMP_GS,1/LAMP_GS);
    if(dim) ctx.filter='saturate(0.42) brightness(0.68)';
    ctx.drawImage(lampBoxImg, -LB_cx, -LB_cy);

    if(!dim && Math.abs(lamp.speed)>0.001){
      const glowJewel = lamp.speed>=0 ? blueJewelLocalRaw : redJewelLocalRaw;
      const glowColor = lamp.speed>=0 ? '80,170,255' : '255,60,60';
      const glowAlpha = Math.min(1, Math.abs(lamp.speed)/1.0);
      ctx.save(); ctx.globalCompositeOperation='lighter';
      const g=ctx.createRadialGradient(glowJewel.x,glowJewel.y,0,glowJewel.x,glowJewel.y,jewelRRaw*1.3);
      g.addColorStop(0, `rgba(255,255,255,${0.9*glowAlpha})`);
      g.addColorStop(0.22, `rgba(${glowColor},${1.0*glowAlpha})`);
      g.addColorStop(0.55, `rgba(${glowColor},${0.7*glowAlpha})`);
      g.addColorStop(1, `rgba(${glowColor},0)`);
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(glowJewel.x,glowJewel.y,jewelRRaw*1.3,0,7); ctx.fill();
      ctx.restore();
    }

    const sprites=getLampSprites(lamp);
    ctx.save(); ctx.translate(lampSmallLocalRaw.x,lampSmallLocalRaw.y); ctx.rotate(lamp.smallAngle);
    ctx.drawImage(sprites.small.canvas,-sprites.small.half*LAMP_GS/2,-sprites.small.half*LAMP_GS/2,sprites.small.half*LAMP_GS,sprites.small.half*LAMP_GS);
    ctx.restore();

    ctx.save(); ctx.translate(lampSmallLocalRaw.x, lampSmallLocalRaw.y+lampRaRaw+lampWormHalfHRaw*0.68);
    const ox=-lampWormHalfLenRaw, oy=-lampWormHalfHRaw;
    ctx.drawImage(lampCapL, ox, oy, lampCapLW, lampWormHalfHRaw*2);
    ctx.save(); ctx.beginPath(); ctx.rect(ox+lampCapLW, oy, lampThreadW, lampWormHalfHRaw*2); ctx.clip();
    let ph=((lamp.phase%lampThreadW)+lampThreadW)%lampThreadW;
    for(let x=ox+lampCapLW-lampThreadW+ph; x<ox+lampCapLW+lampThreadW+lampThreadW; x+=lampThreadW){
      ctx.drawImage(lampThread, x, oy, lampThreadW, lampWormHalfHRaw*2);
    }
    ctx.restore();
    ctx.drawImage(lampCapR, ox+lampCapLW+lampThreadW, oy, lampCapRW, lampWormHalfHRaw*2);
    ctx.restore();

    ctx.save(); ctx.translate(lampBigLocalRaw.x,lampBigLocalRaw.y); ctx.rotate(lamp.bigAngle);
    ctx.drawImage(sprites.big.canvas,-sprites.big.half*LAMP_GS/2,-sprites.big.half*LAMP_GS/2,sprites.big.half*LAMP_GS,sprites.big.half*LAMP_GS);
    ctx.restore();

    if(dim) ctx.filter='none';
    ctx.restore();
  }

  // ---- meshing train from the driver ----
  function buildTrain(){
    const n=gears.length, adj=Array.from({length:n},()=>[]);
    for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){ const a=gears[i],b=gears[j];
      const d=Math.hypot(a.x-b.x,a.y-b.y), t=pitchR(a.N)+pitchR(b.N);
      if(Math.abs(d-t)<MESH_TOL){ adj[i].push(j); adj[j].push(i); } }
    const parent=new Array(n).fill(-2), order=[]; if(n){ parent[0]=-1; const q=[0];
      while(q.length){ const u=q.shift(); order.push(u); for(const v of adj[u]) if(parent[v]===-2){ parent[v]=u; q.push(v);} } }
    return {parent,order};
  }

  // ---- drag / place / remove ----
  let drag=null;
  // the pointer arrives in screen pixels and everything here thinks in board units
  const P=e=>({x:e.clientX/SCALE,y:e.clientY/SCALE});
  // gears are solid — dragged one can reach exact meshing distance against a neighbour
  // (teeth touching) but never closer than that; push it back out if the cursor tries to
  // shove it through another gear
  function resolveOverlap(g){
    for(let iter=0; iter<4; iter++){ let moved=false;
      for(const o of gears){ if(o===g) continue;
        const minD=pitchR(g.N)+pitchR(o.N), dx=g.x-o.x, dy=g.y-o.y, d=Math.hypot(dx,dy);
        if(d<minD-0.01){ const a=d>1e-6?Math.atan2(dy,dx):Math.random()*Math.PI*2;
          g.x=o.x+Math.cos(a)*minD; g.y=o.y+Math.sin(a)*minD; moved=true; } }
      if(!moved) break; }
  }
  // a lamp box is a solid rectangle (it can sit at any 90°-facing), not just a frame gears draw
  // over — this finds how far a circle (a gear, by its outer tooth radius) needs to move to
  // clear that rotated rectangle, in the rectangle's own local axes, then hands back the
  // cleared position in world space. Returns null if the circle doesn't overlap the rect at all.
  function pushCircleFromRect(cx,cy,r,rectCx,rectCy,rectAngle,halfW,halfH){
    const c=Math.cos(rectAngle), s=Math.sin(rectAngle);
    const dx=cx-rectCx, dy=cy-rectCy;
    const lx=dx*c+dy*s, ly=-dx*s+dy*c;
    const cxL=Math.max(-halfW,Math.min(halfW,lx)), cyL=Math.max(-halfH,Math.min(halfH,ly));
    const nx=lx-cxL, ny=ly-cyL, d=Math.hypot(nx,ny);
    let nlx, nly;
    if(d>=r) return null;
    if(d>1e-6){ nlx=cxL+nx/d*r; nly=cyL+ny/d*r; }
    else {                             // circle's centre is inside the rect — push out the nearest side
      const left=lx+halfW, right=halfW-lx, top=ly+halfH, bottom=halfH-ly, m=Math.min(left,right,top,bottom);
      if(m===left) { nlx=-halfW-r; nly=ly; }
      else if(m===right) { nlx=halfW+r; nly=ly; }
      else if(m===top) { nlx=lx; nly=-halfH-r; }
      else { nlx=lx; nly=halfH+r; }
    }
    return { x: rectCx+nlx*c-nly*s, y: rectCy+nlx*s+nly*c };
  }
  // dragging a gear near a lamp box: push the gear clear of the box, same physical rule as
  // two gears not being able to share space
  function resolveBoxOverlap(g){
    const r=outerR(g.N);
    for(const lamp of lamps){
      const pushed=pushCircleFromRect(g.x,g.y,r,lamp.x,lamp.y,lampFacingAngle(lamp),LAMP_HALF_W,LAMP_HALF_H);
      if(pushed){ g.x=pushed.x; g.y=pushed.y; }
    }
  }
  // dragging the lamp box itself near a gear: same collision, but it's the box that has to
  // move — reuse the circle/rect math from the gear's point of view, then apply the opposite
  // shift to the box (moving either shape by the same relative amount clears the same overlap)
  function resolveLampOverlap(lamp){
    for(const g of gears){
      const r=outerR(g.N);
      const pushed=pushCircleFromRect(g.x,g.y,r,lamp.x,lamp.y,lampFacingAngle(lamp),LAMP_HALF_W,LAMP_HALF_H);
      if(pushed){ lamp.x-=(pushed.x-g.x); lamp.y-=(pushed.y-g.y); }
    }
  }
  canvas.addEventListener('pointerdown',e=>{ const {x,y}=P(e);
    for(const t of trayRects){ if(Math.hypot(x-t.cx,y-t.cy)<t.hit){ const g=mk(t.N,x,y,false); gears.push(g); drag={kind:'gear',obj:g,ox:0,oy:0}; canvas.setPointerCapture(e.pointerId); return; } }
    if(lampTrayRect && Math.hypot(x-lampTrayRect.cx,y-lampTrayRect.cy)<lampTrayRect.hit){
      const lamp=mkLamp(x,y); lamps.push(lamp);
      drag={kind:'lamp',obj:lamp,ox:0,oy:0,downX:x,downY:y,downOnScrew:false};
      canvas.setPointerCapture(e.pointerId); return;
    }
    for(let i=gears.length-1;i>=0;i--){ const g=gears[i]; if(Math.hypot(x-g.x,y-g.y)<outerR(g.N)){ drag={kind:'gear',obj:g,ox:x-g.x,oy:y-g.y}; canvas.setPointerCapture(e.pointerId); return; } }
    for(let i=lamps.length-1;i>=0;i--){ const lamp=lamps[i]; if(Math.hypot(x-lamp.x,y-lamp.y)<LAMP_HIT_R){
      const screwPos=lampScrewWorld(lamp), downOnScrew=Math.hypot(x-screwPos.x,y-screwPos.y)<Math.max(LAMP_SCREW_ENGAGE_R*2,16);
      drag={kind:'lamp',obj:lamp,ox:x-lamp.x,oy:y-lamp.y,downX:x,downY:y,downOnScrew};
      canvas.setPointerCapture(e.pointerId); return;
    } }
  });
  canvas.addEventListener('pointermove',e=>{ if(!drag) return; const {x,y}=P(e); drag.obj.x=x-drag.ox; drag.obj.y=y-drag.oy;
    if(drag.kind==='gear'){ resolveOverlap(drag.obj); resolveBoxOverlap(drag.obj); }
    else resolveLampOverlap(drag.obj); });
  function endDrag(e){ if(!drag) return; const {x,y}=P(e);
    if(drag.kind==='gear'){ const g=drag.obj;
      if(y<130 && !g.fixed){ gears=gears.filter(k=>k!==g); }   // dropped in the tray band -> remove (never the driver)
      else {                                              // nudge to exact mesh distance if close to a neighbour
        let best=null,err=1e9; for(const o of gears){ if(o===g) continue; const t=pitchR(g.N)+pitchR(o.N); const e2=Math.abs(Math.hypot(g.x-o.x,g.y-o.y)-t); if(e2<err){err=e2;best=o;} }
        if(best&&err<SNAP_TOL){
          const t=pitchR(g.N)+pitchR(best.N), a=Math.atan2(g.y-best.y,g.x-best.x);
          const nx=best.x+Math.cos(a)*t, ny=best.y+Math.sin(a)*t;
          // don't lock into a mesh with `best` if that position also happens to land at mesh
          // distance from some OTHER gear -- three (or more) external gears meshed in a closed
          // loop can't all freely turn (it jams), so a gear only ever gets to properly mesh
          // with one neighbour. If snapping here would double-mesh, just leave it where the
          // drag safely left it instead of forcing an impossible arrangement.
          const wouldAlsoMesh=gears.some(o=>o!==g&&o!==best&&Math.abs(Math.hypot(nx-o.x,ny-o.y)-(pitchR(g.N)+pitchR(o.N)))<MESH_TOL);
          if(!wouldAlsoMesh){ g.x=nx; g.y=ny; }
        }
      }
    } else { const lamp=drag.obj, moved=Math.hypot(x-drag.downX,y-drag.downY);
      if(moved<8 && drag.downOnScrew){ lamp.facing=(lamp.facing+1)%4; }   // a click on the screw spins the tile 90°
      else if(y<130){ lamps=lamps.filter(k=>k!==lamp); }                  // dropped in the tray band -> remove
      else {                                        // nudge so the screw lands exactly on a neighbour, if close enough
        const screwPos=lampScrewWorld(lamp);
        let best=null,err=1e9; for(const o of gears){ const reqD=pitchR(o.N)+LAMP_SCREW_ENGAGE_R; const e2=Math.abs(Math.hypot(screwPos.x-o.x,screwPos.y-o.y)-reqD); if(e2<err){err=e2;best=o;} }
        if(best&&err<SNAP_TOL){ const reqD=pitchR(best.N)+LAMP_SCREW_ENGAGE_R, a=Math.atan2(screwPos.y-best.y,screwPos.x-best.x);
          const tx=best.x+Math.cos(a)*reqD, ty=best.y+Math.sin(a)*reqD; lamp.x+=tx-screwPos.x; lamp.y+=ty-screwPos.y; }
      }
    }
    drag=null;
  }
  canvas.addEventListener('pointerup',endDrag);
  canvas.addEventListener('pointercancel',endDrag);

  // which gear (if any) is currently touching this lamp's screw at proper meshing distance,
  // and is itself actually part of the live, running train (not just sitting there unpowered)
  function lampEngagement(lamp, connected){
    const screwPos=lampScrewWorld(lamp);
    let best=-1, bestErr=1e9;
    for(let i=0;i<gears.length;i++){ const o=gears[i], reqD=pitchR(o.N)+LAMP_SCREW_ENGAGE_R;
      const e2=Math.abs(Math.hypot(screwPos.x-o.x,screwPos.y-o.y)-reqD); if(e2<bestErr){bestErr=e2;best=i;} }
    return (best>=0 && bestErr<MESH_TOL && connected.has(best)) ? best : -1;
  }

  // ---- loop ----
  let last=performance.now();
  function tick(now){
    const dt=Math.min(now-last,50)/1000; last=now;
    const {parent,order}=buildTrain();
    const speed=speedSlider.value/50;
    if(runChk.checked) gears[0].angle += speed*1.05*dt;
    const angVel=new Array(gears.length).fill(0);
    if(order.length) angVel[order[0]] = runChk.checked ? speed*1.05 : 0;
    for(const idx of order){ if(idx===0) continue; const g=gears[idx], p=gears[parent[idx]];
      const conn=Math.atan2(g.y-p.y,g.x-p.x);
      g.angle=-(p.N/g.N)*(p.angle-conn)+conn+Math.PI+Math.PI/g.N;
      angVel[idx]=-(p.N/g.N)*angVel[parent[idx]]; }
    const connected=new Set(order);

    // drive each lamp from whatever live gear its screw is currently touching, if any —
    // idle (nothing engaged, or the neighbour itself isn't powered) means dark and still
    for(const lamp of lamps){
      const ni=lampEngagement(lamp,connected);
      // the engaging gear sits on the OPPOSITE side of the screw's own thread from the
      // box's small gear (screw's thread has the small gear above it, contacting from
      // below; the engaging gear sits below the screw, contacting from above) — two
      // gears meshing the same rack-like thread from opposite sides turn opposite ways
      // for the teeth to actually mesh, not the same way, so this is a "+", not the "-"
      // it'd be if the engaging gear were on the same side as the small gear
      // the engaging gear's own angular velocity, unscaled — angVel[ni] already carries
      // (driver.N/ni.N) baked in from the drive chain, so re-scaling by (ni.N/LAMP_BIG_N)
      // here (as this used to) cancels that back out to just the driver's own speed no
      // matter which gear or how many hops away it is: a size-8 gear and a size-40 gear
      // driving the screw would always produce the exact same brightness. Using the
      // engaging gear's real speed directly is what actually makes a small, fast gear
      // drive the lamp bright and a big, slow one drive it dim.
      const bigSpeed = ni>=0 ? angVel[ni] : 0;
      lamp.bigAngle += bigSpeed*dt;
      lamp.smallAngle -= (LAMP_BIG_N/LAMP_SMALL_N)*bigSpeed*dt;
      // the screw's thread scroll must match the small gear's actual contact-point motion
      // (no-slip meshing) — this is a "+=", not a "-=" like smallAngle/bigAngle above,
      // because "phase increasing" scrolls the thread texture right on screen while
      // "smallAngle increasing" spins the small gear so its bottom (the contact point,
      // since the screw sits below it) moves left — opposite senses for the same physical
      // motion, given how each one is drawn. Getting this wrong doesn't break the screw's
      // own behavior (it still correctly reverses with the drive chain's length/parity,
      // since that only depends on bigSpeed's sign) — it just makes the screw and the small
      // gear above it visually fight each other instead of turning together.
      lamp.phase += outerR(LAMP_SMALL_N)*(LAMP_BIG_N/LAMP_SMALL_N)*bigSpeed*dt;
      lamp.speed=bigSpeed; lamp.engaged=ni>=0;
    }

    ctx.clearRect(0,0,W,H);
    // tray
    // Every gear used to be scaled to FILL its own slot, so an 8-tooth pinion and a
    // 40-tooth wheel came out within a pixel of each other and the menu told you
    // nothing about what you were picking. They are graded by size now -- but NOT
    // in true proportion, which was tried and is the wrong answer here: at true
    // proportion the smallest is 24% of the largest and on a zoomed-out board it
    // came out a speck. Her call, and the right one: for a menu, clarity beats
    // fidelity. The drawn size follows the SQUARE ROOT of the true ratio, which
    // splits the difference -- the smallest sits at 49% of the largest, plainly
    // the small one and plainly still a gear. The tap target is the slot and does
    // not shrink with the drawing either way.
    const maxR = outerR(TRAY_MAX);
    const trayScale = (trayRects.length ? trayRects[0].hit : 0)*0.95/maxR;
    for(const t of trayRects){
      const rel = outerR(t.N)/maxR;
      ctx.save(); ctx.translate(t.cx,t.cy);
      const s=Math.min(1, trayScale/Math.sqrt(rel));
      ctx.scale(s,s); gearBody(t.N,false,false); ctx.restore();
    }
    if(lampTrayRect){ ctx.save(); ctx.translate(lampTrayRect.cx,lampTrayRect.cy);
      // drawLamp applies its own extra 1/LAMP_GS scale (needed on the real board so the lamp's
      // gears match every other gear's true size) — multiply that back in here so the tray icon
      // ends up the same on-screen size as before, now with its gears and screw visible too.
      const s=Math.min(1,(lampTrayRect.hit*1.7)/Math.max(LB_bw,LB_bh))*LAMP_GS; ctx.scale(s,s); drawLamp(lampPreview,false); ctx.restore(); }
    // board gears and lamps — dim the ones not part of the running train,
    // and draw whichever piece was placed more recently on top, so a gear
    // dropped over part of a lamp box (or vice versa) reads as one solid
    // object sitting on another, not gears seen "through" a fixed frame
    const boardPieces=[
      ...gears.map((g,i)=>({kind:'gear',obj:g,zOrder:g.zOrder,dim:!connected.has(i)&&!g.fixed})),
      ...lamps.map(lamp=>({kind:'lamp',obj:lamp,zOrder:lamp.zOrder,dim:!lamp.engaged})),
    ].sort((a,b)=>a.zOrder-b.zOrder);
    for(const p of boardPieces){ if(p.kind==='gear') drawGear(p.obj,p.dim); else drawLamp(p.obj,p.dim); }
    requestAnimationFrame(tick);
  }
  resize(); requestAnimationFrame(tick);
})();
</script>

<script>
(function(){
  var disc=document.getElementById('shelfdisc'), box=document.getElementById('plates');
  var rows=[].slice.call(box.querySelectorAll('.row'));
  function unroll(){ rows.forEach(function(r){ r.classList.remove('rolled'); }); }
  function shut(){ box.classList.remove('open'); disc.setAttribute('aria-expanded','false'); unroll(); }

  /* The twenty cards behind these plates are 6.2MB and not one of them can be
     seen until a plate is opened, but every page on the site was fetching the lot
     on load, ahead of the piece's own assets. Measured on bowl at 240px with a
     slow phone's CPU and connection, the bowl had still not appeared after 100
     seconds; held back, it is there in 12.
     They are held behind data-src rather than left to loading="lazy" alone,
     because that is a heuristic and not a promise -- the same page deferred them
     on a throttled connection and fetched all twenty on a fast one, since the
     browser's idea of "near the viewport" widens with bandwidth. This is the same
     on every machine. The attribute stays as a second line for anything that
     scrolls them into view another way. */
  var wired=false;
  function fetchCards(){
    if(wired) return; wired=true;
    [].slice.call(box.querySelectorAll('img[data-src]')).forEach(function(im){
      im.src=im.getAttribute('data-src'); im.removeAttribute('data-src');
    });
  }

  disc.addEventListener('click', function(ev){
    ev.stopPropagation();
    var open=box.classList.toggle('open');
    if(open) fetchCards();
    disc.setAttribute('aria-expanded', open?'true':'false');
    if(!open) unroll();
  });

  // Same bargain the case itself strikes: a mouse can hover, so a plate is a link
  // straight to its shelf. A thumb cannot, so the first tap on a plate rolls its
  // pieces out and only the second one goes to the shelf.
  var FINE=matchMedia('(hover: hover) and (pointer: fine)');
  rows.forEach(function(row){
    row.querySelector('.tag').addEventListener('click', function(ev){
      if(FINE.matches) return;
      if(row.classList.contains('rolled')) return;
      ev.preventDefault();
      unroll(); row.classList.add('rolled');
    });
  });

  document.addEventListener('click', function(ev){
    if(!box.contains(ev.target) && ev.target!==disc) shut();
  });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') shut(); });
})();
</script>
