<style>

  input[type=range]{ -webkit-appearance:none; appearance:none; width:150px; height:3px; border-radius:3px;
    background:rgba(231,221,201,.25); outline:none; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
    background:#e9d9a8; cursor:pointer; box-shadow:0 0 8px rgba(233,217,168,.6); }
  input[type=range]::-moz-range-thumb{ width:14px; height:14px; border:none; border-radius:50%; background:#e9d9a8; cursor:pointer; }
  #globeWrap{ position:static; width:82px; height:82px; flex:0 0 auto; cursor:grab; touch-action:none; }
  #globeWrap:active{ cursor:grabbing; }
  #eternityToggle, #realToggle{ font-size:22px; line-height:1; color:rgba(231,221,201,.32); cursor:pointer;
    user-select:none; transition:color .35s ease, text-shadow .35s ease; flex:0 0 auto; }
  #eternityToggle.active, #realToggle.active{ color:#e9d9a8; text-shadow:0 0 9px rgba(233,217,168,.75); }
  #eternityToggle:focus-visible, #realToggle:focus-visible{ outline:1px solid rgba(233,217,168,.6); outline-offset:4px; }
  /* THE CLOCK IS DRAWN, NOT AN EMOJI, and that is the whole of why. It used to be
     the 🕰 glyph, told apart ticked from unticked by `color` and by
     `filter:saturate()`. A colour emoji is a little bitmap the font hands over
     whole: it ignores `color` on EVERY platform, and Windows ignores `filter` on
     it too -- which is exactly how musebox's white rabbit stayed white on the
     tablet. So the only thing left saying whether this was on or off was a faint
     glow, on a control that carries state. The ∞ beside it is a plain text glyph
     and dimmed properly all along, so the two halves of one control behaved
     differently.
     Drawn in currentColor, the rules above do what they always meant to. The glow
     is a drop-shadow rather than a text-shadow, since there is no text now -- but
     the colour is the cue and the glow is only the flourish, which is the way
     round it should be. */
  /* THE RAKE REPLACED THE INFINITY SIGN. Hers, 4 Sep 2026, on the piece being the
     least readable on the shelf: "nothing explains anything, and i'm going to need to
     find better icons." The infinity sign said nothing about sand and needed a word to
     be understood, which by her own rule makes it the wrong control. A rake is an
     object, names itself at four years old and in any language, and belongs on a sand
     plate. Three were drawn into the real dock and she took the upright wide-headed
     one: at 19px the angled one reads as a brush or a tick and the short-handled one
     as a comet, and only this one keeps handle, head and tines legible. Drawn in
     currentColor like the clock beside it, NOT an emoji -- a colour emoji is a bitmap
     the font hands over whole and ignores `color` on every platform, which is the
     whole reason the clock stopped being one.
     NOTHING ABOUT THE CONTROL'S BEHAVIOUR CHANGED: lit still means the marks stay,
     unlit still means they fade, and unlit is still how the piece opens. Which way
     round a rake ought to read is genuinely two-sided -- a garden rake clears sand, a
     zen rake draws it -- and that is hers to rule, not a thing to flip quietly. */
  /* THE SLIDER HAD NOTHING SAYING WHAT IT WAS. Hers, 4 Sep 2026: "there is no icon to
     indicate what the slider does. could we perhaps put a fast-forward icon to the left
     of it?" Every other control on the plate carries its object; the speed slider was a
     bare line. This is a LABEL, not a control -- aria-hidden and no pointer -- and it
     is filled rather than stroked because two small solid triangles read at 15px where
     outlines of them do not. It dims with the slider when the clock takes over, which
     is the honest thing: with the plane handed to the real world there is no winding
     forward to be had. */
  /* the label and the line it labels are ONE flex item, so the dock's wrapping can
     never put them on separate rows -- which it did at 240px, leaving a fast-forward
     mark stranded above a slider it no longer touched. */
  #speedPair{ display:flex; align-items:center; gap:9px; flex:0 0 auto; }
  #speedIcon{ color:rgba(231,221,201,.32); flex:0 0 auto; display:block;
    transition:opacity .35s ease; pointer-events:none; }
  #speedIcon svg{ width:15px; height:15px; display:block; }
  #speedIcon.off{ opacity:.26; }
  #eternityToggle svg{ width:19px; height:19px; display:block; }
  #eternityToggle{ transition:color .35s ease, filter .35s ease; }
  #eternityToggle.active{ filter:drop-shadow(0 0 5px rgba(233,217,168,.75)); }
  #realToggle svg{ width:19px; height:19px; display:block; }
  #realToggle{ transition:color .35s ease, filter .35s ease; }
  #realToggle.active{ filter:drop-shadow(0 0 5px rgba(233,217,168,.75)); }
  /* with the plane handed over to the real clock there is nothing left for the
     speed slider to scale, so it stands down rather than sitting there dead */
  input[type=range]:disabled{ opacity:.26; }

  /* a quiet flag, always available, for setting the latitude to somewhere other than
     wherever the visitor actually is — opens a small search bar, never on by default */
  #dock{ flex-wrap:wrap; row-gap:8px; }
  #loc-flag{
    appearance:none; border:0; background:none; padding:4px 6px;
    font-size:15px; line-height:1; cursor:pointer; opacity:.4; transition:opacity .3s ease; flex:0 0 auto;

<script>
(function(){
  const pick=document.getElementById('musicPick'), el=document.getElementById('musicEl'),
        btn=document.getElementById('musicBtn'), name=document.getElementById('musicName');
  let list=[], idx=0;
  const label=f=> f ? f.name.replace(/\.[^.]+$/,'') : '';
  function load(i){ if(el.src) URL.revokeObjectURL(el.src); el.src=URL.createObjectURL(list[i]); name.textContent=label(list[i]); }
  function sync(){ btn.textContent = !el.src ? '🎧' : (el.paused ? '▶' : '❚❚'); btn.classList.toggle('playing', !!el.src && !el.paused); }
  btn.addEventListener('click', ()=>{ if(!list.length){ pick.click(); return; } el.paused ? el.play() : el.pause(); });
  name.addEventListener('click', ()=> pick.click());
  pick.addEventListener('change', ()=>{ if(!pick.files.length) return; list=[...pick.files]; idx=0; el.loop=(list.length===1); load(0); el.play(); });
  el.addEventListener('ended', ()=>{ if(list.length>1){ idx=(idx+1)%list.length; load(idx); el.play(); } });
  el.addEventListener('play', sync); el.addEventListener('pause', sync); el.addEventListener('loadeddata', sync);
  sync();
})();
</script>
<canvas id="scene"></canvas>
<div id="dock">
  <canvas id="globeWrap" width="164" height="164" aria-label="latitude" role="slider" tabindex="0"></canvas>
  <span id="speedPair"><span id="speedIcon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M3.6 5.4 12 12 3.6 18.6z"/><path d="M12.6 5.4 21 12l-8.4 6.6z"/></svg></span><input type="range" id="speedSlider" min="0" max="100" value="80" aria-label="time speed"></span>
  <div id="realToggle" role="checkbox" tabindex="0" aria-checked="false" aria-label="real-world time"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 19.4V11a7.5 7.5 0 0 1 15 0v8.4z"/><circle cx="12" cy="11" r="4.1"/><path d="M12 8.5V11l2 1.4"/><path d="M7 19.4v1.5M17 19.4v1.5"/></svg></div>
  <div id="eternityToggle" role="checkbox" tabindex="0" aria-checked="false" aria-label="keep the marks in the sand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v9"/><path d="M5.5 12h13"/><path d="M6.5 12v4M9.5 12v5M12 12v5.5M14.5 12v5M17.5 12v4"/></svg></div>
  <button type="button" id="loc-flag" title="check another location" aria-label="check another location" aria-expanded="false">🚩</button>

<script>
(function(){
  const canvas=document.getElementById('scene'), ctx=canvas.getContext('2d');
  const globeCanvas=document.getElementById('globeWrap'), gctx=globeCanvas.getContext('2d');
  const speedSlider=document.getElementById('speedSlider');
  const speedIcon=document.getElementById('speedIcon');
  const eternityToggle=document.getElementById('eternityToggle');
  let W=0,H=0,DPR=1, cx=0, cy=0, floorR=0;

  // ---------- sand trace: like a real Foucault demonstration, a stylus mark
  // that fans into a rosette as the plane precesses. off by default, it clears
  // itself into a fresh bloom each time the pin ring empties; the ∞ toggle
  // switches that off so it keeps thickening indefinitely instead ----------
  let sandEternal=false;
  function setEternal(v){
    sandEternal=v;
    eternityToggle.setAttribute('aria-checked', String(v));
    eternityToggle.classList.toggle('active', v);
  }
  eternityToggle.addEventListener('click', ()=>setEternal(!sandEternal));
  eternityToggle.addEventListener('keydown', e=>{
    if(e.key===' '||e.key==='Enter'){ e.preventDefault(); setEternal(!sandEternal); }
  });
  let sandLayer=null, sandCtx=null;
  // A groove stops deepening once it's cut. Sand is displaced, not deposited, so
  // a line the bob has crossed two hundred times is no darker than one it crossed
  // six times — and without that ceiling, real-world time (where the plane holds
  // very nearly the same angle for hours) would burn one chord to solid white.
  // A bin per 0.18 degrees of plane angle, each counting the passes it has taken,
  // is all it needs. At any of the compressed speeds a bin sees well under one
  // pass, so the cap never comes into it there.
  const SAND_BINS=2048, SAND_CAP_PASSES=2.5;
  const sandDeposit=new Float32Array(SAND_BINS);
  function sandBin(a){
    const x=((a%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
    return Math.min(SAND_BINS-1, Math.floor(x/(Math.PI*2)*SAND_BINS));
  }
  // where the stylus was last frame; cleared with the sand so a wipe cannot leave
  // a stray line drawn from wherever the bob happened to be before it
  let sandPrev=null;
  function clearSand(){ if(sandCtx) sandCtx.clearRect(0,0,sandLayer.width,sandLayer.height); sandDeposit.fill(0); sandPrev=null; }

  // ---------- latitude: set by dragging a line across the small globe ----------
  // a line of latitude, viewed exactly edge-on (the standard way a globe is drawn
  // with its axis vertical), projects to a plain horizontal chord — full width at
  // the equator, shrinking to a point at the pole. that's the "line" itself: no
  // separate readout needed, the chord's own length and height carry the value.
  let lat = 0.75; // radians, fallback until geolocation resolves (~43°N)
  function setLatFromDrag(clientY){
    const rect=globeCanvas.getBoundingClientRect();
    const gR=rect.width/2*0.94;
    const localY=clientY-(rect.top+rect.height/2);
    const s=Math.max(-1,Math.min(1,-localY/gR));
    lat=Math.asin(s);
    reDerive();
  }
  let draggingGlobe=false;
  globeCanvas.addEventListener('pointerdown', e=>{ draggingGlobe=true; globeCanvas.setPointerCapture(e.pointerId); setLatFromDrag(e.clientY); });
  globeCanvas.addEventListener('pointermove', e=>{ if(draggingGlobe) setLatFromDrag(e.clientY); });
  globeCanvas.addEventListener('pointerup', ()=>{ draggingGlobe=false; });
  globeCanvas.addEventListener('pointercancel', ()=>{ draggingGlobe=false; });

  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      pos => { lat = pos.coords.latitude*Math.PI/180; reDerive(); },
      () => {}, { timeout: 4000 }
    );
  }

  // the flag: a quiet, always-there way to set the latitude to somewhere other than
  // wherever the visitor actually is — never open by default, no page text anywhere
  // else hints it exists. Geocoding goes through OpenStreetMap's Nominatim (free, no
  // key) since open-meteo's own geocoder searches place names, not postcodes.
  (function initLocationSearch(){
    const flag=document.getElementById('loc-flag');
    const form=document.getElementById('loc-search');
    const input=document.getElementById('loc-search-input');
    const status=document.getElementById('loc-search-status');
    if(!flag || !form || !input) return;

    flag.addEventListener('click', ()=>{
      const open=form.classList.toggle('open');
      flag.classList.toggle('open', open);
      flag.setAttribute('aria-expanded', open ? 'true' : 'false');
      if(open) input.focus();
      else status.textContent='';
    });

    /* An on-screen keyboard is not a keyboard. A one-field form submits on Enter in
       a desktop browser, but the Go key on some Android ones -- the Kindle's among
       them -- can leave the form alone entirely, and then a typed-in location does
       nothing and says nothing. Asking the form directly costs a line; preventing
       the key's own default is what stops a browser that DOES submit searching
       twice. */
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.keyCode === 13){
        e.preventDefault();
        form.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
      }
    });

    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const q=input.value.trim();
      if(!q) return;
      status.textContent='looking…';
      try{
        const url=`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q)}`;
        const res=await fetch(url);
        const results=await res.json();
        if(!results || !results.length){ status.textContent="couldn't find that"; return; }
        lat=parseFloat(results[0].lat)*Math.PI/180;
        reDerive();
        status.textContent=results[0].display_name.split(',').slice(0,2).join(', ');
        input.value='';
      }catch(e){
        status.textContent="couldn't reach the map — try again";
      }
    });
  })();

  // the real globe, rendered as simplified continent silhouettes on a rotating
  // sphere (orthographic projection, polygons clipped to the visible hemisphere)
  // instead of pre-rendered photo frames. Rotation is now continuous real math
  // rather than a swap between 32 stills, so it's exactly as smooth as the
  // display's own frame rate — no dipping through black between frames, and no
  // baked-in artifacts (the old frames carried garbled text labels) to fight.
  // There's no longitude control here (only latitude), so instead the globe
  // spins slowly on its own — a lazy ambient rotation that eventually brings
  // every part of the world into view, purely decorative and independent of
  // both the time-speed slider and the latitude drag (which only reads the
  // chord's height, unaffected by which way the sphere is currently turned).
  const GLOBE_SPIN_DEG_PER_SEC = 4;
  // simplified continent outlines, [lon,lat] degrees — stylized silhouettes
  // traced roughly to real coastlines, sized for an ~80px decoration rather
  // than surveyed accuracy.
  const CONTINENTS = [
    [[-165,68],[-140,71],[-110,72],[-95,75],[-75,68],[-60,50],[-53,47],[-65,45],
     [-75,35],[-81,25],[-97,18],[-92,14],[-84,9],[-79,8],[-105,20],[-110,25],
     [-117,32],[-124,40],[-124,49],[-130,55],[-140,60],[-165,68]], // North America
    [[-79,8],[-77,0],[-80,-5],[-81,-15],[-71,-18],[-70,-30],[-73,-40],[-68,-52],
     [-65,-55],[-58,-52],[-57,-38],[-48,-25],[-35,-8],[-50,0],[-60,5],[-70,10],[-79,8]], // South America
    [[-9,43],[-9,52],[-5,58],[5,62],[15,68],[25,70],[30,60],[27,45],[19,42],
     [13,38],[3,43],[-9,43]], // Europe
    [[-17,15],[-17,21],[-6,35],[10,37],[20,32],[32,31],[43,12],[51,12],[42,-1],
     [40,-15],[35,-25],[27,-34],[18,-34],[12,-18],[9,4],[-5,5],[-11,7],[-17,15]], // Africa
    [[27,45],[40,45],[60,55],[70,55],[90,50],[110,52],[130,55],[145,60],[160,65],
     [178,68],[178,60],[160,55],[142,45],[130,35],[122,30],[110,20],[103,10],
     [95,15],[80,8],[77,20],[68,25],[60,25],[48,30],[35,32],[27,36],[27,45]], // Asia
    [[113,-22],[122,-18],[130,-12],[137,-12],[142,-11],[145,-16],[153,-28],
     [150,-37],[140,-38],[132,-32],[122,-34],[115,-35],[113,-22]], // Australia
    [[-45,60],[-38,66],[-25,71],[-25,77],[-45,77],[-55,70],[-52,63],[-45,60]], // Greenland
  ];
  const ICE_CAP_LAT = -58; // Antarctica, approximated as a polar cap

  // orthographic projection of a lon/lat point onto the sphere as currently
  // rotated; z<0 means it's on the far side, facing away from the viewer
  function sphereProject(lonDeg, latDeg, rotDeg, R, gcx, gcy){
    const lon=(lonDeg-rotDeg)*Math.PI/180, lat=latDeg*Math.PI/180;
    const x=Math.cos(lat)*Math.sin(lon), y=Math.sin(lat), z=Math.cos(lat)*Math.cos(lon);
    return { x: gcx+R*x, y: gcy-R*y, z };
  }
  // fills a continent polygon, clipped to the visible (z>=0) hemisphere. Where
  // an edge crosses the horizon, the crossing point lands exactly on the
  // sphere's own silhouette circle — so clipping in 3D reduces to snapping
  // that interpolated point onto the circle, no separate 2D clip pass needed.
  function drawContinent(poly, rotDeg, R, gcx, gcy){
    const pts = poly.map(([lon,lat]) => sphereProject(lon,lat,rotDeg,R,gcx,gcy));
    const clipped = [];
    for(let i=0;i<pts.length;i++){
      const a=pts[i], b=pts[(i+1)%pts.length];
      if(a.z>=0) clipped.push(a);
      if((a.z>=0)!==(b.z>=0)){
        const tt=a.z/(a.z-b.z);
        const ix=a.x+(b.x-a.x)*tt, iy=a.y+(b.y-a.y)*tt;
        const dx=ix-gcx, dy=iy-gcy, d=Math.hypot(dx,dy)||1;
        clipped.push({x:gcx+dx/d*R, y:gcy+dy/d*R, z:0});
      }
    }
    if(clipped.length<3) return;
    gctx.beginPath();
    gctx.moveTo(clipped[0].x,clipped[0].y);
    for(let i=1;i<clipped.length;i++) gctx.lineTo(clipped[i].x,clipped[i].y);
    gctx.closePath();
    gctx.fill();
  }
  function drawGlobe(t){
    const w=globeCanvas.width, h=globeCanvas.height, R=w/2*0.90;
    const gcx=w/2, gcy=h/2;
    gctx.clearRect(0,0,w,h);
    const rotDeg = (12 + t*GLOBE_SPIN_DEG_PER_SEC) % 360;

    gctx.save();
    gctx.beginPath(); gctx.arc(gcx,gcy,R,0,Math.PI*2); gctx.clip();

    // ocean — a soft sphere-shaded base rather than a flat fill
    const ocean=gctx.createRadialGradient(gcx-R*0.35,gcy-R*0.4,R*0.15,gcx,gcy,R*1.05);
    ocean.addColorStop(0,'#3f7aa8'); ocean.addColorStop(0.55,'#265f8c'); ocean.addColorStop(1,'#0e2f4c');
    gctx.fillStyle=ocean; gctx.fillRect(gcx-R,gcy-R,R*2,R*2);

    // graticule — parallels are fixed chords (see the latitude line below);
    // meridians slide sideways as the globe turns, the clearest visual cue
    // that it's actually rotating rather than just sitting there
    gctx.strokeStyle='rgba(255,255,255,0.16)'; gctx.lineWidth=0.6;
    [-60,-30,0,30,60].forEach(pLat=>{
      const ply=gcy-Math.sin(pLat*Math.PI/180)*R, plx=Math.cos(pLat*Math.PI/180)*R;
      gctx.beginPath(); gctx.moveTo(gcx-plx,ply); gctx.lineTo(gcx+plx,ply); gctx.stroke();
    });
    for(let mLon=0; mLon<360; mLon+=45){
      const delta=((mLon-rotDeg)%360+540)%360-180; // wrapped to -180..180
      if(Math.abs(delta)>=90) continue; // facing away — the far half of this meridian
      const dRad=delta*Math.PI/180;
      gctx.beginPath();
      for(let i=0;i<=18;i++){
        const phi=(-90+i*10)*Math.PI/180;
        const px=gcx+R*Math.cos(phi)*Math.sin(dRad), py=gcy-R*Math.sin(phi);
        if(i===0) gctx.moveTo(px,py); else gctx.lineTo(px,py);
      }
      gctx.stroke();
    }

    // continents
    gctx.fillStyle='#7c9b6e';
    CONTINENTS.forEach(poly => drawContinent(poly, rotDeg, R, gcx, gcy));

    // south polar ice cap — it wraps every longitude, so seen from this
    // equatorial camera it's simply the circle segment below its latitude
    gctx.save();
    const capY = gcy - Math.sin(ICE_CAP_LAT*Math.PI/180)*R;
    gctx.beginPath(); gctx.rect(gcx-R, capY, R*2, gcy+R-capY); gctx.clip();
    gctx.fillStyle='rgba(235,242,246,0.88)';
    gctx.beginPath(); gctx.arc(gcx,gcy,R,0,Math.PI*2); gctx.fill();
    gctx.restore();

    // sphere shading (soft highlight, darker toward the rim) plus the same
    // dark vignette the old photo-frame version used, so the disc still
    // blends cleanly into the page background at its edge
    const shade=gctx.createRadialGradient(gcx-R*0.35,gcy-R*0.4,R*0.1,gcx,gcy,R);
    shade.addColorStop(0,'rgba(255,255,255,0.14)');
    shade.addColorStop(0.55,'rgba(0,0,0,0)');
    shade.addColorStop(1,'rgba(0,0,0,0.6)');
    gctx.fillStyle=shade; gctx.beginPath(); gctx.arc(gcx,gcy,R,0,Math.PI*2); gctx.fill();

    gctx.restore();

    // the chosen latitude — a plain chord, its own length and height the whole control.
    // white rather than the site's usual gold so it actually stands out against the
    // globe's own blues and greens, instead of blending into their similar warm tone
    const ly=gcy-Math.sin(lat)*R, lx=Math.cos(lat)*R;
    gctx.strokeStyle='#ffffff'; gctx.lineWidth=2; gctx.lineCap='round';
    gctx.shadowColor='rgba(255,255,255,.8)'; gctx.shadowBlur=4;
    gctx.beginPath(); gctx.moveTo(gcx-lx,ly); gctx.lineTo(gcx+lx,ly); gctx.stroke();
    gctx.shadowBlur=0;
  }

  // ---------- time: real precession is imperceptibly slow — a speed slider
  // scales the simulated clock so the same physics can be watched honestly slow
  // or sped up enough to see happen, rather than picking one fixed rate ----------
  let speedAmt=speedSlider.value/100;
  speedSlider.addEventListener('input', ()=>{ speedAmt=speedSlider.value/100; });
  // 1x (real time) up to ~800x. Capped well below the point where the plane's
  // own rotation could outrun the swing itself (3.4s) — even at the pole, the
  // fastest case there is, a full turn still takes ~108s, comfortably slower
  // than one swing so the line always reads as a line, never a spiral.
  function speedMultiplier(){ return Math.pow(10, speedAmt*2.9); }

  // ---------- pendulum ----------
  /* The trail is held to a fixed LENGTH rather than a fixed time. The bob is
     nearly stationary at each end of its swing and fastest through the middle, so
     a time-based trail would be a dot at the turning points and a streak across
     the centre -- and the turning points are where the pins are, which is where
     the direction of the swing most needs to be readable. Points closer together
     than a fortieth of the amplitude are merged, which caps it at about thirty
     segments however slowly the bob is moving. */
  const TRAIL_FRAC = 0.34;      // of the swing's amplitude
  let trail = [];
  function clearTrail(){ trail.length = 0; }
  function drawTrail(bx, by, amp){
    const last = trail[trail.length-1];
    if (!last || Math.hypot(bx-last.x, by-last.y) >= amp*0.012) trail.push({x:bx, y:by});
    else { last.x = bx; last.y = by; }
    let run = 0, cut = 0;
    for (let i=trail.length-1; i>0; i--){
      run += Math.hypot(trail[i].x-trail[i-1].x, trail[i].y-trail[i-1].y);
      if (run >= amp*TRAIL_FRAC){ cut = i-1; break; }
    }
    if (cut > 0) trail.splice(0, cut);
    if (trail.length < 2) return;
    ctx.lineCap = 'round';
    for (let i=1; i<trail.length; i++){
      const k = i/(trail.length-1);
      ctx.strokeStyle = 'rgba(233,217,168,'+(0.34*k*k).toFixed(3)+')';
      ctx.lineWidth = 0.6 + 2.0*k;
      ctx.beginPath();
      ctx.moveTo(trail[i-1].x, trail[i-1].y);
      ctx.lineTo(trail[i].x, trail[i].y);
      ctx.stroke();
    }
  }

  const SWING_PERIOD=3.4;      // seconds, the ordinary back-and-forth
  const DAY=86400;             // seconds -- the solar day, for clock things
  /* What the plane of a Foucault pendulum turns against is the FIXED STARS, not
     the sun, so the day that governs it is the SIDEREAL one: 23h 56m 04s, not 24
     hours. It is the second-most-quoted fact about these pendulums after the
     sin(latitude) rule, and it is why the textbook rate is 15.041 deg/hour rather
     than a round 15. Measured before this was put right: the plane came round in
     exactly 24h 00m at the pole against the real 23h 56m 04s, and every latitude
     ran 0.27% slow. Invisible to anybody watching -- about a degree of lag after a
     whole day -- and wrong all the same, which is the standard this piece was
     signed off against. */
  const SIDEREAL_DAY=86164.0905;   // seconds: one turn of the Earth against the stars
  let planeAngle=0;
  let simClock=0;
  let last=performance.now();

  let floorLayer=null;
  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth; H=window.innerHeight;
    canvas.width=W*DPR; canvas.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
    clearTrail();                 // it is measured against the amplitude, which just changed
    // size against whichever dimension is actually tight — on a narrow phone
    // that's width, and the old min(W,H) sizing left the circle stranded small
    // with a lot of dead space above it once the dock's own height was spent
    const topMargin=50, dockReserve=100;
    const usableH=Math.max(200,H-topMargin-dockReserve);
    floorR=Math.min(W*0.46, usableH/2*0.94);
    cx=W/2; cy=topMargin+usableH/2;
    floorLayer=document.createElement('canvas'); floorLayer.width=W; floorLayer.height=H;
    const fl=floorLayer.getContext('2d');
    const g=fl.createRadialGradient(cx,cy,0,cx,cy,floorR);
    g.addColorStop(0,'#221d17'); g.addColorStop(0.7,'#171310'); g.addColorStop(1,'#0c0a08');
    fl.fillStyle=g; fl.beginPath(); fl.arc(cx,cy,floorR,0,7); fl.fill();
    fl.strokeStyle='rgba(231,221,201,.12)'; fl.lineWidth=1;
    fl.beginPath(); fl.arc(cx,cy,floorR*0.86,0,7); fl.stroke();
    sandLayer=document.createElement('canvas'); sandLayer.width=W; sandLayer.height=H;
    scourTile=null; scourJob=null;        // amp changed, so the scour must be re-made
    sandCtx=sandLayer.getContext('2d');
    sandPrev=null;   // the old sand went with the old layer; don't draw across the gap
    sandDeposit.fill(0);
    reDerive();    // in real time the whole rosette is re-derived onto the new layer
  }
  window.addEventListener('resize',resize);

  // ---------- pins: a ring of 24 pegs, 15 degrees apart — an hour's worth of
  // turn each, but only at the pole, where the plane really does come round at
  // 15 deg/hour. Everywhere else the same peg takes 1/sin(latitude) times as
  // long, which is the point: the ring is a clock that runs slower the further
  // you are from the pole, and stops on the equator. The bob nudges them over
  // as it reaches each extreme of its swing — the bob only ever touches the
  // ring on whichever side it's currently swung out to, so a pin and the one
  // opposite it fall half a swing apart, not together, alternating with the
  // back-and-forth: one on the out-swing, the next opposite on the return.
  // a full ring still empties in half a rotation, that symmetry is real. the
  // ring resets once it's emptied.
  const PIN_COUNT=24, PIN_R_FRAC=0.72, FALL_DUR=0.35;
  let pins=Array.from({length:PIN_COUNT},(_,i)=>({ angle:(i/PIN_COUNT)*Math.PI*2, major:i%6===0, knocked:false, knockedAt:-1 }));
  let prevSwingFrac=1, prevRising=false;
  let posSweepAngle=planeAngle, negSweepAngle=planeAngle+Math.PI;
  function sweepKnock(prevA, currA, t){
    // south of the equator the plane precesses the other way, so currA can
    // land below prevA just as often as above it — sweep by range, not by
    // assumed direction, or the ring stops dead the moment it flips sign.
    const lo=Math.min(prevA,currA), hi=Math.max(prevA,currA);
    for(const p of pins){
      if(p.knocked) continue;
      let k=p.angle+Math.ceil((lo-p.angle)/(Math.PI*2))*(Math.PI*2);
      for(; k<=hi; k+=Math.PI*2){ p.knocked=true; p.knockedAt=t; break; }
    }
  }
  function updatePins(t, swingFrac){
    const rising = swingFrac > prevSwingFrac;
    if(prevRising && !rising){
      // just swung out to the "positive" side and touched the ring there
      sweepKnock(posSweepAngle, planeAngle, t);
      posSweepAngle = planeAngle;
    } else if(!prevRising && rising){
      // just swung out to the opposite side and touched the ring there
      const curr = planeAngle + Math.PI;
      sweepKnock(negSweepAngle, curr, t);
      negSweepAngle = curr;
    }
    prevSwingFrac = swingFrac; prevRising = rising;
    if(pins.every(p=>p.knocked)){
      for(const p of pins){ p.knocked=false; p.knockedAt=-1; }
      if(!sandEternal){ clearSand(); sweptTo=planeAngle; }
    }
  }
  function drawPins(t){
    const baseR=floorR*PIN_R_FRAC;
    for(const p of pins){
      let fall=0;
      if(p.knocked){ fall=Math.min(1,(t-p.knockedAt)/FALL_DUR); fall=1-Math.pow(1-fall,3); }
      const len=p.major?13:9;
      // pushed straight outward, away from the pivot — never sideways —
      // the same direction the bob approached from
      const dirA=p.angle;
      const push=fall*7;
      const x0=Math.cos(p.angle)*baseR, y0=Math.sin(p.angle)*baseR;
      const x1=x0+Math.cos(dirA)*(len+push), y1=y0+Math.sin(dirA)*(len+push);
      const perpA=dirA+Math.PI/2;

      /* THE BRIGHT ONE IS THE PIN THAT IS STILL STANDING, and it has to be that
         way round. It was the other way about: a fallen pin got a saturated brass
         bead at full opacity, the brightest thing on the plate after the bob, and
         a standing one got a stroke at alpha 0.26. So a ring of bright beads sat
         over exactly the ground the swing had already crossed, and it read as
         "the pins are still here" -- the plain opposite of what the plate was
         saying, with the sand beneath it saying the truth. Nothing was wrong
         underneath; it was unreadable, which on this piece is its own fault. Her
         words: it can be true and still teach nothing if you cannot look at it.
         On a real ring it is the brass tops of the upright pins that catch the
         light and the knocked ones that lie dark on the floor.
         The shape carries it as well as the brightness -- an upright is a short
         stub with its head close in, a fallen one is a long shaft pushed well out
         with a dull head at the end. */
      const lit = 1 - fall*0.72;
      ctx.strokeStyle=`rgba(233,217,168,${((p.major?0.5:0.34)*lit).toFixed(3)})`;
      ctx.lineWidth=p.major?2:1.4;
      ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();

      const r=p.major?3.6:2.6;
      const bg=ctx.createRadialGradient(x1-r*0.3,y1-r*0.35,0.3,x1,y1,r);
      bg.addColorStop(0,'#f3d489'); bg.addColorStop(0.6,'#c99a3f'); bg.addColorStop(1,'#8a6420');
      ctx.beginPath(); ctx.arc(x1,y1,r,0,7); ctx.fillStyle=bg; ctx.fill();
      if(fall>0.001){
        // put out: the same head, gone dark on the floor
        ctx.beginPath(); ctx.arc(x1,y1,r,0,7);
        ctx.fillStyle=`rgba(12,10,8,${(fall*0.74).toFixed(3)})`; ctx.fill();
      }
    }
  }

  // ---------- real-world time ----------
  // The checkbox hands the plane over to the actual clock. It then precesses at
  // the true Foucault rate — one turn per day times sin(latitude), the latitude
  // this piece already knows from the globe or the visitor's own position — and
  // nothing scales it. The honest caveat is that at that rate the turn is very
  // nearly imperceptible: the better part of a day for one rosette. The swing
  // itself stays exactly as lively as ever; only the slow rotation goes
  // real-slow. That's why it's a checkbox and not the new default.
  //
  // Nothing is remembered and no drawing is saved. The plane's angle is a pure
  // function of the clock and the latitude, and so, therefore, is the whole
  // rosette — so switching it on (or changing latitude, or resizing) recomputes
  // the trace the plate would have drawn by now in one pass and lays it down.
  const realToggle=document.getElementById('realToggle');
  let realTime=false, pendingRebuild=false;
  /* THE SWEPT GROUND HAS TO KEEP GROWING. Hers, 4 Sep 2026, with a picture: dark
     ground beyond the pale sector, with only the bright stylus fans in it, and
     "the black spots seem to happen when i have the browser minimized or closed."
     Exactly right, and the cause is older than the scouring that made it visible:
     `sweepSand` had ONE call site, the last line of `rebuildRealTrace`, so in real
     time the worked ground was a snapshot taken the moment the clock was ticked and
     never grew again. The plane went on turning and the bob went on drawing its thin
     live line, but the ground it crossed was never worked, so everything after that
     moment was a bright thread on bare floor. Minimising makes it stark rather than
     causing it: the frame loop stops, so not even the thread is drawn for that
     while, and you come back to a clean dark band.
     `sweptTo` is how far the sector has actually been laid. The tick extends it once
     the plane has moved a whole sand bin — about four minutes at the true rate, so
     it costs nothing, and a long absence is caught up in one arc on return. Manual
     mode is deliberately left alone: there the passes are far enough apart to read
     as separate lines, which is the piece at its most legible and what the fan and
     the rosette are. */
  let sweptTo=0;
  function reDerive(){ if(realTime) pendingRebuild=true; }

  // local midnight is the anchor: as arbitrary as a real pendulum's starting
  // bearing, but fixed — so the same latitude at the same moment always gives
  // the same figure, with nothing stored anywhere to make it so.
  function secondsSinceMidnight(){
    const d=new Date();
    return d.getHours()*3600+d.getMinutes()*60+d.getSeconds()+d.getMilliseconds()/1000;
  }
  function realPlaneAngle(){ return (Math.PI*2)*Math.sin(lat)*(secondsSinceMidnight()/SIDEREAL_DAY); }

  // the ground the bob has been over between two plane angles. At the real rate
  // successive passes land 0.007 degrees apart — far closer than a grain is
  // wide — so there are no separate lines to draw here: the sand across that
  // whole arc has simply been worked, and every part of it is at the groove's
  // own ceiling. Drawing it as thousands of overlapping chords instead would
  // pile the middle up to white, where all of them cross, and leave the rim
  // faint — the exact inverse of the trace's real signature, which is darkest
  // at the turning points because that's where the bob lingers.
  /* How hard the sand has been worked, across the radius.
     A swinging weight is slowest at the ends of its swing and fastest through the
     middle, so the time it spends per unit of radius goes as 1/v — and for a
     pendulum v is proportional to sqrt(A^2 - r^2). That piles the working up hard
     at both turning points near the rim and leaves the middle barely touched. It
     is the real signature of one of these plates, and it is what makes a trace
     read as SAND rather than as a shape.
     The gradient here used to run 0.20 at the pivot to 0.44 at the rim — barely
     two to one, near enough a flat fill — so the swept region came out as a solid
     slab with a straight edge, which reads as a clock hand sweeping a dial rather
     than as a pendulum. Her report, and she was right about the impression even
     though the swing underneath it was measured as perfect.
     Clamped near the rim, because the true curve goes to infinity at the turning
     point itself and an infinitely bright ring is not sand either. */
  const SWEPT_BASE=0.055, SWEPT_CLAMP=6.2;
  const dwellAt=u=>Math.min(SWEPT_CLAMP, 1/Math.sqrt(Math.max(1e-4, 1-u*u)));
  function sweptGradient(scale){
    const amp=floorR*0.72;
    const g=sandCtx.createRadialGradient(cx,cy,0,cx,cy,amp);
    for(const u of [0,0.3,0.5,0.7,0.82,0.9,0.95,0.97,0.99,1]){
      g.addColorStop(u, 'rgba(233,217,168,'+(SWEPT_BASE*dwellAt(u)*scale).toFixed(4)+')');
    }
    return g;
  }

  /* WORKED GROUND HAS TO LOOK WORKED. Hers, 4 Sep 2026, on the real-time trace with
     the sand kept: "this is real-time-plus-persistent-sand-marks, and it just looks
     like wedges. nothing about that seems... visually explanatory." She is right, and
     the three states together say why: the piece explains itself through SEPARATE
     PASSES -- fanning at the default speed, a rosette with the sand kept -- and at the
     true rate consecutive passes land 0.007 degrees apart, finer than a pixel and finer
     than a grain, so they merge and the one legible feature averages away. What is left
     is area, and area with a hard radial edge is a pie chart.
     Spacing the grooves out to fake the fan would LIE: a plate swept fourteen hours
     really has been worked solid, about 25,000 passes, and that lie is the same kind as
     the solar-day rate that had to be fixed. So the geometry is untouched. What changes
     is that the swept ground stops being a flat tint:
       - it is SCOURED RADIALLY, because every groove runs through the centre, so the
         working leaves directional streaking. Short broken streaks at random radii,
         never full-radius lines -- a line from pivot to rim would read as one pass and
         be countable, which is the same lie again.
       - the turning points carry a HEAPED LIP. The bob dwells longest there and the
         sand it displaces piles at the outer end of the groove, so the swept edge is a
         raised rim with the ground falling away outside it, not a cut.
     Alpha is kept at 0.012-0.045 a streak. That matters: the temporal fade backed out
     earlier stippled because eighteen stacked fills at a few THOUSANDTHS is below what
     the canvas can hold, and it dithered. Strokes in the hundredths are well clear of
     that floor. */
  /* THE SCOUR IS DRAWN ONCE AND KEPT. Batching the strokes into a few bands was
     tried first and did almost nothing -- 449ms to 480ms on a processor six times
     slower than this one -- which says the cost is the drawing itself and not the
     per-call overhead: twelve thousand short antialiased strokes over a big clipped
     area is simply a lot of blending. Since the ground is scoured the same way
     everywhere (radially, because every groove runs through the centre), the texture
     does not depend on WHICH sector has been worked. So it is built once for the
     whole plate, at half scale, and each sweep clips its sector and blits it. A
     rebuild -- ticking the clock, dragging the latitude, a resize -- then costs one
     drawImage instead of twelve thousand strokes. Half scale is deliberate as well
     as cheap: scaled back up the streaks soften, which is nearer sand than a crisp
     hairline is. The tile is thrown away on resize, since amp changes with it. */
  const SCOUR_ALPHA=[0.016, 0.055];       // base, and how much the dwell curve adds
  const SCOUR_BANDS=7;
  let scourTile=null, scourJob=null;
  /* Built a slice at a time. The whole tile is about sixteen thousand strokes, which
     is one 200ms lump on a slow processor however it is batched -- so instead of
     spending it the moment the clock is ticked, it is laid down a few hundred strokes
     per frame from the moment the plate exists, in the gaps of an animation that is
     only moving a bob. By the time anyone reaches for the clock it is long done. If
     someone gets there first, scourSand finishes the rest in one go rather than
     drawing half a texture. */
  function startScour(amp){
    const k=0.5;
    const t=document.createElement('canvas');
    t.width=Math.max(1,Math.round(W*k)); t.height=Math.max(1,Math.round(H*k));
    const tcx=cx*k, tcy=cy*k, tamp=amp*k;
    const n=Math.ceil(2600*Math.PI*2);     // the whole plate, not one sector
    const bands=[];
    for(let i=0;i<SCOUR_BANDS;i++) bands.push([]);
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2;
      // biased outward: the ground nearest the turning points is worked hardest
      const u=Math.pow(Math.random(),0.55);
      const len=tamp*(0.03+Math.random()*0.075);
      const r0=Math.max(1, u*tamp-len*0.5), r1=Math.min(tamp, r0+len);
      const ca=Math.cos(a), sa=Math.sin(a);
      const d=dwellAt(Math.min(0.999,(r0+r1)/2/tamp))/SWEPT_CLAMP;   // 0..1
      const bi=Math.min(SCOUR_BANDS-1, Math.floor(d*SCOUR_BANDS));
      bands[bi].push(tcx+ca*r0, tcy+sa*r0, tcx+ca*r1, tcy+sa*r1);
    }
    const g=t.getContext('2d');
    g.lineCap='round';
    scourJob={ t, g, bands, band:0, at:0 };
  }
  function stepScour(budget){
    if(!scourJob) return;
    const j=scourJob;
    let left=budget;
    while(j.band<SCOUR_BANDS && left>0){
      const arr=j.bands[j.band];
      if(j.at>=arr.length){ j.band++; j.at=0; continue; }
      const take=Math.min(left*4, arr.length-j.at);
      j.g.strokeStyle='rgba(243,230,190,'+(SCOUR_ALPHA[0]+SCOUR_ALPHA[1]*((j.band+0.5)/SCOUR_BANDS)).toFixed(3)+')';
      j.g.lineWidth=0.45+(j.band%3)*0.3;
      j.g.beginPath();
      for(let m=j.at;m<j.at+take;m+=4){ j.g.moveTo(arr[m],arr[m+1]); j.g.lineTo(arr[m+2],arr[m+3]); }
      j.g.stroke();
      j.at+=take; left-=take/4;
    }
    if(j.band>=SCOUR_BANDS){ scourTile=j.t; scourJob=null; }
  }
  function scourSand(lo, hi, amp){
    if(!sandCtx || hi<=lo) return;
    if(!scourTile){
      if(!scourJob) startScour(amp);
      stepScour(Infinity);                // wanted before it was ready: finish it now
    }
    sandCtx.save();
    for(const off of [0, Math.PI]){
      sandCtx.save();
      sandCtx.beginPath(); sandCtx.moveTo(cx,cy);
      sandCtx.arc(cx,cy,amp,lo+off,hi+off); sandCtx.closePath(); sandCtx.clip();
      sandCtx.drawImage(scourTile, 0,0,scourTile.width,scourTile.height, 0,0,W,H);
      sandCtx.restore();
      // the heaped lip at the turning point, and the ground falling away outside it
      const lip=sandCtx.createRadialGradient(cx,cy,amp*0.955,cx,cy,amp*1.035);
      lip.addColorStop(0,   'rgba(243,230,190,0)');
      lip.addColorStop(0.45,'rgba(247,236,201,0.30)');
      lip.addColorStop(0.62,'rgba(120,104,74,0.16)');
      lip.addColorStop(1,   'rgba(120,104,74,0)');
      sandCtx.fillStyle=lip;
      sandCtx.beginPath(); sandCtx.moveTo(cx,cy);
      sandCtx.arc(cx,cy,amp*1.035,lo+off,hi+off); sandCtx.closePath(); sandCtx.fill();
    }
    sandCtx.restore();
  }

  function sweepSand(from, to){
    if(!sandCtx || from===to) return;
    const amp=floorR*0.72;
    let lo=Math.min(from,to), hi=Math.max(from,to);
    if(hi-lo>=Math.PI){ lo=0; hi=Math.PI; }   // half a turn already covers the whole floor
    // a pass is a whole diameter, so each arc of plane angle scours two
    // opposite sectors — the same symmetry that empties the pin ring in half
    // a turn rather than a whole one
    const wedge=(a0,a1)=>{
      for(const off of [0, Math.PI]){
        sandCtx.beginPath(); sandCtx.moveTo(cx,cy);
        sandCtx.arc(cx,cy,amp,a0+off,a1+off); sandCtx.closePath(); sandCtx.fill();
      }
    };
    /* One fill, not a stack. Fading the sweep from settled at the far end to
       fresh at the leading edge was tried and BACKED OUT: built from wedges that
       share the leading edge and reach progressively further back, it needs about
       eighteen fills at an alpha of a few thousandths each, and the canvas
       dithers alpha that low — the whole swept region came out crosshatched with
       stipple. Noise instead of sand is a worse fault than the hard edge it was
       there to soften, and softening that edge properly wants an angular gradient
       the older browsers on her test bench may not have. If it is ever wanted,
       that is the way in: a conic gradient where it exists, this fill where it
       doesn't. */
    sandCtx.fillStyle=sweptGradient(1);
    wedge(lo, hi);
    scourSand(lo, hi, amp);
    const STEP=(Math.PI*2)/SAND_BINS;
    for(let a=lo; a<=hi+STEP; a+=STEP){
      sandDeposit[sandBin(a)]=SAND_CAP_PASSES;   // worked ground; the live stylus adds nothing to it
      sandDeposit[sandBin(a+Math.PI)]=SAND_CAP_PASSES;
    }
    // except the one it's in now. Old sand slumps back under the shaking; the
    // groove being cut this minute is the sharp one, and the stylus keeps
    // drawing it — which is also what makes the leading edge findable at all
    sandDeposit[sandBin(to)]=0; sandDeposit[sandBin(to+Math.PI)]=0;
  }

  // replay: step the plane through every angle it has held since midnight and
  // knock the pins it would have knocked on the way — including the ring's own
  // resets, which wipe the sand behind them exactly as they do live, so the
  // trace that's left starts from the last of those and not from midnight. One
  // step per sand bin, so 2048 of them at the very most, once.
  function rebuildRealTrace(){
    pendingRebuild=false;
    if(!sandCtx) return;
    const total=realPlaneAngle();
    const dir=total<0?-1:1, STEP=(Math.PI*2)/SAND_BINS;
    for(const p of pins){ p.knocked=false; p.knockedAt=-1; }
    clearSand();
    posSweepAngle=0; negSweepAngle=Math.PI;
    let from=0;   // where the sand standing on the floor now began
    const steps=Math.floor(Math.abs(total)/STEP);
    for(let i=1;i<=steps;i++){
      const a=dir*i*STEP;
      // -1e6 as the knock time: long settled, so they render as fallen, not falling
      sweepKnock(posSweepAngle, a, -1e6); posSweepAngle=a;
      sweepKnock(negSweepAngle, a+Math.PI, -1e6); negSweepAngle=a+Math.PI;
      if(pins.every(p=>p.knocked)){
        for(const p of pins){ p.knocked=false; p.knockedAt=-1; }
        if(!sandEternal) from=a;
      }
    }
    planeAngle=total; posSweepAngle=total; negSweepAngle=total+Math.PI; sweptTo=total;
    prevSwingFrac=1; prevRising=false; sandPrev=null; clearTrail();
    sweepSand(from, total);
  }

  function setRealTime(v){
    realTime=v;
    realToggle.setAttribute('aria-checked', String(v));
    realToggle.classList.toggle('active', v);
    speedSlider.disabled=v;
    speedIcon.classList.toggle('off', v);

  realToggle.addEventListener('click', ()=>setRealTime(!realTime));
  realToggle.addEventListener('keydown', e=>{
    if(e.key===' '||e.key==='Enter'){ e.preventDefault(); setRealTime(!realTime); }
  });

  function tick(now){
    const t=now*0.001;
    const dtReal=Math.min((now-last)/1000,0.05); last=now;
    drawGlobe(t);

    // the swing itself always runs at its own honest pace
    simClock += dtReal;
    const swingFrac = Math.cos((simClock/SWING_PERIOD)*Math.PI*2);

    // the plane's precession is the only thing time-speed touches — real
    // Foucault physics: a full turn in one SIDEREAL day at the poles (23h 56m 04s,
    // because what it turns against is the stars and not the sun), none at the
    // equator, scaled by sin(latitude) everywhere between; opposite sign each
    // hemisphere
    if(realTime){
      // no accumulation at all here: the angle is read straight off the clock,
      // which is why nothing has to be remembered between visits
      if(pendingRebuild && !draggingGlobe) rebuildRealTrace();
      planeAngle = realPlaneAngle();
      // the ground the plane has crossed since the last bin, worked in one go —
      // which is also how a long minimise is caught up on the way back
      if(Math.abs(planeAngle-sweptTo) >= (Math.PI*2)/SAND_BINS){
        sweepSand(sweptTo, planeAngle); sweptTo=planeAngle;
      }
    } else {
      const dtSim = dtReal*speedMultiplier();
      planeAngle += (Math.PI*2) * (Math.sin(lat)/SIDEREAL_DAY) * dtSim;
    }
    updatePins(t, swingFrac);
    if(!scourTile){ if(!scourJob) startScour(floorR*0.72); stepScour(420); }

    const amp=floorR*0.72;

    const bx=Math.cos(planeAngle)*amp*swingFrac, by=Math.sin(planeAngle)*amp*swingFrac;

    // Sand trace: the stylus is on the bob, so the mark is the ground the bob has
    // actually crossed since last frame — not the whole swing line. Laying the
    // full chord every frame drew sand an average 35% of the way out past wherever
    // the bob had got to, and it made the darkness depend on the frame rate rather
    // than on the pendulum: the same pixel was repainted every frame instead of
    // once per pass. Tracking the bob fixes both, and gets the real trace's
    // signature for free — the bob is barely moving at each end of its swing, so
    // several frames' worth of marks pile up in the same place and the turning
    // points come out dark, while it races through the middle and leaves the
    // faintest line there. The layer never clears itself; only the pin-ring reset
    // (or never, in ∞ mode) wipes it, so it fans slowly into a rosette.
    const bin=sandBin(planeAngle);
    if(sandPrev && sandDeposit[bin]<SAND_CAP_PASSES){
      sandDeposit[bin] += dtReal/(SWING_PERIOD/2);   // one pass is half a period
      sandCtx.save();
      sandCtx.translate(cx,cy);
      sandCtx.strokeStyle='rgba(233,217,168,0.16)';
      sandCtx.lineWidth=1; sandCtx.lineCap='round';
      sandCtx.beginPath(); sandCtx.moveTo(sandPrev.x,sandPrev.y); sandCtx.lineTo(bx,by); sandCtx.stroke();
      sandCtx.restore();
    }
    sandPrev={x:bx,y:by};

    ctx.clearRect(0,0,W,H);
    ctx.drawImage(floorLayer,0,0,W,H);
    ctx.drawImage(sandLayer,0,0,W,H);

    ctx.save();
    ctx.translate(cx,cy);
    drawPins(t);
    /* The swing plane used to be drawn here as a full diameter at constant
       brightness, edge to edge -- and a line of fixed length sweeping round a
       circle is the visual language of a clock hand, which is how she read it in
       both modes: "the line moves AHEAD of the pendulum swing". Measured, it never
       does: the bob sits on that line to within 0.07 degrees over 658 frames. What
       runs ahead is the RATIO. The speed slider turns the plane without touching
       the swing, so at its default the plane turns 1.87 degrees per swing where in
       life it turns 0.009 -- and a rigid pointer is what made that legible as a
       hand rather than as a pendulum. Her call: a short trail behind the weight
       instead. It is ground the bob has just crossed, so it can never reach ahead
       of it, and it carries the precession's own curve for free. */
    drawTrail(bx, by, amp);

    // thread from the (implied, off the top of the frame) pivot
    ctx.strokeStyle='rgba(20,17,14,.5)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(bx,by); ctx.stroke();
    // bob shadow, then bob
    ctx.beginPath(); ctx.ellipse(bx,by+7,13,7,0,0,7);
    ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fill();
    const bobG=ctx.createRadialGradient(bx-5,by-6,1,bx,by,14);
    bobG.addColorStop(0,'#f2e6c8'); bobG.addColorStop(0.6,'#c9a95f'); bobG.addColorStop(1,'#7a5d28');
    ctx.beginPath(); ctx.arc(bx,by,12,0,7); ctx.fillStyle=bobG; ctx.fill();
    ctx.restore();

    requestAnimationFrame(tick);
  }
  resize();
  requestAnimationFrame(tick);
})();
</script>

<script>
(function(){
  var disc=document.getElementById('shelfdisc'), box=document.getElementById('plates');
  var rows=[].slice.call(box.querySelectorAll('.row'));
  function unroll(){ rows.forEach(function(r){ r.classList.remove('rolled'); }); }
  function shut(){ box.classList.remove('open'); disc.setAttribute('aria-expanded','false'); unroll(); }

  /* The twenty cards behind these plates are 6.2MB and not one of them can be
     seen until a plate is opened, but every page on the site was fetching the lot
     on load, ahead of the piece's own assets. Measured on bowl at 240px with a
     slow phone's CPU and connection, the bowl had still not appeared after 100
     seconds; held back, it is there in 12.
     They are held behind data-src rather than left to loading="lazy" alone,
     because that is a heuristic and not a promise -- the same page deferred them
     on a throttled connection and fetched all twenty on a fast one, since the
     browser's idea of "near the viewport" widens with bandwidth. This is the same
     on every machine. The attribute stays as a second line for anything that
     scrolls them into view another way. */
  var wired=false;
  function fetchCards(){
    if(wired) return; wired=true;
    [].slice.call(box.querySelectorAll('img[data-src]')).forEach(function(im){
      im.src=im.getAttribute('data-src'); im.removeAttribute('data-src');
    });
  }

  disc.addEventListener('click', function(ev){
    ev.stopPropagation();
    var open=box.classList.toggle('open');
    if(open) fetchCards();
    disc.setAttribute('aria-expanded', open?'true':'false');
    if(!open) unroll();
  });

  // Same bargain the case itself strikes: a mouse can hover, so a plate is a link
  // straight to its shelf. A thumb cannot, so the first tap on a plate rolls its
  // pieces out and only the second one goes to the shelf.
  var FINE=matchMedia('(hover: hover) and (pointer: fine)');
  rows.forEach(function(row){
    row.querySelector('.tag').addEventListener('click', function(ev){
      if(FINE.matches) return;
      if(row.classList.contains('rolled')) return;
      ev.preventDefault();
      unroll(); row.classList.add('rolled');
    });
  });

  document.addEventListener('click', function(ev){
    if(!box.contains(ev.target) && ev.target!==disc) shut();
  });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') shut(); });
})();
</script>
