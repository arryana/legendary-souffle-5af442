<script>
(function(){
  const pick=document.getElementById('musicPick'), el=document.getElementById('musicEl'),
        btn=document.getElementById('musicBtn'), name=document.getElementById('musicName');
  let list=[], idx=0;
  const label=f=> f ? f.name.replace(/\.[^.]+$/,'') : '';
  function load(i){ if(el.src) URL.revokeObjectURL(el.src); el.src=URL.createObjectURL(list[i]); name.textContent=label(list[i]); }
  function sync(){ btn.textContent = !el.src ? '🎧' : (el.paused ? '▶' : '❚❚'); btn.classList.toggle('playing', !!el.src && !el.paused); }
  btn.addEventListener('click', ()=>{ if(!list.length){ pick.click(); return; } el.paused ? el.play() : el.pause(); });
  name.addEventListener('click', ()=> pick.click());
  pick.addEventListener('change', ()=>{ if(!pick.files.length) return; list=[...pick.files]; idx=0; el.loop=(list.length===1); load(0); el.play(); });
  el.addEventListener('ended', ()=>{ if(list.length>1){ idx=(idx+1)%list.length; load(idx); el.play(); } });
  el.addEventListener('play', sync); el.addEventListener('pause', sync); el.addEventListener('loadeddata', sync);
  sync();
})();
</script>
<div id="stage"><div id="paneWrap"><canvas id="scene"></canvas></div></div>
<div id="dock"><div id="tiltRow"><span title="tilt">📐</span><input type="range" id="tiltSlider" min="0" max="100" value="35" aria-label="tilt"></div></div>
<script>
(function(){
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  const paneWrap = document.getElementById('paneWrap');
  const tiltSlider = document.getElementById('tiltSlider');

  let W=0,H=0,DPR=1;
  const bgCanvas=document.createElement('canvas'), bgCtx=bgCanvas.getContext('2d');
  const mistCanvas=document.createElement('canvas'), mistCtx=mistCanvas.getContext('2d');
  const glassCanvas=document.createElement('canvas'), glassCtx=glassCanvas.getContext('2d'); // live surface: mist + clearing trails

  function paintGarden(c, blur){
    const g=c.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#383c38'); g.addColorStop(0.5,'#2e322e'); g.addColorStop(0.82,'#2b3028'); g.addColorStop(1,'#38501f'); // greenish only at the low edge
    c.fillStyle=g; c.fillRect(0,0,W,H);
    const blobs=[[0.2,0.24,0.28,'#4f574a'],[0.72,0.14,0.22,'#4b524c'],[0.5,0.5,0.35,'#434a3f'],
      [0.14,0.7,0.25,'#3a4037'],[0.86,0.66,0.3,'#454b40'],[0.4,0.9,0.24,'#40551f'],[0.78,0.92,0.2,'#3a4c22'],
      [0.63,0.4,0.13,'#5b6252'],[0.30,0.52,0.10,'#636a55'],[0.8,0.4,0.09,'#6b7059']];
    c.save(); c.filter='blur('+blur+'px)';
    blobs.forEach(([bx,by,br,col])=>{ c.beginPath(); c.ellipse(bx*W,by*H,br*W,br*H*0.8,0,0,Math.PI*2); c.fillStyle=col; c.fill(); });
    c.restore();
  }
  function buildScene(){
    bgCanvas.width=W; bgCanvas.height=H; mistCanvas.width=W; mistCanvas.height=H;
    paintGarden(bgCtx,13);                 // clearer garden — what a drop reveals
    bgCtx.fillStyle='rgba(202,202,198,0.16)'; bgCtx.fillRect(0,0,W,H);      // keep even the clear view muted/overcast
    paintGarden(mistCtx,24);               // hazier base
    mistCtx.fillStyle='rgba(199,199,195,0.42)'; mistCtx.fillRect(0,0,W,H);  // neutral condensation veil
    mistCtx.save(); mistCtx.globalAlpha=0.06;
    const n=Math.floor(W*H/1100);
    for(let i=0;i<n;i++){ mistCtx.fillStyle=(i&1)?'#ffffff':'#9fb0b4'; mistCtx.fillRect(Math.random()*W,Math.random()*H,1,1); }
    mistCtx.restore();
    glassCanvas.width=W; glassCanvas.height=H; glassCtx.clearRect(0,0,W,H); glassCtx.drawImage(mistCanvas,0,0);
  }
  // the glass surface itself: fog regrows over cleared tracks; moving drops
  // wipe the fog away behind them and shed the odd bead into the trail
  function updateGlass(dt){
    // heals faster at high tilt — faster-sliding drops would otherwise leave trails that
    // stretch for most of the pane's height before the fog catches up and closes them
    const heal = tilt<=0.5 ? 1 : 1 + (tilt-0.5)*14;
    glassCtx.globalAlpha=Math.min(0.07*heal,0.020*dt*heal);        // re-fogging — trails heal a touch faster so they don't pile up
    glassCtx.drawImage(mistCanvas,0,0,W,H);
    glassCtx.globalAlpha=1;
    for(const d of drops){
      if(d.moving && d.vy>0.2){
        const w=d.r*0.72;
        const x0=Math.min(d.px,d.x)-w, x1=Math.max(d.px,d.x)+w;
        glassCtx.save();
        glassCtx.beginPath();
        glassCtx.rect(x0, Math.min(d.py,d.y), x1-x0, Math.abs(d.y-d.py)+0.6);   // continuous track from last position to now
        glassCtx.ellipse(d.x,d.y,w,w*1.05,0,0,Math.PI*2);                         // rounded head
        glassCtx.clip();
        glassCtx.drawImage(bgCanvas,0,0,W,H);          // reveal the clear garden along the track
        glassCtx.restore();
      }
    }
  }
  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    const rect=paneWrap.getBoundingClientRect(); W=rect.width; H=rect.height;
    canvas.width=W*DPR; canvas.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
    buildScene();
  }
  window.addEventListener('resize',resize);
  let tilt=tiltSlider.value/100;
  tiltSlider.addEventListener('input',()=>{ tilt=tiltSlider.value/100; });

  let drops=[];
  // stick (per-drop friction) and vmaxMul give every drop its own slightly different grip and
  // top speed — real glass isn't perfectly uniform, and without this every drop of a given
  // size breaks free at exactly the same instant and falls at exactly the same rate, which
  // reads as artificial lockstep rain rather than something falling naturally.
  function newDrop(x,y,r){
    return { x,y,r, vy:0, moving:false, py:y, px:x, joinedTrail:null,
      settle: 0.15+Math.random()*0.85,   // freshly landed drops sit visibly before they're even eligible to slide
      stick: 0.75+Math.random()*0.6,
      vmaxMul: 0.8+Math.random()*0.45,
      pauseT: 0,          // a real, variable-length hold once it snags — not just a one-frame speed dip
      shedFloor: 2.6,     // how small it can shed down to before running out of pull — set for real once it actually breaks free, from its size at that moment (see below)
      // how readily this particular drop locks onto a trail it passes right next to — many
      // drops never do, same as real rain doesn't uniformly funnel into every streak it
      // happens to pass near
      joinAffinity: Math.random() };
  }
  // persistent streaks left on the glass by drops that have already run — lets a later
  // drop find and get pulled into an already-wet channel instead of always cutting its own
  let trails=[];
  // a raindrop lands somewhere on the glass and sticks where it hits;
  // occasionally a fatter one lands that will run before long
  function spawnDrop(){ const big=Math.random()<0.10; drops.push(newDrop(Math.random()*W, Math.random()*H, big?3.2+Math.random()*2.0:1.5+Math.random()*1.6)); }
  for(let i=0;i<30;i++) drops.push(newDrop(Math.random()*W, Math.random()*H, 1.5+Math.random()*2.4));

  let spawnAccum=0;
  const DROP_VMAX=3.0; // terminal velocity safety net, on top of the tiltT flattening below
  function stepDrops(dt){
    // tilt's effect on gravity flattens past the halfway point — unflattened, high tilt pushes
    // g high enough that nearly every drop (not just the heavy ones) breaks its surface-tension
    // pin at once, so the whole pane starts moving simultaneously and reads as solid streaks
    // instead of rain. Below halfway this matches the old linear response exactly.
    const tiltT = tilt<=0.5 ? tilt : 0.5 + (tilt-0.5)*0.3;
    const g = 0.85*tiltT + 0.02;                 // along-pane gravity from tilt
    // once a drop breaks free at high tilt it rarely re-pins, so it runs all the way to the
    // bottom rather than settling — a full population kept moving continuously covers every
    // column and reads as a solid curtain instead of individual streaks. Thinning the population
    // at high tilt leaves visible glass between the drops that are actually running.
    const maxDrops = tilt<=0.5 ? 105 : Math.round(105 - (tilt-0.5)*170);
    spawnAccum+=dt;
    while(spawnAccum>0.30){ spawnAccum-=0.30; if(drops.length<maxDrops) spawnDrop(); }  // lighter drizzle — most drops sit
    for(const d of drops){
      if(d.settle>0){ d.settle-=dt; continue; }    // freshly landed — visibly sits before it can even be evaluated
      const mass = d.r*d.r;
      const pull = g*mass;                       // gravity pull grows with size
      const pinStatic = 1.35*d.r*d.stick;        // surface tension pins by contact width — breaks free at a realistic (smaller) size
      if(!d.moving && pull>pinStatic){
        d.moving=true;
        // how small it's allowed to shed down to before it runs out of pull, fixed at the
        // size it actually broke free with — a drop that only just condensed past its own
        // threshold has little to spare and stalls out again soon; one that broke free big
        // (spawned big, or grew via merging) keeps far more margin and is the one that
        // realistically makes it all the way to the bottom
        d.shedFloor = Math.max(1.15, d.r*0.55);
      }
      d.px=d.x;
      if(d.moving){
        // a real, variable-length hold rather than a one-frame speed dip — some are barely
        // a flicker, some a proper stick before it lets go again, same as real glass
        if(d.pauseT>0){ d.pauseT-=dt; d.py=d.y; continue; }
        const trailEase = d.joinedTrail ? 0.55 : 1;  // an already-wet channel grips far less
        const pinKinetic = 0.6*d.r*d.stick*trailEase;      // weaker grip once it's sliding (hysteresis)
        d.vy += ((pull-pinKinetic)/mass)*dt*2.4;
        d.vy *= 0.94;
        // small drops carry far less momentum and snag on the glass's own texture much
        // more readily than big ones — a heavy drop barely notices the same fleck of dust
        const snagChance = (0.00028 + 0.0032/d.r)*dt;
        if(Math.random()<snagChance){ d.pauseT = 6 + Math.random()*Math.random()*84; d.vy*=0.12; }
        if(d.vy<0) d.vy=0;
        // smaller drops also have a lower real terminal velocity, not just the same cap
        // scaled by a size-blind random trait — gives the small/big ends of the population
        // clearly different top speeds instead of just a mild per-drop wobble
        const sizeVmaxFactor = 0.32+0.68*Math.min(1,(d.r-1.5)/3.7);
        const vmax = DROP_VMAX*d.vmaxMul*sizeVmaxFactor;
        if(d.vy>vmax) d.vy=vmax;
        d.py=d.y; d.y += d.vy*dt;                 // remember where it was, for a continuous trail
        // once locked onto a nearby trail, tracks its exact line closely rather than easing
        // toward it — a clean, decisive join instead of a lingering sideways coast that
        // never quite arrives. losing the trail drops the lock instantly and the drop falls
        // straight again; it never keeps drifting sideways on its own. plenty of drops have
        // too little affinity to ever look for one at all.
        if(d.joinAffinity>0.35){
          if(d.joinedTrail && (!trails.includes(d.joinedTrail) || d.joinedTrail.yBot<d.y-6 || d.joinedTrail.yTop>d.y+40)){
            d.joinedTrail=null;
          }
          if(!d.joinedTrail){
            let best=null, bestD=7+d.joinAffinity*7;
            for(const tr of trails){ if(tr.yBot<d.y-4 || tr.yTop>d.y+60) continue; const dx=Math.abs(tr.x-d.x); if(dx<bestD){ bestD=dx; best=tr; } }
            if(best) d.joinedTrail=best;
          }
          if(d.joinedTrail) d.x += (d.joinedTrail.x-d.x)*Math.min(1,0.16*dt);
        }
        if(d.vy>0.4) d.r=Math.max(d.shedFloor, d.r-0.006*dt);   // sheds slowly — stays visible leading its own trail
        if(d.vy<0.06 && pull<=pinStatic*trailEase){ d.moving=false; d.vy=0; d.joinedTrail=null; }  // re-pins if it slows & is light — unless a wet trail is still carrying it
        // leaves its passage behind as a trail a later drop can find and join
        let seg=trails.find(t=>Math.abs(t.x-d.x)<5 && d.y>=t.yTop-20 && d.py<=t.yBot+40);
        if(seg){ seg.x=seg.x*0.75+d.x*0.25; seg.yTop=Math.min(seg.yTop,d.py); seg.yBot=Math.max(seg.yBot,d.y); seg.life=110; }
        else trails.push({x:d.x, yTop:Math.min(d.py,d.y), yBot:Math.max(d.py,d.y), life:110});
      } else {                                    // stalled — condensation slowly feeds it, but only up to a size that's
                                                    // still modest at low tilt — a standing drop shouldn't outgrow what a
                                                    // steeper tilt would actually earn it through merging while sliding
        d.vy=0; d.py=d.y; if(d.r<6.5) d.r += (0.0026 + 0.0016*tilt)*dt;
      }
    }
    trails=trails.filter(t=>(t.life-=dt)>0);
    // a moving drop swallows the beads it passes, growing and speeding on
    for(let i=0;i<drops.length;i++){ for(let j=drops.length-1;j>i;j--){ const a=drops[i],b=drops[j];
      if(Math.hypot(a.x-b.x,a.y-b.y) < (a.r+b.r)*0.95){ const R=Math.sqrt(a.r*a.r+b.r*b.r);   // merge as soon as they touch — no overlapping drops
        a.x=(a.x*a.r+b.x*b.r)/(a.r+b.r); a.y=Math.max(a.y,b.y); a.px=a.x;
        a.vy=(a.vy*a.r+b.vy*b.r)/(a.r+b.r); a.r=R; a.moving=a.moving||b.moving; a.joinedTrail=null; drops.splice(j,1);} } }
    drops=drops.filter(d=>d.y-d.r<H+20);
  }

  function drawDrops(){
    ctx.drawImage(glassCanvas,0,0,W,H);
    for(const d of drops){
      const r=d.r;
      ctx.beginPath(); ctx.ellipse(d.x+r*0.16,d.y+r*0.42,r*0.95,r*1.05,0,0,Math.PI*2);
      ctx.fillStyle='rgba(8,14,10,0.30)'; ctx.fill();
      // lens: clip to drop, draw garden magnified + vertically flipped about the drop
      ctx.save();
      ctx.beginPath(); ctx.ellipse(d.x,d.y,r,r*1.05,0,0,Math.PI*2); ctx.clip();
      const mag=1.9;
      ctx.translate(d.x,d.y); ctx.scale(mag,-mag); ctx.translate(-d.x,-d.y);
      ctx.drawImage(bgCanvas,0,0,W,H);
      ctx.restore();
      // refraction rim darkening at the very edge
      ctx.save();
      ctx.beginPath(); ctx.ellipse(d.x,d.y,r,r*1.05,0,0,Math.PI*2); ctx.clip();
      const rim=ctx.createRadialGradient(d.x,d.y,r*0.5,d.x,d.y,r*1.05);
      rim.addColorStop(0,'rgba(0,0,0,0)'); rim.addColorStop(0.8,'rgba(0,0,0,0)'); rim.addColorStop(1,'rgba(12,22,16,0.55)');
      ctx.fillStyle=rim; ctx.fillRect(d.x-r-2,d.y-r*1.05-2,r*2+4,r*2.1+4);
      ctx.restore();
      // bright bead edge (light wraps the lower-right of the drop)
      ctx.beginPath(); ctx.ellipse(d.x,d.y,r*0.98,r*1.03,0,0.5,2.25); ctx.lineWidth=Math.max(0.6,r*0.11); ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.stroke();
      // specular highlight, top-left, consistent light
      const hx=d.x-r*0.34,hy=d.y-r*0.44;
      const hi=ctx.createRadialGradient(hx,hy,0,hx,hy,r*0.5);
      hi.addColorStop(0,'rgba(255,255,255,0.92)'); hi.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=hi; ctx.beginPath(); ctx.ellipse(hx,hy,r*0.42,r*0.34,0,0,Math.PI*2); ctx.fill();
    }
  }

  let lastT=performance.now();
  function loop(t){ const dt=Math.min(t-lastT,50)/16.67; lastT=t; stepDrops(dt); updateGlass(dt); drawDrops(); requestAnimationFrame(loop); }
  resize(); requestAnimationFrame(loop);
})();
</script>

  #plates img{ width:100%; height:100%; object-fit:cover; display:block; }
  @media (prefers-reduced-motion: reduce){

<script>
(function(){
  var disc=document.getElementById('shelfdisc'), box=document.getElementById('plates');
  var rows=[].slice.call(box.querySelectorAll('.row'));
  function unroll(){ rows.forEach(function(r){ r.classList.remove('rolled'); }); }
  function shut(){ box.classList.remove('open'); disc.setAttribute('aria-expanded','false'); unroll(); }

  disc.addEventListener('click', function(ev){
    ev.stopPropagation();
    var open=box.classList.toggle('open');
    disc.setAttribute('aria-expanded', open?'true':'false');
    if(!open) unroll();
  });

  // Same bargain the case itself strikes: a mouse can hover, so a plate is a link
  // straight to its shelf. A thumb cannot, so the first tap on a plate rolls its
  // pieces out and only the second one goes to the shelf.
  var FINE=matchMedia('(hover: hover) and (pointer: fine)');
  rows.forEach(function(row){
    row.querySelector('.tag').addEventListener('click', function(ev){
      if(FINE.matches) return;
      if(row.classList.contains('rolled')) return;
      ev.preventDefault();
      unroll(); row.classList.add('rolled');
    });
  });

  document.addEventListener('click', function(ev){
    if(!box.contains(ev.target) && ev.target!==disc) shut();
  });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') shut(); });
})();
</script>
