<style>
  :root{
    --bg:#050505;
    --brass:#c9974e; --brass-light:#e8c383;
    --parchment:#f2e9d8;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    height:100%; margin:0; overflow:hidden;
    background: var(--bg);
    font-family: Georgia, serif; color:var(--parchment);
  }
  #backlink{
    position:fixed; top:18px; left:22px; z-index:50;
    color:var(--parchment); opacity:.5; text-decoration:none;
    font-size:14px; letter-spacing:.04em; text-shadow:0 1px 3px rgba(0,0,0,.85), 0 0 9px rgba(0,0,0,.55); transition:opacity .3s ease;
  }
  #backlink:hover{opacity:.9;}
  #stage{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
  }
  /* The lamp lives in a fixed-ratio box. Two canvases are stacked inside it,
     filling it exactly: #scene paints the photo + glows, #flame paints the
     wick + flame on top. Matching the photo's real proportions (848x1239)
     keeps it edge-to-edge, so the ambient glow only shows in the margins and
     never as a hard-edged box. */
  /* The dock is fixed to the foot of the page and the lamp used to be centred in
     the whole of it, so on a short screen the bottom of the photograph lay under
     the controls. That cost only the base's shadow until now; it costs the NAIL
     once there is one, and the nail is the one thing here you have to be able to
     reach. --avail is the room the dock leaves, measured in JS; the 72vh is the
     fallback for the first frame and for no script at all. */
  #lampBox{
    position:relative;
    width:min(90vw, 480px, calc(var(--avail, 72vh) * 0.94 * 848 / 1239));
    aspect-ratio:848 / 1239;
  }
  #stage{ height:var(--avail, 100%); bottom:auto; }
  /* A three-inch phone turned sideways is 180px tall, and no arrangement fits a
     photograph of a tall lamp into it -- centring in what the dock leaves would
     give a lamp 44px wide. That one is allowed to SCROLL, which is the answer she
     took for kaleidoscope and for storm where content genuinely does not fit: the
     lamp is held to a size rather than shrunk to a sliver, and everything is
     reachable. A Kindle in landscape is 476 tall and never reaches this. */
  @media (max-height: 430px) and (orientation: landscape){
    html,body{ height:auto; overflow:visible; }
    #stage{ position:static; height:auto; padding:14px 0 124px; }
    #lampBox{ width:min(90vw, 480px, 232px); }
  }
  #lampBox canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; pointer-events:none; }
  /* The nail is a thing in the room, between the visitor and the lamp, so it gets a
     layer of its own above the flame -- not the flame's, which the compositor keeps
     gently out of focus, and not the scene's, which is behind it. */
  #lampBox{ touch-action:none; }
  #lampBox.holding{ cursor:grabbing; }
  #lampBox.overtool{ cursor:grab; }
  /* The flame layer is kept gently out of focus by the browser's compositor in
     one cheap pass, instead of blurring inside the animation loop every frame. */
  #flame{ filter: blur(1.2px); }

  #dock{
    position:fixed; bottom:0; left:0; right:0;
    display:flex; flex-direction:column; align-items:center; gap:12px;
    padding:16px 18px 26px;
    background:linear-gradient(to top, rgba(0,0,0,.85), rgba(0,0,0,0));
    z-index:40;
  }
  #wickRow{ display:flex; align-items:center; gap:12px; }
  input[type=range]{
    -webkit-appearance:none; appearance:none;
    width:170px; height:3px; border-radius:3px;
    background:rgba(242,233,216,.25); outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
    background:var(--brass); cursor:pointer;
    box-shadow:0 0 6px rgba(201,151,78,.6);
  }
  input[type=range]::-moz-range-thumb{
    width:14px; height:14px; border-radius:50%; border:none;
    background:var(--brass); cursor:pointer;
  }
  #shapeRow{ display:flex; align-items:center; gap:10px; }
  #shapeRow input[type=range]{ width:120px; }
  #volumeRow{
    display:flex; align-items:center; gap:10px;
    font-size:12px; opacity:.6; letter-spacing:.03em;
  }
  #volumeRow input[type=range]{ width:100px; }
  #volumeRow input[type=checkbox]{
    -webkit-appearance:none; appearance:none;
    width:14px; height:14px; border-radius:3px;
    border:1px solid rgba(242,233,216,.4);
    background:transparent; cursor:pointer; position:relative;
    margin:0; flex-shrink:0;
  }
  #volumeRow input[type=checkbox]:checked{
    background:rgba(201,151,78,0.25); border-color:var(--brass);
  }
  #volumeRow input[type=checkbox]:checked::after{
    content:''; position:absolute; left:3px; top:0px;
    width:4px; height:8px;
    border:solid var(--brass); border-width:0 2px 2px 0;
    transform:rotate(45deg);
  }
  /* Refilling it. Her ask, and it does two things at once: it takes away the dead
     end a burnt-out lamp would otherwise be, and it lets the tap be compared --
     tap, fill, tap again, and the note has plainly changed, which is the fastest
     way anyone will work out what the tapping is for. It sits in the corner
     opposite the music button rather than in the dock: the dock's height is what
     the lamp is centred against, so a fourth row there would be paid for out of
     the lamp itself, and this costs nothing. Drawn rather than an emoji, as
     musebox's instruments are -- there is no oil can in Unicode, and the nearest
     things (an oil DRUM, a pouring jug from 2021) are either the wrong object or
     too new for a Kindle Fire. */
  #fill{ position:fixed; right:18px; bottom:16px; z-index:60;
    width:34px; height:34px; border-radius:50%; padding:0;
    border:1px solid rgba(242,233,216,.25); background:rgba(20,24,34,.55);
    color:#f2e9d8; cursor:pointer; opacity:.55;
    display:grid; place-items:center;
    transition:opacity .3s, color .3s, border-color .3s;
    -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); }
  #fill:hover{ opacity:1; }
  #fill:active{ color:#f0d69a; border-color:rgba(201,151,78,.6); }
  #fill:focus-visible{ outline:1px solid rgba(242,233,216,.45); outline-offset:3px; }
  #fill svg{ width:21px; height:21px; display:block; }

  .wickIcon{ display:block; background:currentColor; opacity:.55; }
  .barIcon{ width:15px; height:2.5px; border-radius:1.5px; }
  .pointIcon{
    width:0; height:0; background:transparent;
    border-left:6px solid transparent; border-right:6px solid transparent;
    border-bottom:11px solid var(--parchment);
  }
</style>

<style>
  #music{ position:fixed; left:18px; bottom:16px; z-index:60; display:flex; align-items:center; gap:9px; }
  #musicBtn{ width:34px; height:34px; border-radius:50%; border:1px solid rgba(242,233,216,.25); background:rgba(20,24,34,.55); color:#f2e9d8; font-size:15px; line-height:1; cursor:pointer; opacity:.55; transition:opacity .3s, color .3s, border-color .3s; -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); }
  #musicBtn:hover{ opacity:1; }
  #musicBtn.playing{ color:#f0d69a; border-color:rgba(201,151,78,.6); opacity:.9; }
  #musicName{ max-width:40vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; color:#f2e9d8; opacity:0; transition:opacity .3s; letter-spacing:.02em; cursor:pointer; }
  #music:hover #musicName{ opacity:.55; }
  /* a phone has no hover, so the name of the visitor's own track was never
     visible on one at all -- and worse, an invisible thing sat there taking
     taps. While something is playing it simply shows, next to the button.
     Not a caption on the piece: it is their file's name, not the site's words. */
  #musicBtn.playing ~ #musicName{ opacity:.5; }
  /* The music button is pinned in the bottom-left corner and the piece's own dock
     runs the width of the screen, so on a narrow one they can land on top of each
     other. On this page the button was lifted clear of the whole dock -- and that
     put it, on a 240px screen, exactly on the head of the NAIL, which is the one
     thing here you have to be able to pick up. Measured, the only control it ever
     actually touched was the mute box at 240, and only by a few pixels; from 320
     up nothing overlaps at all. So the volume gives up a little length instead --
     the one thing in that row with any to spare, which is the same trade chladni's
     bottom row made -- and the headphones stay in their corner. */
  @media (max-width: 319px){ #volumeRow input[type=range]{ width:64px; } }

<div id="music" title="play your own music">
  <button id="musicBtn" aria-label="play your own music">🎧</button>
  <span id="musicName"></span>
</div>
<input type="file" id="musicPick" accept="audio/*" multiple hidden>
<audio id="musicEl"></audio>
<script>
(function(){
  const pick=document.getElementById('musicPick'), el=document.getElementById('musicEl'),
        btn=document.getElementById('musicBtn'), name=document.getElementById('musicName');
  let list=[], idx=0;
  const label=f=> f ? f.name.replace(/\.[^.]+$/,'') : '';
  function load(i){ if(el.src) URL.revokeObjectURL(el.src); el.src=URL.createObjectURL(list[i]); name.textContent=label(list[i]); }
  function sync(){ btn.textContent = !el.src ? '🎧' : (el.paused ? '▶' : '❚❚'); btn.classList.toggle('playing', !!el.src && !el.paused); }
  btn.addEventListener('click', ()=>{ if(!list.length){ pick.click(); return; } el.paused ? el.play() : el.pause(); });
  name.addEventListener('click', ()=> pick.click());
  pick.addEventListener('change', ()=>{ if(!pick.files.length) return; list=[...pick.files]; idx=0; el.loop=(list.length===1); load(0); el.play(); });
  el.addEventListener('ended', ()=>{ if(list.length>1){ idx=(idx+1)%list.length; load(idx); el.play(); } });
  el.addEventListener('play', sync); el.addEventListener('pause', sync); el.addEventListener('loadeddata', sync);
  sync();
})();
</script>
<div id="stage">

<button type="button" id="fill" title="fill it" aria-label="fill it">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M3.2 13.4a1.8 1.8 0 0 1 1.8-1.8h7.6a1.8 1.8 0 0 1 1.8 1.8v3.4a1.8 1.8 0 0 1-1.8 1.8H5a1.8 1.8 0 0 1-1.8-1.8z"/>
    <path d="M7.1 11.6V9.9a1.5 1.5 0 0 1 1.5-1.5h1.6"/>

</button>

<div id="dock">
  <div id="shapeRow">

    <input type="range" id="wickShapeSlider" min="0" max="100" value="0" title="wick shape: flat to triangular" aria-label="wick shape: flat to triangular">

</div>

<script>
(function(){
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  const flameCanvas = document.getElementById('flame');
  const fctx = flameCanvas.getContext('2d');
  const toolCanvas = document.getElementById('tool');
  const tctx = toolCanvas.getContext('2d');
  // where the photograph lands inside the canvas, kept out here so the pointer can
  // be put back into the photograph's own units
  let photoScale = 0, photoDX = 0, photoDY = 0;
  const wickSlider = document.getElementById('wickSlider');

  let W = 0, H = 0, DPR = 1;
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    const rect = canvas.getBoundingClientRect();
    W = rect.width; H = rect.height;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    flameCanvas.width = W * DPR;
    flameCanvas.height = H * DPR;
    toolCanvas.width = W * DPR;
    toolCanvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    fctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    tctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  // the room the dock leaves, which is what the lamp is centred in
  const dockEl = document.getElementById('dock');
  function fitStage(){
    const h = document.documentElement.clientHeight;
    const d = dockEl.getBoundingClientRect().height;
    document.documentElement.style.setProperty('--avail', Math.max(120, h - d) + 'px');
  }
  window.addEventListener('resize', () => { fitStage(); resize(); });
  setTimeout(() => { fitStage(); resize(); }, 300);

  let wick = wickSlider.value / 100;
  wickSlider.addEventListener('input', () => { wick = wickSlider.value / 100; });

  let wickShape = 0; // 0 = flat wick, 1 = triangular wick — continuous, not a toggle
  const wickShapeSlider = document.getElementById('wickShapeSlider');
  wickShapeSlider.addEventListener('input', () => { wickShape = wickShapeSlider.value / 100; });

  /* STORAGE CAN THROW, rather than merely be empty. A private window, or any
     browser set to block site data, makes `localStorage` raise on the very first
     read -- and read unguarded at the top of a script that takes the WHOLE PIECE
     down with it. Found Aug 2026 by loading every piece with its props taken
     away: with site data blocked, musebox, lamp, roller and storm all came up
     BLANK, and two of those were pieces she had already signed off. candler had
     guarded its own read all along, which is what a right answer looks like.
     Everything goes through these two now. Losing the setting is nothing; losing
     the piece is everything. */
  const readStore = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
  const writeStore = (k,v) => { try{ localStorage.setItem(k,v); }catch(e){} };
  // no-sound and volume are shared site-wide — same localStorage keys
  // the rest of the site uses, so the setting carries over between pages
  const muteCheckbox = document.getElementById('muteCheckbox');
  let muted = readStore('sagne-muted') === 'true';
  muteCheckbox.checked = muted;
  muteCheckbox.addEventListener('change', () => {
    muted = muteCheckbox.checked;
    writeStore('sagne-muted', muted ? 'true' : 'false');
  });

  const volumeSlider = document.getElementById('volumeSlider');
  let volumeLevel = parseFloat(readStore('sagne-volume'));
  if (isNaN(volumeLevel)) volumeLevel = 0.7;
  volumeSlider.value = Math.round(volumeLevel * 100);
  volumeSlider.addEventListener('input', () => {
    volumeLevel = volumeSlider.value / 100;
    writeStore('sagne-volume', volumeLevel);
  });

  // ---------- organic, non-repeating flicker (same turbulence approach
  // as the candle) — but no lean at all. The whole point of a hurricane
  // lamp is the chimney shields the flame from air movement, so it never
  // gutters or drifts; only its height and texture flicker gently.
  function makeTurbChannel(period) { return { v: 0, target: 0, timer: Math.random()*period }; }
  function stepTurb(ch, dt, range, minP, maxP, smooth){
    ch.timer -= dt;
    if (ch.timer <= 0){
      ch.target = (Math.random()*2-1)*range;
      ch.timer = minP + Math.random()*(maxP-minP);
    }
    ch.v += (ch.target - ch.v) * Math.min(1, dt*smooth);
  }
  const turb = {
    height: makeTurbChannel(300), tip: makeTurbChannel(220),
    edgeL: makeTurbChannel(280), edgeR: makeTurbChannel(310)
  };
  function stepFlameTurbulence(dt){
    stepTurb(turb.height, dt, 1, 260, 560, 0.009);
    stepTurb(turb.tip, dt, 1, 160, 380, 0.012);
    stepTurb(turb.edgeL, dt, 1, 220, 500, 0.010);
    stepTurb(turb.edgeR, dt, 1, 240, 520, 0.010);
  }


  // ---------- audio: hiss/roar scaling with wick height, exactly as
  // described — a low hiss turned down, a fuller sound at full flame ----------
  let audioCtx = null, hissGain = null, hissFilter = null;
  function ensureAudio(){
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const bufferSize = audioCtx.sampleRate * 2;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i=0;i<bufferSize;i++) data[i] = Math.random()*2-1;
    const src = audioCtx.createBufferSource();
    src.buffer = buffer; src.loop = true;
    hissFilter = audioCtx.createBiquadFilter();
    hissFilter.type = 'bandpass';
    hissFilter.frequency.value = 900;
    hissFilter.Q.value = 0.6;
    hissGain = audioCtx.createGain();
    hissGain.gain.value = 0;
    src.connect(hissFilter).connect(hissGain).connect(audioCtx.destination);
    src.start();
  }
  document.body.addEventListener('pointerdown', ensureAudio, { once:true });
  function updateAudio(){
    if (!hissGain) return;
    const target = muted ? 0 : (0.015 + wick*0.05) * volumeLevel * flameLife;
    // a starving flame is quieter AND lower: less gas, less roar
    hissGain.gain.setTargetAtTime(target, audioCtx.currentTime, 0.06);
    hissFilter.frequency.setTargetAtTime(500 + wick*900*flameLife, audioCtx.currentTime, 0.2);
  }

  // ---------- fuel, and finding out how much is left ----------------------------
  // Hers, and it is the whole of the interaction: "we used to have an old copper
  // based lamp like that, and my father kept a ten penny nail on the shelf next to
  // it for tapping." A nail lying beside a lamp needs no instructions -- it is a
  // thing a curious person picks up, and a lamp is a thing they then tap. It also
  // settles what the tap has to sound like: steel on copper, not a fingertip.
  //
  // You cannot see how much oil is left, and that is the point rather than a
  // limitation -- it is true of most real lamps, and the knowledge costs an action.
  // A bigger flame burns it faster. Her call on the starting level: a different
  // amount every visit, "the most fun for whomever is interacting" -- and it is
  // also what a lamp found on a shelf actually is.
  let fuel = 0.30 + Math.random()*0.62;
  const BURN = 1/900;          // full to empty in 15 minutes at the biggest flame

  /* What a lamp consumes is what its flame is burning, so the rate has to follow
     the FLAME rather than the position of a slider. It didn't: it was linear in
     the wick-height slider alone, which got the direction right and the amount
     wrong, and left the SHAPE slider out of it entirely -- yet trimming the wick
     to a point is a real change to the flame, from wide and low to narrow and
     tall. Both figures below are read from the very keyframes the renderer draws
     with, so the burn and the picture can never disagree.
     A diffusion flame's output goes with how much of it there is, and this flame
     is close to a body of revolution about the wick, so height x width squared is
     the honest measure -- not height alone. That matters here: trimming to a point
     takes the flame 42% taller and 28% narrower, which LOOKS like more flame and
     is 26% less of it. Normalised to 1.0 at a full, flat wick. */
  function burnRate(){
    const kf = lerpFlameKeyframes(wickShape);
    const h = (40 + wick*95) * kf.heightMult;
    const w = 15 * kf.flameWMult;
    return (h*w*w) / (135*15*15);
  }
  const LOW  = 0.11;           // where the wick starts to starve
  const CHAR_SECS = 11;        // the dry wick burning down to ash

  // Her sequence, in her own words: it should sputter and flicker when the fuel is
  // very low, then get shorter and weaker as it sputters more, then burn the wick
  // down to ash, and go out.
  let char = 0, burntOut = false;
  // A starving wick does not flicker evenly. The flame drops away almost at once
  // when the oil fails to reach the top and comes back more slowly when it does, so
  // this channel falls fast and recovers slow -- which is what reads as sputtering
  // rather than as flickering.
  let sputV = 1, sputTarget = 1, sputTimer = 0;
  function stepSputter(dt, starve){
    if (starve <= 0){ sputV += (1-sputV)*Math.min(1, dt*0.006); return; }
    sputTimer -= dt;
    if (sputTimer <= 0){
      const drop = Math.random() < (0.34 + starve*0.56);
      sputTarget = drop ? Math.max(0.05, 1 - starve*(0.45 + Math.random()*0.5)) : 1;
      sputTimer  = drop ? 60 + Math.random()*210 : 180 + Math.random()*640*(1-starve);
    }
    const rate = sputTarget < sputV ? 0.055 : 0.008;
    sputV += (sputTarget - sputV) * Math.min(1, dt*rate);
  }
  let flameLife = 1, trimming = false;
  function stepFuel(dt){
    const sec = dt/1000;
    // Filling it also means trimming the burnt wick back and putting a light to
    // it, which is what anybody would actually do with a lamp that had gone out --
    // so the char eases away over about a second rather than snapping, and the
    // flame comes up with it. It reads as the wick catching rather than as a
    // state being reset.
    if (trimming){
      char = Math.max(0, char - sec*1.1);
      if (char <= 0.001){ char = 0; trimming = false; }
    } else if (!burntOut){
      if (fuel > 0) fuel = Math.max(0, fuel - sec*BURN*burnRate());
      else { char = Math.min(1, char + sec/CHAR_SECS); if (char >= 1) burntOut = true; }
    }
    const starve = fuel > LOW ? 0 : 1 - fuel/LOW;
    stepSputter(dt, starve);
    flameLife = burntOut ? 0
      : Math.max(0, sputV * (1 - starve*0.62) * (1 - char*0.85));
  }

  // The copper reservoir's own outline, measured off the photograph by hue: the
  // half-width of the body at each height, about the axis the lamp stands on. It is
  // what the nail's point meets, and what decides whether a tap landed above the
  // oil or below it.
  const BASE_CX = 429;
  const BASE = [[878,58],[886,88],[894,110],[904,124],[916,129],[926,138],[936,153],
                [956,154],[976,156],[992,153],[1008,145],[1024,132],[1040,136],
                [1056,136],[1072,140],[1088,152],[1104,156],[1120,151],[1136,144],
                [1152,134],[1164,113],[1174,64],[1179,0]];
  function baseHalfW(y){
    if (y <= BASE[0][0] || y >= BASE[BASE.length-1][0]) return 0;
    for (let i=1;i<BASE.length;i++){
      if (y <= BASE[i][0]){
        const a=BASE[i-1], b=BASE[i];
        return a[1] + (b[1]-a[1])*((y-a[0])/(b[0]-a[0]));
      }
    }
    return 0;
  }
  // where the oil stands inside it, full to dry
  const OIL_TOP = 930, OIL_BOT = 1168;
  function oilY(){ return OIL_BOT - fuel*(OIL_BOT-OIL_TOP); }

  // A can holds what a can holds, so it goes in nearly full and not to an exact
  // line -- which is also what keeps the level worth checking after a fill.
  function refill(){
    fuel = 0.86 + Math.random()*0.14;
    burntOut = false; sputV = 1; sputTarget = 1; sputTimer = 0;
    if (char > 0) trimming = true;
    pourSound();
  }

  // Filling a vessel is the OTHER way round from striking it, and this is the one
  // place on the page where the blown-across-the-top rule is the right one: the
  // air column above the oil gets shorter as it fills, so the note the pour makes
  // RISES. Struck, more oil means a lower note; filled, the gurgle climbs. Both
  // are in here now and they are not the same rule.
  function pourSound(){
    ensureAudio();
    if (muted || !audioCtx) return;
    const t = audioCtx.currentTime, DUR = 1.15;
    const n = Math.floor(audioCtx.sampleRate*DUR);
    const buf = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i=0;i<n;i++){
      const k = i/n;
      const env = Math.min(1, k*9) * Math.min(1, (1-k)*5);
      d[i] = (Math.random()*2-1) * env;
    }
    const src = audioCtx.createBufferSource(); src.buffer = buf;
    const bp = audioCtx.createBiquadFilter();
    bp.type = 'bandpass'; bp.Q.value = 3.2;
    bp.frequency.setValueAtTime(280, t);
    bp.frequency.exponentialRampToValueAtTime(760, t+DUR);
    const g = audioCtx.createGain();
    g.gain.value = 0.16 * volumeLevel;
    src.connect(bp).connect(g).connect(audioCtx.destination);
    src.start(t); src.stop(t+DUR+0.05);
  }

  // ---------- the sound of steel on copper ----------------------------------
  let tickBuffer = null;
  function tickBuf(){
    if (tickBuffer) return tickBuffer;
    const n = Math.floor(audioCtx.sampleRate*0.05);
    tickBuffer = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
    const d = tickBuffer.getChannelData(0);
    for (let i=0;i<n;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/n, 3);
    return tickBuffer;
  }
  function tapSound(hard, aboveOil, f){
    ensureAudio();
    if (muted || !audioCtx) return;
    const t = audioCtx.currentTime, dest = audioCtx.destination;
    const vol = volumeLevel * hard;

    // The first few hundredths of a second are what name the two materials to the
    // ear, before any note has established -- so the contact gets its own pitchless
    // tick. Without one a strike is a synthesiser rather than two objects meeting,
    // which is the lesson the chimes' materials cost a pass to learn.
    const nb = audioCtx.createBufferSource(); nb.buffer = tickBuf();
    const nf = audioCtx.createBiquadFilter(); nf.type='highpass'; nf.frequency.value=2400;
    const ng = audioCtx.createGain();
    ng.gain.setValueAtTime(0.55*vol, t);
    ng.gain.exponentialRampToValueAtTime(0.0001, t+0.04);
    nb.connect(nf).connect(ng).connect(dest); nb.start(t); nb.stop(t+0.06);

    // The shell's own note. STRUCK, not blown, which is the easy thing to get
    // backwards because the two run opposite ways: blown across the top, more
    // liquid means a shorter air column and a HIGHER pitch; struck, the liquid
    // mass-loads the walls and drags the frequency DOWN. So a full lamp is low and
    // dull and an empty one rings high and long. Sustain carries the same
    // information and is the half people feel without being able to name it, so
    // pitch and decay move together.
    let f0 = 330 + (1-f)*460;
    let ring = 0.17 + (1-f)*1.45;
    let level = 0.32;
    // And below the oil line the wall is against the liquid rather than against
    // air, so it barely rings at all -- a dull knock. That is what lets the level be
    // found by tapping down the side, the way you find it on a gas cylinder.
    if (!aboveOil){ f0 *= 0.72; ring = 0.085 + ring*0.05; level = 0.2; }

    const MODE=[1,1.63,2.29,3.11], AMP=[1,0.42,0.24,0.13];   // a shell: inharmonic
    for (let i=0;i<MODE.length;i++){
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type='sine'; o.frequency.value = f0*MODE[i];
      const d = Math.max(0.05, ring/(1 + i*0.85));           // the high modes die first
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(level*AMP[i]*vol, t+0.002);
      g.gain.exponentialRampToValueAtTime(0.0001, t+d);
      o.connect(g).connect(dest); o.start(t); o.stop(t+d+0.06);
    }
  }

  document.getElementById('fill').addEventListener('click', refill);

  // ---------- the nail ----------------------------------------------------------
  // A photographed object, like candler's pins, not an emoji: it is a thing in the
  // scene, not a control. Her own nail, cut off its ground.
  const nailImg = new Image();
  let nailReady = false;
  nailImg.onload = () => { nailReady = true; };
  nailImg.src = 'lampnail.png';
  const NAIL_LEN = 232;                                   // in the photograph's units
  const NIMG = { hx:3, hy:95.2, tx:696, ty:18.7 };        // its head and its point
  const NIMG_A = Math.atan2(NIMG.ty-NIMG.hy, NIMG.tx-NIMG.hx);
  const NIMG_L = Math.hypot(NIMG.tx-NIMG.hx, NIMG.ty-NIMG.hy);
  const HOME = { x:122, y:1118, a:-0.181 };               // lying on the shelf beside it
  const nail = { x:HOME.x, y:HOME.y, a:HOME.a, face:1, held:false, hover:false,
                 lift:0, recoil:0, armed:true };
  let grabU=0, grabV=0, nailSpeed=0, lastPx=null, lastPy=null;

  function nailTip(){
    return { x: nail.x + Math.cos(nail.a)*NAIL_LEN/2,
             y: nail.y + Math.sin(nail.a)*NAIL_LEN/2 };
  }
  function nailHit(px, py){
    const dx=px-nail.x, dy=py-nail.y, c=Math.cos(-nail.a), sn=Math.sin(-nail.a);
    const u = dx*c - dy*sn, v = dx*sn + dy*c;
    // A nail is a thin thing and a thumb is about 9mm across, so the box it is
    // caught by is held to 44 screen pixels across whatever the piece is scaled to.
    // Nothing of it shows, and it can swallow nothing else: it is the only object
    // on this page that answers a pointer at all.
    const halfV = Math.max(13, 22/(photoScale||1));
    return Math.abs(u) <= NAIL_LEN/2 + 8 && Math.abs(v) <= halfV;
  }
  let approach = -1;                 // which side of the lamp the point came from
  function collide(){
    const tp = nailTip();
    const hw = baseHalfW(tp.y);
    const off = tp.x - BASE_CX;
    const pen = hw > 0 ? hw - Math.abs(off) : -999;
    if (pen <= 0 && hw > 0) approach = off < 0 ? -1 : 1;
    if (pen > 0){
      // The point stops ON the surface rather than going into it, which is what
      // makes it read as a tap instead of the nail sinking through the copper. It
      // is put back on the side it CAME from, not the side it happens to be on: a
      // quick drag can carry the point clean past the axis in one frame, and
      // pushing it out by the shorter way then shot the nail out the far side.
      nail.x += (BASE_CX + approach*hw) - tp.x;
      if (nail.armed){
        nail.armed = false; nail.recoil = 1;
        tapSound(Math.min(1, 0.42 + nailSpeed*0.014), tp.y < oilY(), fuel);
      }
    } else if (!nail.armed && pen < -9){
      nail.armed = true;                    // clear of it again: it can strike again
    }
  }
  function stepNail(dt){
    if (!nail.held){
      const k = Math.min(1, dt*0.011);      // it goes back to where it lives
      nail.x += (HOME.x-nail.x)*k; nail.y += (HOME.y-nail.y)*k;
      nail.face = 1;                        // it lies on the shelf the way it lies
      let back = (HOME.a-nail.a) % (Math.PI*2);
      if (back >  Math.PI) back -= Math.PI*2;
      if (back < -Math.PI) back += Math.PI*2;
      nail.a += back*k;
      nail.lift += ((nail.hover?3:0) - nail.lift)*Math.min(1, dt*0.013);
      if (Math.abs(nail.x-HOME.x) < 40) nail.armed = true;
    }
    nail.recoil *= Math.pow(0.86, dt/16.7);
    nailSpeed   *= Math.pow(0.85, dt/16.7);
  }
  function drawNail(){
    if (!nailReady || !photoScale) return;
    tctx.clearRect(0,0,W,H);
    const s = photoScale*(NAIL_LEN/NIMG_L);
    const back = nail.recoil*7;
    const cx = photoDX + (nail.x - Math.cos(nail.a)*back)*photoScale;
    const cy = photoDY + (nail.y - Math.sin(nail.a)*back - nail.lift)*photoScale;
    tctx.save();
    tctx.translate(cx, cy);
    tctx.rotate(nail.a - NIMG_A);
    tctx.scale(s, s);
    tctx.translate(-(NIMG.hx+NIMG.tx)/2, -(NIMG.hy+NIMG.ty)/2);
    tctx.drawImage(nailImg, 0, 0);
    tctx.restore();
  }

  // A thing that answers when it is touched -- which is the piece being alive, not
  // an explanation of it.
  const lampBox = document.getElementById('lampBox');
  const FINE_PTR = matchMedia('(hover: hover) and (pointer: fine)');
  function toPhoto(ev){
    const r = canvas.getBoundingClientRect();
    return { x: ((ev.clientX-r.left) - photoDX)/photoScale,
             y: ((ev.clientY-r.top)  - photoDY)/photoScale };
  }
  lampBox.addEventListener('pointerdown', (ev) => {
    if (!photoScale) return;
    const p = toPhoto(ev);
    if (!nailHit(p.x, p.y)) return;
    nail.held = true; nail.lift = 3;
    const dx=p.x-nail.x, dy=p.y-nail.y, c=Math.cos(-nail.a), sn=Math.sin(-nail.a);
    grabU = dx*c - dy*sn; grabV = dx*sn + dy*c;
    lastPx = p.x; lastPy = p.y; nailSpeed = 0;
    lampBox.classList.add('holding');
    lampBox.setPointerCapture(ev.pointerId);
    ev.preventDefault();
  });
  lampBox.addEventListener('pointermove', (ev) => {
    if (!photoScale) return;
    const p = toPhoto(ev);
    if (!nail.held){
      if (FINE_PTR.matches){
        nail.hover = nailHit(p.x, p.y);
        lampBox.classList.toggle('overtool', nail.hover);
      }
      return;
    }
    // it leans a little with the hand carrying it -- a thing being carried, not a
    // sprite being slid about -- and it TURNS IN THE HAND to face whichever side of
    // the lamp it is being brought in from. Its facing used to be fixed: the point
    // always faced right, so carried round to the far side it faced away from the
    // copper and the tip never met it at all. Her report off the machines: "the tap
    // only works on the left side of the lamp base". The 40-unit hysteresis is
    // load-bearing -- flipping on the axis itself spins the nail round every time
    // the hand crosses the middle of the lamp, which is most of the way to it.
    const mx = lastPx==null ? 0 : p.x-lastPx, my = lastPy==null ? 0 : p.y-lastPy;
    nailSpeed = Math.hypot(mx, my);
    if (nail.x < BASE_CX - 40) nail.face = 1;
    else if (nail.x > BASE_CX + 40) nail.face = -1;
    const lean = Math.max(-0.14, Math.min(0.14, my*0.010));
    const want = nail.face > 0 ? HOME.a + lean : Math.PI - HOME.a - lean;
    let turn = (want - nail.a) % (Math.PI*2);
    if (turn >  Math.PI) turn -= Math.PI*2;      // always the short way round
    if (turn < -Math.PI) turn += Math.PI*2;
    nail.a += turn*0.35;
    const c=Math.cos(nail.a), sn=Math.sin(nail.a);
    nail.x = p.x - (grabU*c - grabV*sn);
    nail.y = p.y - (grabU*sn + grabV*c);
    lastPx = p.x; lastPy = p.y;
    collide();
  });
  function dropNail(ev){
    if (!nail.held) return;
    nail.held = false; nail.hover = false; lastPx = lastPy = null;
    lampBox.classList.remove('holding','overtool');
    if (ev && lampBox.hasPointerCapture && lampBox.hasPointerCapture(ev.pointerId))
      lampBox.releasePointerCapture(ev.pointerId);
  }
  lampBox.addEventListener('pointerup', dropNail);
  lampBox.addEventListener('pointercancel', dropNail);
  lampBox.addEventListener('pointerleave', () => {
    if (!nail.held){ nail.hover=false; lampBox.classList.remove('overtool'); }
  });

  // ---------- rendering ----------
  // ---------- rendering: the base, collar, and glass are the actual
  // photograph (wicklamp.png) rather than a redrawn illustration — only
  // the wick and flame are genuinely dynamic, so only they're drawn on
  // canvas, precisely aligned to where the real burner sits in the
  // photo ----------
  const lampPhoto = new Image();
  function smoothstep(edge0, edge1, x){
    const t = Math.max(0, Math.min(1, (x-edge0)/(edge1-edge0)));
    return t*t*(3-2*t);
  }
  // The wick genuinely passes through four distinct shapes as it goes
  // from flat to triangular: horned (two peaks with a dip between them)
  // -> flat with rounded edges (level top, wide, corners softened) ->
  // curved (the level top becomes a gentle dome, bulging upward) ->
  // sharp and taller (dome collapses to one crisp point, height grows).
  // "dip" is the key trick: positive sinks the centre below the
  // shoulders (a horned dip), zero is level (flat), negative raises the
  // centre above the shoulders (a curved dome) — the same value that
  // made a dip can also make a bulge, just by crossing zero.
  const FLAME_KEYFRAMES = [
    { wt:0.00, hornX:1.00, dip: 0.24, tr:1.00, trV:1.00, shoulderY:0.10, heightMult:1.00, flameWMult:1.00 },
    { wt:0.28, hornX:0.55, dip: 0.02, tr:1.35, trV:0.55, shoulderY:0.28, heightMult:1.05, flameWMult:0.96 },
    { wt:0.55, hornX:0.30, dip:-0.16, tr:1.05, trV:0.35, shoulderY:0.06, heightMult:1.16, flameWMult:0.88 },
    { wt:0.80, hornX:0.10, dip:-0.05, tr:0.60, trV:0.10, shoulderY:0.00, heightMult:1.30, flameWMult:0.78 },
    { wt:1.00, hornX:0.00, dip: 0.00, tr:0.42, trV:0.00, shoulderY:0.00, heightMult:1.42, flameWMult:0.72 },
  ];
  function lerpFlameKeyframes(wt){
    const K = FLAME_KEYFRAMES;
    for (let i=0; i<K.length-1; i++){
      if (wt <= K[i+1].wt || i === K.length-2){
        const a = K[i], b = K[i+1];
        const localT = smoothstep(a.wt, b.wt, wt);
        const out = {};
        for (const key of ['hornX','dip','tr','trV','shoulderY','heightMult','flameWMult']){
          out[key] = a[key] + (b[key]-a[key])*localT;
        }
        return out;
      }
    }
  }
  // the feathered clone patch, rebuilt only when the piece changes size
  let patchCanvas = null, patchW = 0, patchH = 0;
  function erasePatch(w, h){
    const cw = Math.max(2, Math.round(w)), ch = Math.max(2, Math.round(h));
    if (patchCanvas && cw === patchW && ch === patchH) return patchCanvas;
    const c = document.createElement('canvas');
    c.width = cw; c.height = ch;
    const x = c.getContext('2d');
    const er = PHOTO_ERASE;
    x.drawImage(lampPhoto, er.sx, er.sy, er.sw, er.sh, 0, 0, cw, ch);
    x.globalCompositeOperation = 'destination-in';
    x.save();
    x.translate(cw/2, ch/2); x.scale(cw/ch, 1);
    const g = x.createRadialGradient(0,0,0, 0,0, ch/2);
    g.addColorStop(0,   'rgba(0,0,0,1)');
    g.addColorStop(0.62,'rgba(0,0,0,1)');
    g.addColorStop(0.86,'rgba(0,0,0,0.45)');
    g.addColorStop(1,   'rgba(0,0,0,0)');
    x.fillStyle = g; x.fillRect(-cw, -ch, cw*2, ch*2);
    x.restore();
    patchCanvas = c; patchW = cw; patchH = ch;
    return c;
  }
  let lampPhotoReady = false;
  lampPhoto.onload = () => { lampPhotoReady = true; };
  lampPhoto.src = 'wicklampblack.png';
  const PHOTO_W = 848, PHOTO_H = 1239;

  // measured directly from the photo: the burner rim where the wick
  // emerges, and a clean patch of glass (same column, higher up) used
  // to paint over the photo's own static wick so our animated one
  // reads as the only wick, not a second one layered on top
  const PHOTO_WICK_X = 430, PHOTO_WICK_RIM_Y = 698;
  const PHOTO_ERASE = { sx: 395, sy: 500, sw: 70, sh: 86, dx: 395, dy: 615, dw: 70, dh: 86 };

  function drawLamp(){
    ctx.clearRect(0,0,W,H);
    fctx.clearRect(0,0,W,H);

    if (!lampPhotoReady){
      return;
    }

    // fit the whole photo within the canvas (never cropped), centered,
    // so the ambient glow can show in the margins around it
    const scale = Math.min(W/PHOTO_W, H/PHOTO_H);
    const dw = PHOTO_W*scale, dh = PHOTO_H*scale;
    const dx = (W-dw)/2, dy = (H-dh)/2;
    photoScale = scale; photoDX = dx; photoDY = dy;
    function toCanvas(px, py){ return { x: dx + px*scale, y: dy + py*scale }; }

    const centerX = dx + PHOTO_WICK_X*scale;
    const wickRimY = dy + PHOTO_WICK_RIM_Y*scale;

    // wick shape blends continuously from flat (0) to triangular (1) —
    // but not linearly. In reality the horns round off quickly, the
    // flame then holds a flat-ish/curved top through most of the
    // middle range, and only sharpens — and grows taller — in the
    // final stretch toward fully triangular.
    const wt = wickShape;
    const kf = lerpFlameKeyframes(wt);

    // wick geometry — rises and falls with the height slider, top edge
    // narrows from a flat ribbon to a point with the shape slider.
    // Sized against the photo's real measurements (wick fabric is
    // ~53px wide, burner collar ~140px wide, in the photo's own pixel
    // space) rather than the old illustration's much smaller canvas
    // scale, which is what made everything read as tiny.
    // a wick that has burnt to ash is shorter than the one that was there
    const wickProtrusion = (7 + wick*30) * scale * (1 - 0.5*char);
    const wickBaseY = wickRimY;
    const wickTipY = wickBaseY - wickProtrusion;
    const wickHalfW_base = 12 * scale;
    const wickHalfW_top = wickHalfW_base * kf.hornX;

    // flame geometry, anchored to the wick's actual tip
    const flameH = (40 + wick*95) * scale * (1 + turb.height.v*0.05) * kf.heightMult * flameLife;
    const fBaseY = wickTipY;
    const fTipY = fBaseY - flameH;
    const idleAsymmetry = 3 * scale;
    const lean = idleAsymmetry + turb.tip.v * 0.8 * scale;
    const flameW = 15 * kf.flameWMult * scale;

    // ambient warm glow, drawn behind the photo so it only shows in
    // the letterboxed margins around it — a hint of the room the lamp
    // is lighting, not an effect on the glass itself. Centered on the
    // flame itself (which sits well above the wick's base at the rim),
    // not the rim, so it doesn't read as centered too low.
    const ambientGlowY = fBaseY - flameH*0.4;
    const glow = ctx.createRadialGradient(centerX, ambientGlowY, 10*scale, centerX, ambientGlowY, (dh)*0.55 + wick*40*scale);
    glow.addColorStop(0, `rgba(255,190,110,${(0.30 + wick*0.22) * flameLife})`);
    glow.addColorStop(1, 'rgba(255,190,110,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0,0,W,H);

    // the photograph itself
    ctx.drawImage(lampPhoto, 0, 0, PHOTO_W, PHOTO_H, dx, dy, dw, dh);

    // Erase the photo's own small static wick by cloning a clean patch of glass
    // from directly above it -- same column, so lighting and perspective match.
    // Its EDGES are feathered to nothing, which they were not: as a hard-edged
    // rectangle the seam was invisible under a lit flame's glow and perfectly plain
    // the moment the lamp could burn out, which is the "correct but reads as
    // broken" class. Built once and cached, not masked every frame.
    const er = PHOTO_ERASE;
    ctx.drawImage(erasePatch(er.dw*scale, er.dh*scale),
                  dx+er.dx*scale, dy+er.dy*scale);

    // a soft warm highlight glowing on the glass right around the
    // flame, screen-blended so it brightens the photo rather than
    // painting over it. The gradient itself is already soft, so no
    // blur filter is needed — combining a CSS blur filter with a
    // non-default composite operation renders as solid black in some
    // WebKit browsers, which is what was happening here.
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    const glowCenterY = fBaseY - flameH*0.45;
    const rimGlow = ctx.createRadialGradient(centerX, glowCenterY, 0, centerX, glowCenterY, 270*scale + wick*135*scale);
    rimGlow.addColorStop(0, `rgba(255,200,130,${(0.35+wick*0.25) * flameLife})`);
    rimGlow.addColorStop(1, 'rgba(255,200,130,0)');
    ctx.fillStyle = rimGlow;
    ctx.fillRect(dx, dy, dw, dh);
    ctx.restore();



    // the wick — real fabric poking out of the ferrule. Drawn on the flame
    // layer (#flame); its softness now comes from that layer's CSS blur, so no
    // per-frame in-canvas blur is needed here.
    function wickPath(){
      fctx.beginPath();
      fctx.moveTo(centerX-wickHalfW_base, wickBaseY);
      fctx.lineTo(centerX-wickHalfW_top, wickTipY);
      fctx.lineTo(centerX+wickHalfW_top, wickTipY);
      fctx.lineTo(centerX+wickHalfW_base, wickBaseY);
      fctx.closePath();
    }
    wickPath();
    const wickG = fctx.createLinearGradient(centerX-wickHalfW_base, 0, centerX+wickHalfW_base, 0);
    wickG.addColorStop(0, '#8a6a48');
    wickG.addColorStop(0.5, '#d9bd93');
    wickG.addColorStop(1, '#7c5d3e');
    fctx.fillStyle = wickG;
    fctx.fill();
    fctx.save();
    wickPath();
    fctx.clip();
    fctx.strokeStyle = 'rgba(60,42,24,0.35)';
    fctx.lineWidth = 2.2*scale;
    for (let i=-1; i<=1; i++){
      fctx.beginPath();
      fctx.moveTo(centerX+i*9*scale, wickBaseY);
      fctx.lineTo(centerX+i*9*scale*(1-wt), wickTipY);
      fctx.stroke();
    }
    fctx.restore();

    // Her sequence again: burnt down to ash. A wick chars from the top, so the
    // black eats DOWN it -- and the very tip goes to the pale grey of ash rather
    // than staying black, which is what says burnt out rather than merely sooty.
    if (char > 0.001){
      fctx.save(); wickPath(); fctx.clip();
      const cg = fctx.createLinearGradient(0, wickTipY, 0, wickBaseY);
      cg.addColorStop(0, 'rgba(24,20,18,0.94)');
      cg.addColorStop(Math.min(0.98, char), 'rgba(24,20,18,0.86)');
      cg.addColorStop(Math.min(1, char+0.2), 'rgba(24,20,18,0)');
      fctx.fillStyle = cg; fctx.fill();
      if (char > 0.4){
        const k = (char-0.4)/0.6;
        const ag = fctx.createLinearGradient(0, wickTipY, 0, wickTipY + wickProtrusion*0.55);
        ag.addColorStop(0, `rgba(196,190,181,${k*0.85})`);
        ag.addColorStop(0.45, `rgba(150,143,134,${k*0.45})`);
        ag.addColorStop(1, 'rgba(150,143,134,0)');
        fctx.fillStyle = ag; fctx.fill();
      }
      fctx.restore();
    }

    if (flameLife <= 0.02) return;

    // flame — passes through the same four stages as the wick: horned,
    // flat with rounded edges, curved (domed), sharp and taller. The
    // centre point (Vx,Vy) sinks below the shoulders for a dip when
    // horned, sits level with them when flat, and rises above them for
    // a dome when curved — the same value crossing zero is what makes
    // a dip become a bulge.
    function flamePath(){
      fctx.beginPath();
      const hornX = flameW*1.05*kf.hornX;
      const trV = 3.5*scale*kf.trV;
      const tr = 5*scale*kf.tr;
      const leanAtT = lean*(0.5+0.5*wt);
      const peakYOffset = flameH*kf.shoulderY;
      const Lx = centerX-hornX+leanAtT, Ly = fTipY+peakYOffset;
      const Rx = centerX+hornX+leanAtT, Ry = fTipY+peakYOffset;
      const Vx = centerX+leanAtT, Vy = Ly + flameH*kf.dip;
      const ctrlY = fBaseY - flameH*(0.55-0.05*wt);
      fctx.moveTo(centerX-flameW, fBaseY);
      fctx.quadraticCurveTo(centerX-flameW*1.1, ctrlY, Lx-tr*0.6, Ly+tr*0.8);
      fctx.quadraticCurveTo(Lx, Ly, Lx+tr*0.5, Ly+tr*0.6);
      fctx.quadraticCurveTo(centerX-hornX*0.3+leanAtT, fBaseY-flameH*0.80, Vx-trV*0.6, Vy-trV*0.4);
      fctx.quadraticCurveTo(Vx, Vy, Vx+trV*0.6, Vy-trV*0.4);
      fctx.quadraticCurveTo(centerX+hornX*0.3+leanAtT, fBaseY-flameH*0.80, Rx-tr*0.5, Ry+tr*0.6);
      fctx.quadraticCurveTo(Rx, Ry, Rx+tr*0.6, Ry+tr*0.8);
      fctx.quadraticCurveTo(centerX+flameW*1.1, ctrlY, centerX+flameW, fBaseY);
      fctx.quadraticCurveTo(centerX+flameW*0.5, fBaseY-flameH*0.06, centerX, fBaseY-flameH*0.1);
      fctx.quadraticCurveTo(centerX-flameW*0.5, fBaseY-flameH*0.06, centerX-flameW, fBaseY);
      fctx.closePath();
    }
    flamePath();
    const flameG = fctx.createLinearGradient(0, fTipY, 0, fBaseY);
    flameG.addColorStop(0, '#fff6e0');
    flameG.addColorStop(0.45, '#ffcf7a');
    flameG.addColorStop(0.8, '#f0923f');
    flameG.addColorStop(1, '#c96a2e');
    fctx.save();
    fctx.globalAlpha = 0.88;
    fctx.fillStyle = flameG;
    fctx.fill();
    fctx.restore();
  }

  let lastDt = 16.67;
  let lastT = performance.now();
  function loop(t){
    lastDt = Math.min(t - lastT, 50);
    lastT = t;
    stepFlameTurbulence(lastDt);
    stepFuel(lastDt);
    stepNail(lastDt);
    drawLamp();
    drawNail();
    updateAudio();
    requestAnimationFrame(loop);
  }

  fitStage();
  resize();
  requestAnimationFrame(loop);
})();
</script>

<script>
(function(){
  var disc=document.getElementById('shelfdisc'), box=document.getElementById('plates');
  var rows=[].slice.call(box.querySelectorAll('.row'));
  function unroll(){ rows.forEach(function(r){ r.classList.remove('rolled'); }); }
  function shut(){ box.classList.remove('open'); disc.setAttribute('aria-expanded','false'); unroll(); }

  /* The twenty cards behind these plates are 6.2MB and not one of them can be
     seen until a plate is opened, but every page on the site was fetching the lot
     on load, ahead of the piece's own assets. Measured on bowl at 240px with a
     slow phone's CPU and connection, the bowl had still not appeared after 100
     seconds; held back, it is there in 12.
     They are held behind data-src rather than left to loading="lazy" alone,
     because that is a heuristic and not a promise -- the same page deferred them
     on a throttled connection and fetched all twenty on a fast one, since the
     browser's idea of "near the viewport" widens with bandwidth. This is the same
     on every machine. The attribute stays as a second line for anything that
     scrolls them into view another way. */
  var wired=false;
  function fetchCards(){
    if(wired) return; wired=true;
    [].slice.call(box.querySelectorAll('img[data-src]')).forEach(function(im){
      im.src=im.getAttribute('data-src'); im.removeAttribute('data-src');
    });
  }

  disc.addEventListener('click', function(ev){
    ev.stopPropagation();
    var open=box.classList.toggle('open');
    if(open) fetchCards();
    disc.setAttribute('aria-expanded', open?'true':'false');
    if(!open) unroll();
  });

  // Same bargain the case itself strikes: a mouse can hover, so a plate is a link
  // straight to its shelf. A thumb cannot, so the first tap on a plate rolls its
  // pieces out and only the second one goes to the shelf.
  var FINE=matchMedia('(hover: hover) and (pointer: fine)');
  rows.forEach(function(row){
    row.querySelector('.tag').addEventListener('click', function(ev){
      if(FINE.matches) return;
      if(row.classList.contains('rolled')) return;
      ev.preventDefault();
      unroll(); row.classList.add('rolled');
    });
  });

  document.addEventListener('click', function(ev){
    if(!box.contains(ev.target) && ev.target!==disc) shut();
  });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') shut(); });
})();
</script>
