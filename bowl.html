<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>floating bowl — sagne</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{ height:100%; margin:0; overflow:hidden; background:#0b0e0d; color:#e7ddc9;
    font-family:Georgia, serif; user-select:none; }
  #backlink{ position:fixed; top:18px; left:22px; z-index:50; color:#e7ddc9; opacity:.5;
    text-decoration:none; font-size:14px; letter-spacing:.04em; text-shadow:0 1px 3px rgba(0,0,0,.85), 0 0 9px rgba(0,0,0,.55); transition:opacity .3s ease; }
  #backlink:hover{ opacity:.9; }
  canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  #dock{ position:fixed; bottom:0; left:0; right:0; display:flex; align-items:center; justify-content:center;
    gap:12px; padding:16px 18px 26px; z-index:40;
    background:linear-gradient(to top, rgba(8,7,5,.85), rgba(8,7,5,0)); }
  .glyph{ font-size:15px; opacity:.7; }
  input[type=range]{ -webkit-appearance:none; appearance:none; width:150px; height:3px; border-radius:3px;
    background:rgba(231,221,201,.25); outline:none; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
    background:#e9d9a8; cursor:pointer; box-shadow:0 0 8px rgba(233,217,168,.6); }
  input[type=range]::-moz-range-thumb{ width:14px; height:14px; border:none; border-radius:50%; background:#e9d9a8; cursor:pointer; }
</style>
</head>
<body>
<a id="backlink" href="index.html">← sagne</a>
<canvas id="scene"></canvas>
<div id="dock">
  <span class="glyph" title="current">🌊</span>
  <input type="range" id="currentSlider" min="0" max="100" value="20" aria-label="current">
</div>
<script>
(function(){
  const canvas=document.getElementById('scene'), ctx=canvas.getContext('2d');
  const currentSlider=document.getElementById('currentSlider');
  let W=0,H=0,DPR=1, cx=0, cy=0, bowlR=0, waterR=0;
  let currentAmt=currentSlider.value/100;
  currentSlider.addEventListener('input', ()=>{ currentAmt=currentSlider.value/100; });

  // ---------- bowl: drawn once per resize onto an offscreen layer ----------
  let bowlLayer=null;
  function buildBowl(){
    bowlLayer=document.createElement('canvas'); bowlLayer.width=W; bowlLayer.height=H;
    const bc=bowlLayer.getContext('2d');
    // surrounding surface the bowl sits on
    const bg=bc.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*0.75);
    bg.addColorStop(0,'#14100c'); bg.addColorStop(1,'#080705');
    bc.fillStyle=bg; bc.fillRect(0,0,W,H);

    // rim: a ceramic ring with a soft upper-left highlight
    const rimGrad=bc.createRadialGradient(cx,cy,waterR*0.98,cx,cy,bowlR);
    rimGrad.addColorStop(0,'#2a2723'); rimGrad.addColorStop(0.55,'#3d3830'); rimGrad.addColorStop(1,'#1c1a16');
    bc.fillStyle=rimGrad;
    bc.beginPath(); bc.arc(cx,cy,bowlR,0,7); bc.fill();

    bc.save();
    bc.globalCompositeOperation='lighter';
    const hi=bc.createRadialGradient(cx-bowlR*0.38,cy-bowlR*0.42,0,cx-bowlR*0.38,cy-bowlR*0.42,bowlR*0.85);
    hi.addColorStop(0,'rgba(255,244,214,0.16)'); hi.addColorStop(1,'rgba(255,244,214,0)');
    bc.fillStyle=hi;
    bc.beginPath(); bc.arc(cx,cy,bowlR,0,7); bc.fill();
    bc.restore();

    // water surface
    const waterGrad=bc.createRadialGradient(cx-waterR*0.2,cy-waterR*0.25,waterR*0.1,cx,cy,waterR);
    waterGrad.addColorStop(0,'#2e5049'); waterGrad.addColorStop(0.6,'#1c3a34'); waterGrad.addColorStop(1,'#0f2622');
    bc.fillStyle=waterGrad;
    bc.beginPath(); bc.arc(cx,cy,waterR,0,7); bc.fill();

    // inner-wall shadow ring where the bowl curves up out of the water
    bc.save();
    bc.beginPath(); bc.arc(cx,cy,waterR,0,7); bc.clip();
    const wallShadow=bc.createRadialGradient(cx,cy,waterR*0.78,cx,cy,waterR);
    wallShadow.addColorStop(0,'rgba(0,0,0,0)'); wallShadow.addColorStop(1,'rgba(0,0,0,0.5)');
    bc.fillStyle=wallShadow; bc.fillRect(0,0,W,H);
    bc.restore();

    // faint specular crease on the water near the lit side
    bc.save();
    bc.beginPath(); bc.arc(cx,cy,waterR,0,7); bc.clip();
    bc.globalCompositeOperation='lighter';
    const sheen=bc.createRadialGradient(cx-waterR*0.32,cy-waterR*0.36,0,cx-waterR*0.32,cy-waterR*0.36,waterR*0.7);
    sheen.addColorStop(0,'rgba(210,235,225,0.10)'); sheen.addColorStop(1,'rgba(210,235,225,0)');
    bc.fillStyle=sheen; bc.fillRect(0,0,W,H);
    bc.restore();
  }

  // ---------- flow field: correlated, slowly time-varying curl noise ----------
  function psi(x,y,t){
    return Math.sin(x*0.0065 + t*0.16) * Math.cos(y*0.0055 - t*0.11)
         + 0.5*Math.sin(x*0.015 - t*0.09 + 1.7) * Math.cos(y*0.017 + t*0.12);
  }
  function flowAt(x,y,t){
    const e=2.4;
    return { vx:(psi(x,y+e,t)-psi(x,y-e,t))/(2*e),
             vy:-(psi(x+e,y,t)-psi(x-e,y,t))/(2*e) };
  }
  function curlAt(x,y,t){
    const e=2.4;
    const fL=flowAt(x-e,y,t), fR=flowAt(x+e,y,t), fD=flowAt(x,y-e,t), fU=flowAt(x,y+e,t);
    return ((fR.vy-fL.vy)-(fU.vx-fD.vx))/(2*e);
  }

  // ---------- floating objects ----------
  // kind: leaf | petal | pod — each with its own draw routine and a "weight" that
  // resists the current a little (a real seed pod sits lower and drifts a touch less
  // eagerly than a light petal), matching the brief's "relative size/weight" property
  const KINDS = [
    {kind:'leaf', r:15, weight:0.85},
    {kind:'leaf', r:12, weight:0.9},
    {kind:'petal', r:9,  weight:1.15},
    {kind:'petal', r:8,  weight:1.2},
    {kind:'pod',  r:10, weight:0.7},
  ];
  let objs=[];
  function seedObjects(){
    objs = KINDS.map((k,i)=>{
      const ang = (i/KINDS.length)*Math.PI*2 + i*0.7;
      const rad = waterR*(0.25+0.35*((i*37)%5)/5);
      return { ...k, x:cx+Math.cos(ang)*rad, y:cy+Math.sin(ang)*rad,
        vx:0, vy:0, angle:Math.random()*Math.PI*2, angVel:0,
        phase:Math.random()*100 };
    });
  }

  const FLOW_SCALE=3200, BASE_JITTER=90, CONTAIN_K=90, REPEL_K=60, ROT_SCALE=420, DAMPING=0.9;

  function stepObjects(dt,t){
    for(const o of objs){
      const f=flowAt(o.x,o.y,t);
      const resp = 1/o.weight;
      let ax = f.vx*FLOW_SCALE*currentAmt*resp;
      let ay = f.vy*FLOW_SCALE*currentAmt*resp;
      // the faintest natural drift, present even with the current at zero
      ax += Math.sin(t*0.55+o.phase)*BASE_JITTER*resp;
      ay += Math.cos(t*0.47+o.phase*1.3)*BASE_JITTER*resp;

      // stay within the water — soft containment near the inner wall
      const dx=o.x-cx, dy=o.y-cy, dist=Math.hypot(dx,dy)||0.001;
      const maxR=waterR-o.r-4;
      const edge=maxR*0.8;
      if(dist>edge){
        const p=Math.min(1,(dist-edge)/(maxR-edge));
        ax -= (dx/dist)*p*p*CONTAIN_K;
        ay -= (dy/dist)*p*p*CONTAIN_K;
      }

      // gentle mutual avoidance — no rigid collision, just enough to look natural
      for(const o2 of objs){
        if(o2===o) continue;
        const ddx=o.x-o2.x, ddy=o.y-o2.y, d=Math.hypot(ddx,ddy)||0.001;
        const minD=o.r+o2.r+10;
        if(d<minD){
          const p=(minD-d)/minD;
          ax += (ddx/d)*p*p*REPEL_K;
          ay += (ddy/d)*p*p*REPEL_K;
        }
      }

      o.vx=o.vx*DAMPING+ax*dt; o.vy=o.vy*DAMPING+ay*dt;
      o.x+=o.vx*dt; o.y+=o.vy*dt;

      const curl=curlAt(o.x,o.y,t);
      o.angVel = o.angVel*0.9 + curl*currentAmt*ROT_SCALE*resp*dt;
      o.angle += o.angVel*dt + Math.sin(t*0.3+o.phase)*0.05*dt;
    }
  }

  // ---------- object rendering ----------
  function shade(hex, amt){
    const n=parseInt(hex.slice(1),16);
    let r=(n>>16)+amt, g=(n>>8&255)+amt, b=(n&255)+amt;
    r=Math.max(0,Math.min(255,r)); g=Math.max(0,Math.min(255,g)); b=Math.max(0,Math.min(255,b));
    return `rgb(${r},${g},${b})`;
  }
  function drawShadow(r){
    const g=ctx.createRadialGradient(0,0,0,0,0,r*1.5);
    g.addColorStop(0,'rgba(0,0,0,0.32)'); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,r*1.5,0,7); ctx.fill();
  }
  function drawLeaf(r, base){
    ctx.beginPath();
    ctx.moveTo(0,-r);
    ctx.bezierCurveTo(r*0.62,-r*0.5, r*0.62,r*0.55, 0,r);
    ctx.bezierCurveTo(-r*0.62,r*0.55, -r*0.62,-r*0.5, 0,-r);
    ctx.closePath();
    const g=ctx.createLinearGradient(-r*0.4,-r,r*0.4,r);
    g.addColorStop(0,shade(base,35)); g.addColorStop(1,shade(base,-25));
    ctx.fillStyle=g; ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.28)'; ctx.lineWidth=Math.max(0.6,r*0.07);
    ctx.beginPath(); ctx.moveTo(0,-r*0.82); ctx.lineTo(0,r*0.82); ctx.stroke();
  }
  function drawPetal(r, base){
    ctx.beginPath();
    ctx.moveTo(0,-r);
    ctx.quadraticCurveTo(r*0.82,-r*0.15, 0,r*0.9);
    ctx.quadraticCurveTo(-r*0.82,-r*0.15, 0,-r);
    ctx.closePath();
    const g=ctx.createLinearGradient(0,-r,0,r*0.9);
    g.addColorStop(0,shade(base,40)); g.addColorStop(1,shade(base,-15));
    ctx.fillStyle=g; ctx.fill();
  }
  function drawPod(r, base){
    ctx.beginPath(); ctx.ellipse(0,0, r*0.42, r, 0, 0, 7); ctx.closePath();
    const g=ctx.createLinearGradient(-r*0.3,-r,r*0.3,r);
    g.addColorStop(0,shade(base,30)); g.addColorStop(1,shade(base,-30));
    ctx.fillStyle=g; ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.3)'; ctx.lineWidth=Math.max(0.5,r*0.06);
    for(let s=-1;s<=1;s++){ ctx.beginPath(); ctx.moveTo(-r*0.4,s*r*0.32); ctx.lineTo(r*0.4,s*r*0.32); ctx.stroke(); }
  }
  const COLORS = { leaf:'#4c8a52', petal:'#e8b9c9', pod:'#8a6a44' };
  function drawObj(o){
    ctx.save();
    ctx.translate(o.x,o.y+o.r*0.12);
    drawShadow(o.r);
    ctx.restore();
    ctx.save();
    ctx.translate(o.x,o.y);
    ctx.rotate(o.angle);
    const base=COLORS[o.kind];
    if(o.kind==='leaf') drawLeaf(o.r, base);
    else if(o.kind==='petal') drawPetal(o.r, base);
    else drawPod(o.r, base);
    ctx.restore();
  }

  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth; H=window.innerHeight;
    canvas.width=W*DPR; canvas.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
    cx=W/2; cy=H*0.46;
    bowlR=Math.min(W,H)*0.40;
    waterR=bowlR*0.86;
    buildBowl();
    seedObjects();
  }
  window.addEventListener('resize',resize);

  let last=performance.now();
  function tick(now){
    const dt=Math.min(now-last,50)/1000; last=now; const t=now*0.001;
    stepObjects(dt,t);

    ctx.clearRect(0,0,W,H);
    ctx.drawImage(bowlLayer,0,0,W,H);
    for(const o of objs) drawObj(o);

    requestAnimationFrame(tick);
  }
  resize(); requestAnimationFrame(tick);
})();
</script>
</body>
</html>
