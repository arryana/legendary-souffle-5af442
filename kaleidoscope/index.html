<style>
  :root{ --bg1:#11161f; --bg2:#080a0f; --brass:#c9974e; --dim:#8b93a1; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{ height:100%; margin:0;
    background:radial-gradient(ellipse at 50% 30%, var(--bg1) 0%, var(--bg2) 78%);
    overflow-x:hidden; }
  #backlink{ position:fixed; top:18px; left:22px; z-index:50; color:#dfe6ea; opacity:.5;
    text-decoration:none; font-family:Georgia,serif; font-size:14px; letter-spacing:.04em;
    text-shadow:0 1px 3px rgba(0,0,0,.85), 0 0 9px rgba(0,0,0,.55); transition:opacity .3s ease; }
  #backlink:hover{ opacity:.9; }

  #wrap{ min-height:100vh; min-height:100dvh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:64px 16px 32px; gap:18px; }

  .disc{ position:relative; border-radius:50%; }

  #scopeWrap{ width:min(50vh,400px); aspect-ratio:1/1; cursor:grab; touch-action:none; }
  #scopeWrap:active{ cursor:grabbing; }
  /* the turning ring is drawn, not a flat gradient: a lit brass bevel that stays
     put (ringBase) and the fine milling that turns over it (ringMill inside
     scopeRing). Gemini was never going to make this well -- a knurled bezel is
     geometry, and geometry is drawn, not painted. */
  #ringBase{ position:absolute; inset:0; border-radius:50%; pointer-events:none;
    box-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 6px 22px rgba(0,0,0,.55); }
  /* the grip layer reaches beyond the wood ring so the grab knob can stand
     proud of the edge; it rotates about the same centre as the frame */
  #scopeRing{ position:absolute; inset:-13%; border-radius:50%; pointer-events:none; }
  #scopeRing canvas{ position:absolute; inset:0; width:100%; height:100%; }
  #ringBase{ width:100%; height:100%; }
  #scopeInner{ position:absolute; inset:6.5%; border-radius:50%; overflow:hidden; background:#050608;
    box-shadow: inset 0 0 26px rgba(0,0,0,.85), 0 0 0 1px rgba(0,0,0,.5); }
  #scopeInner canvas{ position:absolute; inset:0; width:100%; height:100%; }
  #scopeInner::after{ content:''; position:absolute; inset:0; border-radius:50%; pointer-events:none;
    box-shadow: inset 0 0 18px rgba(0,0,0,.7); }

  #trayWrap{ width:min(20vh,160px); aspect-ratio:1/1; cursor:default; margin-bottom:8px; }
  #trayWrap canvas{ position:absolute; inset:0; width:100%; height:100%; border-radius:50%; }

  #controls{ display:flex; align-items:flex-end; justify-content:center; gap:44px; flex-wrap:wrap; }
  #leftCluster{ display:flex; flex-direction:column; align-items:center; gap:10px; }
  #rightCluster{ display:flex; flex-direction:column; align-items:center; gap:10px; }
  /* the two sliders travel together: side by side they would be mistaken for one
     control, so when the cluster turns sideways they stay a stacked pair */
  .sliders{ display:flex; flex-direction:column; align-items:center; gap:10px; }

  #palette{ display:grid; grid-template-columns:repeat(4, 44px); gap:8px; }
  .piece{ width:44px; height:44px; border-radius:8px; overflow:hidden; cursor:grab;
    border:1.5px solid rgba(236,227,208,.16); opacity:.75; touch-action:none;
    transition:opacity .2s ease, transform .2s ease; background:#0a0b0d; }
  .piece:hover{ opacity:1; transform:translateY(-2px); }
  .piece img{ width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; }
  .piece.add-tile{ position:relative; display:flex; align-items:center; justify-content:center; border-style:dashed; }
  .piece.add-tile img{ display:none; }
  .piece.add-tile.has-image img{ display:block; }
  .add-plus{ font-size:20px; line-height:1; color:rgba(236,227,208,.55); pointer-events:none; }
  .piece.add-tile.has-image .add-plus{ display:none; }
  .swap-btn{ display:none; position:absolute; right:2px; bottom:2px; width:16px; height:16px; border-radius:50%;
    border:none; background:rgba(8,9,12,.8); color:#f2e9d8; font-size:10px; line-height:1; cursor:pointer; padding:0; }
  .piece.add-tile.has-image .swap-btn{ display:block; }

  input[type=range]{ -webkit-appearance:none; appearance:none; width:184px; height:6px; border-radius:4px;
    outline:none; cursor:pointer; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:16px; height:16px; border-radius:50%;
    background:#fff; border:2px solid rgba(0,0,0,.4); cursor:pointer; box-shadow:0 0 6px rgba(0,0,0,.5); }
  input[type=range]::-moz-range-thumb{ width:14px; height:14px; border-radius:50%; background:#fff;
    border:2px solid rgba(0,0,0,.4); cursor:pointer; }
  #hueSlider{ background:linear-gradient(to right, hsl(0,85%,60%), hsl(60,85%,60%), hsl(120,85%,60%),
      hsl(180,85%,60%), hsl(240,85%,60%), hsl(300,85%,60%), hsl(360,85%,60%)); }
  #sizeSlider{ background:linear-gradient(to right, rgba(236,227,208,.15), rgba(236,227,208,.5)); }

  #mirrors{ display:grid; grid-template-columns:repeat(2, 44px); gap:8px; }

  /* The stacked layout above is the PHONE case — narrow columns that fit a
     390px screen. It was unconditional, so a desktop inherited it: four rows of
     pieces and a stack of sliders, ~200px of height spent on the screens least
     short of height, with the scope squeezed and empty room either side. Wide
     screens lay the same controls out sideways instead. Must stay AFTER the
     rules above: same specificity, so source order decides. */
  @media (min-width: 900px) {
    #controls{ align-items:center; gap:36px; }
    #palette{ grid-template-columns:repeat(7, 44px); }
    #rightCluster{ flex-direction:row; align-items:center; gap:20px; }
    #rightCluster .sliders{ display:flex; flex-direction:column; gap:14px; }
    #mirrors{ grid-template-columns:repeat(4, 44px); }
  }
  /* Wider still and all fourteen pieces fit on one line. */
  @media (min-width: 1240px) {
    #palette{ grid-template-columns:repeat(14, 44px); }
  }

  /* PHONE. Four rows of pieces and a stacked right-hand cluster came to 380px of
     controls under a 400px scope, on a screen 844 tall that does not scroll: the
     two sliders and the mirror buttons sat entirely below the bottom edge and
     could not be reached at all. So on a phone the pieces are a small closed tray
     of tiles that takes 66px, and everything else fits above the fold.
     Touch the tray and it opens into a drawer with a thumb's worth of tile in it,
     low enough that the scope and the dish are both still in sight above it -- a
     piece is carried up out of the drawer and onto the dish in one movement, and
     the drawer shuts itself the moment one lands. The tray keeps its 66px while
     the drawer is out (min-height on the cluster), or the column would re-centre
     and slide the dish out from under the visitor's own thumb mid-carry. */
  @media (max-width: 899px) {
    #scopeWrap{ width:min(50vh, 400px, 88vw); }
    /* a column, not a wrapping row: with the drawer out the palette leaves the
       flow, and a wrapping row would collapse from two lines to one and slide the
       dish out from under the thumb carrying a piece towards it */
    #controls{ flex-direction:column; align-items:center; gap:14px; }
    #mirrors{ grid-template-columns:repeat(4, 44px); }
    #leftCluster{ min-height:66px; justify-content:flex-start; }

    /* the two sliders sat 14px apart, which leaves nothing for a thumb to grow
       into; the column has room to spare on a phone, so they take some of it */
    .sliders{ gap:26px; }

    #palette{ grid-template-columns:repeat(7, 30px); gap:6px; }
    #palette .piece{ width:30px; height:30px; border-radius:5px; }
    #palette .add-plus{ font-size:14px; }
    #palette .swap-btn{ display:none; }

    /* a dim, and deliberately no blur: the dish is what a piece is being carried
       towards, and you do not blur the thing someone is aiming at */
    #paletteVeil{ position:fixed; inset:0; z-index:80; background:rgba(4,5,8,.38);
      opacity:0; pointer-events:none; transition:opacity .25s ease; }
    #paletteVeil.on{ opacity:1; pointer-events:auto; }

    #palette.open{ position:fixed; left:0; right:0; bottom:0; z-index:90;
      grid-template-columns:repeat(5, 52px); gap:10px; justify-content:center;
      padding:16px 12px calc(16px + env(safe-area-inset-bottom, 0px));
      background:rgba(10,11,14,.94); border-top:1px solid rgba(201,151,78,.28);
      box-shadow:0 -14px 34px rgba(0,0,0,.6); }
    #palette.open .piece{ width:52px; height:52px; border-radius:9px; opacity:1; }
    #palette.open .add-plus{ font-size:22px; }
    #palette.open .piece.add-tile.has-image .swap-btn{ display:block; }
  }

  /* Below 380 the stack is simply taller than the glass -- at 240 it ran the
     better part of a screen past the bottom -- and `height:100%` on the page
     meant the document never grew to match, so everything under the fold was
     not merely hard to reach but absent. Down here the page is allowed to
     scroll to its own content, and it ends far enough above the bottom that the
     music button in the corner never lands on the last row of controls.
     This is a stopgap and was agreed as one: these pieces are meant to sit
     still and be looked at, and a small-screen arrangement is still owed.
     Above 380 nothing here applies -- the page is the same fixed, unscrolling
     frame it always was. */
  @media (max-width: 379px){
    html, body{ height:auto; min-height:100%; }
    #wrap{ padding-bottom:96px; }
    /* the dish keeps the drag, or pulling a piece about on it scrolls the page
       underneath instead */
    #trayWrap{ touch-action:none; }
  }
  /* seven 30px tiles come to 246px, which is wider than a 3-inch screen */
  @media (max-width: 280px){
    #palette{ grid-template-columns:repeat(6, 30px); }
  }
  .mbtn{ width:44px; height:44px; border-radius:8px; border:1.5px solid rgba(236,227,208,.18);
    background:rgba(255,255,255,.02); cursor:pointer; opacity:.6; padding:0;
    transition:opacity .2s ease, border-color .2s ease, background .2s ease; }
  .mbtn svg{ width:100%; height:100%; }
  .mbtn:hover{ opacity:.9; }
  .mbtn.active{ opacity:1; border-color:var(--brass); background:rgba(201,151,78,.12); }

  .ghost{ position:fixed; width:52px; height:52px; border-radius:50%; pointer-events:none;
    z-index:999; opacity:.9; transform:translate(-50%,-50%); overflow:hidden;
    box-shadow:0 6px 18px rgba(0,0,0,.5); display:none; }
  .ghost img{ width:100%; height:100%; object-fit:cover; }
</style>
<style>
  /* The way back is the brass disc off the shelf's plinth, with an arrow cut into

<style>
  #music{ position:fixed; left:18px; bottom:16px; z-index:60; display:flex; align-items:center; gap:9px; }
  #musicBtn{ width:34px; height:34px; border-radius:50%; border:1px solid rgba(242,233,216,.25); background:rgba(20,24,34,.55); color:#f2e9d8; font-size:15px; line-height:1; cursor:pointer; opacity:.55; transition:opacity .3s, color .3s, border-color .3s; -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); }
  #musicBtn:hover{ opacity:1; }
  #musicBtn.playing{ color:#f0d69a; border-color:rgba(201,151,78,.6); opacity:.9; }
  #musicName{ max-width:40vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; color:#f2e9d8; opacity:0; transition:opacity .3s; letter-spacing:.02em; cursor:pointer; }
  #music:hover #musicName{ opacity:.55; }
  /* a phone has no hover, so the name of the visitor's own track was never
     visible on one at all -- and worse, an invisible thing sat there taking
     taps. While something is playing it simply shows, next to the button.
     Not a caption on the piece: it is their file's name, not the site's words. */
  #musicBtn.playing ~ #musicName{ opacity:.5; }

<div id="music" title="play your own music">
  <button id="musicBtn" aria-label="play your own music">🎧</button>
  <span id="musicName"></span>
</div>
<input type="file" id="musicPick" accept="audio/*" multiple hidden>
<audio id="musicEl"></audio>
<script>
(function(){
  const pick=document.getElementById('musicPick'), el=document.getElementById('musicEl'),
        btn=document.getElementById('musicBtn'), name=document.getElementById('musicName');
  let list=[], idx=0;
  const label=f=> f ? f.name.replace(/\.[^.]+$/,'') : '';
  function load(i){ if(el.src) URL.revokeObjectURL(el.src); el.src=URL.createObjectURL(list[i]); name.textContent=label(list[i]); }
  function sync(){ btn.textContent = !el.src ? '🎧' : (el.paused ? '▶' : '❚❚'); btn.classList.toggle('playing', !!el.src && !el.paused); }
  btn.addEventListener('click', ()=>{ if(!list.length){ pick.click(); return; } el.paused ? el.play() : el.pause(); });
  name.addEventListener('click', ()=> pick.click());
  pick.addEventListener('change', ()=>{ if(!pick.files.length) return; list=[...pick.files]; idx=0; el.loop=(list.length===1); load(0); el.play(); });
  el.addEventListener('ended', ()=>{ if(list.length>1){ idx=(idx+1)%list.length; load(idx); el.play(); } });
  el.addEventListener('play', sync); el.addEventListener('pause', sync); el.addEventListener('loadeddata', sync);
  sync();
})();
</script>

<script>
(function(){
  // draw the mirror-count line diagrams procedurally so the icon always
  // matches the real N exactly, rather than hand-drawing four separate svgs
  document.querySelectorAll('.mbtn').forEach(btn=>{
    const n=parseInt(btn.dataset.n,10);
    const g=btn.querySelector('g');
    const cx=20,cy=20,r=15.5;
    let d='';
    for(let i=0;i<n;i++){
      const a=(Math.PI*2/n)*i - Math.PI/2;
      const x=cx+Math.cos(a)*r, y=cy+Math.sin(a)*r;
      d+=`M${cx},${cy} L${x.toFixed(2)},${y.toFixed(2)} `;
    }
    g.innerHTML = `<path d="${d}" />`;
  });

  function loadImg(src){ const im=new Image(); im.src=src; return im; }
  const srcImgs = {
    gem: loadImg('kaleidoscope-gem.png'),
    glass: loadImg('kaleidoscope-glass.png'),
    nail: loadImg('kaleidoscope-nail.png'),
    gear: loadImg('kaleidoscope-gear.png'),
    bead_clear: loadImg('kaleidoscope-bead-clear.png'),
    bead_black: loadImg('kaleidoscope-bead-black.png'),
    bead_silver: loadImg('kaleidoscope-bead-silver.png'),
    bead_gold: loadImg('kaleidoscope-bead-gold.png'),
    stainedglass: loadImg('kaleidoscope-stainedglass.png'),
    china: loadImg('kaleidoscope-china.png'),
    amberglass: loadImg('kaleidoscope-amberglass.png'),
    beetle: loadImg('kaleidoscope-beetle.png'),
    seaglass: loadImg('kaleidoscope-seaglass.png'),
  };
  const trayImg = loadImg('kaleidoscope-tray.jpg');

  const trayWrap=document.getElementById('trayWrap'), trayCanvas=document.getElementById('tray');
  const trayCtx=trayCanvas.getContext('2d');
  const scopeWrap=document.getElementById('scopeWrap'), scopeInner=document.getElementById('scopeInner');
  const scopeRing=document.getElementById('scopeRing'), scopeCanvas=document.getElementById('scope');
  const scopeCtx=scopeCanvas.getContext('2d');
  const hueSlider=document.getElementById('hueSlider'), sizeSlider=document.getElementById('sizeSlider');
  const ghost=document.getElementById('ghost'), ghostImg=document.getElementById('ghostImg');

  let DPR=Math.min(2,window.devicePixelRatio||1);
  let traySize=0, scopeSize=0;
  let mirrors=6, turn=0.5;

  // placed objects, in tray-normalized 0..1 coordinates so they stay put
  // correctly regardless of on-screen size
  // the scope only ever shows a wedgeAngle-wide sliver of the tray at a time (that
  // sliver gets mirrored around to fill the circle) — the narrower that sliver is
  // (high mirror counts), the easier it is for a turn to land on a moment where none
  // of the pieces fall inside it, reading as a fully black scope even though pieces
  // are clearly on the tray. The one placement that defeats this for every mirror
  // count and every turn is a piece whose own circle contains the tray's exact
  // centre point (0.5,0.5) — every angle passes through that piece near the centre,
  // so the wedge sliver can never be empty. That piece needs to actually READ as
  // visible too, not just be geometrically present — a gem works far better than
  // glass here since its colour tint (below) makes it solid and bright, where the
  // glass art is mostly pale, thin outlines that all but disappear against the dark
  // tray. So the centred piece is a gem; glass and the second gem fill out the rest.
  let placed=[
    {type:'gem', x:0.42, y:0.55, size:0.3, hue:200},
    {type:'glass', x:0.66, y:0.34, size:0.18},
    {type:'gem', x:0.27, y:0.4, size:0.16, hue:30},
  ];

  // every non-gem piece used to drop at one flat 0.28 size regardless of type — on a tray
  // this small that's most of the working area, so placing more than 2-3 pieces buried
  // earlier ones completely under later ones with no way to tell they were even there.
  // Sized per type instead, closer to how big each object actually reads at the curated
  // defaults' scale above.
  const DROP_SIZE = {
    gem:0.22, gear:0.15, nail:0.16, bead_clear:0.13, bead_black:0.13, bead_silver:0.13, bead_gold:0.13,
    china:0.20, stainedglass:0.20, glass:0.20, custom:0.20,
    amberglass:0.20, beetle:0.21, seaglass:0.19
  };
  const SIZE_SLIDER_DEFAULT = 22;
  // nudges a freshly-dropped piece away from ones already sitting where it landed —
  // real small objects in a tray do rest touching or slightly overlapping each other,
  // they just don't land dead-center on top of one another and vanish from view
  function separateFromPlaced(p, size){
    for(let iter=0; iter<4; iter++){
      let moved=false;
      for(const o of placed){
        const dx=p.x-o.x, dy=p.y-o.y, d=Math.hypot(dx,dy)||0.0001;
        const minD=(size+o.size)/2*0.72;
        if(d<minD){ const push=minD-d; p.x+=(dx/d)*push; p.y+=(dy/d)*push; moved=true; }
      }
      const cx=0.5, cy=0.5, dx=p.x-cx, dy=p.y-cy, dist=Math.hypot(dx,dy)||0.0001, maxR=0.5-size/2-0.02;
      if(dist>maxR){ p.x=cx+dx/dist*maxR; p.y=cy+dy/dist*maxR; }
      if(!moved) break;
    }
    return p;
  }

  // ---- the brass bezel, drawn ------------------------------------------------
  // Two layers. The base is a lit, beveled brass annulus that never moves, so the
  // highlight sits where the light is. The milling is fine radial lines that ride
  // on top and turn with the ring, and their travel under the fixed light is what
  // reads as the ring being turned. The scope's black centre covers the inner hole.
  const ringBase = document.getElementById('ringBase');
  const ringMill = document.getElementById('ringMill');
  const RI = 0.435, RO = 0.499;          // inner / outer radius as a fraction of size
  function annulus(g, S){
    const c = S/2;
    g.beginPath(); g.arc(c, c, RO*S, 0, Math.PI*2);
    g.arc(c, c, RI*S, 0, Math.PI*2, true); g.clip();
  }
  function drawRing(cssSize){
    const S = Math.round(cssSize*DPR), c = S/2;
    ringBase.width = ringBase.height = S;
    // the grip layer's element is inset:-13%, i.e. 1.26x the frame, so its backing
    // store must match or everything drawn on it is scaled up and flung outward
    const Slarge = Math.round(S*1.26);
    ringMill.width = ringMill.height = Slarge;

    // ===================== brass-bound wood ==================================
    // A turned-wood ring, bound with brass at both edges, and bold brass grip lugs
    // around it. The wood and the binding stay put and lit from the top-left; the
    // grip lugs turn with the ring, so the edge both looks like something and plainly
    // asks to be taken hold of and turned.
    const g = ringBase.getContext('2d');
    g.clearRect(0,0,S,S); g.save(); annulus(g, S);

    // --- the wood field ------------------------------------------------------
    const wood = g.createRadialGradient(c,c, RI*S, c,c, RO*S);
    wood.addColorStop(0.00, '#3a2410');
    wood.addColorStop(0.30, '#6b431d');
    wood.addColorStop(0.55, '#8a5626');
    wood.addColorStop(0.78, '#6f451e');
    wood.addColorStop(1.00, '#4a2d13');
    g.fillStyle = wood; g.fillRect(0,0,S,S);
    // concentric turning grain: fine darker rings, as left by a lathe
    g.lineWidth = Math.max(0.6, S*0.0016);
    for(let k=0;k<26;k++){
      const r = (RI + (RO-RI)*(k+0.5)/26)*S;
      g.strokeStyle = k%2 ? 'rgba(40,24,10,0.28)' : 'rgba(150,100,55,0.14)';
      g.beginPath(); g.arc(c,c, r, 0, Math.PI*2); g.stroke();
    }
    g.restore();

    // --- the two brass binding bands, at the outer and inner edges ----------
    function band(radius, width){
      g.save(); g.beginPath();
      g.arc(c,c, radius+width/2, 0, Math.PI*2);
      g.arc(c,c, radius-width/2, 0, Math.PI*2, true); g.clip();
      const br = g.createRadialGradient(c,c, radius-width/2, c,c, radius+width/2);
      br.addColorStop(0.0, '#6a4d1f');
      br.addColorStop(0.5, '#c4a562');   // brass crest, softened so it doesn't glare
      br.addColorStop(1.0, '#775622');
      g.fillStyle = br; g.fillRect(0,0,S,S);
      g.restore();
    }
    const bw = (RO-RI)*S*0.24;                 // binding width
    band(RO*S - bw*0.55, bw);                  // outer band
    band(RI*S + bw*0.55, bw);                  // inner band

    // --- the light, cast from the top-left, over the whole frame ------------
    g.save(); annulus(g, S);
    const shade = g.createConicGradient(-Math.PI*0.75, c, c);
    shade.addColorStop(0.00, 'rgba(255,255,255,1)');
    shade.addColorStop(0.30, 'rgba(150,120,80,1)');
    shade.addColorStop(0.50, 'rgba(70,50,26,1)');
    shade.addColorStop(0.70, 'rgba(150,120,80,1)');
    shade.addColorStop(1.00, 'rgba(255,255,255,1)');
    g.globalCompositeOperation = 'multiply';
    g.fillStyle = shade; g.fillRect(0,0,S,S);
    const sheen = g.createConicGradient(-Math.PI*0.75, c, c);
    sheen.addColorStop(0.00, 'rgba(255,244,214,0.26)');
    sheen.addColorStop(0.16, 'rgba(255,244,214,0)');
    sheen.addColorStop(0.84, 'rgba(255,244,214,0)');
    sheen.addColorStop(1.00, 'rgba(255,244,214,0.26)');
    g.globalCompositeOperation = 'screen';
    g.fillStyle = sheen; g.fillRect(0,0,S,S);
    g.globalCompositeOperation = 'source-over';
    // crisp shadow where the frame drops to the black scope
    g.lineWidth = Math.max(1, S*0.006);
    g.strokeStyle = 'rgba(15,9,2,0.9)';
    g.beginPath(); g.arc(c,c, RI*S + g.lineWidth*0.5, 0, Math.PI*2); g.stroke();
    g.restore();

    // --- the grip: quiet lugs all round, and one grab knob standing proud ---
    // The mill canvas is larger than the frame (CSS inset:-13%), so its centre is
    // offset; everything here is measured from that centre, cm, in the same pixel
    // radii as the frame. The lugs are dimmed right down so the eye stays on the
    // scope; the one thing that speaks up is the knob, a wooden grab handle with a
    // brass collar that stands out past the wood edge and carries round as you turn.
    const m = ringMill.getContext('2d');
    const Sm = ringMill.width, cm = Sm/2;
    m.clearRect(0,0,Sm,Sm);
    const N = 16, mid = (RI+RO)/2*S, span = Math.PI*2/N;
    const lugLen = (RO-RI)*S*0.58, lugW = S*0.022;
    m.lineCap = 'round';
    for(let i=0;i<N;i++){
      const a = i*span;
      const dx = Math.cos(a), dy = Math.sin(a);
      const x0 = cm + dx*(mid - lugLen/2), y0 = cm + dy*(mid - lugLen/2);
      const x1 = cm + dx*(mid + lugLen/2), y1 = cm + dy*(mid + lugLen/2);
      m.strokeStyle = 'rgba(18,11,3,0.35)'; m.lineWidth = lugW*1.4;
      m.beginPath(); m.moveTo(x0,y0); m.lineTo(x1,y1); m.stroke();
      const lg = m.createLinearGradient(x0 - dy*lugW, y0 + dx*lugW, x0 + dy*lugW, y0 - dx*lugW);
      lg.addColorStop(0.0, '#4a3618'); lg.addColorStop(0.5, '#8a7343'); lg.addColorStop(1.0, '#54401d');
      m.strokeStyle = lg; m.lineWidth = lugW;
      m.beginPath(); m.moveTo(x0,y0); m.lineTo(x1,y1); m.stroke();
    }

    // --- the grab knob (drawn at the top of the ring, carries round on turn) --
    const ka = -Math.PI/2;                       // seated at 12 o'clock at rest
    const kx = cm + Math.cos(ka)*(RO*S + S*0.028);
    const ky = cm + Math.sin(ka)*(RO*S + S*0.028);
    const kr = S*0.052;
    // a stem from the wood edge out to the knob
    m.lineCap = 'round';
    m.strokeStyle = 'rgba(18,11,3,0.55)'; m.lineWidth = kr*0.92;
    m.beginPath();
    m.moveTo(cm + Math.cos(ka)*(RO*S - S*0.01), cm + Math.sin(ka)*(RO*S - S*0.01));
    m.lineTo(kx, ky); m.stroke();
    const stem = m.createLinearGradient(kx-kr,ky,kx+kr,ky);
    stem.addColorStop(0,'#4f3a18'); stem.addColorStop(0.5,'#9c7c40'); stem.addColorStop(1,'#5a4420');
    m.strokeStyle = stem; m.lineWidth = kr*0.62;
    m.beginPath();
    m.moveTo(cm + Math.cos(ka)*(RO*S - S*0.006), cm + Math.sin(ka)*(RO*S - S*0.006));
    m.lineTo(kx, ky); m.stroke();
    // seat shadow, then the wooden knob, then a brass collar and a soft catch
    m.fillStyle = 'rgba(12,7,2,0.5)';
    m.beginPath(); m.arc(kx, ky+kr*0.12, kr*1.06, 0, Math.PI*2); m.fill();
    const dome = m.createRadialGradient(kx-kr*0.35, ky-kr*0.4, kr*0.1, kx, ky, kr);
    dome.addColorStop(0.0, '#5c3c1a');   // darker walnut, closer to the shaded wood
    dome.addColorStop(0.5, '#3c2712');
    dome.addColorStop(1.0, '#241407');
    m.fillStyle = dome;
    m.beginPath(); m.arc(kx, ky, kr, 0, Math.PI*2); m.fill();
    // a brass collar around the knob's base
    m.strokeStyle = 'rgba(190,160,96,0.8)'; m.lineWidth = kr*0.16;
    m.beginPath(); m.arc(kx, ky, kr*0.9, 0, Math.PI*2); m.stroke();
    // a small, soft top-left catch (not a hard glint)
    const kh = m.createRadialGradient(kx-kr*0.34, ky-kr*0.4, 0, kx-kr*0.34, ky-kr*0.4, kr*0.7);
    kh.addColorStop(0,'rgba(255,238,200,0.34)'); kh.addColorStop(1,'rgba(255,238,200,0)');
    m.fillStyle = kh;
    m.beginPath(); m.arc(kx, ky, kr, 0, Math.PI*2); m.fill();
  }

  function resize(){
    DPR=Math.min(2,window.devicePixelRatio||1);
    const tr=trayWrap.getBoundingClientRect();
    traySize=Math.round(tr.width*DPR);
    trayCanvas.width=traySize; trayCanvas.height=traySize;
    const sr=scopeInner.getBoundingClientRect();
    scopeSize=Math.round(sr.width*DPR);
    scopeCanvas.width=scopeSize; scopeCanvas.height=scopeSize;
    drawRing(scopeWrap.getBoundingClientRect().width);
    drawAll();
  }
  window.addEventListener('resize', resize);

  function updateRing(){
    scopeRing.style.transform = `rotate(${(turn*180/Math.PI)}deg)`;
  }

  function drawObject(ctx, o, size){
    const img=srcImgs[o.type];
    if(!img || !img.complete || !img.naturalWidth) return;
    const px=o.x*size, py=o.y*size, s=o.size*size;
    ctx.save();
    ctx.beginPath(); ctx.arc(px,py,s/2,0,Math.PI*2); ctx.clip();
    // center-crop to square first — the built-in pieces are already square, but a
    // visitor's own photo rarely is, and this keeps it from stretching in the circle
    const iw=img.naturalWidth, ih=img.naturalHeight, sq=Math.min(iw,ih);
    ctx.drawImage(img, (iw-sq)/2, (ih-sq)/2, sq, sq, px-s/2, py-s/2, s, s);
    if(o.type==='gem'){
      ctx.globalCompositeOperation='color';
      ctx.fillStyle=`hsl(${o.hue}, 85%, 50%)`;
      ctx.fillRect(px-s/2, py-s/2, s, s);
      ctx.globalCompositeOperation='source-over';
    }
    ctx.restore();
  }

  function drawTray(){
    if(!traySize) return;
    trayCtx.clearRect(0,0,traySize,traySize);
    if(trayImg.complete && trayImg.naturalWidth){
      trayCtx.drawImage(trayImg,0,0,traySize,traySize);
    }
    for(const o of placed) drawObject(trayCtx, o, traySize);
  }

  // the tray photo is a real tin with its own gold rim baked in — the velvet
  // interior only fills the inner portion of the frame before that rim
  // starts. Panning the sample far enough (see the translate below) can
  // otherwise sweep past the velvet into that rim, mirroring fragments of
  // it into the pattern as a stray pale shape that doesn't belong there.
  // 0.78 was checked empirically across a full turn of the ring at every
  // mirror count, comfortably inside the real boundary rather than right
  // up against it.
  const TRAY_SAFE_FRACTION = 0.78;

  function drawScope(){
    if(!scopeSize) return;
    scopeCtx.clearRect(0,0,scopeSize,scopeSize);
    const cx=scopeSize/2, cy=scopeSize/2, R=scopeSize/2;
    const wedgeAngle=(Math.PI*2)/mirrors;
    scopeCtx.save();
    scopeCtx.beginPath(); scopeCtx.arc(cx,cy,R,0,Math.PI*2); scopeCtx.clip();
    // fill with the tray's own velvet tone first so gaps between mirrored
    // objects read as more tray, not flat black
    scopeCtx.fillStyle='#0c0a08'; scopeCtx.fillRect(0,0,scopeSize,scopeSize);
    for(let i=0;i<mirrors;i++){
      scopeCtx.save();
      scopeCtx.translate(cx,cy);
      scopeCtx.rotate(i*wedgeAngle);
      if(i%2===1) scopeCtx.scale(1,-1);
      scopeCtx.beginPath();
      scopeCtx.moveTo(0,0);
      scopeCtx.arc(0,0,R,-wedgeAngle/2,wedgeAngle/2);
      scopeCtx.closePath();
      scopeCtx.clip();
      const s=R*2.4;
      scopeCtx.rotate(turn);
      // no pan offset here, on purpose: the centre of the mirror formation is the
      // tray's own true centre, always, so it never depends on where `turn` happens
      // to be. Two earlier attempts panned the sample away from centre instead (first
      // by a lot, then by a little) to let rim-placed pieces eventually sweep into
      // view — both wrong, because that offset also orbits the tray's OWN centre (and
      // anything placed there, the common case) out of the wedge's narrow slice for
      // real stretches of a turn, reading as objects going missing. Turning still
      // rotates the whole pattern (see the rotate above), just around a fixed middle
      // instead of a wandering one. s is already zoomed in past the wedge's own radius
      // R (s/2 = 1.2R), so a real, sizeable ring around the centre — not just a pinprick
      // — is visible without any pan at all; only the tray's outer rim stays out of reach.
      if(trayCanvas.width){
        // constrain painting to the tray's own safe velvet circle (in
        // addition to the wedge clip already active) so the rim can never
        // show up here, no matter how far the pan/turn reaches
        scopeCtx.save();
        scopeCtx.beginPath();
        scopeCtx.arc(0, 0, TRAY_SAFE_FRACTION*(s/2), 0, Math.PI*2);
        scopeCtx.clip();
        scopeCtx.drawImage(trayCanvas, -s/2, -s/2, s, s);
        scopeCtx.restore();
      }
      scopeCtx.restore();
    }
    scopeCtx.restore();
    const g=scopeCtx.createRadialGradient(cx,cy,R*0.15,cx,cy,R);
    g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,.42)');
    scopeCtx.fillStyle=g;
    scopeCtx.beginPath(); scopeCtx.arc(cx,cy,R,0,Math.PI*2); scopeCtx.fill();
  }

  function drawAll(){ drawTray(); drawScope(); }

  // ---------- turning the scope ----------
  let scopeDragging=false, lastX=0;
  scopeWrap.addEventListener('pointerdown', e=>{ scopeDragging=true; lastX=e.clientX; scopeWrap.setPointerCapture(e.pointerId); });
  scopeWrap.addEventListener('pointermove', e=>{
    if(!scopeDragging) return;
    turn += (e.clientX-lastX)*0.012; lastX=e.clientX;
    updateRing();
    drawScope();
  });
  scopeWrap.addEventListener('pointerup', ()=>scopeDragging=false);
  scopeWrap.addEventListener('pointercancel', ()=>scopeDragging=false);

  // ---------- mirror count ----------
  document.querySelectorAll('.mbtn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.mbtn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      mirrors=parseInt(btn.dataset.n,10);
      drawScope();
    });
  });

  // ---------- gem colour + size ----------
  hueSlider.addEventListener('input', ()=>{
    // colours the piece currently being dragged (if a gem) and sets the
    // colour new gems will be placed with
    currentHue = parseInt(hueSlider.value,10);
    if(dragging && dragging.type==='gem'){ dragging.hue=currentHue; drawAll(); }
  });
  let currentHue = parseInt(hueSlider.value,10);

  // one slider, every piece — it scales each type's own base size up or down together
  // (so a nail stays smaller than a china shard at any setting) rather than only ever
  // affecting gems while every other piece stayed fixed at its default size
  sizeSlider.addEventListener('input', ()=>{
    sizeMul = parseInt(sizeSlider.value,10)/SIZE_SLIDER_DEFAULT;
    if(dragging){ dragging.size=(DROP_SIZE[dragging.type]||0.2)*sizeMul; drawAll(); }
  });
  let sizeMul = parseInt(sizeSlider.value,10)/SIZE_SLIDER_DEFAULT;

  // ---------- dragging pieces onto / around the tray ----------
  let dragging=null; // the object currently being moved (from palette or already placed)
  let dragFromPalette=false;

  function trayRect(){ return trayWrap.getBoundingClientRect(); }
  function clientToTray(clientX, clientY){
    const r=trayRect();
    return { x:(clientX-r.left)/r.width, y:(clientY-r.top)/r.height };
  }
  function withinTray(clientX, clientY){
    const r=trayRect();
    const cx=r.left+r.width/2, cy=r.top+r.height/2;
    const dx=clientX-cx, dy=clientY-cy;
    return Math.hypot(dx,dy) <= r.width/2;
  }

  const imgPick=document.getElementById('imgPick'), customPiece=document.getElementById('customPiece');
  let customLoaded=false, customObjectURL=null;

  /* the phone's drawer of pieces -- see the max-width:899px block above */
  const PHONE = matchMedia('(max-width: 899px)');
  const palette = document.getElementById('palette');
  const paletteVeil = document.getElementById('paletteVeil');
  const drawerShut = () => PHONE.matches && !palette.classList.contains('open');
  function openDrawer(){ palette.classList.add('open'); paletteVeil.classList.add('on'); }
  function closeDrawer(){ palette.classList.remove('open'); paletteVeil.classList.remove('on'); }
  paletteVeil.addEventListener('pointerdown', e=>{ e.preventDefault(); closeDrawer(); });
  PHONE.addEventListener('change', closeDrawer);

  document.querySelectorAll('.piece').forEach(piece=>{
    piece.addEventListener('pointerdown', e=>{
      // shut, the tray is one object: the whole thing opens, and nothing is picked
      // up yet. The same once-to-unfold, again-to-act bargain the case itself makes.
      if(drawerShut()){ openDrawer(); e.preventDefault(); return; }
      const type=piece.dataset.type;
      if(type==='custom' && !customLoaded){ imgPick.click(); e.preventDefault(); return; }
      dragging={ type, x:0.5, y:0.5, size: (DROP_SIZE[type]||0.2)*sizeMul, hue: type==='gem'?currentHue:undefined };
      dragFromPalette=true;
      ghost.style.display='block';
      ghostImg.src = piece.querySelector('img').src;
      moveGhost(e.clientX, e.clientY);
      e.preventDefault();
    });
  });

  customPiece.querySelector('.swap-btn').addEventListener('pointerdown', e=>{
    e.stopPropagation(); e.preventDefault();
    if(drawerShut()){ openDrawer(); return; }
    imgPick.click();
  });
  imgPick.addEventListener('change', ()=>{
    if(!imgPick.files.length) return;
    if(customObjectURL) URL.revokeObjectURL(customObjectURL);
    customObjectURL=URL.createObjectURL(imgPick.files[0]);
    const im=new Image();
    im.onload=()=>{
      srcImgs.custom=im;
      customPiece.querySelector('img').src=customObjectURL;
      customPiece.classList.add('has-image');
      customLoaded=true;
      drawAll();
    };
    im.src=customObjectURL;
  });

  function moveGhost(x,y){ ghost.style.left=x+'px'; ghost.style.top=y+'px'; }

  function hitTestPlaced(clientX, clientY){
    const p = clientToTray(clientX, clientY);
    let best=null, bestD=Infinity;
    for(const o of placed){
      const d=Math.hypot(o.x-p.x, o.y-p.y);
      if(d < o.size/2 + 0.02 && d < bestD){ best=o; bestD=d; }
    }
    return best;
  }

  trayWrap.addEventListener('pointerdown', e=>{
    const hit=hitTestPlaced(e.clientX, e.clientY);
    if(hit){ dragging=hit; dragFromPalette=false; e.preventDefault(); }
  });

  window.addEventListener('pointermove', e=>{
    if(!dragging) return;
    if(dragFromPalette){
      moveGhost(e.clientX, e.clientY);
    } else {
      const p=clientToTray(e.clientX, e.clientY);
      dragging.x=Math.min(1,Math.max(0,p.x));
      dragging.y=Math.min(1,Math.max(0,p.y));
      drawAll();
    }
  });

  window.addEventListener('pointerup', e=>{
    if(!dragging) return;
    if(dragFromPalette){
      if(withinTray(e.clientX, e.clientY)){
        const p=separateFromPlaced(clientToTray(e.clientX, e.clientY), dragging.size);
        dragging.x=p.x; dragging.y=p.y;
        placed.push(dragging);
        closeDrawer();   // it landed; a miss leaves the drawer out to try again
      }
      ghost.style.display='none';
    } else {
      // dragging an already-placed piece — drop outside the tray removes it
      if(!withinTray(e.clientX, e.clientY)){
        placed = placed.filter(o=>o!==dragging);
      }
    }
    dragging=null; dragFromPalette=false;
    drawAll();
  });

  updateRing();
  let ready=0;
  const total=Object.keys(srcImgs).length+1;
  function onOneReady(){ ready++; if(ready>=total) resize(); }
  Object.values(srcImgs).forEach(im=>im.onload=onOneReady);
  trayImg.onload=onOneReady;
  resize();
})();
</script>

  #plates img{ width:100%; height:100%; object-fit:cover; display:block; }
  @media (prefers-reduced-motion: reduce){
    #plates, #plates .pieces{ transition:none; }
  }

<script>
(function(){
  var disc=document.getElementById('shelfdisc'), box=document.getElementById('plates');
  var rows=[].slice.call(box.querySelectorAll('.row'));
  function unroll(){ rows.forEach(function(r){ r.classList.remove('rolled'); }); }
  function shut(){ box.classList.remove('open'); disc.setAttribute('aria-expanded','false'); unroll(); }

  disc.addEventListener('click', function(ev){
    ev.stopPropagation();
    var open=box.classList.toggle('open');
    disc.setAttribute('aria-expanded', open?'true':'false');
    if(!open) unroll();
  });

  // Same bargain the case itself strikes: a mouse can hover, so a plate is a link
  // straight to its shelf. A thumb cannot, so the first tap on a plate rolls its
  // pieces out and only the second one goes to the shelf.
  var FINE=matchMedia('(hover: hover) and (pointer: fine)');
  rows.forEach(function(row){
    row.querySelector('.tag').addEventListener('click', function(ev){
      if(FINE.matches) return;
      if(row.classList.contains('rolled')) return;
      ev.preventDefault();
      unroll(); row.classList.add('rolled');
    });
  });

  document.addEventListener('click', function(ev){
    if(!box.contains(ev.target) && ev.target!==disc) shut();
  });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') shut(); });
})();
</script>
