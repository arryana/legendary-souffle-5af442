<style>

  #eternityToggle:focus-visible{ outline:1px solid rgba(233,217,168,.6); outline-offset:4px; }

  /* a quiet flag, always available, for setting the latitude to somewhere other than

<div id="music" title="play your own music">
  <button id="musicBtn" aria-label="play your own music">🎧</button>
  <span id="musicName"></span>
</div>
<input type="file" id="musicPick" accept="audio/*" multiple hidden>
<audio id="musicEl"></audio>
<script>
(function(){
  const pick=document.getElementById('musicPick'), el=document.getElementById('musicEl'),
        btn=document.getElementById('musicBtn'), name=document.getElementById('musicName');
  let list=[], idx=0;
  const label=f=> f ? f.name.replace(/\.[^.]+$/,'') : '';
  function load(i){ if(el.src) URL.revokeObjectURL(el.src); el.src=URL.createObjectURL(list[i]); name.textContent=label(list[i]); }
  function sync(){ btn.textContent = !el.src ? '🎧' : (el.paused ? '▶' : '❚❚'); btn.classList.toggle('playing', !!el.src && !el.paused); }
  btn.addEventListener('click', ()=>{ if(!list.length){ pick.click(); return; } el.paused ? el.play() : el.pause(); });
  name.addEventListener('click', ()=> pick.click());
  pick.addEventListener('change', ()=>{ if(!pick.files.length) return; list=[...pick.files]; idx=0; el.loop=(list.length===1); load(0); el.play(); });
  el.addEventListener('ended', ()=>{ if(list.length>1){ idx=(idx+1)%list.length; load(idx); el.play(); } });
  el.addEventListener('play', sync); el.addEventListener('pause', sync); el.addEventListener('loadeddata', sync);
  sync();
})();
</script>
<canvas id="scene"></canvas>
<div id="dock">
  <canvas id="globeWrap" width="164" height="164" aria-label="latitude" role="slider" tabindex="0"></canvas>
  <input type="range" id="speedSlider" min="0" max="100" value="80" aria-label="time speed">
  <div id="eternityToggle" role="checkbox" tabindex="0" aria-checked="false" aria-label="ever-thickening trace">∞</div>
  <button type="button" id="loc-flag" title="check another location" aria-label="check another location" aria-expanded="false">🚩</button>
  <form id="loc-search" autocomplete="off">
    <input type="text" id="loc-search-input" placeholder="postcode or city" aria-label="postcode or city">
  </form>
  <div id="loc-search-status"></div>
</div>
<script>
(function(){
  const canvas=document.getElementById('scene'), ctx=canvas.getContext('2d');
  const globeCanvas=document.getElementById('globeWrap'), gctx=globeCanvas.getContext('2d');
  const speedSlider=document.getElementById('speedSlider');
  const eternityToggle=document.getElementById('eternityToggle');
  let W=0,H=0,DPR=1, cx=0, cy=0, floorR=0;

  // ---------- sand trace: like a real Foucault demonstration, a stylus mark
  // that fans into a rosette as the plane precesses. off by default, it clears
  // itself into a fresh bloom each time the pin ring empties; the ∞ toggle
  // switches that off so it keeps thickening indefinitely instead ----------
  let sandEternal=false;
  function setEternal(v){
    sandEternal=v;
    eternityToggle.setAttribute('aria-checked', String(v));
    eternityToggle.classList.toggle('active', v);
  }
  eternityToggle.addEventListener('click', ()=>setEternal(!sandEternal));
  eternityToggle.addEventListener('keydown', e=>{
    if(e.key===' '||e.key==='Enter'){ e.preventDefault(); setEternal(!sandEternal); }
  });
  let sandLayer=null, sandCtx=null;
  // where the stylus was last frame; cleared with the sand so a wipe cannot leave
  // a stray line drawn from wherever the bob happened to be before it
  let sandPrev=null;
  function clearSand(){ if(sandCtx) sandCtx.clearRect(0,0,sandLayer.width,sandLayer.height); sandPrev=null; }

  // ---------- latitude: set by dragging a line across the small globe ----------
  // a line of latitude, viewed exactly edge-on (the standard way a globe is drawn
  // with its axis vertical), projects to a plain horizontal chord — full width at
  // the equator, shrinking to a point at the pole. that's the "line" itself: no
  // separate readout needed, the chord's own length and height carry the value.
  let lat = 0.75; // radians, fallback until geolocation resolves (~43°N)
  function setLatFromDrag(clientY){
    const rect=globeCanvas.getBoundingClientRect();
    const gR=rect.width/2*0.94;
    const localY=clientY-(rect.top+rect.height/2);
    const s=Math.max(-1,Math.min(1,-localY/gR));
    lat=Math.asin(s);
  }
  let draggingGlobe=false;
  globeCanvas.addEventListener('pointerdown', e=>{ draggingGlobe=true; globeCanvas.setPointerCapture(e.pointerId); setLatFromDrag(e.clientY); });
  globeCanvas.addEventListener('pointermove', e=>{ if(draggingGlobe) setLatFromDrag(e.clientY); });
  globeCanvas.addEventListener('pointerup', ()=>{ draggingGlobe=false; });
  globeCanvas.addEventListener('pointercancel', ()=>{ draggingGlobe=false; });

  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      pos => { lat = pos.coords.latitude*Math.PI/180; },
      () => {}, { timeout: 4000 }
    );
  }

  // the flag: a quiet, always-there way to set the latitude to somewhere other than
  // wherever the visitor actually is — never open by default, no page text anywhere
  // else hints it exists. Geocoding goes through OpenStreetMap's Nominatim (free, no
  // key) since open-meteo's own geocoder searches place names, not postcodes.
  (function initLocationSearch(){
    const flag=document.getElementById('loc-flag');
    const form=document.getElementById('loc-search');
    const input=document.getElementById('loc-search-input');
    const status=document.getElementById('loc-search-status');
    if(!flag || !form || !input) return;

    flag.addEventListener('click', ()=>{
      const open=form.classList.toggle('open');
      flag.classList.toggle('open', open);
      flag.setAttribute('aria-expanded', open ? 'true' : 'false');
      if(open) input.focus();
      else status.textContent='';
    });

    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const q=input.value.trim();
      if(!q) return;
      status.textContent='looking…';
      try{
        const url=`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q)}`;
        const res=await fetch(url);
        const results=await res.json();
        if(!results || !results.length){ status.textContent="couldn't find that"; return; }
        lat=parseFloat(results[0].lat)*Math.PI/180;
        status.textContent=results[0].display_name.split(',').slice(0,2).join(', ');
        input.value='';
      }catch(e){
        status.textContent="couldn't reach the map — try again";
      }
    });
  })();

  // the real globe, rendered as simplified continent silhouettes on a rotating
  // sphere (orthographic projection, polygons clipped to the visible hemisphere)
  // instead of pre-rendered photo frames. Rotation is now continuous real math
  // rather than a swap between 32 stills, so it's exactly as smooth as the
  // display's own frame rate — no dipping through black between frames, and no
  // baked-in artifacts (the old frames carried garbled text labels) to fight.
  // There's no longitude control here (only latitude), so instead the globe
  // spins slowly on its own — a lazy ambient rotation that eventually brings
  // every part of the world into view, purely decorative and independent of
  // both the time-speed slider and the latitude drag (which only reads the
  // chord's height, unaffected by which way the sphere is currently turned).
  const GLOBE_SPIN_DEG_PER_SEC = 4;
  // simplified continent outlines, [lon,lat] degrees — stylized silhouettes
  // traced roughly to real coastlines, sized for an ~80px decoration rather
  // than surveyed accuracy.
  const CONTINENTS = [
    [[-165,68],[-140,71],[-110,72],[-95,75],[-75,68],[-60,50],[-53,47],[-65,45],
     [-75,35],[-81,25],[-97,18],[-92,14],[-84,9],[-79,8],[-105,20],[-110,25],
     [-117,32],[-124,40],[-124,49],[-130,55],[-140,60],[-165,68]], // North America
    [[-79,8],[-77,0],[-80,-5],[-81,-15],[-71,-18],[-70,-30],[-73,-40],[-68,-52],
     [-65,-55],[-58,-52],[-57,-38],[-48,-25],[-35,-8],[-50,0],[-60,5],[-70,10],[-79,8]], // South America
    [[-9,43],[-9,52],[-5,58],[5,62],[15,68],[25,70],[30,60],[27,45],[19,42],
     [13,38],[3,43],[-9,43]], // Europe
    [[-17,15],[-17,21],[-6,35],[10,37],[20,32],[32,31],[43,12],[51,12],[42,-1],
     [40,-15],[35,-25],[27,-34],[18,-34],[12,-18],[9,4],[-5,5],[-11,7],[-17,15]], // Africa
    [[27,45],[40,45],[60,55],[70,55],[90,50],[110,52],[130,55],[145,60],[160,65],
     [178,68],[178,60],[160,55],[142,45],[130,35],[122,30],[110,20],[103,10],
     [95,15],[80,8],[77,20],[68,25],[60,25],[48,30],[35,32],[27,36],[27,45]], // Asia
    [[113,-22],[122,-18],[130,-12],[137,-12],[142,-11],[145,-16],[153,-28],
     [150,-37],[140,-38],[132,-32],[122,-34],[115,-35],[113,-22]], // Australia
    [[-45,60],[-38,66],[-25,71],[-25,77],[-45,77],[-55,70],[-52,63],[-45,60]], // Greenland
  ];
  const ICE_CAP_LAT = -58; // Antarctica, approximated as a polar cap

  // orthographic projection of a lon/lat point onto the sphere as currently
  // rotated; z<0 means it's on the far side, facing away from the viewer
  function sphereProject(lonDeg, latDeg, rotDeg, R, gcx, gcy){
    const lon=(lonDeg-rotDeg)*Math.PI/180, lat=latDeg*Math.PI/180;
    const x=Math.cos(lat)*Math.sin(lon), y=Math.sin(lat), z=Math.cos(lat)*Math.cos(lon);
    return { x: gcx+R*x, y: gcy-R*y, z };
  }
  // fills a continent polygon, clipped to the visible (z>=0) hemisphere. Where
  // an edge crosses the horizon, the crossing point lands exactly on the
  // sphere's own silhouette circle — so clipping in 3D reduces to snapping
  // that interpolated point onto the circle, no separate 2D clip pass needed.
  function drawContinent(poly, rotDeg, R, gcx, gcy){
    const pts = poly.map(([lon,lat]) => sphereProject(lon,lat,rotDeg,R,gcx,gcy));
    const clipped = [];
    for(let i=0;i<pts.length;i++){
      const a=pts[i], b=pts[(i+1)%pts.length];
      if(a.z>=0) clipped.push(a);
      if((a.z>=0)!==(b.z>=0)){
        const tt=a.z/(a.z-b.z);
        const ix=a.x+(b.x-a.x)*tt, iy=a.y+(b.y-a.y)*tt;
        const dx=ix-gcx, dy=iy-gcy, d=Math.hypot(dx,dy)||1;
        clipped.push({x:gcx+dx/d*R, y:gcy+dy/d*R, z:0});
      }
    }
    if(clipped.length<3) return;
    gctx.beginPath();
    gctx.moveTo(clipped[0].x,clipped[0].y);
    for(let i=1;i<clipped.length;i++) gctx.lineTo(clipped[i].x,clipped[i].y);
    gctx.closePath();
    gctx.fill();
  }
  function drawGlobe(t){
    const w=globeCanvas.width, h=globeCanvas.height, R=w/2*0.90;
    const gcx=w/2, gcy=h/2;
    gctx.clearRect(0,0,w,h);
    const rotDeg = (12 + t*GLOBE_SPIN_DEG_PER_SEC) % 360;

    gctx.save();
    gctx.beginPath(); gctx.arc(gcx,gcy,R,0,Math.PI*2); gctx.clip();

    // ocean — a soft sphere-shaded base rather than a flat fill
    const ocean=gctx.createRadialGradient(gcx-R*0.35,gcy-R*0.4,R*0.15,gcx,gcy,R*1.05);
    ocean.addColorStop(0,'#3f7aa8'); ocean.addColorStop(0.55,'#265f8c'); ocean.addColorStop(1,'#0e2f4c');
    gctx.fillStyle=ocean; gctx.fillRect(gcx-R,gcy-R,R*2,R*2);

    // graticule — parallels are fixed chords (see the latitude line below);
    // meridians slide sideways as the globe turns, the clearest visual cue
    // that it's actually rotating rather than just sitting there
    gctx.strokeStyle='rgba(255,255,255,0.16)'; gctx.lineWidth=0.6;
    [-60,-30,0,30,60].forEach(pLat=>{
      const ply=gcy-Math.sin(pLat*Math.PI/180)*R, plx=Math.cos(pLat*Math.PI/180)*R;
      gctx.beginPath(); gctx.moveTo(gcx-plx,ply); gctx.lineTo(gcx+plx,ply); gctx.stroke();
    });
    for(let mLon=0; mLon<360; mLon+=45){
      const delta=((mLon-rotDeg)%360+540)%360-180; // wrapped to -180..180
      if(Math.abs(delta)>=90) continue; // facing away — the far half of this meridian
      const dRad=delta*Math.PI/180;
      gctx.beginPath();
      for(let i=0;i<=18;i++){
        const phi=(-90+i*10)*Math.PI/180;
        const px=gcx+R*Math.cos(phi)*Math.sin(dRad), py=gcy-R*Math.sin(phi);
        if(i===0) gctx.moveTo(px,py); else gctx.lineTo(px,py);
      }
      gctx.stroke();
    }

    // continents
    gctx.fillStyle='#7c9b6e';
    CONTINENTS.forEach(poly => drawContinent(poly, rotDeg, R, gcx, gcy));

    // south polar ice cap — it wraps every longitude, so seen from this
    // equatorial camera it's simply the circle segment below its latitude
    gctx.save();
    const capY = gcy - Math.sin(ICE_CAP_LAT*Math.PI/180)*R;
    gctx.beginPath(); gctx.rect(gcx-R, capY, R*2, gcy+R-capY); gctx.clip();
    gctx.fillStyle='rgba(235,242,246,0.88)';
    gctx.beginPath(); gctx.arc(gcx,gcy,R,0,Math.PI*2); gctx.fill();
    gctx.restore();

    // sphere shading (soft highlight, darker toward the rim) plus the same
    // dark vignette the old photo-frame version used, so the disc still
    // blends cleanly into the page background at its edge
    const shade=gctx.createRadialGradient(gcx-R*0.35,gcy-R*0.4,R*0.1,gcx,gcy,R);
    shade.addColorStop(0,'rgba(255,255,255,0.14)');
    shade.addColorStop(0.55,'rgba(0,0,0,0)');
    shade.addColorStop(1,'rgba(0,0,0,0.6)');
    gctx.fillStyle=shade; gctx.beginPath(); gctx.arc(gcx,gcy,R,0,Math.PI*2); gctx.fill();

    gctx.restore();

    // the chosen latitude — a plain chord, its own length and height the whole control.
    // white rather than the site's usual gold so it actually stands out against the
    // globe's own blues and greens, instead of blending into their similar warm tone
    const ly=gcy-Math.sin(lat)*R, lx=Math.cos(lat)*R;
    gctx.strokeStyle='#ffffff'; gctx.lineWidth=2; gctx.lineCap='round';
    gctx.shadowColor='rgba(255,255,255,.8)'; gctx.shadowBlur=4;
    gctx.beginPath(); gctx.moveTo(gcx-lx,ly); gctx.lineTo(gcx+lx,ly); gctx.stroke();
    gctx.shadowBlur=0;
  }

  // ---------- time: real precession is imperceptibly slow — a speed slider
  // scales the simulated clock so the same physics can be watched honestly slow
  // or sped up enough to see happen, rather than picking one fixed rate ----------
  let speedAmt=speedSlider.value/100;
  speedSlider.addEventListener('input', ()=>{ speedAmt=speedSlider.value/100; });
  // 1x (real time) up to ~800x. Capped well below the point where the plane's
  // own rotation could outrun the swing itself (3.4s) — even at the pole, the
  // fastest case there is, a full turn still takes ~108s, comfortably slower
  // than one swing so the line always reads as a line, never a spiral.
  function speedMultiplier(){ return Math.pow(10, speedAmt*2.9); }

  // ---------- pendulum ----------
  const SWING_PERIOD=3.4;      // seconds, the ordinary back-and-forth
  const DAY=86400;             // seconds
  let planeAngle=0;
  let simClock=0;
  let last=performance.now();

  let floorLayer=null;
  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth; H=window.innerHeight;
    canvas.width=W*DPR; canvas.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
    // size against whichever dimension is actually tight — on a narrow phone
    // that's width, and the old min(W,H) sizing left the circle stranded small
    // with a lot of dead space above it once the dock's own height was spent
    const topMargin=50, dockReserve=100;
    const usableH=Math.max(200,H-topMargin-dockReserve);
    floorR=Math.min(W*0.46, usableH/2*0.94);
    cx=W/2; cy=topMargin+usableH/2;
    floorLayer=document.createElement('canvas'); floorLayer.width=W; floorLayer.height=H;
    const fl=floorLayer.getContext('2d');
    const g=fl.createRadialGradient(cx,cy,0,cx,cy,floorR);
    g.addColorStop(0,'#221d17'); g.addColorStop(0.7,'#171310'); g.addColorStop(1,'#0c0a08');
    fl.fillStyle=g; fl.beginPath(); fl.arc(cx,cy,floorR,0,7); fl.fill();
    fl.strokeStyle='rgba(231,221,201,.12)'; fl.lineWidth=1;
    fl.beginPath(); fl.arc(cx,cy,floorR*0.86,0,7); fl.stroke();
    sandLayer=document.createElement('canvas'); sandLayer.width=W; sandLayer.height=H;
    sandCtx=sandLayer.getContext('2d');
    sandPrev=null;   // the old sand went with the old layer; don't draw across the gap
  }
  window.addEventListener('resize',resize);

  // ---------- pins: a ring of 24 pegs, 15 degrees apart — an hour's worth of
  // turn each, but only at the pole, where the plane really does come round at
  // 15 deg/hour. Everywhere else the same peg takes 1/sin(latitude) times as
  // long, which is the point: the ring is a clock that runs slower the further
  // you are from the pole, and stops on the equator. The bob nudges them over
  // as it reaches each extreme of its swing — the bob only ever touches the
  // ring on whichever side it's currently swung out to, so a pin and the one
  // opposite it fall half a swing apart, not together, alternating with the
  // back-and-forth: one on the out-swing, the next opposite on the return.
  // a full ring still empties in half a rotation, that symmetry is real. the
  // ring resets once it's emptied.
  const PIN_COUNT=24, PIN_R_FRAC=0.72, FALL_DUR=0.35;
  let pins=Array.from({length:PIN_COUNT},(_,i)=>({ angle:(i/PIN_COUNT)*Math.PI*2, major:i%6===0, knocked:false, knockedAt:-1 }));
  let prevSwingFrac=1, prevRising=false;
  let posSweepAngle=planeAngle, negSweepAngle=planeAngle+Math.PI;
  function sweepKnock(prevA, currA, t){
    // south of the equator the plane precesses the other way, so currA can
    // land below prevA just as often as above it — sweep by range, not by
    // assumed direction, or the ring stops dead the moment it flips sign.
    const lo=Math.min(prevA,currA), hi=Math.max(prevA,currA);
    for(const p of pins){
      if(p.knocked) continue;
      let k=p.angle+Math.ceil((lo-p.angle)/(Math.PI*2))*(Math.PI*2);
      for(; k<=hi; k+=Math.PI*2){ p.knocked=true; p.knockedAt=t; break; }
    }
  }
  function updatePins(t, swingFrac){
    const rising = swingFrac > prevSwingFrac;
    if(prevRising && !rising){
      // just swung out to the "positive" side and touched the ring there
      sweepKnock(posSweepAngle, planeAngle, t);
      posSweepAngle = planeAngle;
    } else if(!prevRising && rising){
      // just swung out to the opposite side and touched the ring there
      const curr = planeAngle + Math.PI;
      sweepKnock(negSweepAngle, curr, t);
      negSweepAngle = curr;
    }
    prevSwingFrac = swingFrac; prevRising = rising;
    if(pins.every(p=>p.knocked)){
      for(const p of pins){ p.knocked=false; p.knockedAt=-1; }
      if(!sandEternal) clearSand();
    }
  }
  function drawPins(t){
    const baseR=floorR*PIN_R_FRAC;
    for(const p of pins){
      let fall=0;
      if(p.knocked){ fall=Math.min(1,(t-p.knockedAt)/FALL_DUR); fall=1-Math.pow(1-fall,3); }
      const len=p.major?13:9;
      // pushed straight outward, away from the pivot — never sideways —
      // the same direction the bob approached from
      const dirA=p.angle;
      const push=fall*7;
      const x0=Math.cos(p.angle)*baseR, y0=Math.sin(p.angle)*baseR;
      const x1=x0+Math.cos(dirA)*(len+push), y1=y0+Math.sin(dirA)*(len+push);
      const perpA=dirA+Math.PI/2;

      // standing: a small crossbar at the tip — a T seen edge-on. fallen: that
      // same crossbar collapses into a round brass head, pushed further out
      // along the same line — a lollipop knocked away from the ring, not
      // swept sideways around it.
      ctx.strokeStyle=`rgba(233,217,168,${((p.major?0.42:0.26)*(1-fall*0.2)).toFixed(2)})`;
      ctx.lineWidth=p.major?2:1.4;
      ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();

      if(fall<0.999){
        const cl=(p.major?6:4.5)*(1-fall);
        const px=Math.cos(perpA)*cl, py=Math.sin(perpA)*cl;
        ctx.beginPath(); ctx.moveTo(x1-px,y1-py); ctx.lineTo(x1+px,y1+py); ctx.stroke();
      }
      if(fall>0.001){
        const r=(p.major?3.6:2.6)*fall;
        const bg=ctx.createRadialGradient(x1-r*0.3,y1-r*0.35,0.3,x1,y1,r);
        bg.addColorStop(0,'#f3d489'); bg.addColorStop(0.6,'#c99a3f'); bg.addColorStop(1,'#8a6420');
        ctx.beginPath(); ctx.arc(x1,y1,r,0,7); ctx.fillStyle=bg; ctx.fill();
      }
    }
  }

  function tick(now){
    const t=now*0.001;
    const dtReal=Math.min((now-last)/1000,0.05); last=now;
    drawGlobe(t);

    // the swing itself always runs at its own honest pace
    simClock += dtReal;
    const swingFrac = Math.cos((simClock/SWING_PERIOD)*Math.PI*2);

    // the plane's precession is the only thing time-speed touches — real
    // Foucault physics: a full turn in 24h at the poles, none at the equator,
    // scaled by sin(latitude) everywhere between; opposite sign each hemisphere
    const dtSim = dtReal*speedMultiplier();
    planeAngle += (Math.PI*2) * (Math.sin(lat)/DAY) * dtSim;
    updatePins(t, swingFrac);

    // the swing plane itself, faint, always visible even when the bob passes
    // near the pivot — this is what actually makes the rotation legible
    const amp=floorR*0.72;

    const bx=Math.cos(planeAngle)*amp*swingFrac, by=Math.sin(planeAngle)*amp*swingFrac;

    // Sand trace: the stylus is on the bob, so the mark is the ground the bob has
    // actually crossed since last frame — not the whole swing line. Laying the
    // full chord every frame drew sand an average 35% of the way out past wherever
    // the bob had got to, and it made the darkness depend on the frame rate rather
    // than on the pendulum: the same pixel was repainted every frame instead of
    // once per pass. Tracking the bob fixes both, and gets the real trace's
    // signature for free — the bob is barely moving at each end of its swing, so
    // several frames' worth of marks pile up in the same place and the turning
    // points come out dark, while it races through the middle and leaves the
    // faintest line there. The layer never clears itself; only the pin-ring reset
    // (or never, in ∞ mode) wipes it, so it fans slowly into a rosette.
    if(sandPrev){
      sandCtx.save();
      sandCtx.translate(cx,cy);
      sandCtx.strokeStyle='rgba(233,217,168,0.16)';
      sandCtx.lineWidth=1; sandCtx.lineCap='round';
      sandCtx.beginPath(); sandCtx.moveTo(sandPrev.x,sandPrev.y); sandCtx.lineTo(bx,by); sandCtx.stroke();
      sandCtx.restore();
    }
    sandPrev={x:bx,y:by};

    ctx.clearRect(0,0,W,H);
    ctx.drawImage(floorLayer,0,0,W,H);
    ctx.drawImage(sandLayer,0,0,W,H);

    ctx.save();
    ctx.translate(cx,cy);
    drawPins(t);
    ctx.strokeStyle='rgba(233,217,168,.22)'; ctx.lineWidth=1.2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(planeAngle)*amp, Math.sin(planeAngle)*amp);
    ctx.lineTo(-Math.cos(planeAngle)*amp, -Math.sin(planeAngle)*amp);
    ctx.stroke();

    // thread from the (implied, off the top of the frame) pivot
    ctx.strokeStyle='rgba(20,17,14,.5)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(bx,by); ctx.stroke();
    // bob shadow, then bob
    ctx.beginPath(); ctx.ellipse(bx,by+7,13,7,0,0,7);
    ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fill();
    const bobG=ctx.createRadialGradient(bx-5,by-6,1,bx,by,14);
    bobG.addColorStop(0,'#f2e6c8'); bobG.addColorStop(0.6,'#c9a95f'); bobG.addColorStop(1,'#7a5d28');
    ctx.beginPath(); ctx.arc(bx,by,12,0,7); ctx.fillStyle=bobG; ctx.fill();
    ctx.restore();

    requestAnimationFrame(tick);
  }
  resize();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
