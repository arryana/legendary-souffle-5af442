<style>

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{ height:100%; margin:0; overflow:hidden; font-family: Georgia, serif; color:var(--parchment);

  #backlink{ position:fixed; top:18px; left:22px; z-index:50; color:var(--parchment); opacity:.6; text-decoration:none; font-size:14px; letter-spacing:.04em; text-shadow:0 1px 3px rgba(0,0,0,.5); transition:opacity .3s ease; }

  canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }

  #dock{ position:fixed; bottom:0; left:0; right:0; display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:8px 14px;
    padding:10px 16px 18px; background:linear-gradient(to top, rgba(8,11,18,.55), rgba(8,11,18,0)); z-index:40; }
  .group{ display:flex; align-items:center; gap:6px; background:rgba(20,26,38,.4); border:1px solid rgba(242,233,216,.12); border-radius:12px; padding:6px 10px; -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); }
  input[type=range]{ -webkit-appearance:none; appearance:none; width:110px; height:3px; border-radius:3px; background:rgba(242,233,216,.35); outline:none; vertical-align:middle; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:13px; height:13px; border-radius:50%; background:var(--brass); cursor:pointer; box-shadow:0 0 6px rgba(0,0,0,.4); }
  input[type=range]::-moz-range-thumb{ width:13px; height:13px; border-radius:50%; background:var(--brass); border:none; cursor:pointer; }

  .lenPopup{ position:fixed; z-index:55; display:none; flex-direction:column; align-items:center; gap:4px;
    background:rgba(16,20,30,.85); border:1px solid rgba(242,233,216,.18); border-radius:12px; padding:10px 12px;
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); box-shadow:0 6px 18px rgba(0,0,0,.4); }
  .lenPopup.open{ display:flex; }
  .lenPopup input[type=range]{ width:120px; }

  /* a quiet flag, opt-in only (never requests location on its own), for swapping the
     wind slider over to somewhere's real wind speed -- same pattern as galileo's/fireflies' */
  #windGroup{ position:relative; }
  #loc-flag{ appearance:none; border:0; background:none; padding:2px 4px; margin-left:-2px;
    font-size:14px; line-height:1; cursor:pointer; opacity:.5; transition:opacity .3s ease; flex-shrink:0; }
  #loc-flag:hover, #loc-flag.open{ opacity:.9; }
  #loc-flag.live{ opacity:1; }
  #loc-popup{ position:absolute; left:50%; bottom:100%; transform:translateX(-50%); margin-bottom:12px;
    display:none; flex-direction:column; align-items:center; gap:5px; white-space:nowrap;
    background:rgba(16,20,30,.9); border:1px solid rgba(201,151,78,.3); border-radius:10px; padding:9px 11px;
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); z-index:56; }
  #loc-popup.open{ display:flex; }
  #loc-note{ display:none; font-size:11px; letter-spacing:.02em; color:#a89a80; text-align:center;
    max-width:200px; white-space:normal; }
  #loc-note.visible{ display:block; }
  #loc-retry{ appearance:none; border:0; background:none; padding:0; margin-left:2px;
    font:inherit; color:inherit; text-decoration:underline; cursor:pointer; }
  #loc-retry:hover{ color:var(--brass); }
  #loc-retry:disabled{ text-decoration:none; opacity:.6; cursor:default; }
  #loc-search{ display:flex; align-items:center; gap:6px; }
  #loc-search input{ appearance:none; border:0; border-bottom:1px solid rgba(201,151,78,.4); background:none;
    color:var(--parchment); font:13px/1.3 Georgia, serif; letter-spacing:.02em; padding:3px 2px; width:120px; outline:none; }
  #loc-search input::placeholder{ color:#7a6b52; }
  #loc-search input:focus{ border-bottom-color:var(--brass); }
  #loc-search-status{ font-size:10px; letter-spacing:.02em; color:#a89a80; text-align:center;
    min-height:1.1em; white-space:normal; max-width:200px; }

  /* material pickers -- a small swatch trigger that opens a wordless popup list, matching warmler's finish picker */
  .matTrigger{ width:40px; height:30px; border-radius:6px; border:1.5px solid rgba(201,151,78,.5); cursor:pointer; padding:0; overflow:hidden; flex-shrink:0; background-color:transparent; box-shadow:0 6px 16px rgba(0,0,0,.5); transition:transform .25s ease, border-color .25s ease; }
  .matTrigger:hover{ transform:translateY(-1px); border-color:#e8c383; }
  .matTrigger img{ width:100%; height:100%; object-fit:cover; display:block; }
  .matOverlay{ position:fixed; inset:0; z-index:100; background:rgba(5,7,12,.72); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); display:none; align-items:center; justify-content:center; padding:24px 0; }
  .matOverlay.open{ display:flex; }
  .matPopup{ width:min(80vw,200px); max-height:70vh; max-height:70dvh; background:#0d1420; border:1px solid rgba(201,151,78,.4); border-radius:14px; box-shadow:0 30px 80px rgba(0,0,0,.6); overflow:hidden; }
  .matList{ overflow-y:auto; padding:12px 12px 18px; display:flex; flex-direction:column; gap:9px; }
  .matOption{ background:transparent; border:1.5px solid rgba(201,151,78,.18); border-radius:7px; padding:0; cursor:pointer; overflow:hidden; display:block; transition:border-color .2s ease; }
  .matOption:hover{ border-color:rgba(232,195,131,.6); }

  .matOption img{ width:100%; height:44px; object-fit:cover; display:block; }

<body>
<a id="backlink" href="../index.html" aria-label="sagne"><img src="../shelfdisk.png" alt=""><i>&#8592;</i></a>
<canvas id="c"></canvas>

<div id="dock">
  <button class="matTrigger" id="rodMatTrigger" aria-label="choose rod material"><img id="rodMatTriggerImg" src="chime-swatch-rod-brass.png" alt=""></button>
  <button class="matTrigger" id="cordMatTrigger" aria-label="choose cord or chain"><img id="cordMatTriggerImg" src="chime-swatch-cord-chain.png" alt=""></button>
  <div class="group">
    <span style="font-size:13px;opacity:.75;" aria-hidden="true">#️⃣</span>
    <input type="range" id="countSlider" min="5" max="9" step="1" value="7" aria-label="number of rods">
  </div>
  <div class="group">
    <span style="font-size:13px;opacity:.75;" aria-hidden="true">🧵</span>
    <input type="range" id="cordLenSlider" min="40" max="170" step="1" value="95" aria-label="hanging length">
  </div>
  <div class="group">
    <span style="font-size:13px;opacity:.75;" aria-hidden="true">📏</span>
    <input type="range" id="rodLenSlider" min="0" max="7" step="1" value="0" aria-label="rod length">
  </div>
  <div class="group" id="windGroup">
    <span style="font-size:13px;opacity:.75;" aria-hidden="true">🌀</span>
    <input type="range" id="windSlider" min="0" max="100" step="1" value="35" aria-label="wind strength">
    <button type="button" id="loc-flag" title="use real local wind speed" aria-label="use real local wind speed" aria-expanded="false">🚩</button>
    <div id="loc-popup">
      <div id="loc-note"><span id="loc-note-text">using an approximate location — check that your browser and device allow it, then</span> <button type="button" id="loc-retry">try again</button></div>
      <form id="loc-search" autocomplete="off">
        <input type="text" id="loc-search-input" placeholder="postcode or city" aria-label="postcode or city">
      </form>
      <div id="loc-search-status"></div>
    </div>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  let W=0, H=0, DPR=1;

  const G = 900;
  const WIND_MAX = 250;
  const PITCH_K = 4200000;
  const ROD_LEN_MIN = 70, ROD_LEN_MAX = 180;

  /* ---------- the set is TUNED ----------
     Wind chimes are pleasant because they are musical, and they are musical
     because somebody cut each tube to a length that gives a wanted note. That is
     the whole craft: a maker picks a scale — nearly always a pentatonic, because
     then no two tubes that happen to strike together can sound wrong — and cuts
     to it. Evenly spaced tubes with whatever pitches fall out is the thing that
     is NOT real.
     This set was evenly spaced. Measured, the default seven landed on C3 -16
     cents, E3 -44, G#3 -27, C4 +47, F#4 -4, C5 +49 and A5 -46 — not one on a
     note, two of them within a cent of a quarter-tone, which is the most
     dissonant place a pitch can sit, and the gaps between neighbours widening
     from 3.7 semitones to 8.1. Accurate and not beautiful, which is exactly what
     she said.
     The physics is untouched: pitch still goes as 1/L^2 and the lengths on screen
     are still the lengths that make those pitches. What changed is that the
     lengths are now CHOSEN, the way a maker chooses them. */
  const PENTATONIC = [0,2,4,7,9];      // major pentatonic, in semitones
  const BASE_MIDI = 48;                // C3, the longest tube of an untransposed set
  function scaleMidi(step){
    const n=PENTATONIC.length;
    const oct=Math.floor(step/n), deg=((step%n)+n)%n;
    return BASE_MIDI + PENTATONIC[deg] + 12*oct;
  }
  const midiToHz = m => 440*Math.pow(2,(m-69)/12);
  /* The cut a maker would make -- and it depends on the MATERIAL, which is the
     other half of this. A tube's pitch is set by its length and by what it is
     made of, so a glass tube tuned to a given note is a different length from a
     brass one. Cutting every material to the same lengths left only brass on real
     notes: measured, wood came out 30 cents sharp, silver 30 flat and glass 48
     sharp -- a hair off a quarter-tone, in tune with itself but not with the
     world. Each material gets its own cuts now.
     They cannot all reach the same bottom note, and that is honest too: within a
     length a chime is allowed to be, glass and wood simply cannot go as low as
     brass, so each set starts at the lowest note its own material can carry. Big
     brass sets are deep and glass ones are tinkly for exactly this reason. */
  const matPitch = () => (MATERIAL[state.rodMaterial] || MATERIAL.brass).pitch;
  function lengthForNote(midi, p){ return Math.sqrt(PITCH_K*p/midiToHz(midi)); }
  function baseStepFor(p){
    for(let step=0; step<60; step++){
      if(lengthForNote(scaleMidi(step), p) <= ROD_LEN_MAX) return step;
    }
    return 0;
  }
  function lengthForStep(step){
    const p=matPitch();
    const L=lengthForNote(scaleMidi(baseStepFor(p)+step), p);
    return Math.max(ROD_LEN_MIN, Math.min(ROD_LEN_MAX, L));
  }
  // and the nearest cut to a length asked for by hand, so a rod set on the
  // popup is still a note rather than a quarter-tone between two
  function snapToScale(len){
    let best=null, bestD=Infinity;
    for(let step=-4; step<=24; step++){
      const L=lengthForStep(step), d=Math.abs(L-len);
      if(d<bestD){ bestD=d; best=L; }
    }
    return best===null? len : best;
  }
  const ROD_THICK = 12;
  const COLLIDE_DIST = ROD_THICK + 2;   // centres this close and the rods are touching
  const SEPARATE = 3;                   // and this much further apart before they can meet again
  const RESTITUTION = 0.45;             // rods are not bouncy; most of the closing speed is lost
  const MIN_STRIKE_SPEED = 5;           // below this they are nudging each other, not striking
  // which PAIRS are currently in contact, so a rod resting against one neighbour
  // can still ring against another. A per-rod flag could not say who was touching
  // whom, and with every pair now tested it would have muted real strikes.
  const touching = new Set();
  const CORD_THICK = { rope:7, chain:5, string:3 };
  const HANGER_W = 172;

  // ---- assets ----
  // The RODS are drawn (see drawRod), and have to be: a rod's length is its note,
  // so the lengths are continuous and each material is cut to its own, and no set
  // of photographed rods can stand in for that. Her parts sheets give four fixed
  // lengths per material at 17-25px across, where a walnut rod wants 34 on a
  // Retina screen -- so a photograph would have to be stretched to length AND
  // upscaled. Everything else on this page is her photograph.
  //
  // The HANGER is her own photograph, cut off its navy: chime-hanger.png is the
  // brass ring, the two chains and the walnut bar in one piece, and the eight
  // eyelets that were screwed along the bar's underside have been cut away from
  // it into chime-eyelet.png. That separation is the whole point of doing it this
  // way -- the picture has eight eyelets and the piece hangs five to nine rods, so
  // a baked-in row could only ever be right at one count. One eyelet is placed per
  // rod, at the tie point the rod actually hangs from, and it is right at all five.
  //
  // Every figure in HG was measured out of that photograph and is held in
  // fractions of the WOODEN BAR'S OWN WIDTH (806px in the original), so the
  // layout follows the picture. Re-cut the picture and these change with it;
  // don't retype them by eye.
  const HG = {
    aspect : 0.706098,   // the cut-out's height, in its own widths
    cropW  : 1.017370,   // the cut-out's width, in bar widths
    barCx  : 0.499390,   // the bar's centre, across the cut-out
    ringCy : 0.095855,   // the hanging ring's centre, down the cut-out
    eyeDrop: 0.677419,   // ring centre down to eyelet centre, in bar widths
    eyeW   : 0.054591,   // one eyelet, in bar widths
    eyeH   : 0.050868,
    eyeCx  : 0.4773,     // and the eyelet's own hole, inside its cut-out
    eyeCy  : 0.5,
    chainW : 0.043424,   // the chain it hangs BY: one tile's width, in bar widths
    chainP : 0.043797,   // and its repeat
    chainCx: 0.003102,   // the chain hangs a hair right of the bar's centre
    chainFt: 0.042,      // how far above the ring's centre the chain stops -- inside
  };                     // the top brass, above the hole, so it reads as hooked on
  function loadImg(src){ const i=new Image(); i.src=src; return i; }
  const hangerImg = loadImg('chime-hanger.png');
  const eyeletImg = loadImg('chime-eyelet.png');
  // and the chain it hangs by, cut from the run above the ring in the same
  // photograph -- so it is literally the same chain -- to one repeat that tiles.
  const chainImg  = loadImg('chime-chain.png');

  // The cords are her photographs too, off her parts sheet: one straight run of
  // each, stood upright and cut to a whole number of its own repeats so it tiles
  // down a cord of any length. The cord slider runs 40 to 170 and the tiles are
  // 18 to 41px, so every cord is several repeats and the join has to be invisible
  // or it draws a ladder of rungs down the piece. Three things get it there: the
  // repeat is found to a hundredth of a pixel by correlation, the sheet's own
  // lighting fall-off along the run is divided out, and the ends are cross-faded.
  // Measured on the rendered page at the longest cord, the brightness step across
  // each join is 1.2 to 5.7 where the rope's own twist gives 7.9 at its 95th
  // percentile -- that is, the joins are quieter than the rope, so there is
  // nothing there to see. tw/th are the tile's own pixels and everything drawn is
  // derived from them, so re-cutting a tile means changing two numbers here.
  const CORD_ART = {
    rope:   { src:'chime-cord-rope.png',   tw:17, th:70  },
    chain:  { src:'chime-cord-chain.png',  tw:13, th:107 },
    string: { src:'chime-cord-string.png', tw:10, th:59  },
  };
  for(const k in CORD_ART){
    const A = CORD_ART[k];
    A.img = loadImg(A.src);
    A.w = CORD_THICK[k];
    A.period = A.th * A.w / A.tw;   // the whole tile, kept in its own proportion
  }

  // ---- state ----
  const state = {
    rodMaterial: 'brass',
    cordMaterial: 'chain',
    count: 7,
    wind: 0.35,
    cordLength: 95, // shared by every rod, so the tops all hang level
    tune: 0,        // where the set sits on the scale: 0 is the lowest cut
    rods: [],
  };

  // left = long/low, right = short/high, like a real set -- but stepping UP THE
  // SCALE rather than evenly down the ruler. state.tune shifts the whole set
  // along the same scale, so it transposes instead of going out of tune.
  function defaultRodLength(i, n){
    return lengthForStep(state.tune + i);
  }

  function rebuildRods(preserve){
    const old = state.rods;
    const rods = [];
    for(let i=0;i<state.count;i++){
      const prev = preserve && old[i];
      rods.push({
        rodLength: prev ? prev.rodLength : defaultRodLength(i, state.count),
        angle: (Math.random()-0.5)*0.2,
        angVel: 0,
        touching: false,
        // a wind signature of its own: three eddy frequencies and phases, so the
        // same breeze pushes each rod differently and neighbours drift apart
        w1: 0.7+Math.random()*0.9,  p1: Math.random()*6.28,
        w2: 1.7+Math.random()*1.6,  p2: Math.random()*6.28,
        w3: 3.1+Math.random()*2.4,  p3: Math.random()*6.28,
        gustResp: 0.75+Math.random()*0.5,   // how much this rod catches the air
        // and its own place in the plank: where along the wood texture this rod
        // was cut from. Without it every rod shows the same figure at the same
        // height, which is the one thing that gives a tiled texture away.
        texPhase: prev ? prev.texPhase : Math.random(),
      });
    }
    state.rods = rods;
    closePopup();
  }

  // ---- layout ----
  let hangerX=0, hangerTopY=60, hangerW=0, hangerH=0, pivotY=0, ringSpan=0, ringY=0;
  function layout(){
    hangerX = W/2;
    hangerW = HANGER_W*HG.cropW;          // the photograph, scaled so its bar is HANGER_W
    hangerH = hangerW*HG.aspect;
    ringY   = hangerTopY + hangerH*HG.ringCy;
    pivotY  = ringY + HANGER_W*HG.eyeDrop;   // the eyelets' own centre line
    ringSpan = HANGER_W*0.85;
  }
  // where a rod's cord is tied to the bar, with the bar hanging straight
  function pivotX(i, n){
    if(n<=1) return hangerX;
    return hangerX + (i - (n-1)/2) * (ringSpan/(n-1));
  }

  // The whole thing hangs off one brass ring, so it is a pendulum in its own
  // right -- a heavy, slow one whose weight is mostly the rods hanging well
  // below the bar. What drives it is drag, and drag goes as the SQUARE of the
  // wind: in a light air the lean is a fraction of a pixel and you would swear
  // the bar were nailed up, and it is only in a real blow that it visibly leans
  // and drifts. There is no threshold anywhere here -- the v-squared law is the
  // whole of it.
  let hangAng = 0, hangVel = 0, hangAcc = 0;
  const HANG_CATCH = 0.18;   // sail area per unit mass -- a fraction of a bare rod's
  const HANG_DAMP  = 0.55;

  // where that cord is tied once the bar has leaned: the bar is rigid, so the tie
  // point turns about the ring with it
  function suspend(i, n){
    const u = pivotX(i,n) - hangerX, d = pivotY - ringY;
    const c = Math.cos(hangAng), sn = Math.sin(hangAng);
    return { x: hangerX + u*c + d*sn, y: ringY + d*c - u*sn };
  }
  // and how hard that tie point is being thrown sideways -- a swaying bar is a
  // moving support, and a moving support swings the rods hanging off it
  function suspendAccX(i, n){
    const u = pivotX(i,n) - hangerX, d = pivotY - ringY;
    const c = Math.cos(hangAng), sn = Math.sin(hangAng);
    return (-u*sn + d*c)*hangAcc + (-u*c - d*sn)*hangVel*hangVel;
  }

  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W*DPR; canvas.height = H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    layout();
  }
  window.addEventListener('resize', resize);

  // ---- audio ----
  let audioCtx = null, masterBus = null, voices = 0;
  // A backstop against a runaway, nothing more. Brass rings for 3.4s, so even the
  // busiest honest weather — nine rods in a full wind, 11.6 note-starts a second
  // — leaves about 40 tails overlapping, and that measures 0.22 peak: nowhere
  // near needing a limit. Set this anywhere near the real overlap and it starts
  // swallowing notes instead, which is worse than loud: a rod visibly strikes its
  // neighbour and nothing comes out. At 14 it was dropping two thirds of them.
  const MAX_VOICES = 48;

  function ensureAudio(){
    if(audioCtx) return;
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    // A safety net for a rare pile-up, not a permanent squasher. This used to be
    // a compressor at -18dB (0.126) fed a signal measuring 0.215 rms, so it was
    // in gain reduction essentially all the time, holding every tail flat — that
    // is the deadening. Trimmed first and set at -6dB it now sits over a 0.042
    // rms signal and only moves when something genuinely stacks up.
    masterBus = audioCtx.createGain();
    masterBus.gain.value = 0.5;
    const comp = audioCtx.createDynamicsCompressor();
    comp.threshold.value = -6; comp.ratio.value = 4; comp.knee.value = 10;
    comp.attack.value = 0.006; comp.release.value = 0.35;
    masterBus.connect(comp); comp.connect(audioCtx.destination);
  }

  // A struck rod is a free-free bar, and a free-free bar's overtones are not a
  // harmonic series: they land at 2.756x and 5.404x the fundamental, from the
  // roots of the bar equation. That inharmonic spacing is the whole reason a
  // chime reads as metal being hit rather than as a note being played, and it is
  // the same whatever the bar is made of — material sets the fundamental, the
  // brightness and the length of the ring, not where the overtones sit. Only the
  // glass voice had this right; silver used an invented 3.0 and brass a bandpass
  // at 2.1, which is why they sounded like something other than a chime.
  // a free-free bar's own bending modes. The fourth and fifth are most of what
  // reads as 'clang' in a struck metal tube, and there were only three.
  const PARTIALS = [1, 2.756, 5.404, 8.933, 13.34];

  // Pitch follows the material's own speed of sound, sqrt(E/rho), so the same rod
  // cut from different stock rings at a different note. Against brass (E 100GPa,
  // rho 8500 -> 3430 m/s): silver 2690, wood 4140, glass 5290 m/s. Silver to
  // glass is very nearly a fifth. Before this, choosing a material changed the
  // timbre but not one note of the pitch, which is the piece quietly lying about
  // what picking a material means.
  /* ---------- telling one substance from another ----------
     Her report: they're not quite immediately recognisable as the sound of the
     substance they're made of. Two reasons, and neither was the pitch.
     FIRST, a material is recognised in the first few HUNDREDTHS of a second --
     the contact noise of the strike itself, before any note has established.
     Metal on metal is a bright short click, glass a very sharp high tick, wood a
     dull low knock. Only wood had one of these at all; the metals and the glass
     started with no transient whatsoever, which is the sound of a synthesiser and
     not of an object being hit.
     SECOND, brass and silver differed only in pitch and ring length, which makes
     them the same instrument at two heights rather than two substances. What
     actually separates metals is how fast the HIGH modes die relative to the
     fundamental (`damp` below) and how many of them there are to begin with -- a
     purer metal rings longer and cleaner, an alloy is warmer and busier -- plus
     the slow warble a real tube gives, its two bending modes being very slightly
     split so they beat against each other.
     The mode ratios are the free-free bar's own, 1 : 2.756 : 5.404 : 8.933 :
     13.34; there were three of them and the fourth and fifth are most of what
     reads as 'clang' in metal. Everything below is either one of those numbers or
     a decay rate, so the differences are the materials' and not a preset's. */
  const MATERIAL = {
    // an alloy: warm, busy, long, with an audible beat
    brass:  { pitch: 1.00, ring: 4.2,  level: 1.00, attack: 0.004, damp: 0.50, beat: 0.7,
              amps: [1, 0.40, 0.16, 0.06, 0.02],
              hit: { hz: 2600, q: 0.9, level: 0.10, dur: 0.018 } },
    // a purer metal: brighter, cleaner, the longest ring of the four
    silver: { pitch: 0.78, ring: 5.0,  level: 0.95, attack: 0.004, damp: 0.45, beat: 0.35,
              amps: [1, 0.26, 0.08, 0.02, 0.006],
              hit: { hz: 4200, q: 0.8, level: 0.07, dur: 0.010 } },
    // glass rings well -- it was cut off at 1.5s, shorter than either metal, which
    // is the one thing a wine glass tells you is wrong. Bright, with the sparkle
    // dying faster than the note under it: the ting, then the hum.
    glass:  { pitch: 1.54, ring: 3.0,  level: 0.85, attack: 0.001, damp: 0.78, beat: 0,
              amps: [1, 0.55, 0.30, 0.14, 0.05],
              hit: { hz: 7200, q: 1.3, level: 0.13, dur: 0.006 } },
    // wood is mostly the sound of the hit: the high modes are gone before you
    // hear them and there is almost nothing left to ring
    wood:   { pitch: 1.21, ring: 0.30, level: 0.80, attack: 0.001, damp: 1.40, beat: 0,
              amps: [1, 0.16, 0.04, 0, 0],
              hit: { hz: 340,  q: 0.7, level: 0.50, dur: 0.055 } },
  };

  function strike(freq, velocity, material){
    window.__strikes=(window.__strikes||0)+1;
    if(!audioCtx || voices >= MAX_VOICES) return;
    const M = MATERIAL[material] || MATERIAL.brass;
    // a few ms ahead, so nothing is ever scheduled into a moment already gone
    const t = audioCtx.currentTime + 0.005;
    const vol = Math.min(0.42, 0.05 + velocity/900) * M.level;
    const out = audioCtx.createGain();
    out.gain.value = vol;
    out.connect(masterBus);
    voices++;
    let last = 0;

    M.amps.forEach((amp, i) => {
      if(amp < 0.02) return;
      const o = audioCtx.createOscillator();
      o.type = 'sine';
      o.frequency.value = freq * PARTIALS[i];
      const g = audioCtx.createGain();
      // Higher modes shed energy faster, which is why a struck bar settles onto
      // its fundamental as it dies away instead of just getting quieter. HOW
      // much faster is the material: wood loses them before you hear them, a
      // pure metal holds on to them. That exponent is most of what separates one
      // substance from another once the strike itself has passed.
      const ring = M.ring / Math.pow(PARTIALS[i], M.damp);
      // Every voice used to open with setValueAtTime(1) — gain from nothing to
      // full inside one sample. Measured, that mattered less than it looks: the
      // partials all start at zero crossings, so only wood's noise burst really
      // stepped in (1.6x its own running slope, against 1.0x for the metals).
      // A couple of ms of attack costs nothing and removes it either way, and a
      // struck bar does take a moment to load up rather than arriving instantly.
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(amp, t + M.attack);
      g.gain.exponentialRampToValueAtTime(0.0001, t + M.attack + ring);
      o.connect(g); g.connect(out);
      o.start(t); o.stop(t + M.attack + ring + 0.02);
      last = Math.max(last, M.attack + ring + 0.02);

      // A real tube is never perfectly round, so its two bending modes in the two
      // perpendicular planes sit a whisker apart and beat against each other --
      // the slow shimmer you hear in a metal chime and never in a wooden one. Only
      // on the fundamental, where it is audible; higher up it is lost in the decay.
      if(M.beat && i === 0){
        const o2 = audioCtx.createOscillator();
        o2.type = 'sine';
        o2.frequency.value = freq * PARTIALS[i] + M.beat;
        const g2 = audioCtx.createGain();
        g2.gain.setValueAtTime(0, t);
        g2.gain.linearRampToValueAtTime(amp * 0.55, t + M.attack);
        g2.gain.exponentialRampToValueAtTime(0.0001, t + M.attack + ring);
        o2.connect(g2); g2.connect(out);
        o2.start(t); o2.stop(t + M.attack + ring + 0.02);
      }
    });

    /* The strike itself. This is the part a listener names the substance from,
       and it happens before any note has established: metal on metal is a bright
       short click, glass a very sharp high tick, wood a dull low knock. Only wood
       had one; the metals and the glass began with no contact noise at all, which
       is what a synthesiser sounds like rather than an object being hit.
       Its pitch is the MATERIAL's, not the rod's -- two brass tubes of different
       lengths make the same click where they touch -- so this is a fixed
       frequency and not a multiple of the note. */
    if(M.hit && M.hit.level > 0){
      const H = M.hit;
      const len = Math.max(1, Math.round(audioCtx.sampleRate * (H.dur * 3.2)));
      const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      const data = buf.getChannelData(0);
      for(let i=0;i<len;i++) data[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2);
      const noise = audioCtx.createBufferSource(); noise.buffer = buf;
      const filt = audioCtx.createBiquadFilter();
      filt.type = H.hz > 1500 ? 'bandpass' : 'lowpass';
      filt.frequency.value = H.hz; filt.Q.value = H.q;
      const gn = audioCtx.createGain();
      gn.gain.setValueAtTime(0, t);
      gn.gain.linearRampToValueAtTime(H.level, t + 0.0008);
      gn.gain.exponentialRampToValueAtTime(0.0001, t + H.dur * 3);
      noise.connect(filt); filt.connect(gn); gn.connect(out);
      noise.start(t);
      last = Math.max(last, H.dur * 3.2);
    }

    setTimeout(()=>{ out.disconnect(); voices--; }, (last + 0.15)*1000);
  }
  function pitchFor(rodLength, material){
    const M = MATERIAL[material] || MATERIAL.brass;
    return PITCH_K/(rodLength*rodLength) * M.pitch;
  }

  // ---- physics + draw ----
  let lastT = null, elapsed = 0;
  function bobX(r, i, n){
    const eff = state.cordLength + r.rodLength*0.5;
    return suspend(i,n).x + Math.sin(r.angle)*eff;
  }

  /* Where two rods actually meet, if they meet at all.
     A rod is a BODY, not a point. The contact test used to compare the two rods'
     CENTRES and treat each as a single point, and that cannot see the thing she
     photographed: when rods differ in length their centres hang at quite
     different depths, so two of them can be lying right across each other while
     their centre points are nowhere near. Measured on an arrangement of long and
     short rods, some pair was passing clean through another on 96.7% of frames,
     six pairs at once at worst, and the longest tangle ran 14.7 SECONDS -- it
     never resolved, because nothing in the old test could see it to resolve. On
     the default set of rods, which are all much of a length, it never happened
     once, which is why it survived this long.
     Two rods hanging in a row can only touch where they are at the same DEPTH.
     Each is a straight line from its own tie point, so the sideways gap between
     them across their shared depth band is linear in depth and its smallest
     value is at one end of that band or the other -- so two evaluations find the
     contact exactly, no marching along the rod.
     The gap is SIGNED, and that is the other half of the fault. Rod i is tied to
     the bar to the left of rod j and cannot get past it; comparing magnitudes let
     a crossed pair read as a comfortably separated one, so nothing ever pushed
     them back -- "and appears to stay tangled". */
  function contactBetween(i, j, n){
    const a = state.rods[i], b = state.rods[j];
    const spA = suspend(i,n), spB = suspend(j,n);
    const ca = Math.cos(a.angle), cb = Math.cos(b.angle);
    if(ca <= 0.05 || cb <= 0.05) return null;          // swung to horizontal: no depth to compare
    const aTop = spA.y + ca*state.cordLength, aBot = spA.y + ca*(state.cordLength + a.rodLength);
    const bTop = spB.y + cb*state.cordLength, bBot = spB.y + cb*(state.cordLength + b.rodLength);
    const yTop = Math.max(aTop, bTop), yBot = Math.min(aBot, bBot);
    if(yBot <= yTop) return null;                      // they are never at the same depth
    const tA = Math.tan(a.angle), tB = Math.tan(b.angle);
    let sep = Infinity, at = yTop;
    for(let k=0;k<2;k++){
      const y = k ? yBot : yTop;
      const s = (spB.x + tB*(y-spB.y)) - (spA.x + tA*(y-spA.y));
      if(s < sep){ sep = s; at = y; }
    }
    // the lever arms are the distance down each rod to the point they touch at,
    // not to their centres -- a knock near the tip turns a rod far more than the
    // same knock at its throat
    return { sep, dA: Math.max(1,(at-spA.y)/ca), dB: Math.max(1,(at-spB.y)/cb) };
  }

  function tick(now){
    if(lastT===null) lastT = now;
    const dt = Math.min((now-lastT)/1000, 1/45); lastT = now;
    elapsed += dt;
    const n = state.rods.length;
    const windAmp = state.wind * WIND_MAX;

    // A shared breeze that swells and drops, plus turbulence unique to each rod.
    // The old wind was a single global gust that every rod obeyed together, so they
    // swung as one sheet and rarely met; giving each its own eddies is what makes
    // neighbours drift, cross, and knock into each other the way a real set does.
    const breeze = Math.sin(elapsed*0.42)*0.55 + Math.sin(elapsed*0.97+1.3)*0.45;
    for(let i=0;i<n;i++){
      const r = state.rods[i];
      const turb = Math.sin(elapsed*r.w1+r.p1)*0.5 + Math.sin(elapsed*r.w2+r.p2)*0.32
                 + Math.sin(elapsed*r.w3+r.p3)*0.18;
      r.gust = windAmp * r.gustResp * (0.45*breeze + 0.75*turb);
    }

    // Sub-step the swing and the contacts together. A rod in a full wind can cross
    // the fourteen-pixel contact band in a single frame and, tested once a frame,
    // sail straight through its neighbour without ever registering; four sub-steps
    // shrink that skip below the band so the strike is always caught.
    // the bar's weight is mostly where the rods are: well below it
    let meanRod = 0;
    for(let i=0;i<n;i++) meanRod += state.rods[i].rodLength;
    meanRod = n ? meanRod/n : 0;
    const hangEff = (pivotY - ringY) + 0.6*(state.cordLength + meanRod*0.5);
    // the same swelling air the rods feel, but squared, and against far more weight
    const hangGust = WIND_MAX * state.wind * state.wind * HANG_CATCH * breeze;

    const STEPS = 4, h = dt/STEPS;
    for(let s2=0;s2<STEPS;s2++){
      hangAcc = -(G/hangEff)*Math.sin(hangAng) - HANG_DAMP*hangVel + (hangGust/hangEff)*Math.cos(hangAng);
      hangVel += hangAcc*h;
      hangAng += hangVel*h;

      for(let i=0;i<n;i++){
        const r = state.rods[i];
        const eff = state.cordLength + r.rodLength*0.5;
        const damping = 0.40 + r.rodLength*0.0004;   // longer rods lose a touch more
        const aS = suspendAccX(i,n);
        const angAcc = -(G/eff)*Math.sin(r.angle) - damping*r.angVel
                     + (r.gust/eff)*Math.cos(r.angle) - (aS/eff)*Math.cos(r.angle);
        r.angVel += angAcc*h;
        r.angle  += r.angVel*h;
      }
      // Contacts, resolved this sub-step. EVERY pair, not just neighbours: a long
      // rod reaches past a short one entirely, so two rods with a stubby one
      // between them can meet at a depth their neighbour never gets down to, and
      // an adjacent-only loop has no constraint linking them at all.
      for(let i=0;i<n-1;i++) for(let j=i+1;j<n;j++){
        const a = state.rods[i], b = state.rods[j];
        const key = i*64 + j;
        const ct = contactBetween(i,j,n);
        if(!ct){ touching.delete(key); continue; }
        if(ct.sep >= COLLIDE_DIST + SEPARATE){ touching.delete(key); continue; }
        if(ct.sep >= COLLIDE_DIST){ continue; }

        // separate them so the two solid rods never occupy the same space. sep can
        // be NEGATIVE here -- that is a pair already crossed -- and the push is
        // capped so recovering from one is a shove rather than a teleport.
        const overlap = Math.min(COLLIDE_DIST - ct.sep, COLLIDE_DIST*1.5);
        a.angle -= overlap*0.5/ct.dA;
        b.angle += overlap*0.5/ct.dB;

        const closing = a.angVel*ct.dA - b.angVel*ct.dB;   // >0 = coming together
        if(closing <= 0){ continue; }

        const imp = (1 + RESTITUTION) * closing / (1/a.rodLength + 1/b.rodLength);
        a.angVel -= (imp/a.rodLength) / ct.dA;
        b.angVel += (imp/b.rodLength) / ct.dB;

        if(!touching.has(key) && closing > MIN_STRIKE_SPEED){
          ensureAudio();
          strike(pitchFor(a.rodLength, state.rodMaterial), closing, state.rodMaterial);
          strike(pitchFor(b.rodLength, state.rodMaterial), closing, state.rodMaterial);
        }
        touching.add(key);
      }
    }

    draw();
    if(popupOpenIdx>=0) positionPopupOnRod();
    requestAnimationFrame(tick);
  }

  function drawRodsAndCords(rodMat, cordMat, cordThick, n){
    for(let i=0;i<n;i++){
      const r = state.rods[i];
      const sp = suspend(i,n);
      ctx.save();
      ctx.translate(sp.x, sp.y);
      // NOTE the minus. Canvas turns the opposite way to the convention the swing
      // is solved in (x = tie point + sin(angle)*length). Drawn with +angle, every
      // rod hung on the mirror image of its own swing, so the contact test was
      // watching a different scene from the one on the glass: rods passed clean
      // through each other in silence, and chimed with a plain gap between them.
      ctx.rotate(-r.angle);
      drawCord(state.cordLength, cordMat);
      drawRod(state.cordLength, r.rodLength, rodMat, r.texPhase);
      ctx.restore();
    }
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    const n = state.rods.length;
    drawRodsAndCords(state.rodMaterial, state.cordMaterial, CORD_THICK[state.cordMaterial], n);
    drawHanger(n);   // over the cord tops, so the cords disappear into the bar
  }

  // ---- the parts, drawn ------------------------------------------------------
  // Every piece here is drawn rather than a stretched photo. The sprites carried a
  // soft light halo baked into them and went blurry when scaled; drawing the wood,
  // the cord and the metal keeps every edge crisp and every material under control.

  // Each material has its own shape, not only its own colour: the aged brass a
  // mottled cylinder, the silver a plain one, the wood a flat wide slat with
  // rounded edges and a big drilled hole, the glass a thin, long, triangular rod.
  const ROD_MATS = {
    brass:  { edge:'#4a3413', body:'#a37f34', spec:'#f4e1a2', lip:'#6a4e1e', alpha:1,
              shape:'round', width:12, mottle:true },
    silver: { edge:'#565c61', body:'#a7afb5', spec:'#ffffff', lip:'#6a7075', alpha:1,
              shape:'round', width:12 },
    wood:   { edge:'#3a2410', body:'#8a5a2c', spec:'#c79a5c', lip:'#4a2f16', alpha:1,
              shape:'flat',  width:17, grain:true, hole:3.0, tex:'chime-rod-wood.png' },
    glass:  { edge:'#4f9f96', body:'#cdeee7', spec:'#ffffff', lip:'#8fc9c0', alpha:0.58,
              shape:'prism', width:8,  lenMul:1.16 },
  };
  // Wood is the one rod that could not be DRAWN convincingly -- her report, and she
  // is right: brass and silver are smooth cylinders, which shading does well, but
  // wood IS texture, and a gradient with four grain strokes over it reads as orange
  // plastic. It is her own walnut now, taken off the hanger bar in the same
  // photograph. The bar is a flat slat with the grain running along it, lit from one
  // edge -- exactly what a wooden chime rod is, turned ninety degrees. Turned that
  // way its 126px cross-section becomes the rod's width, against the 34 a Retina
  // screen wants, where the rods on her parts sheets are 17-25px and would have had
  // to be blown up. Three things had to be done to it, and each is visible if it is
  // skipped: the bar's lighting along its own length is divided out, or it bands
  // across every rod; the evenest 420px of the bar is used rather than all of it,
  // measured -- 0.92% residual wobble against 2.22% for the whole; and the tile is
  // BOOK-MATCHED, [stretch | the same stretch reversed], which makes the mirror join
  // and the wrap EXACTLY zero with no cross-fade and doubles the repeat to 113px, so
  // the longest rod never shows a whole one. Matched wood really is cut that way, so
  // the symmetry is honest as well as convenient.
  for(const k in ROD_MATS){ if(ROD_MATS[k].tex) ROD_MATS[k].tex = loadImg(ROD_MATS[k].tex); }

  function drawRod(topY, len0, matKey, texPhase){
    const M = ROD_MATS[matKey];
    const W = M.width, half = W/2, len = len0*(M.lenMul||1);
    const y0 = topY, y1 = topY+len;
    ctx.save();
    ctx.globalAlpha = M.alpha;

    if(M.shape === 'prism'){
      // GLASS -- a thin triangular rod that comes to points top and bottom, with a
      // bright edge running down its spine where the two faces meet
      ctx.beginPath();
      ctx.moveTo(0, y0);                 // top point
      ctx.lineTo(half, y0+W);
      ctx.lineTo(half, y1-W);
      ctx.lineTo(0, y1);                 // bottom point
      ctx.lineTo(-half, y1-W);
      ctx.lineTo(-half, y0+W);
      ctx.closePath(); ctx.save(); ctx.clip();
      const gx = ctx.createLinearGradient(-half,0,half,0);
      gx.addColorStop(0.0, M.edge); gx.addColorStop(0.42, M.body);
      gx.addColorStop(0.5, M.spec); gx.addColorStop(0.58, M.body); gx.addColorStop(1.0, M.edge);
      ctx.fillStyle = gx; ctx.fillRect(-half-1, y0-1, W+2, len+2);
      ctx.restore();
      // the lit spine
      ctx.globalAlpha = M.alpha*0.9;
      ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, y0+2); ctx.lineTo(0, y1-2); ctx.stroke();
      ctx.restore();
      // a small hanging hole near the top point
      ctx.save(); ctx.globalAlpha = M.alpha; ctx.fillStyle='rgba(20,40,38,0.6)';
      ctx.beginPath(); ctx.ellipse(0, y0+W*0.7, 1.3, 1.0, 0, 0, Math.PI*2); ctx.fill();
      ctx.restore();
      return;
    }

    const r = (M.shape === 'flat') ? Math.min(half*0.55, 5) : half;   // corner round
    // the body outline: a rounded slat (flat) or a capsule (round)
    ctx.beginPath();
    ctx.moveTo(-half, y0+r); ctx.quadraticCurveTo(-half, y0, -half+r, y0);
    ctx.lineTo(half-r, y0); ctx.quadraticCurveTo(half, y0, half, y0+r);
    ctx.lineTo(half, y1-r); ctx.quadraticCurveTo(half, y1, half-r, y1);
    ctx.lineTo(-half+r, y1); ctx.quadraticCurveTo(-half, y1, -half, y1-r);
    ctx.closePath(); ctx.save(); ctx.clip();
    const gx = ctx.createLinearGradient(-half,0,half,0);
    if(M.shape === 'flat'){
      // wood reads flatter and more matte, with a rounded lip catching light at each edge
      gx.addColorStop(0.0, M.edge); gx.addColorStop(0.10, M.spec);
      gx.addColorStop(0.5, M.body); gx.addColorStop(0.90, M.spec); gx.addColorStop(1.0, M.edge);
    } else {
      gx.addColorStop(0.0, M.edge); gx.addColorStop(0.28, M.spec);
      gx.addColorStop(0.5, M.body); gx.addColorStop(1.0, M.edge);
    }
    const textured = M.tex && M.tex.complete && M.tex.naturalWidth;
    if(textured){
      const th = W * M.tex.naturalHeight / M.tex.naturalWidth;   // the tile, in its own proportion
      for(let y=y0-th*(texPhase||0); y<y1; y+=th) ctx.drawImage(M.tex, -half, y, W, th);
    }else{
      ctx.fillStyle = gx; ctx.fillRect(-half-1, y0-1, W+2, len+2);
    }
    // length shade
    const gy = ctx.createLinearGradient(0,y0,0,y1);
    gy.addColorStop(0,'rgba(255,255,255,0.10)'); gy.addColorStop(0.15,'rgba(255,255,255,0)');
    gy.addColorStop(0.9,'rgba(0,0,0,0)'); gy.addColorStop(1,'rgba(0,0,0,0.28)');
    ctx.fillStyle = gy; ctx.fillRect(-half-1, y0-1, W+2, len+2);
    if(M.grain && !textured){
      ctx.strokeStyle = 'rgba(50,30,12,0.42)'; ctx.lineWidth = 0.8;
      for(let k=0;k<4;k++){ const gxp = -half+W*(0.22+k*0.19);
        ctx.beginPath(); ctx.moveTo(gxp, y0+2);
        ctx.bezierCurveTo(gxp+1.5, y0+len*0.4, gxp-1.5, y0+len*0.7, gxp+(k-1.5), y1-2);
        ctx.stroke(); }
    }
    if(M.mottle){
      // aged brass: soft darker and lighter patches, placed by a fixed pattern so
      // they sit still rather than shimmer frame to frame
      for(let k=0;k<7;k++){
        const yy = y0 + len*((k*0.618)%1);
        const xx = Math.sin(k*2.3)*half*0.5;
        const rr = 2 + (k%3);
        ctx.fillStyle = (k%2) ? 'rgba(60,42,16,0.30)' : 'rgba(245,225,170,0.18)';
        ctx.beginPath(); ctx.ellipse(xx, yy, rr, rr*1.4, 0, 0, Math.PI*2); ctx.fill();
      }
    }
    ctx.restore();

    // top lip + cord hole (a bigger, clearly drilled hole for wood)
    ctx.save(); ctx.globalAlpha = M.alpha;
    ctx.strokeStyle = M.lip; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(0, y0+r, Math.max(1,r-0.5), Math.PI*1.05, Math.PI*1.95); ctx.stroke();
    const hr = M.hole || 1.6;
    ctx.fillStyle = 'rgba(18,12,5,0.72)';
    ctx.beginPath(); ctx.ellipse(0, y0 + hr + 2, hr, hr*0.8, 0, 0, Math.PI*2); ctx.fill();
    if(M.hole){ // a lit rim on the big drilled hole
      ctx.strokeStyle='rgba(210,170,110,0.5)'; ctx.lineWidth=0.8;
      ctx.beginPath(); ctx.ellipse(0, y0+hr+2, hr, hr*0.8, 0, Math.PI*0.9, Math.PI*2.1); ctx.stroke();
    }
    ctx.restore();   // the lip/hole layer
    ctx.restore();   // the outer save opened at the top of drawRod
  }

  function drawCord(len, matKey){
    const A = CORD_ART[matKey];
    if(A && A.img.complete && A.img.naturalWidth){
      ctx.save();
      ctx.beginPath(); ctx.rect(-A.w/2, 0, A.w, len); ctx.clip();
      for(let y=0; y<len; y+=A.period) ctx.drawImage(A.img, -A.w/2, y, A.w, A.period);
      ctx.restore();
      return;
    }
    // and drawn, for the moment before the tile has arrived
    if(matKey==='chain'){
      const link = 6; ctx.strokeStyle = '#c9cdd2'; ctx.lineWidth = 1.4;
      for(let y=0;y<len-2;y+=link){
        const vert = ((y/link)|0)%2===0;
        ctx.beginPath();
        if(vert) ctx.ellipse(0, y+link/2, 1.7, link*0.46, 0, 0, Math.PI*2);
        else     ctx.ellipse(0, y+link/2, 3.0, link*0.34, 0, 0, Math.PI*2);
        ctx.stroke();
      }
    } else if(matKey==='rope'){
      // two strands twisting round each other
      const amp = 2.2, twist = 0.5;
      for(const off of [0, Math.PI]){
        ctx.beginPath();
        for(let y=0;y<=len;y+=2){ const x = Math.sin(y*twist+off)*amp;
          if(y===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); }
        ctx.strokeStyle = off===0 ? '#b79a68' : '#8f7444'; ctx.lineWidth = 2.6; ctx.stroke();
      }
    } else { // cord: a thin taut black nylon one, as its own swatch has always shown
      ctx.strokeStyle = 'rgba(26,24,22,0.95)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,len); ctx.stroke();
      ctx.strokeStyle = 'rgba(120,116,110,0.45)'; ctx.lineWidth = 0.7;
      ctx.beginPath(); ctx.moveTo(0.6,0); ctx.lineTo(0.6,len); ctx.stroke();
    }
  }

  function drawHanger(n){
    const cx = hangerX;

    // The chain it hangs BY, running up out of the top of the page. Drawn first,
    // so the ring's own brass paints over its foot, and drawn OUTSIDE the lean:
    // the ring is the pivot and does not move, so the chime swings beneath a
    // chain that stays put. It stops inside the ring's top brass rather than at
    // the ring's centre, or a straight run would show through the ring's hole
    // and read as passing behind it instead of being hooked on to it.
    if(chainImg.complete && chainImg.naturalWidth){
      const cw = HANGER_W*HG.chainW, cp = HANGER_W*HG.chainP;
      const x  = cx + HANGER_W*HG.chainCx - cw/2;
      const foot = ringY - HANGER_W*HG.chainFt;
      ctx.save();
      ctx.beginPath(); ctx.rect(x, 0, cw, foot); ctx.clip();
      for(let y=foot; y>-cp; y-=cp) ctx.drawImage(chainImg, x, y-cp, cw, cp);
      ctx.restore();
    }

    // everything below the ring leans with it. The ring is the hook and does not
    // move, but it is round and centred on the turn, so it is inside the lean
    // too and nothing of it shows.
    ctx.save();
    ctx.translate(cx, ringY); ctx.rotate(-hangAng); ctx.translate(-cx, -ringY);

    // the photograph: ring, both chains and the bar, in one rigid piece, placed
    // by its own two landmarks -- the bar's centre and the ring's centre.
    if(hangerImg.complete && hangerImg.naturalWidth){
      ctx.drawImage(hangerImg, cx - hangerW*HG.barCx, ringY - hangerH*HG.ringCy,
                    hangerW, hangerH);
    }else{
      // until it has arrived, the bar's own dark walnut in its place, so a slow
      // connection shows a plain hanger rather than rods hanging off nothing
      const bh = HANGER_W*0.18, bw = HANGER_W;
      ctx.fillStyle = '#3f2712';
      ctx.fillRect(cx-bw/2, pivotY-bh, bw, bh);
    }

    // and one eyelet per rod, at the tie point that rod actually hangs from.
    // They go on AFTER the cords (drawRodsAndCords runs first), so a cord comes
    // out from under its own eyelet the way one threaded through it would.
    if(eyeletImg.complete && eyeletImg.naturalWidth){
      const ew = HANGER_W*HG.eyeW, eh = HANGER_W*HG.eyeH;
      for(let i=0;i<n;i++){
        ctx.drawImage(eyeletImg, pivotX(i,n) - ew*HG.eyeCx, pivotY - eh*HG.eyeCy, ew, eh);
      }
    }

    ctx.restore();   // the lean
  }

  // world position of the point midway down a rod's body -- used to anchor its length popup
  function rodMidWorld(i, n){
    const r = state.rods[i];
    const mid = state.cordLength + r.rodLength*0.5;
    const sp = suspend(i,n);
    return { x: sp.x + Math.sin(r.angle)*mid, y: sp.y + Math.cos(r.angle)*mid };
  }
  // inverse of the canvas translate+rotate used to draw rod i, for hit-testing a click point
  function hitTestRod(clientX, clientY, n){
    for(let i=n-1;i>=0;i--){
      const r = state.rods[i];
      const sp = suspend(i,n);
      const dx = clientX-sp.x, dy = clientY-sp.y;
      const cosA = Math.cos(r.angle), sinA = Math.sin(r.angle);
      // inverse of the canvas rotate(-angle) transform used to draw this rod
      const lx = dx*cosA - dy*sinA, ly = dx*sinA + dy*cosA;
      const padX = 12, padTop = 8, padBottom = 12;
      if(lx > -ROD_THICK/2-padX && lx < ROD_THICK/2+padX &&
         ly > state.cordLength-padTop && ly < state.cordLength+r.rodLength+padBottom){
        return i;
      }
    }
    return -1;
  }

  // ---- UI ----
  // material pickers: a small trigger swatch that opens a wordless popup list, same pattern as warmler's finish picker
  function wireMatPicker(stateKey, swatchFile, triggerBtn, triggerImg, overlay, list, onPick){
    function apply(key){
      state[stateKey] = key;
      triggerImg.src = swatchFile(key);
      list.querySelectorAll('.matOption').forEach(o => o.classList.toggle('selected', o.dataset.key === key));
    }
    apply(state[stateKey]);          // the first apply is setup, not a choice
    triggerBtn.addEventListener('click', () => overlay.classList.add('open'));
    overlay.addEventListener('click', (e) => { if(e.target === overlay) overlay.classList.remove('open'); });
    list.querySelectorAll('.matOption').forEach(opt => {
      opt.addEventListener('click', () => { apply(opt.dataset.key); overlay.classList.remove('open'); if(onPick) onPick(); });
    });
  }
  wireMatPicker('rodMaterial', k => `chime-swatch-rod-${k}.png`,
    document.getElementById('rodMatTrigger'), document.getElementById('rodMatTriggerImg'),
    document.getElementById('rodMatOverlay'), document.getElementById('rodMatList'),
    // a set in another material is cut to different lengths for the same notes,
    // so changing the material re-cuts the tubes rather than transposing them
    () => rebuildRods(false));
  wireMatPicker('cordMaterial', k => `chime-swatch-cord-${k}.png`,
    document.getElementById('cordMatTrigger'), document.getElementById('cordMatTriggerImg'),
    document.getElementById('cordMatOverlay'), document.getElementById('cordMatList'));

  const countSlider = document.getElementById('countSlider');
  countSlider.addEventListener('input', ()=>{
    state.count = +countSlider.value;
    rebuildRods(true);
  });
  const windSlider = document.getElementById('windSlider');
  windSlider.addEventListener('input', ()=>{
    state.wind = (+windSlider.value)/100;
    if (liveWind!=null){ liveWind=null; windLocFlag.classList.remove('live'); }
  });
  const cordLenSlider = document.getElementById('cordLenSlider');
  cordLenSlider.addEventListener('input', ()=>{ state.cordLength = +cordLenSlider.value; });

  /* Her ask: a length slider for the rods as well as for the chains, because
     length changes the tone and how often they meet, not just how they look.
     With the set tuned, moving every rod along the scale together is a
     TRANSPOSE -- the whole chime goes up or down and stays in tune with itself,
     which is what a smaller or larger set of the same design actually is. Short
     rods also hang higher and swing quicker, so the meetings get busier as well
     as brighter: one control, both effects, exactly as she described. */
  const rodLenSlider = document.getElementById('rodLenSlider');
  rodLenSlider.addEventListener('input', ()=>{
    state.tune = +rodLenSlider.value;
    rebuildRods(false);          // every rod re-cut to its new note
  });

  // ---------- optional: swap the wind slider over to somewhere's real wind speed.
  // opt-in only -- never asks for location on its own, only when the flag is used.
  let liveWind=null, windLat=null, windLon=null;
  const windLocFlag=document.getElementById('loc-flag'), windLocPopup=document.getElementById('loc-popup'),
        windLocNote=document.getElementById('loc-note'), windLocNoteText=document.getElementById('loc-note-text'),
        windLocRetry=document.getElementById('loc-retry'), windLocSearch=document.getElementById('loc-search'),
        windLocSearchInput=document.getElementById('loc-search-input'), windLocStatus=document.getElementById('loc-search-status');

  async function fetchLiveWind(){
    if (windLat==null || windLon==null) return;
    try{
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${windLat}&longitude=${windLon}&current=wind_speed_10m`;
      const res = await fetch(url);
      const data = await res.json();
      if (data && data.current && typeof data.current.wind_speed_10m === 'number'){
        const kmh = data.current.wind_speed_10m;
        liveWind = Math.max(0, Math.min(100, kmh*2.2)); // 0-100 slider scale, tuned against the physics range
        state.wind = liveWind/100;
        windSlider.value = Math.round(liveWind);
        windLocFlag.classList.add('live');
        hideWindLocNote();
      } else {
        throw new Error('unexpected response shape');
      }
    } catch(e){
      // silence here would mean quietly keeping the chimes swaying to a wind speed that's
      // no longer real without ever admitting it -- this is opt-in and the popup starts
      // closed anyway, so there's no harm in saying so plainly the first time it happens
      showWindLocNote(liveWind!=null
        ? "couldn't reach the weather just now — still showing the last real reading"
        : "couldn't reach the weather — try again, or type a place below");
    }
  }
  function showWindLocNote(msg){ if(msg) windLocNoteText.textContent = msg; windLocNote.classList.add('visible'); }
  function hideWindLocNote(){ windLocNote.classList.remove('visible'); }

  function tryWindGeolocation(){
    if (!navigator.geolocation){ showWindLocNote("this browser can't share your location — try typing a place instead"); return; }
    if (windLocRetry){ windLocRetry.disabled = true; windLocRetry.textContent = 'checking…'; }
    navigator.geolocation.getCurrentPosition(
      pos => {
        windLat = pos.coords.latitude; windLon = pos.coords.longitude;
        hideWindLocNote();
        if (windLocRetry){ windLocRetry.disabled = false; windLocRetry.textContent = 'try again'; }
        fetchLiveWind();
      },
      () => {
        if (windLocRetry){ windLocRetry.disabled = false; windLocRetry.textContent = 'try again'; }
        showWindLocNote("couldn't get your location — check your browser and device settings, then");
      },
      { timeout: 5000 }
    );
  }
  windLocRetry.addEventListener('click', tryWindGeolocation);

  windLocFlag.addEventListener('click', ()=>{
    const open = windLocPopup.classList.toggle('open');
    windLocFlag.classList.toggle('open', open);
    windLocFlag.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open && windLat==null && liveWind==null) tryWindGeolocation();
  });

  /* An on-screen keyboard is not a keyboard. A one-field form submits on Enter in
     a desktop browser, but the Go key on some Android ones -- the Kindle's among
     them -- can leave the form alone entirely, and then a typed-in location does
     nothing and says nothing. Asking the form directly costs a line; preventing
     the key's own default is what stops a browser that DOES submit searching
     twice. */
  windLocSearchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.keyCode === 13){
      e.preventDefault();
      windLocSearch.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
    }
  });

  windLocSearch.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const q = windLocSearchInput.value.trim();
    if (!q) return;
    windLocStatus.textContent = 'looking…';
    try{
      const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q)}`;
      const res = await fetch(url);
      const results = await res.json();
      if (!results || !results.length){ windLocStatus.textContent = "couldn't find that"; return; }
      windLat = parseFloat(results[0].lat); windLon = parseFloat(results[0].lon);
      hideWindLocNote();
      await fetchLiveWind();
      windLocStatus.textContent = results[0].display_name.split(',').slice(0, 2).join(', ');
      windLocSearchInput.value = '';
    } catch(e){
      windLocStatus.textContent = "couldn't reach the map — try again";
    }
  });

  setInterval(()=>{ if (liveWind!=null) fetchLiveWind(); }, 10*60*1000);

  // ---- per-rod length popup: tap a rod to tune just its length ----
  const lenPopup = document.getElementById('lenPopup');
  const lenPopupSlider = document.getElementById('lenPopupSlider');
  let popupOpenIdx = -1;

  function positionPopupOnRod(){
    const n = state.rods.length;
    const mid = rodMidWorld(popupOpenIdx, n);
    const popupW = lenPopup.offsetWidth || 150, popupH = lenPopup.offsetHeight || 70;
    let left = mid.x - popupW/2;
    let top = mid.y - popupH - 16;
    left = Math.max(8, Math.min(left, window.innerWidth - popupW - 8));
    top = Math.max(8, top);
    lenPopup.style.left = `${left}px`;
    lenPopup.style.top = `${top}px`;
  }
  function openPopupForRod(i){
    popupOpenIdx = i;
    const r = state.rods[i];
    lenPopupSlider.min = ROD_LEN_MIN; lenPopupSlider.max = ROD_LEN_MAX; lenPopupSlider.value = r.rodLength;
    lenPopup.classList.add('open');
    positionPopupOnRod();
  }
  function closePopup(){
    popupOpenIdx = -1;
    lenPopup.classList.remove('open');
  }
  lenPopupSlider.addEventListener('input', ()=>{
    if(popupOpenIdx<0) return;
    const r = state.rods[popupOpenIdx];
    // snapped to the nearest cut on the scale, so a rod set by hand is a note
    // and not a quarter-tone between two of them
    r.rodLength = snapToScale(+lenPopupSlider.value);
  });
  lenPopup.addEventListener('click', e=> e.stopPropagation());
  canvas.addEventListener('click', (e)=>{
    const hit = hitTestRod(e.clientX, e.clientY, state.rods.length);
    if(hit>=0){
      openPopupForRod(hit);
      e.stopPropagation();
    }
  });
  document.addEventListener('click', (e)=>{
    if(lenPopup.classList.contains('open') && !lenPopup.contains(e.target)){
      closePopup();
    }
  });

  window.addEventListener('pointerdown', ensureAudio, {once:true});

  resize();
  rebuildRods(false);
  window.__chime = { get rods(){return state.rods;}, get count(){return state.rods.length;} };
  requestAnimationFrame(tick);
})();
</script>

(function(){
  var disc=document.getElementById('shelfdisc'), box=document.getElementById('plates');
  var rows=[].slice.call(box.querySelectorAll('.row'));
  function unroll(){ rows.forEach(function(r){ r.classList.remove('rolled'); }); }
  function shut(){ box.classList.remove('open'); disc.setAttribute('aria-expanded','false'); unroll(); }

  /* The twenty cards behind these plates are 6.2MB and not one of them can be
     seen until a plate is opened, but every page on the site was fetching the lot
     on load, ahead of the piece's own assets. Measured on bowl at 240px with a
     slow phone's CPU and connection, the bowl had still not appeared after 100
     seconds; held back, it is there in 12.
     They are held behind data-src rather than left to loading="lazy" alone,
     because that is a heuristic and not a promise -- the same page deferred them
     on a throttled connection and fetched all twenty on a fast one, since the
     browser's idea of "near the viewport" widens with bandwidth. This is the same
     on every machine. The attribute stays as a second line for anything that
     scrolls them into view another way. */
  var wired=false;
  function fetchCards(){
    if(wired) return; wired=true;
    [].slice.call(box.querySelectorAll('img[data-src]')).forEach(function(im){
      im.src=im.getAttribute('data-src'); im.removeAttribute('data-src');
    });
  }

  disc.addEventListener('click', function(ev){
    ev.stopPropagation();
    var open=box.classList.toggle('open');
    if(open) fetchCards();
    disc.setAttribute('aria-expanded', open?'true':'false');
    if(!open) unroll();
  });

  // Same bargain the case itself strikes: a mouse can hover, so a plate is a link
  // straight to its shelf. A thumb cannot, so the first tap on a plate rolls its
  // pieces out and only the second one goes to the shelf.
  var FINE=matchMedia('(hover: hover) and (pointer: fine)');
  rows.forEach(function(row){
    row.querySelector('.tag').addEventListener('click', function(ev){
      if(FINE.matches) return;
      if(row.classList.contains('rolled')) return;
      ev.preventDefault();
      unroll(); row.classList.add('rolled');
    });
  });

  document.addEventListener('click', function(ev){
    if(!box.contains(ev.target) && ev.target!==disc) shut();
  });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') shut(); });
})();
</script>
<!-- /shelf-tags -->
<!-- touch-targets -->
<style>
  /* GENERATED by tools/touch-targets.js -- do not hand-edit between the markers.
     A 3px-tall slider is a mouse dimension: a mouse is pixel-precise, a thumb is
     about 9mm across and covers the whole track the moment it lands on it. These
     rules grow the BODY that catches a thumb without moving the painted line by a
     pixel -- the padding grows the box, background-clip keeps the paint in the
     content strip, and the matching negative margin gives back the space so
     nothing on the page shifts. Each slider grows only as far as half the gap to
     its nearest neighbour, so no two ever overlap and steal each other's taps. */
  @media (pointer: coarse){
  input[type=range]#countSlider{ box-sizing:content-box; background-origin:content-box; background-clip:content-box; border-radius:1.5px 1.5px 1.5px 1.5px / 16.5px 16.5px 11.5px 11.5px; padding:15px 0 10px; margin-top:-28px; margin-bottom:-23px; }
  input[type=range]#cordLenSlider{ box-sizing:content-box; background-origin:content-box; background-clip:content-box; border-radius:1.5px 1.5px 1.5px 1.5px / 6.5px 6.5px 4.5px 4.5px; padding:5px 0 3px; margin-top:-13px; margin-bottom:-15px; }
  input[type=range]#rodLenSlider{ box-sizing:content-box; background-origin:content-box; background-clip:content-box; border-radius:1.5px 1.5px 1.5px 1.5px / 11.5px 11.5px 11.5px 11.5px; padding:10px 0 10px; margin-top:-8px; margin-bottom:-8px; }
  input[type=range]#windSlider{ box-sizing:content-box; background-origin:content-box; background-clip:content-box; border-radius:1.5px 1.5px 1.5px 1.5px / 4.5px 4.5px 16.5px 16.5px; padding:3px 0 15px; margin-top:-16px; margin-bottom:-28px; }
  }
</style>
<!-- /touch-targets -->
