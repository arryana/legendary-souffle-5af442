<style>
  :root{ --brass:#c9974e; --parchment:#f2e9d8; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{ height:100%; margin:0; overflow:hidden; background:#04060a;
    font-family: Georgia, serif; color:var(--parchment); user-select:none; }
  #backlink{ position:fixed; top:18px; left:22px; z-index:50; color:var(--parchment); opacity:.55;
    text-decoration:none; font-size:14px; letter-spacing:.04em;
    text-shadow:0 1px 3px rgba(0,0,0,.85), 0 0 9px rgba(0,0,0,.55); transition:opacity .3s ease; }
  #backlink:hover{opacity:.9;}
  canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #cursorHint{ position:fixed; z-index:70; pointer-events:none; display:none; transform:translate(-42%,-8%); }
  #chHand{ display:block; width:25px; height:31px; color:var(--parchment); opacity:.88;
    filter:drop-shadow(0 1px 3px rgba(0,0,0,.6)); }
  #chGlow{ position:absolute; left:39%; top:-14px; width:13px; height:13px; margin-left:-6.5px; border-radius:50%;
    background:radial-gradient(circle, rgba(220,232,120,.95) 0%, rgba(220,232,120,.5) 42%, rgba(220,232,120,0) 76%);
    animation: chPulse 1.8s ease-in-out infinite; }
  @keyframes chPulse{ 0%,100%{ opacity:.55; transform:scale(0.82); } 50%{ opacity:1; transform:scale(1.15); } }
  #dock{ position:fixed; bottom:0; left:0; right:0; z-index:40; display:flex; flex-direction:column;
    align-items:center; gap:10px; padding:14px 18px 22px;
    background:linear-gradient(to top, rgba(4,6,10,.88), rgba(4,6,10,0)); }
  /* on narrow screens the four sliders wrap into two columns, and a centered wrap can hug
     the left edge closely enough to collide with the fixed music button sitting in that
     same bottom-left corner — reserve room for it so they never touch */
  @media (max-width:480px){
    #dock{ padding-left:76px; }
  }
  #sliders{ display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:8px 22px; }
  .ctrl{ display:flex; align-items:center; gap:9px; }
  .ctrl svg{ width:17px; height:17px; opacity:.65; flex-shrink:0; }
  input[type=range]{ -webkit-appearance:none; appearance:none; width:118px; height:3px; border-radius:3px;
    background:rgba(242,233,216,.25); outline:none; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:13px; height:13px; border-radius:50%;
    background:var(--brass); cursor:pointer; box-shadow:0 0 6px rgba(201,151,78,.6); }
  input[type=range]::-moz-range-thumb{ width:13px; height:13px; border-radius:50%; border:none;
    background:var(--brass); cursor:pointer; }
  #row2{ display:flex; align-items:center; justify-content:center; gap:20px; flex-wrap:wrap; }
  #batCtrl{ display:flex; align-items:center; gap:7px; font-size:12px; opacity:.7; letter-spacing:.02em; }
  #batCtrl svg{ width:18px; height:18px; opacity:.7; }
  input[type=checkbox]{ -webkit-appearance:none; appearance:none; width:14px; height:14px; border-radius:3px;
    border:1px solid rgba(242,233,216,.4); background:transparent; cursor:pointer; position:relative; margin:0; flex-shrink:0; }
  input[type=checkbox]:checked{ background:rgba(201,151,78,0.25); border-color:var(--brass); }
  input[type=checkbox]:checked::after{ content:''; position:absolute; left:3px; top:0px; width:4px; height:8px;
    border:solid var(--brass); border-width:0 2px 2px 0; transform:rotate(45deg); }
  #volumeRow{ display:flex; align-items:center; gap:8px; font-size:12px; opacity:.65; letter-spacing:.02em; }
  #volumeRow input[type=range]{ width:88px; }

  /* a quiet flag, opt-in only (never requests location on its own), for swapping the
     temperature slider over to somewhere's real reading -- same pattern as galileo's */
  #tempCtrl{ position:relative; }
  #loc-flag{ appearance:none; border:0; background:none; padding:2px 4px; margin-left:-2px;
    font-size:14px; line-height:1; cursor:pointer; opacity:.4; transition:opacity .3s ease; flex-shrink:0; }
  #loc-flag:hover, #loc-flag.open{ opacity:.85; }
  #loc-flag.live{ opacity:.95; }
  #loc-popup{ position:absolute; left:50%; bottom:100%; transform:translateX(-50%); margin-bottom:12px;
    display:none; flex-direction:column; align-items:center; gap:5px; white-space:nowrap;
    background:rgba(10,14,22,.88); border:1px solid rgba(201,151,78,.3); border-radius:10px; padding:9px 11px;
    -webkit-backdrop-filter:blur(5px); backdrop-filter:blur(5px); z-index:45; }
  #loc-popup.open{ display:flex; }
  #loc-note{ display:none; font-size:11px; letter-spacing:.02em; color:#a89a80; text-align:center;
    max-width:200px; white-space:normal; }
  #loc-note.visible{ display:block; }
  #loc-retry{ appearance:none; border:0; background:none; padding:0; margin-left:2px;
    font:inherit; color:inherit; text-decoration:underline; cursor:pointer; }
  #loc-retry:hover{ color:var(--brass); }
  #loc-retry:disabled{ text-decoration:none; opacity:.6; cursor:default; }
  #loc-search{ display:flex; align-items:center; gap:6px; }
  #loc-search input{ appearance:none; border:0; border-bottom:1px solid rgba(201,151,78,.4); background:none;
    color:var(--parchment); font:13px/1.3 Georgia, serif; letter-spacing:.02em; padding:3px 2px; width:120px; outline:none; }
  #loc-search input::placeholder{ color:#7a6b52; }
  #loc-search input:focus{ border-bottom-color:var(--brass); }
  #loc-search-status{ font-size:10px; letter-spacing:.02em; color:#a89a80; text-align:center;
    min-height:1.1em; white-space:normal; max-width:200px; }
</style>

<!-- bring-your-own-music: plays a file the visitor picks from their own device; nothing is uploaded -->
<style>
  #music{ position:fixed; left:18px; bottom:16px; z-index:60; display:flex; align-items:center; gap:9px; }
  #musicBtn{ width:34px; height:34px; border-radius:50%; border:1px solid rgba(242,233,216,.25); background:rgba(20,24,34,.55); color:#f2e9d8; font-size:15px; line-height:1; cursor:pointer; opacity:.55; transition:opacity .3s, color .3s, border-color .3s; -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); }
  #musicBtn:hover{ opacity:1; }
  #musicBtn.playing{ color:#f0d69a; border-color:rgba(201,151,78,.6); opacity:.9; }
  #musicName{ max-width:40vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; color:#f2e9d8; opacity:0; transition:opacity .3s; letter-spacing:.02em; cursor:pointer; }
  #music:hover #musicName{ opacity:.55; }
  /* a phone has no hover, so the name of the visitor's own track was never
     visible on one at all -- and worse, an invisible thing sat there taking
     taps. While something is playing it simply shows, next to the button.
     Not a caption on the piece: it is their file's name, not the site's words. */
  #musicBtn.playing ~ #musicName{ opacity:.5; }
</style>
<div id="music" title="play your own music">
  <button id="musicBtn" aria-label="play your own music">🎧</button>
  <span id="musicName"></span>
</div>
<input type="file" id="musicPick" accept="audio/*" multiple hidden>
<audio id="musicEl"></audio>
<script>
(function(){
  const pick=document.getElementById('musicPick'), el=document.getElementById('musicEl'),
        btn=document.getElementById('musicBtn'), name=document.getElementById('musicName');
  let list=[], idx=0;
  const label=f=> f ? f.name.replace(/\.[^.]+$/,'') : '';
  function load(i){ if(el.src) URL.revokeObjectURL(el.src); el.src=URL.createObjectURL(list[i]); name.textContent=label(list[i]); }
  function sync(){ btn.textContent = !el.src ? '🎧' : (el.paused ? '▶' : '❚❚'); btn.classList.toggle('playing', !!el.src && !el.paused); }
  btn.addEventListener('click', ()=>{ if(!list.length){ pick.click(); return; } el.paused ? el.play() : el.pause(); });
  name.addEventListener('click', ()=> pick.click());
  pick.addEventListener('change', ()=>{ if(!pick.files.length) return; list=[...pick.files]; idx=0; el.loop=(list.length===1); load(0); el.play(); });
  el.addEventListener('ended', ()=>{ if(list.length>1){ idx=(idx+1)%list.length; load(idx); el.play(); } });
  el.addEventListener('play', sync); el.addEventListener('pause', sync); el.addEventListener('loadeddata', sync);
  sync();
})();
</script>

<canvas id="scene"></canvas>
<div id="cursorHint">
  <div id="chGlow"></div>
  <svg id="chHand" viewBox="0 0 28 34" fill="currentColor"><rect x="5" y="14" width="17" height="15" rx="5"/><rect x="1.5" y="15" width="6" height="4.5" rx="2.1" transform="rotate(-16 4.5 17.5)"/><rect x="8" y="1" width="6" height="16" rx="3"/></svg>

<div id="dock">
  <div id="sliders">
    <div class="ctrl" title="temperature" id="tempCtrl">

      <input type="range" id="tempSlider" min="5" max="35" value="24" aria-label="temperature">

      <input type="range" id="windSlider" min="0" max="100" value="15" aria-label="wind">

    </label>
    <div id="volumeRow">
      <input type="checkbox" id="muteCheckbox" title="no sound" aria-label="no sound">

    </div>

</div>

<script>
(function(){
  const canvas=document.getElementById('scene'), ctx=canvas.getContext('2d');
  const tempSlider=document.getElementById('tempSlider'), humiditySlider=document.getElementById('humiditySlider'),
        windSlider=document.getElementById('windSlider'), darkSlider=document.getElementById('darkSlider'),
        batCheckbox=document.getElementById('batCheckbox'), cursorHint=document.getElementById('cursorHint');

  let W=0,H=0,DPR=1;
  function resize(){
    DPR=Math.min(2,window.devicePixelRatio||1);
    W=window.innerWidth; H=window.innerHeight;
    canvas.width=W*DPR; canvas.height=H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    buildGrass();
  }
  window.addEventListener('resize', resize);

  // ---------- conditions ----------
  let temp=+tempSlider.value, humidity=+humiditySlider.value/100, wind=+windSlider.value/100, dark=+darkSlider.value/100;
  tempSlider.addEventListener('input', ()=>{
    temp=+tempSlider.value;
    if (liveTemp!=null){ liveTemp=null; locFlag.classList.remove('live'); }
  });
  humiditySlider.addEventListener('input', ()=> humidity=+humiditySlider.value/100);
  windSlider.addEventListener('input', ()=> wind=+windSlider.value/100);
  darkSlider.addEventListener('input', ()=> dark=+darkSlider.value/100);

  // ---------- optional: swap the temperature slider over to somewhere's real reading.
  // opt-in only -- never asks for location on its own, only when the flag is used.
  let liveTemp=null, lat=null, lon=null;
  const locFlag=document.getElementById('loc-flag'), locPopup=document.getElementById('loc-popup'),
        locNote=document.getElementById('loc-note'), locNoteText=document.getElementById('loc-note-text'),
        locRetry=document.getElementById('loc-retry'), locSearch=document.getElementById('loc-search'),
        locSearchInput=document.getElementById('loc-search-input'), locStatus=document.getElementById('loc-search-status');

  async function fetchLiveTemp(){
    if (lat==null || lon==null) return;
    try{
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m&temperature_unit=celsius`;
      const res = await fetch(url);
      const data = await res.json();
      if (data && data.current && typeof data.current.temperature_2m === 'number'){
        liveTemp = Math.max(5, Math.min(35, data.current.temperature_2m));
        temp = liveTemp;
        tempSlider.value = Math.round(liveTemp);
        locFlag.classList.add('live');
        hideLocNote();
      } else {
        throw new Error('unexpected response shape');
      }
    } catch(e){
      // silence here would mean quietly keeping the slider on a temperature that's no
      // longer real without ever admitting it -- this is opt-in and the popup starts
      // closed anyway, so there's no harm in saying so plainly the first time it happens
      showLocNote(liveTemp!=null
        ? "couldn't reach the weather just now — still showing the last real reading"
        : "couldn't reach the weather — try again, or type a place below");
    }
  }
  function showLocNote(msg){ if(msg) locNoteText.textContent = msg; locNote.classList.add('visible'); }
  function hideLocNote(){ locNote.classList.remove('visible'); }

  function tryGeolocation(){
    if (!navigator.geolocation){ showLocNote("this browser can't share your location — try typing a place instead"); return; }
    if (locRetry){ locRetry.disabled = true; locRetry.textContent = 'checking…'; }
    navigator.geolocation.getCurrentPosition(
      pos => {
        lat = pos.coords.latitude; lon = pos.coords.longitude;
        hideLocNote();
        if (locRetry){ locRetry.disabled = false; locRetry.textContent = 'try again'; }
        fetchLiveTemp();
      },
      () => {
        if (locRetry){ locRetry.disabled = false; locRetry.textContent = 'try again'; }
        showLocNote("couldn't get your location — check your browser and device settings, then");
      },
      { timeout: 5000 }
    );
  }
  locRetry.addEventListener('click', tryGeolocation);

  locFlag.addEventListener('click', ()=>{
    const open = locPopup.classList.toggle('open');
    locFlag.classList.toggle('open', open);
    locFlag.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open && lat==null && liveTemp==null) tryGeolocation();
  });

  /* An on-screen keyboard is not a keyboard. A one-field form submits on Enter in
     a desktop browser, but the Go key on some Android ones -- the Kindle's among
     them -- can leave the form alone entirely, and then a typed-in location does
     nothing and says nothing. Asking the form directly costs a line; preventing
     the key's own default is what stops a browser that DOES submit searching
     twice. */
  locSearchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.keyCode === 13){
      e.preventDefault();
      locSearch.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
    }
  });

  locSearch.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const q = locSearchInput.value.trim();
    if (!q) return;
    locStatus.textContent = 'looking…';
    try{
      const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q)}`;
      const res = await fetch(url);
      const results = await res.json();
      if (!results || !results.length){ locStatus.textContent = "couldn't find that"; return; }
      lat = parseFloat(results[0].lat); lon = parseFloat(results[0].lon);
      hideLocNote();
      await fetchLiveTemp();
      locStatus.textContent = results[0].display_name.split(',').slice(0, 2).join(', ');
      locSearchInput.value = '';
    } catch(e){
      locStatus.textContent = "couldn't reach the map — try again";
    }
  });

  setInterval(()=>{ if (liveTemp!=null) fetchLiveTemp(); }, 10*60*1000);

  let batsOn=false;
  batCheckbox.addEventListener('change', ()=> batsOn=batCheckbox.checked);

  function tempFactor(c){
    if(c>=21 && c<=28) return 1;
    if(c<21) return Math.max(0, 1-(21-c)/13);
    return Math.max(0, 1-(c-28)/14);
  }
  function activityLevel(){
    const tf=tempFactor(temp), hf=0.22+0.78*humidity, wf=Math.max(0,1-wind*1.15);
    return Math.max(0, Math.min(1, tf*hf*wf));
  }

  // ---------- sky (real dusk-to-night photos), grass ----------
  const horizonFrac=0.60;
  function horizonY(){ return H*horizonFrac; }

  // five real photos of the same meadow, from dusk to near-full night — replaces what used
  // to be a drawn gradient + drawn stars + a drawn treeline silhouette. Only the sky/treeline
  // portion of each photo is ever visible: drawGrass() below paints an opaque foreground over
  // everything below horizonY(), same as it always has, so the photos never need to be
  // cropped or aligned to our horizon — cover-fit fills the frame and the bottom is simply
  // covered up.
  const SKY_STAGE_COUNT=7;
  // The seven photographs are 7.6MB, and asking for all of them on load put the
  // whole set in front of the piece -- bowl's fault at half bowl's size, and the
  // general lesson bowl's row records: a sweep that only looks at where things
  // land cannot see megabytes queued ahead of the piece. Only the stage the
  // darkness is actually sitting on is asked for at first, and its neighbour for
  // the cross-fade; the rest come in behind the running piece ONE AT A TIME,
  // nearest-to-here first, because seven at once is worse on the machine that is
  // already struggling. Moving the slider to a stage that has not arrived asks
  // for it at once and takes it the moment it lands.
  const skyStages=Array.from({length:SKY_STAGE_COUNT}, ()=> new Image());
  const skyAsked=new Array(SKY_STAGE_COUNT).fill(false);
  function askSky(i){
    if(i<0 || i>=SKY_STAGE_COUNT) return null;
    if(!skyAsked[i]){ skyAsked[i]=true; skyStages[i].src=`firefly-sky-${i}.jpg`; }
    return skyStages[i];
  }
  const skyReady=im=>!!(im && im.complete && im.naturalWidth);
  // the nearest stage that HAS arrived, so a slider move never drops to a flat
  // colour -- it shows the closest sky it has until the right one lands
  function nearestReadySky(i){
    for(let d=0; d<SKY_STAGE_COUNT; d++){
      for(const j of (d? [i-d, i+d] : [i])){
        if(j>=0 && j<SKY_STAGE_COUNT && skyReady(skyStages[j])) return skyStages[j];
      }
    }
    return null;
  }
  let skyBackfilling=false;
  function backfillSkies(){
    if(skyBackfilling) return;
    const here=Math.round(dark*(SKY_STAGE_COUNT-1));
    let next=-1, best=Infinity;
    for(let i=0;i<SKY_STAGE_COUNT;i++){
      if(skyAsked[i]) continue;
      const d=Math.abs(i-here);
      if(d<best){ best=d; next=i; }
    }
    if(next<0) return;                       // they are all in
    skyBackfilling=true;
    const img=askSky(next);
    const done=()=>{ skyBackfilling=false; setTimeout(backfillSkies, 150); };
    img.addEventListener('load', done, {once:true});
    img.addEventListener('error', done, {once:true});
  }
  // start the queue only once the page itself has settled, so it never competes
  // with the piece's own first paint
  window.addEventListener('load', ()=> setTimeout(backfillSkies, 1200));
  /* THE SEVEN STAGES ARE ONE FIELD NOW. The set they replace was two different
     places: stages 0-3 were one meadow and 5-6 were another, with 4 matching
     neither, so dragging the slider past about two thirds made the trees pick
     themselves up and move. Measured on the land alone, 0-3 agreed with each
     other at 0.99 and with 5-6 at 0.13. It was not a clean progression either --
     stage 3 was BRIGHTER than stage 2, so pushing toward darkness made it lighter
     at one point.
     Rebuilt Aug 2026 from four photographs of a single field, two of them hers
     shot to order: dusk, later dusk, deep twilight with the first stars, and full
     night with the Milky Way up. Registered to the pixel (the night frames sit
     within 2px of the dusk one, which is corrected here), then the seven stages
     composed by easing between the nearest two and graded to a ground brightness
     that falls every step: 39.5, 30.1, 23.1, 18.2, 14.2, 10.5, 7.0.
     The grade is a GAMMA and not a multiply, deliberately -- a multiply dims the
     stars as much as the sky, where a gamma deepens the shadows and mid-tones and
     leaves the bright points alone, which is what a darkening sky actually does to
     a star field.
     They are JPEGs rather than PNGs: a night photograph is exactly what JPEG is
     for, and the seven came down from 6.92MB to 0.70MB. Checked for banding, which
     is the risk in a dark gradient -- the longest run of one identical value across
     a sky row is 12px of 963.
     Cover-fit is still computed per image from its own naturalWidth/Height rather
     than one shared size, which is what fixed the old "doubled" look. */
  function coverFitFor(img){
    const scale=Math.max(W/img.naturalWidth, H/img.naturalHeight);
    const dw=img.naturalWidth*scale, dh=img.naturalHeight*scale;
    return {ox:(W-dw)/2, oy:(H-dh)/2, dw, dh};
  }
  /* THE SKY IS COMPOSED ONCE AND KEPT, and it is worth knowing why because the
     cost was hiding in plain sight. This used to draw a full-size photograph,
     scaled to the screen, on EVERY frame -- and whenever the darkness slider sat
     between two stages it drew a SECOND one over the top with an alpha. `dark`
     only ever changes when a hand moves the slider, so both of those were being
     redone sixty times a second to produce a picture that had not altered.
     Measured on a processor six times slower, nothing placed: squarely on a stage
     it ran at 44-50fps, and anywhere between two it ran at 24-27. Half the frame
     rate, and "between two" is nearly the whole slider -- including its DEFAULT of
     66, so every visitor landed on the slow path without touching anything. That
     is also why the figure in this file said 43fps and a later measurement said
     25: both were right, and they were taken at different slider positions.
     Composed into its own canvas and blitted, the scaling and the blend happen
     once per slider move instead of once per frame. Note the key covers the
     screen size, both stages, the blend, AND which photograph is standing in --
     the backfill swaps those in as they arrive, and a stale sky would stick. */
  let skyCache=null, skyCacheKey='';
  function drawSkyPhoto(){
    const pos=dark*(SKY_STAGE_COUNT-1), i0=Math.floor(pos), frac=pos-i0;
    const i1=Math.min(SKY_STAGE_COUNT-1,i0+1);
    const a=askSky(i0), b=askSky(i1);
    const base = skyReady(a) ? a : nearestReadySky(i0);
    // only cross-fade when BOTH stages are really here: fading the next one over
    // a stand-in would dissolve between two skies that aren't neighbours
    const blending = frac>0.001 && skyReady(a) && skyReady(b);
    const key = W+'x'+H+'|'+DPR+'|'+(base?base.src:'-')+'|'
              + (blending ? i1+'@'+frac.toFixed(3)+'|'+b.src : '-');
    if(key!==skyCacheKey){
      if(!skyCache) skyCache=document.createElement('canvas');
      const pw=Math.max(1,Math.round(W*DPR)), ph=Math.max(1,Math.round(H*DPR));
      if(skyCache.width!==pw||skyCache.height!==ph){ skyCache.width=pw; skyCache.height=ph; }
      const g=skyCache.getContext('2d');
      g.setTransform(DPR,0,0,DPR,0,0);
      g.clearRect(0,0,W,H);
      if(base){
        const fa=coverFitFor(base);
        g.drawImage(base,fa.ox,fa.oy,fa.dw,fa.dh);
      } else { g.fillStyle='#0a0e18'; g.fillRect(0,0,W,H); }
      if(blending){
        const fb=coverFitFor(b);
        g.save(); g.globalAlpha=frac;
        g.drawImage(b,fb.ox,fb.oy,fb.dw,fb.dh);
        g.restore();
      }
      skyCacheKey=key;
    }
    ctx.drawImage(skyCache,0,0,W,H);
  }

  let blades=[];
  function buildGrass(){
    blades=[];
    const n=Math.floor(W/4.2);
    for(let i=0;i<n;i++){
      const t=Math.random();
      blades.push({ x:Math.random()*W, h: 10+t*34, lean: (Math.random()*2-1)*0.15,
        phase:Math.random()*Math.PI*2, sway: 0.7+Math.random()*0.7,
        depthY: horizonY() + Math.pow(Math.random(),0.6)*(H-horizonY()) });
    }
    blades.sort((a,b)=>a.depthY-b.depthY);
  }

  function lerpColor(a,b,t){ return [0,1,2].map(i=>Math.round(a[i]+(b[i]-a[i])*t)); }
  function rgb(c,a){ return `rgba(${c[0]},${c[1]},${c[2]},${a===undefined?1:a})`; }

  function drawGrass(t){
    const base=horizonY();
    // the five sky photos are now real, matched frames of the same meadow — same crop, same
    // horizon, dusk through night — so there's no misalignment to hide any more, and the real
    // photographed grass in the lower part of each one can just stay visible on its own. All
    // that's drawn here now is a thin layer of individually swaying blades close to the camera,
    // over the photo rather than instead of it — the interactive bit (wind, depth, fireflies
    // rising through them) a still photo can't provide by itself.
    ctx.strokeStyle=rgb(lerpColor([10,16,9],[5,7,5],dark), 0.8);
    ctx.lineWidth=1;
    const windAmt = wind*10;
    for(const b of blades){
      if(b.depthY < base+ (H-base)*0.35) continue; // only draw individual blades in the nearer band
      const sway = Math.sin(t*0.0016*b.sway + b.phase) * (2+windAmt) * ((b.depthY-base)/(H-base));
      ctx.beginPath();
      ctx.moveTo(b.x, b.depthY);
      ctx.quadraticCurveTo(b.x + sway*0.6 + b.lean*b.h, b.depthY - b.h*0.6, b.x + sway + b.lean*b.h*1.6, b.depthY - b.h);
      ctx.lineWidth = Math.max(0.6, 1.4*((b.depthY-base)/(H-base)));
      ctx.stroke();
    }
  }

  // ---------- fireflies ----------
  let females=[]; // {x,y,phase}
  let males=[];   // flying agents
  let bats=[];
  const MAX_FEMALES=10, MAX_MALES=26;
  // Between flashes a firefly is not gone. Two things carry it, and which one you see
  // depends on how much light is left in the scene — at dusk the insect reads as a dark
  // speck against a sky that still has light in it (drawBody, below), and once that sky
  // is too dark for a silhouette this faint ember is what is left. 0.018 rendered as
  // about 3/255 and was invisible in practice, so the piece had nothing at all between
  // flashes and every flash arrived unrelated to the last.
  //
  // 0.07 first, then 0.05 at her ask — "can you tone down their glow slightly when
  // they're between flashes?" Don't try to choose this by measurement: the ember is a
  // few parts in 255 and what happens to be behind a given firefly moves the reading
  // more than the setting does, so a sweep of values comes back non-monotonic. The
  // reliable figure is the arithmetic — the core is drawn at `alpha * skyDim` of a pale
  // yellow, so at the default darkness 0.07 adds about 13/255 at the centre and 0.05
  // about 9. Below roughly 0.03 it stops being visible at all and the piece is back to
  // having nothing between flashes, which is the fault this exists to fix.
  const LIGHT_FLOOR=0.05;

  // How high they may get. This was horizonY()-55 — barely above the field, so no
  // firefly ever rose against the sky. HER CALL, Aug 2026, after seeing four heights
  // side by side: she picked the highest. It is not a licence taken lightly and it is
  // not unfaithful either — species differ, and the ones that flash up among and above
  // the trees are real; what was wrong was that this piece allowed no height at all.
  // She had already confirmed the low flying itself is true to life, so the ceiling is
  // what moved, not the idea.
  function fireflyZoneTop(){ return horizonY()-130; }
  function batZoneTop(){ return horizonY()*0.3; }      // bats hunt higher, against the sky
  function fireflyGroundY(){ return H*0.985; }

  // real bat silhouettes (an 8-frame flap cycle) instead of the old drawn wing-flick shape.
  // Bats are genuinely crepuscular — most active right around dusk — and that happens to also
  // solve a visibility problem: a true-black bat silhouette all but disappears against the
  // darkest night sky, so rather than lighten the art unrealistically, batActivity() below
  // tapers spawning down to nothing well before the sky gets that dark. They're gone from the
  // scene by the time they'd be invisible anyway.
  const BAT_FLY=Array.from({length:8}, (_,i)=>{ const img=new Image(); img.src=`bat-fly-${i+1}.png`; return img; });
  const BAT_SCALE=0.14, BAT_FLAP_HZ=2.6;
  function batActivity(){ return Math.max(0, 1-dark/0.65); }

  function spawnMale(){
    const depth=Math.random(); // 0 near/bright, 1 far/dim
    // real fireflies rise up out of the grass they were resting in, rather than
    // drifting in sideways from off-screen — start low, near the ground, and ease
    // up toward cruising height over the first couple of seconds
    const x = 30 + Math.random()*Math.max(1,W-60);
    const groundY = fireflyGroundY();
    // real fireflies range highest right at dusk and settle low into the grass as full
    // night comes on — a preferred cruising altitude (with some natural spread) that
    // shifts with the darkness slider, rather than a fixed band.
    //
    // THEY WERE CRUISING INSIDE THE GRASS, not over it, which is her first report —
    // "there's just not enough of them drifting around above the grass". altFrac runs
    // 0 at the ceiling to 1 at the ground, and the top of the near grass sits at 0.45
    // of that band, so at the default darkness a preference of 0.58 put the whole
    // population below it: only 11.3% of fireflies were above the top of the grass and
    // the median one sat 65px inside it.
    const altPref = 0.03 + 0.20*dark;

    // AND THEY FLEW IN FORMATION, which is her second report — "they all seem to be in
    // such formation" — and it is a separate fault from the height. Every firefly was
    // given the same preferred altitude with a narrow uniform wobble of ±0.25 around
    // it, so the whole population stratified into one horizontal band; raising them
    // without fixing this would only have moved the band up. Worse, once the preferred
    // height is near the ceiling a symmetric wobble CLIPS against it, and a clamp piles
    // everyone that would have gone higher onto exactly the same line — a hard edge,
    // which is the most formation-like thing a scatter can do.
    //
    // So: a soft-edged spread (three randoms averaged, so the middle is commoner than
    // the edges, the way a real population is), twice as wide as before, and REFLECTED
    // off the ceiling and the floor instead of clamped, so nothing accumulates on
    // either. Don't put the clamp back — the pile-up is the formation.
    const u = (Math.random()+Math.random()+Math.random())/3 - 0.5;   // −0.5..0.5, soft
    let alt = altPref + u*1.5;
    if(alt < 0) alt = -alt;                 // reflect, never stack on the ceiling
    if(alt > 1) alt = 2-alt;
    const altFrac = Math.max(0, Math.min(1, alt));
    const targetY = fireflyZoneTop() + altFrac*(groundY-fireflyZoneTop());
    const spawnY = groundY - 4 - Math.random()*10;
    males.push({
      x, y: spawnY, depth,
      vx: (Math.random()<0.5?-1:1) * (5+11*Math.random()), // lazy horizontal cruise, px/s
      // Every one of these was shared before, which is what made them fly as a flock.
      // steerSpeed especially: it was a fixed 0.5 for every firefly, so the whole
      // population turned on one rhythm. Her report — "they all seem to be in such
      // formation. real fireflies dip and loop and wander".
      steerPhase: Math.random()*Math.PI*2,
      steerSpeed: 0.25+Math.random()*0.7,
      steerAmp: 4+Math.random()*7,          // big enough that vx reverses -- that is the loop
      spawnY, riseT:0, riseDur: 1.6+Math.random()*1.6,
      cruiseY: targetY, cruisePhase: Math.random()*Math.PI*2, cruiseSpeed: 0.12+Math.random()*0.1, cruiseAmp: 10+Math.random()*14,
      // a SECOND vertical sway at a rate unrelated to the first, so the two never come
      // back into step and the path does not repeat -- one sine alone is a wave, and a
      // wave is what reads as mechanical
      cruisePhase2: Math.random()*Math.PI*2, cruiseSpeed2: 0.04+Math.random()*0.09, cruiseAmp2: 7+Math.random()*15,
      dipT: 2+Math.random()*7, dipping:0, dipDur:0, dipSize:0,
      bobPhase: Math.random()*Math.PI*2, bobSpeed: 0.9+Math.random()*0.5, bobAmp: 2.5+Math.random()*2,
      state:'cruise', stateT:0,
      nextFlashAt: 1+Math.random()*4,
      swoopDur: 2.4+Math.random()*1.4, dipAmp: 20+Math.random()*24,
      // how far the J leans, and which way. Without this every rise is straight up
      // the screen and all the flashes read as one gesture -- see swoopVx below.
      swoopLean: (Math.random()<0.5?-1:1) * (10+Math.random()*34),
      flashAt: 0.72+Math.random()*0.14,
      // heading, speed, and the tightest curve this one can fly
      hd: Math.random()*Math.PI*2, sp: 8+Math.random()*8, minR: 30+Math.random()*32,
      spMax: 26+Math.random()*15,
      airPhase: Math.random()*Math.PI*2,
      surgePhase: Math.random()*Math.PI*2, surgeSpeed: 0.55+Math.random()*0.75,
      curv: 0, curvPhase: Math.random()*Math.PI*2, curvSpeed: 0.16+Math.random()*0.26,
      curvPhase2: Math.random()*Math.PI*2, curvSpeed2: 0.05+Math.random()*0.11,
      flashAlpha:0, hasFlashed:false, flashT:0, vxEff:0, vyEff:0, target:null, targetT:0
    });
  }
  function spawnBat(){
    bats.push({ x:-40, y: batZoneTop()+Math.random()*horizonY()*0.5,
      heading:0, turnTarget:0, turnT:0, turnAt:0.1+Math.random()*0.2,
      speed: 210+Math.random()*90, t:Math.random()*100 });
  }

  function withinGrass(x,y){ return y>horizonY() && y<H; }

  function placeOrRemoveFemale(x,y){
    for(let i=0;i<females.length;i++){
      const f=females[i];
      if(Math.hypot(f.x-x,f.y-y) < 16){ females.splice(i,1); return; }
    }
    if(females.length>=MAX_FEMALES) return;
    if(!withinGrass(x,y)) return;
    const y2=Math.min(y, H*0.97);
    females.push({ x, y:y2, phase:Math.random()*Math.PI*2, respondT:-1, nextFlashAt: 3+Math.random()*6 });
  }
  canvas.addEventListener('pointerdown', e=>{
    placeOrRemoveFemale(e.clientX, e.clientY);
  });

  // a firefly-lit hand replaces the system cursor over the grass, showing at a glance
  // that it's touchable — reverts to the normal pointer over the sky, where tapping does nothing
  canvas.addEventListener('pointermove', e=>{
    if(e.pointerType==='touch') return;
    if(withinGrass(e.clientX, e.clientY)){
      canvas.style.cursor='none';
      cursorHint.style.display='block';
      cursorHint.style.left=e.clientX+'px';
      cursorHint.style.top=e.clientY+'px';
    } else {
      canvas.style.cursor='default';
      cursorHint.style.display='none';
    }
  });
  canvas.addEventListener('pointerleave', ()=>{
    canvas.style.cursor='default';
    cursorHint.style.display='none';
  });

  // ---------- simulation ----------
  let perfNow=0, lastT=0;
  function stepFireflies(dt, t){
    const act=activityLevel();
    const targetMales = Math.min(MAX_MALES, Math.round(females.length * (0.5+2.1*act)));
    if(males.length<targetMales && Math.random() < dt*0.7) spawnMale();
    if(males.length>targetMales && Math.random() < dt*0.5){
      const i=Math.floor(Math.random()*males.length);
      males.splice(i,1);
    }

    for(const m of males){
      m.stateT += dt;

      // fireflies never hover in place — they're always cruising, a lazy drifting
      // heading that occasionally bends toward a female who's just answered a flash
      m.steerPhase += dt*m.steerSpeed;
      let steer = Math.sin(m.steerPhase)*m.steerAmp;
      // The pull toward a female has to be stronger than the firefly's own wandering,
      // or it circles her for ever and never arrives. This used to be a flat 6 against
      // a fixed wander of 4, so it always won; when each firefly got its own turn
      // strength (4-11) the wander could outweigh it, and a male that never arrives
      // never flashes again -- see the target timeout below. Scaled off its own
      // steerAmp so it always wins, whatever that firefly's wander happens to be.
      // tanh rather than sign: a sign flips the whole steering force the instant he
      // crosses her line, which is a hard turn and then a hunt back and forth across
      // it. This eases off as he closes, so he settles onto her instead of snapping.
      if(m.target) steer += Math.tanh((m.target.x-m.x)/55)*(m.steerAmp+5);
      // turn back in from the edges by STEERING, not by reversing: flipping vx outright
      // is an instant about-face, which is one of the hard turns she reported
      if(m.x < 70)   steer += (70-m.x)*0.5;
      if(m.x > W-70) steer -= (m.x-(W-70))*0.5;
      m.vx = Math.max(-21, Math.min(21, m.vx + steer*dt));
      m.pendingX = m.x;                             // moved below, once the swoop is known

      m.airPhase += dt*(2.1+1.3*(1-m.depth));
      m.cruisePhase += dt*m.cruiseSpeed;
      m.cruisePhase2 += dt*m.cruiseSpeed2;
      m.bobPhase += dt*m.bobSpeed;

      // an idle dip: a real firefly drops and climbs again between flashes, not only
      // when it is signalling. Without this the only vertical event in a whole minute
      // is the flash swoop, and everything in between is a smooth wave.
      let idleDip = 0;
      if(m.dipping > 0){
        m.dipping -= dt;
        const q = Math.min(1, Math.max(0, 1 - m.dipping/m.dipDur));
        // eased at both ends, for the same reason the swoop is: a sin(q*PI) starts at
        // full vertical speed from a standstill, which is a lurch
        idleDip = m.dipSize*(1-Math.cos(2*Math.PI*q))/2;
      } else {
        m.dipT -= dt;
        if(m.dipT <= 0){
          m.dipDur = 0.9+Math.random()*1.8;
          m.dipping = m.dipDur;
          m.dipSize = (Math.random()<0.35 ? -1 : 1) * (8+Math.random()*26);  // sometimes a climb
          m.dipT = 3+Math.random()*9;
        }
      }
      const wanderY = Math.sin(m.cruisePhase)*m.cruiseAmp
                    + Math.sin(m.cruisePhase2)*m.cruiseAmp2 + idleDip;
      const flutter = Math.sin(m.bobPhase)*m.bobAmp;

      let swoopY=0, swoopVx=0;
      if(m.state==='cruise'){
        if(m.target){
          // A MALE WITH A TARGET NEVER COUNTS DOWN TO A FLASH -- it lights only when it
          // reaches her. So anything that stops it arriving makes it silent for ever,
          // and her report was exactly that: "there's one lightning bug that's just
          // cruising around the sky part but never lighting". Two ways it can happen:
          // its own wander outweighing the pull (fixed above), and the female being
          // taken off the dish while it is on its way, which left it chasing a ghost.
          // So it gives up: if she is gone, or it has not got there in a reasonable
          // time, the target is dropped and it goes back to flashing on its own.
          m.targetT = (m.targetT||0) + dt;
          if(females.indexOf(m.target) < 0 || m.targetT > 14){
            m.target=null; m.targetT=0;
            m.nextFlashAt=Math.min(m.nextFlashAt, 1+Math.random()*2);
          } else if(Math.abs(m.target.x-m.x) < 26){
            m.state='swoop'; m.stateT=0; m.flashedThisSwoop=false;
          }
        } else {
          m.nextFlashAt -= dt;
          if(m.nextFlashAt<=0){
            // HOW it lights, which is hers: "real ones light going up, sometimes at a
            // total hover, and sometimes going down". Up is the common one and it is
            // the J; the other two are occasional and were absent entirely — measured
            // before this, 99% of flashes happened while rising.
            const r=Math.random();
            if(r < 0.22){
              // a total hover: it lights where it is, no swoop at all, so the only
              // vertical movement is its own gentle drift
              m.flashT=0; m.hasFlashed=true; m.flashAlpha=0;
              onMaleFlash(m);
              m.nextFlashAt=(7-4*act)+Math.random()*3;
            } else {
              m.state='swoop'; m.stateT=0; m.flashedThisSwoop=false;
              // going down on the way into the dip, or up on the way out of it
              // Later in the swoop than the intent alone would suggest, because the
              // turn limit means the firefly LAGS its own intent: it is still coming
              // out of the dive at 0.78 and does not read as climbing until nearer
              // 0.85. Measured -- at 0.72-0.86 the flashes came out 28% rising and
              // 38% descending, the wrong way round.
              m.flashAt = (r < 0.42) ? 0.18+Math.random()*0.20
                                     : 0.80+Math.random()*0.13;
            }
          }
        }
      } else if(m.state==='swoop'){
        // the classic firefly J: a slow dip, then a rising curve — flashing partway
        // up out of it — rather than a straight elevator ride up and back down.
        //
        // WHERE IN THE RISE IT FLASHES IS THE WHOLE POINT, and 0.55 did not do what the
        // line above says: sin(0.55*PI) is 0.988, so the light came on at 99% of full
        // dip — the very bottom. The swoop takes 2.2-3.4s and the light is spent in
        // about half a second, so the firefly had barely climbed before it stopped
        // being visible. Weighted by how bright it actually is through the flash it sat
        // 72% of a dip below its cruising height the whole time it was lit, about 29px.
        // At 0.78 that is 25%, about 10px. And the hook gets DEEPER, not shallower: it
        // now climbs ~21px while lit against ~9px before, so the J is more of a J.
        //
        // Measured on the running piece, share of LIT fireflies above the top of the
        // grass: 16.5% before, 26.6% from the altitude fix alone, 57.0% with both.
        // The two are independent and both are needed. Don't go past ~0.85: by 0.92 the
        // light does not arrive until the climb is over and there is no hook left.
        const p=Math.min(1, m.stateT/m.swoopDur);
        // THE SWOOP HAS TO START AND END AT REST, which sin(p*PI) does not: its slope
        // at p=0 is dipAmp*PI/swoopDur, up to 80px/s, so every swoop began with the
        // firefly lurching downward from a standstill and ended by stopping dead. Her
        // report -- "they come to abrupt halts and make hard angle turns. real ones
        // don't do that." (1-cos(2*PI*p))/2 traces the same dip and back, but its
        // slope is ZERO at both ends, so it eases in and eases out.
        swoopY = m.dipAmp * (1-Math.cos(2*Math.PI*p))/2;
        // THE J LEANS, and it leans a different way for each firefly. Her question:
        // "do they only light up when traveling upward at the same angles?" They do
        // travel upward -- that is the J and it is right -- but the SAME ANGLE was a
        // side effect of moving the flash to 0.78. There the rise is near its fastest
        // (18-62px/s) while vx is capped at 26, so the vertical dominates and every
        // flash went more or less straight up. Measured at the moment of lighting:
        // 77% within 30° of vertical, against a spread of shallow rises both ways
        // before. So the swoop carries a sideways sweep too, its own size and
        // direction per firefly, which tilts the J without touching how HIGH the
        // flash happens. It is added as a velocity, not an offset, so the position
        // stays continuous when the swoop ends.
        // the same for the sideways sweep, and this one was the worst of them: as a
        // cos it was at FULL speed the instant the swoop began -- up to 108px/s against
        // a cruise of 21 -- and cut to nothing the instant it ended. This is the
        // derivative of a smooth sideways drift, so it is zero at both ends.
        swoopVx = m.swoopLean * (1-Math.cos(2*Math.PI*p)) / m.swoopDur;
        if(!m.flashedThisSwoop && p>=m.flashAt){
          m.flashedThisSwoop=true; m.hasFlashed=true; m.flashT=0; m.flashAlpha=0;
          onMaleFlash(m);
        }
        if(p>=1){
          m.state='cruise'; m.stateT=0; m.target=null; m.targetT=0;
          m.nextFlashAt=(7-4*act)+Math.random()*3;
        }
      }

      // ease up from the grass toward cruising height rather than appearing there —
      // an ease-out curve so the rise starts quick (a real hop up out of the grass)
      // and settles gently into the cruise
      let baseY = m.cruiseY;
      if(m.riseT < m.riseDur){
        m.riseT += dt;
        const p = Math.min(1, m.riseT/m.riseDur);
        const eased = 1 - Math.pow(1-p, 3);
        baseY = m.spawnY + (m.cruiseY-m.spawnY)*eased;
      }
      const px=m.x, py=m.y;

      /* A FIREFLY IS A BODY WITH A HEADING, and until here this piece had none. Her
         description, and it is the best statement of the fault anyone made all day:
         "real ones are sort of... like a model train track. you know how you can't
         have too sharp a curve or it derails? real fireflies never do sharp turns.
         they just cruise and loop, drift and curve. they may pause, but they don't
         -turn- when still, or starting to move."

         Everything above computes x and y INDEPENDENTLY -- x from a steered velocity,
         y as a position assembled from a stack of oscillators (cruise height, two
         sways, flutter, idle dip, swoop). Nothing anywhere held a direction of travel.
         So whenever the vertical stack happened to reverse while the horizontal was
         slow, the apparent heading flipped instantly: a turn with no radius at all.
         And a firefly barely moving sideways was still being carried up and down, so
         it turned while all but stationary -- the two things she says a real one never
         does.

         So everything above is now INTENT, and it is flown rather than obeyed. The
         firefly has a heading and a speed. Speed eases toward what the intent asks
         for. The heading turns toward it at a rate bounded by speed/minR -- which is
         the train track: a bounded RADIUS rather than a bounded angle, so the slower
         it goes the less it can turn, and at a standstill it cannot turn at all. It
         still cruises, loops, drifts and curves; it simply cannot corner. */
      /* The intent has to be a VELOCITY in its own right. Taking (intended position -
         ACTUAL position)/dt is what a first attempt did, and it was worse than what it
         replaced: once the flown path drifts from the intended one -- which is the whole
         point of flying it rather than obeying it -- that gap divided by a 16ms frame
         becomes an enormous velocity, and the firefly whips round chasing it. Measured,
         turning while nearly still went from 5.8 to 34.6 degrees per frame. So: the
         intent's own rate of change, plus a gentle pull back toward the height it wants,
         clamped so it can never become a lunge. */
      const wantYNow = baseY + wanderY + flutter + swoopY;
      if(m.wantYPrev === undefined) m.wantYPrev = wantYNow;
      let wantVy = (wantYNow - m.wantYPrev)/dt;
      m.wantYPrev = wantYNow;
      wantVy += Math.max(-21, Math.min(21, (wantYNow - py)*0.7));
      // "wind drifts them too, they're slow, frail little things" -- hers. The same wind
      // that bends the grass carries them, which at the default breeze is a couple of
      // px/s and at full wind is about what they fly at themselves.
      let wantVx = m.vx + swoopVx + wind*24;
      const wantSp=Math.hypot(wantVx,wantVy);

      // "they're slow, frail little things" -- so there is a speed it simply cannot
      // exceed, whatever the intent asks for. Without this the climb out of the grass
      // was the fastest thing on screen: the ease-out on that rise starts at three
      // times its average, up to ~560px/s of intent, and the firefly accelerated into
      // it, peaking at 198px/s.
      //
      // The swoop gets a little more, because the J IS an effort -- a real one puts on
      // a burst to make it. Held too low and the J flattens out: at a flat cap the
      // flashes came out 26% rising where they had been 69%, because the firefly could
      // no longer follow its own climb.
      // it surges and coasts. A crawling insect keeps one pace; a flying one is always
      // putting on a little effort and then riding it out, and measured against its own
      // average this varied by only 31% before -- steady enough to read as a walk.
      m.surgePhase += dt*m.surgeSpeed;
      const surge = 1 + 0.42*Math.sin(m.surgePhase) + 0.22*Math.sin(m.surgePhase*2.31+0.7);
      const cap = m.spMax * surge * (m.state==='swoop' ? 1.5 : 1);
      m.sp += (Math.min(wantSp, cap) - m.sp) * (1 - Math.exp(-dt/0.5));
      m.sp = Math.min(m.sp, cap);

      /* AND IT IS ALWAYS ON THAT RADIUS. Her second point, which the first pass missed:
         "they're always on it. their motion is like a sine wave. it might vary, or even
         loop back on itself, but it's always a -bend-, not a turn."

         Steering a heading toward what the intent wants lets the heading ARRIVE, and
         then the path is straight until the next correction -- straight lines joined by
         corrections, which is what a turn is. So what is driven here is the CURVATURE,
         never the heading: the firefly is always bending, the bend varies smoothly and
         sometimes tightens far enough to loop, and the intent above only biases which
         way it bends rather than commanding a direction. */
      m.curvPhase  += dt*m.curvSpeed;
      m.curvPhase2 += dt*m.curvSpeed2;
      // During a swoop the firefly is doing something deliberate, so its own idle
      // wander stands back and the intent leads. Left at equal weight the two simply
      // cancelled: the J came out flat, and the flashes read 26% rising where they had
      // been 69%, because half the time the wander was bending it the other way.
      const deliberate = m.state==='swoop';
      const wanderW = deliberate ? 0.35 : 1;
      const intentW = deliberate ? 2.2  : 1.35;
      let bend = (Math.sin(m.curvPhase)*0.62 + Math.sin(m.curvPhase2)*0.42) * wanderW;
      if(wantSp > 0.01){
        let dh = Math.atan2(wantVy,wantVx) - m.hd;
        while(dh >  Math.PI) dh -= 2*Math.PI;
        while(dh < -Math.PI) dh += 2*Math.PI;
        bend += Math.max(-1.4, Math.min(1.4, dh/0.8)) * intentW;  // bends it, never steers it
      }
      // the bend itself eases rather than switching, and can never be tighter than the
      // radius this firefly flies -- which is why it cannot turn while barely moving
      // The J is the one moment a firefly is making an effort, so it may bend harder
      // than its idle cruising radius -- a real one climbs out of the dip far more
      // decisively than it wanders. Held to the cruising radius the J flattened to
      // nothing: the flashes came out 30% rising and 36% descending, where the design
      // is 58/20. Still a bounded radius, just a tighter one for a second or two.
      const maxRate = m.sp / (m.minR * (deliberate ? 0.45 : 1));
      m.curv += (Math.max(-1,Math.min(1,bend))*maxRate - m.curv) * (1 - Math.exp(-dt/0.55));
      m.curv = Math.max(-maxRate, Math.min(maxRate, m.curv));
      m.hd += m.curv*dt;
      m.x = px + Math.cos(m.hd)*m.sp*dt;
      m.y = py + Math.sin(m.hd)*m.sp*dt;

      // it can now overshoot its band, since it may not be able to turn away in time.
      // Bank away from the edge rather than stopping dead against it.
      // near the top or the floor of its band, bank away -- still a bend, still bounded
      const top=fireflyZoneTop(), gnd=fireflyGroundY();
      const near = m.y < top+40 ? (top+40-m.y)/40 : m.y > gnd-40 ? -(m.y-(gnd-40))/40 : 0;
      if(near !== 0){
        const goingUp = Math.sin(m.hd) < 0;                   // screen y grows downward
        if((near > 0 && goingUp) || (near < 0 && !goingUp)){
          const push = Math.min(1, Math.abs(near)) * maxRate * 1.6 * (near>0?1:-1);
          m.hd += Math.max(-maxRate*1.6*dt, Math.min(maxRate*1.6*dt,
                    (Math.cos(m.hd) >= 0 ? push : -push) * dt));
        }
      }
      m.x = Math.max(6, Math.min(W-6, m.x));
      m.y = Math.max(top, Math.min(gnd, m.y));

      // which way it is actually going, for laying the body along its heading and
      // putting the lantern at the back of it
      if(dt>0){ m.vxEff=(m.x-px)/dt; m.vyEff=(m.y-py)/dt; }

      // real fireflies don't blink out — the light eases down slowly and never quite
      // reaches zero, settling to a faint ember between flashes rather than going dark
      if(m.hasFlashed){
        // the flash keeps its OWN clock rather than the swoop's, because a firefly can
        // now light while hovering, with no swoop running at all
        /* THE FLASH IS A PULSE, NOT A SPIKE. Hers: "could you make the males flash a
           little longer? maybe twice as long? and slow down the die-off of the light."
           It came up over 0.11s and then began fading immediately -- there was no hold
           at full at all, so the light was at its brightest for a single instant. It
           comes up, HOLDS, and then dies away over roughly twice the time it used to.
           Measured on the running piece, how long the light stays above a given share
           of full:
             half of full   0.32s -> 0.89
             a fifth        0.83  -> 1.83
             a tenth        1.29  -> 2.79
           And a second effect worth knowing about, because it answers her much earlier
           complaint that too few were visible at once: fireflies lit at any given
           moment went from 1.0 to 2.4. Lengthening the flash raises that without
           touching how OFTEN they flash or how many there are. */
        m.flashT += dt;
        if(m.flashT < 0.13)        m.flashAlpha = m.flashT/0.13;   // comes up
        else if(m.flashT < 0.33)   m.flashAlpha = 1;               // holds at full
        else m.flashAlpha += (LIGHT_FLOOR - m.flashAlpha) * (1 - Math.exp(-dt/0.9));
      }
    }

    for(const f of females){
      if(f.respondT>=0){
        f.respondT += dt;
        if(f.respondT>0.55) f.respondT=-1;
      }
      // she doesn't only answer males — left alone a female flashes on her own too,
      // more often on a warm, calm, humid night
      f.nextFlashAt -= dt;
      if(f.nextFlashAt<=0 && f.respondT<0){
        f.respondT=0;
        f.nextFlashAt = (11-6*act)+Math.random()*6;
      }
    }

    if(batsOn){
      const act=batActivity();
      if(bats.length<1 && Math.random()<dt*0.08*act) spawnBat();
      if(bats.length<2 && Math.random()<dt*0.01*act) spawnBat();
    } else if(bats.length){ bats = bats.filter(()=>false); }
    for(const b of bats){
      b.t += dt;
      // real bat flight is jinky, not a smooth glide — every fraction of a second it darts
      // toward a new, mostly-arbitrary heading (still biased rightward overall, or it'd
      // never cross the screen), snapping there fast rather than easing gently like the
      // fireflies' lazy cruise
      b.turnT += dt;
      if(b.turnT>=b.turnAt){
        b.turnT=0; b.turnAt=0.1+Math.random()*0.22;
        b.turnTarget=(Math.random()-0.5)*2.1;
      }
      b.heading += (b.turnTarget-b.heading) * Math.min(1, dt*9);
      b.x += Math.cos(b.heading)*b.speed*dt;
      b.y += Math.sin(b.heading)*b.speed*0.55*dt;
      b.y = Math.max(batZoneTop()-20, Math.min(horizonY()*0.9, b.y));
    }
    bats = bats.filter(b=> b.x < W+60);
  }

  function onMaleFlash(m){
    const range=180-60*m.depth;
    let closest=null, closestD=Infinity;
    for(const f of females){
      const d=Math.hypot(f.x-m.x, f.y-m.y);
      if(d<range && d<closestD){ closest=f; closestD=d; }
    }
    if(closest && closest.respondT<0){
      const female=closest;
      setTimeout(()=>{ female.respondT=0; }, 1900+Math.random()*200);
      setTimeout(()=>{
        const idle = males.filter(o=>o!==m && o.state==='cruise' && !o.target);
        const near = idle.sort((a,b)=>Math.hypot(a.x-female.x,a.y-female.y)-Math.hypot(b.x-female.x,b.y-female.y))[0];
        if(near){ near.target=female; near.targetT=0; }
      }, 2000+Math.random()*200);
    }
  }
  function flashEnvelope(p){
    if(p<0.16) return p/0.16;
    if(p>0.7) return Math.max(0,1-(p-0.7)/0.3);
    return 1;
  }

  // ---------- drawing ----------
  function drawFlash(x,y,alpha,depth,hue){
    if(alpha<=0.01) return;
    const nearness = 1-depth;
    /* THE GLOW SHRINKS TO A SPECK AND SWELLS AS IT BRIGHTENS -- hers: "when they're
       between flashes, can you make the residual glow smaller in diameter? it goes down
       to a speck and expands as it brightens." It was 0.6+0.4*alpha, so at its faintest
       it was still SIXTY per cent of full width: between flashes a firefly wore a large
       dim halo rather than a pinpoint. A real lantern's lit area really does grow and
       shrink with its output; the size and the brightness are the same thing happening.
       Now the radius is very nearly proportional to alpha, with just enough floor that
       the ember does not vanish to nothing between frames. At the ember's 0.05 the lit
       disc is about a ninth of the width of a full flash, so between flashes what you
       see is the dark speck of the body with a pinpoint at its tail -- which is her
       description of a real one -- rather than a body inside a soft lamp.

       Don't try to choose this floor by measuring the rendered glow. It is a few pixels
       across and what happens to be behind a given firefly moves the reading more than
       the setting does: a sweep of 0.13, 0.06 and 0.03 came back 7.3, 9.1 and 13.6px,
       which is backwards. The arithmetic above is the part that can be trusted. */
    const r = (3.2+7*nearness) * (0.07+0.93*alpha);
    const skyDim = 0.35+0.65*dark; // flashes read more vividly against a darker sky
    /* THE TOP OF A FLASH IS ROUNDED OFF, NOT SQUARED AGAINST WHITE. Hers, Aug 2026:
       "when the firefly starts flashing, the glow gets brighter than a real one does."
       She was right and the fault is the renderer's, not the model's. Two layers are
       laid down with 'lighter' -- a glow and a small hard lantern on top of it -- and
       at full output they sum to about 1.9x what a screen can show. Everything past
       255 is thrown away, and what is thrown away FIRST is the blue channel's
       headroom, so the flash loses its colour before it stops getting brighter.
       Measured over 200-odd flash positions on ordinary sky (stars excluded, since
       anything laid on a star clips whatever you do): at the default darkness 67.6%
       of flashes clipped to pure white and at full night 100% of them did, mean blue
       249 and 255 -- a white spark, where a real lantern is yellow-green at any
       brightness it ever reaches.

       This is musebox's waveshaper in another medium, and for the same reason: a
       soft ceiling with no lookahead, exactly y=x below the knee so everything she
       has already tuned down there passes through untouched, bending only near the
       top. The ember between flashes (LIGHT_FLOOR) and the females' resting pulse
       both sit below the knee and are byte-identical, verified.

       It is applied to the OUTPUT (alpha*skyDim) rather than to alpha, so it bites
       where the render is actually near the ceiling and barely at dusk, where the sky
       is doing half the dimming already.

       And it gives the swell back, which is the part worth knowing: the flash's own
       envelope rises to full over 0.13s, but at full night the render already read
       250 at alpha 0.60 and 255 at 1.00 -- so the top 40% of every flash was
       invisible and it snapped on rather than growing. Measured after: 151, 181,
       195, 204 across the same span, rising the whole way. Clipping is 0% at every
       position on the darkness slider, and mean blue is back to 157-169. */
    const KNEE=0.15, CEIL=0.44;
    const raw = alpha*skyDim;
    const out = raw<=KNEE ? raw : CEIL-(CEIL-KNEE)*Math.exp(-(raw-KNEE)/(CEIL-KNEE));
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    const g=ctx.createRadialGradient(x,y,0,x,y,r*3.6);
    g.addColorStop(0, `hsla(${hue},92%,72%,${out*0.95})`);
    g.addColorStop(0.35, `hsla(${hue},90%,60%,${out*0.5})`);
    g.addColorStop(1, `hsla(${hue},90%,55%,0)`);
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(x,y,r*3.6,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=`hsla(${hue},95%,85%,${out})`;
    ctx.beginPath(); ctx.arc(x,y,r*0.4,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  /* A PERCHED FEMALE IS SEEN THROUGH THE GRASS, NOT OVER IT. Hers, Sep 2026: "can you
     dim the ones that are placed, in the grass? those are usually dimmer because
     they're not on top of the grass." That is a mechanism and not a level: a male
     flashing above the sward has nothing between him and you, and a female down among
     the blades has all of it. Her light is what gets through.

     How much gets through depends on how much grass is in the way, and that grows with
     distance -- so it is keyed off where down the meadow she sits, not off a constant.
     Near the bottom of the frame she is a few feet off with sparse near blades in front;
     up by the horizon there is a whole field of it and you would barely catch her at all.
     FLOORED well above nothing on purpose: a placed firefly that cannot be seen reads as
     a firefly that was never placed, which is the "correct but reads as broken" class,
     and she has to be able to find the one she just put down.

     THESE TWO NUMBERS WERE CHOSEN AGAINST THE RENDER AND NOT AGAINST THE ARITHMETIC,
     and that matters, because the two disagree badly here. drawFlash's radius carries
     alpha in it -- her own rule that "the size and the brightness are the same thing
     happening" -- so dimming a glow SHRINKS it too, and the visible loss compounds.
     The first attempt used 0.42-0.70, which sounds like a dim and measured like an
     extinction: the resting glow, which is the whole of what you see when you put one
     down, fell to 0.28-0.49 of its peak and 0.14-0.44 of its lit AREA. Measured across
     a sweep at the same spot, the resting glow renders at 0.86 of its area at 0.90
     transmission, 0.71 at 0.85, 0.53 at 0.75 and 0.19 at 0.50 -- so a factor read off
     the physics alone will cost far more than it looks like it should. Anyone retuning
     this should sweep it and look at the rendered figures, not reason from the alpha.

     The males are deliberately left alone. They fly above the grass by design -- that
     height is hers, set over several reports -- so there is nothing in front of them,
     and dimming them would undo tuning she has already passed. */
  const GRASS_THROUGH_FAR=0.68, GRASS_THROUGH_NEAR=0.88;
  function grassThrough(y){
    const base=horizonY(), span=Math.max(1,H-base);
    const gd=Math.min(1,Math.max(0,(y-base)/span));
    return GRASS_THROUGH_FAR + (GRASS_THROUGH_NEAR-GRASS_THROUGH_FAR)*gd;
  }
  function drawFemales(){
    for(const f of females){
      const through=grassThrough(f.y);
      const pulse=0.5+0.5*Math.sin(perfNow*0.0022+f.phase);
      const restAlpha=(0.16+0.1*pulse)*(0.4+0.6*dark)*through;
      drawFlash(f.x,f.y,restAlpha,0.05,68);
      if(f.respondT>=0){
        // her answering flash comes through the same blades as her resting glow
        const a = flashEnvelope(Math.min(1,f.respondT/0.5))*through;
        drawFlash(f.x,f.y,a,0.05,64);
      }
    }
  }
  // THE INSECT ITSELF, between flashes. Her report, Aug 2026, after watching it:
  // "part of what makes watching fireflies fun in real life is that you can more or
  // less predict where they're going to light up next. at dusk there's just a hint of
  // a silhouette of them between flashes. but there's no.... path."
  //
  // She was right in the most literal way: drawMales drew ONLY the flash, so between
  // flashes there was no firefly on the screen at all. Every flash therefore arrived
  // unrelated to the last one, and the anticipation — which is most of the pleasure of
  // watching them — could not exist, because there was nothing to follow.
  //
  // It is a dark speck, not a glow, and it is tied to how much light is left in the
  // scene, which is what makes it honest rather than a marker: strongest at dusk when
  // the sky still carries light, gone by full night, and weaker below the horizon
  // where it is against dark ground instead of sky. At full dark you really cannot see
  // a firefly between flashes, and the piece should not pretend you can.
  // A FIREFLY IS A TINY BLACK SPECK WITH A BLURRY OUTLINE, and its light is at ONE END
  // of it -- hers, and the last of it is a real anatomical point rather than a stylistic
  // one: the lantern is at the tip of the abdomen, so the glow belongs at the insect's
  // tail and not in the middle of its body. A hard-edged ellipse read as "a little too
  // defined"; this is a radial gradient with nothing but soft falloff, so it has no
  // drawn edge at any size.
  function bodyLen(m){ return 0.8 + 1.7*(1-m.depth); }

  // where the lantern is: behind the insect, along the way it is travelling
  function lanternAt(m){
    const L=bodyLen(m)*1.15;
    const air = 1.0 + 1.4*(1-m.depth);
    const jx = Math.sin(m.airPhase*2.7)*air*0.5, jy = Math.sin(m.airPhase*1.9+1.1)*air;
    // behind the body along the way it is POINTING, for the same reason as above
    return [m.x + jx - Math.cos(m.hd)*L, m.y + jy - Math.sin(m.hd)*L];
  }

  function drawBody(m){
    const sky = m.y < horizonY() ? 1 : 0.4;      // against the sky, or against the field
    /* SEMI-TRANSPARENT, hers: "you can barely see the glow and you can barely see the
       bodies. they don't have as much... presence." A real firefly between flashes is
       barely there at all -- a suggestion against the sky rather than an object on it.
       This was a solid dark speck at up to 0.46 alpha, which has more presence than the
       thing it stands for. Her calibration: "i have unusually good eyesight and
       unusually fast tracking and i can -barely- see a firefly at twenty feet in the
       early dusk."
       Halved again at her ask after seeing 0.34: "if anything, they're still too
       visible." */
    const a = 0.17 * Math.pow(1-dark, 0.75) * sky;
    if(a < 0.02) return;
    const r = bodyLen(m);
    /* A FLYING FIREFLY IS NOT A BUG SHAPE. Hers, and it is most of why they read as
       "ants crawling than something flying": this drew an ELONGATED body, rotated to
       lie along its direction of travel, tracing a smooth path. An oriented body welded
       to its own track is precisely what a crawling insect looks like -- it is pushing
       against the ground, so it must point where it goes. In the air, at this size,
       there is no bug to see: "they're just.. black specks with a glowing end."
       So: a round speck, no long axis, no rotation. What the heading is still for is
       WHICH END the lantern is on -- see lanternAt -- and because the track differs
       from the heading by the wind, the glow sits slightly off the line of travel,
       which is the crab of something being carried rather than walking. */
    const air = 1.0 + 1.4*(1-m.depth);
    const jx = Math.sin(m.airPhase*2.7)*air*0.5, jy = Math.sin(m.airPhase*1.9+1.1)*air;
    ctx.save();
    ctx.translate(m.x + jx, m.y + jy);
    // translucent all the way through, not a solid middle with a soft rim: the sky
    // should come through the whole speck
    const g=ctx.createRadialGradient(0,0,0,0,0,r*1.9);
    g.addColorStop(0,   `rgba(5,7,4,${a})`);
    g.addColorStop(0.5, `rgba(5,7,4,${a*0.72})`);
    g.addColorStop(1,   'rgba(5,7,4,0)');        // no edge at all, just falloff
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(0,0,r*1.9,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function drawMales(){
    const sorted=[...males].sort((a,b)=>b.depth-a.depth);
    for(const m of sorted){
      drawBody(m);
      if(m.flashAlpha>0.008){
        const [lx,ly]=lanternAt(m);
        drawFlash(lx,ly,m.flashAlpha,m.depth,58);
      }
    }
  }
  function drawBats(){
    for(const b of bats){
      const idx=Math.floor(b.t*BAT_FLAP_HZ*8)%8;
      const img=BAT_FLY[idx];
      if(!img.complete || !img.naturalWidth) continue;
      const w=img.naturalWidth*BAT_SCALE, h=img.naturalHeight*BAT_SCALE;
      ctx.save();
      ctx.translate(b.x,b.y);
      ctx.rotate(Math.max(-0.35,Math.min(0.35,b.heading*0.4)));   // a slight bank into each jink
      ctx.drawImage(img, -w/2, -h/2, w, h);
      ctx.restore();
    }
  }

  function loop(t){
    if(!lastT) lastT=t;
    const dt=Math.min((t-lastT)/1000, 0.05);
    lastT=t; perfNow=t;

    stepFireflies(dt,t);

    ctx.clearRect(0,0,W,H);
    drawSkyPhoto();
    drawBats();
    drawGrass(t);
    drawFemales();
    drawMales();

    updateAudio(dt);
    requestAnimationFrame(loop);
  }

  // ---------- audio: crickets (Dolbear's law) + wind ----------
  let audioCtx=null, windGain=null, windFilter=null, cricketVoices=[];

  /* A browser may hand back a SUSPENDED audio context -- Safari always does until the
     visitor has interacted, and Chrome does when the context is built before any
     gesture. Nothing here ever called resume(), so where that happens the piece is
     silent for good: the context exists, so it is never rebuilt, and nothing wakes it.
     chimes is the one this could really bite, because it builds its context from the
     PHYSICS loop -- the moment two rods happen to strike -- which is not a gesture at
     all. Could not be reproduced under Chromium, which resumed it unasked; this is
     insurance against the browsers that do not, which are the ones that cannot be
     tested from here. Harmless where it is not needed. */
  addEventListener('pointerdown', function(){
    try{ if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }catch(e){}
  }, true);
  const muteCheckbox=document.getElementById('muteCheckbox'), volumeSlider=document.getElementById('volumeSlider');

  /* THE SOUND SETTING WAS NEVER REMEMBERED. Her report: "if i hit reload on the page,
     the crickets start up again even if the no sound box is checked." It was true --
     nothing here read or wrote anything, so every reload came back unmuted and at the
     default volume. Same keys roller uses, so turning the sound off on one piece turns
     it off on the others too, which is what someone means by "no sound".

     Both go through the guarded pair: localStorage does not merely come back empty when
     a browser refuses it, it THROWS, and an unguarded read at the top of a script takes
     the whole piece down. Losing the setting is nothing; losing the piece is
     everything. */
  const readStore = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
  const writeStore = (k,v) => { try{ localStorage.setItem(k,v); }catch(e){} };

  let muted = readStore('sagne-muted') === 'true';
  let volumeLevel = (()=>{ const v=parseFloat(readStore('sagne-volume'));
                           return isFinite(v) && v>=0 && v<=1 ? v : 0.6; })();
  muteCheckbox.checked = muted;
  volumeSlider.value = Math.round(volumeLevel*100);
  muteCheckbox.addEventListener('change', ()=>{
    muted = muteCheckbox.checked;
    writeStore('sagne-muted', muted ? 'true' : 'false');
  });
  volumeSlider.addEventListener('input', ()=>{
    volumeLevel = volumeSlider.value/100;
    writeStore('sagne-volume', String(volumeLevel));
  });

  function chirpRateForTemp(c){
    const pts=[[5,40],[13,60],[25,128],[30,160],[38,185]];
    if(c<=pts[0][0]) return pts[0][1];
    if(c>=pts[pts.length-1][0]) return pts[pts.length-1][1];
    for(let i=0;i<pts.length-1;i++){
      const [c0,r0]=pts[i], [c1,r1]=pts[i+1];
      if(c>=c0 && c<=c1) return r0 + (r1-r0)*(c-c0)/(c1-c0);
    }
    return 100;
  }

  function ensureAudio(){
    if(audioCtx) return;
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();

    const bufferSize=audioCtx.sampleRate*2;
    const buffer=audioCtx.createBuffer(1,bufferSize,audioCtx.sampleRate);
    const data=buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++) data[i]=Math.random()*2-1;
    const src=audioCtx.createBufferSource(); src.buffer=buffer; src.loop=true;
    windFilter=audioCtx.createBiquadFilter(); windFilter.type='bandpass'; windFilter.frequency.value=500; windFilter.Q.value=0.5;
    windGain=audioCtx.createGain(); windGain.gain.value=0;
    src.connect(windFilter).connect(windGain).connect(audioCtx.destination);
    src.start();

    for(let i=0;i<3;i++){
      cricketVoices.push({ nextAt: audioCtx.currentTime + Math.random()*1.5, pan: (Math.random()*2-1)*0.7,
        pitch: 2600+Math.random()*900, phaseMult: 0.88+Math.random()*0.24 });
    }
  }
  document.body.addEventListener('pointerdown', ensureAudio, {once:true});

  function playChirp(voice){
    if(!audioCtx || muted) return;
    const now=audioCtx.currentTime;
    const panner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
    const gain=audioCtx.createGain(); gain.gain.value=0;
    const osc=audioCtx.createOscillator(); osc.type='sine'; osc.frequency.value=voice.pitch;
    const filt=audioCtx.createBiquadFilter(); filt.type='bandpass'; filt.frequency.value=voice.pitch; filt.Q.value=6;
    osc.connect(filt).connect(gain);
    if(panner){ panner.pan.value=voice.pan; gain.connect(panner).connect(audioCtx.destination); }
    else gain.connect(audioCtx.destination);
    osc.start(now);
    const pulseN=2+Math.floor(Math.random()*2), pulseDur=0.028, gap=0.024;
    const peak=0.05*volumeLevel;
    for(let i=0;i<pulseN;i++){
      const t0=now+i*(pulseDur+gap);
      gain.gain.setValueAtTime(0,t0);
      gain.gain.linearRampToValueAtTime(peak,t0+pulseDur*0.4);
      gain.gain.linearRampToValueAtTime(0,t0+pulseDur);
    }
    const end=now+pulseN*(pulseDur+gap)+0.02;
    osc.stop(end);
  }

  function updateAudio(dt){
    if(!audioCtx) return;
    if(windGain){
      const target = muted?0:(0.006+wind*0.05)*volumeLevel;
      windGain.gain.setTargetAtTime(target, audioCtx.currentTime, 0.25);
      windFilter.frequency.setTargetAtTime(280+wind*500, audioCtx.currentTime, 0.3);
    }
    const rate=chirpRateForTemp(temp);
    const baseInterval=60/Math.max(20,rate);
    const now=audioCtx.currentTime;
    for(const v of cricketVoices){
      if(now>=v.nextAt){
        playChirp(v);
        v.nextAt = now + baseInterval*v.phaseMult*(0.85+Math.random()*0.3);
      }
    }
  }

  resize();
  requestAnimationFrame(loop);
})();
</script>

<script>
(function(){
  var disc=document.getElementById('shelfdisc'), box=document.getElementById('plates');
  var rows=[].slice.call(box.querySelectorAll('.row'));
  function unroll(){ rows.forEach(function(r){ r.classList.remove('rolled'); }); }
  function shut(){ box.classList.remove('open'); disc.setAttribute('aria-expanded','false'); unroll(); }

  /* The twenty cards behind these plates are 6.2MB and not one of them can be
     seen until a plate is opened, but every page on the site was fetching the lot
     on load, ahead of the piece's own assets. Measured on bowl at 240px with a
     slow phone's CPU and connection, the bowl had still not appeared after 100
     seconds; held back, it is there in 12.
     They are held behind data-src rather than left to loading="lazy" alone,
     because that is a heuristic and not a promise -- the same page deferred them
     on a throttled connection and fetched all twenty on a fast one, since the
     browser's idea of "near the viewport" widens with bandwidth. This is the same
     on every machine. The attribute stays as a second line for anything that
     scrolls them into view another way. */
  var wired=false;
  function fetchCards(){
    if(wired) return; wired=true;
    [].slice.call(box.querySelectorAll('img[data-src]')).forEach(function(im){
      im.src=im.getAttribute('data-src'); im.removeAttribute('data-src');
    });
  }

  disc.addEventListener('click', function(ev){
    ev.stopPropagation();
    var open=box.classList.toggle('open');
    if(open) fetchCards();
    disc.setAttribute('aria-expanded', open?'true':'false');
    if(!open) unroll();
  });

  // Same bargain the case itself strikes: a mouse can hover, so a plate is a link
  // straight to its shelf. A thumb cannot, so the first tap on a plate rolls its
  // pieces out and only the second one goes to the shelf.
  var FINE=matchMedia('(hover: hover) and (pointer: fine)');
  rows.forEach(function(row){
    row.querySelector('.tag').addEventListener('click', function(ev){
      if(FINE.matches) return;
      if(row.classList.contains('rolled')) return;
      ev.preventDefault();
      unroll(); row.classList.add('rolled');
    });
  });

  document.addEventListener('click', function(ev){
    if(!box.contains(ev.target) && ev.target!==disc) shut();
  });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') shut(); });
})();
</script>
