<script>
(function(){
  const pick=document.getElementById('musicPick'), el=document.getElementById('musicEl'),
        btn=document.getElementById('musicBtn'), name=document.getElementById('musicName');
  let list=[], idx=0;
  const label=f=> f ? f.name.replace(/\.[^.]+$/,'') : '';
  function load(i){ if(el.src) URL.revokeObjectURL(el.src); el.src=URL.createObjectURL(list[i]); name.textContent=label(list[i]); }
  function sync(){ btn.textContent = !el.src ? '🎧' : (el.paused ? '▶' : '❚❚'); btn.classList.toggle('playing', !!el.src && !el.paused); }
  btn.addEventListener('click', ()=>{ if(!list.length){ pick.click(); return; } el.paused ? el.play() : el.pause(); });
  name.addEventListener('click', ()=> pick.click());
  pick.addEventListener('change', ()=>{ if(!pick.files.length) return; list=[...pick.files]; idx=0; el.loop=(list.length===1); load(0); el.play(); });
  el.addEventListener('ended', ()=>{ if(list.length>1){ idx=(idx+1)%list.length; load(idx); el.play(); } });
  el.addEventListener('play', sync); el.addEventListener('pause', sync); el.addEventListener('loadeddata', sync);
  sync();
})();
</script>

<div id="dock">

<script>
(function(){
  const canvas=document.getElementById('scene'), ctx=canvas.getContext('2d');
  const sparrowSlider=document.getElementById('sparrowSlider');
  const crowSlider=document.getElementById('crowSlider');
  let W=0,H=0,DPR=1;

  // ---- background: a real photo, used as-is — we only draw the wire and birds on top of
  // it. Four times of day, chosen once from the visitor's own clock when the page loads
  // (not re-checked afterwards — simplest thing that reads right for a decorative piece).
  // All four photos share the same framing, so the one set of measured pole/pixel positions
  // below works for whichever one is showing.
  const SKIES={ night:'birds-background-night.png', morning:'birds-background-morning.png',
    day:'birds-background-day.png', dusk:'birds-background.png' };
  function skyForHour(h){ return (h<5||h>=21) ? 'night' : h<7 ? 'morning' : h<19 ? 'day' : 'dusk'; }
  const sky=skyForHour(new Date().getHours());
  const isNight = sky==='night';
  // the pole tops were measured directly on the photo, in its own native pixel space, then
  // mapped through the same cover-fit transform used to draw the image, so the wire's attach
  // points track the actual poles at any window size.
  const bgImg=new Image(); bgImg.src=SKIES[sky];
  const BG_W=1408, BG_H=768;
  // two wires, both strung on the same poles but attaching further down the timber — real
  // poles carry more than one crossarm. Offsets are down from the measured pole-top pixels.
  const POLE_IMG_SETS=[
    [{x:170,y:240+50},{x:1290,y:188+42}],    // upper wire
    [{x:170,y:240+100},{x:1290,y:188+85}],   // lower wire
  ];
  let bgScale=1, bgOX=0, bgOY=0;
  function fitBackground(){
    bgScale=Math.max(W/BG_W,H/BG_H);
    bgOX=(W-BG_W*bgScale)/2; bgOY=(H-BG_H*bgScale)/2;
  }
  function imgToScreen(p){ return {x:bgOX+p.x*bgScale, y:bgOY+p.y*bgScale}; }
  function drawBackground(){
    if(bgImg.complete && bgImg.naturalWidth) ctx.drawImage(bgImg,bgOX,bgOY,BG_W*bgScale,BG_H*bgScale);
    else { ctx.fillStyle='#e8935a'; ctx.fillRect(0,0,W,H); }   // plain fallback while it loads
  }

  // ---- wires: each one a chain of sample points strung between the two poles in the photo,
  // spring-damped toward a target height that's its own catenary sag plus a localized dip
  // under each bird currently sitting on THAT wire — landing/departure naturally produces a
  // dip-and-settle or a spring-back-and-oscillate, since it's just this spring chasing a
  // moving target. Two wires, same poles, independent of each other.
  const WIRE_N=48;
  let wires=[];
  function layout(){
    fitBackground();
    wires=POLE_IMG_SETS.map(([pi0,pi1])=>{
      const p0=imgToScreen(pi0), p1=imgToScreen(pi1);
      const w={poleX0:p0.x, poleY0:p0.y, poleX1:p1.x, poleY1:p1.y, pts:[]};
      for(let i=0;i<WIRE_N;i++){ const t=i/(WIRE_N-1);
        w.pts.push({t, x:w.poleX0+(w.poleX1-w.poleX0)*t, y:w.poleY0+(w.poleY1-w.poleY0)*t, vy:0}); }
      return w;
    });
  }
  // Each wire's shape comes from ONE physical process — a distributed load (the wire's own
  // constant self-weight, plus extra weight wherever a bird sitting on THAT wire is), integrated
  // twice to get a deflection curve. This is the actual math for how a loaded cable hangs. It's
  // the reason a real wire never looks like two different kinds of bend stitched together: the
  // gentle sag between birds and the deeper sag under them are the same curve family, just
  // reading different amounts of load — not a separate hand-shaped "dip" added on top of a
  // separate hand-shaped "sag".
  const BASE_LOAD=1;       // the wire's own weight, per unit length
  const BIRD_LOAD=2.5;     // how much heavier a bird makes the wire feel at its own position —
                           // a sparrow barely weighs anything next to the wire's own tension
  const DIP_SIGMA=70;      // how far a bird's weight is felt along the wire from where it sits
  const SAG_K=0.011;       // overall sag strength — tuned by eye against the unloaded droop
  function wireShape(w, wireIdx){
    const n=w.pts.length, load=new Array(n);
    for(let i=0;i<n;i++){ const x=w.pts[i].x; let l=BASE_LOAD;
      for(const b of sparrows){ if(b.wireIdx===wireIdx && (b.state==='perched'||b.state==='landing'||b.state==='shuffling'||b.state==='flapping')){
        const d=x-b.x; l += BIRD_LOAD*Math.exp(-(d*d)/(2*DIP_SIGMA*DIP_SIGMA)); } }
      load[i]=l; }
    const s=new Array(n); s[0]=0; for(let i=1;i<n;i++) s[i]=s[i-1]+load[i];    // first integral
    const c=new Array(n); c[0]=0; for(let i=1;i<n;i++) c[i]=c[i-1]+s[i];      // second integral
    const cEnd=c[n-1], target=new Array(n);
    for(let i=0;i<n;i++){ const t=w.pts[i].t;
      target[i]=w.poleY0+(w.poleY1-w.poleY0)*t + SAG_K*(cEnd*t-c[i]); }       // pin both ends back to the poles, sagging down
    return target;
  }
  function stepWire(dt){
    const k=90, damp=8.5;
    wires.forEach((w,wireIdx)=>{
      const target=wireShape(w,wireIdx);
      for(let i=0;i<w.pts.length;i++){ const p=w.pts[i], ty=target[i];
        const acc=(ty-p.y)*k - p.vy*damp;
        p.vy+=acc*dt; p.y+=p.vy*dt; }
    });
  }
  function wireYAt(wireIdx, x){
    const w=wires[wireIdx], t=Math.max(0,Math.min(1,(x-w.poleX0)/(w.poleX1-w.poleX0)));
    const i=Math.min(WIRE_N-2, Math.floor(t*(WIRE_N-1)));
    const p0=w.pts[i], p1=w.pts[i+1], lt=(t*(WIRE_N-1))-i;
    return p0.y+(p1.y-p0.y)*lt;
  }

  function drawWires(){
    ctx.strokeStyle='rgba(30,24,18,0.75)'; ctx.lineWidth=2; ctx.lineCap='round';
    for(const w of wires){
      ctx.beginPath(); ctx.moveTo(w.pts[0].x,w.pts[0].y);
      for(let i=1;i<w.pts.length;i++) ctx.lineTo(w.pts[i].x,w.pts[i].y);
      ctx.stroke();
    }
  }

  // ---- sparrow sprites: real reference photos (silhouettes on white), not drawn shapes.
  // Each one is loaded with its own anchor point — the pixel, in the ORIGINAL uncropped
  // photo, that should land exactly on the bird's simulated (x,y). For the 8-frame flight
  // loop and the approach pose, that anchor is the same fixed point (roughly the neck) in
  // every frame, measured once against the uncropped source — so cycling through frames
  // never makes the body jump around even though the wing silhouette changes size a lot.
  // For the perched/touchdown poses the anchor is where the reference wire crosses the
  // photo, so the feet land exactly on our own wire regardless of window size.
  // White backgrounds render as pure silhouettes via 'multiply' blending (draw() below) —
  // white multiplies to no-op, black multiplies to black, no cutout/alpha-matte needed.
  // some crow reference photos have their own perch branch baked into the crop, thicker than
  // and at the wrong angle for the thin wire we draw underneath. `trim` fades that branch out
  // beyond the bird's own feet (a band of half-width `halfW` around x=ax, cut off entirely
  // past y=cutY) so our real wire shows through instead of the mismatched one from the photo.
  function sprite(file,w,h,ax,ay,nativeFacing,trim){
    const img=new Image();
    const sp={img,w,h,ax,ay,nativeFacing:nativeFacing||-1,masked:null};
    img.onload=function(){
      if(!trim) return;
      const off=document.createElement('canvas'); off.width=w; off.height=h;
      const octx=off.getContext('2d');
      octx.drawImage(img,0,0,w,h);
      const id=octx.getImageData(0,0,w,h), d=id.data;
      const {bandY,halfW,cutY,feather=4}=trim;
      for(let py=0; py<h; py++){
        for(let px=0; px<w; px++){
          let keep=1;
          if(py>bandY){ const dx=Math.abs(px-ax)-halfW; if(dx>0) keep=Math.min(keep,Math.max(0,1-dx/feather)); }
          if(py>cutY){ const dy=py-cutY; keep=Math.min(keep,Math.max(0,1-dy/feather)); }
          if(keep<1){ const idx=(py*w+px)*4; d[idx+3]=Math.round(d[idx+3]*keep); }
        }
      }
      octx.putImageData(id,0,0);
      sp.masked=off;
    };
    img.src='bird-sprites/'+file;
    return sp;
  }
  const FLY_FRAMES=[
    sprite('bird-fly-1.png',424,396,8,282),
    sprite('bird-fly-2.png',426,196,10,45),
    sprite('bird-fly-3.png',502,269,80,45),
    sprite('bird-fly-4.png',429,266,7,45),
    sprite('bird-fly-5.png',433,311,7,206),
    sprite('bird-fly-6.png',433,367,7,261),
    sprite('bird-fly-7.png',466,359,40,253),
    sprite('bird-fly-8.png',424,396,8,282),
  ];
  const LAND_APPROACH=sprite('bird-land-approach.png',463,456,19,257);
  const TOUCHDOWN=sprite('bird-touchdown.png',410,397,205,369);
  const PERCH_VARIANTS=[
    sprite('bird-perch.png',515,307,257.5,279,-1),
    sprite('bird-perch-alt.png',593,365,296.5,343,1),
    sprite('bird-perch-back.png',241,431,120.5,346,-1),
  ];
  // a real hop-shuffle, not a slide: crouch (anticipate) -> launch (a quick, brief hop,
  // held for less time than the others so it reads as fast) -> settle (impact)
  const SHUFFLE_CROUCH=sprite('bird-shuffle-crouch.png',534,239,219,199);
  const SHUFFLE_LAUNCH=sprite('bird-shuffle-launch.png',438,432,255,290);
  const SHUFFLE_SETTLE=sprite('bird-shuffle-settle.png',444,284,147,240);
  const SHUFFLE_CROUCH_END=0.30, SHUFFLE_LAUNCH_END=0.45;   // fractions of the shuffle's total duration
  const BIRD_SCALE=0.045;   // sprite pixels -> screen pixels, tuned by eye
  const SPRITE_FLAP_HZ=4.2; // full 8-frame flap cycles per second

  // ---- crows: a second, larger, rarer species. Same silhouette/multiply-blend approach as
  // the sparrows above, but crows have no shuffle-hop reference photos — when a crow would
  // need to make room for a new arrival it just flaps in place or leaves, never shuffles.
  const CROW_FLY=[
    sprite('crow-fly-1.png',264,287,180,165,1),
    sprite('crow-fly-2.png',315,131,200,35,1),
    sprite('crow-fly-3.png',307,138,210,35,1),
    sprite('crow-fly-4.png',310,133,205,35,1),
    sprite('crow-fly-5.png',262,179,185,65,1),
    sprite('crow-fly-6.png',262,282,190,165,1),
    sprite('crow-fly-7.png',261,282,190,165,1),
    sprite('crow-fly-8.png',261,277,185,165,1),
  ];
  const CROW_LAND_APPROACH=sprite('crow-land-approach.png',268,262,195,135,1);
  // touchdown and every perch variant below replaced entirely (not just re-masked) with real
  // reference photos from the birdbest sheet — the old touchdown crop had a branch baked in at
  // a real diagonal angle that no amount of retuning the trim band ever fully cleared (see the
  // git history for two prior attempts), and rather than keep patching a source image that
  // fights the trim approach by construction, these are cut clean with no perch/branch baked in
  // at all, so no masking is needed here. Only three single-bird poses were available (a fourth
  // shows two crows preening each other, not usable as one sprite), so perch-back reuses the
  // calm perch pose. crow-perch-sleep.png is NOT a resting pose despite the name — it shows a
  // wing half-spread mid-flutter, so it's used only for the brief touchdown moment below, never
  // as one of the static perched variants (a crow would otherwise sit holding that off-balance
  // pose indefinitely). Flight frames are untouched: the existing 8-frame flap cycle is already
  // real reference photos of good quality, no fix needed there.
  const CROW_TOUCHDOWN=sprite('crow-touchdown.png',206,148,86,147,1);
  const CROW_PERCH_VARIANTS=[
    sprite('crow-perch.png',125,192,60,164,1),
    sprite('crow-perch-alt.png',184,190,127.5,189,1),
    sprite('crow-perch-back.png',125,192,60,164,1),
  ];
  const CROW_SCALE=0.17;   // crows read as a noticeably bigger bird than sparrows, tuned by eye

  // ---- owls: a third species, and the only one that ever shows up once night has fallen —
  // no other bird here would plausibly be out at that hour, so on the night background these
  // replace sparrows and crows entirely, and rarely: at most one at a time, see owlTimer below.
  // real reference photos now (from the same "study each species separately" pass that
  // produced the birdbest sheet), replacing the small, low-res stock-clipart owl this used to
  // be. Only one clean flying pose was available (a wide, broad-wing glide) rather than a full
  // flap cycle — used for both fly frames and reused for the approach, which is an honest
  // simplification, not a placeholder: a real owl's flight is slow and near-silent, close to a
  // held glide rather than a fast flap, so a near-static wing pose across these three reads
  // as more correct for this species than it would for a sparrow or crow.
  const OWL_FLY=[
    sprite('owl-fly-1.png',440,200,220,90,1),
    sprite('owl-fly-2.png',440,200,220,90,1),
  ];
  const OWL_LAND_APPROACH=sprite('owl-land-approach.png',440,200,220,90,1);
  const OWL_TOUCHDOWN=sprite('owl-touchdown.png',150,232,75,215,1,{bandY:180,halfW:8,cutY:222,feather:6});
  const OWL_PERCH_VARIANTS=[
    sprite('owl-perch.png',190,232,78,215,1,{bandY:180,halfW:8,cutY:222,feather:6}),
    sprite('owl-perch-alt.png',150,232,75,215,1,{bandY:180,halfW:8,cutY:222,feather:6}),
  ];
  const OWL_SCALE=0.19;   // a barn owl reads as bigger again than a crow, tuned by eye

  // draws any of the sprites above at (x,y), silhouette-only via multiply blending, flipped
  // to match the bird's actual facing against however that sprite was originally drawn
  function drawSprite(sp, x, y, facing, scale){
    if(!sp.img.complete || !sp.img.naturalWidth) return;
    scale = scale || BIRD_SCALE;
    const flip = facing===sp.nativeFacing ? 1 : -1;
    const src = sp.masked || sp.img;
    ctx.save();
    ctx.translate(x,y); ctx.scale(flip,1);
    ctx.globalCompositeOperation='multiply';
    ctx.drawImage(src, -sp.ax*scale, -sp.ay*scale, sp.w*scale, sp.h*scale);
    ctx.restore();
  }

  // ---- sparrows ----
  let sparrows=[], idc=0;
  const PSR=34;           // personal-space radius — closer than this and a perched neighbour
                           // reacts (shuffles or flaps); this is a comfort threshold, not a
                           // collision one
  const MIN_SEP=22;        // the only hard rule: two birds may never actually overlap. Smaller
                           // than PSR on purpose — a new arrival can land inside another bird's
                           // personal space (triggering its shuffle reaction) without the two
                           // ever visually overlapping
  function flyFrame(wingPhase, species){
    const frames = species==='crow' ? CROW_FLY : species==='owl' ? OWL_FLY : FLY_FRAMES;
    const n=frames.length, idx=Math.floor((wingPhase/(2*Math.PI))*n)%n;
    return frames[(idx+n)%n];
  }
  function perchVariants(species){
    return species==='crow' ? CROW_PERCH_VARIANTS : species==='owl' ? OWL_PERCH_VARIANTS : PERCH_VARIANTS;
  }
  // a spot is only free if it's clear of every other bird on that wire — including ones
  // still mid-flight toward their own landing spot, not just ones already perched, so two
  // birds never converge on the same stretch of wire at once
  function spotFree(wireIdx, x){
    return !sparrows.some(b=>{
      if(b.wireIdx!==wireIdx || b.state==='departing') return false;
      const bx=(b.state==='arriving'||b.state==='landing') ? b.targetX : b.x;
      return Math.abs(bx-x)<MIN_SEP;
    });
  }
  function pickLanding(){
    // prefer landing near an existing sparrow (on whichever wire it's on), otherwise pick
    // a wire at random and land near its centre — but only ever at a spot that's actually
    // clear, searching outward if the first guess is already taken. Landing inside another
    // bird's PSR (but outside MIN_SEP) is fine and expected — that's what triggers a shuffle.
    const settled=sparrows.filter(b=>b.state!=='departing');
    // left unchecked, "anchor near any settled bird" is self-reinforcing — the first couple
    // of birds landing on one wire by chance makes every later bird more likely to join them
    // there too, and the other wire stays empty. Force a landing on whichever wire currently
    // has fewer birds whenever the gap between them grows, so both wires actually get used —
    // a bird still lands near a neighbour on that wire when one's already there.
    const counts=wires.map((_,i)=>settled.filter(b=>b.wireIdx===i).length);
    if(Math.random()<0.4 || Math.max(...counts)-Math.min(...counts)>=2){
      const wireIdx=counts.indexOf(Math.min(...counts)), w=wires[wireIdx];
      const onThisWire=settled.filter(b=>b.wireIdx===wireIdx);
      for(let attempt=0; attempt<16; attempt++){
        let x;
        if(onThisWire.length){ const anchor=onThisWire[Math.floor(Math.random()*onThisWire.length)];
          const side=Math.random()<0.5?-1:1;
          x=Math.max(w.poleX0+30,Math.min(w.poleX1-30, anchor.x+side*(MIN_SEP+Math.random()*PSR*0.9)));
        } else { x=(w.poleX0+w.poleX1)/2 + (Math.random()-0.5)*60; }
        if(spotFree(wireIdx,x)) return {wireIdx,x};
      }
    }
    for(let attempt=0; attempt<16 && settled.length; attempt++){
      const anchor=settled[Math.floor(Math.random()*settled.length)];
      const w=wires[anchor.wireIdx];
      const side=Math.random()<0.5?-1:1;
      const x=Math.max(w.poleX0+30,Math.min(w.poleX1-30, anchor.x+side*(MIN_SEP+Math.random()*PSR*0.9)));
      if(spotFree(anchor.wireIdx,x)) return {wireIdx:anchor.wireIdx, x};
    }
    for(let attempt=0; attempt<24; attempt++){
      const wireIdx=Math.floor(Math.random()*wires.length), w=wires[wireIdx];
      const x=w.poleX0+30+Math.random()*(w.poleX1-w.poleX0-60);
      if(spotFree(wireIdx,x)) return {wireIdx,x};
    }
    // wires are genuinely packed — just take the roomiest spot available on either one
    let best=null, bestGap=-1;
    for(let wireIdx=0; wireIdx<wires.length; wireIdx++){ const w=wires[wireIdx];
      for(let x=w.poleX0+30; x<=w.poleX1-30; x+=10){
        let gap=Infinity;
        for(const b of sparrows){ if(b.wireIdx===wireIdx && b.state!=='departing'){
          const bx=(b.state==='arriving'||b.state==='landing')?b.targetX:b.x;
          gap=Math.min(gap,Math.abs(bx-x)); } }
        if(gap>bestGap){ bestGap=gap; best={wireIdx,x}; }
      }
    }
    return best || {wireIdx:0, x:(wires[0].poleX0+wires[0].poleX1)/2};
  }
  // how long a bird sticks around once it's settled — mostly brief visits, with a long tail
  // of birds that stay a while, so the wire never looks like it's just population-managed
  function randomStayFor(){
    return Math.random()<0.4 ? 3+Math.random()*7 : 10+Math.random()*35;
  }
  function spawnSparrow(species){
    const fromLeft=Math.random()<0.5;
    const {wireIdx,x:targetX}=pickLanding();
    // an owl is a rare enough sighting that it should linger, not just pass through like the
    // ambient sparrow/crow traffic
    const stayFor = species==='owl' ? 25+Math.random()*60 : randomStayFor();
    const b={id:idc++, species, state:'arriving', x: fromLeft?-40:W+40, y:H*0.25+Math.random()*60,
      targetX, wireIdx, facing: fromLeft?1:-1, wingPhase:Math.random()*7, t:0, shuffleFrom:0, shuffleTo:0, shuffleT:0,
      perchVariant:Math.floor(Math.random()*perchVariants(species).length), stayFor, stayTimer:0};
    sparrows.push(b);
  }

  // when a bird lands near others, a crowded neighbour either shuffles away, flaps in place
  // if there's nowhere to go, or — sometimes — just leaves outright, spooked by the new
  // arrival rather than merely repositioning. Only ever affects birds on the same wire.
  function settleCrowding(wireIdx, landedX){
    const w=wires[wireIdx];
    for(const n of sparrows){
      if(n.state!=='perched' || n.wireIdx!==wireIdx) continue;
      const d=n.x-landedX;
      if(Math.abs(d)<PSR){
        const dir=d>=0?1:-1;
        if(Math.random()<0.18){ n.state='departing'; n.t=0; n.facing=-dir; continue; }
        // crows (and owls) have no shuffle-hop reference photos — they either flap in place
        // or leave, never shuffle, regardless of whether there'd be room to make
        if(n.species==='crow'||n.species==='owl'){ n.state='flapping'; n.t=0; continue; }
        const roomTo=n.x+dir*PSR*1.15;
        const blocked = sparrows.some(o=>o!==n && o.wireIdx===wireIdx && (o.state==='perched'||o.state==='shuffling') && Math.abs(o.x-roomTo)<PSR*0.55)
          || roomTo<w.poleX0+30 || roomTo>w.poleX1-30;
        if(!blocked){ n.state='shuffling'; n.shuffleFrom=n.x; n.shuffleTo=roomTo; n.shuffleT=0; n.facing=dir; }
        else { n.state='flapping'; n.t=0; }
      }
    }
  }

  function updateSparrows(dt){
    for(const b of sparrows){
      b.t+=dt; b.wingPhase+=dt*SPRITE_FLAP_HZ*2*Math.PI;
      if(b.state==='arriving'){
        const landY=wireYAt(b.wireIdx,b.targetX)-8;
        const dx=b.targetX-b.x, dy=landY-b.y, dist=Math.hypot(dx,dy);
        const speed=220;
        if(dist<6){ b.state='landing'; b.t=0; b.x=b.targetX; b.y=landY; settleCrowding(b.wireIdx,b.targetX); }
        else { b.x+=dx/dist*speed*dt; b.y+=dy/dist*speed*dt; b.facing=dx>=0?1:-1; }
      } else if(b.state==='landing'){
        // reaching-down approach pose gives way to feet-just-touched once close enough to
        // the wire — the approach sprite has no wire reference of its own, so it's anchored
        // the same way flight frames are (a neck point, a little above true perch height)
        b.y = b.t<0.15 ? wireYAt(b.wireIdx,b.x)-8 : wireYAt(b.wireIdx,b.x);
        if(b.t>0.28) b.state='perched';
      } else if(b.state==='perched'){
        b.y=wireYAt(b.wireIdx,b.x);
        b.stayTimer+=dt;
        if(b.stayTimer>=b.stayFor){ b.state='departing'; b.t=0; b.facing=Math.random()<0.5?-1:1; }
      } else if(b.state==='shuffling'){
        // three real phases, not one smooth slide: crouch in place, a quick hop with a
        // little lift, then settle at the new spot — SHUFFLE_LAUNCH_END-SHUFFLE_CROUCH_END
        // is deliberately short so the hop itself reads as fast, per the reference sequence
        b.shuffleT+=dt/0.5;
        const s=Math.min(1,b.shuffleT);
        let posT;
        if(s<SHUFFLE_CROUCH_END) posT=0;
        else { const u=(s-SHUFFLE_CROUCH_END)/(1-SHUFFLE_CROUCH_END); posT=u<0.5?2*u*u:1-Math.pow(-2*u+2,2)/2; }
        b.x=b.shuffleFrom+(b.shuffleTo-b.shuffleFrom)*posT;
        const inHop = s>=SHUFFLE_CROUCH_END && s<SHUFFLE_LAUNCH_END;
        const lift = inHop ? Math.sin(((s-SHUFFLE_CROUCH_END)/(SHUFFLE_LAUNCH_END-SHUFFLE_CROUCH_END))*Math.PI)*14 : 0;
        b.y=wireYAt(b.wireIdx,b.x)-lift;
        if(s>=1) b.state='perched';
      } else if(b.state==='flapping'){
        b.y=wireYAt(b.wireIdx,b.x)-8-Math.abs(Math.sin(b.wingPhase*0.5))*2;
        if(b.t>0.45) b.state='perched';
      } else if(b.state==='departing'){
        b.y-=70*dt; b.x+=b.facing*160*dt;
      }
    }
    sparrows=sparrows.filter(b=> !(b.state==='departing' && (b.x<-60||b.x>W+60)));
  }

  // ---- drawing: real reference-photo sprites, picked by state ----
  function drawSparrow(b){
    const isCrow = b.species==='crow', isOwl = b.species==='owl';
    const scale = isCrow ? CROW_SCALE : isOwl ? OWL_SCALE : BIRD_SCALE;
    if(b.state==='arriving'||b.state==='departing'||b.state==='flapping'){
      drawSprite(flyFrame(b.wingPhase, b.species), b.x, b.y, b.facing, scale);
    } else if(b.state==='landing'){
      const approach = isCrow ? CROW_LAND_APPROACH : isOwl ? OWL_LAND_APPROACH : LAND_APPROACH;
      const touchdown = isCrow ? CROW_TOUCHDOWN : isOwl ? OWL_TOUCHDOWN : TOUCHDOWN;
      drawSprite(b.t<0.15 ? approach : touchdown, b.x, b.y, b.facing, scale);
    } else if(b.state==='shuffling'){
      const s=b.shuffleT;
      const sp = s<SHUFFLE_CROUCH_END ? SHUFFLE_CROUCH : s<SHUFFLE_LAUNCH_END ? SHUFFLE_LAUNCH : SHUFFLE_SETTLE;
      drawSprite(sp, b.x, b.y, b.facing, scale);
    } else {
      drawSprite(perchVariants(b.species)[b.perchVariant], b.x, b.y, b.facing, scale);
    }
  }

  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth; H=window.innerHeight;
    canvas.width=W*DPR; canvas.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
    layout();
  }
  window.addEventListener('resize',resize);

  let wantSparrows=6, wantCrows=2;
  sparrowSlider.addEventListener('input',()=>{ wantSparrows=+sparrowSlider.value; });
  crowSlider.addEventListener('input',()=>{ wantCrows=+crowSlider.value; });
  let spawnTimer=0;
  // the first owl of the night waits a little before showing up, rather than arriving the
  // instant the page loads — then a long, randomised gap between sightings after that
  let owlTimer=20+Math.random()*40;

  let last=performance.now();
  function tick(now){
    const dt=Math.min((now-last)/1000,0.05); last=now;
    // each slider is a target level of activity, not a hard cap — birds come and go on their
    // own (see stayFor/settleCrowding), and arrivals just get more likely the further below
    // that target the current count sits, tapering to a low ambient trickle once at or above it.
    // none of this runs at night — sparrows and crows are day birds, and stay off the wires
    // once the owl background is up.
    spawnTimer-=dt;
    if(spawnTimer<=0){
      spawnTimer=0.4+Math.random()*0.9;
      if(!isNight){
        for(const [species,wantCount] of [['sparrow',wantSparrows],['crow',wantCrows]]){
          const alive=sparrows.filter(b=>b.species===species && b.state!=='departing').length;
          if(wantCount>0 && alive<wantCount+1){
            const pressure=Math.max(0,wantCount-alive)/Math.max(1,wantCount);
            if(Math.random()<0.12+0.7*pressure) spawnSparrow(species);
          }
        }
      }
    }
    // one rare owl at a time, only once night has fallen
    if(isNight){
      owlTimer-=dt;
      if(owlTimer<=0){
        owlTimer=90+Math.random()*150;   // roughly every couple of minutes, never rushed
        if(!sparrows.some(b=>b.species==='owl' && b.state!=='departing')) spawnSparrow('owl');
      }
    }

    stepWire(dt);
    updateSparrows(dt);

    ctx.clearRect(0,0,W,H);
    drawBackground();
    drawWires();
    const order=[...sparrows].sort((a,b)=>a.y-b.y);
    for(const b of order) drawSparrow(b);

    requestAnimationFrame(tick);
  }
  resize(); requestAnimationFrame(tick);
})();
</script>

<script>
(function(){
  var disc=document.getElementById('shelfdisc'), box=document.getElementById('plates');
  var rows=[].slice.call(box.querySelectorAll('.row'));
  function unroll(){ rows.forEach(function(r){ r.classList.remove('rolled'); }); }
  function shut(){ box.classList.remove('open'); disc.setAttribute('aria-expanded','false'); unroll(); }

  disc.addEventListener('click', function(ev){
    ev.stopPropagation();
    var open=box.classList.toggle('open');
    disc.setAttribute('aria-expanded', open?'true':'false');
    if(!open) unroll();
  });

  // Same bargain the case itself strikes: a mouse can hover, so a plate is a link
  // straight to its shelf. A thumb cannot, so the first tap on a plate rolls its
  // pieces out and only the second one goes to the shelf.
  var FINE=matchMedia('(hover: hover) and (pointer: fine)');
  rows.forEach(function(row){
    row.querySelector('.tag').addEventListener('click', function(ev){
      if(FINE.matches) return;
      if(row.classList.contains('rolled')) return;
      ev.preventDefault();
      unroll(); row.classList.add('rolled');
    });
  });

  document.addEventListener('click', function(ev){
    if(!box.contains(ev.target) && ev.target!==disc) shut();
  });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') shut(); });
})();
</script>
