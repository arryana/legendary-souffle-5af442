<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a86a3a"/>
      <stop offset="55%" stop-color="#7a4a26"/>
      <stop offset="100%" stop-color="#5a341a"/>
    </linearGradient>
  </defs>
  <!-- stem -->
  <path d="M16 3 L16 6.5" stroke="#4a2f1a" stroke-width="1.4" stroke-linecap="round"/>
  <!-- cone body: wider near the top, tapering to a point at the base -->
  <path d="M16 6 C 24 6.5 27 12 25.5 18 C 24.3 23.5 20.5 28.5 16 30
           C 11.5 28.5 7.7 23.5 6.5 18 C 5 12 8 6.5 16 6 Z"
        fill="url(#cone)" stroke="#3f2513" stroke-width="0.8"/>
  <!-- overlapping scale rows, alternating offset like real pinecone scales -->
  <g fill="#c98a4a" opacity="0.9">
    <path d="M9 11 Q11.5 9.3 14 11 Q11.5 12.6 9 11 Z"/>
    <path d="M15 10.3 Q17.5 8.6 20 10.3 Q17.5 11.9 15 10.3 Z"/>
    <path d="M20.5 12.5 Q22.6 11.2 24.2 13 Q22.3 14 20.5 12.5 Z"/>
    <path d="M7.7 15 Q10 13.4 12.6 15.2 Q10 16.7 7.7 15 Z"/>
    <path d="M13.2 14.6 Q16 12.7 18.8 14.6 Q16 16.4 13.2 14.6 Z"/>
    <path d="M19.5 15.6 Q21.9 14.1 23.8 16.2 Q21.7 17.4 19.5 15.6 Z"/>
    <path d="M8.5 19 Q11 17.4 13.6 19.2 Q11 20.7 8.5 19 Z"/>
    <path d="M13.8 19 Q16 17.3 18.6 19 Q16 20.7 13.8 19 Z"/>
    <path d="M18.9 19.3 Q21.1 17.9 23 19.8 Q21 21 18.9 19.3 Z"/>
    <path d="M10.2 22.8 Q12.3 21.4 14.5 23 Q12.3 24.4 10.2 22.8 Z"/>
    <path d="M14.6 23 Q16.3 21.6 18.7 23 Q16.3 24.5 14.6 23 Z"/>
    <path d="M17.8 23 Q19.9 21.6 21.7 23.2 Q19.7 24.5 17.8 23 Z"/>
    <path d="M12.2 26.2 Q14.1 24.9 16 26.2 Q17.9 24.9 19.8 26.2 Q16 28.4 12.2 26.2 Z"/>
  </g>
  <!-- soft highlight down the left side -->
  <path d="M10.5 10.5 Q8 17 12 27" fill="none" stroke="#e0ac6a" stroke-width="0.9" opacity="0.4" stroke-linecap="round"/>
</svg>
