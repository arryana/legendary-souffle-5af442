<style>
  :root{
    --bg1:#3a2f22; --bg2:#282016;
    --brass:#c9974e; --parchment:#f2e9d8;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    height:100%; margin:0; overflow:hidden;
    background:#0f1420;
    font-family: Georgia, serif; color:var(--parchment);
  }
  #backlink{
    position:fixed; top:18px; left:22px; z-index:50;
    color:var(--parchment); opacity:.5; text-decoration:none;
    font-size:14px; letter-spacing:.04em; text-shadow:0 1px 3px rgba(0,0,0,.85), 0 0 9px rgba(0,0,0,.55); transition:opacity .3s ease;
  }
  #backlink:hover{opacity:.9;}
  #hint{
    position:fixed; top:22px; right:26px; font-size:12px; opacity:.4;
    letter-spacing:.03em; z-index:40; text-align:right; max-width:220px;
  }

  #stage{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
  }
  #groundWrap{
    position:relative;
    width:min(88vw, 720px); height:min(66vw, 480px);
    max-height:56vh;
    border-radius:6px;
    box-shadow: 0 25px 70px rgba(0,0,0,0.6), 0 0 0 8px #241a10, 0 0 0 9px rgba(201,151,78,0.3);
    overflow:hidden;
  }
  canvas{ width:100%; height:100%; display:block; touch-action:none; }

  #dock{
    position:fixed; bottom:0; left:0; right:0;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    padding:14px 18px 24px;
    background:linear-gradient(to top, rgba(10,13,20,.85), rgba(10,13,20,0));
    z-index:40;
  }
  .dockRow{
    display:flex; flex-direction:row; flex-wrap:wrap;
    justify-content:center; align-items:center;
    gap:14px 26px;
    width:min(88vw, 720px);
  }
  .sliderRow{ display:flex; align-items:center; gap:10px; }
  .sliderRow input[type=checkbox]{
    -webkit-appearance:none; appearance:none;
    width:16px; height:16px; border-radius:4px;
    border:1px solid rgba(242,233,216,.4);
    background:transparent; cursor:pointer; position:relative;
    margin:0;
  }
  .sliderRow input[type=checkbox]:checked{
    background:rgba(201,151,78,0.25); border-color:var(--brass);
  }
  .sliderRow input[type=checkbox]:checked::after{
    content:''; position:absolute; left:4px; top:1px;
    width:4px; height:8px;
    border:solid var(--brass); border-width:0 2px 2px 0;
    transform:rotate(45deg);
  }
  input[type=range]{
    -webkit-appearance:none; appearance:none;
    width:120px; height:3px; border-radius:3px;
    background:rgba(242,233,216,.25); outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
    background:var(--brass); cursor:pointer;
    box-shadow:0 0 6px rgba(201,151,78,.6);
  }
  input[type=range]::-moz-range-thumb{
    width:14px; height:14px; border-radius:50%; border:none;
    background:var(--brass); cursor:pointer;
  }
  /* THE THREE OBJECTS ARE DRAWN, NOT EMOJI, and there were two reasons.
     🪨 and 🪵 both arrived in 2020, and the oldest machine this is tested on is a
     Kindle Fire -- the newest emoji it is actually PROVEN to render is 2017 (bowl's
     🥣 and candler's 🧘, both of which passed on it), so these two were three years
     past anything demonstrated and would have come up as empty boxes if they were
     missing. And the `color:var(--brass)` below never reached any of the three
     anyway: a colour emoji is a bitmap the font hands over whole, so it takes no
     colour from CSS -- which is musebox's white rabbit again. 🍃 renders everywhere
     and was drawn along with them, because two brass outlines beside one green
     emoji is worse than either. */
  .iconBtn svg{ width:17px; height:17px; display:block; }
  .iconBtn{
    width:30px; height:30px; border-radius:50%;
    border:1px solid rgba(242,233,216,.3); background:transparent;
    font-size:14px; cursor:pointer; opacity:.6;
    display:flex; align-items:center; justify-content:center;
    transition:all .25s ease;
  }
  .iconBtn.active{
    opacity:1; border-color:var(--brass); background:rgba(201,151,78,0.18);
  }
  /* A 3-inch phone turned sideways is 180px tall and this dock alone is 282 --
     there is no arrangement that fits, so this one is allowed to SCROLL, which
     is the answer she took for kaleidoscope and for storm. Measured before it,
     three sliders (count, speed and light) sat ABOVE the top of the screen, on a
     page that could not scroll to them at all. Both qualifiers are load-bearing:
     the same phone is 350px tall upright, where everything already fits and a
     scroll would be a page scrolling that did not need to; and a Kindle in
     landscape is 476 tall and never reaches this. */
  @media (max-height: 430px) and (orientation: landscape){
    html,body{ height:auto; overflow:visible; }
    #stage{ position:relative; inset:auto; padding:14px 0 6px; }
    #dock{ position:relative; bottom:auto; }
  }
  /* Her report off the Jelly Star. At 240 a slider row wants 149px against the
     211px the dock has, so nothing could share a line and all eight rows stacked:
     315px of a 350px screen, with the scene drawn full size behind it. Same shape
     as chimes'. The rows give up slider length so they pair two to a line, and the
     ground is then fitted to the band that is actually left -- under the two brass
     discs, above the dock -- keeping its own 4:3 so the scene is never stretched.
     Above 320 none of this applies. */
  @media (max-width: 320px){
    #dock{ padding:10px 12px 14px; gap:6px; }
    .dockRow{ gap:8px 14px; }
    .sliderRow{ gap:6px; }
    #dock input[type=range]{ width:58px; }
    #dock .iconBtn{ width:26px; height:26px; }
    #dock .iconBtn svg{ width:15px; height:15px; }
  }
</style>

  /* The way back is the brass disc off the shelf's plinth, with an arrow cut into

<style>
  #music{ position:fixed; left:18px; bottom:16px; z-index:60; display:flex; align-items:center; gap:9px; }
  #musicBtn{ width:34px; height:34px; border-radius:50%; border:1px solid rgba(242,233,216,.25); background:rgba(20,24,34,.55); color:#f2e9d8; font-size:15px; line-height:1; cursor:pointer; opacity:.55; transition:opacity .3s, color .3s, border-color .3s; -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); }
  #musicBtn:hover{ opacity:1; }
  #musicBtn.playing{ color:#f0d69a; border-color:rgba(201,151,78,.6); opacity:.9; }
  #musicName{ max-width:40vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; color:#f2e9d8; opacity:0; transition:opacity .3s; letter-spacing:.02em; cursor:pointer; }
  #music:hover #musicName{ opacity:.55; }
  /* a phone has no hover, so the name of the visitor's own track was never
     visible on one at all -- and worse, an invisible thing sat there taking
     taps. While something is playing it simply shows, next to the button.
     Not a caption on the piece: it is their file's name, not the site's words. */
  #musicBtn.playing ~ #musicName{ opacity:.5; }
  /* The music button is pinned in the bottom-left corner and the piece's own
     dock runs the width of the screen, so on a narrow one they land on top of
     each other -- and the button wins, being the higher layer. Rather than
     reshape the dock, the furniture gives way: the headphones sit just above
     it. The offset is this dock's own measured height plus a little. */
  /* lifted clear of the dock -- and this figure is the DOCK'S OWN HEIGHT plus a
     gap, so it has to move when the dock does. It was 323px, for a dock that was
     323px tall; with the dock down to 136 that put the headphones 7px off the TOP
     of a 350px screen, over the back disc. Measured: 136px at 240, 280 and 320. */
  @media (max-width: 320px){ #music{ bottom:146px; } }
</style>
<div id="music" title="play your own music">
  <button id="musicBtn" aria-label="play your own music">🎧</button>
  <span id="musicName"></span>
</div>
<input type="file" id="musicPick" accept="audio/*" multiple hidden>
<audio id="musicEl"></audio>
<script>
(function(){
  const pick=document.getElementById('musicPick'), el=document.getElementById('musicEl'),
        btn=document.getElementById('musicBtn'), name=document.getElementById('musicName');
  let list=[], idx=0;
  const label=f=> f ? f.name.replace(/\.[^.]+$/,'') : '';
  function load(i){ if(el.src) URL.revokeObjectURL(el.src); el.src=URL.createObjectURL(list[i]); name.textContent=label(list[i]); }
  function sync(){ btn.textContent = !el.src ? '🎧' : (el.paused ? '▶' : '❚❚'); btn.classList.toggle('playing', !!el.src && !el.paused); }
  btn.addEventListener('click', ()=>{ if(!list.length){ pick.click(); return; } el.paused ? el.play() : el.pause(); });
  name.addEventListener('click', ()=> pick.click());
  pick.addEventListener('change', ()=>{ if(!pick.files.length) return; list=[...pick.files]; idx=0; el.loop=(list.length===1); load(0); el.play(); });
  el.addEventListener('ended', ()=>{ if(list.length>1){ idx=(idx+1)%list.length; load(idx); el.play(); } });
  el.addEventListener('play', sync); el.addEventListener('pause', sync); el.addEventListener('loadeddata', sync);
  sync();
})();
</script>

  <div class="dockRow">
    <div class="sliderRow"><span title="colony size">🐜</span><input type="range" id="countSlider" min="5" max="45" value="20" aria-label="colony size"></div>
    <div class="sliderRow"><span title="speed">🏃</span><input type="range" id="speedSlider" min="20" max="200" value="100" aria-label="speed"></div>

    <div class="sliderRow">
      <button type="button" id="pebbleBtn" class="iconBtn" title="pebble" aria-label="pebble"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.6 13.4c-.5-3.7 2.4-6.9 6.6-7.1 4.2-.2 7.8 2.6 8.2 6.1.4 3.4-2.6 5.9-6.6 6.1-4.3.2-7.7-1.6-8.2-5.1z"/><path d="M8 10.9c1.7-1.2 4-1.7 6-1.3"/></svg></button>
      <input type="range" id="pebbleSizeSlider" min="0" max="100" value="50" aria-label="pebble size">

      <input type="range" id="twigSizeSlider" min="0" max="100" value="50" aria-label="twig size">

<script>
(function(){
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  const groundWrap = document.getElementById('groundWrap');
  const stage = document.getElementById('stage'), dock = document.getElementById('dock');
  const countSlider = document.getElementById('countSlider');
  const speedSlider = document.getElementById('speedSlider');
  const lightSlider = document.getElementById('lightSlider');
  const sizeSlider = document.getElementById('sizeSlider');
  const foodCheck = document.getElementById('foodCheck');
  const pebbleBtn = document.getElementById('pebbleBtn');
  const pebbleSizeSlider = document.getElementById('pebbleSizeSlider');
  const leafBtn = document.getElementById('leafBtn');
  const leafSizeSlider = document.getElementById('leafSizeSlider');
  const twigBtn = document.getElementById('twigBtn');
  const twigSizeSlider = document.getElementById('twigSizeSlider');

  // ---------- ground texture: a real above-ground dirt/pebble surface
  // photo, cover-cropped to the canvas, same pattern used elsewhere on
  // the platform (e.g. roller's wood tray)
  const groundImg = new Image();
  let groundImgReady = false;
  groundImg.onload = () => { groundImgReady = true; };
  groundImg.src = 'ant-ground.jpg';

  const leafImg = new Image();
  let leafImgReady = false;
  leafImg.onload = () => { leafImgReady = true; };
  leafImg.src = 'ant-leaf.png';

  const stoneImg = new Image();
  let stoneImgReady = false;
  stoneImg.onload = () => { stoneImgReady = true; };
  stoneImg.src = 'ant-stone.png';

  const twigImg = new Image();
  let twigImgReady = false;
  twigImg.onload = () => { twigImgReady = true; };
  twigImg.src = 'ant-twig.png';


  let W = 0, H = 0, DPR = 1;
  // The ground was centred in the whole SCREEN while the dock sat fixed across the
  // bottom of it, so on a short screen the scene simply ran underneath the dock --
  // 315px of dock over a 350px screen on the Jelly Star, and still 12px of overlap
  // on an ordinary 390 phone. The dock's height changes with the width (measured:
  // 136 at 240, 282 at 360, 216 at 390, 172 at 430), so no fixed padding can be
  // right; it is measured and applied here instead, as lamp does. The stage is
  // then padded to the band that is actually free -- under the two brass discs,
  // above the dock -- and the ground centres in THAT and is capped to it.
  function fitStage(){
    const dockH = dock ? dock.getBoundingClientRect().height : 0;
    const TOP = 56;                       // the brass discs end at 56
    stage.style.boxSizing = 'border-box';
    stage.style.paddingTop = TOP + 'px';
    stage.style.paddingBottom = dockH + 'px';
    // only ever TIGHTEN: the sheet's own 56vh stays the ceiling, so a screen with
    // room to spare -- a desktop, a Kindle -- is identical to the pixel
    const band = Math.max(80, window.innerHeight - TOP - dockH - 8);
    groundWrap.style.maxHeight = Math.min(window.innerHeight*0.56, band) + 'px';
  }
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    fitStage();
    const rect = groundWrap.getBoundingClientRect();
    W = rect.width; H = rect.height;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    initTrailGrid();
  }
  window.addEventListener('resize', resize);

  let speedMult = speedSlider.value / 100;
  speedSlider.addEventListener('input', () => { speedMult = speedSlider.value / 100; });
  let lightLevel = lightSlider.value / 100;
  lightSlider.addEventListener('input', () => { lightLevel = lightSlider.value / 100; });
  // slider's minimum (0) is the current/smallest ant size — it only
  // scales up from there, never smaller than what's already there
  let antSizeMult = 1 + sizeSlider.value/100;
  sizeSlider.addEventListener('input', () => { antSizeMult = 1 + sizeSlider.value/100; });
  let showFood = foodCheck.checked;
  foodCheck.addEventListener('change', () => {
    showFood = foodCheck.checked;
    if (showFood) respawnFood();
  });

  // ---------- pheromone trail: a fading data layer, exactly as
  // specified — a grid of strength values, reinforced by returning ants,
  // decaying continuously whether or not anything reinforces it. This
  // stays invisible on screen (an above-ground watch shouldn't show a
  // ghostly trail), but it's still real ant behavior underneath —
  // trails guide foraging even when we can't see them ----------
  const CELL = 8;
  let cols, rows, trail;
  function initTrailGrid(){
    cols = Math.ceil(W/CELL); rows = Math.ceil(H/CELL);
    trail = new Float32Array(cols*rows);
  }
  function trailAt(x,y){
    const cx = Math.floor(x/CELL), cy = Math.floor(y/CELL);
    if (cx<0||cx>=cols||cy<0||cy>=rows) return 0;
    return trail[cy*cols+cx];
  }
  function depositTrail(x,y,amount){
    const cx = Math.floor(x/CELL), cy = Math.floor(y/CELL);
    if (cx<0||cx>=cols||cy<0||cy>=rows) return;
    trail[cy*cols+cx] = Math.min(1, trail[cy*cols+cx] + amount);
  }
  function decayTrail(dt){
    const decay = 1 - 0.15*dt/60;
    for (let i=0;i<trail.length;i++){
      if (trail[i] > 0) trail[i] *= decay;
      if (trail[i] < 0.003) trail[i] = 0;
    }
  }

  // ---------- obstacles: click the pebble or leaf icon to place a
  // single one of that kind, drag it to reposition, click the icon
  // again to remove it. A size slider for each adjusts it within a
  // reasonable range, starting at the middle. No free-form tapping —
  // the icons are the only way in or out ----------
  const PEBBLE_R_MIN = 15, PEBBLE_R_MAX = 42; // was 8-22 — read as too small next to the leaf/twig at both ends
  const LEAF_R_MIN = 19, LEAF_R_MAX = 56; // was 15-45 — nudged up slightly across the whole range
  const TWIG_R_MIN = 38, TWIG_R_MAX = 116; // twice the footprint of the original size, plus a further bump
  let stones = [];
  let pebbleObstacle = null;
  let leafObstacle = null;
  let twigObstacle = null;
  let dragTarget = null;

  function sliderToRange(slider, min, max){
    return min + (slider.value/100) * (max-min);
  }

  pebbleBtn.addEventListener('click', () => {
    if (pebbleObstacle){
      const idx = stones.indexOf(pebbleObstacle);
      if (idx >= 0) stones.splice(idx,1);
      pebbleObstacle = null;
      pebbleBtn.classList.remove('active');
    } else {
      // a real stone photo rather than a drawn shape — collision uses a
      // circle sized to the stone's overall footprint. Solid, like a
      // real pebble: ants always route around it, never through.
      pebbleObstacle = { x: W*0.45, y: H*0.5, r: sliderToRange(pebbleSizeSlider, PEBBLE_R_MIN, PEBBLE_R_MAX), type:'stone', rot: 0 };
      stones.push(pebbleObstacle);
      pebbleBtn.classList.add('active');
    }
  });
  pebbleSizeSlider.addEventListener('input', () => {
    if (pebbleObstacle) pebbleObstacle.r = sliderToRange(pebbleSizeSlider, PEBBLE_R_MIN, PEBBLE_R_MAX);
  });

  leafBtn.addEventListener('click', () => {
    if (leafObstacle){
      const idx = stones.indexOf(leafObstacle);
      if (idx >= 0) stones.splice(idx,1);
      leafObstacle = null;
      leafBtn.classList.remove('active');
    } else {
      // a real leaf photo rather than a drawn shape. Unlike the other
      // obstacles the leaf is NOT solid — it's a raised canopy ants walk
      // underneath, not a wall (see blockedAt and the ant-hiding pass in
      // render()). r is still its footprint, used for that hiding test.
      leafObstacle = { x: W*0.65, y: H*0.35, r: sliderToRange(leafSizeSlider, LEAF_R_MIN, LEAF_R_MAX), type:'leaf', rot: 0 };
      stones.push(leafObstacle);
      leafBtn.classList.add('active');
    }
  });
  leafSizeSlider.addEventListener('input', () => {
    if (leafObstacle) leafObstacle.r = sliderToRange(leafSizeSlider, LEAF_R_MIN, LEAF_R_MAX);
  });

  twigBtn.addEventListener('click', () => {
    if (twigObstacle){
      const idx = stones.indexOf(twigObstacle);
      if (idx >= 0) stones.splice(idx,1);
      twigObstacle = null;
      twigBtn.classList.remove('active');
    } else {
      // a real twig photo — solid like the pebble (a twig resting on the
      // ground reads as something ants step around, not under)
      twigObstacle = { x: W*0.3, y: H*0.6, r: sliderToRange(twigSizeSlider, TWIG_R_MIN, TWIG_R_MAX), type:'twig', rot: 0 };
      stones.push(twigObstacle);
      twigBtn.classList.add('active');
    }
  });
  twigSizeSlider.addEventListener('input', () => {
    if (twigObstacle) twigObstacle.r = sliderToRange(twigSizeSlider, TWIG_R_MIN, TWIG_R_MAX);
  });

  const FOOD_HIT_R = 32;

  // dragging — pick up whichever placed object the pointer lands on
  // (pebble, leaf, twig, or food)
  let pointerStart = null;
  groundWrap.addEventListener('pointerdown', (e) => {
    const rect = groundWrap.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    let hit = stones.find(s => Math.hypot(s.x-x, s.y-y) < s.r);
    if (!hit && showFood && food.amount > 0 && Math.hypot(food.x-x, food.y-y) < FOOD_HIT_R){
      hit = food;
    }
    if (hit){
      dragTarget = hit;
      pointerStart = { x, y, moved:false };
      groundWrap.setPointerCapture(e.pointerId);
    }
  });
  groundWrap.addEventListener('pointermove', (e) => {
    if (!dragTarget) return;
    const rect = groundWrap.getBoundingClientRect();
    const clampR = dragTarget.r || FOOD_HIT_R;
    const nx = e.clientX - rect.left, ny = e.clientY - rect.top;
    if (pointerStart && Math.hypot(nx-pointerStart.x, ny-pointerStart.y) > 4) pointerStart.moved = true;
    dragTarget.x = Math.max(clampR, Math.min(W-clampR, nx));
    dragTarget.y = Math.max(clampR, Math.min(H-clampR, ny));
  });
  groundWrap.addEventListener('pointerup', () => {
    // a click (no meaningful movement) rotates a placed rock/leaf an
    // eighth turn rather than repositioning it; dragging still moves it
    if (dragTarget && pointerStart && !pointerStart.moved && dragTarget !== food){
      dragTarget.rot = (dragTarget.rot||0) + Math.PI/4;
    }
    dragTarget = null;
    pointerStart = null;
  });
  groundWrap.addEventListener('pointercancel', () => { dragTarget = null; pointerStart = null; });

  // the lollipop is a solid obstacle too, same as the pebble or twig — but
  // its collision circle is kept smaller than FOOD_HIT_R (see below) so an
  // ant actually heading for it still gets close enough to trigger "found
  // food" before ever being treated as blocked by it. It shrinks (and
  // stops being an obstacle at all) right along with the candy itself.
  function foodObstacle(){
    if (!showFood || food.amount <= 0) return null;
    return { x: food.x, y: food.y, r: 22 * food.amount, type: 'food' };
  }
  function findObstacleAt(x,y){
    const s = stones.find(s => s.type !== 'leaf' && Math.hypot(s.x-x,s.y-y) < s.r);
    if (s) return s;
    const f = foodObstacle();
    return (f && Math.hypot(f.x-x,f.y-y) < f.r) ? f : null;
  }
  function blockedAt(x,y){
    // the leaf is passable — ants walk underneath it rather than around it
    // (see the ant-hiding pass in render()); every other obstacle is solid
    return !!findObstacleAt(x,y);
  }

  // the twig's own woody stem, cut end to tip, measured directly on the
  // source photo (in its native 959x556 pixel space, centred on 479.5,278)
  // — this is the line an ant walking along the twig actually follows,
  // not just the circular collision footprint used for blockedAt.
  const TWIG_CUT_END = { x: 30, y: 45 };
  const TWIG_TIP = { x: 630, y: 440 };
  function twigEndpoints(s){
    const scale = (s.r*2.8) / 959;
    const rot = s.rot || 0, cos = Math.cos(rot), sin = Math.sin(rot);
    function toWorld(p){
      const ox = (p.x - 479.5) * scale, oy = (p.y - 278) * scale;
      return { x: s.x + ox*cos - oy*sin, y: s.y + ox*sin + oy*cos };
    }
    return [toWorld(TWIG_CUT_END), toWorld(TWIG_TIP)];
  }

  // is (x,y) currently under the leaf's raised footprint? Matches the same
  // rotated box the leaf photo is drawn into (see render()), inset a little
  // so ants vanish/reappear at roughly the leaf's actual silhouette rather
  // than its full (mostly-transparent-cornered) bounding rectangle.
  //
  // a real leaf lying on the ground isn't uniformly raised — it touches
  // down at its two points, the stem and the tip (the local x-axis, since
  // the source photo runs stem-on-the-left to tip-on-the-right), and only
  // arches up over its broader sides in between. So there's a walkway
  // along that central spine where ants stay visible, walking over the
  // low point of contact, while the wider belly to either side of it still
  // hides them underneath.
  function leafFootprint(x,y){
    if (!leafObstacle) return { inside:false, onWalkway:false };
    const lw = leafObstacle.r*2.8, lh = lw * ((leafImg.naturalHeight||1)/(leafImg.naturalWidth||1));
    const rx = lw/2*0.9, ry = lh/2*0.86;
    const rot = leafObstacle.rot||0;
    const dx = x-leafObstacle.x, dy = y-leafObstacle.y;
    const cos = Math.cos(-rot), sin = Math.sin(-rot);
    const lx = dx*cos - dy*sin, ly = dx*sin + dy*cos;
    const inside = (lx*lx)/(rx*rx) + (ly*ly)/(ry*ry) <= 1;
    return { inside, onWalkway: inside && Math.abs(ly) < ry*0.22 };
  }
  function underLeaf(x,y){
    const f = leafFootprint(x,y);
    return f.inside && !f.onWalkway;
  }

  // ---------- colony and food ----------
  const colony = { x: 45, y: 0 }; // y set on resize
  let food = { x:0, y:0, amount: 1 };
  function respawnFood(){
    food.x = 120 + Math.random()*(W-160);
    food.y = 50 + Math.random()*(H-185);
    food.amount = 1;
  }

  // ---------- ants ----------
  let ants = [];
  function makeAnt(){
    return {
      x: colony.x, y: colony.y,
      heading: Math.random()*Math.PI*2,
      state: 'search', // search | toFood | return
      wobble: Math.random()*Math.PI*2,
      straightTimer: 30 + Math.random()*60,
      climbing: null, // the obstacle currently being crossed straight over, if any
      onTwig: null, // walking along the twig's own length toward this {x,y}, if so
      pause: 0, // a brief held-still beat the instant an obstacle response kicks in,
                // so noticing-and-reacting reads as a deliberate response rather
                // than being indistinguishable from ordinary wandering
      walkPhase: Math.random()*10, // distance walked, in world px — drives the leg gait;
                                    // randomized start so a group of ants doesn't step in unison
    };
  }
  function syncAntCount(){
    const target = parseInt(countSlider.value,10);
    while (ants.length < target) ants.push(makeAnt());
    while (ants.length > target) ants.pop();
  }
  countSlider.addEventListener('input', syncAntCount);

  /* THE EDGE OF THE TRAY IS A WALL, AND A WALL IS SOMETHING YOU TURN AWAY FROM.
     Every move used to be clamped -- Math.max(4, Math.min(W-4, ...)) -- which pins
     an ant against the border and leaves its heading still pointing into it, so it
     grinds along the edge until its run timer happens to run out. At a walking pace
     an ant seldom reaches a wall and this never showed. Wound up, they get there ten
     times sooner and STAY: measured at full speed, 41.4% of all the movement on the
     page was happening within a whisker of an edge against 24% at the middle of the
     slider, and movement out in the open collapsed from 13,030 pixels to 6,965.
     That is what made the speed slider get WORSE above halfway -- ground covered in
     five seconds ran 1.33, 3.09, 4.46, 4.00, 3.62 per cent across the range, rising
     to the middle and then falling. The ants were not slower up there; they were
     stuck to the sides.
     Turning away is also just what an ant does at the edge of a tray. */
  function moveWithin(a, nx, ny){
    let turned = false;
    if (nx < 4){ nx = 4; a.heading = Math.PI - a.heading; turned = true; }
    else if (nx > W-4){ nx = W-4; a.heading = Math.PI - a.heading; turned = true; }
    if (ny < 4){ ny = 4; a.heading = -a.heading; turned = true; }
    else if (ny > H-4){ ny = H-4; a.heading = -a.heading; turned = true; }
    a.x = nx; a.y = ny;
    if (turned){
      // a shade of randomness, or an ant in a corner ping-pongs along one line
      a.heading += (Math.random()*2-1)*0.35;
      // and it commits to the new direction, rather than turning back into the
      // wall the moment the old run resumes
      a.straightTimer = 40 + Math.random()*80;
      // whatever it was in the middle of crossing, it isn't any more
      a.climbing = null; a.onTwig = null;
    }
    return turned;
  }

  function stepAnt(a, dt){
    const speed = 1.3 * speedMult * dt;
    a.wobble += dt*0.15;

    if (a.pause > 0){ a.pause -= dt; return; }

    if (a.onTwig){
      // walking the twig's own length rather than crossing straight over it
      // — heading is set once, toward whichever end continues roughly the
      // direction the ant was already headed, and held until it arrives
      const dx = a.onTwig.x-a.x, dy = a.onTwig.y-a.y;
      if (Math.hypot(dx,dy) < 4){ a.onTwig = null; }
      else {
        a.heading = Math.atan2(dy,dx);
        moveWithin(a, a.x + Math.cos(a.heading)*speed, a.y + Math.sin(a.heading)*speed);
        a.walkPhase += speed;
      }
      return;
    }

    if (a.climbing){
      // already committed to crossing a pebble or twig straight over rather
      // than around — hold the heading it started with (a real ant doesn't
      // change its mind partway up) and ignore the search/trail/collision
      // logic below entirely until it's clear of the far side
      moveWithin(a, a.x + Math.cos(a.heading)*speed, a.y + Math.sin(a.heading)*speed);
      a.walkPhase += speed;
      // the turn above may already have ended the climb, hence the guard
      if (a.climbing && Math.hypot(a.climbing.x-a.x, a.climbing.y-a.y) > a.climbing.r*1.05) a.climbing = null;
      return;
    }

    if (a.state === 'search'){
      // weighted choice: mostly wander, but nearby trail strength pulls
      // the heading toward it — a probabilistic nudge, not a locked path
      let bestDir = null, bestStrength = 0.05;
      for (let i=0;i<5;i++){
        const testAngle = a.heading + (Math.random()*2-1)*1.3;
        const tx = a.x + Math.cos(testAngle)*CELL*2, ty = a.y + Math.sin(testAngle)*CELL*2;
        const s = trailAt(tx,ty);
        if (s > bestStrength){ bestStrength = s; bestDir = testAngle; }
      }
      if (bestDir !== null && Math.random() < 0.7){
        a.heading = bestDir;
      } else {
        // run-and-tumble: travel in a fairly straight line for a while,
        // then pick a new direction — this is what real foraging insects
        // actually do, and it covers ground far more efficiently than
        // constant small random turns, which just diffuses in place
        a.straightTimer -= dt;
        if (a.straightTimer <= 0){
          a.heading = Math.random()*Math.PI*2;
          a.straightTimer = 70 + Math.random()*110;
        } else {
          a.heading += (Math.random()*2-1)*0.02*dt; // tiny jitter within a "run"
        }
      }
      if (showFood && Math.hypot(a.x-food.x, a.y-food.y) < 32 && food.amount > 0){
        a.state = 'toFood';
      }
    } else if (a.state === 'toFood'){
      a.state = 'return';
      food.amount -= 0.0005;
    } else if (a.state === 'return'){
      const dx = colony.x-a.x, dy = colony.y-a.y;
      const distToColony = Math.hypot(dx,dy);
      a.heading = Math.atan2(dy,dx) + (Math.random()*2-1)*0.15;
      depositTrail(a.x, a.y, 0.5);
      if (distToColony < 14){ a.state = 'search'; a.heading = Math.random()*Math.PI*2; }
    }

    // obstacle disruption: if the step ahead is blocked, either climb
    // straight over it (a real ant crossing a low pebble, twig, or the
    // lollipop, not every single one detouring around), or — for the twig
    // specifically — turn and walk along its own length like a real ant
    // using a fallen branch as a path, or turn and go around it. Every one
    // of these three responses gets a brief held-still beat first (see the
    // pause check above) — a real ant visibly hesitates at an obstacle
    // before doing anything about it, and without that beat "walked
    // straight over it in a dead-straight line" and "was never blocked at
    // all" look identical.
    let nx = a.x + Math.cos(a.heading)*speed;
    let ny = a.y + Math.sin(a.heading)*speed + Math.sin(a.wobble)*0.3;

    // the leaf isn't solid — it's always either walked over (the visible
    // spine) or under (the hidden belly) — but stepping onto it for the
    // first time still deserves the same "notice it" beat as everything
    // else, rather than sliding underneath with no acknowledgment at all
    if (leafFootprint(nx,ny).inside && !leafFootprint(a.x,a.y).inside){
      a.pause = 10;
      return;
    }

    if (blockedAt(nx,ny)){
      const obstacle = findObstacleAt(nx,ny);
      if (obstacle){
        const roll = Math.random();
        if (obstacle.type === 'twig' && roll < 0.35){
          const [p0, p1] = twigEndpoints(obstacle);
          const d0 = Math.cos(a.heading)*(p0.x-a.x) + Math.sin(a.heading)*(p0.y-a.y);
          const d1 = Math.cos(a.heading)*(p1.x-a.x) + Math.sin(a.heading)*(p1.y-a.y);
          a.onTwig = d1 > d0 ? p1 : p0;
          a.pause = 12;
          return;
        }
        if (roll < (obstacle.type === 'twig' ? 0.65 : 0.3)){
          a.climbing = obstacle;
          a.pause = 12;
          return;
        }
        // going around: turn to face away from the obstacle's own centre,
        // not just some semi-random offset from whatever heading it
        // already had — a fixed offset can easily still graze past (or
        // straight back into) the very thing it's meant to be avoiding
        a.heading = Math.atan2(a.y-obstacle.y, a.x-obstacle.x) + (Math.random()*0.9-0.45);
        a.pause = 8;
        return;
      }
      const choices = [-1.1,-0.6,0.6,1.1];
      a.heading += choices[Math.floor(Math.random()*choices.length)];
      nx = a.x + Math.cos(a.heading)*speed;
      ny = a.y + Math.sin(a.heading)*speed;
    }
    moveWithin(a, nx, ny);
    a.walkPhase += speed;
  }

  function render(){
    ctx.clearRect(0,0,W,H);
    // ground — a real photo of dirt/pebbles rather than a flat
    // gradient, cover-cropped to fill the frame regardless of aspect
    if (groundImgReady){
      const iw = groundImg.naturalWidth, ih = groundImg.naturalHeight;
      const scale = Math.max(W/iw, H/ih);
      const dw = iw*scale, dh = ih*scale;
      const dx = (W-dw)/2, dy = (H-dh)/2;
      ctx.drawImage(groundImg, dx, dy, dw, dh);
      // light slider darkens/brightens the photo rather than tinting a
      // solid color over it
      if (lightLevel < 1){
        ctx.fillStyle = `rgba(5,6,10,${(1-lightLevel)*0.85})`;
        ctx.fillRect(0,0,W,H);
      } else if (lightLevel > 1){
        ctx.fillStyle = `rgba(255,250,235,${(lightLevel-1)*0.4})`;
        ctx.fillRect(0,0,W,H);
      }
    } else {
      // brief fallback while the photo loads, so the ground isn't blank
      const g = ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0, `rgba(90,68,42,${lightLevel})`);
      g.addColorStop(1, `rgba(56,42,26,${lightLevel})`);
      ctx.fillStyle = g;
      ctx.fillRect(0,0,W,H);
    }

    // anthill — a small pile of excavated earth around the entrance,
    // built from a soft mound plus a few clumped humps for texture,
    // with a dark entrance hole, rather than a flat colored disc
    ctx.save();
    ctx.globalAlpha = lightLevel;
    const hillR = 15;
    const moundG = ctx.createRadialGradient(colony.x, colony.y-hillR*0.3, 1, colony.x, colony.y, hillR*1.3);
    moundG.addColorStop(0, '#5b4128');
    moundG.addColorStop(0.6, '#4a3320');
    moundG.addColorStop(1, 'rgba(58,47,34,0)');
    ctx.beginPath();
    ctx.ellipse(colony.x, colony.y, hillR*1.3, hillR*0.8, 0, 0, Math.PI*2);
    ctx.fillStyle = moundG;
    ctx.fill();
    for (let i=0;i<7;i++){
      const ang = i*0.9 + 0.3;
      const dist = hillR*0.65;
      const cx = colony.x + Math.cos(ang)*dist, cy = colony.y + Math.sin(ang)*dist*0.55;
      const rr = hillR*0.28;
      ctx.beginPath();
      ctx.ellipse(cx, cy, rr, rr*0.6, ang, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(74,55,34,0.55)';
      ctx.fill();
    }
    ctx.beginPath();
    ctx.ellipse(colony.x, colony.y+1, hillR*0.24, hillR*0.16, 0, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(10,7,4,0.9)';
    ctx.fill();
    ctx.restore();

    // food (lollipop) — a glossy round candy ball on a pale plastic
    // stick, with swirl bands wrapped around the sphere's curve (rather
    // than a flat 2D spiral) so it actually reads as a ball. The candy
    // shrinks away to nothing as it's eaten; the stick is drawn
    // separately and stays behind after the candy's gone, the way a
    // real lollipop stick would.
    if (showFood){
      const candyLeft = Math.max(0, food.amount);
      const r = 33 * candyLeft; // shrinks fully to 0 as the candy is finished

      // pale plastic stick, rounded where it ends — its top tracks the
      // candy's current bottom edge while any candy remains, and simply
      // settles at the candy's original center once it's gone (r=0)
      ctx.save();
      ctx.globalAlpha = lightLevel;
      const stickLen = 102, sw = 8.6;
      const topY = food.y + r*0.82;
      ctx.beginPath();
      ctx.moveTo(food.x-sw/2, topY);
      ctx.lineTo(food.x-sw/2, topY+stickLen-sw/2);
      ctx.arc(food.x, topY+stickLen-sw/2, sw/2, Math.PI, 0);
      ctx.lineTo(food.x+sw/2, topY);
      ctx.closePath();
      const stickG = ctx.createLinearGradient(food.x-sw, topY, food.x+sw, topY);
      stickG.addColorStop(0, '#d8d8dc');
      stickG.addColorStop(0.5, '#ffffff');
      stickG.addColorStop(1, '#d2d2d8');
      ctx.fillStyle = stickG;
      ctx.fill();
      ctx.strokeStyle = 'rgba(120,120,130,0.25)';
      ctx.lineWidth = 0.6;
      ctx.stroke();
      ctx.restore();

      if (candyLeft > 0){
        ctx.save();
        ctx.globalAlpha = lightLevel;

        // soft drop shadow so the candy reads clearly against the ground
        // photo instead of blending into it
        ctx.save();
        ctx.beginPath();
        ctx.ellipse(food.x+2, food.y+3, r*0.92, r*0.8, 0, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(0,0,0,0.22)';
        ctx.fill();
        ctx.restore();

        // candy ball, clipped so the swirl bands and shading stay inside
        ctx.save();
        ctx.beginPath();
        ctx.arc(food.x, food.y, r, 0, Math.PI*2);
        ctx.clip();

        const baseG = ctx.createRadialGradient(food.x-r*0.35, food.y-r*0.4, r*0.15, food.x, food.y, r*1.05);
        baseG.addColorStop(0, '#c9a3e0');
        baseG.addColorStop(0.45, '#9a55bd');
        baseG.addColorStop(1, '#5c2c78');
        ctx.beginPath();
        ctx.arc(food.x, food.y, r, 0, Math.PI*2);
        ctx.fillStyle = baseG;
        ctx.fill();

        // swirl bands — a couple of diagonal bands rotated around the
        // center, like a barber-pole twist wrapping the candy
        const bandAngles = [-0.28 + Math.PI/2, 0.34 + Math.PI/2];
        const bandColors = ['rgba(120,60,150,0.4)','rgba(60,24,88,0.5)'];
        for (let i=0;i<bandAngles.length;i++){
          ctx.save();
          ctx.translate(food.x, food.y);
          ctx.rotate(bandAngles[i]);
          ctx.beginPath();
          ctx.ellipse(0, 0, r*0.22, r*1.15, 0, 0, Math.PI*2);
          ctx.fillStyle = bandColors[i];
          ctx.fill();
          ctx.restore();
        }

        // sphere shading — darken the lower-right rim for volume
        const shadeG = ctx.createRadialGradient(food.x+r*0.3, food.y+r*0.35, r*0.2, food.x, food.y, r*1.05);
        shadeG.addColorStop(0, 'rgba(0,0,0,0)');
        shadeG.addColorStop(1, 'rgba(30,10,42,0.45)');
        ctx.beginPath();
        ctx.arc(food.x, food.y, r, 0, Math.PI*2);
        ctx.fillStyle = shadeG;
        ctx.fill();
        ctx.restore();

        // rim
        ctx.beginPath();
        ctx.arc(food.x, food.y, r, 0, Math.PI*2);
        ctx.strokeStyle = 'rgba(60,24,88,0.5)';
        ctx.lineWidth = 1.2;
        ctx.stroke();

        ctx.restore();
      }
    }

    // stones — the solid obstacles (stone, twig) draw here, in the normal
    // stack order. The leaf is NOT drawn in this pass: it's drawn last,
    // after the ants below, so it can sit on top of whichever ants are
    // still visible (see the leaf-hiding pass further down).
    stones.forEach(s => {
      if (s.type === 'leaf') return;
      const img = s.type === 'twig' ? twigImg : stoneImg;
      const imgReady = s.type === 'twig' ? twigImgReady : stoneImgReady;
      if (imgReady){
        const w = s.r*2.8, h = w * (img.naturalHeight/img.naturalWidth);
        ctx.save();
        ctx.globalAlpha = lightLevel;
        ctx.translate(s.x, s.y);
        ctx.rotate(s.rot||0);
        ctx.drawImage(img, -w/2, -h/2, w, h);
        ctx.restore();
        return;
      }
      // brief fallback while the photo loads, so the obstacle isn't blank
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.rot||0);
      ctx.beginPath();
      ctx.arc(0, 0, s.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(110,110,105,${lightLevel})`;
      ctx.fill();
      ctx.strokeStyle = `rgba(60,60,58,${lightLevel})`;
      ctx.stroke();
      ctx.restore();
    });

    // how "raised up" an ant should currently look, 0 (flat ground) to 1
    // (right at the crest of whatever it's on) — climbing over a round
    // obstacle follows that obstacle's own dome profile (tallest at the
    // centre, level with the ground at its edge), while walking the
    // twig's length or the leaf's central spine holds at a steady rise,
    // since neither one has a crest to climb over, just a level rise
    function antTilt(a){
      if (a.climbing){
        const ratio = Math.hypot(a.x-a.climbing.x, a.y-a.climbing.y) / a.climbing.r;
        return Math.sqrt(Math.max(0, 1 - ratio*ratio));
      }
      if (a.onTwig) return 0.5;
      if (leafFootprint(a.x,a.y).onWalkway) return 0.4;
      return 0;
    }
    // ants — four body segments (gaster, a pinched waist, thorax, head), six
    // jointed legs walking a proper alternating tripod gait, and antennae, so
    // they read as ants rather than a beetle-shaped blob. A real ant's waist
    // (the petiole) is a sharp pinch between the thorax and the gaster — the
    // single biggest thing separating "ant" from "beetle" in silhouette, and
    // the thing the previous three overlapping ellipses didn't have at all.
    // Heading points along +x (forward).
    const ANT_LEG_ORIGIN_X = 0.55;     // legs attach at the thorax, not body centre
    const ANT_LEGS = [                 // base foot position for one side; mirrored for the other
      {x:1.05, y:1.85}, {x:-0.30, y:2.15}, {x:-1.65, y:1.85}
    ];
    const GAIT_STRIDE = 5.5;   // world px of travel per full step cycle — independent of zoom
    const STRIDE_AMP = 0.85;   // how far a foot swings fore/aft, in body units
    const KNEE_BOW = 1.35;     // how far the knee bows outward past the straight-line midpoint
    function drawAnt(a){
      const tilt = antTilt(a);
      ctx.save();
      ctx.translate(a.x,a.y);
      if (tilt > 0.02){
        // a small shadow at the ant's true position on the ground, then
        // the body itself drawn lifted toward a fixed "up" and slightly
        // enlarged — the standard top-down cue for standing on something
        // raised, so climbing/following an obstacle actually reads as
        // climbing something rather than just walking across flat ground
        ctx.save();
        ctx.beginPath();
        ctx.ellipse(0, 0, 2.4*antSizeMult, 1.7*antSizeMult, 0, 0, Math.PI*2);
        ctx.fillStyle = `rgba(0,0,0,${0.30*tilt*lightLevel})`;
        ctx.fill();
        ctx.restore();
        ctx.translate(-1.8*tilt*antSizeMult, -1.8*tilt*antSizeMult);
        ctx.scale(1+0.22*tilt, 1+0.22*tilt);
      }
      ctx.rotate(a.heading);
      const s = antSizeMult;
      const col = a.state==='return' ? `rgba(154,85,189,${lightLevel})` : `rgba(24,16,10,${lightLevel})`;
      ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineCap='round'; ctx.lineWidth = 0.32*s;
      // legs: jointed (origin -> knee -> foot) and walking an alternating tripod
      // gait — front+back on one side step together with the opposite side's
      // middle leg, then the other three take over, exactly how a real
      // six-legged gait keeps three feet planted at all times
      const gaitBase = a.walkPhase / GAIT_STRIDE;
      const originX = ANT_LEG_ORIGIN_X*s;
      ctx.beginPath();
      for (const side of [1,-1]){
        for (let i=0;i<ANT_LEGS.length;i++){
          const leg = ANT_LEGS[i];
          const inTripodA = (i===1) ? side>0 : side<0;
          const phase = ((gaitBase + (inTripodA?0:0.5)) % 1 + 1) % 1;
          const swing = Math.cos(phase*Math.PI*2) * STRIDE_AMP;
          const footX = (leg.x+swing)*s, footY = leg.y*s*side;
          const kneeX = (originX+footX)/2, kneeY = (footY)/2*KNEE_BOW;
          ctx.moveTo(originX,0); ctx.lineTo(kneeX,kneeY); ctx.lineTo(footX,footY);
        }
      }
      // antennae from the head
      ctx.moveTo(2.35*s,0); ctx.lineTo(3.75*s,-1.3*s);
      ctx.moveTo(2.35*s,0); ctx.lineTo(3.75*s, 1.3*s);
      ctx.stroke();
      // body, rear to front: gaster (large), thorax, head — left with a bare
      // gap rather than a filled bit between gaster and thorax, so the waist
      // reads as a real pinch rather than a third little lump of its own
      ctx.beginPath(); ctx.ellipse(-2.15*s,0, 1.85*s,1.55*s, 0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse( 0.55*s,0, 0.95*s,0.68*s, 0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse( 2.35*s,0, 1.15*s,0.85*s, 0,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
    // an ant currently inside the leaf's footprint is simply skipped here
    // — the leaf, drawn right after (on top), is what makes it read as
    // "walking underneath"; it reappears the moment it steps clear
    ants.forEach(a => {
      if (!underLeaf(a.x, a.y)) drawAnt(a);
    });

    // leaf — drawn last, on top of every ant still visible, so anything
    // presently inside its footprint looks like it's passed beneath a
    // raised, physical leaf rather than just standing still under a sticker
    if (leafObstacle && leafImgReady){
      const lw = leafObstacle.r*2.8, lh = lw * (leafImg.naturalHeight/leafImg.naturalWidth);
      ctx.save();
      ctx.globalAlpha = lightLevel;
      ctx.translate(leafObstacle.x, leafObstacle.y);
      ctx.rotate(leafObstacle.rot||0);
      ctx.drawImage(leafImg, -lw/2, -lh/2, lw, lh);
      ctx.restore();
    }
  }

  let lastT = performance.now();
  function loop(t){
    const dt = Math.min((t-lastT)/16.67, 3);
    lastT = t;
    decayTrail(dt);
    ants.forEach(a => stepAnt(a, dt));
    render();
    requestAnimationFrame(loop);
  }

  resize();
  colony.y = 42;
  respawnFood();
  syncAntCount();
  requestAnimationFrame(loop);
})();
</script>

<script>
(function(){
  var disc=document.getElementById('shelfdisc'), box=document.getElementById('plates');
  var rows=[].slice.call(box.querySelectorAll('.row'));
  function unroll(){ rows.forEach(function(r){ r.classList.remove('rolled'); }); }
  function shut(){ box.classList.remove('open'); disc.setAttribute('aria-expanded','false'); unroll(); }

  /* The twenty cards behind these plates are 6.2MB and not one of them can be
     seen until a plate is opened, but every page on the site was fetching the lot
     on load, ahead of the piece's own assets. Measured on bowl at 240px with a
     slow phone's CPU and connection, the bowl had still not appeared after 100
     seconds; held back, it is there in 12.
     They are held behind data-src rather than left to loading="lazy" alone,
     because that is a heuristic and not a promise -- the same page deferred them
     on a throttled connection and fetched all twenty on a fast one, since the
     browser's idea of "near the viewport" widens with bandwidth. This is the same
     on every machine. The attribute stays as a second line for anything that
     scrolls them into view another way. */
  var wired=false;
  function fetchCards(){
    if(wired) return; wired=true;
    [].slice.call(box.querySelectorAll('img[data-src]')).forEach(function(im){
      im.src=im.getAttribute('data-src'); im.removeAttribute('data-src');
    });
  }

  disc.addEventListener('click', function(ev){
    ev.stopPropagation();
    var open=box.classList.toggle('open');
    if(open) fetchCards();
    disc.setAttribute('aria-expanded', open?'true':'false');
    if(!open) unroll();
  });

  // Same bargain the case itself strikes: a mouse can hover, so a plate is a link
  // straight to its shelf. A thumb cannot, so the first tap on a plate rolls its
  // pieces out and only the second one goes to the shelf.
  var FINE=matchMedia('(hover: hover) and (pointer: fine)');
  rows.forEach(function(row){
    row.querySelector('.tag').addEventListener('click', function(ev){
      if(FINE.matches) return;
      if(row.classList.contains('rolled')) return;
      ev.preventDefault();
      unroll(); row.classList.add('rolled');
    });
  });

  document.addEventListener('click', function(ev){
    if(!box.contains(ev.target) && ev.target!==disc) shut();
  });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') shut(); });
})();
</script>
