<style>
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{ height:100%; margin:0; overflow:hidden; background:#050505; color:#dfe6ea;
    font-family:Georgia, serif; user-select:none; }
  #backlink{ position:fixed; top:18px; left:22px; z-index:50; color:#dfe6ea; opacity:.5;
    text-decoration:none; font-size:14px; letter-spacing:.04em; text-shadow:0 1px 3px rgba(0,0,0,.85), 0 0 9px rgba(0,0,0,.55); transition:opacity .3s ease; }
  #backlink:hover{ opacity:.9; }
    /* On a phone or tablet, 100% of the page -- like 100vh -- is the whole screen
       with the browser's own address bar counted as though it weren't there, and
       nothing here can scroll, so whatever lands under that bar is unreachable:
       on a Kindle in landscape that was the location flag's own field and the
       line that answers it. innerHeight is the honest number on every browser
       there is, old ones included. */
  #stage{ height:100%; height:calc(var(--vh, 1vh) * 100); display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:6vh 3vw 2vh; gap:2vh; }
  #scene-wrap{ position:relative; height:min(calc(var(--vh, 1vh) * 76),720px); aspect-ratio:410/700; }
  #scene-wrap canvas{ position:absolute; inset:0; width:100%; height:100%; transition:opacity .9s ease; }
  #dock{ display:flex; align-items:center; justify-content:center; gap:20px; padding:0 22px; }
  .toggle{ display:flex; align-items:center; gap:8px; cursor:pointer; }
  .toggle input{ appearance:none; width:16px; height:16px; border:1.5px solid rgba(223,230,234,.7);
    border-radius:3px; background:transparent; position:relative; cursor:pointer; flex-shrink:0; }
  .toggle input:checked{ background:#dfe6ea; }
  .toggle input:checked::after{ content:''; position:absolute; left:4px; top:1px; width:4px; height:8px;
    border:solid #050505; border-width:0 2px 2px 0; transform:rotate(40deg); }
  .cloud-icon{ color:#dfe6ea; flex-shrink:0; transition:color .25s ease; }
  .toggle input:not(:checked) ~ .cloud-icon{ color:#7a8388; }
  /* the barometer */
  #barometer{ width:min(94vw, 560px); display:flex; flex-direction:column; align-items:center; gap:2px;
    transition:opacity .4s ease; }
  #barometer.idle{ opacity:.34; }          /* not driving the glass while it is on manual */
  #baro-svg{ width:100%; height:auto; display:block; overflow:visible; }
  #baro-svg .band{ fill:rgba(223,230,234,.045); }
  #baro-svg .band.alt{ fill:rgba(223,230,234,.085); }
  #baro-svg text{ font-family:Georgia, serif; }
  #baro-svg .bandword{ fill:#7f8a90; font-size:11px; letter-spacing:.16em; text-anchor:middle; }
  #baro-svg .num{ fill:#6d777c; font-size:10px; text-anchor:middle; }
  #baro-svg .tick{ stroke:rgba(223,230,234,.34); stroke-width:1; }
  #baro-svg .tick.major{ stroke:rgba(223,230,234,.6); stroke-width:1.4; }
  #baro-svg .rule{ stroke:rgba(223,230,234,.28); stroke-width:1; }
  #baro-needle{ stroke:#e9f1f5; stroke-width:2.2; stroke-linecap:round; }
  #baro-hub{ fill:#e9f1f5; }
  /* No reading is not a reading of 950. Untranslated, the needle stands at x=0 --
     off the left-hand end of the printed scale, past STORMY -- so until the
     pressure has actually arrived it claims a catastrophic low that nobody
     measured, while the readout beside it honestly says nothing at all. It is
     simply not shown until it has something to point at. */
  /* The needle is painted AFTER the brass hand and its stroke takes a pointer, so
     it was intercepting every grab at its own position -- which is exactly where
     the hand is meant to be parked, since setting the hand against the needle is
     the whole use of the instrument. It is a reading, not a control; it takes
     nothing. */
  #baro-needle-g{ transition:transform .9s cubic-bezier(.34,.1,.2,1); visibility:hidden; pointer-events:none; }
  #baro-needle-g.has-reading{ visibility:visible; }
  #baro-set{ fill:#b8903f; stroke:#6b5220; stroke-width:.7; cursor:grab; }
  #baro-set-g{ cursor:grab; }
  #baro-set-g.dragging{ cursor:grabbing; }
  #baro-read{ display:flex; align-items:center; justify-content:center; gap:10px;
    font-size:12.5px; letter-spacing:.04em; color:#9aa4a9; min-height:1.5em; }
  #baro-hpa{ color:#dfe6ea; }
  /* The tendency is the half of a barometer that actually forecasts, and it was
     the one piece of prose on the piece. It is now a mark, the way everything
     else here is: chevrons pointing where the pressure is going, ONE PER RUNG of
     the WMO tendency scale -- slowly, plain, rapidly, very rapidly -- and a level
     bar for steady. The words are still underneath it and are still exact; the
     mark answers to a touch and gives them up, and puts them away when it or
     anything around it is touched. That is galileo's own bargain for a popup, and
     it is a thing responding rather than a thing explaining itself unasked.
     A <button> carries the browser's own button face, so its background is cleared. */
  #baro-tend{ appearance:none; border:0; background:none; background-color:transparent;
    margin:0; padding:0 2px; display:flex; align-items:center; gap:7px; cursor:pointer;
    color:#9aa4a9; font:inherit; font-size:12.5px; letter-spacing:.04em; line-height:1; }
  #baro-tend[hidden]{ display:none; }
  #baro-tend-mark{ display:block; width:13px; height:19px; flex-shrink:0; overflow:visible; }
  #baro-tend-mark path{ fill:none; stroke:currentColor; stroke-width:1.5;
    stroke-linecap:round; stroke-linejoin:round; }
  #baro-tend-words{ max-width:0; overflow:hidden; white-space:nowrap; opacity:0;
    transition:max-width .4s ease, opacity .4s ease; }
  #baro-tend.open #baro-tend-words{ max-width:16em; opacity:1; }
  #baro-set-btn{ appearance:none; border:0; background:none; padding:2px 4px; font-size:12px;
    line-height:1; cursor:pointer; opacity:.4; transition:opacity .3s ease; }
  #baro-set-btn:hover{ opacity:.85; }

  #key{ display:flex; align-items:flex-end; justify-content:center; gap:2px; flex-wrap:wrap; padding:0 8px; }
  .keyItem{ display:flex; align-items:center; gap:7px; background:none; border:none; cursor:pointer;
    padding:7px 9px; border-radius:7px; opacity:.5; transition:opacity .25s ease, background-color .25s ease; }
  .keyItem:hover{ opacity:.8; }
  .keyItem.active{ opacity:1; background:rgba(223,230,234,.09); }
  .keyItem svg{ width:17px; height:17px; color:#dfe6ea; flex-shrink:0; }
  .keyItem canvas{ width:24px; height:auto; display:block; border-radius:2px; }

  /* ---------- the 3in phone ----------
     Below 380 the key was eating the piece. Eight buttons, each an icon AND a 24px
     thumbnail of the glass, wrapped to three rows and took 169px of a 350px screen
     -- and #scene-wrap, being an ordinary flex item, gave way to it and shrank to
     THIRTEEN pixels across. Eight little glasses on screen, all of them bigger than
     the real one.
     So down here the thumbnails come off and the icons stay, four to a row. The
     thumbnail is the one thing on the page that is genuinely redundant at this
     size: the glass itself is a tap away and changes instantly, so a 24px picture
     of it is a worse view of the same thing, and it is being paid for out of the
     glass's own room. The icons are already distinct from each other and they are
     what the row is FOR. Nothing is hidden, no new gesture, nothing to discover.
     The stage's own padding gives a little too -- the two brass discs are fixed and
     the glass is far too narrow here to reach them. Above 380 none of this applies
     and the piece is what it always was, measured. */
  @media (max-width: 379px){
    #stage{ padding:2.4vh 3vw 1.2vh; gap:1.2vh; }
    .keyItem canvas{ display:none; }
    .keyItem{ flex:0 0 calc(25% - 3px); justify-content:center; padding:7px 4px; }
    #key{ gap:3px; }
  }
  /* The 3in phone turned sideways is 180px tall, and no arrangement puts a storm
     glass, a barometer, a dock and eight states into that -- the barometer alone
     is 88px of it. So this is the one place the page is allowed to SCROLL, which
     is the answer she took for kaleidoscope when the content genuinely did not
     fit: everything reachable, nothing squeezed to a sliver, rather than a tidy
     screen with the piece missing off the bottom of it. The glass is held to a
     size instead of being shrunk to fit, which is why it needs the scroll.
     Landscape only, and that qualifier is load-bearing: the 3in phone is 350px
     tall in PORTRAIT too, where the compact key above already makes everything
     fit with room to spare. Without it this rule caught portrait as well, set the
     page scrolling that did not need to scroll, and pushed the glass up under the
     two brass discs. A Kindle in landscape is 476 tall and never reaches this. */
  @media (max-height: 430px) and (orientation: landscape){
    html,body{ height:auto; overflow:visible; }
    #stage{ height:auto; min-height:calc(var(--vh, 1vh) * 100); padding:3vh 3vw 4vh; gap:1.4vh; }
    #scene-wrap{ height:min(calc(var(--vh, 1vh) * 76), 300px); flex-shrink:0; }
    #barometer, #key, #dock{ flex-shrink:0; }
    .keyItem canvas{ display:none; }
    .keyItem{ justify-content:center; padding:7px 8px; }
  }

  /* a quiet flag, always available, for checking the weather somewhere other than
     wherever the visitor actually is — opens a small search bar, never on by default */
  #loc-flag{
    appearance:none; border:0; background:none; padding:4px 6px;
    font-size:15px; line-height:1; cursor:pointer; opacity:.4; transition:opacity .3s ease;
  }
  #loc-flag:hover, #loc-flag.open{ opacity:.85; }
  #loc-search{
    display:flex; align-items:center; justify-content:center; gap:6px; max-height:0; overflow:hidden;
    opacity:0; transition:max-height .3s ease, opacity .3s ease;
    flex-shrink:0;
  }
  #loc-search.open{ max-height:40px; opacity:1; }
  #loc-search input{
    appearance:none; border:0; border-bottom:1px solid rgba(223,230,234,.4); background:none;
    color:#dfe6ea; font:15px Georgia, serif; letter-spacing:.02em; padding:3px 2px;
    width:132px; outline:none;
  }
  #loc-search input::placeholder{ color:#7a8388; }
  #loc-search input:focus{ border-bottom-color:#dfe6ea; }
  #loc-search-status{
    font-size:11px; letter-spacing:.02em; color:#7a8388; text-align:center; min-height:1.2em;
  }
</style>
<style>
  /* The way back is the brass disc off the shelf's plinth, with an arrow cut into
     it instead of the question mark. No word: the pieces are not captioned and
     neither is the way out of one. The page's own #backlink rules still set where
     it sits and how it fades; these only change what it looks like. */
  #backlink{ width:38px; height:38px; display:grid; place-items:center;
    font-size:0; text-decoration:none;
    filter:drop-shadow(0 1px 3px rgba(0,0,0,.65)); }
  #backlink img{ grid-area:1/1; width:100%; height:100%; display:block; }

    font-size:19px; line-height:1; font-family:Georgia, serif; color:#0f0a02;
    text-shadow:0 1px 0 rgba(255,238,196,.5), 0 -1px 1px rgba(0,0,0,.35); }

      <g id="baro-needle-g"><line id="baro-needle" x1="0" y1="0" x2="0" y2="0"/><circle id="baro-hub" r="3.4"/></g>

      </svg>

  </div>

  </form>

  <div id="key" role="group" aria-label="weather key">
    <button class="keyItem" type="button" data-cond="settled" aria-label="settled">

        <circle cx="12" cy="10" r="4.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <line x1="5" y1="18.5" x2="19" y2="18.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <canvas class="miniGlass" width="82" height="140"></canvas>
    </button>
    <button class="keyItem" type="button" data-cond="sunny" aria-label="sunny">

        <g stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
          <line x1="12" y1="2.5" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="21.5"/>
          <line x1="2.5" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="21.5" y2="12"/>
          <line x1="5.6" y1="5.6" x2="7.3" y2="7.3"/><line x1="16.7" y1="16.7" x2="18.4" y2="18.4"/>
          <line x1="5.6" y1="18.4" x2="7.3" y2="16.7"/><line x1="16.7" y1="7.3" x2="18.4" y2="5.6"/>
        </g>
      </svg>
      <canvas class="miniGlass" width="82" height="140"></canvas>
    </button>
    <button class="keyItem" type="button" data-cond="unsettled" aria-label="unsettled">
      <!-- sun behind cloud: changeable. It wore a thermometer while this state was
           misnamed 'warming', which was wrong twice over. -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
          <circle cx="9" cy="8.5" r="3.2"/>
          <line x1="9" y1="2.4" x2="9" y2="4"/><line x1="3.6" y1="8.5" x2="2" y2="8.5"/>
          <line x1="4.8" y1="4.3" x2="3.7" y2="3.2"/><line x1="13.2" y1="4.3" x2="14.3" y2="3.2"/>
          <path d="M10 19a3.6 3.6 0 0 1-.5-7.16A4.5 4.5 0 0 1 18 11.9 3.6 3.6 0 0 1 19 19H10Z"/>
        </g>
      </svg>
      <canvas class="miniGlass" width="82" height="140"></canvas>
    </button>
    <button class="keyItem" type="button" data-cond="rain" aria-label="rain">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M7 13a4 4 0 0 1-.6-7.96A5 5 0 0 1 16 4.2 4.5 4.5 0 0 1 17.5 13H7Z" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <g stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
          <line x1="8.5" y1="16" x2="8" y2="19"/><line x1="12.5" y1="16" x2="12" y2="19"/><line x1="16.5" y1="16" x2="16" y2="19"/>
        </g>

        <path d="M7 12a4 4 0 0 1-.6-7.96A5 5 0 0 1 16 3.2 4.5 4.5 0 0 1 17.5 12H7Z" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <polyline points="12.5,14 9.5,18.5 12,18.5 10.5,22" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>

          <path d="M3 8.5h9.5a2.6 2.6 0 1 0-2.6-2.6"/>
          <path d="M3 12.5h13a2.8 2.8 0 1 1-2.8 2.8"/>
          <path d="M3 16.5h6"/>
        </g>

    </button>
    <button class="keyItem" type="button" data-cond="frost" aria-label="frost">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
          <line x1="3.5" y1="20" x2="20.5" y2="20"/>
          <path d="M7 20v-5M7 17.5l-2-2M7 17.5l2-2"/>
          <path d="M12 20v-8M12 15.5l-2.4-2.4M12 15.5l2.4-2.4"/>
          <path d="M17 20v-5M17 17.5l-2-2M17 17.5l2-2"/>

    </button>
    <button class="keyItem" type="button" data-cond="snow" aria-label="snow">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <g stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
          <line x1="12" y1="3" x2="12" y2="21"/><line x1="4.5" y1="7.5" x2="19.5" y2="16.5"/><line x1="19.5" y1="7.5" x2="4.5" y2="16.5"/>
          <line x1="12" y1="6" x2="10" y2="7.2"/><line x1="12" y1="6" x2="14" y2="7.2"/>
          <line x1="12" y1="18" x2="10" y2="16.8"/><line x1="12" y1="18" x2="14" y2="16.8"/>
        </g>
      </svg>
      <canvas class="miniGlass" width="82" height="140"></canvas>
    </button>
  </div>

<script>
(function(){
  const frameA=document.getElementById('frame-a'), frameB=document.getElementById('frame-b');
  const ctxA=frameA.getContext('2d'), ctxB=frameB.getContext('2d');
  const chkLive=document.getElementById('chkLive');
  const keyItems=document.querySelectorAll('.keyItem');

  // ---------- the five conditions, in the traditional storm-glass reading
  // sense: not one dial of "more or less storminess" but distinct, recognisable
  // arrangements, built from four real ingredients — large crystal (one
  // cohesive flake), small crystal (many fine ones), vertical wisps, and
  // bubbles (dense or sparse) — matching what the real folklore chart itself
  // distinguishes: dashes are wisps, circles are bubbles, clumps are crystal ----------
  const ORDER = ['settled','sunny','unsettled','rain','storm','windy','frost','snow'];
  const RECIPES = {
    // snow: one dense, filled clump — not a couple of isolated flakes —
    // so it layers two offset samples of the same large-crystal photo
    snow:    { bigAmt:1.0,  bigReach:0.56, layered:true, extraFeathers:true },
    // 'warming' was the old name and it was wrong: this arrangement is shown for
    // the CHANGE band with a quiet needle, which means UNSETTLED — nothing to do
    // with warming. Renamed rather than left to mislead the next reader.
    unsettled: { bigAmt:1.0, bigReach:0.34, streakAmt:1.0, streakReach:0.3, bottomStreakAmt:0.75, bottomStreakReach:0.16 },
    // settled: the chart's own first reading — CLEAR LIQUID, "bright and clear".
    // The deep, steady high. Nothing but a faint scatter of fine bubbles in the
    // very bottom of the bulb and clear water above it. It exists because the
    // barometer distinguishes a settled anticyclone from an ordinary fair day and
    // the glass had no way to show the difference: both came out as 'sunny'.
    // Strictly the chart asks for CLEAR liquid and nothing else, and that is what
    // was tried first — it rendered an entirely empty glass, which reads as a
    // picture that failed to load rather than as settled weather. Correct, and no
    // use. So it keeps the faintest presence the set allows: a few fine bubbles low
    // in the bulb and some very quiet filaments under the surface. Still
    // unmistakably the clearest of the five, and unmistakably deliberate.
    settled: { spreadAmt:0.8, spreadBubble:'sparse', spreadBubbleOnly:true, spreadTaper:true, spreadTaperStart:0.6, streakAmt:0.3, streakReach:0.5 },
    // windy: the chart's "threads near the top". Long fine filaments hanging the
    // depth of the water and nothing settled at the bottom — the one reading in
    // the set that the barometer cannot give you, since a gale under a steady
    // high and a calm under the same high read identically on a dial.
    windy:   { streakAmt:1.0, streakReach:0.86, streakSpread:0.78 },
    // frost: the chart's "crystals at the bottom". Fine crystal growing up off the
    // floor of the bulb, no large flake, nothing hanging above it. Distinct from
    // snow, which is falling; this is a hard clear freezing night.
    frost:   { spreadAmt:0.95, spreadBubble:'sparse', spreadTaper:true, spreadTaperStart:0.5 },
    // rain: no crystal at all — a couple of streaks top-centre, a few loose
    // clumps of larger bubbles, and one small knot of finer bubbles at the
    // bottom centre, matching the real reading chart's own icon exactly
    rain:    { streakAmt:1.0, streakReach:0.22, streakCentered:true, streakSpread:0.35, bubbleClumps:true },
    // storm: the dense, fizzy crystal-and-bubble texture fills the whole
    // water column top to bottom, plus a big cluster of large flakes like
    // snow's, layered on top of that density
    storm:   { spreadAmt:0.62, spreadBubble:'dense', bigAmt:1.0, bigReach:0.56, layered:true, extraFeathers:true, manyFlakes:true, streakAmt:0.25, streakReach:0.1 },
    // sunny: dense bubbles packed into the bottom third like storm's fizz
    // (no crystal mixed in), and vertical streaks through the top two-thirds
    sunny:   { spreadAmt:1.0, spreadBubble:'dense', spreadBubbleOnly:true, spreadTaper:true, spreadTaperStart:0.62, streakAmt:0.8, streakReach:0.66 },
  };

  // ---------- weather: the same live/manual pattern as galileo and conometer,
  // but picking one of the five named conditions above from real fields rather
  // than blending a single dial ----------
  let lat=55.19, lon=-1.56; // fallback: north-east England, matching the rest of the site
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      pos=>{ lat=pos.coords.latitude; lon=pos.coords.longitude; fetchWeather(); },
      ()=>{ fetchWeather(); }, { timeout:5000 }
    );
  }
  let liveCondition=null;
  let manualIndex=2;
  function currentCondition(){
    if(chkLive.checked) return liveCondition!=null ? liveCondition : ORDER[manualIndex];
    return ORDER[manualIndex];
  }
  // ---------- the barometer ----------
  // A barometer tells you two things and the SECOND one is what forecasts. The
  // needle gives the pressure now; the CHANGE over the last three hours is the
  // figure that actually says what is coming, and it is what every synoptic
  // observation on earth reports. So this reads the hourly series, not one instant.
  const INHG = 33.8639;                                  // hPa in an inch of mercury
  // The scale runs 950 to 1050. The traditional English dial runs 28 to 31 inches,
  // which converts to 948.2 and 1049.8 — so the ends were falling just short of
  // round numbers and the 1050 engraving had nowhere to sit. The ENDS are round
  // because the engraving is metric; the WORD boundaries below stay exactly where
  // the inch scale puts them, because that is what they are.
  const BARO_LO = 950, BARO_HI = 1050;
  // The words printed on a real aneroid dial, at the inches they are printed at.
  // Not invented ranges — this is the standard English barometer scale.
  const BANDS = [
    { lo:BARO_LO,   hi:28.5*INHG, word:'STORMY'   },
    { lo:28.5*INHG, hi:29.4*INHG, word:'RAIN'     },
    { lo:29.4*INHG, hi:29.9*INHG, word:'CHANGE'   },
    { lo:29.9*INHG, hi:30.5*INHG, word:'FAIR'     },
    { lo:30.5*INHG, hi:BARO_HI,   word:'VERY DRY' },
  ];
  const X0 = 40, X1 = 560, YAXIS = 62;
  const baroX = hpa => X0 + (Math.max(BARO_LO, Math.min(BARO_HI, hpa)) - BARO_LO)/(BARO_HI - BARO_LO)*(X1 - X0);
  const baroHpa = x => BARO_LO + (Math.max(X0, Math.min(X1, x)) - X0)/(X1 - X0)*(BARO_HI - BARO_LO);

  // The WMO descriptors for three-hourly pressure tendency. These thresholds are
  // the standard ones, not a feel for it.
  function tendencyWords(d){
    const a = Math.abs(d);
    if(a < 0.1) return 'steady';
    const dir = d > 0 ? 'rising' : 'falling';
    if(a < 1.6) return dir + ' slowly';
    if(a < 3.6) return dir;
    if(a < 6.0) return dir + ' rapidly';
    return dir + ' very rapidly';
  }

  // What the glass shows, read off the barometer the way a barometer is read:
  // the trend leads, the level decides when the trend is quiet. A rapid fall is
  // the classic storm warning whatever the needle currently sits at.
  // Beaufort 6, 'strong breeze', begins at 39 km/h sustained — the point on the
  // scale where wind stops being background and becomes the thing you notice.
  // Beaufort 8 is a gale at 62 km/h, which is the gust figure used here: gusting to
  // gale while the sustained wind sits lower is a genuinely windy day. Both are
  // named points on a real scale rather than a feel for it, and the request is
  // km/h explicitly so the reading cannot change under us if a default does.
  const BEAUFORT_6 = 39, GALE = 62;
  // An AIR FROST is defined as air temperature at or below 0.0 C. That is the
  // definition, not a rounding of 'cold'. Ground frost is a different measurement
  // and this is not it.
  const AIR_FROST = 0;

  function conditionFrom(hpa, trend, temp, precip, wind, gust){
    if(precip > 0.1 && temp <= 1) return 'snow';
    // Level and trend TOGETHER. An earlier version answered on the trend first and
    // only fell through to the level when the trend was quiet, which made it read
    // backwards at the bottom of the scale: a glass at 955 falling 3 hPa showed
    // rain, while the same glass falling only 1 showed storm, because the faster
    // fall was caught by the trend rule and never reached the level rule at all.
    // It also called 955 'sunny' the moment it ticked upward, which is a severe
    // low merely recovering, not a fine day.
    //
    // So: the band the needle sits in sets the severity, and the trend moves it —
    // a fall worsens it, a rise eases it, and a rapid move counts double. That is
    // how the instrument is actually read, and it cannot invert.
    // One state per word printed on the dial. That is the whole idea and it took a
    // render to see it: FAIR and VERY DRY had been sharing a rung, so a deep
    // settled 1040 anticyclone came out as an ordinary fair day, and 'settled' was
    // only reachable by a RISING needle — which is backwards, since settled weather
    // is high and steady, not climbing.
    let sev = hpa < 28.5*INHG ?  3              // STORMY
            : hpa < 29.4*INHG ?  2              // RAIN
            : hpa < 29.9*INHG ?  1              // CHANGE
            : hpa < 30.5*INHG ?  0              // FAIR
            :                   -1;             // VERY DRY — the settled high
    if(trend !== null){
      if(trend <= -3.6) sev += 2;
      else if(trend <= -1.6) sev += 1;
      else if(trend >= 3.6) sev -= 2;
      else if(trend >= 1.6) sev -= 1;
    }
    // Five rungs now, not four. The severity above runs -2 to +5, nine values, and
    // four states could only show four of them apart — everything at -2, -1 and 0
    // came out identically 'sunny', which is 21.5% of all possible weather lumped
    // together, a settled 1040 anticyclone looking the same as a marginal 1015
    // nudging upward. The extra rung at the bottom takes that apart. The top end
    // is still merged, deliberately: 'storm' is already the densest arrangement in
    // the set and a step beyond it would need new photography, not a new recipe.
    // sev runs -3 to +5; the ends stay merged, which is honest — a barometer pinned
    // at 1045 and one at 1050 are the same weather, and so are two ways of being in
    // a tempest.
    const baro = ['settled','sunny','unsettled','rain','storm'][Math.max(0, Math.min(4, sev + 1))];

    // Wind and frost are the two readings a barometer genuinely cannot give you: a
    // gale under a steady high and a flat calm under the same high put the needle
    // in exactly the same place. They come from their own measurements.
    //
    // Order matters and is physical. Rain and storm already describe unsettled
    // windy weather, so wind only becomes the notable feature when the pressure is
    // not telling a stronger story. And frost forms in still air, so a windy night
    // is not a frosty one — which the ordering gives for free.
    if(baro === 'rain' || baro === 'storm') return baro;
    if((wind != null && wind >= BEAUFORT_6) || (gust != null && gust >= GALE)) return 'windy';
    if(temp <= AIR_FROST && precip <= 0.1) return 'frost';
    return baro;
  }

  let baroHpaNow = null, baroTrend = null;
  const svgNS = 'http://www.w3.org/2000/svg';
  const elBands = document.getElementById('baro-bands');
  const elScale = document.getElementById('baro-scale');
  const elNeedleG = document.getElementById('baro-needle-g');
  const elNeedle = document.getElementById('baro-needle');
  const elHub = document.getElementById('baro-hub');
  const elSetG = document.getElementById('baro-set-g');
  const elSet = document.getElementById('baro-set');
  const elHpa = document.getElementById('baro-hpa');
  const elTend = document.getElementById('baro-tend');
  const elTendMark = document.getElementById('baro-tend-mark');
  const elTendWords = document.getElementById('baro-tend-words');
  const elBaro = document.getElementById('barometer');

  (function drawScale(){
    BANDS.forEach((b, i) => {
      const x = baroX(b.lo), w = baroX(b.hi) - x;
      const r = document.createElementNS(svgNS,'rect');
      r.setAttribute('x', x); r.setAttribute('y', YAXIS-14);
      r.setAttribute('width', w); r.setAttribute('height', 28);
      r.setAttribute('class', 'band' + (i%2 ? ' alt' : ''));
      elBands.appendChild(r);
      const t = document.createElementNS(svgNS,'text');
      t.setAttribute('x', x + w/2); t.setAttribute('y', YAXIS-22);
      t.setAttribute('class','bandword'); t.textContent = b.word;
      elBands.appendChild(t);
    });
    const rule = document.createElementNS(svgNS,'line');
    rule.setAttribute('x1', X0); rule.setAttribute('x2', X1);
    rule.setAttribute('y1', YAXIS+14); rule.setAttribute('y2', YAXIS+14);
    rule.setAttribute('class','rule'); elScale.appendChild(rule);
    // The engraving is metric, so it is engraved at round metric values: a tick
    // every 5 hPa, numbered every 25. Ticking at tenths of an inch instead put the
    // numbers at 948, 965, 982 — inches converted to hPa, which is the worst of
    // both and reads as nothing at all. The WORDS stay where the traditional
    // English scale puts them, because those boundaries are what they are.
    for(let hpa = 950; hpa <= BARO_HI; hpa += 5){
      if(hpa < BARO_LO) continue;
      const major = hpa % 25 === 0;
      const x = baroX(hpa);
      const ln = document.createElementNS(svgNS,'line');
      ln.setAttribute('x1', x); ln.setAttribute('x2', x);
      ln.setAttribute('y1', YAXIS+14); ln.setAttribute('y2', YAXIS + (major ? 24 : 19));
      ln.setAttribute('class', 'tick' + (major ? ' major' : ''));
      elScale.appendChild(ln);
      if(major){
        const t = document.createElementNS(svgNS,'text');
        t.setAttribute('x', x); t.setAttribute('y', YAXIS+36);
        t.setAttribute('class','num'); t.textContent = hpa;
        elScale.appendChild(t);
      }
    }
    elNeedle.setAttribute('x1', 0); elNeedle.setAttribute('x2', 0);
    elNeedle.setAttribute('y1', YAXIS-17); elNeedle.setAttribute('y2', YAXIS+17);
    elHub.setAttribute('cx', 0); elHub.setAttribute('cy', YAXIS+17);
    elSet.setAttribute('points', '-6,' + (YAXIS-20) + ' 6,' + (YAXIS-20) + ' 0,' + (YAXIS-9));
  })();

  /* ---------- a thumb can't catch an 11px hand ----------
     The brass hand is 11px across on a Kindle and 4px on the 3in phone, and it is
     the one control a barometer is actually used through: set it against the
     needle, come back later, read the gap. So it gets candler's pin treatment --
     a transparent rect inside its own <g>, nothing of it showing, not one pixel of
     the brass moved.
     Two things differ from a pin. The SVG is SCALED to the screen, so a rect fixed
     in viewBox units is a different size on every device; it is sized in the units
     that make it a real 44px wherever it is, re-measured on resize. And on the 3in
     phone the whole dial is only 39px tall, so 44 is not available vertically --
     it takes the full height of the dial there and stops, which is all there is.
     Held to (pointer: coarse); a mouse is pixel-precise and the desktop is
     untouched, as with every other target on this site.
     Safe to make generous because nothing else inside this SVG takes a pointer at
     all, and because a TAP does not move the hand -- only a drag does, and a drag
     is deliberate. */
  const elGrab = document.getElementById('baro-set-grab');
  const coarse = window.matchMedia ? window.matchMedia('(pointer: coarse)') : null;
  const HAND_MID = YAXIS - 14.5;             // the polygon spans YAXIS-20..YAXIS-9
  function sizeGrab(){
    if(!coarse || !coarse.matches){ elGrab.setAttribute('width', 0); elGrab.setAttribute('height', 0); return; }
    const box = document.getElementById('baro-svg').getBoundingClientRect();
    if(!box.width) return;
    const u = 600 / box.width;                // viewBox units per CSS pixel
    const w = Math.min(44 * u, 96);           // capped at 96 units (~18 hPa) either way
    const h = Math.min(44 * u, 104);          // 104 is the whole height of the dial
    elGrab.setAttribute('x', (-w/2).toFixed(2)); elGrab.setAttribute('width', w.toFixed(2));
    elGrab.setAttribute('y', Math.max(0, HAND_MID - h/2).toFixed(2)); elGrab.setAttribute('height', h.toFixed(2));
  }
  sizeGrab();
  window.addEventListener('resize', sizeGrab);
  window.addEventListener('orientationchange', () => setTimeout(sizeGrab, 140));

  // The brass hand. On a real barometer you set it against the needle and come
  // back later to read the gap, so it has to stay where it was put — including
  // between visits.
  /* STORAGE CAN THROW, rather than merely be empty. A private window, or any
     browser set to block site data, makes `localStorage` raise on the very first
     read -- and read unguarded at the top of a script that takes the WHOLE PIECE
     down with it. Found Aug 2026 by loading every piece with its props taken
     away: with site data blocked, musebox, lamp, roller and storm all came up
     BLANK, and two of those were pieces she had already signed off. candler had
     guarded its own read all along, which is what a right answer looks like.
     Everything goes through these two now. Losing the setting is nothing; losing
     the piece is everything. */
  const readStore = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
  const writeStore = (k,v) => { try{ localStorage.setItem(k,v); }catch(e){} };
  let setHpa = parseFloat(readStore('sagne-storm-sethand'));
  if(!isFinite(setHpa)) setHpa = 29.9*INHG;
  function drawSet(){ elSetG.setAttribute('transform', 'translate(' + baroX(setHpa).toFixed(1) + ',0)'); }
  function placeSet(hpa){
    setHpa = Math.max(BARO_LO, Math.min(BARO_HI, hpa));
    writeStore('sagne-storm-sethand', String(setHpa));
    drawSet();
  }
  drawSet();
  (function dragSet(){
    const svg = document.getElementById('baro-svg');
    let dragging = false;
    const xAt = ev => {
      const r = svg.getBoundingClientRect();
      return X0 + ((ev.clientX - r.left)/r.width*600 - X0);
    };
    // Where in the hand it was taken hold of, kept for the length of the drag. The
    // grab box is wider than the brass, so placing the hand at the bare pointer
    // would snap it across to the finger the instant it was touched -- which reads
    // as the hand jumping out from under you. It moves WITH the finger instead.
    let grabOff = 0;
    elSetG.addEventListener('pointerdown', ev => {
      dragging = true; elSetG.classList.add('dragging');
      elSetG.setPointerCapture(ev.pointerId); ev.preventDefault();
      const r = svg.getBoundingClientRect();
      grabOff = (ev.clientX - r.left)/r.width*600 - baroX(setHpa);
    });
    elSetG.addEventListener('pointermove', ev => {
      if(!dragging) return;
      const r = svg.getBoundingClientRect();
      placeSet(baroHpa((ev.clientX - r.left)/r.width*600 - grabOff));
    });
    const stop = ev => { dragging = false; elSetG.classList.remove('dragging'); };
    elSetG.addEventListener('pointerup', stop);
    elSetG.addEventListener('pointercancel', stop);
  })();
  document.getElementById('baro-set-btn').addEventListener('click', () => {
    if(baroHpaNow != null) placeSet(baroHpaNow);
  });

  // The same four speeds tendencyWords() names, counted rather than spelled, so
  // the mark and the words can never drift apart: one chevron for 'slowly', two
  // for the plain word, three for 'rapidly', four for 'very rapidly'. Three would
  // have been tidier and would have had to merge two rungs of a real scale.
  function tendencySteps(d){
    const a = Math.abs(d);
    if(a < 0.1) return 0;
    if(a < 1.6) return 1;
    if(a < 3.6) return 2;
    if(a < 6.0) return 3;
    return 4;
  }
  function drawTendencyMark(d){
    const n = tendencySteps(d), up = d > 0;
    // steady: a level bar. It cannot be confused with the reading's own dash,
    // which shows only when there is no pressure at all -- and then this mark is
    // not on the page.
    if(n === 0){ elTendMark.innerHTML = '<path d="M2.5,9.5 H10.5"/>'; return; }
    const P = 4.4, RISE = 4;                       // pitch between chevrons, and each one's depth
    const top = 9.5 - ((n-1)*P + RISE)/2;          // the stack sits centred on the line, whatever its height
    let path = '';
    for(let i=0;i<n;i++){
      const y = +(top + i*P).toFixed(2), b = +(y + RISE).toFixed(2);
      path += up ? `M2.5,${b} L6.5,${y} L10.5,${b} ` : `M2.5,${y} L6.5,${b} L10.5,${y} `;
    }
    elTendMark.innerHTML = '<path d="' + path.trim() + '"/>';
  }
  function setTendency(){
    if(baroTrend == null){ elTend.hidden = true; elTend.classList.remove('open'); return; }
    const words = tendencyWords(baroTrend) + ' · ' + (baroTrend >= 0 ? '+' : '') + baroTrend.toFixed(1) + ' in 3h';
    drawTendencyMark(baroTrend);
    elTendWords.textContent = words;
    elTend.setAttribute('aria-label', words);
    elTend.hidden = false;
  }
  elTend.addEventListener('click', ev => { ev.stopPropagation(); elTend.classList.toggle('open'); });
  document.addEventListener('pointerdown', ev => { if(!elTend.contains(ev.target)) elTend.classList.remove('open'); });
  document.addEventListener('keydown', ev => { if(ev.key === 'Escape') elTend.classList.remove('open'); });

  function drawBarometer(){
    if(baroHpaNow == null){
      elNeedleG.classList.remove('has-reading');
      elHpa.textContent = '—'; elTend.hidden = true; elTend.classList.remove('open'); return;
    }
    // The first reading is placed with the sweep turned off, or the needle would be
    // seen travelling up from the dead left end it was never really at.
    const first = !elNeedleG.classList.contains('has-reading');
    if(first) elNeedleG.style.transition = 'none';
    elNeedleG.setAttribute('transform', 'translate(' + baroX(baroHpaNow).toFixed(1) + ',0)');
    elNeedleG.classList.add('has-reading');
    if(first){ elNeedleG.getBoundingClientRect(); elNeedleG.style.transition = ''; }
    elHpa.textContent = Math.round(baroHpaNow) + ' hPa';
    setTendency();
  }

  // One missed refresh is not worth interrupting anyone over -- open-meteo refreshes
  // every ten minutes and a single blip is normal. Past that, staying quiet would
  // mean showing an old sky as if it were the one outside, so the two marks come up.
  // Counted exactly as galileo, conometer and windower count it.
  var weatherFetchFailures = 0;
  async function fetchWeather(){
    try{
      const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=pressure_msl,precipitation,temperature_2m,wind_speed_10m,wind_gusts_10m&hourly=pressure_msl&past_days=1&forecast_days=1&wind_speed_unit=kmh&timezone=auto`;
      const res=await fetch(url);
      const data=await res.json();
      const c=data && data.current;
      // the three-hour change, taken from the hourly series against the hour the
      // current reading belongs to — null rather than a guess if it is not there
      baroTrend = (function(){
        const h = data && data.hourly;
        if(!h || !Array.isArray(h.time) || !Array.isArray(h.pressure_msl)) return null;
        const now = c && c.time;
        let i = -1;
        for(let k=0;k<h.time.length;k++){ if(!now || h.time[k] <= now) i = k; else break; }
        if(i < 3) return null;
        const a = h.pressure_msl[i-3], b = h.pressure_msl[i];
        return (typeof a === 'number' && typeof b === 'number') ? b - a : null;
      })();
      if(c){
        const precip=typeof c.precipitation==='number' ? c.precipitation : 0;
        const temp=typeof c.temperature_2m==='number' ? c.temperature_2m : 12;
        // Sea-level pressure, not the pressure where the visitor is standing.
        // Surface pressure falls about 12 hPa per 100 m of altitude, so a scale
        // calibrated at sea level reads altitude rather than weather if you feed
        // it the local figure — 952 hPa in Munich, 834 in Denver, on the calmest
        // day of the year. Every printed barometer scale in the world is
        // calibrated to sea level, which is what makes 1013 mean anything.
        baroHpaNow = typeof c.pressure_msl==='number' ? c.pressure_msl : null;
        const wind=typeof c.wind_speed_10m==='number' ? c.wind_speed_10m : null;
        const gust=typeof c.wind_gusts_10m==='number' ? c.wind_gusts_10m : null;
        if(baroHpaNow != null) liveCondition = conditionFrom(baroHpaNow, baroTrend, temp, precip, wind, gust);
        drawBarometer();
        if(weatherFetchFailures > 0){ weatherFetchFailures = 0; hideFetchTrouble(); }
      } else {
        // a reply that arrived but carried no reading is a failure like any other,
        // and used to fall through here without a word
        throw new Error('unexpected response shape');
      }
    }catch(e){
      if(!chkLive.checked) return;      // reading a hand-set glass: nothing to miss
      weatherFetchFailures++;
      if(weatherFetchFailures >= 2){
        showFetchTrouble();
      }
    }
  }
  fetchWeather();
  setInterval(()=>{ if(chkLive.checked) fetchWeather(); }, 10*60*1000);

  // the flag: a quiet, always-there way to check the weather somewhere other than
  // wherever the visitor actually is — never open by default, no page text anywhere
  // else hints it exists. Geocoding goes through OpenStreetMap's Nominatim (free, no
  // key) since open-meteo's own geocoder searches place names, not postcodes.
  /* ---------- the height of the screen you can actually see ----------
     see the note on #stage. Re-measured on resize and rotation, but NOT while a
     text field has focus: an on-screen keyboard shrinks innerHeight, and the
     piece must not resize itself under someone typing a place into it. */
  function setVisibleHeight(){
    const el = document.activeElement;
    if (el && el.tagName === 'INPUT' && el.type !== 'range' && el.type !== 'checkbox') return;
    document.documentElement.style.setProperty('--vh', (window.innerHeight / 100) + 'px');
  }
  setVisibleHeight();
  window.addEventListener('resize', setVisibleHeight);
  window.addEventListener('orientationchange', () => setTimeout(setVisibleHeight, 120));
  document.addEventListener('focusout', () => setTimeout(setVisibleHeight, 60));

  (function initLocationSearch(){
    const flag=document.getElementById('loc-flag');
    const form=document.getElementById('loc-search');
    const input=document.getElementById('loc-search-input');
    const status=document.getElementById('loc-search-status');
    if(!flag || !form || !input) return;

    flag.addEventListener('click', ()=>{
      const open=form.classList.toggle('open');
      flag.classList.toggle('open', open);
      flag.setAttribute('aria-expanded', open ? 'true' : 'false');
      if(open) input.focus();
      else status.textContent='';
    });

    /* An on-screen keyboard is not a keyboard. A one-field form submits on Enter in
       a desktop browser, but the Go key on some Android ones -- the Kindle's among
       them -- can leave the form alone entirely, and then a typed-in location does
       nothing and says nothing. Asking the form directly costs a line; preventing
       the key's own default is what stops a browser that DOES submit searching
       twice. */
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.keyCode === 13){
        e.preventDefault();
        form.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
      }
    });

    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const q=input.value.trim();
      if(!q) return;
      status.textContent='looking…';
      try{
        const url=`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q)}`;
        const res=await fetch(url);
        const results=await res.json();
        if(!results || !results.length){ status.textContent="couldn't find that"; return; }
        lat=parseFloat(results[0].lat); lon=parseFloat(results[0].lon);
        chkLive.checked=true;
        await fetchWeather();
        status.textContent=results[0].display_name.split(',').slice(0,2).join(', ');
        input.value='';
      }catch(e){
        status.textContent="couldn't reach the map — try again";
      }
    });
  })();

  // While the visitor is picking a condition by hand the barometer is not driving
  // anything, and it would be a small lie to leave it looking as though it were.
  function setLive(v){
    chkLive.checked=v;
    elBaro.classList.toggle('idle', !v);
  }
  chkLive.addEventListener('change', ()=>{ setLive(chkLive.checked); applyCondition(); });
  keyItems.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      manualIndex=ORDER.indexOf(btn.dataset.cond);
      setLive(false);
      applyCondition();
    });
  });

  // ---------- assets: one real vessel photo, held fixed, plus four real macro
  // photographs — one large crystal flake, a field of small ones, vertical
  // ice wisps, and bubbles at two densities — the vessel's own geometry, read
  // directly from its pixels, is what every recipe is clipped and grown
  // against, so nothing can ever misalign ----------
  function loadImg(src){ return new Promise(res=>{ const im=new Image(); im.onload=()=>res(im); im.src=src; }); }
  let W=0,H=0, vesselCanvas=null, bigData=null, altBigData=null;
  let smallData=null, wispData=null, bubbleDenseData=null, bubbleSparseData=null;
  let profile=null;
  let ready=false;
  const cache={};
  const CLUMP=260;

  function fullFrame(img, pad){
    const c=document.createElement('canvas'); c.width=W+pad; c.height=H+pad;
    c.getContext('2d').drawImage(img, 0,0,img.naturalWidth,img.naturalHeight, 0,0, W+pad, H+pad);
    return c.getContext('2d').getImageData(0,0,W+pad,H+pad);
  }

  Promise.all([
    loadImg('storm-background.png'), loadImg('storm-tex-crystals.jpg'),
    loadImg('storm-tex-smallcrystal.jpg'), loadImg('storm-tex-wisps.jpg'),
    loadImg('storm-tex-bubblesdense.jpg'), loadImg('storm-tex-bubblessparse.jpg'),
  ]).then(([vesselImg, crystalImg, smallImg, wispImg, bubDenseImg, bubSparseImg])=>{
      W=vesselImg.naturalWidth; H=vesselImg.naturalHeight;
      frameA.width=frameB.width=W; frameA.height=frameB.height=H;

      vesselCanvas=document.createElement('canvas');
      vesselCanvas.width=W; vesselCanvas.height=H;
      vesselCanvas.getContext('2d').drawImage(vesselImg,0,0);

      const pad=40;
      // "big": one single, cleanly-isolated flake, tightly cropped, so it
      // reads as one cohesive clump rather than scattered fragments — this is
      // placed and centred as its own small unit, not stretched full-width
      // the way the ambient textures below are
      const bigCanvas=document.createElement('canvas');
      bigCanvas.width=CLUMP; bigCanvas.height=CLUMP;
      bigCanvas.getContext('2d').drawImage(crystalImg, 280,340,290,290, 0,0,CLUMP,CLUMP);
      bigData=bigCanvas.getContext('2d').getImageData(0,0,CLUMP,CLUMP);

      // same clean flake, mirrored, so storm's smaller supplementary clump
      // still reads as its own thing without risking a second dirty crop
      const altCanvas=document.createElement('canvas');
      altCanvas.width=CLUMP; altCanvas.height=CLUMP;
      const actx=altCanvas.getContext('2d');
      actx.translate(CLUMP,0); actx.scale(-1,1);
      actx.drawImage(crystalImg, 280,340,290,290, 0,0,CLUMP,CLUMP);
      altBigData=altCanvas.getContext('2d').getImageData(0,0,CLUMP,CLUMP);

      smallData=fullFrame(smallImg, pad);
      wispData=fullFrame(wispImg, pad);
      bubbleDenseData=fullFrame(bubDenseImg, pad);
      bubbleSparseData=fullFrame(bubSparseImg, pad);

      profile=buildProfile(vesselCanvas);
      ready=true;
      drawKeyThumbnails();
      applyCondition();
    });

  // paint each key button's small canvas with that condition's own
  // composite, scaled down — the key IS the legend, no separate art needed
  function drawKeyThumbnails(){
    keyItems.forEach(btn=>{
      const name=btn.dataset.cond;
      const cv=btn.querySelector('canvas');
      const cctx=cv.getContext('2d');
      cctx.drawImage(getComposite(name), 0,0,W,H, 0,0,cv.width,cv.height);
    });
  }

  // read the vessel photo's own pixels to find, per row, exactly where its
  // glass interior is — and stop at the true bottom of the bulb, not the
  // little foot/base below it, so crystal can never render into the base
  // Y_TOP sits right at the real liquid line visible in the vessel photo —
  // crystal only ever forms in the liquid, never in the empty neck above it
  const Y_TOP=320, Y_BULB_BOT=610, Y_MAXFILL=280;
  function buildProfile(vc){
    const d=vc.getContext('2d').getImageData(0,0,W,H).data;
    const rows=new Array(H).fill(null);
    for(let y=Y_TOP;y<=Y_BULB_BOT;y++){
      let l=-1, r=-1;
      for(let x=0;x<W;x++){
        const i=(y*W+x)*4;
        const bright=Math.max(d[i],d[i+1],d[i+2]);
        if(bright>12){ if(l===-1) l=x; r=x; }
      }
      if(l!==-1) rows[y]=[l,r];
    }
    return rows;
  }

  function grayAt(imgData, x, y){
    const w=imgData.width, h=imgData.height;
    x=Math.floor(x); y=Math.floor(y);
    const xi=((x%w)+w)%w, yi=((y%h)+h)%h;
    const i=(yi*w+xi)*4, d=imgData.data;
    return d[i]*0.34+d[i+1]*0.33+d[i+2]*0.33;
  }

  function mulberry32(a){
    return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
  }
  function edgeNoise(width, seed, rough){
    const rnd=mulberry32(seed);
    const terms=[]; for(let k=0;k<4;k++) terms.push([rnd()*0.05*rough+0.006, rnd()*6.28, (rnd()*0.7+0.3)/(k+1)]);
    const n=new Float32Array(width);
    let mn=Infinity, mx=-Infinity;
    for(let x=0;x<width;x++){
      let v=0; for(const [freq,phase,amp] of terms) v+=amp*Math.sin(x*freq+phase);
      n[x]=v; if(v<mn)mn=v; if(v>mx)mx=v;
    }
    for(let x=0;x<width;x++) n[x]=(n[x]-mn)/(mx-mn+1e-6);
    return n;
  }

  function zoneAlpha(y,x0,x1,topY,botY,edgeband,noise){
    const a=new Float32Array(x1-x0+1).fill(1);
    if(y<topY-edgeband || y>botY+edgeband){ a.fill(0); return a; }
    for(let x=x0;x<=x1;x++){
      let v=1;
      if(y>botY-edgeband) v*=Math.max(0,Math.min(1,(botY-y)/edgeband+0.5+(noise[x]-0.5)*0.4));
      if(y<topY+edgeband) v*=Math.max(0,Math.min(1,(y-topY)/edgeband+0.5+(noise[x]-0.5)*0.4));
      a[x-x0]=v;
    }
    return a;
  }

  // renders one row's contribution from a set of discrete clumps (a crystal
  // flake, or a cluster of bubbles) into acc — each clump is its own small,
  // bounded, centred shape, not a stretch across the whole vessel width
  function renderClumpZone(clumps, globalAmt, y, l, r, acc, noise){
    for(const cp of clumps){
      const cpTopY=cp.botY-cp.size, cpX0=cp.cx-cp.size/2;
      if(y<cpTopY || y>cp.botY) continue;
      const cl=Math.max(l,Math.floor(cpX0)), cr=Math.min(r,Math.ceil(cpX0+cp.size));
      if(cr<=cl) continue;
      const a=zoneAlpha(y,cl,cr,cpTopY,cp.botY,cp.edge,noise);
      for(let x=cl;x<=cr;x++){
        let tx,ty;
        if(cp.raw){
          // raw: sample the shared texture directly at a per-clump offset,
          // so several clumps can draw from one big photo without repeating
          tx=x-cpX0+(cp.offX||0); ty=y-cpTopY+(cp.offY||0);
        } else {
          // clamp, never wrap — sampling past the texture's own edge must
          // read as empty, not loop around to unrelated content elsewhere
          tx=Math.max(0,Math.min(CLUMP-1,(x-cpX0)/cp.size*CLUMP));
          ty=Math.max(0,Math.min(CLUMP-1,(y-cpTopY)/cp.size*CLUMP));
        }
        let t=grayAt(cp.tex,tx,ty)/255;
        if(cp.altTex){
          const atx=tx+30, aty=ty+18;
          if(atx<CLUMP && aty<CLUMP) t=Math.max(t, grayAt(cp.altTex,atx,aty)/255);
        }
        // clear the photo's background floor so it never tints the glass,
        // only the shape itself does — bubble photos run duller/hazier in
        // their "empty" areas than the crystal one, so need a harder cut
        const floor=cp.floor!=null?cp.floor:0.12;
        t=Math.max(0,Math.min(1,(t-floor)/(1-floor)*1.15));
        // extra contrast so a dense source patch still reads as separate
        // blobs with gaps, not one washed-out filled shape
        if(cp.gamma) t=Math.pow(t,cp.gamma);
        // soft horizontal fade too, so the clump's box never reads as a
        // rectangle — only its top/bottom got that treatment above.
        // fadeMul controls how much of the radius stays full-strength
        // before the fade starts — lower means a softer, rounder clump
        const distX=Math.abs(x-cp.cx)/(cp.size/2);
        const hFade=Math.max(0,Math.min(1,(1-distX)*(cp.fadeMul||3)));
        const v=a[x-cl]*hFade*globalAmt*cp.amtMul*t;
        if(v>acc[x-l]) acc[x-l]=v;
      }
    }
  }

  function renderRecipe(recipe, seed){
    const c=document.createElement('canvas'); c.width=W; c.height=H;
    const cctx=c.getContext('2d');
    cctx.drawImage(vesselCanvas,0,0);
    const imgData=cctx.getImageData(0,0,W,H);
    const px=imgData.data;
    const noiseA=edgeNoise(W+40, seed, 1.4);
    const noiseB=edgeNoise(W+40, seed+9, 1.1);
    const bigSrc = recipe.useAltBig ? altBigData : bigData;

    const TEX = { small:smallData, wisp:wispData, bubbleDense:bubbleDenseData, bubbleSparse:bubbleSparseData };
    const bottomTex = TEX[recipe.bottomTex] || smallData;
    const bubbleTex = recipe.spreadBubble==='dense' ? bubbleDenseData : bubbleSparseData;

    const smBotY=Y_BULB_BOT, smTopY=Y_BULB_BOT-(recipe.bottomReach||0)*(Y_BULB_BOT-Y_MAXFILL);
    const stkTopY=Y_TOP, stkBotY=Y_TOP+(recipe.streakReach||0)*(Y_BULB_BOT-Y_TOP);
    // a handful of small wisps down at the base too, distinct from the
    // top ones — sampled from a different offset so it's not a repeat
    const bsBotY=Y_BULB_BOT, bsTopY=Y_BULB_BOT-(recipe.bottomStreakReach||0)*(Y_BULB_BOT-Y_MAXFILL);

    // the big clump sits centred on the vessel's own midline at the bottom,
    // as one grouped unit — not spread across the full width of the glass.
    // extraFeathers adds a couple of smaller, dimmer flakes just behind and
    // to either side, so it reads as a cluster branching out, not one sprite
    const clumpH = CLUMP*(recipe.bigReach||0.5), clumpW = clumpH;
    const clumpBotY = Y_BULB_BOT - 4, clumpTopY = clumpBotY - clumpH;
    const midRow = profile[Y_BULB_BOT-20] || profile[Y_BULB_BOT-1];
    const clumpCx = midRow ? (midRow[0]+midRow[1])/2 : W/2;

    const clumps = [{ cx:clumpCx, size:clumpH, botY:clumpBotY, amtMul:1, tex:bigSrc, altTex:recipe.layered?altBigData:null, edge:18 }];
    if(recipe.extraFeathers){
      const s2 = clumpH*0.6;
      clumps.push({ cx:clumpCx-clumpW*0.4, size:s2, botY:clumpBotY-6, amtMul:0.68, tex:altBigData, altTex:null, edge:16 });
      const s3 = clumpH*0.5;
      clumps.push({ cx:clumpCx+clumpW*0.38, size:s3, botY:clumpBotY-3, amtMul:0.6, tex:bigSrc, altTex:null, edge:16 });
    }
    // storm: a whole pile of large flakes overlapping low in the vessel,
    // instead of one clean shape — density from real repeated crystal
    // sprites, not a stretched texture
    if(recipe.manyFlakes){
      const stack = [
        {dx:-0.55, dy:-2,  s:0.62, alt:false},
        {dx:0.5,   dy:-8,  s:0.58, alt:true},
        {dx:-0.15, dy:-25, s:0.66, alt:true},
        {dx:0.28,  dy:-30, s:0.5,  alt:false},
        {dx:-0.78, dy:-42, s:0.42, alt:false},
        {dx:0.78,  dy:-38, s:0.4,  alt:true},
        {dx:0.05,  dy:-58, s:0.46, alt:false},
        {dx:-0.35, dy:-70, s:0.5,  alt:true},
        {dx:0.4,   dy:-75, s:0.44, alt:false},
        {dx:-0.9,  dy:-15, s:0.36, alt:true},
        {dx:0.92,  dy:-10, s:0.34, alt:false},
        {dx:0.1,   dy:-95, s:0.4,  alt:true},
        {dx:-0.6,  dy:-90, s:0.36, alt:false},
        {dx:0.65,  dy:-100,s:0.34, alt:true},
        {dx:-0.2,  dy:-115,s:0.38, alt:false},
        {dx:0.3,   dy:-125,s:0.32, alt:true},
        {dx:-0.85, dy:-60, s:0.3,  alt:false},
        {dx:0.85,  dy:-65, s:0.3,  alt:true},
      ];
      for(const p of stack){
        clumps.push({ cx:clumpCx+clumpW*p.dx, size:clumpH*p.s, botY:clumpBotY+p.dy, amtMul:1, tex:p.alt?altBigData:bigSrc, altTex:null, edge:16 });
      }
    }

    // bubbles as their own discrete clumps rather than an even spread — one
    // bold, well-defined mass of larger bubbles low in the centre, plus a
    // handful of smaller ones scattered loosely around the rest
    const bubbleClumps = [];
    if(recipe.bubbleClumps){
      const bh=Y_BULB_BOT-Y_MAXFILL;
      bubbleClumps.push({ cx:clumpCx, size:150, botY:Y_BULB_BOT-2, amtMul:1.15, tex:bubbleDenseData, raw:true, offX:30, offY:400, edge:24, floor:0.34, gamma:1.25, fadeMul:2.1 });
      bubbleClumps.push({ cx:clumpCx-clumpW*0.72, size:50, botY:Y_MAXFILL+bh*0.32, amtMul:0.85, tex:bubbleSparseData, raw:true, offX:210, offY:20, edge:27, floor:0.16, gamma:1.4, fadeMul:1.3 });
      bubbleClumps.push({ cx:clumpCx+clumpW*0.68, size:50, botY:Y_MAXFILL+bh*0.28, amtMul:0.8, tex:bubbleSparseData, raw:true, offX:345, offY:110, edge:27, floor:0.16, gamma:1.4, fadeMul:1.3 });
      bubbleClumps.push({ cx:clumpCx-clumpW*0.6, size:50, botY:Y_MAXFILL+bh*0.56, amtMul:0.85, tex:bubbleSparseData, raw:true, offX:75, offY:155, edge:27, floor:0.16, gamma:1.4, fadeMul:1.3 });
      bubbleClumps.push({ cx:clumpCx+clumpW*0.58, size:42, botY:Y_MAXFILL+bh*0.6, amtMul:0.8, tex:bubbleSparseData, raw:true, offX:300, offY:245, edge:23, floor:0.16, gamma:1.4, fadeMul:1.3 });
      bubbleClumps.push({ cx:clumpCx+clumpW*0.3, size:46, botY:Y_MAXFILL+bh*0.86, amtMul:0.75, tex:bubbleSparseData, raw:true, offX:120, offY:425, edge:25, floor:0.16, gamma:1.4, fadeMul:1.3 });
    }
    // sunny: just a small, tight knot of a few little bubbles at the
    // bottom centre — matches the reading chart's own sparse icon
    if(recipe.smallBubbleCluster){
      const bh=Y_BULB_BOT-Y_MAXFILL;
      const spots = [
        {dx:-0.12, dy:-4,  s:20, off:[210,20]},
        {dx:0.14,  dy:-10, s:18, off:[75,155]},
        {dx:-0.02, dy:-20, s:16, off:[300,245]},
        {dx:0.2,   dy:-24, s:15, off:[120,425]},
        {dx:-0.22, dy:-16, s:15, off:[345,110]},
      ];
      for(const s of spots){
        bubbleClumps.push({ cx:clumpCx+clumpW*s.dx, size:s.s, botY:Y_BULB_BOT-4+s.dy, amtMul:0.85, tex:bubbleSparseData, raw:true, offX:s.off[0], offY:s.off[1], edge:s.s*0.55, floor:0.16, gamma:1.4, fadeMul:1.3 });
      }
    }
    // seltzer: a lot of small bubbles worked in through the whole water
    // column top to bottom, not just clustered low down — like a fizzy
    // glass, not just a few loose clumps
    if(recipe.seltzer){
      const fizzOffsets = [
        [120,110],[255,155],[75,200],[210,290],[165,335],[345,335],
        [75,380],[30,425],[255,470],[345,470],[75,515],[165,515],
        [120,605],[300,650],[30,650],[210,155]
      ];
      const bh2=Y_BULB_BOT-Y_TOP;
      fizzOffsets.forEach((o,i)=>{
        const fx = (((i*0.37)%1)*1.7)-0.85;
        const fy = 0.06+((i*0.618)%1)*0.88;
        const size = 26+(i%3)*8;
        bubbleClumps.push({ cx:clumpCx+clumpW*fx, size, botY:Y_TOP+fy*bh2, amtMul:0.8, tex:bubbleSparseData, raw:true, offX:o[0], offY:o[1], edge:size*0.55, floor:0.16, gamma:1.4, fadeMul:1.3 });
      });
    }

    for(let y=Y_TOP;y<Y_BULB_BOT;y++){
      const row=profile[y];
      if(!row) continue;
      const [l,r]=row;
      const acc=new Float32Array(r-l+1);

      if(recipe.bigAmt) renderClumpZone(clumps, recipe.bigAmt, y, l, r, acc, noiseA);
      if(recipe.bubbleClumps || recipe.smallBubbleCluster) renderClumpZone(bubbleClumps, recipe.bubbleAmt||1, y, l, r, acc, noiseB);
      if(recipe.bottomAmt && smTopY-30<=y && y<=smBotY+10){
        const a=zoneAlpha(y,l,r,smTopY,smBotY,20,noiseB);
        for(let x=l;x<=r;x++){
          const t=Math.max(0,Math.min(1,grayAt(bottomTex,x+20,y+20)/255*1.1));
          const v=a[x-l]*recipe.bottomAmt*t;
          if(v>acc[x-l]) acc[x-l]=v;
        }
      }
      if(recipe.spreadAmt){
        // packed dense and solid low in the vessel, thinning out to loose
        // scattered flecks higher up — a turbulent, storm-heavy fill
        // rather than one clean shape
        let vFade=1;
        if(recipe.spreadTaper){
          // stays essentially clear near the liquid line, then rises fast
          // into a dense, packed mass low in the vessel — matches the real
          // reference photo, which is clear for its upper third or so
          const frac=(y-Y_TOP)/(Y_BULB_BOT-Y_TOP);
          const start=recipe.spreadTaperStart!=null?recipe.spreadTaperStart:0.3;
          const raw=Math.max(0,(frac-start)/(1-start));
          vFade=Math.max(0,Math.min(1,Math.pow(raw,1.3)*1.3));
        }
        for(let x=l;x<=r;x++){
          let t1=0;
          if(!recipe.spreadBubbleOnly){
            t1=grayAt(smallData,x+20,y+20)/255;
            // punch contrast — the source photo's own background haze sits
            // fairly bright, so a plain read-through never gets past a grey
            // wash; cut a floor and amplify what's left toward solid white
            t1=Math.max(0,Math.min(1,(t1-0.32)/0.68*1.9));
          }
          let t2=grayAt(bubbleTex,x+20,y+20)/255;
          t2=Math.max(0,Math.min(1,(t2-0.25)/0.75*1.6));
          const v=Math.max(t1,t2)*recipe.spreadAmt*vFade;
          if(v>acc[x-l]) acc[x-l]=v;
        }
      }
      if(recipe.streakAmt && stkTopY-10<=y && y<=stkBotY+24){
        const a=zoneAlpha(y,l,r,stkTopY,stkBotY,24,noiseA);
        const halfW=(r-l)/2, cx2=(l+r)/2;
        for(let x=l;x<=r;x++){
          // a contrast curve so distinct wisps stand out from the haze
          // between them, without erasing them down to hairlines
          let t=grayAt(wispData,x+20,y+20)/255;
          t=Math.max(0,Math.min(1,(t-0.25)/0.75));
          t=Math.pow(t,1.3);
          // optionally confined toward the centre — "a couple of streaks in
          // the top centre" reads very differently from streaks edge-to-edge
          let cFade=1;
          if(recipe.streakCentered){
            const distX=Math.abs(x-cx2)/(halfW*(recipe.streakSpread||0.5));
            cFade=Math.max(0,Math.min(1,(1-distX)*3));
          }
          const v=a[x-l]*cFade*recipe.streakAmt*t;
          if(v>acc[x-l]) acc[x-l]=v;
        }
      }
      if(recipe.bottomStreakAmt && bsTopY-16<=y && y<=bsBotY+10){
        const a=zoneAlpha(y,l,r,bsTopY,bsBotY,16,noiseB);
        for(let x=l;x<=r;x++){
          let t=grayAt(wispData,x+220,y+340)/255;
          t=Math.max(0,Math.min(1,(t-0.25)/0.75));
          t=Math.pow(t,1.3);
          const v=a[x-l]*recipe.bottomStreakAmt*t;
          if(v>acc[x-l]) acc[x-l]=v;
        }
      }

      for(let x=l;x<=r;x++){
        const a=acc[x-l];
        if(a<=0) continue;
        const i=(y*W+x)*4, cr=230;
        px[i]=px[i]*(1-a)+cr*a; px[i+1]=px[i+1]*(1-a)+cr*a; px[i+2]=px[i+2]*(1-a)+cr*a;
      }
    }
    cctx.putImageData(imgData,0,0);
    return c;
  }

  function getComposite(name){
    if(!cache[name]) cache[name]=renderRecipe(RECIPES[name], 21+ORDER.indexOf(name));
    return cache[name];
  }

  function updateKeyActive(name){
    keyItems.forEach(btn=>btn.classList.toggle('active', btn.dataset.cond===name));
  }

  let shown=null, settleTimer=null;
  function applyCondition(){
    if(!ready) return;
    const name=currentCondition();
    updateKeyActive(name);
    const comp=getComposite(name);
    if(shown===null){
      ctxA.clearRect(0,0,W,H); ctxA.drawImage(comp,0,0);
      frameA.style.opacity=1; frameB.style.opacity=0;
      shown=name; return;
    }
    if(name!==shown){
      ctxB.clearRect(0,0,W,H); ctxB.drawImage(comp,0,0);
      frameB.style.opacity=1; frameA.style.opacity=0;
      shown=name;
      window.clearTimeout(settleTimer);
      settleTimer=window.setTimeout(()=>{
        ctxA.clearRect(0,0,W,H); ctxA.drawImage(comp,0,0);
        frameA.style.opacity=1; frameB.style.opacity=0;
      }, 950);
    }
  }

  setInterval(()=>{ if(ready) applyCondition(); }, 1500);
})();
</script>

<script>
(function(){
  var disc=document.getElementById('shelfdisc'), box=document.getElementById('plates');
  var rows=[].slice.call(box.querySelectorAll('.row'));
  function unroll(){ rows.forEach(function(r){ r.classList.remove('rolled'); }); }
  function shut(){ box.classList.remove('open'); disc.setAttribute('aria-expanded','false'); unroll(); }

  /* The twenty cards behind these plates are 6.2MB and not one of them can be
     seen until a plate is opened, but every page on the site was fetching the lot
     on load, ahead of the piece's own assets. Measured on bowl at 240px with a
     slow phone's CPU and connection, the bowl had still not appeared after 100
     seconds; held back, it is there in 12.
     They are held behind data-src rather than left to loading="lazy" alone,
     because that is a heuristic and not a promise -- the same page deferred them
     on a throttled connection and fetched all twenty on a fast one, since the
     browser's idea of "near the viewport" widens with bandwidth. This is the same
     on every machine. The attribute stays as a second line for anything that
     scrolls them into view another way. */
  var wired=false;
  function fetchCards(){
    if(wired) return; wired=true;
    [].slice.call(box.querySelectorAll('img[data-src]')).forEach(function(im){
      im.src=im.getAttribute('data-src'); im.removeAttribute('data-src');
    });
  }

  disc.addEventListener('click', function(ev){
    ev.stopPropagation();
    var open=box.classList.toggle('open');
    if(open) fetchCards();
    disc.setAttribute('aria-expanded', open?'true':'false');
    if(!open) unroll();
  });

  // Same bargain the case itself strikes: a mouse can hover, so a plate is a link
  // straight to its shelf. A thumb cannot, so the first tap on a plate rolls its
  // pieces out and only the second one goes to the shelf.
  var FINE=matchMedia('(hover: hover) and (pointer: fine)');
  rows.forEach(function(row){
    row.querySelector('.tag').addEventListener('click', function(ev){
      if(FINE.matches) return;
      if(row.classList.contains('rolled')) return;
      ev.preventDefault();
      unroll(); row.classList.add('rolled');
    });
  });

  document.addEventListener('click', function(ev){
    if(!box.contains(ev.target) && ev.target!==disc) shut();
  });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') shut(); });
})();
</script>
