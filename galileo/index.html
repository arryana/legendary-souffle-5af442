<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400&display=swap');

  :root{
    --bg:#171009;
    --brass:#b8903f;
    --brass-lo:#7a5f28;
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    background: radial-gradient(ellipse at 50% 15%, #241a10 0%, var(--bg) 70%);
    color:#e2d6bb;
    font-family:'Jost', sans-serif;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    overflow:hidden;
  }
  #stage{
    /* On a phone or tablet, 100% of the page -- like 100vh -- is the whole screen
       with the browser's own address bar counted as though it weren't there, and
       nothing here can scroll, so whatever lands under that bar is unreachable:
       on a Kindle in landscape that was the location flag's own field and the
       line that answers it. innerHeight is the honest number on every browser
       there is, old ones included. */
    height:100%;
    height:calc(var(--vh, 1vh) * 100);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:2vh 4vw;
    gap:1.2vh;
  }
  /* Three instruments stand in a row, sized by HEIGHT with width left to follow,
     so they read as a set on a shelf rather than three things squeezed into equal
     boxes. Each vessel is a different shape and keeps its own proportions. */
  #instruments{
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:min(3vw, 30px);
    /* Sized by height, with width following from each vessel's own proportions —
       but the three together are 1.09 times as wide as they are tall, so on a
       narrow screen height has to be capped by the width available or the set
       runs off the sides (the body does not scroll, so it would simply be cut
       off rather than reachable). The 1.15 leaves a little slack over that 1.09. */
    height:min(calc(var(--vh, 1vh) * 74), 690px, calc((96vw - 60px) / 0.86));
  }
  .instrument{
    height:100%;
    filter:drop-shadow(0 24px 46px rgba(0,0,0,.55));
  }
  .instrument svg{ height:100%; width:auto; overflow:visible; display:block; }
  /* the flag and its note/search live in one tight cluster so a shown note doesn't add
     a whole extra row of #stage's gap on top of its own height — keeps the bottom of the
     control stack from getting pushed past the fold on shorter screens */
  #loc-cluster{ display:flex; flex-direction:column; align-items:center; gap:2px; }

  .bulb-group{ transition: transform 1.4s cubic-bezier(.34,.1,.2,1); }
  .tag-chip{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
  }
  .hover-clone{
    opacity:0;
    transition: opacity .22s ease, transform .22s ease;
    pointer-events:none;
  }
  .hover-clone.show{ opacity:1; }
  .hit-circle{ cursor:pointer; }

  #unit-toggle{
    display:flex;
    align-items:center;
    gap:6px;
    font-family:'Cormorant Garamond', serif;
    font-size:17px;
    letter-spacing:.02em;
  }
  #unit-toggle button{
    background:none;
    border:none;
    color:#7a6b52;
    font:inherit;
    cursor:pointer;
    padding:2px 4px;
    transition:color .3s ease;
  }
  #unit-toggle button.active{ color:var(--brass); }
  #unit-toggle .sep{ color:#5a4c38; }
  #loc-note{
    display:none; font-size:12px; letter-spacing:.02em; color:#7a6b52;
    text-align:center; font-family:'Cormorant Garamond', serif;
  }
  #loc-note.visible{ display:block; }
  #loc-retry{ appearance:none; border:0; background:none; padding:0; margin-left:2px;
    font:inherit; color:inherit; text-decoration:underline; cursor:pointer; }
  #loc-retry:hover{ color:var(--brass); }
  #loc-retry:disabled{ text-decoration:none; opacity:.6; cursor:default; }

  /* a quiet flag, always available, for checking the weather somewhere other than
     wherever the visitor actually is — opens a small search bar, never on by default */
  #loc-flag{
    appearance:none; border:0; background:none; padding:4px 6px; margin-top:2px;
    font-size:15px; line-height:1; cursor:pointer; opacity:.4; transition:opacity .3s ease;
  }
  #loc-flag:hover, #loc-flag.open{ opacity:.85; }
  #loc-search{
    display:flex; align-items:center; gap:6px; max-height:0; overflow:hidden;
    opacity:0; transition:max-height .3s ease, opacity .3s ease, margin .3s ease;
    flex-shrink:0;
  }
  #loc-search.open{ max-height:40px; opacity:1; margin-top:2px; }
  #loc-search input{
    appearance:none; border:0; border-bottom:1px solid rgba(184,144,63,.4); background:none;
    color:#e2d6bb; font:15px/1.3 'Jost', sans-serif; letter-spacing:.02em; padding:3px 2px;
    width:132px; outline:none;
  }
  #loc-search input::placeholder{ color:#7a6b52; }
  #loc-search input:focus{ border-bottom-color:var(--brass); }
  #loc-search-status{
    font-size:11px; letter-spacing:.02em; color:#7a6b52; text-align:center;
    font-family:'Cormorant Garamond', serif; min-height:1.2em;
  }

  /* A thumb, and an eye at arm's length. At 15px the flag is a small target and
     the line that answers it -- 11px -- is genuinely hard to read on a Kindle or
     a 3in phone, which is what she found. None of this touches a desktop. */
  @media (pointer: coarse){
    #loc-flag{ font-size:22px; padding:6px 10px; }
    #loc-search.open{ max-height:56px; }
    #loc-search input{ font:19px/1.3 'Jost', sans-serif; width:min(62vw, 240px); padding:6px 4px; }
    #loc-search-status{ font-size:15px; }
    #loc-note{ font-size:13px; }
  }

  /* On a phone all three still fit across, just small — the tags were already
     too small to read at rest there and have always been tap-to-enlarge. What
     changes is how big that enlargement gets: see HOVER_SCALE below, which goes
     up substantially on a narrow screen so a tapped float is properly legible
     rather than merely bigger. */
  @media (orientation:portrait){
    #stage{ padding:2vh 2vw; }
    #instruments{ gap:8px; height:min(calc(var(--vh, 1vh) * 62), 540px, calc((96vw - 30px) / 0.86)); }
  }
</style>
<style>
  /* The way back is the brass disc off the shelf's plinth, with an arrow cut into
     it instead of the question mark. No word: the pieces are not captioned and
     neither is the way out of one. The page's own #backlink rules still set where
     it sits and how it fades; these only change what it looks like. */
  #backlink{ width:38px; height:38px; display:grid; place-items:center;
    font-size:0; text-decoration:none;
    filter:drop-shadow(0 1px 3px rgba(0,0,0,.65)); }
  #backlink img{ grid-area:1/1; width:100%; height:100%; display:block; }
  #backlink i{ grid-area:1/1; font-style:normal; font-weight:700;
    font-size:19px; line-height:1; font-family:Georgia, serif; color:#0f0a02;
    text-shadow:0 1px 0 rgba(255,238,196,.5), 0 -1px 1px rgba(0,0,0,.35); }
</style>

<style>
  #backlink{ position:fixed; top:18px; left:22px; z-index:50; color:#f2e9d8; opacity:.5; text-decoration:none; font-size:14px; letter-spacing:.04em; text-shadow:0 1px 3px rgba(0,0,0,.85), 0 0 9px rgba(0,0,0,.55); transition:opacity .3s ease; }
  #backlink:hover{ opacity:.9; }
</style>
<a id="backlink" href="../index.html" aria-label="sagne"><img src="../shelfdisk.png" alt=""><i>&#8592;</i></a>
<div id="stage">
  <!-- the defs live once, off-screen; each instrument's svg refers to them by id -->
  <svg id="defs-holder" width="0" height="0" aria-hidden="true" style="position:absolute">
      <defs>
        <linearGradient id="liquidFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#d2d6d9"/>
          <stop offset="30%" stop-color="#c7cbce"/>
          <stop offset="65%" stop-color="#b3b7bb"/>
          <stop offset="100%" stop-color="#94989c"/>
        </linearGradient>
        <!-- slim reflection running down the left of the glass, beside the lower floats -->
        <linearGradient id="hlX" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#fdfbf5" stop-opacity="0"/>
          <stop offset="0.5" stop-color="#fdfbf5" stop-opacity="0.58"/>
          <stop offset="1" stop-color="#fdfbf5" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="hlY" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff" stop-opacity="0"/>
          <stop offset="0.22" stop-color="#fff" stop-opacity="1"/>
          <stop offset="0.8" stop-color="#fff" stop-opacity="1"/>
          <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <filter id="hlBlur" x="-200%" y="-40%" width="500%" height="180%"><feGaussianBlur stdDeviation="0.7"/></filter>
        <mask id="hlMask"><rect x="54" y="480" width="13" height="138" fill="url(#hlY)"/></mask>
      </defs>
  </svg>
  <div id="instruments"></div>

  <div id="unit-toggle">
    <button id="btn-c" aria-label="Celsius">C</button>
    <span class="sep">/</span>
    <button id="btn-f" aria-label="Fahrenheit">F</button>
  </div>
  <div id="loc-cluster">
    <div id="loc-note"><span id="loc-note-text">using an approximate location — check that your browser and device allow it, then</span> <button type="button" id="loc-retry">try again</button></div>
    <button type="button" id="loc-flag" title="check another location" aria-label="check another location" aria-expanded="false">🚩</button>
    <form id="loc-search" autocomplete="off">
      <input type="text" id="loc-search-input" placeholder="postcode or city" aria-label="postcode or city">
    </form>
    <div id="loc-search-status"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ---- the three instruments ----
  // A Galileo thermometer can only read inside the range its floats were made
  // for: outside it every float sinks, or every float rises. One instrument
  // tagged 30-85F had nothing whatever to say about a Dallas afternoon. Three of
  // them, each made for a different stretch, cover 12F to 111F between them — and
  // at a FINER step than the single one managed, 3F against 5F, because none of
  // them is paying for degrees it never sees.
  //
  // Nothing here adapts and nothing is fetched. The tags are etched numbers, the
  // same for every visitor, exactly as on the real objects; three instruments is
  // simply what you would own if you wanted to read that much range.
  //
  // The two that are off-scale are not decoration, and they are deliberately not
  // dimmed or hidden. Every float up means "colder than anything I can read";
  // every float down means "hotter". Read together the three bracket the
  // temperature even when only one of them is giving a number.
  const STEP_F = 4;

  // Interior geometry, measured off each cut-out. halfWidth is the room a float
  // has either side of centre, sampled down the column — the teardrop is 105
  // units across its belly and closes to 74 at the neck, so a float riding high
  // in it genuinely has less room to drift than one sitting in the middle.
  // (The last sample or two on the capsule were smoothed: the thick glass of the
  // base confuses the trace where it meets the foot.)
  const INSTRUMENTS = [
    { key:'capsule', file:'vessel-capsule.png', vw:202, vh:612, scale:0.66,
      cx:101.9, top:75, bot:557, from:12, count:7,
      halfWidth:[43.2,61.4,70.2,72.1,75.8,80.9,80.9,81.8,84.6,81.4,78.1,78.1,77.7,77.7,80.9,80.4,84.2,84.2,84.6,84.2,83.7,83.7,84.2,83.7,83.7,83.7,75.8,44.2] },
    { key:'tube', file:'vessel-dark.png', vw:220, vh:725, scale:1.00,
      cx:109, top:143, bot:645, from:36, count:12,
      // straight-sided, so one figure serves the whole column. Traced by hand
      // rather than automatically: this photograph's walls are far fainter than
      // the other two and the automatic trace loses them below the halfway mark.
      halfWidth:[48,48,48,48,48,48,48,48,48,48,48,48,48,48,48,48,48,48,48,48,48,48,48,48,48,48,48,48],
      highlight:{ x:54, y:480, w:13, h:138 } },
    // fill: the liquid surface. A float rises to the surface, not into the air
    // above it, and this vessel's reference photograph shows its long neck plainly
    // EMPTY — the floats raft across the wide part with clear glass above them.
    // Without that, buoyancy walked them single file up the taper, which is a queue
    // no real one has. The sprites are transparent throughout and depict no fill
    // line, so it cannot be read off the image and has to be stated.
    //
    // 255. The floats raft across the surface here because the glass is wide enough
    // to hold them side by side — five or six abreast at this height.
    //
    // That was not true until the interiors were retraced, and the story of why is
    // worth keeping. The profiles were built by scanning each row of the vessel
    // photograph for the widest run of SEE-THROUGH pixels between the walls. But
    // these are photographs of translucent glass: the whole body is softly shaded,
    // not transparent. So the scan found only the small genuinely-clear patch in the
    // middle of each row and called that the interior — under-reporting this vessel
    // by nearly three times. It claimed 73 units of clear glass where the vessel is
    // really 199 across, which is less than one float wide. The floats were not
    // being stacked in a column by choice; a column was the only thing that fitted.
    //
    // Everything I built on top of that measurement was compensation for it. The
    // vessel was drawn larger (0.76, and 0.80 before that) purely to shrink the
    // floats relative to a vessel I had measured as too narrow. With the interior
    // traced from the SILHOUETTE instead, less a wall, it is back at its own 0.66
    // and rafts six across with a reading gap of 2.38 and no stacking at all.
    //
    // The lesson, since it cost most of a day: she could see the glass was three
    // floats wide by looking at it. Trust that over a number when the two disagree.
    //
    // The tube's own reference photograph is filled near its top, and there is no
    // reference for the capsule, so neither of those is given a fill line.
    { key:'teardrop', file:'vessel-teardrop.png', vw:283, vh:615, scale:0.66,
      cx:140.1, top:151, bot:536, from:80, count:10, fill:255,
      halfWidth:[38.6,42.3,47.9,53,59.1,65.1,76.3,81.8,87.4,92.5,98.1,102.8,106.5,110.7,114.4,117.2,119,120.9,122.3,122.3,122.3,120.4,117.6,113.5,107.9,100.4,89.7,75.3] },
  ];

  const FLOAT_IMAGES = ['blue','aqua','green','yellow','gold','orange','red','pink','palepink','purple','lavender','silver'];
  // The floats are standard spheres — the same objects, dropped into different
  // vessels — so they come out the same size on screen wherever they are. Their
  // size in a vessel's own units therefore has to divide back out both how many
  // units tall that vessel is AND how far down it is scaled: a float in an
  // instrument drawn at 0.56 must be 1/0.56 as large in its own coordinates to
  // look identical to one in the tube. Which is also why the smaller instruments
  // hold fewer of them — a smaller vessel, same spheres.
  const FLOAT_W_AT_725 = 48;
  const FLOAT_RATIO = 660/370;
  const TAG_FONT_FRAC = 0.16;

  // How far a float sits from centre, as a fraction of the room the glass has
  // there. Fixed per position so it never jitters frame to frame.
  //
  // Neighbours must lean firmly OPPOSITE, not merely differently: two spheres can
  // only nest into each other if they are far enough apart sideways, and the old
  // sequence happened to put several consecutive pairs nearly in line, which
  // forced those to stack a full diameter apart and left the heap half tower.
  // Strict alternation, varied a little in how far each goes so the heap does not
  // look machined, packs them into two offset rows — which is how this many
  // spheres actually settle in a vessel a bit over two floats wide.
  function leanFor(i){ return (i % 2 ? -1 : 1) * (0.62 + 0.16*Math.sin(i*1.7)); }

  let unit = 'f';
  let currentTempF = 65;
  let lat = null, lon = null;
  let weatherFetchFailures = 0; // consecutive failed weather fetches (location already known) --
  // separate from a geolocation failure, which has its own note text and its own counter-less path

  const instrumentsWrap = document.getElementById('instruments');
  const btnC = document.getElementById('btn-c');
  const btnF = document.getElementById('btn-f');

  // A tapped float is shown enlarged. On a phone all three instruments are small,
  // so the tags are unreadable at rest — they always were — and this enlargement
  // is how you read one. It therefore has to be much bigger on a narrow screen,
  // not the same 2.4x that suits a desktop.
  function hoverScale(){ return window.matchMedia('(orientation:portrait)').matches ? 5.2 : 2.6; }

  function fToC(f){ return (f-32)*5/9; }

  const SVGNS = 'http://www.w3.org/2000/svg';
  const bulbEls = [];

  // the one float left enlarged by a tap, if any
  let stuckFloat = null;
  function clearStuckFloat(){
    if (stuckFloat){ stuckFloat.classList.remove('show'); stuckFloat = null; }
  }

  INSTRUMENTS.forEach((inst, instIdx) => {
    const box = document.createElement('div');
    box.className = 'instrument';
    // The three are not the same size. Standing them at equal heights made the
    // teardrop in particular look wrong — it is a wide shape, so matching the
    // tube's height made it enormous beside it. A smaller instrument either side
    // reads as what it is: a main one with two lesser ones kept for the ranges it
    // cannot reach. They share a baseline, as things standing on a shelf do.
    box.style.height = (inst.scale*100) + '%';
    const svg = document.createElementNS(SVGNS,'svg');
    svg.setAttribute('viewBox', `0 0 ${inst.vw} ${inst.vh}`);
    svg.setAttribute('preserveAspectRatio','xMidYMax meet');
    const bulbLayer = document.createElementNS(SVGNS,'g');
    svg.appendChild(bulbLayer);
    inst.layer = bulbLayer;

    const vessel = document.createElementNS(SVGNS,'image');
    vessel.setAttribute('href', inst.file);
    vessel.setAttribute('x',0); vessel.setAttribute('y',0);
    vessel.setAttribute('width', inst.vw); vessel.setAttribute('height', inst.vh);
    vessel.style.pointerEvents = 'none';
    svg.appendChild(vessel);

    if(inst.highlight){
      const h = inst.highlight;
      const r = document.createElementNS(SVGNS,'rect');
      r.setAttribute('x',h.x); r.setAttribute('y',h.y);
      r.setAttribute('width',h.w); r.setAttribute('height',h.h);
      r.setAttribute('fill','url(#hlX)'); r.setAttribute('mask','url(#hlMask)');
      r.setAttribute('filter','url(#hlBlur)');
      r.style.pointerEvents = 'none';
      svg.appendChild(r);
    }

    const hitLayer   = document.createElementNS(SVGNS,'g');
    const hoverLayer = document.createElementNS(SVGNS,'g');
    svg.appendChild(hitLayer); svg.appendChild(hoverLayer);
    box.appendChild(svg);
    instrumentsWrap.appendChild(box);

    const fw = FLOAT_W_AT_725 * (inst.vh/725) / inst.scale;
    const fh = fw * FLOAT_RATIO;
    inst.fw = fw; inst.fh = fh;

    for(let i=0;i<inst.count;i++){
      const t = inst.from + i*STEP_F;
      const img = FLOAT_IMAGES[(i + instIdx*5) % FLOAT_IMAGES.length];
      const tagY = fh/2 - fh*0.08;
      const fs = fw*TAG_FONT_FRAC;

      const g = document.createElementNS(SVGNS,'g');
      g.setAttribute('class','bulb-group');
      g.innerHTML = `<image href="floats/${img}.png" x="${-fw/2}" y="${-fh/2}" width="${fw}" height="${fh}"/>` +
        `<text x="1" y="${tagY}" text-anchor="middle" font-size="${fs}" class="tag-chip" fill="#000000">${Math.round(t)}°</text>`;
      bulbLayer.appendChild(g);
      const tg = g;   // the tag travels with its own float now

      // zoomed clone shown on hover/tap, above the glass so it is never clipped.
      // Built at 1x and scaled by an attribute so the amount can change with the
      // screen without rebuilding anything.
      const hg = document.createElementNS(SVGNS,'g');
      hg.setAttribute('class','hover-clone');
      const inner = document.createElementNS(SVGNS,'g');
      inner.innerHTML = `
        <image href="floats/${img}.png" x="${-fw/2}" y="${-fh/2}" width="${fw}" height="${fh}"/>
        <text x="1" y="${tagY}" text-anchor="middle" font-size="${fs}" class="tag-chip" fill="#000000">${Math.round(t)}°</text>`;
      hg.appendChild(inner);
      hoverLayer.appendChild(hg);

      const hit = document.createElementNS(SVGNS,'circle');
      hit.setAttribute('class','hit-circle');
      hit.setAttribute('r', fw*0.7);
      hit.setAttribute('fill','transparent');
      hitLayer.appendChild(hit);

      const show = ()=>{ hg.classList.add('show'); };
      const hide = ()=>{ hg.classList.remove('show'); };
      // A finger is not a pointer. Held down, it enlarged the float and then
      // covered the thing it had enlarged; lifted, the enlargement went with it,
      // so on a phone or a Kindle you could never actually SEE a tapped float.
      // A tap now leaves it up. Tap it again, tap a different one, or tap
      // anywhere else, and it goes away. The hover pair is guarded to the mouse
      // because a touch raises pointerenter and pointerleave too, and unguarded
      // they would put it straight back down on release.
      hit.addEventListener('pointerenter', (e)=>{ if (e.pointerType === 'mouse') show(); });
      hit.addEventListener('pointerleave', (e)=>{ if (e.pointerType === 'mouse') hide(); });
      hit.addEventListener('touchstart', (e)=>{
        e.preventDefault();
        const wasThisOne = (stuckFloat === hg);
        clearStuckFloat();
        if (!wasThisOne){ show(); stuckFloat = hg; }
      }, {passive:false});

      bulbEls.push({ inst, el:g, tagEl:tg, hoverEl:hg, hoverInner:inner,
                     hitEl:hit, hoverText:inner.querySelector('text'),
                     temp:t, lean:leanFor(i) });
    }
  });

  function tagLabel(tempF){
    if (unit === 'f') return Math.round(tempF);
    return Math.round(fToC(tempF));
  }

  function updateTags(){
    bulbEls.forEach(b=>{
      const textEl = b.tagEl.querySelector('text');
      textEl.textContent = tagLabel(b.temp) + '°';
      b.hoverText.textContent = tagLabel(b.temp) + '°';
    });
  }

  // room either side of centre at a given height, read off the vessel's profile
  function roomAt(inst, y){
    const p = inst.halfWidth;
    const f = Math.max(0, Math.min(1, (y - inst.top)/(inst.bot - inst.top)));
    const k = f*(p.length-1), i = Math.floor(k), frac = k - i;
    const hw = i >= p.length-1 ? p[p.length-1] : p[i] + (p[i+1]-p[i])*frac;
    // Inset by the BULB, not by the sprite box. The sprite is fw wide but the bulb
    // inside it is only 0.850*fw — the rest is transparent margin around the glass
    // tip and the tag. Subtracting the whole sprite treated that margin as solid and
    // held every float 0.075*fw short of the glass on each side, which is why they
    // never reached the walls. What actually touches the wall is the widest row of
    // the bulb, so that is what the wall has to clear.
    return Math.max(0, hw - inst.fw*0.425);
  }

  function updatePositions(){
    for(const inst of INSTRUMENTS){
      const list = bulbEls.filter(b=>b.inst===inst);
      // The bulb is an onion, not a ball: measured off the sprite it is 0.850*fw
      // across but only 0.717*fw tall, and its widest point is one row. Enforcing
      // the width in every direction held stacked neighbours 0.13*fw further apart
      // than their outlines actually meet — which is most of why they sat holding
      // polite distance instead of pressed together the way they do in a real one.
      // Two equal ellipses clear each other when (dx/W)^2 + (dy/H)^2 >= 1, so the
      // drop a float needs is H*sqrt(1 - (dx/W)^2).
      const bw = inst.fw*0.850, bh = inst.fw*0.717;
      const d = bw;                        // still the reach at which they can touch at all
      const clearance = (dx) => dx >= bw ? 0 : bh*Math.sqrt(1 - (dx/bw)*(dx/bw));

      // A float is drawn centred on its y, but the sprite is not symmetrical: a
      // glass tip reaching 0.892*fw above the centre, and below the bulb a metal
      // tag hanging to 0.875*fw.
      //
      // Letting the tag lie over the thick glass of the base was too generous: it
      // put the bottom floats' tags down inside the metal foot. In the reference
      // photographs the lowest float's tag hangs clear below its bulb and rests on
      // the floor of the liquid — the bulb genuinely does sit a tag-length up. So
      // the whole sprite, tag included, stays inside the liquid.
      //
      // And a float cannot go where the glass is narrower than the float. roomAt
      // clamps the room at zero, which quietly PERMITTED exactly that: in the
      // teardrop's neck the interior is about 43 units across and the bulb is 52,
      // so floats queued up a taper they could never physically enter, poking
      // through both walls at once. That is the teardrop's chain. The reference for
      // this vessel has them heaped on the bottom, never stacked up the neck.
      //
      // Worth naming why this hid: the check for a float outside its glass measures
      // how far it sits from the centre line, and in the neck that answer is zero.
      // A float wider than the glass around it passes a test written that way.
      const halfAt = (y) => {
        const p = inst.halfWidth;
        const f = Math.max(0, Math.min(1, (y - inst.top)/(inst.bot - inst.top)));
        const k = f*(p.length-1), i = Math.floor(k);
        return i >= p.length-1 ? p[p.length-1] : p[i] + (p[i+1]-p[i])*(k - i);
      };
      const admits = (y) => halfAt(y) >= inst.fw*0.425;   // the bulb, same as roomAt
      const stepY = (inst.bot - inst.top)/500;
      let roof = inst.top, sole = inst.bot;
      while(roof < inst.bot && !admits(roof)) roof += stepY;
      while(sole > roof && !admits(sole)) sole -= stepY;
      const hi = Math.max(inst.top + inst.fw*0.892, roof, inst.fill || 0);
      const lo = Math.max(hi, Math.min(inst.bot - inst.fw*0.892, sole));

      // THE FLOOR OF A NARROWING VESSEL IS A BOWL, NOT A PLANE.
      //
      // lo is one height, the same all the way across, and everything that sinks
      // came to rest on it — so in the teardrop five floats sat in a flat row at
      // one level, out to a width the glass does not have down there. What gave it
      // away is the TAG. A float is not a sphere: a metal tag hangs about two
      // thirds of a bulb-width below its centre, and by that depth the teardrop has
      // closed in by another 40 units, so the outer floats' tags hung straight
      // through the glass. Measured off a sprite (60x107): below its centre the
      // thing is 0.36 of fw wide at the bulb's skirt, pinches to 0.12 at the
      // hanger, and swells again to 0.19 at the tag.
      //
      // So the depth a float can reach depends on how far out it is: in the middle
      // it goes all the way to lo, and out by the wall it comes to rest higher, its
      // tag against the curve. Which is what a heap in a round-bottomed vessel
      // looks like — the outer ones riding up the sides, nested, not a line of them
      // level with each other. The tube doesn't care (straight sides, the answer is
      // lo everywhere) and the capsule barely does. The teardrop is the whole
      // reason this exists.
      const BELOW = [[0.30,0.36],[0.42,0.13],[0.60,0.12],[0.71,0.19],[0.85,0.10]];
      const fitsBelow = (y, rad) => {
        for(const [dy, hw] of BELOW){
          if(halfAt(y + dy*inst.fw) < rad + hw*inst.fw) return false;
        }
        return true;
      };
      // precomputed once per pass: the deepest reach at each distance out
      const BOWL_N = 40, bowlStep = (lo - hi)/240;
      const widest = Math.max(...inst.halfWidth);
      const bowl = [];
      for(let k=0;k<=BOWL_N;k++){
        const rad = (k/BOWL_N)*widest;
        let y = lo;
        while(y > hi && !fitsBelow(y, rad)) y -= bowlStep;
        bowl.push(y);
      }
      // conservative: a radius between two samples takes the shallower of them
      const floorFor = (rad) => {
        const k = Math.min(BOWL_N, Math.ceil((Math.max(0,rad)/widest)*BOWL_N));
        return bowl[k];
      };
      // How much the floor actually rises between the middle and the wall. Zero in
      // a straight-sided vessel, and it decides how much slack the contact rule
      // below is allowed: see the note there.
      const bowlRise = lo - floorFor(roomAt(inst, lo));

      // Where each float wants to be. Buoyancy is a threshold, not a slope: a
      // sphere is either lighter than the liquid or heavier, and only the one
      // within about a degree of neutral hangs anywhere in between. A soft curve
      // here left half of them permanently mid-column, so the group that is up
      // and the group that is down ran into each other — and the gap between
      // those groups IS the reading. At 0.45 a float one step away is already 97%
      // of the way to its end.
      //
      // Measured over hi..lo rather than the raw column: asking for a position
      // outside the range a float may occupy meant the coldest one always wanted
      // to be below its own floor, which tripped the settle-up correction every
      // frame and collapsed the floating group into a single spot.
      for(const b of list){
        const k = 0.45;
        b.want = hi + (0.5 - 0.5*Math.tanh((b.temp - currentTempF)*k)) * (lo - hi);
      }

      // A float's tag is the temperature at which that sphere is neutrally
      // buoyant, so a higher tag means a LESS dense sphere — and in a fluid at
      // rest lighter always sits above heavier, in the floating cluster and the
      // sunken heap alike. Placing them lightest-first, each resting on whatever
      // is already there, gets that for free.
      const order = list.slice().sort((a,b)=> b.temp - a.temp);

      // Sunk floats collect on the bottom; they do not stand in a column. Spheres
      // resting against one another nest — two side by side sit at nearly the
      // same height, and only one directly above another has to be a whole
      // diameter lower — so the drop a float needs is what the circles themselves
      // demand, sqrt(d^2 - dx^2), falling to nothing once they are a diameter
      // apart sideways.
      //
      // But which sideways position? A fixed left-right alternation gave every
      // vessel exactly TWO columns however wide it was, so the teardrop's belly —
      // wide enough for three abreast — showed the same narrow pair as the tube.
      // Instead each float tries a spread of lateral positions and takes the one
      // that lets it settle furthest in the direction it is going, which is what
      // a sphere does: it rolls into whatever gap is lowest. A wide vessel then
      // fills across before it builds up, a narrow one has no choice but to stack,
      // and neither is told which to do. The tube still comes out a near-column
      // because two floats genuinely will not fit side by side in it.
      //
      // The two groups settle against opposite ends and are packed separately. A
      // float lighter than the liquid rises and rests against the top, or on
      // whatever is already up there; a heavier one sinks and rests on the floor,
      // or on the heap already down there. Packing the whole set in one direction
      // cannot express that: from the top down the sunken heap hangs off the
      // floats above it, and from the floor up the floating group gets stacked on
      // the sunken one and pushed clean out of the glass.
      // A vessel is round, not flat. Floats sit at different DEPTHS as well as
      // different sides, and seen from the front through glass a float behind
      // another simply overlaps it — which is why the reference photographs read
      // as a real crowd and a strictly side-by-side arrangement reads as a drawn
      // lattice. Nothing here was allowed to be behind anything else, so nothing
      // ever overlapped.
      //
      // So a position is (x, z) anywhere inside the interior circle at that
      // height, clearance is the 3D distance between two bulbs, and the floats are
      // finally drawn back to front. Depth costs nothing physically — the glass
      // is as deep as it is wide — and buys the one thing that was missing.
      // Depth is real, but it is the one axis the viewer cannot see along, and two
      // things go wrong if it is given free rein. Tags disappear behind nearer
      // floats, and — worse — a float resting on one BEHIND it reads as resting on
      // nothing at all, because whatever is holding it up is hidden. Held to about
      // a third of the radius, floats still sit in front of and behind each other
      // and still overlap through the glass, which is the whole point, while what
      // supports what stays visible. A deliberate compromise, and worth naming:
      // the reading is the number on the lowest float still up, and a piece that
      // cannot be read is no use however faithfully its spheres are arranged.
      // ...and the depth allowed has to be the depth the glass HAS. A vessel is a
      // cylinder — as deep across as it is wide — so z gets the same room x does.
      // Held to a third of that, the heap was flat, and in a flat heap bulbs that
      // touch cannot overlap on screen, so there was no clumping available at any
      // spacing. That is the whole of what went missing.
      //
      // The reason it was ever clamped still stands: a float held up by one hidden
      // behind it reads as held up by nothing. But contact in 3D at this size means
      // two floats separated mostly in depth are also nearly on top of each other
      // on screen, which reads as the crowd it is. The case to guard is only the
      // one where a float goes fully behind a nearer one, and the buried penalty
      // below does that where it belongs — in choosing the spot, not by flattening
      // every arrangement in advance.
      const Z_LIMIT = 1.0;
      // Nesting into the notch between two floats below needs a spot near that
      // notch to exist in the first place. Ten spokes on three rings is too coarse
      // to find one, so the huddle rule would settle for whatever it could reach.
      const RINGS = [0, 0.3, 0.55, 0.75, 0.9, 1.0], SPOKES = 14;
      const SPOTS = [];
      for(const r of RINGS){
        if(r === 0){ SPOTS.push([0,0]); continue; }
        for(let k=0;k<SPOKES;k++){
          const a = (k/SPOKES)*Math.PI*2 + r*0.4;
          SPOTS.push([Math.cos(a)*r, Math.sin(a)*r*Z_LIMIT]);
        }
      }
      const drop = (b, sx, sz, dir, mine, limit, from) => {
        let y = dir > 0 ? Math.max(from, hi, limit) : Math.min(from, lo, limit);
        let room = roomAt(inst, y);
        let x = inst.cx + sx*room, z = sz*room;
        // a sinking float stops where its tag meets the bowl, not where the plane is
        if(dir < 0) y = Math.min(y, floorFor(Math.hypot(x - inst.cx, z)));
        for(let step=0; step<50; step++){
          let moved = false;
          for(const a of mine){
            const dx = (x - a.x), dz = (z - a.z);
            const flat = Math.hypot(dx, dz);
            if(flat >= bw) continue;
            const need = bh*Math.sqrt(1 - (flat/bw)*(flat/bw));
            const want = dir > 0 ? a.y + need : a.y - need;
            if(dir > 0 ? want > y + 1e-6 : want < y - 1e-6){ y = want; moved = true; }
          }
          if(!moved) break;
          room = roomAt(inst, y);
          x = inst.cx + sx*room; z = sz*room;   // the glass narrows as it travels
          if(dir < 0){
            const f = floorFor(Math.hypot(x - inst.cx, z));
            if(y > f) y = f;
          }
        }
        return { x, y, z };
      };
      const clashes = (b, list) => list.some(a => {
        const flat = Math.hypot(b.x-a.x, b.z-a.z)/bw, dy = (b.y-a.y)/bh;
        return flat*flat + dy*dy < 0.98;
      });

      const settle = (seq, dir, others) => {
        const mine = [];
        let limit = dir > 0 ? -Infinity : Infinity;
        for(const b of seq){
          let best = null, fallback = null;
          // two heights to start the fall from: where buoyancy wants this float,
          // and failing that the boundary its own group rests against — a float at
          // exactly its own tag is neutral and hangs mid-glass, and once the group
          // above reaches down into that spot it must settle onto the heap instead
          for(let pass=0; pass<2; pass++){
            const from = pass === 0 ? b.want : (dir > 0 ? hi : lo);
            for(const [sx, sz] of SPOTS){
              const at = drop(b, sx, sz, dir, mine, limit, from);
              if(at.y > lo + 0.01 || at.y < hi - 0.01) continue;
              const depth = dir > 0 ? -at.y : at.y;
              // Among positions that settle equally deep, take the one resting
              // AGAINST its neighbours — a heap of floats in a glass is a huddle,
              // not a lattice. This used to read "take the one furthest from
              // everything already placed", which is the opposite, and it went
              // unnoticed only because the interior was guessed narrow enough that
              // barely one column fitted, so there were no far-apart spots to
              // take. Tracing the real glass handed that rule the room to spread
              // and the clumping vanished. Gravity still comes first: an offset
              // spot that settles LOWER beats a spot directly above a neighbour,
              // which is what makes them nest rather than stack in a tower.
              //
              // The one thing contact must not buy is invisibility. Screen shows x
              // and y only, so a float sharing both with a nearer one has gone,
              // however honestly it was placed — and a float held up by something
              // hidden reads as held up by nothing. Penalise that, heavily.
              // ...and the GLASS is something to rest against too. That is the
              // piece that was missing, and it only shows up in a narrow vessel: a
              // float landing on an empty floor had nothing to roll toward, so the
              // first one sat dead centre, and the tube's floor is 2.35 bulb widths
              // across — half of it, 0.675, is less than the one full width a
              // neighbour needs to sit level. So nothing could ever fit beside the
              // first float and all twelve had to go on top of it. That is the
              // narrow tower. The capsule's floor is wider and heaped correctly all
              // along, which is why this hid.
              //
              // Counting the wall as contact sends the first float to the side and
              // lets the floor fill across before the heap starts to build up.
              const rr = roomAt(inst, at.y);
              let gap = (rr - Math.hypot(at.x - inst.cx, at.z))/bw;   // 0 = against the glass
              let buried = 0;
              for(const a of mine){
                const d3 = Math.hypot(at.x-a.x, at.z-a.z, (at.y-a.y)*(bw/bh))/bw;
                if(d3 - 1 < gap) gap = d3 - 1;                        // 0 = against a neighbour
                const seen = Math.hypot((at.x-a.x)/bw, (at.y-a.y)/bh);
                if(at.z < a.z - bw*0.06 && seen < 0.85) buried = Math.max(buried, 0.85 - seen);
              }
              const huddle = -Math.abs(gap) - buried*3;
              const cand = { x: at.x, y: at.y, z: at.z, depth, huddle };
              if(!fallback || depth > fallback.depth) fallback = cand;
              b.x = at.x; b.y = at.y; b.z = at.z;
              if(clashes(b, others)) continue;
              // Gravity first, and how much slack that rule gets depends on the
              // floor. bh*0.40 is 17.7 units in the teardrop, and against the curve
              // of that base a spot at the glass sits about 16 units higher than
              // the middle -- so it slipped inside the tolerance and won on
              // contact, and the heap perched up the side of the bowl with clear
              // glass beneath it. A float on a slope does not do that; it rolls
              // down until the floor or another float stops it.
              //
              // But the slack is not wrong in general: on a FLAT floor every spot
              // is the same depth to the last decimal, and contact is the only
              // thing left to choose by -- that is the tube, and it is what stops
              // its twelve floats stacking into a tower up the middle. So the
              // slack is the flatness itself: full where the floor is flat -- the
              // tube, bowlRise 0, whose arrangement comes back the same at every
              // temperature bar 1-2 of 255 in the anti-aliasing -- and strict
              // where it curves, which is the teardrop and the capsule.
              const tieTol = bowlRise > bh*0.15 ? bh*0.08 : bh*0.40;
              if(!best || depth > best.depth + tieTol ||
                 (depth > best.depth - tieTol && huddle > best.huddle)) best = cand;
            }
          }
          const pick = best || fallback || { x: inst.cx, y: dir > 0 ? hi : lo, z: 0 };
          b.x = pick.x; b.y = pick.y; b.z = pick.z;
          limit = pick.y;
          mine.push(b);
        }
      };
      const up   = order.filter(b => b.temp >  currentTempF);            // lightest first
      const down = order.filter(b => b.temp <= currentTempF).reverse();  // heaviest first

      // The reading float hangs ALONE, which is the whole point of the instrument:
      // a cluster up, a cluster down, and one float in the gap telling you the
      // temperature. It is the lowest tag still above the temperature, so it is the
      // one closest to neutral — the least buoyant thing still floating — and it
      // does not press up into the pack the way the strongly buoyant ones do. It was
      // being packed into the bottom of the top cluster with everything else, so
      // there was no float to read.
      //
      // Only this one float is treated this way. Giving them all a soft curve was
      // tried and is worse: half of them end up mid-column and the two clusters run
      // into each other, and the gap between the clusters IS the reading.
      const reader = (up.length && down.length) ? up[up.length-1] : null;   // heaviest still up
      const pack = reader ? up.slice(0, -1) : up;
      settle(pack, 1, []);        // down from the top, resting against it
      settle(down, -1, pack);     // up from the floor, and clear of what is floating

      if(reader){
        // How far it hangs depends on how near neutral it is: a tag barely above the
        // temperature is almost neutral and sinks nearly to the heap, a tag a full
        // step above is buoyant enough to sit just under the pack. So the float
        // visibly drifts DOWN as the day warms toward its own number, which is what
        // a real one does.
        const f = Math.max(0, Math.min(1, (reader.temp - currentTempF)/STEP_F));
        const clear = bh*1.06;   // directly below a float, the ellipse needs a full bh, not 0.8
        const above = pack.length ? Math.max(...pack.map(b=>b.y)) : hi;
        const below = down.length ? Math.min(...down.map(b=>b.y)) : lo;
        const room  = (below - clear) - (above + clear);
        reader.y = room > 0 ? (above + clear) + room*(1-f) : (above + below)/2;
        reader.x = inst.cx;       // alone in the glass, so it hangs down the middle
        reader.z = 0;
      }

      // A float hanging free sits upright — the metal tag weights its bottom. One
      // wedged into a crowd cannot, and in the photographs every bulb in a pressed
      // band leans. Lean each by how crowded it actually is.
      for(const b of list){
        let touching = 0;
        for(const a of list){
          if(a === b) continue;
          const flat = Math.hypot(b.x-a.x, b.z-a.z)/bw, dy = (b.y-a.y)/bh;
          if(flat*flat + dy*dy < 1.55) touching++;
        }
        b.tilt = Math.min(3, touching)/3 * 4 * (b.lean >= 0 ? 1 : -1)
               * (0.55 + 0.45*Math.abs(Math.sin(b.temp*1.7)));
      }

      // finally, draw them back to front, or the depth means nothing
      const byDepth = list.slice().sort((a,b)=> a.z - b.z);
      for(const b of byDepth) inst.layer.appendChild(b.el);

      const hs = hoverScale();
      const pivot = -inst.fw*0.142;   // the bulb's centre, above the sprite's
      for(const b of list){
        const tr = `translate(${b.x},${b.y}) rotate(${b.tilt.toFixed(1)} 0 ${pivot.toFixed(1)})`;
        b.el.setAttribute('transform', tr);
        b.tagEl.setAttribute('transform', tr);
        b.hoverEl.setAttribute('transform', tr);
        b.hoverInner.setAttribute('transform', `scale(${hs})`);
        b.hitEl.setAttribute('cx', b.x);
        b.hitEl.setAttribute('cy', b.y);
      }
    }
  }
  window.addEventListener('resize', updatePositions);

  function setUnit(u){
    unit = u;
    btnC.classList.toggle('active', u==='c');
    btnF.classList.toggle('active', u==='f');
    updateTags();
  }
  btnC.addEventListener('click', ()=>setUnit('c'));
  btnF.addEventListener('click', ()=>setUnit('f'));
  setUnit('f');

  async function fetchWeather(){
    if (lat==null || lon==null) return;
    try{
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m&temperature_unit=fahrenheit`;
      const res = await fetch(url);
      const data = await res.json();
      if (data && data.current && typeof data.current.temperature_2m === 'number'){
        currentTempF = data.current.temperature_2m;
        updatePositions();
        if (weatherFetchFailures > 0){ weatherFetchFailures = 0; hideFetchTrouble(); }
      } else {
        throw new Error('unexpected response shape');
      }
    } catch(e){
      // a single missed refresh isn't worth interrupting anyone over (open-meteo refreshes
      // every 10 minutes, and one blip is normal) -- but silence past that point would mean
      // quietly showing a stale reading as if it were still real, which is the one thing
      // this site promises never to do
      weatherFetchFailures++;
      if (weatherFetchFailures >= 2) showFetchTrouble();
    }
  }

  // silent until now — if the browser can't (or won't) hand over a real location, the
  // reading was quietly using this fallback with no sign to the visitor that anything was off
  function showLocationNote(msg){
    const note = document.getElementById('loc-note');
    if (msg){ const text = document.getElementById('loc-note-text'); if (text) text.textContent = msg; }
    if (note) note.classList.add('visible');
  }
  function hideLocationNote(){
    const note = document.getElementById('loc-note');
    if (note) note.classList.remove('visible');
  }
  function tryLocationAgain(){
    if (!navigator.geolocation) return;
    const btn = document.getElementById('loc-retry');
    if (btn){ btn.disabled = true; btn.textContent = 'checking…'; }
    navigator.geolocation.getCurrentPosition(
      pos => {
        lat = pos.coords.latitude; lon = pos.coords.longitude;
        hideLocationNote();
        if (btn){ btn.disabled = false; btn.textContent = 'try again'; }
        fetchWeather();
      },
      () => {
        if (btn){ btn.disabled = false; btn.textContent = 'try again'; }
        const text = document.getElementById('loc-note-text');
        if (text) text.textContent = "still couldn't find it — check your browser and device settings, then";
      },
      { timeout: 5000 }
    );
  }
  // the flag: a quiet, always-there way to check the weather somewhere other than
  // wherever the visitor actually is — never open by default, no page text anywhere
  // else hints it exists. Geocoding goes through OpenStreetMap's Nominatim (free, no
  // key) since open-meteo's own geocoder searches place names, not postcodes.
  /* ---------- the height of the screen you can actually see ----------
     see the note on #stage. Re-measured on resize and rotation, but NOT while a
     text field has focus: an on-screen keyboard shrinks innerHeight, and the
     piece must not resize itself under someone typing a place into it. */
  function setVisibleHeight(){
    const el = document.activeElement;
    if (el && el.tagName === 'INPUT' && el.type !== 'range' && el.type !== 'checkbox') return;
    document.documentElement.style.setProperty('--vh', (window.innerHeight / 100) + 'px');
  }
  setVisibleHeight();
  window.addEventListener('resize', setVisibleHeight);
  window.addEventListener('orientationchange', () => setTimeout(setVisibleHeight, 120));
  document.addEventListener('focusout', () => setTimeout(setVisibleHeight, 60));

  /* Touch anywhere that isn't a float or the flag's own cluster and whatever is
     up goes away -- the enlarged float, and the flag's search with it. Her rule:
     a popup should close on a second touch, or on a touch beside it. The hit
     circles are checked by class rather than by closest() so this holds in an
     older browser too. */
  document.addEventListener('touchstart', (e) => {
    const t = e.target;
    const onFloat = t && t.classList && t.classList.contains('hit-circle');
    if (!onFloat) clearStuckFloat();
    const cluster = document.getElementById('loc-cluster');
    const form = document.getElementById('loc-search');
    const flag = document.getElementById('loc-flag');
    if (form && form.classList.contains('open') && cluster && !cluster.contains(t)){
      form.classList.remove('open');
      flag.classList.remove('open');
      flag.setAttribute('aria-expanded', 'false');
      document.getElementById('loc-search-status').textContent = '';
    }
  }, { passive: true });

  function initLocationSearch(){
    const flag = document.getElementById('loc-flag');
    const form = document.getElementById('loc-search');
    const input = document.getElementById('loc-search-input');
    const status = document.getElementById('loc-search-status');
    if (!flag || !form || !input) return;

    flag.addEventListener('click', () => {
      const open = form.classList.toggle('open');
      flag.classList.toggle('open', open);
      flag.setAttribute('aria-expanded', open ? 'true' : 'false');
      if (open) input.focus();
      else status.textContent = '';
    });

    /* An on-screen keyboard is not a keyboard. A one-field form submits on Enter in
       a desktop browser, but the Go key on some Android ones -- the Kindle's among
       them -- can leave the form alone entirely, and then a typed-in location does
       nothing and says nothing. Asking the form directly costs a line; preventing
       the key's own default is what stops a browser that DOES submit searching
       twice. */
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.keyCode === 13){
        e.preventDefault();
        form.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const q = input.value.trim();
      if (!q) return;
      status.textContent = 'looking…';
      try {
        const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q)}`;
        const res = await fetch(url);
        const results = await res.json();
        if (!results || !results.length) { status.textContent = "couldn't find that"; return; }
        lat = parseFloat(results[0].lat); lon = parseFloat(results[0].lon);
        hideLocationNote();
        await fetchWeather();
        status.textContent = results[0].display_name.split(',').slice(0, 2).join(', ');
        input.value = '';
      } catch (e) {
        status.textContent = "couldn't reach the map — try again";
      }
    });
  }

  function init(){
    updatePositions();
    initLocationSearch();
    const locRetryBtn = document.getElementById('loc-retry');
    if (locRetryBtn) locRetryBtn.addEventListener('click', tryLocationAgain);
    if (navigator.geolocation){
      navigator.geolocation.getCurrentPosition(
        pos => { lat = pos.coords.latitude; lon = pos.coords.longitude; fetchWeather(); },
        () => { lat = 55.19; lon = -1.56; fetchWeather(); showLocationNote(); },
        { timeout: 5000 }
      );
    } else {
      lat = 55.19; lon = -1.56; fetchWeather(); showLocationNote();
    }
    setInterval(fetchWeather, 10*60*1000);
  }

  init();
})();
</script>

<script>
(function(){
  var disc=document.getElementById('shelfdisc'), box=document.getElementById('plates');
  var rows=[].slice.call(box.querySelectorAll('.row'));
  function unroll(){ rows.forEach(function(r){ r.classList.remove('rolled'); }); }
  function shut(){ box.classList.remove('open'); disc.setAttribute('aria-expanded','false'); unroll(); }

  /* The twenty cards behind these plates are 6.2MB and not one of them can be
     seen until a plate is opened, but every page on the site was fetching the lot
     on load, ahead of the piece's own assets. Measured on bowl at 240px with a
     slow phone's CPU and connection, the bowl had still not appeared after 100
     seconds; held back, it is there in 12.
     They are held behind data-src rather than left to loading="lazy" alone,
     because that is a heuristic and not a promise -- the same page deferred them
     on a throttled connection and fetched all twenty on a fast one, since the
     browser's idea of "near the viewport" widens with bandwidth. This is the same
     on every machine. The attribute stays as a second line for anything that
     scrolls them into view another way. */
  var wired=false;
  function fetchCards(){
    if(wired) return; wired=true;
    [].slice.call(box.querySelectorAll('img[data-src]')).forEach(function(im){
      im.src=im.getAttribute('data-src'); im.removeAttribute('data-src');
    });
  }

  disc.addEventListener('click', function(ev){
    ev.stopPropagation();
    var open=box.classList.toggle('open');
    if(open) fetchCards();
    disc.setAttribute('aria-expanded', open?'true':'false');
    if(!open) unroll();
  });

  // Same bargain the case itself strikes: a mouse can hover, so a plate is a link
  // straight to its shelf. A thumb cannot, so the first tap on a plate rolls its
  // pieces out and only the second one goes to the shelf.
  var FINE=matchMedia('(hover: hover) and (pointer: fine)');
  rows.forEach(function(row){
    row.querySelector('.tag').addEventListener('click', function(ev){
      if(FINE.matches) return;
      if(row.classList.contains('rolled')) return;
      ev.preventDefault();
      unroll(); row.classList.add('rolled');
    });
  });

  document.addEventListener('click', function(ev){
    if(!box.contains(ev.target) && ev.target!==disc) shut();
  });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') shut(); });
})();
</script>
