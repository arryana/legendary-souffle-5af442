<style>
  :root{ --bg1:#11161f; --bg2:#080a0f; --brass:#c9974e; --cream:#e7d9b4; --dim:#8f7a4e; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  /* The page grows to its own content and scrolls when it has to -- the same
     answer she took for kaleidoscope. `height:100%` pinned the document to the
     glass however tall the row of controls became, so on a 3in phone the
     instruments pushed the last 26px of them off the bottom of a page that could
     not scroll to reach them. #wrap still carries min-height:100dvh, so anything
     with room to spare is the same unscrolling frame it always was. */
  html,body{ height:auto; min-height:100%; margin:0;
    background:radial-gradient(ellipse at 50% 30%, var(--bg1) 0%, var(--bg2) 78%);
    color:var(--cream); font-family: Georgia,'Times New Roman',serif;
    overflow-x:hidden; -webkit-font-smoothing:antialiased; user-select:none;
  }
  #backlink{ position:fixed; top:18px; left:22px; z-index:50; color:#dfe6ea; opacity:.5;
    text-decoration:none; font-size:14px; letter-spacing:.04em;
    text-shadow:0 1px 3px rgba(0,0,0,.85), 0 0 9px rgba(0,0,0,.55); transition:opacity .3s ease; }
  #backlink:hover{ opacity:.9; }

  #wrap{ min-height:100vh; min-height:100dvh;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;
    padding:64px 16px 32px;
  }
  .disc-wrap{ position:relative; }
  /* The disc stands on a table against a wall -- her walnut and the same dark navy
     the case is on. The picture's SHAPE follows the screen rather than being fixed:
     see layout() below. Its size is set in JS, so nothing is declared here. */
  canvas{ display:block; touch-action:none; cursor:pointer; max-width:100%; }
  .stopbox{
    position:absolute; right:5%; bottom:8%; width:28px; height:28px; padding:0;
    border:1.5px solid rgba(201,151,78,.55); border-radius:4px; cursor:pointer;
    background:rgba(20,14,6,.6); display:flex; align-items:center; justify-content:center;
    box-shadow: inset 0 1px 2px rgba(0,0,0,.5), 0 1px 2px rgba(0,0,0,.4);
    transition: border-color .2s ease;
  }
  .stopbox::after{
    content:''; width:9px; height:9px; border-radius:1px; background:var(--brass);
    opacity:.5; transition:opacity .2s ease, background .2s ease, box-shadow .2s ease;
  }
  .stopbox:hover{ border-color:rgba(232,195,131,.85); }
  .stopbox.stopped{ border-color:rgba(232,195,131,.9); }
  .stopbox.stopped::after{ opacity:1; background:#e8c473; box-shadow:0 0 6px rgba(232,195,131,.75); }
  .controls{ display:flex; align-items:center; gap:18px; font-size:20px; color:var(--dim); flex-wrap:wrap; justify-content:center; }
  input[type=range]{ width:200px; accent-color:var(--brass); cursor:pointer; }
  .iconbtn{ font-family:inherit; font-size:18px; line-height:1; background:none; border:0; cursor:pointer; padding:0; opacity:.6; transition:opacity .2s ease; }
  .iconbtn:hover{ opacity:1; }
  /* The rabbit arrives white, and white on this page is the brightest thing on
     the screen -- brighter than the disc, the pins or the brass -- so the eye
     goes to the tempo control before it goes to the music box. Her call.
     It was greyed with a CSS filter, and THAT DID NOT HOLD: her report off the
     Windows tablet, "the rabbit is still white". Windows draws emoji as colour
     glyphs and will not put a filter over them, so the fix worked on the machine
     it was written on and nowhere else. The pair is drawn now, in the same stroke
     and the same currentColor as the instruments beside them -- which is the very
     reason those were drawn in the first place, one line further down this file.
     A drawn icon cannot be a different colour on somebody else's machine. */
  .tempoIcon{ width:19px; height:19px; display:block; color:var(--parchment); opacity:.62; flex:none; }
  /* The instruments. Drawn rather than set in emoji on purpose: there is no old
     enough emoji for a flute (the one that exists arrived in 2022) and a Kindle
     Fire would show an empty box where the flute ought to be. Drawn also means
     they can all share one weight and one colour, which four emoji from four
     different sets never would. */
  .voices{ display:flex; align-items:center; gap:4px; }
  .voicebtn{ background:none; border:0; padding:5px 6px; margin:0; cursor:pointer;
    line-height:0; color:var(--dim); opacity:.55; border-radius:7px;
    transition:opacity .2s ease, color .2s ease, background-color .2s ease; }
  .voicebtn:hover{ opacity:.9; }
  .voicebtn.active{ opacity:1; color:var(--brass); background:rgba(201,151,78,.13); }
  .voicebtn svg{ display:block; width:22px; height:22px; }
  /* a thumb is about 9mm and these are 22px of drawing; the box grows, the
     drawing does not move */
  @media (pointer: coarse){
    .voicebtn{ padding:10px 9px; }
  }
  @media (max-width:480px){
    .controls{ gap:10px; }
    input[type=range]{ width:140px; }
  }
</style>
<style>
  /* The way back is the brass disc off the shelf's plinth, with an arrow cut into
     it instead of the question mark. No word: the pieces are not captioned and
     neither is the way out of one. The page's own #backlink rules still set where
     it sits and how it fades; these only change what it looks like. */
  #backlink{ width:38px; height:38px; display:grid; place-items:center;
    font-size:0; text-decoration:none;
    filter:drop-shadow(0 1px 3px rgba(0,0,0,.65)); }

<body>
<a id="backlink" href="../index.html" aria-label="sagne"><img src="../shelfdisk.png" alt=""><i>&#8592;</i></a>
<div id="wrap">
  <div class="disc-wrap">
    <canvas id="cv" width="1100" height="800"></canvas>
    <button class="stopbox" id="stopbox" aria-label="stop the disc"></button>
  </div>
  <div class="controls">
    <span title="slower" aria-label="slower"><svg class="tempoIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3.6 15.4a6.6 5.6 0 0 1 13.2 0"/><path d="M3.6 15.4h13.2"/>
      <path d="M10.2 9.9v5.5M6.6 11.2l1.5 4.2M13.8 11.2l-1.5 4.2"/>
      <path d="M16.8 13.5l2.1-.7a1.6 1.6 0 0 1 0 3.1l-2.1-.7"/>
      <path d="M6.2 15.4v2.5M14.2 15.4v2.5"/></svg></span>
    <input id="tempo" type="range" min="1.2" max="7" step="0.1" value="3.2">
    <span title="faster" aria-label="faster"><svg class="tempoIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4.3 17.8c-.9-4 1.4-7 5-7 2 0 3.5.8 4.5 2.1 .6-1.3 1.8-2.2 3.2-2.2 1.2 0 2 .7 2 1.6 0 1.3-1.3 2.4-3 2.8-.5 2-2.2 3.4-4.4 3.4"/>
      <path d="M4.3 17.8h1.9M9.6 18.5h1.6"/>
      <path d="M15.4 11.7c-1.1-2.5-1-5 .2-6.6M17.5 11.9c.4-2.5 1.7-4.5 3.2-5.5"/></svg></span>
    <span class="voices" role="group" aria-label="instrument">
      <button class="voicebtn" data-voice="chime" title="chime" aria-label="chime">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
          <path d="M4.5 6.5h15"/><path d="M8 6.5v10"/><path d="M12 6.5v13.5"/><path d="M16 6.5v8"/>
        </svg>
      </button>
      <button class="voicebtn" data-voice="piano" title="piano" aria-label="piano">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="7.5" width="18" height="9.5" rx="1.2"/>
          <path d="M7.5 7.5v9.5M12 7.5v9.5M16.5 7.5v9.5"/>
          <path d="M7.5 7.8v4.9M12 7.8v4.9M16.5 7.8v4.9" stroke-width="3.2"/>
        </svg>
      </button>
      <button class="voicebtn" data-voice="guitar" title="guitar" aria-label="guitar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="8.8" cy="15.6" r="4.5"/><circle cx="12.4" cy="10.7" r="3.1"/>
          <circle cx="9.2" cy="14.8" r="1.4"/>
          <path d="M14.8 8.4 20.2 3.3"/><path d="M19.2 2.3l1.9 1.9"/>
        </svg>
      </button>
      <button class="voicebtn" data-voice="flute" title="flute" aria-label="flute">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2.4" y="10.05" width="19.2" height="3.9" rx="1.95" transform="rotate(-38 12 12)"/>
          <circle cx="10.6" cy="13.0" r="0.72" fill="currentColor" stroke="none"/>
          <circle cx="12.9" cy="11.2" r="0.72" fill="currentColor" stroke="none"/>
          <circle cx="15.2" cy="9.4" r="0.72" fill="currentColor" stroke="none"/>
        </svg>
      </button>
    </span>
    <button class="iconbtn" id="save" title="save" aria-label="save">💾</button>
    <button class="iconbtn" id="clear" title="clear" aria-label="clear">🗑️</button>
  </div>
</div>

<script>
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const N_STEPS=16, stepAngle=2*Math.PI/N_STEPS;
// C major pentatonic — no wrong notes
const NOTES=[261.63,293.66,329.63,392.00,440.00,523.25,587.33,659.25];
const N_RINGS=NOTES.length;

/* Four photographs, each of one thing on its own: the disc face-on, the empty
   room, the hand, and a single brass pin head. Nothing has to be cut out of a
   picture of an assembled instrument, which is what made the first attempt at this
   go wrong -- a disc photographed standing at an angle is an ellipse, and trying
   to spin an ellipse is what she saw as "weirdly oval".
   The scene: the room is 712x362 with the table's front edge at y=262. It is drawn
   to the canvas's width, its wall stretched to fill the height above the table
   (a smooth gradient, so the stretch cannot be seen) and its table left at the
   same scale as the width. */
const ROOM_W=699, ROOM_H=360, ROOM_TABLE=261;
/* The PICTURE takes the shape of the room the page has, rather than being one
   fixed rectangle. On a desktop that is a wide scene with the disc sitting in it;
   on a portrait phone it is a tall one with the disc filling the width, which is
   what the old square disc did well and a fixed landscape picture did badly.
   The canvas keeps a constant WIDTH in its own units so every measurement below
   stays put, and only its height and the disc's radius follow the screen. */
const CW=1100;
let CH=800, TABLE_Y=645, DISC_R=300, CX=550, CY=359;
function layout(){
  const dock=document.querySelector('.controls');
  const dockH=dock?dock.getBoundingClientRect().height:120;
  const availW=Math.min(window.innerWidth*0.94, 960);
  const availH=Math.max(260, window.innerHeight - dockH - 118);
  const ar=Math.max(0.55, Math.min(1.5, availH/availW));
  CH=Math.round(CW*ar);
  const k=CW/ROOM_W;                          // the room, scaled to the width
  const band=(ROOM_H-ROOM_TABLE)*k;           // the table, never distorted
  TABLE_Y=CH-band;
  // as big as the shorter of the width and the room above the table allows
  DISC_R=Math.min(CW*0.44, (TABLE_Y)*0.47);
  CX=CW/2; CY=TABLE_Y+DISC_R*0.047-DISC_R;    // standing ON the table, not above it
  cv.width=CW; cv.height=CH;
  const drawW=Math.min(availW, availH*CW/CH);
  cv.style.width=Math.round(drawW)+'px';
  cv.style.height=Math.round(drawW*CH/CW)+'px';
}
addEventListener('resize', layout);

/* The eight notes sit on eight of the disc's OWN engraved circles. Measured on the
   photograph (760px across, the disc filling it to a radius of 378), the engraving
   runs 117, 145, 176, 208, 240, 277, 309, 337 -- exactly eight of them between the
   hub and the rim, so nothing is laid over the top of the engraving. Held as
   fractions of the disc's radius, so changing the photograph changes only this
   list. Ring 0 is the outermost, and carries the lowest note. */
const RING_F=[337,309,277,240,208,176,145,117].map(r=>r/378);
const ringRadius=i=>DISC_R*RING_F[i];
const rMax=ringRadius(0), rMin=ringRadius(N_RINGS-1);
const pluckAng=-Math.PI/2;
let pins=Array.from({length:N_RINGS},()=>new Array(N_STEPS).fill(false));
[[0,0],[2,2],[3,4],[4,6],[5,8],[4,10],[3,12],[2,14]].forEach(([r,s])=>pins[r][s]=true);
let rotation=0, stepsPerSec=3.2, lastStep=-1, flashes=[];

const room=new Image(), disc=new Image(), hand=new Image(), pin=new Image();
let roomOK=false, discOK=false, handOK=false, pinOK=false;
room.onload=()=>{roomOK=true;}; room.src='museroom.jpg';
disc.onload=()=>{discOK=true;}; disc.src='musedisc.jpg';
hand.onload=()=>{handOK=true;}; hand.src='musehand.png';
pin .onload=()=>{pinOK=true;};  pin .src='musepin.png';
// the hand's pivot, found by locating its two rubies: the lower, ring-mounted one
// is what sits on the disc's centre, and the tip is the far end
const HAND_PX=29.1, HAND_PY=300.7, HAND_LEN=297.7;

// remembers one pattern on this device only — no accounts, nothing sent anywhere.
// if a saved one exists, it replaces the default pattern above before the disc
// ever starts turning.
const SAVE_KEY='musebox-saved-v1';
(function loadSaved(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw) return;
    const data=JSON.parse(raw);
    if(Array.isArray(data.pins) && data.pins.length===N_RINGS && data.pins.every(row=>Array.isArray(row) && row.length===N_STEPS)){
      pins=data.pins;
    }
    if(typeof data.stepsPerSec==='number' && data.stepsPerSec>=1.2 && data.stepsPerSec<=7){
      stepsPerSec=data.stepsPerSec;
    }
  }catch(e){ /* private-browsing/storage-blocked — just keep the default pattern */ }
})();
// the disc spins continuously, which makes it a moving target — freeze it the moment
// a finger/cursor presses down (see the interaction code below) so aiming is actually
// possible, and only commit + resume on release
let frozen=false, hover=null;
// separate from that — the little box lets you stop the disc outright (a real
// wind-up stop), independent of the aim-and-release freeze above
let stopped=false;
const norm=a=>{a%=2*Math.PI;return a<0?a+2*Math.PI:a;};

/* ---------- audio: a struck music-box tine ---------- */
let actx=null, inNode=null;
function initAudio(){
  if(actx){ if(actx.state==='suspended') actx.resume(); return; }
  actx=new (window.AudioContext||window.webkitAudioContext)();
  const lp=actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=4800; lp.Q.value=0.6;
  const master=actx.createGain(); master.gain.value=0.85;
  /* Eight rings can be pinned on the same step, and eight notes struck together
     came to nearly THREE times full scale -- measured, with 1.2% of samples
     squared off flat, which is a buzz laid over the note rather than a quiet
     fault.
     A DynamicsCompressorNode was the obvious answer and is the wrong tool: it
     carries about 6ms of lookahead and rides its gain, and measured against the
     live page it left the chime SILENT for its first 5ms where the live one is
     already at 93% of peak, moving the peak from 6ms out to 74. That is not a
     level change, it is taking the strike out of a struck instrument.
     A waveshaper has no lookahead and no attack or release at all -- it is a
     curve, applied sample by sample. This one is exactly the straight line y=x
     up to 0.75 and only bends above it, so anything up to a single note passes
     through UNCHANGED, sample for sample, and a pile-up is rounded over instead
     of being squared off. The gain either side of it is because a shaper's curve
     is indexed over -1..1, so the signal is scaled into that range and the curve
     is built for what it really means. */
  const HEAD=4;                                   // the shaper's input range, in full scales
  const shaper=actx.createWaveShaper();
  (function(){
    const N=2048, curve=new Float32Array(N);
    const knee=0.75;
    for(let i=0;i<N;i++){
      const r=(i/(N-1)*2-1)*HEAD, a=Math.abs(r);
      const y=a<=knee ? a : knee+(1-knee)*Math.tanh((a-knee)/(1-knee));
      curve[i]=Math.sign(r)*y;
    }
    shaper.curve=curve;
  })();
  const pre=actx.createGain(); pre.gain.value=1/HEAD;
  pre.connect(shaper); shaper.connect(actx.destination);
  const limiter=pre;
  lp.connect(master); master.connect(limiter);
  const dl=actx.createDelay(); dl.delayTime.value=0.19;
  const fb=actx.createGain(); fb.gain.value=0.22;
  const wet=actx.createGain(); wet.gain.value=0.12;
  master.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(limiter);
  inNode=lp;
}
function tine(freq){
  if(!actx) return;
  const t=actx.currentTime;
  [[1,0.5,2.4],[2.76,0.16,1.0],[5.40,0.06,0.5]].forEach(([ratio,amp,dec])=>{
    const o=actx.createOscillator(); o.type='sine';
    o.frequency.value=freq*ratio*(1+(Math.random()-0.5)*0.006);
    const g=actx.createGain(); const d=dec*(0.9+Math.random()*0.2);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(amp,t+0.003);
    g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(inNode); o.start(t); o.stop(t+d+0.05);
  });
  const len=Math.floor(actx.sampleRate*0.02);
  const nb=actx.createBuffer(1,len,actx.sampleRate);
  const chd=nb.getChannelData(0); for(let i=0;i<len;i++) chd[i]=Math.random()*2-1;
  const ns=actx.createBufferSource(); ns.buffer=nb;
  const hp=actx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=2200;
  const ng=actx.createGain(); ng.gain.setValueAtTime(0.12,t); ng.gain.exponentialRampToValueAtTime(0.0001,t+0.03);
  ns.connect(hp); hp.connect(ng); ng.connect(inNode); ns.start(t); ns.stop(t+0.05);
}

/* ---------- the other voices ----------
   The box strikes; WHAT it strikes is the visitor's to choose. Each of these is
   built out of how the real instrument makes its sound rather than out of a
   preset, which is the test everything else on this site is held to. The chime
   above is untouched -- it is the one she already had right. */

// shared: a short burst of shaped noise, which is what every one of these needs
// for the part of the sound that is not a pitch at all -- a hammer landing, a
// nail leaving a string, air catching an edge.
function noiseBurst(t, amp, dur, type, hz, q){
  const len=Math.max(1,Math.floor(actx.sampleRate*dur));
  const nb=actx.createBuffer(1,len,actx.sampleRate);
  const d=nb.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  const src=actx.createBufferSource(); src.buffer=nb;
  const f=actx.createBiquadFilter(); f.type=type; f.frequency.value=hz; if(q) f.Q.value=q;
  const g=actx.createGain();
  g.gain.setValueAtTime(amp,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(f); f.connect(g); g.connect(inNode); src.start(t); src.stop(t+dur+0.02);
}

// PIANO. A struck string is stiff, so its partials are not whole multiples of
// the fundamental: they are stretched, n*sqrt(1 + B*n^2), where B is the string's
// own inharmonicity. That stretch is most of what makes a piano sound like a
// piano rather than like an organ, and it is why the top of a piano is tuned
// sharp to match its own overtones. The hammer feeds the high partials hardest
// and the string loses them fastest, so they are bright at the front and gone
// first; and the hammer itself lands underneath as a separate short knock that
// has no pitch in it at all. Bass strings ring far longer than treble ones.
function piano(freq){
  if(!actx) return;
  const t=actx.currentTime, B=0.0004;
  const base=3.0*Math.pow(261.63/freq,0.45);
  for(let n=1;n<=10;n++){
    const f=freq*n*Math.sqrt(1+B*n*n);
    if(f>11000) break;
    const amp=0.34/Math.pow(n,1.3), d=base/Math.pow(n,0.5);
    const o=actx.createOscillator(); o.type='sine';
    o.frequency.value=f*(1+(Math.random()-0.5)*0.0012);
    const g=actx.createGain();
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(amp,t+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(inNode); o.start(t); o.stop(t+d+0.05);
  }
  noiseBurst(t,0.10,0.035,'lowpass',1100);
}

// GUITAR. Where a string is plucked decides what comes out of it: pluck at a
// fraction p along its length and the nth harmonic arrives at sin(n*pi*p)/n^2.
// Near the bridge that is thin and bright, over the soundhole it is round -- and
// any harmonic whose node falls exactly on the pluck is missing altogether, a
// real hole in the spectrum and a good part of why one plucked note is enough to
// recognise a guitar. p is 0.22 here, an ordinary picking position a little way
// in from the bridge. The nail leaving the string is the click on the front.
function guitar(freq){
  if(!actx) return;
  const t=actx.currentTime, p=0.22;
  const base=2.2*Math.pow(261.63/freq,0.35);
  for(let n=1;n<=14;n++){
    const f=freq*n;
    if(f>11000) break;
    const amp=0.9*Math.abs(Math.sin(n*Math.PI*p))/(n*n);
    if(amp<0.0015) continue;
    const d=base/Math.pow(n,0.42);
    const o=actx.createOscillator(); o.type='sine';
    o.frequency.value=f*(1+(Math.random()-0.5)*0.0015);
    const g=actx.createGain();
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(amp,t+0.005);
    g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(inNode); o.start(t); o.stop(t+d+0.05);
  }
  noiseBurst(t,0.045,0.018,'highpass',3000);
}

// NATIVE AMERICAN FLUTE. A fipple flute: a duct throws a ribbon of air across a
// sharp edge, and an air column driven that way gives very few partials -- a
// strong fundamental, a soft second, a trace of a third, and almost nothing
// above. The other half of the sound is BREATH, and the thing that matters is
// that the air noise runs the WHOLE length of the note rather than only its
// start; that is what makes a flute sound blown rather than struck, and it is
// what these are usually missing. It cannot speak instantly either -- the column
// takes time to settle, so the attack is slow and there is a small chiff at the
// front where the jet first catches the edge. And a held note wavers, so the
// vibrato arrives AFTER the note has settled, the way a player's does, instead
// of being there from the first instant.
function flute(freq){
  if(!actx) return;
  const t=actx.currentTime;
  const A=0.085, S=0.40, R=0.50, end=t+A+S+R;
  const vib=actx.createOscillator(); vib.type='sine';
  vib.frequency.value=4.6+Math.random()*0.5;
  vib.start(t); vib.stop(end+0.05);
  [[1,0.46],[2,0.11],[3,0.04]].forEach(([n,a])=>{
    const o=actx.createOscillator(); o.type='sine';
    o.frequency.value=freq*n*(1+(Math.random()-0.5)*0.002);
    // the waver is a fraction of the pitch, so it has to grow with the partial
    const vg=actx.createGain();
    vg.gain.setValueAtTime(0,t);
    vg.gain.setValueAtTime(0,t+0.22);
    vg.gain.linearRampToValueAtTime(freq*n*0.007,t+0.55);
    vib.connect(vg); vg.connect(o.frequency);
    const g=actx.createGain();
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(a,t+A);
    g.gain.setValueAtTime(a,t+A+S);
    g.gain.exponentialRampToValueAtTime(0.0001,end);
    o.connect(g); g.connect(inNode); o.start(t); o.stop(end+0.05);
  });
  // breath, for the whole note: band-passed around the pitch so it reads as air
  // moving through this flute rather than as hiss laid over the top of it
  const len=Math.floor(actx.sampleRate*(A+S+R));
  const nb=actx.createBuffer(1,len,actx.sampleRate);
  const nd=nb.getChannelData(0);
  for(let i=0;i<len;i++) nd[i]=Math.random()*2-1;
  const ns=actx.createBufferSource(); ns.buffer=nb;
  const bp=actx.createBiquadFilter(); bp.type='bandpass';
  bp.frequency.value=freq*2.1; bp.Q.value=0.9;
  const ng=actx.createGain();
  ng.gain.setValueAtTime(0,t);
  ng.gain.linearRampToValueAtTime(0.055,t+A*0.8);
  ng.gain.setValueAtTime(0.055,t+A+S);
  ng.gain.exponentialRampToValueAtTime(0.0001,end);
  ns.connect(bp); bp.connect(ng); ng.connect(inNode); ns.start(t); ns.stop(end+0.05);
  // the chiff: the jet catching the edge before the column has settled
  noiseBurst(t,0.06,0.05,'bandpass',freq*4,1.2);
}

/* which voice the box is strung with. The chime is the default and what a first
   visit hears; the choice is remembered between visits like the pins are. */
const VOICES={ chime:tine, piano:piano, guitar:guitar, flute:flute };
let voice=localStorage.getItem('sagne-musebox-voice');
if(!VOICES[voice]) voice='chime';
function strike(freq){ (VOICES[voice]||tine)(freq); }
document.querySelectorAll('.voicebtn').forEach(btn=>{
  btn.classList.toggle('active', btn.dataset.voice===voice);
  btn.addEventListener('click',()=>{
    voice=btn.dataset.voice;
    try{ localStorage.setItem('sagne-musebox-voice',voice); }catch(e){}
    document.querySelectorAll('.voicebtn').forEach(b=>b.classList.toggle('active',b.dataset.voice===voice));
    initAudio();
    strike(NOTES[3]);          // it answers in the voice you just chose
  });
});

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(!frozen && !stopped) rotation=(rotation+stepsPerSec*stepAngle*dt)%(2*Math.PI);
  const curStep=Math.round(norm(pluckAng-rotation)/stepAngle)%N_STEPS;
  if(curStep!==lastStep){
    lastStep=curStep;
    for(let r=0;r<N_RINGS;r++) if(pins[r][curStep]){ strike(NOTES[r]); flashes.push({ring:r,t:now}); }
  }
  draw(now);
  requestAnimationFrame(frame);
}

layout();

function draw(now){
  ctx.clearRect(0,0,cv.width,cv.height);

  // the room. Its wall is stretched to fill the height above the table -- a smooth
  // gradient, so nothing shows -- and its table is left at the same scale as the
  // width, so the wood is not distorted.
  if(roomOK){
    const k=CW/ROOM_W, wallH=ROOM_TABLE*k;
    // On a tall picture the wall is drawn at its own scale with its top few rows
    // stretched to fill whatever is left above it -- they are nearly a flat colour,
    // so that cannot be seen, where stretching the whole wall five times over
    // would band the gradient.
    if(TABLE_Y>wallH) ctx.drawImage(room, 0,0,ROOM_W,6, 0,0, CW, TABLE_Y-wallH+2);
    ctx.drawImage(room, 0,0,ROOM_W,ROOM_TABLE, 0,Math.max(0,TABLE_Y-wallH), CW, Math.min(TABLE_Y,wallH));
    ctx.drawImage(room, 0,ROOM_TABLE,ROOM_W,ROOM_H-ROOM_TABLE, 0,TABLE_Y, CW, CH-TABLE_Y);
  }

  // its shadow: one on the wall behind it, thrown down and right by the light
  // coming from the upper left, and one pooled where it bears on the table
  ctx.save();
  ctx.beginPath(); ctx.ellipse(CX+26, CY+16, DISC_R*0.99, DISC_R*0.99, 0, 0, 7);
  ctx.fillStyle='rgba(4,7,14,0.42)'; ctx.filter='blur(0px)'; ctx.fill();
  const gsh=ctx.createRadialGradient(CX, TABLE_Y+16, DISC_R*0.12, CX, TABLE_Y+16, DISC_R*0.95);
  gsh.addColorStop(0,'rgba(10,5,2,0.62)'); gsh.addColorStop(1,'rgba(10,5,2,0)');
  ctx.beginPath(); ctx.ellipse(CX, TABLE_Y+16, DISC_R*0.95, DISC_R*0.13, 0, 0, 7);
  ctx.fillStyle=gsh; ctx.fill();
  ctx.restore();

  // the disc, turning under a fixed hand. Kept as a JPEG and clipped to its circle
  // rather than carried as a 1.3MB PNG with an alpha cut.
  ctx.save();
  ctx.translate(CX,CY);
  ctx.beginPath(); ctx.arc(0,0,DISC_R,0,7); ctx.clip();
  if(discOK){
    ctx.save(); ctx.rotate(rotation);
    ctx.drawImage(disc, -DISC_R, -DISC_R, DISC_R*2, DISC_R*2);
    ctx.restore();
  }
  ctx.restore();

  ctx.save(); ctx.translate(CX,CY);

  // the pins, turning with the disc. Her own photographed pin head, one per note.
  const PIN_D=DISC_R*0.075;
  ctx.save();
  for(let i=0;i<N_RINGS;i++){
    const R=ringRadius(i);
    for(let s=0;s<N_STEPS;s++){
      const a=s*stepAngle+rotation, x=R*Math.cos(a), y=R*Math.sin(a);
      if(pins[i][s]){
        ctx.beginPath(); ctx.ellipse(x+PIN_D*0.16, y+PIN_D*0.22, PIN_D*0.60, PIN_D*0.42, 0, 0, 7);
        ctx.fillStyle='rgba(16,10,3,0.45)'; ctx.fill();
        if(pinOK) ctx.drawImage(pin, x-PIN_D/2, y-PIN_D/2, PIN_D, PIN_D);
      } else {
        // the empty seats, so the disc reads as something a pin can go INTO
        ctx.beginPath(); ctx.arc(x,y,PIN_D*0.10,0,7);
        ctx.fillStyle='rgba(26,16,5,0.36)'; ctx.fill();
      }
    }
  }
  if(frozen && hover){
    // show exactly which pin will be set/cleared before it's committed, since the
    // disc is paused (not moving) for the whole press — aim, then let go
    const R=ringRadius(hover.ring), a=hover.step*stepAngle+rotation;
    const x=R*Math.cos(a), y=R*Math.sin(a);
    const willRemove=pins[hover.ring][hover.step];
    ctx.beginPath(); ctx.arc(x,y,PIN_D*0.95,0,7);
    ctx.strokeStyle=willRemove?'rgba(255,120,90,0.9)':'rgba(255,244,205,0.92)';
    ctx.lineWidth=2; ctx.stroke();
  }
  ctx.restore();

  // where a pin speaks: a warm bloom on its own ring, at the hand
  for(let i=0;i<N_RINGS;i++){
    let fl=0;
    for(const f of flashes) if(f.ring===i){ const age=(now-f.t)/1000; if(age<0.35) fl=Math.max(fl,1-age/0.35); }
    if(fl<=0) continue;
    const R=ringRadius(i), x=R*Math.cos(pluckAng), y=R*Math.sin(pluckAng);
    const bg=ctx.createRadialGradient(x,y,0,x,y,PIN_D*2.4);
    bg.addColorStop(0,`rgba(255,238,190,${0.55*fl})`); bg.addColorStop(1,'rgba(255,238,190,0)');
    ctx.beginPath(); ctx.arc(x,y,PIN_D*2.4,0,7); ctx.fillStyle=bg; ctx.fill();
  }

  // the hand: fixed, and everything passes under it
  if(handOK){
    const k=(DISC_R*0.94)/HAND_LEN;
    ctx.save();
    ctx.rotate(pluckAng + Math.PI/2);       // the cut-out already points along -y
    ctx.shadowColor='rgba(8,5,2,0.5)'; ctx.shadowBlur=8; ctx.shadowOffsetX=4; ctx.shadowOffsetY=6;
    ctx.scale(k,k);
    ctx.drawImage(hand, -HAND_PX, -HAND_PY);
    ctx.restore();
  }

  ctx.restore();
  flashes=flashes.filter(f=>(now-f.t)/1000<0.4);
}

/* ---------- interaction ---------- */

// works out which ring/step (if any) a pointer event is over, using the CURRENT
// (frozen, while a press is active) rotation — so the target stays put for the
// whole gesture instead of sliding out from under the finger
function cellAt(e){
  const rect=cv.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(cv.width/rect.width)-CX;
  const y=(e.clientY-rect.top)*(cv.height/rect.height)-CY;
  const r=Math.hypot(x,y), ang=Math.atan2(y,x);
  // the engraved rings are the photograph's own and are not evenly spaced, so the
  // nearest one is found rather than worked out from a constant gap
  let ring=-1, best=1e9;
  for(let i=0;i<N_RINGS;i++){ const dd=Math.abs(ringRadius(i)-r); if(dd<best){ best=dd; ring=i; } }
  if(ring<0) return null;
  const near=Math.abs(ringRadius(Math.min(N_RINGS-1,ring+1))-ringRadius(Math.max(0,ring-1)))/2 || 30;
  if(best>near*0.62) return null;
  const step=((Math.round(norm(ang-rotation)/stepAngle)%N_STEPS)+N_STEPS)%N_STEPS;
  return {ring, step};
}

cv.addEventListener('pointerdown',e=>{
  initAudio();
  frozen=true;
  hover=cellAt(e);
  cv.setPointerCapture(e.pointerId);
  e.preventDefault();
});
cv.addEventListener('pointermove',e=>{
  if(!frozen) return;
  hover=cellAt(e);
});
function releasePress(){
  if(!frozen) return;
  if(hover) pins[hover.ring][hover.step]=!pins[hover.ring][hover.step];
  // no sound on placement — a pin only speaks when it comes round to the comb
  frozen=false; hover=null;
}
cv.addEventListener('pointerup',releasePress);
cv.addEventListener('pointercancel',()=>{ frozen=false; hover=null; });
const tempoSlider=document.getElementById('tempo');
tempoSlider.value=stepsPerSec; // reflect a loaded pattern's speed, if there was one
tempoSlider.addEventListener('input',e=>stepsPerSec=parseFloat(e.target.value));
document.getElementById('clear').addEventListener('click',()=>{ pins=Array.from({length:N_RINGS},()=>new Array(N_STEPS).fill(false)); });

const stopbox=document.getElementById('stopbox');
stopbox.addEventListener('click',()=>{
  initAudio();
  stopped=!stopped;
  stopbox.classList.toggle('stopped', stopped);
});

const saveBtn=document.getElementById('save');
saveBtn.addEventListener('click',()=>{
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({ pins, stepsPerSec }));
    const original=saveBtn.textContent;
    saveBtn.textContent='✅';
    setTimeout(()=>{ saveBtn.textContent=original; }, 1100);
  }catch(e){ /* private-browsing/storage-blocked — nothing more we can do here */ }
});

requestAnimationFrame(frame);
</script>

<script>
(function(){
  var disc=document.getElementById('shelfdisc'), box=document.getElementById('plates');
  var rows=[].slice.call(box.querySelectorAll('.row'));
  function unroll(){ rows.forEach(function(r){ r.classList.remove('rolled'); }); }
  function shut(){ box.classList.remove('open'); disc.setAttribute('aria-expanded','false'); unroll(); }

  /* The twenty cards behind these plates are 6.2MB and not one of them can be
     seen until a plate is opened, but every page on the site was fetching the lot
     on load, ahead of the piece's own assets. Measured on bowl at 240px with a
     slow phone's CPU and connection, the bowl had still not appeared after 100
     seconds; held back, it is there in 12.
     They are held behind data-src rather than left to loading="lazy" alone,
     because that is a heuristic and not a promise -- the same page deferred them
     on a throttled connection and fetched all twenty on a fast one, since the
     browser's idea of "near the viewport" widens with bandwidth. This is the same
     on every machine. The attribute stays as a second line for anything that
     scrolls them into view another way. */
  var wired=false;
  function fetchCards(){
    if(wired) return; wired=true;
    [].slice.call(box.querySelectorAll('img[data-src]')).forEach(function(im){
      im.src=im.getAttribute('data-src'); im.removeAttribute('data-src');
    });
  }

  disc.addEventListener('click', function(ev){
    ev.stopPropagation();
    var open=box.classList.toggle('open');
    if(open) fetchCards();
    disc.setAttribute('aria-expanded', open?'true':'false');
    if(!open) unroll();
  });

  // Same bargain the case itself strikes: a mouse can hover, so a plate is a link
  // straight to its shelf. A thumb cannot, so the first tap on a plate rolls its
  // pieces out and only the second one goes to the shelf.
  var FINE=matchMedia('(hover: hover) and (pointer: fine)');
  rows.forEach(function(row){
    row.querySelector('.tag').addEventListener('click', function(ev){
      if(FINE.matches) return;
      if(row.classList.contains('rolled')) return;
      ev.preventDefault();
      unroll(); row.classList.add('rolled');
    });
  });

  document.addEventListener('click', function(ev){
    if(!box.contains(ev.target) && ev.target!==disc) shut();
  });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') shut(); });
})();
</script>
