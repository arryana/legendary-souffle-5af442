<style>
  @import url('https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;1,400&family=Cormorant+Garamond:wght@500;600&display=swap');

  :root{
    --wood-hi:#8a6440;
    --wood:#4a3320;
    --wood-lo:#2e1f13;
    --wood-deep:#160f08;
    --hinge:#7a6a4a;
    --hinge-dark:#443a28;

    --sky-night:#0a1330;
    --sky-astro:#141c45;
    --sky-nautical:#2a3468;
    --sky-civil:#c97a5a;
    --sky-dawn:#e8ab7c;
    --sky-day-top:#3f8fc4;
    --sky-day-bottom:#a9d6e8;

    --paper:#f1ead9;
    --paper-edge:#e2d6bb;
    --ink:#2b241a;
    --ink-soft:#6b6152;
    --gold:#b8903f;
    --moon-lit:#f4f4f0;
    --moon-shadow:#141414;
    --sun-body:#e8b04a;

    --chart-bg:#050505;
    --chart-bg-edge:#111111;
    --chart-grey:#8a8a8a;
    --chart-sun:#f5d020;
    --chart-moon:#f4f4f0;
    --chart-moon-shadow:#2a2a2a;
  }

  *{box-sizing:border-box;}

  html{
    height:100%;
  }
  body{
    min-height:100%;
    margin:0;
    background:#1a140c;
    font-family:'Spectral', Georgia, serif;
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }

  #stage{
    position:relative;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:3vh 3vw 4vh;
    gap:0;
  }

  /* ---------- WINDOW ---------- */
  #window-wrap{
    position:relative;
    width:min(78vw, 900px, 88vh);
    aspect-ratio:8/5;
    flex-shrink:0;
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 26px 60px rgba(0,0,0,.55);
  }
  @media (orientation:portrait){
    #window-wrap{ width:min(84vw, 520px, 62vh); aspect-ratio:3/4; }
  }

  /* ---------- small screens: the sill is what gives way ----------
     Her call, and it is the right thing to give up: below the window sit the
     chart, the sliders, the tickboxes and the flag, and on a Kindle or a 3in
     phone the page ran 65-140px past the bottom, so the flag and half the
     controls were down there out of sight. The sill is the deepest part of the
     picture that carries no reading -- so the window box gets shorter and the
     frame is anchored to its TOP, which crops the sill rather than squashing
     the view or losing sky. The light patch is masked to the same box and moves
     with it, so what is left of the sill still catches the sun.
     Held to a coarse pointer and a short screen: a desktop keeps its full sill. */
  @media (pointer:coarse) and (max-height:900px){
    #window-wrap{ aspect-ratio:8/4.1; }
    #frame-img, #beam-sun, #beam-moon{ top:0; bottom:auto; height:139%; }
  }
  @media (pointer:coarse) and (orientation:portrait) and (max-height:1100px){
    #window-wrap{ width:min(84vw, 520px); aspect-ratio:1/1; }
    #frame-img, #beam-sun, #beam-moon{ top:0; bottom:auto; height:133%; }
  }

  /* ---------- small screens: the discs move inside the window ----------
     Also hers. In the page's corners they sat half on the window and half off
     it on every one of those screens -- and the room kept clear above them was
     room the piece could have used. Inside the window's own top corners they
     read as part of the furniture, and the page starts at the top. They are
     ABSOLUTE here rather than fixed, so that if the page still has to scroll on
     some screen they travel with the window rather than hanging over it. */
  @media (pointer:coarse) and (max-height:900px){
    #stage{ padding-top:6px; }
    /* html-qualified on purpose: the shelf disc's own block is GENERATED and sits
       at the end of the body, so a plain #shelfdisc rule here loses to it on
       source order however specific it looks. */
    html #backlink{ position:absolute; top:var(--disc-top, 18px); left:var(--disc-left, 22px); }
    html #shelfdisc{ position:absolute; top:var(--disc-top, 18px); left:var(--disc-right, auto); right:auto; }
  }

  #frame-img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    pointer-events:none;
    -webkit-user-drag:none;
    z-index:10;
  }

  /* the light patch on the sill — warm sunlight by day, cool moonlight by night,
     scaled by the real moon phase. Same reusable mask, tinted two ways, opacity
     driven entirely from render(). Sized like #frame-img's own object-fit:cover
     so the two stay in registration at any window shape. */
  #beam-sun, #beam-moon{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:11;
    opacity:0;
    mask-image:url('windower-beam-mask.png');
    mask-size:cover;
    mask-position:center;
    mask-repeat:no-repeat;
    -webkit-mask-image:url('windower-beam-mask.png');
    -webkit-mask-size:cover;
    -webkit-mask-position:center;
    -webkit-mask-repeat:no-repeat;
    transition:opacity 2s ease;
  }
  #beam-sun{ background:#ffe8b0; }
  #beam-moon{ background:#cfe0ff; }

  #glass{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    box-shadow:
      inset 0 0 40px rgba(0,0,0,.45),
      inset 0 0 0 3px rgba(20,14,6,.5);
    transition:background 2.5s ease;
  }

  #sky-gradient{
    position:absolute;
    inset:0;
    transition:opacity 1.2s ease;
  }

  #stars{
    position:absolute;
    inset:0;
    transition:opacity 1.5s ease;
  }
  #stars circle{ fill:#fff; }

  #hills{
    position:absolute;
    left:0; right:0;
    bottom:12%;
    width:100%;
    height:19%;
    background:url('windower-hills.png') center bottom / 100% 100% no-repeat;
    pointer-events:none;
    /* brightness/warmth is driven from the sun's altitude in render() */
    transition:filter 2.5s ease;
    will-change:filter;
  }

  /* a light dusting on the hills while it's snowing — reuses the hills photo's own alpha
     shape as a mask (same trick as the sunbeam mask below) so the white only ever falls where
     the hills silhouette actually is, never spilling into the sky above the ridge */
  #hills-snow{
    position:absolute;
    left:0; right:0;
    bottom:12%;
    width:100%;
    height:19%;
    mask-image:url('windower-hills.png');
    mask-size:100% 100%;
    mask-position:center bottom;
    mask-repeat:no-repeat;
    -webkit-mask-image:url('windower-hills.png');
    -webkit-mask-size:100% 100%;
    -webkit-mask-position:center bottom;
    -webkit-mask-repeat:no-repeat;
    pointer-events:none;
    opacity:0;
    transition:opacity 3s ease, filter 2.5s ease;
  }

  #sky-body-layer{
    position:absolute;
    inset:0;
    pointer-events:none;
  }

  /* ---------- WEATHER: clouds + fog ----------
     Both are generated in-page (SVG turbulence for clouds, a plain gradient for fog) rather
     than image assets, so "how much" is just a number driving a filter/gradient, not a set of
     pre-baked pictures. Clouds sit in front of the sun/moon/stars but behind the hills (the
     hills are the nearest thing in the scene); fog sits in front of the hills, since real fog
     is close enough to wash out the background. */
  #clouds{
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:0;
    transition:opacity 2s ease;
  }
  #cloud-drift{ animation:cloud-pan 260s ease-in-out infinite alternate; }
  @keyframes cloud-pan{ from{ transform:translateX(0); } to{ transform:translateX(-16%); } }

  #fog{
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:0;
    transition:opacity 2.5s ease, background 2.5s ease;
  }

  #precip{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
  }

  #lightning-flash{
    position:absolute;
    inset:0;
    background:#eef4ff;
    opacity:0;
    pointer-events:none;
  }
  #sky-sun, #sky-moon{
    position:absolute;
    transition:opacity 1.2s ease, left 2s linear, top 2s linear;
    transform:translate(-50%,-50%);
    opacity:0;
  }
  #sky-sun{ width:14%; aspect-ratio:1/1; }
  #sky-moon{ width:9%; aspect-ratio:1/1; }
  #sky-sun.visible, #sky-moon.visible{ opacity:1; }

  /* moon-phase-only: moon rendered large, over the real sky/stars rather than replacing them */
  #moon-disc-wrap{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:transparent;
    opacity:0;
    pointer-events:none;
    transition:opacity 1.4s ease;
  }
  #moon-disc-wrap.active{ opacity:1; pointer-events:auto; }
  #moon-disc-wrap svg{ width:40%; filter:drop-shadow(0 0 30px rgba(230,225,210,.25)); }

  /* ---------- CHART PANEL ---------- */
  #chart-wrap{
    position:relative;
    width:min(78vw, 900px);
    margin-top:18px;
    background:
      radial-gradient(140% 100% at 50% 0%, var(--chart-bg-edge), var(--chart-bg) 70%);
    border-radius:10px;
    box-shadow:0 10px 24px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.06);
    padding:14px 18px 10px;
    flex-shrink:0;
  }

  /* A Kindle turned sideways is the hardest case on the site: 430px of height
     with the window, the chart, two sliders, three tickboxes and the flag all
     stacked in it. The sill and the discs together get most of the way, and the
     chart -- which is drawn at 78vw and so grows with a WIDE screen no matter how
     short it is -- gives up the rest. Landscape only: a phone on end keeps its
     chart full width. */
  @media (pointer:coarse) and (orientation:landscape) and (max-height:560px){
    #chart-wrap{ width:min(78vw, 900px, 74vh); }
  }


  #chart-wrap svg{ display:block; width:100%; height:auto; overflow:visible; }

  .curve{ fill:none; stroke-width:1.6; }
  .curve.sun{ stroke:var(--chart-sun); }
  .curve.moon{ stroke:var(--chart-moon); opacity:.75; }
  .curve.greyed{ opacity:.18; }

  .horizon-line{ stroke:var(--chart-grey); stroke-width:1; stroke-dasharray:2 3; }
  .now-line{ stroke:var(--chart-grey); stroke-width:1; opacity:.6; }

  .body-icon{ cursor:pointer; }
  .body-icon.greyed{ opacity:.28; }

  /* tooltip */
  #tooltip{
    position:fixed;
    pointer-events:none;
    background:rgba(28,22,14,.92);
    color:#f1ead9;
    border:1px solid var(--gold);
    border-radius:8px;
    padding:8px 12px;
    font-size:13px;
    line-height:1.5;
    font-family:'Cormorant Garamond', serif;
    opacity:0;
    transform:translate(-50%, calc(-100% - 12px));
    transition:opacity .15s ease;
    z-index:50;
    white-space:nowrap;
  }
  #tooltip.show{ opacity:1; }
  #tooltip .t-time{ font-size:16px; font-weight:600; letter-spacing:.02em; }
  #tooltip .t-row{ display:flex; gap:10px; margin-top:2px; }
  #tooltip .t-label{ color:#c9b98f; text-transform:uppercase; font-size:10px; letter-spacing:.08em; }

  /* ---------- SLIDER ---------- */
  #slider-wrap{
    width:min(78vw, 900px);
    margin-top:22px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    flex-shrink:0;
  }
  #slider-track{
    position:relative;
    width:100%;
    height:10px;
    border-radius:6px;
    background:linear-gradient(90deg, rgba(241,234,217,.08), rgba(241,234,217,.22), rgba(241,234,217,.08));
    cursor:grab;
  }
  #slider-track:active{ cursor:grabbing; }
  #slider-now-tick{
    position:absolute;
    top:-3px;
    left:50%;
    width:2px;
    height:16px;
    background:var(--gold);
    opacity:.7;
    transform:translateX(-50%);
  }
  #slider-thumb{
    position:absolute;
    top:50%;
    width:20px; height:20px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--wood-hi), var(--wood-lo));
    box-shadow:0 2px 6px rgba(0,0,0,.5), 0 0 0 3px rgba(241,234,217,.12);
    transform:translate(-50%,-50%);
    left:50%;
  }
  #slider-label{
    font-family:'Cormorant Garamond', serif;
    font-size:13px;
    color:#c9b98f;
    letter-spacing:.04em;
    min-height:16px;
    opacity:.85;
  }

  /* ---------- CHECKBOXES ---------- */
  #controls{
    width:min(78vw, 900px);
    margin-top:16px;
    display:flex;
    gap:32px;
    justify-content:center;
    flex-shrink:0;
  }
  .toggle{
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
    font-family:'Cormorant Garamond', serif;
    font-size:15px;
    color:#e2d6bb;
    letter-spacing:.02em;
  }
  .toggle-glyph{
    font-size:20px;
    line-height:1;
    opacity:.85;
  }
  .toggle:has(input:checked) .toggle-glyph{ opacity:1; color:var(--gold); }
  .toggle input{
    appearance:none;
    width:16px; height:16px;
    border:1.5px solid var(--gold);
    border-radius:3px;
    background:transparent;
    position:relative;
    cursor:pointer;
    flex-shrink:0;
  }
  .toggle input:checked{ background:var(--gold); }
  .toggle input:checked::after{
    content:'';
    position:absolute;
    left:4px; top:1px;
    width:4px; height:8px;
    border:solid #1a140c;
    border-width:0 2px 2px 0;
    transform:rotate(40deg);
  }
  #loc-note{
    display:none; margin-top:12px; font-size:12px; letter-spacing:.02em; color:#a89a7c;
    opacity:.75; text-align:center; font-family:'Cormorant Garamond', serif;
  }
  #loc-note.visible{ display:block; }
  #loc-retry{ appearance:none; border:0; background:none; padding:0; margin-left:2px;
    font:inherit; color:inherit; text-decoration:underline; cursor:pointer; }
  #loc-retry:hover{ color:#e2d6bb; }
  #loc-retry:disabled{ text-decoration:none; opacity:.6; cursor:default; }

  /* a quiet flag, always available, for checking a different spot than wherever the
     visitor actually is — opens a small search bar, never on by default */
  #loc-flag{
    display:flex; align-items:center; margin:0; appearance:none; border:0; background:none; padding:0;
    font-size:17px; line-height:1; cursor:pointer; opacity:.4; transition:opacity .3s ease;
  }
  #loc-flag:hover, #loc-flag.open{ opacity:.85; }
  #loc-search{
    display:flex; align-items:center; justify-content:center; gap:6px; max-height:0; overflow:hidden;
    opacity:0; transition:max-height .3s ease, opacity .3s ease;
    flex-shrink:0;
  }
  #loc-search.open{ max-height:40px; opacity:1; }
  #loc-search input{
    appearance:none; border:0; border-bottom:1px solid rgba(184,144,63,.4); background:none;
    color:#e2d6bb; font:15px/1.3 'Jost', sans-serif; letter-spacing:.02em; padding:3px 2px;
    width:132px; outline:none;
  }
  #loc-search input::placeholder{ color:#a89a7c; }
  #loc-search input:focus{ border-bottom-color:var(--gold); }
  #loc-search-status{
    font-size:11px; letter-spacing:.02em; color:#a89a7c; text-align:center;
    font-family:'Cormorant Garamond', serif; min-height:1.2em;
  }

  @media (max-width: 700px){
    #chart-wrap, #slider-wrap, #controls{ width:92vw; }
    #controls{ gap:20px; flex-wrap:wrap; }
  }
  @media (orientation:portrait){
    #chart-wrap, #slider-wrap, #controls{ width:min(84vw, 520px); }
  }
</style>
<style>
  /* The way back is the brass disc off the shelf's plinth, with an arrow cut into
     it instead of the question mark. No word: the pieces are not captioned and
     neither is the way out of one. The page's own #backlink rules still set where
     it sits and how it fades; these only change what it looks like. */
  #backlink{ width:38px; height:38px; display:grid; place-items:center;
    font-size:0; text-decoration:none;
    filter:drop-shadow(0 1px 3px rgba(0,0,0,.65)); }
  #backlink img{ grid-area:1/1; width:100%; height:100%; display:block; }
  #backlink i{ grid-area:1/1; font-style:normal; font-weight:700;
    font-size:19px; line-height:1; font-family:Georgia, serif; color:#0f0a02;
    text-shadow:0 1px 0 rgba(255,238,196,.5), 0 -1px 1px rgba(0,0,0,.35); }
</style>
</head>
<body>
<style>
  #backlink{ position:fixed; top:18px; left:22px; z-index:50; color:#f2e9d8; opacity:.5; text-decoration:none; font-size:14px; letter-spacing:.04em; text-shadow:0 1px 3px rgba(0,0,0,.85), 0 0 9px rgba(0,0,0,.55); transition:opacity .3s ease; }
  #backlink:hover{ opacity:.9; }
</style>
<a id="backlink" href="../index.html" aria-label="sagne"><img src="../shelfdisk.png" alt=""><i>&#8592;</i></a>

<div id="stage">

  <div id="window-wrap">
    <div id="glass">
      <div id="sky-gradient"></div>
      <svg id="stars" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
      <div id="sky-body-layer">
        <svg id="sky-sun" viewBox="0 0 100 100"></svg>
        <svg id="sky-moon" viewBox="0 0 100 100"></svg>
      </div>
      <svg id="clouds" viewBox="0 0 100 100" preserveAspectRatio="none">
        <defs>
          <filter id="cloud-noise" x="-25%" y="-25%" width="150%" height="150%">
            <!-- baseFrequency tuned high on purpose: at the window's real (much smaller, much
                 less elongated) on-page size, a lower frequency reads as one soft smeared blob
                 rather than distinct cloud puffs — this was checked against the actual page,
                 not just an isolated test canvas -->
            <feTurbulence id="cloud-turbulence" type="fractalNoise" baseFrequency="0.06 0.09" numOctaves="5" seed="11" result="noise"/>
            <feColorMatrix in="noise" type="luminanceToAlpha" result="alphaNoise"/>
            <feComponentTransfer in="alphaNoise" result="shaped">
              <feFuncA id="cloud-curve" type="linear" slope="5.2" intercept="-4"/>
            </feComponentTransfer>
            <!-- real clouds aren't one flat colour — sunlit tops read whiter, shadowed
                 undersides greyer. Reusing the SAME noise field for this (rather than a
                 second, independent one) means the brightest/whitest parts naturally line up
                 with the densest/most-opaque parts of the shape above, the way a real cloud's
                 lit face and its solid core coincide. -->
            <feColorMatrix in="noise" type="matrix"
              values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 0 1"
              result="gray"/>
            <feComponentTransfer in="gray" result="shaded">
              <feFuncR id="cloud-shade-r" type="linear" slope="0.39" intercept="0.59"/>
              <feFuncG id="cloud-shade-g" type="linear" slope="0.38" intercept="0.61"/>
              <feFuncB id="cloud-shade-b" type="linear" slope="0.35" intercept="0.64"/>
            </feComponentTransfer>
            <feComposite in="shaded" in2="shaped" operator="in"/>
          </filter>
        </defs>
        <g id="cloud-drift"><rect x="-60" y="-10" width="220" height="80" filter="url(#cloud-noise)"/></g>
      </svg>
      <!-- real photographed hills, sitting IN FRONT of the sun and moon so
           they set behind the ridge; tinted with the time of day in JS -->
      <div id="hills"></div>
      <div id="hills-snow"></div>
      <div id="moon-disc-wrap"><svg viewBox="0 0 100 100" id="moon-disc-svg"></svg></div>
      <div id="fog"></div>
      <canvas id="precip"></canvas>
      <div id="lightning-flash"></div>
    </div>
    <img id="frame-img" src="windower-frame.png" alt="">
    <div id="beam-sun"></div>
    <div id="beam-moon"></div>
  </div>

  <div id="chart-wrap">
    <svg id="chart" viewBox="0 0 600 130" preserveAspectRatio="none"></svg>
  </div>

  <div id="slider-wrap">
    <div id="slider-track">
      <div id="slider-now-tick"></div>
      <div id="slider-thumb"></div>
    </div>
    <div id="slider-label">now</div>
  </div>

  <div id="controls">
    <label class="toggle" title="Moon phase only"><input type="checkbox" id="chk-moononly" aria-label="Moon phase only"><span class="toggle-glyph">&#127769;</span></label>
    <label class="toggle" title="Fuller reading"><input type="checkbox" id="chk-fuller" aria-label="Fuller reading"><span class="toggle-glyph">&deg;</span></label>
    <label class="toggle" title="Real weather"><input type="checkbox" id="chk-weather" aria-label="Real weather"><span class="toggle-glyph">&#9925;</span></label>
    <button type="button" id="loc-flag" title="check another location" aria-label="check another location" aria-expanded="false">🚩</button>
  </div>
  <div id="loc-note"><span id="loc-note-text">using an approximate location — check that your browser and device allow it, then</span> <button type="button" id="loc-retry">try again</button></div>
  <form id="loc-search" autocomplete="off">
    <input type="text" id="loc-search-input" placeholder="postcode or city" aria-label="postcode or city">
  </form>
  <div id="loc-search-status"></div>

</div>

<div id="tooltip"></div>

<script>
(function(){
  "use strict";

  /* ===================== ASTRONOMY ===================== */
  const rad = Math.PI / 180;
  const dayMs = 1000*60*60*24;
  const J1970 = 2440588, J2000 = 2451545;
  const e = rad * 23.4397;

  function toDays(date){ return (date.valueOf()/dayMs - 0.5 + J1970) - J2000; }
  function rightAscension(l,b){ return Math.atan2(Math.sin(l)*Math.cos(e) - Math.tan(b)*Math.sin(e), Math.cos(l)); }
  function declination(l,b){ return Math.asin(Math.sin(b)*Math.cos(e) + Math.cos(b)*Math.sin(e)*Math.sin(l)); }
  function azimuthFromSouth(H,phi,dec){ return Math.atan2(Math.sin(H), Math.cos(H)*Math.sin(phi) - Math.tan(dec)*Math.cos(phi)); }
  function altitudeCalc(H,phi,dec){ return Math.asin(Math.sin(phi)*Math.sin(dec) + Math.cos(phi)*Math.cos(dec)*Math.cos(H)); }
  function siderealTime(d,lw){ return rad*(280.16 + 360.9856235*d) - lw; }

  function solarMeanAnomaly(d){ return rad*(357.5291 + 0.98560028*d); }
  function eclipticLongitude(M){
    const C = rad*(1.9148*Math.sin(M) + 0.02*Math.sin(2*M) + 0.0003*Math.sin(3*M));
    const P = rad*102.9372;
    return M + C + P + Math.PI;
  }
  function sunCoords(d){
    const M = solarMeanAnomaly(d);
    const L = eclipticLongitude(M);
    return { dec: declination(L,0), ra: rightAscension(L,0) };
  }
  function getSunPosition(date, lat, lng){
    const lw = rad*-lng, phi = rad*lat, d = toDays(date);
    const c = sunCoords(d);
    const H = siderealTime(d,lw) - c.ra;
    return { azimuth: azimuthFromSouth(H,phi,c.dec), altitude: altitudeCalc(H,phi,c.dec) };
  }
  function moonCoords(d){
    const L = rad*(218.316 + 13.176396*d);
    const M = rad*(134.963 + 13.064993*d);
    const F = rad*(93.272 + 13.229350*d);
    const l = L + rad*6.289*Math.sin(M);
    const b = rad*5.128*Math.sin(F);
    const dt = 385001 - 20905*Math.cos(M);
    return { ra: rightAscension(l,b), dec: declination(l,b), dist: dt };
  }
  function getMoonPosition(date, lat, lng){
    const lw = rad*-lng, phi = rad*lat, d = toDays(date);
    const c = moonCoords(d);
    const H = siderealTime(d,lw) - c.ra;
    return { azimuth: azimuthFromSouth(H,phi,c.dec), altitude: altitudeCalc(H,phi,c.dec), distance: c.dist };
  }
  function getMoonIllumination(date){
    const d = toDays(date);
    const s = sunCoords(d);
    const m = moonCoords(d);
    const sdist = 149598000;
    const phi = Math.acos(Math.sin(s.dec)*Math.sin(m.dec) + Math.cos(s.dec)*Math.cos(m.dec)*Math.cos(s.ra-m.ra));
    const inc = Math.atan2(sdist*Math.sin(phi), m.dist - sdist*Math.cos(phi));
    const angle = Math.atan2(Math.cos(s.dec)*Math.sin(s.ra-m.ra), Math.sin(s.dec)*Math.cos(m.dec) - Math.cos(s.dec)*Math.sin(m.dec)*Math.cos(s.ra-m.ra));
    const fraction = (1+Math.cos(inc))/2;
    const phaseValue = 0.5 + 0.5*inc*(angle<0?-1:1)/Math.PI;
    return { fraction, phase: phaseValue };
  }

  function toBearing(azFromSouth){
    let deg = (azFromSouth/rad + 180) % 360;
    if (deg < 0) deg += 360;
    return deg;
  }
  const COMPASS = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
  function compassPoint(deg){ return COMPASS[Math.round(deg/22.5) % 16]; }

  function sunPositionLabel(altDeg){
    if (altDeg > 0) return "Day";
    if (altDeg > -6) return "Civil Twilight";
    if (altDeg > -12) return "Nautical Twilight";
    if (altDeg > -18) return "Astronomical Twilight";
    return "Night";
  }

  /* ===================== STATE ===================== */
  let lat = 55.19, lon = -1.56; // fallback: north-east England
  // silent until now — if the browser can't (or won't) hand over a real location, everything
  // downstream — sun/moon timing as well as live weather — was quietly using this fallback
  // with no sign to the visitor that anything was off. Surface it instead of guessing quietly.
  let weatherFetchFailures = 0; // consecutive failed weather fetches (location already known)
  function showLocationNote(msg){
    const note = document.getElementById('loc-note');
    if (msg){ const text = document.getElementById('loc-note-text'); if (text) text.textContent = msg; }
    if (note) note.classList.add('visible');
  }
  function hideLocationNote(){
    const note = document.getElementById('loc-note');
    if (note) note.classList.remove('visible');
  }
  function tryLocationAgain(){
    if (!navigator.geolocation) return;
    const btn = document.getElementById('loc-retry');
    if (btn){ btn.disabled = true; btn.textContent = 'checking…'; }
    navigator.geolocation.getCurrentPosition(
      pos => {
        lat = pos.coords.latitude; lon = pos.coords.longitude;
        hideLocationNote();
        if (btn){ btn.disabled = false; btn.textContent = 'try again'; }
        if (liveWeatherOn) fetchLiveWeather(); // re-pull weather for the corrected spot
      },
      () => {
        if (btn){ btn.disabled = false; btn.textContent = 'try again'; }
        const text = document.getElementById('loc-note-text');
        if (text) text.textContent = "still couldn't find it — check your browser and device settings, then";
      },
      { timeout: 5000 }
    );
  }
  const locRetryBtn = document.getElementById('loc-retry');
  if (locRetryBtn) locRetryBtn.addEventListener('click', tryLocationAgain);
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => { lat = pos.coords.latitude; lon = pos.coords.longitude; },
      showLocationNote, { timeout: 4000 }
    );
  } else {
    showLocationNote();
  }

  // the flag: a quiet, always-there way to check the sky somewhere other than
  // wherever the visitor actually is — never open by default, no page text anywhere
  // else hints it exists. Geocoding goes through OpenStreetMap's Nominatim (free, no
  // key) since open-meteo's own geocoder searches place names, not postcodes.
  /* where the discs go when they go inside the window: its own top corners,
     in page coordinates so they scroll with it. Only read by the coarse-pointer
     rules above; a desktop ignores both properties. */
  function placeDiscs(){
    const win = document.getElementById('window-wrap');
    const back = document.getElementById('backlink');
    if(!win || !back) return;
    const r = win.getBoundingClientRect();
    const inset = Math.max(6, Math.min(14, r.width*0.03));
    const st = document.documentElement.style;
    st.setProperty('--disc-top',   Math.round(r.top + window.scrollY + inset) + 'px');
    st.setProperty('--disc-left',  Math.round(r.left + window.scrollX + inset) + 'px');
    st.setProperty('--disc-right', Math.round(r.right + window.scrollX - inset - back.offsetWidth) + 'px');
  }
  placeDiscs();
  window.addEventListener('resize', placeDiscs);
  window.addEventListener('orientationchange', () => setTimeout(placeDiscs, 120));
  window.addEventListener('load', placeDiscs);

  (function initLocationSearch(){
    const flag = document.getElementById('loc-flag');
    const form = document.getElementById('loc-search');
    const input = document.getElementById('loc-search-input');
    const status = document.getElementById('loc-search-status');
    if (!flag || !form || !input) return;

    flag.addEventListener('click', () => {
      const open = form.classList.toggle('open');
      flag.classList.toggle('open', open);
      flag.setAttribute('aria-expanded', open ? 'true' : 'false');
      if (open) input.focus();
      else status.textContent = '';
    });

    /* An on-screen keyboard is not a keyboard. A one-field form submits on Enter in
       a desktop browser, but the Go key on some Android ones -- the Kindle's among
       them -- can leave the form alone entirely, and then a typed-in location does
       nothing and says nothing. Asking the form directly costs a line; preventing
       the key's own default is what stops a browser that DOES submit searching
       twice. */
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.keyCode === 13){
        e.preventDefault();
        form.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const q = input.value.trim();
      if (!q) return;
      status.textContent = 'looking…';
      try {
        const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q)}`;
        const res = await fetch(url);
        const results = await res.json();
        if (!results || !results.length) { status.textContent = "couldn't find that"; return; }
        lat = parseFloat(results[0].lat); lon = parseFloat(results[0].lon);
        hideLocationNote();
        if (liveWeatherOn) fetchLiveWeather();
        status.textContent = results[0].display_name.split(',').slice(0, 2).join(', ');
        input.value = '';
      } catch (e) {
        status.textContent = "couldn't reach the map — try again";
      }
    });
  })();

  let offsetDays = 0;      // -30..30, 0 = live
  let dragging = false;

  // ---- weather (not yet wired to live data — see applyClouds/applyFog below) ----
  let cloudCoverage = 0;   // 0 = clear, 1 = fully overcast
  let fogIntensity = 0;    // 0 = none, 1 = dense
  let rainIntensity = 0;   // 0 = none, 1 = downpour (mutually exclusive with snow, in practice)
  let snowIntensity = 0;   // 0 = none, 1 = heavy snow (0.15ish reads as flurries)
  let sleetIntensity = 0;  // 0 = none, 1 = heavy sleet
  let lightningIntensity = 0; // 0 = never, 1 = frequent strikes (only meaningful alongside rain)
  const SNAP_THRESHOLD = 1.2; // days, snap back to live when released this close to center

  const els = {
    sky: document.getElementById('sky-gradient'),
    stars: document.getElementById('stars'),
    skySun: document.getElementById('sky-sun'),
    skyMoon: document.getElementById('sky-moon'),
    hills: document.getElementById('hills'),
    hillsSnow: document.getElementById('hills-snow'),
    frameImg: document.getElementById('frame-img'),
    beamSun: document.getElementById('beam-sun'),
    beamMoon: document.getElementById('beam-moon'),
    moonWrap: document.getElementById('moon-disc-wrap'),
    moonSvg: document.getElementById('moon-disc-svg'),
    clouds: document.getElementById('clouds'),
    cloudTurbulence: document.getElementById('cloud-turbulence'),
    cloudRect: document.querySelector('#cloud-drift rect'),
    cloudCurve: document.getElementById('cloud-curve'),
    cloudShadeR: document.getElementById('cloud-shade-r'),
    cloudShadeG: document.getElementById('cloud-shade-g'),
    cloudShadeB: document.getElementById('cloud-shade-b'),
    fog: document.getElementById('fog'),
    precip: document.getElementById('precip'),
    lightningFlash: document.getElementById('lightning-flash'),
    chart: document.getElementById('chart'),
    sliderTrack: document.getElementById('slider-track'),
    sliderThumb: document.getElementById('slider-thumb'),
    sliderLabel: document.getElementById('slider-label'),
    chkMoonOnly: document.getElementById('chk-moononly'),
    chkFuller: document.getElementById('chk-fuller'),
    chkWeather: document.getElementById('chk-weather'),
    tooltip: document.getElementById('tooltip'),
  };

  /* ===================== STARS (build once) ===================== */
  (function buildStars(){
    let html = '';
    for (let i=0;i<40;i++){
      const x = (Math.random()*100).toFixed(1);
      const y = (Math.random()*70).toFixed(1);
      html += `<circle cx="${x}" cy="${y}" r="0.35" opacity="0.85"/>`;
    }
    els.stars.innerHTML = html;
  })();

  /* ===================== SKY GRADIENT ===================== */
  function skyColorForAltitude(altDeg){
    // stops keyed by altitude (deg): value -> [r,g,b] top, bottom pairs handled via mixing
    const stops = [
      [-90, hexToRgb('#0a1330'), hexToRgb('#141c45')],
      [-18, hexToRgb('#141c45'), hexToRgb('#2a3468')],
      [-6,  hexToRgb('#2a3468'), hexToRgb('#c97a5a')],
      [0,   hexToRgb('#3c4a7a'), hexToRgb('#e8ab7c')],
      [10,  hexToRgb('#3f8fc4'), hexToRgb('#cfe6ee')],
      [90,  hexToRgb('#2f7ab0'), hexToRgb('#a9d6e8')],
    ];
    for (let i=0;i<stops.length-1;i++){
      const [a0, top0, bot0] = stops[i];
      const [a1, top1, bot1] = stops[i+1];
      if (altDeg >= a0 && altDeg <= a1){
        const t = (altDeg - a0) / (a1 - a0);
        return {
          top: mixRgb(top0, top1, t),
          bottom: mixRgb(bot0, bot1, t)
        };
      }
    }
    return altDeg < -90 ? {top:stops[0][1], bottom:stops[0][2]} : {top:stops[stops.length-1][1], bottom:stops[stops.length-1][2]};
  }
  function hexToRgb(hex){
    const v = parseInt(hex.slice(1),16);
    return [(v>>16)&255, (v>>8)&255, v&255];
  }
  function mixRgb(a,b,t){ return a.map((c,i)=> Math.round(c + (b[i]-c)*t)); }
  function rgbStr(c){ return `rgb(${c[0]},${c[1]},${c[2]})`; }

  /* ===================== CLOUDS + FOG ===================== */
  // coverage 0..1: the component-transfer intercept is what actually clips the noise field
  // down to a handful of separated wisps (low) or up past nearly all of it (high, reading as
  // a near-solid grey ceiling) — calibrated by eye against rendered samples, since
  // feTurbulence's real output distribution doesn't match its nominal 0..1 range, and doesn't
  // move linearly either: a single line through a "clear" and a "heavy" sample left everything
  // in between looking barely-there, so this is a 3-point piecewise curve (clear/half/heavy)
  // instead of one straight line.
  const CLOUD_CURVE_PTS = [
    {c:0,   intercept:-4.0, slope:5.2},
    {c:0.5, intercept:-2.0, slope:4.8},
    {c:1.0, intercept:0.8,  slope:3.5},
  ];
  // the noise's baseFrequency was tuned against one specific window shape (a wide desktop
  // one) — on a much taller/narrower phone or e-reader window, that same fixed-seed pattern
  // can leave one of its low spots stretched right across the lower sky, showing as a gap of
  // bare blue between the clouds and the hills that never happens on desktop. Rescaling
  // frequency by the glass's actual pixel width/height keeps each cloud "cell" close to the
  // same physical size regardless of window shape, so the pattern reads the same everywhere.
  const CLOUD_FREQ_REF = {w:700, h:440, fx:0.06, fy:0.09};   // the desktop size this was tuned against
  function updateCloudFrequency(){
    const rect = document.getElementById('glass').getBoundingClientRect();
    const w = rect.width || CLOUD_FREQ_REF.w, h = rect.height || CLOUD_FREQ_REF.h;
    // what actually determines a cell's on-screen shape is baseFrequency combined with the
    // box's aspect ratio (pixel-cell-width : pixel-cell-height = aspect * freq_y/freq_x) — so
    // it's the RATIO between the two axes that needs correcting for a different-shaped window,
    // not each axis independently. Splitting that correction as a square root across both axes
    // (rather than piling it all onto one) keeps the pattern's overall density about the same
    // as the desktop reference instead of pushing either axis to an extreme on very tall/narrow
    // windows.
    const refAspect = CLOUD_FREQ_REF.w / CLOUD_FREQ_REF.h;
    const aspectAdjust = Math.sqrt((w/h) / refAspect);
    const fx = CLOUD_FREQ_REF.fx * aspectAdjust;
    const fy = CLOUD_FREQ_REF.fy / aspectAdjust;
    els.cloudTurbulence.setAttribute('baseFrequency', `${fx.toFixed(4)} ${fy.toFixed(4)}`);
  }
  function lerpCloudCurve(c){
    for(let i=0;i<CLOUD_CURVE_PTS.length-1;i++){
      const a=CLOUD_CURVE_PTS[i], b=CLOUD_CURVE_PTS[i+1];
      if(c<=b.c){ const t=(c-a.c)/(b.c-a.c);
        return { intercept: a.intercept+(b.intercept-a.intercept)*t, slope: a.slope+(b.slope-a.slope)*t }; }
    }
    return CLOUD_CURVE_PTS[CLOUD_CURVE_PTS.length-1];
  }
  // heavier cloud isn't just denser — real storm cloud is visibly darker grey than a wisp of
  // fair-weather cloud, and any cloud reads darker at night (lit by scattered ambient/moon
  // light rather than direct sun) than by day. And within a single cloud, it's never one flat
  // colour either: sunlit tops read whiter, shadowed undersides greyer — that's the shadow/
  // highlight pair below, not just a single coverage-driven tone.
  const CLOUD_SHADOW_LIGHT = hexToRgb('#b4bac2'), CLOUD_SHADOW_HEAVY = hexToRgb('#3a3f48');
  const CLOUD_HIGHLIGHT_LIGHT = hexToRgb('#fffffd'), CLOUD_HIGHLIGHT_HEAVY = hexToRgb('#6b7078');
  // snow falls from a visibly lighter, brighter grey sky than a rain/thunderstorm one — the
  // same heavy coverage, but nowhere near as dark and ominous
  const CLOUD_SHADOW_HEAVY_SNOW = hexToRgb('#8b909a'), CLOUD_HIGHLIGHT_HEAVY_SNOW = hexToRgb('#d9dce2');
  const CLOUD_NIGHT_TONE = hexToRgb('#232a3a');
  function applyClouds(coverage, dayF, snowy){
    const c = Math.max(0, Math.min(1, coverage));
    const f = Math.max(0, Math.min(1, dayF));
    const sn = Math.max(0, Math.min(1, snowy||0));
    els.clouds.style.opacity = c > 0.01 ? 1 : 0;
    const curve = lerpCloudCurve(c);
    els.cloudCurve.setAttribute('intercept', curve.intercept.toFixed(3));
    els.cloudCurve.setAttribute('slope', curve.slope.toFixed(2));
    const shadowHeavy = mixRgb(CLOUD_SHADOW_HEAVY, CLOUD_SHADOW_HEAVY_SNOW, sn);
    const highlightHeavy = mixRgb(CLOUD_HIGHLIGHT_HEAVY, CLOUD_HIGHLIGHT_HEAVY_SNOW, sn);
    const shadow = mixRgb(CLOUD_NIGHT_TONE, mixRgb(CLOUD_SHADOW_LIGHT, shadowHeavy, c), f);
    const highlight = mixRgb(CLOUD_NIGHT_TONE, mixRgb(CLOUD_HIGHLIGHT_LIGHT, highlightHeavy, c), f);
    const funcs = [els.cloudShadeR, els.cloudShadeG, els.cloudShadeB];
    funcs.forEach((fn,i)=>{
      const s = shadow[i]/255, h = highlight[i]/255;
      fn.setAttribute('intercept', s.toFixed(3));
      fn.setAttribute('slope', (h-s).toFixed(3));
    });
    // Safari/WebKit has a known bug where changing SVG filter-primitive attributes via JS
    // doesn't reliably invalidate the cached filter output — the clouds can get stuck
    // showing whatever colour they first rendered (e.g. daytime white), never actually
    // updating again even though intercept/slope keep changing correctly underneath.
    // Detaching and reattaching the filter reference forces a genuine re-render; cheap
    // enough to do unconditionally once a second.
    if(els.cloudRect){
      els.cloudRect.setAttribute('filter', 'none');
      els.cloudRect.getBoundingClientRect();
      els.cloudRect.setAttribute('filter', 'url(#cloud-noise)');
    }
  }
  // intensity 0..1: fog is modelled as a haze hugging the hills that thins going up —
  // heavier fog both climbs higher up the glass (eating further into the sky, not just
  // the hills) and stays dense for more of that climb before tapering, rather than fading
  // immediately — a straight top-to-bottom linear fade reads as thin even at max opacity,
  // since most of its height is already faded well before the top. A held-density plateau
  // (the mid stop below) is what makes "heavy" actually read as a near-whiteout rather than
  // just a stronger tint at the bottom edge.
  // fog is lit by ambient/scattered light like anything else outside — bright pale grey by
  // day, a much darker blue-grey haze at night rather than staying implausibly pale
  const FOG_DAY = [214,217,222], FOG_NIGHT = [58,66,84];
  function applyFog(intensity, dayF){
    const f = Math.max(0, Math.min(1, intensity));
    els.fog.style.opacity = f > 0.01 ? 1 : 0;
    const topPct = 15 + f*80;                    // how high up the glass the fog reaches at all
    const bottomA = 0.3 + f*0.55;                // opacity right at the bottom edge
    const holdPct = topPct * (0.35 + f*0.4);     // where density starts tapering off
    const holdA = bottomA * (0.55 + f*0.35);     // opacity still held at that point
    const [r,g,b] = mixRgb(FOG_NIGHT, FOG_DAY, Math.max(0,Math.min(1,dayF)));
    els.fog.style.background =
      `linear-gradient(to top, rgba(${r},${g},${b},${bottomA.toFixed(2)}) 0%, ` +
      `rgba(${r},${g},${b},${holdA.toFixed(2)}) ${holdPct.toFixed(1)}%, ` +
      `rgba(${r},${g},${b},0) ${topPct.toFixed(1)}%)`;
  }

  /* ===================== LIVE WEATHER =====================
     Same open-meteo endpoint galileo and conometer already call, same lat/lon this page
     already resolves for the sun/moon (real geolocation with a north-east-England fallback).
     cloud_cover comes straight from the API as a percentage; the WMO weather_code decides
     which, if any, of rain/snow/sleet/fog/lightning gets switched on and roughly how hard —
     each code's own "slight/moderate/heavy" wording is a more reliable intensity signal here
     than trying to rescale the raw precipitation-amount field ourselves. Off by default, like
     the other two toggles below — nothing about this changes what a visitor sees until they
     opt in.

     This also has to work with the time slider, not just "right now": rather than a single
     current-conditions call, we pull an hourly array spanning past_days..forecast_days and
     pick whichever hour is closest to whatever moment the slider is currently showing. Past
     the edges of that window (open-meteo's real forecast horizon) it just holds the nearest
     edge day's conditions rather than showing nothing — real forecasts don't reach further
     out than that anyway, so there's nothing truthful to show past it. */
  const WMO_WEATHER = {
    45:{fog:0.45}, 48:{fog:0.75},                          // fog, rime fog
    51:{rain:0.15}, 53:{rain:0.35}, 55:{rain:0.55},         // drizzle
    56:{sleet:0.3}, 57:{sleet:0.55},                        // freezing drizzle
    61:{rain:0.25}, 63:{rain:0.55}, 65:{rain:0.9},          // rain
    66:{sleet:0.35}, 67:{sleet:0.7},                        // freezing rain
    71:{snow:0.2}, 73:{snow:0.5}, 75:{snow:0.85},           // snow
    77:{snow:0.15},                                          // snow grains
    80:{rain:0.3}, 81:{rain:0.6}, 82:{rain:0.95},           // rain showers
    85:{snow:0.35}, 86:{snow:0.8},                          // snow showers
    95:{rain:0.6, lightning:0.5},                           // thunderstorm
    96:{rain:0.7, lightning:0.75}, 99:{rain:0.85, lightning:1.0},  // thunderstorm w/ hail
  };
  function clearLiveWeather(){
    cloudCoverage=0; fogIntensity=0; rainIntensity=0; snowIntensity=0; sleetIntensity=0; lightningIntensity=0;
  }
  function applyWeatherSample(weatherCode, cloudCoverPct){
    cloudCoverage = Math.max(0, Math.min(1, (cloudCoverPct||0)/100));
    const m = WMO_WEATHER[weatherCode] || {};
    rainIntensity = m.rain||0; snowIntensity = m.snow||0; sleetIntensity = m.sleet||0;
    fogIntensity = m.fog||0; lightningIntensity = m.lightning||0;
    // rain/snow/sleet never fall from a mostly-clear sky — reported cloud_cover can lag or
    // under-report next to the weather code, so floor it whenever precipitation is actually
    // happening, scaled up with how heavy that precipitation is
    const anyPrecip = Math.max(rainIntensity, snowIntensity, sleetIntensity);
    if(anyPrecip>0) cloudCoverage = Math.max(cloudCoverage, 0.65 + anyPrecip*0.3);
  }
  let liveWeatherOn = false, weatherPoll = null, weatherHourly = null;
  async function fetchLiveWeather(){
    if(lat==null || lon==null) return;
    try{
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
        `&hourly=weather_code,cloud_cover&past_days=30&forecast_days=16&timezone=UTC`;
      const res = await fetch(url);
      const data = await res.json();
      if(!liveWeatherOn) return;   // the toggle may have been switched off while this was in flight
      if(data && data.hourly && Array.isArray(data.hourly.time) && data.hourly.time.length){
        weatherHourly = {
          times: data.hourly.time.map(t => new Date(t+'Z').getTime()),
          code: data.hourly.weather_code,
          cloud: data.hourly.cloud_cover,
        };
        if (weatherFetchFailures > 0){ weatherFetchFailures = 0; hideFetchTrouble(); }
      } else {
        throw new Error('unexpected response shape');
      }
    } catch(e){
      // a single missed refresh isn't worth interrupting anyone over -- but silence past
      // that point would mean quietly showing stale sky conditions as if they were still real
      if(!liveWeatherOn) return;
      weatherFetchFailures++;
      if (weatherFetchFailures >= 2) showFetchTrouble();
    }
  }
  // called every render() tick while the toggle is on — cheap linear scan over at most ~770
  // hourly points, once a second, well under anything worth optimizing
  function updateWeatherForDisplayDate(displayDate){
    if(!weatherHourly || !weatherHourly.times.length) return;
    const t = displayDate.getTime();
    let idx = 0, bestDiff = Infinity;
    for(let i=0;i<weatherHourly.times.length;i++){
      const diff = Math.abs(weatherHourly.times[i]-t);
      if(diff<bestDiff){ bestDiff=diff; idx=i; }
    }
    applyWeatherSample(weatherHourly.code[idx], weatherHourly.cloud[idx]);
  }
  function updateLiveWeatherToggle(){
    liveWeatherOn = els.chkWeather.checked;
    if(liveWeatherOn){
      // switching the weather on shortens the slider's reach, so anything
      // already parked beyond the forecast has to come back to its edge —
      // otherwise it would sit past the end of its own track showing weather
      // that does not exist for that day
      if(offsetDays > FORECAST_DAYS){ offsetDays = FORECAST_DAYS; }
      updateSliderVisual();
      fetchLiveWeather();
      if(!weatherPoll) weatherPoll = setInterval(fetchLiveWeather, 10*60*1000);
    } else {
      clearLiveWeather();
    }
  }
  els.chkWeather.addEventListener('change', updateLiveWeatherToggle);
  // a page refresh can leave the checkbox showing "checked" (ordinary browser form-state
  // restoration) without ever firing a 'change' event — pick that up on load too, so the
  // toggle doesn't go visually-on but functionally-off after a reload
  if(els.chkWeather.checked) updateLiveWeatherToggle();

  /* ===================== RAIN + SNOW + SLEET =====================
     A small canvas particle system layered right against the glass — it runs its own
     requestAnimationFrame loop, independent of the once-a-second astronomy render(), since
     falling precipitation needs real motion. Rain is drawn as long, thin, fast streaks with
     some horizontal drift; snow as soft drifting flakes with gentle sideways sway; sleet sits
     between them — short, stubby, dense pellets, falling nearly straight down (ice doesn't
     catch the wind or drift the way rain does) and hitting harder/faster than snow. Light vs
     heavy is entirely a matter of spawn rate, size, and fall speed — same shapes throughout. */
  const precipCtx = els.precip.getContext('2d');
  let precipW=0, precipH=0, precipDPR=1;
  function resizePrecip(){
    precipDPR = Math.min(window.devicePixelRatio||1, 2);
    const rect = document.getElementById('glass').getBoundingClientRect();
    precipW = rect.width; precipH = rect.height;
    els.precip.width = Math.max(1, precipW*precipDPR);
    els.precip.height = Math.max(1, precipH*precipDPR);
    precipCtx.setTransform(precipDPR,0,0,precipDPR,0,0);
  }
  window.addEventListener('resize', ()=>{ resizePrecip(); updateCloudFrequency(); });

  let rainDrops = [], snowFlakes = [], sleetPellets = [];
  function spawnRainDrop(){
    const speed = 260 + rainIntensity*520 + Math.random()*70;
    rainDrops.push({
      x: Math.random()*precipW, y: -20,
      len: 12 + rainIntensity*24 + Math.random()*6,
      speed, drift: (Math.random()-0.5)*14,
      alpha: 0.22 + rainIntensity*0.3 + Math.random()*0.1,
    });
  }
  function spawnSnowFlake(){
    const depth = Math.random();  // 0 = distant/small/slow, 1 = near/large/fast — cheap parallax
    snowFlakes.push({
      x: Math.random()*precipW, y: -10,
      r: (1.1 + snowIntensity*2.2) * (0.5+depth*0.8) + Math.random()*0.6,
      speed: (22 + snowIntensity*45) * (0.6+depth*0.6),
      sway: 12 + Math.random()*22,
      swayFreq: 0.6 + Math.random()*0.8,
      phase: Math.random()*Math.PI*2,
      alpha: (0.45 + snowIntensity*0.35) * (0.5+depth*0.6),
    });
  }
  function spawnSleetPellet(){
    sleetPellets.push({
      x: Math.random()*precipW, y: -10,
      len: 5 + sleetIntensity*4 + Math.random()*2,
      speed: 360 + sleetIntensity*360 + Math.random()*60,
      drift: (Math.random()-0.5)*3,   // ice barely drifts — nothing like rain's wind-blown angle
      alpha: 0.45 + sleetIntensity*0.35 + Math.random()*0.1,
    });
  }

  let rainSpawnAccum = 0, snowSpawnAccum = 0, sleetSpawnAccum = 0;
  function stepPrecip(dt){
    if(rainIntensity>0.01){
      const rate = 3 + rainIntensity*55;   // drops/sec
      rainSpawnAccum += dt*rate;
      while(rainSpawnAccum>=1){ rainSpawnAccum-=1; if(rainDrops.length<420) spawnRainDrop(); }
    }
    for(const d of rainDrops){ d.y += d.speed*dt; d.x += d.drift*dt; }
    rainDrops = rainDrops.filter(d=> d.y-d.len < precipH+10);

    if(snowIntensity>0.01){
      const rate = 1 + snowIntensity*16;
      snowSpawnAccum += dt*rate;
      while(snowSpawnAccum>=1){ snowSpawnAccum-=1; if(snowFlakes.length<260) spawnSnowFlake(); }
    }
    for(const f of snowFlakes){ f.y += f.speed*dt; f.phase += f.swayFreq*dt; }
    snowFlakes = snowFlakes.filter(f=> f.y-f.r < precipH+10);

    if(sleetIntensity>0.01){
      const rate = 3 + sleetIntensity*50;
      sleetSpawnAccum += dt*rate;
      while(sleetSpawnAccum>=1){ sleetSpawnAccum-=1; if(sleetPellets.length<380) spawnSleetPellet(); }
    }
    for(const p of sleetPellets){ p.y += p.speed*dt; p.x += p.drift*dt; }
    sleetPellets = sleetPellets.filter(p=> p.y-p.len < precipH+10);
  }

  function drawPrecip(t){
    precipCtx.clearRect(0,0,precipW,precipH);
    precipCtx.strokeStyle = 'rgba(214,222,230,1)';
    precipCtx.lineCap = 'round';
    for(const d of rainDrops){
      precipCtx.globalAlpha = d.alpha;
      precipCtx.lineWidth = 1.1;
      precipCtx.beginPath();
      precipCtx.moveTo(d.x, d.y);
      precipCtx.lineTo(d.x - d.drift*0.05, d.y - d.len);
      precipCtx.stroke();
    }
    precipCtx.fillStyle = '#ffffff';
    for(const f of snowFlakes){
      precipCtx.globalAlpha = f.alpha;
      const x = f.x + Math.sin(f.phase)*f.sway*0.5;
      precipCtx.beginPath();
      precipCtx.arc(x, f.y, f.r, 0, Math.PI*2);
      precipCtx.fill();
    }
    // sleet: short, thick, near-opaque pellets — icy-white rather than rain's pale streak,
    // and stubby rather than snow's soft round dot
    precipCtx.strokeStyle = 'rgba(226,233,238,1)';
    for(const p of sleetPellets){
      precipCtx.globalAlpha = p.alpha;
      precipCtx.lineWidth = 1.8;
      precipCtx.beginPath();
      precipCtx.moveTo(p.x, p.y);
      precipCtx.lineTo(p.x - p.drift*0.1, p.y - p.len);
      precipCtx.stroke();
    }
    precipCtx.globalAlpha = 1;

    // the bolt itself is only drawn for a brief window right at the start of a flash —
    // real lightning's visible stroke is near-instant, it's the afterglow that lingers
    if(flashState && t < flashState.boltUntil){
      precipCtx.save();
      precipCtx.globalAlpha = 0.9;
      precipCtx.strokeStyle = '#eef4ff';
      precipCtx.lineWidth = 2;
      precipCtx.lineJoin = 'round';
      precipCtx.shadowColor = '#cfe0ff';
      precipCtx.shadowBlur = 10;
      precipCtx.beginPath();
      flashState.bolt.forEach((p,i)=> i===0 ? precipCtx.moveTo(p.x,p.y) : precipCtx.lineTo(p.x,p.y));
      precipCtx.stroke();
      precipCtx.restore();
    }
  }

  // ---- lightning: a bright overlay flash (fast rise, slower decay) plus a jagged bolt
  // visible only in the flash's first instant; occasionally flashes twice in quick succession,
  // the way real strikes often do. Frequency scales with lightningIntensity; brightness doesn't
  // — a rare storm's flash is just as bright as a frequent one, only more spaced out.
  let nextFlashAt = null, flashState = null;
  function generateBolt(){
    const startX = precipW*(0.15+Math.random()*0.7);
    const endY = precipH*(0.55+Math.random()*0.15);
    const pts = [{x:startX, y:-5}];
    let x=startX, y=-5;
    while(y < endY){ y += 14+Math.random()*22; x += (Math.random()-0.5)*30; pts.push({x,y}); }
    return pts;
  }
  function stepLightning(t){
    if(lightningIntensity<=0.01){ nextFlashAt=null; flashState=null; els.lightningFlash.style.opacity=0; return; }
    if(nextFlashAt==null && flashState==null){
      const avgGap = 15000 - lightningIntensity*12000;   // ~15s apart at low, ~3s apart at max
      nextFlashAt = t + avgGap*(0.4+Math.random()*1.2);
    }
    if(flashState==null && nextFlashAt!=null && t>=nextFlashAt){
      flashState = { t0:t, duration:260+Math.random()*180, bolt:generateBolt(), boltUntil:t+70+Math.random()*50, double:Math.random()<0.3 };
      nextFlashAt = null;
    }
    if(flashState){
      const elapsed = t - flashState.t0;
      if(elapsed > flashState.duration){
        if(flashState.double) flashState = { t0:t, duration:150+Math.random()*100, bolt:generateBolt(), boltUntil:t+50, double:false };
        else { flashState = null; els.lightningFlash.style.opacity = 0; }
      } else {
        const u = elapsed/flashState.duration;
        const env = u<0.12 ? u/0.12 : Math.pow(1-((u-0.12)/0.88), 1.6);   // fast rise, slower decay
        els.lightningFlash.style.opacity = (env*0.85).toFixed(3);
      }
    }
  }

  let lastPrecipT = null;
  function precipLoop(t){
    if(lastPrecipT==null) lastPrecipT = t;
    const dt = Math.min((t-lastPrecipT)/1000, 0.05);
    lastPrecipT = t;
    stepPrecip(dt);
    stepLightning(t);
    drawPrecip(t);
    requestAnimationFrame(precipLoop);
  }
  resizePrecip();
  updateCloudFrequency();
  requestAnimationFrame(precipLoop);

  /* ===================== MOON PHASE RENDER ===================== */
  function moonTerminatorPath(cx, cy, r, phase){
    // phase: 0=new,0.5=full,1=new (SunCalc convention)
    const theta = phase * 2 * Math.PI;
    const value = Math.cos(theta);
    const rightFixed = phase < 0.5; // which half is the "base" lit half
    const rx = Math.abs(value) * r;
    const additive = value < 0; // gibbous -> extend past half; crescent -> retract

    const sweep1 = rightFixed ? 1 : 0;
    let bulgeRight;
    if (rightFixed) bulgeRight = additive ? false : true;
    else bulgeRight = additive ? true : false;
    const sweep2 = bulgeRight ? 0 : 1;

    const top = `${cx},${cy-r}`;
    const bot = `${cx},${cy+r}`;
    return `M${top} A${r},${r} 0 0 ${sweep1} ${bot} A${rx},${r} 0 0 ${sweep2} ${top} Z`;
  }

  function moonSvgMarkup(cx, cy, r, phase, uid){
    const litPath = moonTerminatorPath(cx, cy, r, phase);
    const blurStd = Math.max(0.5, r*0.05).toFixed(2);
    const gx = (cx - r*0.24).toFixed(2), gy = (cy - r*0.34).toFixed(2), gr = (r*1.6).toFixed(2);

    return `
      <defs>
        <radialGradient id="${uid}-lit" gradientUnits="userSpaceOnUse" cx="${gx}" cy="${gy}" r="${gr}">
          <stop offset="0%" stop-color="#fdfbf5"/>
          <stop offset="60%" stop-color="#e9e5da"/>
          <stop offset="100%" stop-color="#c3bfb2"/>
        </radialGradient>
        <filter id="${uid}-blur" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="${blurStd}"/>
        </filter>
      </defs>
      <path d="${litPath}" fill="url(#${uid}-lit)" filter="url(#${uid}-blur)"/>
    `;
  }

  function renderMoonDisc(svgEl, phase){
    svgEl.innerHTML = moonSvgMarkup(50, 50, 42, phase, 'bigmoon');
  }

  function sunGlowMarkup(uid){
    return `
      <defs>
        <radialGradient id="${uid}-core" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fffdf2"/>
          <stop offset="45%" stop-color="#ffe9a8"/>
          <stop offset="100%" stop-color="#ffdd7a" stop-opacity="0"/>
        </radialGradient>
        <filter id="${uid}-blur" x="-100%" y="-100%" width="300%" height="300%">
          <feGaussianBlur stdDeviation="3.2"/>
        </filter>
      </defs>
      <circle cx="50" cy="50" r="46" fill="url(#${uid}-core)" filter="url(#${uid}-blur)"/>
      <circle cx="50" cy="50" r="17" fill="#fffdf5"/>
    `;
  }

  /* ===================== ARC CHART ===================== */
  const CHART_W = 600, CHART_H = 130;
  const CHART_PAD_X = 14;
  const ALT_MIN = -35, ALT_MAX = 80;

  function altToY(altDeg){
    const t = (altDeg - ALT_MIN) / (ALT_MAX - ALT_MIN);
    return CHART_H - 18 - t * (CHART_H - 34);
  }

  function buildCurve(getPos, centerDate){
    const N = 96;
    let d = '';
    for (let i=0;i<=N;i++){
      const hOffset = -12 + (24*i/N); // hours from -12 to +12 around centerDate
      const t = new Date(centerDate.getTime() + hOffset*3600*1000);
      const alt = getPos(t).altitude / rad;
      const x = CHART_PAD_X + (i/N) * (CHART_W - CHART_PAD_X*2);
      const y = altToY(alt);
      d += (i===0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1) + ' ';
    }
    return d;
  }

  function sunIconSvg(cx, cy, extraClass){
    return `<g class="body-icon ${extraClass}" data-body="sun" transform="translate(${cx},${cy})">
      <circle r="6" fill="var(--chart-sun)" stroke="#8a6f00" stroke-width="0.6"/>
      ${[0,45,90,135,180,225,270,315].map(a=>{
        const rad2 = a*Math.PI/180;
        const x1 = Math.cos(rad2)*8, y1=Math.sin(rad2)*8;
        const x2 = Math.cos(rad2)*11, y2=Math.sin(rad2)*11;
        return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--chart-sun)" stroke-width="1.3"/>`;
      }).join('')}
    </g>`;
  }
  function moonIconSvg(cx, cy, phase, extraClass){
    return `<g class="body-icon ${extraClass}" data-body="moon" transform="translate(${cx},${cy})">
      ${moonSvgMarkup(0, 0, 7, phase, 'charticonmoon')}
    </g>`;
  }

  /* ===================== SLIDER ===================== */
  // How far the slider may travel is not a fixed range: it is however far there
  // is something true to show. Backwards is always 30 days, and the weather
  // request now asks for 30 past days to match (open-meteo serves up to 92, so
  // that history genuinely exists and simply was not being requested).
  // Forwards is 30 with the weather off — sun and moon are CALCULATED, so their
  // positions, phase and rise/set times are exact at any date — but only 16 with
  // it on, because 16 days is open-meteo's actual forecast horizon and there is
  // no 17-day forecast anywhere to fetch. Previously the slider ran to 30 either
  // way and the lookup simply held the last hour it had, so "25 days ahead"
  // showed day 16's weather while saying otherwise. A shorter honest range beats
  // a longer one that quietly repeats itself.
  const PAST_DAYS = 30, FORECAST_DAYS = 16;
  function maxAhead(){ return liveWeatherOn ? FORECAST_DAYS : PAST_DAYS; }
  function clampOffset(o){ return Math.max(-PAST_DAYS, Math.min(maxAhead(), o)); }
  function offsetToPct(o){
    return o >= 0 ? 50 + (o/maxAhead())*50 : 50 + (o/PAST_DAYS)*50;
  }
  function pctToOffset(pct){
    return pct >= 50 ? ((pct-50)/50)*maxAhead() : ((pct-50)/50)*PAST_DAYS;
  }

  function updateSliderVisual(){
    const pct = Math.max(0, Math.min(100, offsetToPct(offsetDays)));
    els.sliderThumb.style.left = pct + '%';
    if (Math.abs(offsetDays) < 0.5){
      els.sliderLabel.textContent = 'now';
    } else {
      const days = Math.round(Math.abs(offsetDays));
      els.sliderLabel.textContent = (offsetDays > 0 ? days + ' day' + (days===1?'':'s') + ' ahead' : days + ' day' + (days===1?'':'s') + ' ago');
    }
  }

  function pointerToOffset(clientX){
    const rect = els.sliderTrack.getBoundingClientRect();
    const pct = ((clientX - rect.left) / rect.width) * 100;
    return clampOffset(pctToOffset(Math.max(0, Math.min(100, pct))));
  }

  els.sliderTrack.addEventListener('pointerdown', e=>{
    dragging = true;
    els.sliderTrack.setPointerCapture(e.pointerId);
    offsetDays = pointerToOffset(e.clientX);
    updateSliderVisual();
  });
  els.sliderTrack.addEventListener('pointermove', e=>{
    if (!dragging) return;
    offsetDays = pointerToOffset(e.clientX);
    updateSliderVisual();
  });
  function endDrag(){
    if (!dragging) return;
    dragging = false;
    if (Math.abs(offsetDays) < SNAP_THRESHOLD) offsetDays = 0;
    updateSliderVisual();
  }
  els.sliderTrack.addEventListener('pointerup', endDrag);
  els.sliderTrack.addEventListener('pointercancel', endDrag);
  els.sliderTrack.addEventListener('dblclick', ()=>{ offsetDays = 0; updateSliderVisual(); });

  /* ===================== TOOLTIP ===================== */
  let hoveredBody = null;
  function showTooltip(evt, body, data){
    const fuller = els.chkFuller.checked;
    const timeStr = data.time;
    let html = `<div class="t-time">${timeStr}</div>`;
    if (fuller){
      html += `<div class="t-row"><span class="t-label">Alt</span>${data.alt}</div>`;
      html += `<div class="t-row"><span class="t-label">Heading</span>${data.heading}</div>`;
      html += `<div class="t-row"><span class="t-label">Position</span>${data.position}</div>`;
    }
    els.tooltip.innerHTML = html;
    els.tooltip.style.left = evt.clientX + 'px';
    els.tooltip.style.top = evt.clientY + 'px';
    els.tooltip.classList.add('show');
  }
  function hideTooltip(){ els.tooltip.classList.remove('show'); }

  /* ===================== MAIN RENDER ===================== */
  let lastSunData = null, lastMoonData = null, lastPhase = 0.25;

  function skyPosFromAzAlt(bearingDeg, altDeg){
    let rel = bearingDeg - 180; // 0 = due south = center of window
    if (rel > 180) rel -= 360;
    if (rel < -180) rel += 360;
    const x = 50 + Math.max(-1, Math.min(1, rel/100)) * 44;
    const ALT_LOW = -8, ALT_HIGH = 80;
    const altClamped = Math.max(ALT_LOW, Math.min(ALT_HIGH, altDeg));
    const t = (altClamped - ALT_LOW) / (ALT_HIGH - ALT_LOW);
    // horizon (alt 0) sits on the top of the centre green hill (~y76%), so
    // the sun/moon rise and set at the ridge rather than down at the sill
    const y = 83.3 - t * 80;
    return {x, y};
  }

  function render(){
    const displayDate = new Date(Date.now() + offsetDays*dayMs);
    if(liveWeatherOn && weatherHourly) updateWeatherForDisplayDate(displayDate);

    const sun = getSunPosition(displayDate, lat, lon);
    const moon = getMoonPosition(displayDate, lat, lon);
    const illum = getMoonIllumination(displayDate);

    const sunAltDeg = sun.altitude/rad;
    const moonAltDeg = moon.altitude/rad;
    const sunBearing = toBearing(sun.azimuth);
    const moonBearing = toBearing(moon.azimuth);

    lastSunData = {
      time: displayDate.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}),
      alt: sunAltDeg.toFixed(1) + '°',
      heading: Math.round(sunBearing) + '° ' + compassPoint(sunBearing),
      position: sunPositionLabel(sunAltDeg)
    };
    lastMoonData = {
      time: displayDate.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}),
      alt: moonAltDeg.toFixed(1) + '°',
      heading: Math.round(moonBearing) + '° ' + compassPoint(moonBearing),
      position: moonAltDeg > 0 ? 'Above horizon' : 'Below horizon'
    };
    lastPhase = illum.phase;

    // sky gradient
    const colors = skyColorForAltitude(sunAltDeg);
    els.sky.style.background = `linear-gradient(180deg, ${rgbStr(colors.top)} 0%, ${rgbStr(colors.bottom)} 100%)`;

    // stars opacity - visible when sun well below horizon
    const baseStarOpacity = Math.max(0, Math.min(1, (-sunAltDeg - 2) / 14));
    const moonAltFactor = Math.max(0, Math.min(1, moonAltDeg / 30));
    const moonWashout = illum.fraction * moonAltFactor * 0.8;
    const starOpacity = baseStarOpacity * (1 - moonWashout);
    els.stars.style.opacity = starOpacity;

    // ambient sun/moon bodies positioned in the window by real altitude/azimuth
    const moonOnly = els.chkMoonOnly.checked;

    if (!els.skySun.dataset.built){ els.skySun.innerHTML = sunGlowMarkup('ambientsun'); els.skySun.dataset.built = '1'; }
    els.skyMoon.innerHTML = moonSvgMarkup(50, 50, 42, illum.phase, 'ambientmoon');

    const sunPos = skyPosFromAzAlt(sunBearing, sunAltDeg);
    const moonPos = skyPosFromAzAlt(moonBearing, moonAltDeg);
    const sunVisible = !moonOnly && sunAltDeg > -8;
    const moonVisible = !moonOnly && moonAltDeg > -8;

    // stay bright right down to the horizon (they now genuinely set BEHIND
    // the hills, so the ridge does the hiding — no early fade needed)
    els.skySun.style.left = sunPos.x + '%';
    els.skySun.style.top = sunPos.y + '%';
    els.skySun.style.opacity = sunVisible ? Math.max(0, Math.min(1, (sunAltDeg+8)/8)) : 0;
    els.skySun.classList.toggle('visible', sunVisible);

    els.skyMoon.style.left = moonPos.x + '%';
    els.skyMoon.style.top = moonPos.y + '%';
    els.skyMoon.style.opacity = moonVisible ? Math.max(0, Math.min(1, (moonAltDeg+8)/8)) : 0;
    els.skyMoon.classList.toggle('visible', moonVisible);

    // hills take on the time of day: full colour under a high sun, warm at
    // golden hour, dimmed toward a night silhouette after sundown
    const dayF = Math.max(0, Math.min(1, (sunAltDeg + 6) / 18));   // 0 night .. 1 daylight
    const warmF = (sunAltDeg > -6) ? Math.max(0, 1 - Math.abs(sunAltDeg) / 10) : 0; // peaks at the horizon
    const brightness = (0.30 + 0.70 * dayF).toFixed(3);
    const saturation = (0.65 + 0.55 * dayF).toFixed(3);
    const sepia = (0.4 * warmF).toFixed(3);
    els.hills.style.filter = `brightness(${brightness}) saturate(${saturation}) sepia(${sepia})`;

    // snow dusting the hills: opacity tracks current snowfall directly (no persistence once
    // it stops — a simplification, real accumulation would need to survive after the snow
    // itself clears), and how far down the ridge it reaches grows with how heavy it's coming
    // down. Its own, much gentler brightness floor than the bare hill photo — real snow stays
    // visibly pale at night (it reflects what little ambient/moon light there is) rather than
    // going as dark as bare rock or grass would.
    els.hillsSnow.style.opacity = snowIntensity > 0.02 ? Math.min(1, snowIntensity*1.3).toFixed(2) : 0;
    const snowMidPct = 30 + snowIntensity*45, snowEndPct = snowMidPct + 25;
    els.hillsSnow.style.background =
      `linear-gradient(to bottom, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.8) ${snowMidPct.toFixed(0)}%, rgba(255,255,255,0) ${snowEndPct.toFixed(0)}%)`;
    els.hillsSnow.style.filter = `brightness(${(0.55 + 0.45*dayF).toFixed(3)})`;

    // the sill light: a warm sunbeam by day, or — once the sun's down — cool
    // moonlight scaled by the real moon phase (bright near full, all but gone
    // near new), reusing the same day/moon factors as the hills and stars above.
    // A sharp, direct beam like this is exactly what overcast skies scatter
    // away — it was previously keyed only to sun/moon altitude, so it kept
    // shining at full strength even under a fully grey, clouded-over sky,
    // which reads as jarring against clouds dark enough to mean no direct
    // light is actually getting through. Thin clouds barely touch it; a
    // heavy overcast knocks it down to a bare trace rather than zeroing it
    // outright, since some diffuse light still gets through in reality.
    // A beam is a SHAPE, and a shape needs a small, bright source. Cloud does
    // not merely dim the sun, it spreads it into a broad grey source, and a
    // broad source casts no defined patch at all — so the patch must reach real
    // zero under heavy overcast even though the room stays perfectly bright
    // from diffuse light. The old 1 - cloud*0.88 confused those two things: it
    // left a sharp-edged sunbeam at 0.164 on the sill under a 95% clouded sky,
    // reasoning that "some diffuse light still gets through". True of the light,
    // false of the beam. Broken cloud barely touches it — the sun is usually
    // still in a gap — then it collapses and is gone once the sky is mostly
    // covered.
    const cc = Math.max(0, Math.min(1, (cloudCoverage - 0.35) / 0.45));
    const beamCloudAtten = 1 - cc*cc*(3 - 2*cc);
    const beamSunOpacity = Math.max(0, Math.min(1, (sunAltDeg + 4) / 14)) * beamCloudAtten;
    // beam-specific altitude factor — a wide ramp so the moon has to climb well clear of
    // the horizon before the beam reaches full strength, staying dim through moonrise/set
    // the way real low-angle moonlight does; a steep gamma on the phase fraction means only
    // a genuinely full-ish moon lights the floor plainly — a thin crescent is barely there
    const beamMoonAlt = Math.max(0, Math.min(1, moonAltDeg / 35));
    const beamMoonOpacity = Math.pow(illum.fraction, 1.8) * beamMoonAlt * (1 - dayF) * 0.85 * beamCloudAtten;
    // The frame and sill are a photograph, and it was the one element in the
    // scene never dimmed — lit at full daylight strength around the clock, so a
    // correctly black moonless sky sat inside a sunlit window. Everything else
    // here already dims: hills, snow, cloud. It now follows the same day factor,
    // lifted a little by whatever moon there actually is, and floored rather
    // than taken to black, because a real sill at night is dim, not invisible.
    const frameMoonLift = Math.pow(illum.fraction, 1.4) * beamMoonAlt * (1 - dayF);
    els.frameImg.style.filter =
      `brightness(${(0.30 + 0.70*dayF + 0.16*frameMoonLift).toFixed(3)})`;

    els.beamSun.style.opacity = beamSunOpacity;
    els.beamMoon.style.opacity = beamMoonOpacity;

    els.moonWrap.classList.toggle('active', moonOnly);
    if (moonOnly){
      renderMoonDisc(els.moonSvg, illum.phase);
    }

    applyClouds(cloudCoverage, dayF, snowIntensity);
    applyFog(fogIntensity, dayF);

    // ---- chart ----
    const sunCurveD = buildCurve(t => getSunPosition(t, lat, lon), displayDate);
    const moonCurveD = buildCurve(t => getMoonPosition(t, lat, lon), displayDate);
    const centerX = CHART_PAD_X + 0.5 * (CHART_W - CHART_PAD_X*2);
    const sunY = altToY(sunAltDeg);
    const moonY = altToY(moonAltDeg);
    const horizonY = altToY(0);

    els.chart.setAttribute('viewBox', `0 0 ${CHART_W} ${CHART_H}`);
    els.chart.innerHTML = `
      <line class="horizon-line" x1="${CHART_PAD_X}" y1="${horizonY}" x2="${CHART_W-CHART_PAD_X}" y2="${horizonY}"/>
      <line class="now-line" x1="${centerX}" y1="6" x2="${centerX}" y2="${CHART_H-6}"/>
      <path class="curve sun ${moonOnly?'greyed':''}" d="${sunCurveD}"/>
      <path class="curve moon" d="${moonCurveD}"/>
      ${sunIconSvg(centerX, sunY, moonOnly?'greyed':'')}
      ${moonIconSvg(centerX, moonY, illum.phase, '')}
    `;

    // hover bindings (icons rebuilt each render, so rebind)
    const sunIcon = els.chart.querySelector('[data-body="sun"]');
    const moonIcon = els.chart.querySelector('[data-body="moon"]');
    if (sunIcon){
      sunIcon.addEventListener('pointerenter', e => showTooltip(e, 'sun', lastSunData));
      sunIcon.addEventListener('pointermove', e => showTooltip(e, 'sun', lastSunData));
      sunIcon.addEventListener('pointerleave', hideTooltip);
    }
    if (moonIcon){
      moonIcon.addEventListener('pointerenter', e => showTooltip(e, 'moon', lastMoonData));
      moonIcon.addEventListener('pointermove', e => showTooltip(e, 'moon', lastMoonData));
      moonIcon.addEventListener('pointerleave', hideTooltip);
    }
  }

  updateSliderVisual();
  render();
  setInterval(render, 1000);

})();
</script>

<script>
(function(){
  var disc=document.getElementById('shelfdisc'), box=document.getElementById('plates');
  var rows=[].slice.call(box.querySelectorAll('.row'));
  function unroll(){ rows.forEach(function(r){ r.classList.remove('rolled'); }); }
  function shut(){ box.classList.remove('open'); disc.setAttribute('aria-expanded','false'); unroll(); }

  /* The twenty cards behind these plates are 6.2MB and not one of them can be
     seen until a plate is opened, but every page on the site was fetching the lot
     on load, ahead of the piece's own assets. Measured on bowl at 240px with a
     slow phone's CPU and connection, the bowl had still not appeared after 100
     seconds; held back, it is there in 12.
     They are held behind data-src rather than left to loading="lazy" alone,
     because that is a heuristic and not a promise -- the same page deferred them
     on a throttled connection and fetched all twenty on a fast one, since the
     browser's idea of "near the viewport" widens with bandwidth. This is the same
     on every machine. The attribute stays as a second line for anything that
     scrolls them into view another way. */
  var wired=false;
  function fetchCards(){
    if(wired) return; wired=true;
    [].slice.call(box.querySelectorAll('img[data-src]')).forEach(function(im){
      im.src=im.getAttribute('data-src'); im.removeAttribute('data-src');
    });
  }

  disc.addEventListener('click', function(ev){
    ev.stopPropagation();
    var open=box.classList.toggle('open');
    if(open) fetchCards();
    disc.setAttribute('aria-expanded', open?'true':'false');
    if(!open) unroll();
  });

  // Same bargain the case itself strikes: a mouse can hover, so a plate is a link
  // straight to its shelf. A thumb cannot, so the first tap on a plate rolls its
  // pieces out and only the second one goes to the shelf.
  var FINE=matchMedia('(hover: hover) and (pointer: fine)');
  rows.forEach(function(row){
    row.querySelector('.tag').addEventListener('click', function(ev){
      if(FINE.matches) return;
      if(row.classList.contains('rolled')) return;
      ev.preventDefault();
      unroll(); row.classList.add('rolled');
    });
  });

  document.addEventListener('click', function(ev){
    if(!box.contains(ev.target) && ev.target!==disc) shut();
  });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') shut(); });
})();
</script>
