<style>
  :root{
    --bg1:#0f1420; --bg2:#1c2433;
    --brass:#c9974e; --parchment:#f2e9d8;
    --tray-light:#c9a877; --tray-mid:#a8804e; --tray-dark:#6e5230;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    height:100%; margin:0; overflow:hidden;
    background: radial-gradient(ellipse at 50% 35%, var(--bg2) 0%, var(--bg1) 75%);
    font-family: Georgia, serif; color:var(--parchment);
  }
  #backlink{
    position:fixed; top:18px; left:22px; z-index:50;
    color:var(--parchment); opacity:.5; text-decoration:none;
    font-size:14px; letter-spacing:.04em; text-shadow:0 1px 3px rgba(0,0,0,.85), 0 0 9px rgba(0,0,0,.55); transition:opacity .3s ease;
  }
  #backlink:hover{opacity:.9;}

  #stage{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
  }
  #trayWrap{
    position:relative;
    width:min(88vw, 640px); height:min(88vw, 640px);
    max-height:60vh;
  }
  canvas{
    width:100%; height:100%; display:block; border-radius:18px;
    touch-action:none;
  }

  #permissionGate{
    position:fixed; inset:0; z-index:60;
    background:rgba(10,13,20,0.92);
    display:flex; align-items:center; justify-content:center;
    gap:28px; text-align:center; padding:30px;
  }
  #permissionGate.hidden{ display:none; }
  .gateBtn{
    background:transparent; border:1px solid rgba(201,151,78,0.6);
    color:var(--brass); font-family:inherit; font-size:34px;
    width:92px; height:92px; border-radius:50%; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .gateBtn:hover{ background:rgba(201,151,78,0.12); }

  #dock{
    position:fixed; bottom:0; left:0; right:0;
    display:flex; flex-direction:column; align-items:center; gap:12px;
    padding:16px 18px 26px;
    background:linear-gradient(to top, rgba(10,13,20,.85), rgba(10,13,20,0));
    z-index:40;
  }
  #objRow{ display:flex; align-items:center; justify-content:center; gap:10px; }
  .objBtn{
    background:transparent; border:1px solid rgba(242,233,216,.3);
    color:var(--parchment); font-size:22px; width:50px; height:50px;
    border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center;
    opacity:.55; transition:all .25s ease;
  }
  .objBtn.active{ opacity:1; border-color:var(--brass); background:rgba(201,151,78,0.14); }

  #colorRow{ display:flex; align-items:center; justify-content:center; gap:11px; }
  .colBtn{ width:26px; height:26px; border-radius:50%; cursor:pointer; padding:0;
    border:1px solid rgba(242,233,216,.35); opacity:.6; transition:all .25s ease;
    box-shadow:inset 0 1px 2px rgba(255,255,255,.35), inset 0 -2px 3px rgba(0,0,0,.4); }
  .colBtn:hover{ opacity:.95; }
  .colBtn.active{ opacity:1; transform:scale(1.14);
    border-color:var(--brass); box-shadow:0 0 0 2px rgba(201,151,78,0.4),
      inset 0 1px 2px rgba(255,255,255,.4), inset 0 -2px 3px rgba(0,0,0,.4); }
  .objBtn:hover{ opacity:1; }

  #speedRow{
    display:flex; align-items:center; gap:12px;
    font-size:13px; opacity:.75; letter-spacing:.03em;
  }
  /* On a desktop the four groups were stacked in a column about 180px wide under
     a 640px tray, on a screen 1440 across -- a huddle of controls in the middle of
     an empty room, with the speed slider's own row lapping over the bottom edge of
     the tray. They go side by side, which is what all that width is for, and the
     dock then stands 92px tall instead of 184 so it stops touching the tray at all.
     Width AND a fine pointer: the generated touch-targets block below grows each
     slider by half the distance to its nearest neighbour, measured on the stacked
     layout, so a coarse-pointer screen must keep the layout those measurements were
     taken from. A Windows tablet in landscape is wide but coarse, and keeps the
     column. */
  @media (min-width: 900px) and (pointer: fine){
    #dock{ flex-direction:row; justify-content:center; align-items:center;
      gap:clamp(38px, 6vw, 96px); padding:14px 26px 22px; }
  }
  input[type=range]{
    -webkit-appearance:none; appearance:none;
    width:150px; height:3px; border-radius:3px;
    background:rgba(242,233,216,.25); outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
    background:var(--brass); cursor:pointer;
    box-shadow:0 0 6px rgba(201,151,78,.6);
  }
  input[type=range]::-moz-range-thumb{
    width:14px; height:14px; border-radius:50%; border:none;
    background:var(--brass); cursor:pointer;
  }

  #volumeRow{
    display:flex; align-items:center; gap:10px;
    font-size:12px; opacity:.6; letter-spacing:.03em;
  }
  #volumeRow input[type=range]{ width:100px; }
  #muteBtn{
    background:none; border:none; padding:0; margin:0;
    font-size:14px; line-height:1; cursor:pointer; opacity:.85;
    transition:opacity .25s ease;
  }
  #muteBtn:hover{ opacity:1; }

<style>
  #music{ position:fixed; left:18px; bottom:16px; z-index:60; display:flex; align-items:center; gap:9px; }
  #musicBtn{ width:34px; height:34px; border-radius:50%; border:1px solid rgba(242,233,216,.25); background:rgba(20,24,34,.55); color:#f2e9d8; font-size:15px; line-height:1; cursor:pointer; opacity:.55; transition:opacity .3s, color .3s, border-color .3s; -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); }
  #musicBtn:hover{ opacity:1; }
  #musicBtn.playing{ color:#f0d69a; border-color:rgba(201,151,78,.6); opacity:.9; }
  #musicName{ max-width:40vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; color:#f2e9d8; opacity:0; transition:opacity .3s; letter-spacing:.02em; cursor:pointer; }
  #music:hover #musicName{ opacity:.55; }
  /* a phone has no hover, so the name of the visitor's own track was never
     visible on one at all -- and worse, an invisible thing sat there taking
     taps. While something is playing it simply shows, next to the button.
     Not a caption on the piece: it is their file's name, not the site's words. */
  #musicBtn.playing ~ #musicName{ opacity:.5; }

<div id="music" title="play your own music">
  <button id="musicBtn" aria-label="play your own music">🎧</button>
  <span id="musicName"></span>
</div>
<input type="file" id="musicPick" accept="audio/*" multiple hidden>
<audio id="musicEl"></audio>
<script>
(function(){
  const pick=document.getElementById('musicPick'), el=document.getElementById('musicEl'),
        btn=document.getElementById('musicBtn'), name=document.getElementById('musicName');
  let list=[], idx=0;
  const label=f=> f ? f.name.replace(/\.[^.]+$/,'') : '';
  function load(i){ if(el.src) URL.revokeObjectURL(el.src); el.src=URL.createObjectURL(list[i]); name.textContent=label(list[i]); }
  function sync(){ btn.textContent = !el.src ? '🎧' : (el.paused ? '▶' : '❚❚'); btn.classList.toggle('playing', !!el.src && !el.paused); }
  btn.addEventListener('click', ()=>{ if(!list.length){ pick.click(); return; } el.paused ? el.play() : el.pause(); });
  name.addEventListener('click', ()=> pick.click());
  pick.addEventListener('change', ()=>{ if(!pick.files.length) return; list=[...pick.files]; idx=0; el.loop=(list.length===1); load(0); el.play(); });
  el.addEventListener('ended', ()=>{ if(list.length>1){ idx=(idx+1)%list.length; load(idx); el.play(); } });
  el.addEventListener('play', sync); el.addEventListener('pause', sync); el.addEventListener('loadeddata', sync);
  sync();
})();
</script>

<div id="permissionGate">
  <button id="tiltBtn" class="gateBtn" title="phone/tablet tilt" aria-label="phone/tablet tilt">📱</button>
  <button id="skipDesktop" class="gateBtn" title="desktop, use mouse/trackpad" aria-label="desktop, use mouse/trackpad">🖱️</button>

<div id="stage">

  </div>

<div id="dock">

  </div>
  <div id="objRow">
    <button class="objBtn active" data-obj="pebble" title="river pebble" aria-label="river pebble">⬮</button>
    <button class="objBtn" data-obj="disc" title="disc" aria-label="disc">⬤</button>
    <button class="objBtn" data-obj="jellybean" title="jellybean stone" aria-label="jellybean stone">⬬</button>
  </div>

  <div id="volumeRow">
    <button id="muteBtn" type="button" aria-label="mute sound" aria-pressed="false">🔊</button>
    <input type="range" id="volumeSlider" min="0" max="100" value="70" aria-label="volume">
  </div>

<script>
(function(){
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  const trayWrap = document.getElementById('trayWrap');
  const gate = document.getElementById('permissionGate');
  const tiltBtn = document.getElementById('tiltBtn');
  const skipDesktop = document.getElementById('skipDesktop');
  const objBtns = document.querySelectorAll('.objBtn');
  const colorRow = document.getElementById('colorRow');
  const muteBtn = document.getElementById('muteBtn');

  // no-sound preference is site-wide — stored under one shared key so
  // every sagnity reads and respects the same setting
  /* STORAGE CAN THROW, rather than merely be empty. A private window, or any
     browser set to block site data, makes `localStorage` raise on the very first
     read -- and read unguarded at the top of a script that takes the WHOLE PIECE
     down with it. Found Aug 2026 by loading every piece with its props taken
     away: with site data blocked, musebox, lamp, roller and storm all came up
     BLANK, and two of those were pieces she had already signed off. candler had
     guarded its own read all along, which is what a right answer looks like.
     Everything goes through these two now. Losing the setting is nothing; losing
     the piece is everything. */
  const readStore = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
  const writeStore = (k,v) => { try{ localStorage.setItem(k,v); }catch(e){} };
  let muted = readStore('sagne-muted') === 'true';
  function updateMuteIcon(){
    muteBtn.textContent = muted ? '🔇' : '🔊';
    muteBtn.setAttribute('aria-pressed', muted ? 'true' : 'false');
    muteBtn.setAttribute('aria-label', muted ? 'unmute sound' : 'mute sound');
  }
  function setMuted(v){
    muted = v;
    updateMuteIcon();
    writeStore('sagne-muted', muted ? 'true' : 'false');
    // rumbleGain/audioCtx don't exist until ensureAudio() has run at least once
    if (rumbleGain && audioCtx) {
      rumbleGain.gain.setTargetAtTime(muted ? 0 : rumbleGain.gain.value, audioCtx.currentTime, 0.05);
    }
  }
  updateMuteIcon();
  muteBtn.addEventListener('click', () => setMuted(!muted));

  // If the visitor starts their own music, hush the tray's own sounds so the
  // two don't compete — the music becomes the sound. The mute icon switches
  // too (so it's visible and they can undo it) but we don't overwrite their
  // saved setting.
  const musicEl = document.getElementById('musicEl');
  if (musicEl) {
    musicEl.addEventListener('play', () => {
      if (!muted) setMuted(true);
    });
  }

  // roll-sound volume — shared site-wide the same way mute is, so the
  // level carries over between sagnities rather than resetting each time
  const volumeSlider = document.getElementById('volumeSlider');
  let volumeLevel = parseFloat(readStore('sagne-volume'));
  if (isNaN(volumeLevel)) volumeLevel = 0.7;
  volumeSlider.value = Math.round(volumeLevel * 100);
  volumeSlider.addEventListener('input', () => {
    volumeLevel = volumeSlider.value / 100;
    writeStore('sagne-volume', volumeLevel);
  });

  let W = 0, H = 0, DPR = 1;
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    const rect = trayWrap.getBoundingClientRect();
    W = rect.width; H = rect.height;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);

  // ---------- tilt input ----------
  // raw tilt is smoothed (low-pass) to remove hand tremor / sensor jitter,
  // exactly as specified in the brief — the object should feel like it's
  // resting on a real physical tray, not jerking with every micro-shake
  let rawTiltX = 0, rawTiltY = 0;
  let tiltX = 0, tiltY = 0;
  let baseBeta = null, baseGamma = null;
  let calibSamples = [], calibStart = 0;
  const SMOOTHING = 0.12;
  const CALIBRATION_MS = 500;

  function useDeviceTilt(){
    // A device that HAS an accelerometer can still never fire this -- her report
    // off the Kindle: "roller flatly does not tilt". Pressing the phone button used
    // to turn orientation on and simply assume it worked, with no way back, so on a
    // machine whose browser stays silent the tray had no control at all and the only
    // way out was reloading. If nothing usable has arrived by the time a hand could
    // have tilted it, the listener comes off and the pointer takes over instead.
    let heard = false;
    const onOrient = (e) => {
      if (e.beta === null || e.gamma === null) return;
      heard = true;
      // "flat" isn't one fixed angle — a phone propped on a table for a
      // countdown might sit at 20 degrees or 70 depending on the case or
      // the table, and everyone holds a phone slightly differently even
      // just standing there. Rather than assuming a prop angle, whatever
      // orientation the phone is actually in becomes the neutral centre,
      // and every reading after that is measured relative to it.
      //
      // that "actually in" reading can't be the very first sample, though —
      // it lands the instant tilt is enabled (or the tray is tapped to
      // recentre), while the hand is often still reaching the phone up
      // toward the face to press that button, not resting at however it'll
      // actually be held to watch afterward. Averaging a brief window of
      // samples instead gives the hand time to settle back down first.
      if (baseBeta === null) {
        if (!calibSamples.length) calibStart = performance.now();
        calibSamples.push({ beta: e.beta, gamma: e.gamma });
        if (performance.now() - calibStart >= CALIBRATION_MS) {
          baseBeta = calibSamples.reduce((s, c) => s + c.beta, 0) / calibSamples.length;
          baseGamma = calibSamples.reduce((s, c) => s + c.gamma, 0) / calibSamples.length;
          calibSamples = [];
        }
        return;
      }
      rawTiltX = Math.max(-1, Math.min(1, (e.gamma - baseGamma) / 22));
      rawTiltY = Math.max(-1, Math.min(1, (e.beta - baseBeta) / 22));
    };
    window.addEventListener('deviceorientation', onOrient);
    setTimeout(() => {
      if (heard) return;
      window.removeEventListener('deviceorientation', onOrient);
      useMouseTilt();
    }, 1400);
  }

  function useMouseTilt(){
    window.addEventListener('pointermove', (e) => {
      const rect = trayWrap.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      rawTiltX = Math.max(-1, Math.min(1, (e.clientX - cx) / (rect.width / 2)));
      rawTiltY = Math.max(-1, Math.min(1, (e.clientY - cy) / (rect.height / 2)));
    });
  }

  tiltBtn.addEventListener('click', async () => {
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      try {
        const res = await DeviceOrientationEvent.requestPermission();
        if (res === 'granted') { useDeviceTilt(); gate.classList.add('hidden'); ensureAudio(); return; }
      } catch (e) { /* fall through to mouse */ }
    } else {
      useDeviceTilt();
      gate.classList.add('hidden');
      ensureAudio();
      return;
    }
    useMouseTilt();
    gate.classList.add('hidden');
    ensureAudio();
  });
  skipDesktop.addEventListener('click', () => {
    useMouseTilt();
    gate.classList.add('hidden');
    ensureAudio();
  });

  // ---------- audio: soft rolling rumble + edge clack ----------
  let audioCtx = null, rumbleGain = null, rumbleFilter = null, rumbleSrc = null;
  function ensureAudio(){
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const bufferSize = audioCtx.sampleRate * 2;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    rumbleSrc = audioCtx.createBufferSource();
    rumbleSrc.buffer = buffer;
    rumbleSrc.loop = true;
    rumbleFilter = audioCtx.createBiquadFilter();
    rumbleFilter.type = 'lowpass';
    rumbleFilter.frequency.value = 200;
    rumbleGain = audioCtx.createGain();
    rumbleGain.gain.value = 0;
    rumbleSrc.connect(rumbleFilter).connect(rumbleGain).connect(audioCtx.destination);
    rumbleSrc.start();
  }
  function setRumble(speed, objType){
    if (!rumbleGain) return;
    // a lingering spin still makes a little noise even once the disc has
    // basically stopped travelling — the actual sound of a coin winding
    // down, not silence the instant translation stops
    const spinContribution = (objType === 'disc') ? Math.abs(obj.discAngVel) * 3.2 : 0;
    const activity = speed + spinContribution;
    const target = muted ? 0 : Math.min(0.16, activity * 0.02) * volumeLevel;
    rumbleGain.gain.setTargetAtTime(target, audioCtx.currentTime, 0.05);
    // a flat disc scraping a hard edge reads brighter/sharper than the
    // pebble's softer, duller slide
    const baseFreq = (objType === 'disc') ? 260 : 140;
    rumbleFilter.frequency.setTargetAtTime(baseFreq + activity * 12, audioCtx.currentTime, 0.08);
  }
  function playClack(intensity){
    if (!audioCtx || muted) return;
    const now = audioCtx.currentTime;
    // a light tap is contact noise, not a musical pitch — a short burst
    // of filtered noise decays the way a small hard object actually
    // sounds against a surface, where a clean oscillator tone reads as
    // synthesized and too "bloopy"
    const dur = 0.045;
    const bufferSize = Math.ceil(audioCtx.sampleRate * dur);
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const src = audioCtx.createBufferSource();
    src.buffer = buffer;

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 900 + Math.random() * 300;
    filter.Q.value = 1.2;

    const gain = audioCtx.createGain();
    // quiet, and only scales gently with impact speed — should stay a
    // light tap even on a fairly hard hit, not swell into something loud
    const peak = Math.min(0.06, 0.012 + intensity * 0.008) * volumeLevel;
    gain.gain.setValueAtTime(peak, now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);

    src.connect(filter).connect(gain).connect(audioCtx.destination);
    src.start(now);
    src.stop(now + dur);
  }

  // ---------- objects ----------
  // river pebble: the simplest case per the brief — position, velocity,
  // friction, boundary collision. No rotation.
  // disc: flat and rigid, so it slides rather than rolls — same core
  // mechanic as the pebble — but it can still spin in place around its
  // own centre, independent of where it's travelling. That spin comes
  // from real angled contact with the wall (a glancing hit imparts
  // torque the same way a hockey puck catches an edge), not from being
  // scripted to twirl; a dead-on hit imparts no spin at all.
  // jellybean stone: a smooth, elongated stone with a very slightly
  // off-centre mass — just a barely-perceptible lean in its density —
  // that curls in a lazy, wide arc as it rolls (see the curl mechanism
  // below) rather than travelling in a straight line. And because it's
  // one smooth stone with nothing on it to catch, it skips the stick-slip
  // catch mechanic entirely.
  const OBJECTS = {
    pebble:    { friction: 0.985, radius: 30, wobble: 0 },
    disc:      { friction: 0.976, radius: 34, wobble: 0, spinOnImpact: 1 },
    jellybean: { friction: 0.982, radius: 32, wobble: 1, catchInterval: 1e9, curlRate: 0.018, slewOnImpact: 1 },
  };

  // ---------- glass colour ----------
  // Her call: the pieces keep their materials -- the pebble is sea glass, the disc a
  // stone, the bean a stone -- but the COLOUR carries across all three. Old bottles
  // come in clear, coke-bottle green, amber, cobalt and the near-black of smoke
  // glass, and the same five dress every shape. The glass wears the colour at full
  // strength; the stone and the bean take it muted, the way a real stone is a
  // washed-out cousin of the glass beside it rather than a copy of it.
  //
  // Each colour is a single tint. The glass body is three saturated stops of it; the
  // stone and bean keep their own light-to-dark shading and are only pulled toward
  // the tint -- the stone the harder of the two, the bean softer and warmer -- so
  // their form still reads as stone, just stone of that colour.
  // `tint` dresses the bean (she has the bean right, so it stays as it was).
  // `stoneTint`, where present, dresses the stone instead -- the glass tint reads
  // too vivid on an opaque stone, so a few of them get a greyer, more mineral
  // cousin of the same colour. Absent, the stone just uses `tint`.
  const GLASS = {
    white:  { glass:['#f2f6f4','#c9d5d0','#94a49e'], edge:'rgba(120,140,134,0.5)', tint:[233,238,236], stone:0.42, bean:0.30 },
    // coke-bottle green as glass; a greyer sage as stone
    teal:   { glass:['#d9f5ea','#4fae93','#1c5f52'], edge:'rgba(20,60,50,0.55)',   tint:[ 79,174,147], stoneTint:[118,146,126], stone:0.46, bean:0.32 },
    // amber glass; a redder, rustier stone
    amber:  { glass:['#eec482','#bd7826','#5f330d'], edge:'rgba(66,34,8,0.55)',     tint:[200,137, 47], stoneTint:[176, 92, 44], stone:0.42, bean:0.34 },
    // a deeper cobalt glass than before; the stone a dark, grey blue slate
    cobalt: { glass:['#9fbde8','#22409a','#0a1642'], edge:'rgba(8,14,50,0.62)',     tint:[ 59,100,192], stoneTint:[ 78, 94,112], stone:0.55, bean:0.34 },
    black:  { glass:['#9aa2a8','#3c4248','#14181c'], edge:'rgba(8,10,12,0.6)',     tint:[ 34, 40, 46], stone:0.52, bean:0.44 },
  };
  const GLASS_ORDER = ['white','teal','amber','cobalt','black'];
  let glassColor = readStore('sagne-roller-glass');
  if (!GLASS[glassColor]) glassColor = 'teal';

  const hexToRgb = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
  const mix = (a, b, t) => 'rgb('+a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(',')+')';
  // the glass body, at full saturation
  function glassBody(grad){
    const g = GLASS[glassColor].glass;
    grad.addColorStop(0, g[0]); grad.addColorStop(0.55, g[1]); grad.addColorStop(1, g[2]);
    return grad;
  }
  const glassEdge = () => GLASS[glassColor].edge;
  // an opaque material (stone or bean) keeps its own three stops but is pulled
  // toward the current tint by `amt`, so it colours without turning to glass
  function tintStops(grad, stops, amt, tintRgb){
    const t = tintRgb || GLASS[glassColor].tint;
    grad.addColorStop(0,    mix(hexToRgb(stops[0]), t, amt));
    grad.addColorStop(0.6,  mix(hexToRgb(stops[1]), t, amt));
    grad.addColorStop(1,    mix(hexToRgb(stops[2]), t, amt));
    return grad;
  }
  // the stone prefers its own mineral tint; the bean keeps the plain one
  const stoneTintRgb = () => GLASS[glassColor].stoneTint || GLASS[glassColor].tint;

  // The bean is meant to be the MOST saturated of the three and the shiniest, and
  // it was the least of both: it was pulled only 30-44% toward the tint from a pale
  // cream stone, so cobalt and black -- the two she named -- arrived as a dusty
  // blue-grey and a dusty grey. Mixing harder is not the answer, because at high
  // amounts all three stops converge on the one tint and the bead goes flat.
  //
  // So the bean stops borrowing the stone's cream ramp and gets its OWN, built out
  // of the tint itself: a light stop lifted toward white, the tint at full strength
  // in the middle, and a dark stop taken well down. Every part of it is the colour
  // and it still has a real light-to-dark form, which is what a polished bead
  // actually looks like. `bean` in the GLASS table is now unused by the bean and
  // kept only so the table still reads as one row per colour.
  const beanRamp = () => {
    const t = GLASS[glassColor].tint;
    const lift = v => Math.round(v + (255 - v) * 0.62);
    const deep = v => Math.round(v * 0.28);
    const d = t.map(deep);
    return { light:'rgb('+t.map(lift).join(',')+')',
             mid:  'rgb('+t.join(',')+')',
             dark: 'rgb('+d.join(',')+')',
             // the outline is the same dark, but half-strength: at full opacity it
             // reads as a drawn line round the stone rather than as the stone's own
             // shaded edge, and it makes the body polygon's facets into corners
             edge: 'rgba('+d.join(',')+',0.5)' };
  };

  let activeType = 'pebble';
  let obj = { x: 0, y: 0, vx: 0, vy: 0, spin: 0, jellySpin: 0, rollDistance: 0, nextCatch: 40, curlDir: 1, discSpin: 0, discAngVel: 0 };

  function resetObject(){
    obj.x = W / 2;
    obj.y = H / 2;
    obj.vx = 0;
    obj.vy = 0;
    obj.spin = Math.random() * Math.PI * 2;
    obj.jellySpin = Math.random() * Math.PI * 2;
    obj.rollDistance = 0;
    obj.nextCatch = 30 + Math.random() * 20;
    // which way this particular jellybean curls — its own off-centre mass always
    // drifts it toward the same side, but which side that is depends on which way
    // it happens to be lying, so it's randomised once per reset and then held
    // fixed, not re-rolled every frame
    obj.curlDir = Math.random() < 0.5 ? 1 : -1;
    obj.discSpin = Math.random() * Math.PI * 2;
    obj.discAngVel = 0;
  }

  // the colour swatches, each painted with that glass's own three stops so the
  // button looks like a bead of the thing it selects
  GLASS_ORDER.forEach((name) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'colBtn' + (name === glassColor ? ' active' : '');
    b.dataset.color = name; b.setAttribute('aria-label', name + ' glass');
    b.title = name;
    const g = GLASS[name].glass;
    b.style.background = 'radial-gradient(circle at 34% 30%, ' + g[0] + ', ' + g[1] + ' 55%, ' + g[2] + ')';
    b.addEventListener('click', () => {
      glassColor = name;
      writeStore('sagne-roller-glass', name);
      colorRow.querySelectorAll('.colBtn').forEach((x) => x.classList.toggle('active', x.dataset.color === name));
    });
    colorRow.appendChild(b);
  });

  objBtns.forEach((btn) => {
    btn.addEventListener('click', () => {
      objBtns.forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      activeType = btn.dataset.obj;
      resetObject();
    });
  });

  // speed slider: a multiplier on how strongly tilt translates into force.
  //
  // On its own that could not make anything SLIDE slower, which is what she asked
  // for, because it changed how hard the tray pushed and not how freely the tray
  // let go. Measured under a held full tilt: the pebble averaged 130px/s at the
  // bottom of the range against 146 in the middle -- eleven per cent, which is
  // nothing you could feel -- while its PEAKS moved by two and a half times. Once
  // anything was moving it careered about at much the same rate whatever the
  // slider said, because friction and the wall bounce were never in the slider's
  // hands at all.
  //
  // What actually makes a thing slide slowly is the surface it is sliding on. So
  // below the middle the tray gets draggier as well as gentler: the same friction
  // raised to a higher power, which is precisely what a shorter settling distance
  // is. At 100 the exponent is exactly 1 and nothing whatsoever changes -- from
  // the middle of the slider upward this is the feel she already approved, to the
  // pixel -- and the bottom of the range is now a genuine crawl rather than a
  // slightly softer version of the same skidding.
  const speedSlider = document.getElementById('speedSlider');
  let speedMult = speedSlider.value / 100;
  speedSlider.addEventListener('input', () => {
    speedMult = speedSlider.value / 100;
  });
  const effFriction = (f) => Math.pow(f, 1 / Math.max(0.10, Math.min(1, speedMult)));
  // ...and BELOW the middle the push is left alone. Reducing the shove as well as
  // raising the drag is what she felt on the machines: "maybe it hesitates before
  // it starts? but it doesn't roll slower in a noticeable way." Both halves of that
  // are the same cause. A gentler shove still has to overcome the same stiction, so
  // the low end read as a thing that would not set off; and because it then had a
  // short run before the wall, what travel there was looked much like any other
  // setting. Friction does not bite until something is already moving, so putting
  // the whole of the change there slows the TRAVEL without touching how readily it
  // breaks away. Above 100 nothing here applies -- the push still scales, the
  // friction still doesn't, and that half is the feel she approved, untouched.
  const pushMult = () => Math.max(1, speedMult);

  // tap/click the tray itself to recentre the object at rest, and
  // recalibrate — covers picking the phone back up and repropping it at
  // a different angle than when tilt was first enabled
  canvas.addEventListener('pointerdown', (e) => {
    resetObject();
    baseBeta = null;
    baseGamma = null;
    calibSamples = [];
  });

  // ---------- physics ----------
  const GRAVITY = 0.55; // px/frame^2 at full tilt
  const WALL_RESTITUTION = 0.42;
  // clamping exactly to the wall and reflecting velocity every frame turns out to have a
  // stable "microbounce" equilibrium: under steady tilt pressing into the wall, the energy
  // the bounce removes each frame exactly matches what that same frame's tilt adds back,
  // forever — the object looks completely frozen against the wall no matter how long the
  // tilt keeps being held. Nudging it a couple of pixels clear of the wall on contact means
  // a genuinely weak bounce doesn't immediately re-collide the very next frame, and treating
  // a very slow tap as a stop rather than a reflection (no sign to flip back and forth on)
  // keeps a real bounce from ever decaying into that endless tiny back-and-forth to begin
  // with — either way, tilt gets an uninterrupted frame to build the object back up to real
  // speed instead of it being trapped vibrating in place.
  const WALL_NUDGE = 1.4, WALL_SLEEP_V = 0.6;
  function wallBounce(v){ return Math.abs(v) < WALL_SLEEP_V ? 0 : -v * WALL_RESTITUTION; }

  function step(){
    tiltX += (rawTiltX - tiltX) * SMOOTHING;
    tiltY += (rawTiltY - tiltY) * SMOOTHING;

    const spec = OBJECTS[activeType];
    // a curling object doesn't get shoved straight downhill by tilt the way a ball
    // does — its own shape resists being dragged sideways off whatever circle it's already
    // rolling on. So tilt mostly speeds a curling object up or slows it down along
    // its current heading (the tangential component); the sideways component that
    // would drag it off its own arc is left out entirely below the slide threshold
    // — a steady tilt just keeps it looping the same circle rather than slowly
    // dragging that circle downhill — until the tilt gets steep enough to be a
    // proper slide, at which point it overpowers the curl and it starts sliding
    // like anything else would.
    const speedNow = Math.hypot(obj.vx, obj.vy);
    // right next to a wall, "current heading" isn't a meaningful thing to steer by any
    // more — the wall keeps forcibly flipping vx or vy every time it's crossed, so a
    // heading built from that is just noise, and steering tilt relative to noise is how
    // the object ends up stuck vibrating against the wall no matter how long tilt keeps
    // pushing it that way. Simple, direct, world-frame tilt near a wall means the same
    // tilt that pushed it into the wall reliably keeps pushing it there (predictable,
    // and the player can always just tilt a different way to pull it back off the wall)
    // rather than getting reinterpreted through a heading that's being scrambled by the
    // wall contact itself.
    const nearRight = obj.x >= W - spec.radius - 3, nearLeft = obj.x <= spec.radius + 3;
    const nearBottom = obj.y >= H - spec.radius - 3, nearTop = obj.y <= spec.radius + 3;
    const nearWall = nearRight || nearLeft || nearBottom || nearTop;
    if (spec.curlRate && speedNow > 2 && !nearWall) {
      const hx = obj.vx / speedNow, hy = obj.vy / speedNow;
      const tangent = tiltX * hx + tiltY * hy;
      const perp = -tiltX * hy + tiltY * hx;
      const tiltMag = Math.hypot(tiltX, tiltY);
      const slideAmt = Math.max(0, Math.min(1, (tiltMag - 0.35) / 0.4));
      obj.vx += (tangent * hx - perp * slideAmt * hy) * GRAVITY * pushMult();
      obj.vy += (tangent * hy + perp * slideAmt * hx) * GRAVITY * pushMult();
    } else {
      // not yet rolling fast enough to have a heading of its own — tilt just gets
      // it moving, the same as a standing start for any object. Resting against a
      // wall, the component of tilt still pressing further into it is dropped
      // rather than added and then reflected back out — a wall doesn't actually
      // bounce something it's being steadily pressed against, it just holds it
      // there, and reflecting that push every frame was exactly what set up the
      // endless tiny back-and-forth that reads as being stuck rolling on one
      // spot. Tilting any other way — including straight along the wall — is
      // completely unaffected, so the object can always still be steered off it.
      let tx = tiltX, ty = tiltY;
      if (nearRight && tx > 0) tx = 0;
      if (nearLeft && tx < 0) tx = 0;
      if (nearBottom && ty > 0) ty = 0;
      if (nearTop && ty < 0) ty = 0;
      obj.vx += tx * GRAVITY * pushMult();
      obj.vy += ty * GRAVITY * pushMult();
    }

    const speed = Math.hypot(obj.vx, obj.vy);
    const r = spec.radius;
    const fr = effFriction(spec.friction);

    if (spec.wobble) {
      obj.rollDistance += speed;
      if (obj.rollDistance > obj.nextCatch && speed > 0.15) {
        // the cap has come round to its wide point again — it catches
        // the surface, stealing a little forward momentum and kicking
        // the object slightly sideways, texture layered on top of the
        // steadier cone-curl below rather than the dominant effect now
        const perpX = -obj.vy / (speed || 1);
        const perpY = obj.vx / (speed || 1);
        const kick = (Math.random() * 2 - 1) * Math.min(1, speed / 5);
        obj.vx += perpX * kick * 0.6;
        obj.vy += perpY * kick * 0.6;
        obj.vx *= 0.88;
        obj.vy *= 0.88;
        // catches come slightly irregularly, not on a metronome
        obj.nextCatch = obj.rollDistance + spec.catchInterval * (0.75 + Math.random() * 0.5);
      }

      // the cone curl: a real tapered object rolling on its side doesn't
      // travel in a straight line even under a steady push — the narrow
      // end covers less ground per turn than the wide end, so the whole
      // object steadily arcs toward its own tip instead. Approximated
      // here by rotating the velocity vector a small amount every frame,
      // proportional to how far it's currently travelling — so it curls
      // more sharply the faster it rolls, and doesn't curl at all when
      // it's sitting still, the same way an actual rolling cone wouldn't.
      const curlSpeed = Math.hypot(obj.vx, obj.vy);
      // gated on the same speedNow>2 threshold the tangent/perp tilt split above uses —
      // below that, the object doesn't have an established heading of its own to curl
      // yet, and continuously rotating whatever tiny velocity it has left (right after a
      // wall bounce, or a near-stop) fights the plain tilt push hard enough to settle
      // into a stable near-zero "wobble" that never builds back up to real speed again,
      // however long the tilt keeps being held — reads as the object getting stuck
      // rolling in place on one spot instead of actually continuing across the tray.
      if (spec.curlRate && speedNow > 2 && curlSpeed > 0.01 && !nearWall) {
        // the jellybean isn't a clean, uniform taper, so it doesn't hold one steady
        // curl — whichever side is currently down leans it one way, and that flips
        // as it turns over, so the curl direction itself alternates in step with its
        // own uneven spin rather than just varying in strength. That's what actually
        // makes the path snake — a lopsided stone weaves side to side as it rolls,
        // it doesn't just trace one lazy circle. curlDir is a slight per-stone bias
        // on top (which lobe of the weave runs a little stronger/longer), not a fixed
        // one-way direction any more.
        // The weave's SPEED matters more than its strength, which is not
        // obvious. At sin(2 * jellySpin) the steering reversed about five and a
        // half times per crossing of the tray — fast enough that each swing was
        // undone by the next before the path could actually move, so the bean
        // wiggled on the spot and the path merely leaned. Halving that to
        // sin(jellySpin) is what makes the weave show up as travel rather than
        // as jitter; the strength (curlRate) then just sets how wide it is.
        // Measured across the tray: 0.0045 at the old speed wandered 29px and
        // reversed 0.1 times — a bent line. This wanders far more and genuinely
        // snakes. Pushed harder than this it stops being a weave and loops.
        // The constant lean is 0.05 rather than 0.25 for the same reason the
        // brief asked for: it should wobble side to side, not curve away while
        // doing it. Some rolls still drift and some hold the line, depending on
        // where in its tumble the bean starts — that is the stone's character,
        // not an error, and forcing every roll to stay centred would be a lie.
        const curlAmt = (activeType === 'jellybean')
          ? spec.curlRate * (0.05 * obj.curlDir + 1.15 * Math.sin(obj.jellySpin))
          : spec.curlRate * obj.curlDir;
        const rotAmt = curlAmt * curlSpeed;
        const cosA = Math.cos(rotAmt), sinA = Math.sin(rotAmt);
        const nvx = obj.vx * cosA - obj.vy * sinA;
        const nvy = obj.vx * sinA + obj.vy * cosA;
        obj.vx = nvx;
        obj.vy = nvy;
      }

      obj.vx *= fr;
      obj.vy *= fr;
    } else {
      obj.vx *= fr;
      obj.vy *= fr;
    }

    if (spec.spinOnImpact) {
      // spin decays on its own, same as translation does, just with its
      // own independent friction — nothing keeps it turning once contact
      // stops feeding it energy
      obj.discAngVel *= 0.965;
      obj.discSpin += obj.discAngVel;
    }

    const prevX = obj.x, prevY = obj.y;
    obj.x += obj.vx;
    obj.y += obj.vy;

    let clacked = false;
    let clackIntensity = 0;
    // A round pebble hitting a wall just bounces. An elongated stone almost
    // never hits square: the blow lands off its centre and slews it round.
    // How much depends on how far its long axis is from square to the wall —
    // nothing at all when it meets the wall end-on or flat-on, most at
    // forty-five degrees between, which is what sin(2 * angle) describes. The
    // first term is the glancing part, sliding along the wall as it hits, the
    // same effect the disc already gets; the second is the leverage of its
    // own length. Clamped, because a hard corner hit could otherwise spin it
    // like a propeller.
    // Note this is not just cosmetic: the bean's tumble angle is also what
    // drives its weave, so a knock sends it off the wall snaking a different
    // way, which is exactly what a real one does.
    // Nothing here fires when it is pinned — a trapped bean has no impact to
    // take, and its tumble is driven by distance actually moved, which is
    // zero when it cannot go anywhere.
    const beanSlew = (tangential, normal, sign) => Math.max(-0.6, Math.min(0.6,
      tangential * 0.05 + sign * Math.abs(normal) * Math.sin(2 * obj.jellySpin) * 0.07));

    if (obj.x < r) { obj.x = r + WALL_NUDGE; obj.vx = wallBounce(obj.vx); clacked = true; clackIntensity = Math.abs(obj.vx); if (spec.spinOnImpact) obj.discAngVel += obj.vy * 0.05; if (spec.slewOnImpact) obj.jellySpin += beanSlew(obj.vy, obj.vx, 1); }
    if (obj.x > W - r) { obj.x = W - r - WALL_NUDGE; obj.vx = wallBounce(obj.vx); clacked = true; clackIntensity = Math.abs(obj.vx); if (spec.spinOnImpact) obj.discAngVel -= obj.vy * 0.05; if (spec.slewOnImpact) obj.jellySpin += beanSlew(-obj.vy, obj.vx, -1); }
    if (obj.y < r) { obj.y = r + WALL_NUDGE; obj.vy = wallBounce(obj.vy); clacked = true; clackIntensity = Math.abs(obj.vy); if (spec.spinOnImpact) obj.discAngVel -= obj.vx * 0.05; if (spec.slewOnImpact) obj.jellySpin += beanSlew(-obj.vx, obj.vy, -1); }
    if (obj.y > H - r) { obj.y = H - r - WALL_NUDGE; obj.vy = wallBounce(obj.vy); clacked = true; clackIntensity = Math.abs(obj.vy); if (spec.spinOnImpact) obj.discAngVel += obj.vx * 0.05; if (spec.slewOnImpact) obj.jellySpin += beanSlew(obj.vx, obj.vy, 1); }

    // real rolling: how far it's actually MOVED this frame determines how
    // much it's turned, exactly like a wheel — measured after wall contact
    // is resolved, not the pre-collision velocity. An object pressed into
    // a wall or corner by steady tilt has nowhere left to roll, so it
    // should stop spinning too, the same way a real one pinned in place
    // would — using pre-collision speed here made it spin forever in a
    // corner even once it had visibly stopped moving.
    const rollStep = Math.hypot(obj.x - prevX, obj.y - prevY);
    obj.spin += rollStep / r;
    // the jellybean is elongated, not round — whichever cross-section is
    // currently down has a different effective rolling radius, so true
    // rolling-without-slipping means it spins faster over its narrow waist
    // and slower over its wide middle, twice per full turn, rather than
    // turning at one constant rate the way a circular pebble does
    const jellyRadFactor = 1 + 0.24 * Math.cos(2 * obj.jellySpin);
    obj.jellySpin += (rollStep / r) / jellyRadFactor;
    if (clacked && clackIntensity > 0.6) playClack(clackIntensity);

    setRumble(speed, activeType);
  }

  // ---------- rendering ----------
  const trayImg = new Image();
  let trayImgReady = false;
  trayImg.onload = () => { trayImgReady = true; };
  trayImg.src = 'tray-wood.jpg';

  function drawTray(){
    ctx.clearRect(0, 0, W, H);

    if (trayImgReady) {
      // cover-crop the photo into the square tray, clipped to its
      // rounded corners
      ctx.save();
      roundRect(ctx, 0, 0, W, H, 16);
      ctx.clip();
      const iw = trayImg.naturalWidth, ih = trayImg.naturalHeight;
      const scale = Math.max(W / iw, H / ih);
      const dw = iw * scale, dh = ih * scale;
      const dx = (W - dw) / 2, dy = (H - dh) / 2;
      ctx.filter = 'contrast(0.7) brightness(1.08) saturate(0.85)';
      ctx.drawImage(trayImg, dx, dy, dw, dh);
      ctx.filter = 'none';
      // a soft warm wash over the top mutes the grain lines further
      // without losing the texture entirely
      ctx.fillStyle = 'rgba(196,160,110,0.22)';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    } else {
      // brief fallback while the photo loads, so the tray isn't blank
      const grad = ctx.createLinearGradient(0, 0, W, H);
      grad.addColorStop(0, '#d4b483');
      grad.addColorStop(0.5, '#b08c56');
      grad.addColorStop(1, '#8a6a3c');
      ctx.fillStyle = grad;
      roundRect(ctx, 0, 0, W, H, 16);
      ctx.fill();
    }

    // raised inner lip / vignette
    const inner = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.25, W/2, H/2, Math.min(W,H)*0.62);
    inner.addColorStop(0, 'rgba(0,0,0,0)');
    inner.addColorStop(1, 'rgba(40,25,10,0.35)');
    ctx.fillStyle = inner;
    roundRect(ctx, 0, 0, W, H, 16);
    ctx.fill();

    ctx.strokeStyle = 'rgba(255,235,190,0.25)';
    ctx.lineWidth = 2;
    roundRect(ctx, 2, 2, W-4, H-4, 14);
    ctx.stroke();
  }

  function roundRect(c, x, y, w, h, r){
    c.beginPath();
    c.moveTo(x+r, y);
    c.arcTo(x+w, y, x+w, y+h, r);
    c.arcTo(x+w, y+h, x, y+h, r);
    c.arcTo(x, y+h, x, y, r);
    c.arcTo(x, y, x+w, y, r);
    c.closePath();
  }

  // small trapped air bubbles, fixed positions (not regenerated per
  // frame) so they read as part of the glass rather than noise
  const GLASS_BUBBLES = [
    [-0.35, -0.25, 0.10], [0.15, -0.35, 0.06], [0.40, 0.05, 0.08],
    [-0.10, 0.15, 0.05], [0.05, 0.40, 0.07], [-0.45, 0.20, 0.05],
    [0.30, -0.05, 0.04], [-0.20, -0.05, 0.04],
  ];

  function drawPebble(){
    const r = OBJECTS.pebble.radius;
    ctx.save();
    ctx.translate(obj.x, obj.y);
    // soft ink-wobble shadow
    ctx.beginPath();
    ctx.ellipse(1, r*0.6, r*0.95, r*0.4, 0, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(20,12,4,0.28)';
    ctx.fill();

    // sea-glass body — coke-bottle teal, translucent enough that the
    // wood grain underneath still shows faintly through it. Fewer,
    // sharper gradient bands than before, and a crisp point highlight
    // rather than a soft diffused one — reads as polished glass rather
    // than tumbled, frosted beach glass.
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(0, 0, r, r*0.82, 0, 0, Math.PI*2);
    ctx.clip();

    ctx.globalAlpha = 0.6;
    const g = glassBody(ctx.createRadialGradient(-r*0.25, -r*0.3, r*0.05, r*0.05, r*0.05, r*1.05));
    ctx.beginPath();
    ctx.ellipse(0, 0, r, r*0.82, 0, 0, Math.PI*2);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.globalAlpha = 1;

    // trapped bubbles — a thin ring rather than a soft blob, so they
    // read as tiny glass voids instead of frosted specks
    GLASS_BUBBLES.forEach(([bx, by, brad]) => {
      const x = bx*r, y = by*r*0.82, rad = brad*r;
      ctx.beginPath();
      ctx.arc(x, y, rad, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(255,255,255,0.18)';
      ctx.fill();
      ctx.lineWidth = Math.max(0.5, rad*0.25);
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(x - rad*0.3, y - rad*0.3, rad*0.3, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.fill();
    });

    // a small, crisp, near-opaque specular point — this is what actually
    // reads as "polished glass" rather than the wider soft glow alone
    ctx.beginPath();
    ctx.ellipse(-r*0.32, -r*0.38, r*0.14, r*0.1, -0.4, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.fill();

    // wider, softer glow around it for a bit of falloff
    const hi = ctx.createRadialGradient(-r*0.3, -r*0.35, 0, -r*0.3, -r*0.35, r*0.42);
    hi.addColorStop(0, 'rgba(255,255,255,0.4)');
    hi.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.beginPath();
    ctx.ellipse(-r*0.3, -r*0.35, r*0.42, r*0.34, 0, 0, Math.PI*2);
    ctx.fillStyle = hi;
    ctx.fill();
    ctx.restore();

    ctx.beginPath();
    ctx.ellipse(0, 0, r, r*0.82, 0, 0, Math.PI*2);
    ctx.strokeStyle = glassEdge();
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  }

  function drawDisc(){
    const r = OBJECTS.disc.radius;
    ctx.save();
    ctx.translate(obj.x, obj.y);
    // shadow
    ctx.beginPath();
    ctx.ellipse(1, r*0.15, r*1.02, r*0.9, 0, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(20,12,4,0.3)';
    ctx.fill();

    // flat stone disc, seen from directly above — nearly circular, with
    // a slightly uneven edge like a real water-worn stone rather than a
    // machined coin
    const body = tintStops(ctx.createRadialGradient(-r*0.25, -r*0.3, r*0.1, 0, 0, r),
                           ['#a8b0ae','#767f7c','#4c5250'], GLASS[glassColor].stone, stoneTintRgb());
    ctx.beginPath();
    ctx.ellipse(0, 0, r, r*0.94, 0, 0, Math.PI*2);
    ctx.fillStyle = body;
    ctx.fill();
    ctx.strokeStyle = 'rgba(30,34,32,0.5)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // this rotates with obj.discSpin — the one visible cue that the disc
    // is actually spinning in place, not just a plain circle that would
    // look identical at any rotation
    ctx.save();
    ctx.rotate(obj.discSpin);
    ctx.beginPath();
    ctx.ellipse(r*0.32, -r*0.1, r*0.22, r*0.14, 0, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.16)';
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-r*0.15, r*0.35);
    ctx.lineTo(r*0.1, r*0.45);
    ctx.strokeStyle = 'rgba(20,24,22,0.35)';
    ctx.lineWidth = Math.max(1, r*0.03);
    ctx.stroke();
    ctx.restore();

    // soft specular highlight, fixed relative to the light source, not
    // to the disc's own spin
    const hi = ctx.createRadialGradient(-r*0.3, -r*0.35, 0, -r*0.3, -r*0.35, r*0.5);
    hi.addColorStop(0, 'rgba(255,255,255,0.35)');
    hi.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.beginPath();
    ctx.ellipse(-r*0.3, -r*0.35, r*0.5, r*0.42, 0, 0, Math.PI*2);
    ctx.fillStyle = hi;
    ctx.fill();

    ctx.restore();
  }

  // ---------- jellybean stone silhouette ----------
  // An elongated stone, gently asymmetric — fuller toward one end,
  // tapering toward the other — with small hand-placed jitter baked into
  // the vertices (not recomputed per frame) so it reads as a drawn
  // silhouette rather than a perfect geometric capsule.
  const JELLYBEAN_BODY = [
    [0.00, -0.95], [0.28, -0.88], [0.48, -0.65], [0.58, -0.30],
    [0.60,  0.05], [0.52,  0.42], [0.36,  0.72], [0.14,  0.92],
    [-0.10, 0.95], [-0.32, 0.80], [-0.48, 0.52], [-0.56, 0.15],
    [-0.55, -0.25], [-0.44, -0.60], [-0.24, -0.85],
  ];

  function drawJellybean(){
    const r = OBJECTS.jellybean.radius;
    // its off-centre mass doesn't just bend the path (the curl, in step()) — it
    // physically rocks the stone as it turns over: taller and slower over its wide
    // middle, lower and quicker over its narrow ends, same phase as jellyRadFactor in
    // step() (twice per full turn) so the rock and the roll rate agree with each other
    // rather than the object visibly gliding smooth while the numbers say otherwise
    const wobblePhase = Math.cos(2 * obj.jellySpin);
    const bob = wobblePhase * r * 0.11;
    const squash = 1 + wobblePhase * 0.07;

    ctx.save();
    ctx.translate(obj.x, obj.y + bob);
    // shadow — stays screen-aligned and eases with the same rock, a touch bigger and
    // softer when the stone rises up onto its wide middle
    ctx.beginPath();
    ctx.ellipse(1, r*0.75 - bob*0.5, r*(0.68 + wobblePhase*0.05), r*0.28, 0, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(20,12,4,0.28)';
    ctx.fill();

    ctx.rotate(obj.jellySpin);
    ctx.scale(1, squash);

    const ramp = beanRamp();
    const body = ctx.createRadialGradient(-r*0.2, -r*0.35, r*0.1, 0, r*0.05, r*1.1);
    body.addColorStop(0, ramp.light);
    body.addColorStop(0.55, ramp.mid);
    body.addColorStop(1, ramp.dark);
    pathFromPoints(ctx, JELLYBEAN_BODY, 0, 0, r, r);
    ctx.fillStyle = body;
    ctx.fill();
    ctx.strokeStyle = ramp.edge;
    ctx.lineWidth = Math.max(1, r*0.025);
    ctx.stroke();

    // Gloss. A polished bead is read as shiny off three things at once and it
    // wants all three: a long soft sheen down its length, ONE small hard specular
    // where the light source is (the tight bright spot is what actually says
    // 'wet-looking' -- a big soft one only says 'pale'), and a bounce light
    // creeping along the shaded edge, which is light coming back up off the tray.
    // All clipped inside the body, so none of it can escape the stone's outline.
    ctx.save();
    pathFromPoints(ctx, JELLYBEAN_BODY, 0, 0, r, r);
    ctx.clip();

    ctx.strokeStyle = 'rgba(255,255,255,0.34)';
    ctx.lineWidth = r*0.16;
    ctx.beginPath();
    ctx.moveTo(-r*0.15, -r*0.6);
    ctx.quadraticCurveTo(-r*0.3, 0, -r*0.1, r*0.62);
    ctx.stroke();

    const hotSpot = ctx.createRadialGradient(-r*0.34, -r*0.42, 0, -r*0.34, -r*0.42, r*0.3);
    hotSpot.addColorStop(0,   'rgba(255,255,255,0.92)');
    hotSpot.addColorStop(0.4, 'rgba(255,255,255,0.42)');
    hotSpot.addColorStop(1,   'rgba(255,255,255,0)');
    ctx.fillStyle = hotSpot;
    ctx.beginPath();
    ctx.ellipse(-r*0.34, -r*0.42, r*0.3, r*0.2, -0.5, 0, Math.PI*2);
    ctx.fill();

    const bounce = ctx.createLinearGradient(0, r*0.15, 0, r*0.95);
    bounce.addColorStop(0, 'rgba(255,255,255,0)');
    bounce.addColorStop(1, 'rgba(255,255,255,0.3)');
    ctx.fillStyle = bounce;
    ctx.beginPath();
    ctx.ellipse(r*0.06, r*0.42, r*0.72, r*0.5, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();

    ctx.restore();
  }

  function pathFromPoints(c, pts, cx, cy, scaleX, scaleY){
    c.beginPath();
    const n = pts.length;
    for (let i = 0; i <= n; i++){
      const p = pts[i % n];
      const x = cx + p[0]*scaleX, y = cy + p[1]*scaleY;
      if (i === 0) c.moveTo(x, y);
      else {
        const prev = pts[(i-1) % n];
        const px = cx + prev[0]*scaleX, py = cy + prev[1]*scaleY;
        c.quadraticCurveTo(px + (x-px)*0.5*0, py + (y-py)*0.5*0, x, y);
        c.lineTo(x, y);
      }
    }
    c.closePath();
  }

  function render(){
    drawTray();
    if (activeType === 'disc') drawDisc();
    else if (activeType === 'jellybean') drawJellybean();
    else drawPebble();
  }

  function loop(){
    step();
    render();
    requestAnimationFrame(loop);
  }

  resize();
  resetObject();
  loop();
})();
</script>

<script>
(function(){
  var disc=document.getElementById('shelfdisc'), box=document.getElementById('plates');
  var rows=[].slice.call(box.querySelectorAll('.row'));
  function unroll(){ rows.forEach(function(r){ r.classList.remove('rolled'); }); }
  function shut(){ box.classList.remove('open'); disc.setAttribute('aria-expanded','false'); unroll(); }

  /* The twenty cards behind these plates are 6.2MB and not one of them can be
     seen until a plate is opened, but every page on the site was fetching the lot
     on load, ahead of the piece's own assets. Measured on bowl at 240px with a
     slow phone's CPU and connection, the bowl had still not appeared after 100
     seconds; held back, it is there in 12.
     They are held behind data-src rather than left to loading="lazy" alone,
     because that is a heuristic and not a promise -- the same page deferred them
     on a throttled connection and fetched all twenty on a fast one, since the
     browser's idea of "near the viewport" widens with bandwidth. This is the same
     on every machine. The attribute stays as a second line for anything that
     scrolls them into view another way. */
  var wired=false;
  function fetchCards(){
    if(wired) return; wired=true;
    [].slice.call(box.querySelectorAll('img[data-src]')).forEach(function(im){
      im.src=im.getAttribute('data-src'); im.removeAttribute('data-src');
    });
  }

  disc.addEventListener('click', function(ev){
    ev.stopPropagation();
    var open=box.classList.toggle('open');
    if(open) fetchCards();
    disc.setAttribute('aria-expanded', open?'true':'false');
    if(!open) unroll();
  });

  // Same bargain the case itself strikes: a mouse can hover, so a plate is a link
  // straight to its shelf. A thumb cannot, so the first tap on a plate rolls its
  // pieces out and only the second one goes to the shelf.
  var FINE=matchMedia('(hover: hover) and (pointer: fine)');
  rows.forEach(function(row){
    row.querySelector('.tag').addEventListener('click', function(ev){
      if(FINE.matches) return;
      if(row.classList.contains('rolled')) return;
      ev.preventDefault();
      unroll(); row.classList.add('rolled');
    });
  });

  document.addEventListener('click', function(ev){
    if(!box.contains(ev.target) && ev.target!==disc) shut();
  });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') shut(); });
})();
</script>
