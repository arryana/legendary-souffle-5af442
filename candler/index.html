<script>
/* ============================================================
   SAGNE CANDLE — physics + render
   Single self-contained file: double-click index.html, no
   server or build step required.

   One real per-mode input drives everything else.
   Passive mode:  wind  -> flame height/lean/flicker + burn rate
   Timer mode:    size  -> duration (candle geometry), wind disabled

   Timer mode seeds one pin automatically. To add more (up to MAX_PINS),
   click anywhere on the candle itself — a pin appears right there and
   the icon picker pops up next to it so you can label it (or click
   elsewhere to skip). Dragging any pin up or down the candle changes
   how long it waits before ringing — its height IS its time, with a
   small floating tooltip confirming the wait live as you drag (and on
   hover, once it's placed). Clicking an existing pin without dragging
   reopens the icon picker for just that pin. Each pin fires
   independently as the candle burns past it — firing one doesn't
   stop the others, and you can keep adding pins (up to the limit)
   any time while the candle burns.
   ============================================================ */

// ---------- DOM ----------
const sizeSlider     = document.getElementById('sizeSlider');
const sizeCtrl       = document.getElementById('sizeCtrl');
const pillarCheck    = document.getElementById('pillarCheck');
const pillarSlider   = document.getElementById('pillarSlider');
const timerCheck     = document.getElementById('timerCheck');
const repeatCheck    = document.getElementById('repeatCheck');
const repeatCtrl     = document.getElementById('repeatCtrl');
const soundCheck     = document.getElementById('soundCheck');
const pitchSlider    = document.getElementById('pitchSlider');
const iconPopup      = document.getElementById('iconPopup');
const pinList        = document.getElementById('pinList');
const candleBody     = document.getElementById('candleBody');
const flameGroup     = document.getElementById('flameGroup');
const flameClipRect  = document.getElementById('flameClipRect');
flameGroup.setAttribute('clip-path', 'url(#flameClip)');
// purely decorative — its halo/glow shapes are large and sit above the pins in
// z-order, so without this they silently swallow clicks meant for any pin
// near the flame instead of ever reaching it
flameGroup.style.pointerEvents = 'none';
const pinsGroup      = document.getElementById('pinsGroup');
const glowCircle     = document.getElementById('glowCircle');
const cupImg         = document.getElementById('cupImg');
const lipImg         = document.getElementById('lipImg');
// the two stands, each a whole object — see updateStandForMode()
const shortStand     = document.getElementById('shortStand');
const pillarStand    = document.getElementById('pillarStand');
const readout        = document.getElementById('readout');
const pinTooltip     = document.getElementById('pinTooltip');
const scene          = document.getElementById('scene');

function syncFill(el) {
  const pct = ((el.value - el.min) / (el.max - el.min)) * 100;
  el.style.setProperty('--fill', pct + '%');
}
[sizeSlider, pitchSlider, pillarSlider].forEach(syncFill);

// ---------- geometry constants ----------
const CENTER_X = 190;   // horizontal center of the whole scene
// the candle sits flat and deep enough inside the cup that its whole
// bottom edge is covered by the real front-lip photo layer (#lipImg,
// drawn on top of it) — that layer's true shape is what does the
// curve-matching, not the candle itself.
const CUP_BASE_Y = 495;
// where a fallen pin actually comes to rest: the visible copper floor of
// the saucer/tray, measured from its own photo. This sits well below
// CUP_BASE_Y (the candle's base, up at the cup) because the real
// photographed stand has the tray as its own separate layer further
// down — unlike the old flat vector stand where the plate was right
// under the candle. Pillar mode has no separate tray (the candle sits
// straight on the wide plate), so it still lands just under its own base.
const CUP_TRAY_LANDING_Y = 569;
// how far a fallen pin can sit from centre and still be on the visible
// copper floor at that landing height, measured from the saucer's own
// photo — past this it'd be sitting out over the rim or off the tray
// entirely, which is where a wide enough candle plus several already-
// landed pins spreading out could otherwise push it.
const CUP_TRAY_SAFE_HALF_WIDTH = 90;
// same idea for the wide pillar plate, measured from its own photo — a wide
// pillar candle's own insertion point already sits close to this edge, so
// without a floor here the "flat lying" pin overhangs the plate's actual
// (elliptical, tapering) visible surface and reads as dangling off it.
const PILLAR_PLATE_SAFE_HALF_WIDTH = 99;
// the pillar plate's own front-rim curve, measured off candlerstand-pillar.png
// itself rather than guessed: in that picture the plate's widest row sits 42px
// down from the top with its rim spanning 234.5px either side of centre, and
// it is drawn at 0.495 scale from x=12.3, y=421.9 — which puts the rim ellipse
// exactly here. The pillar candle's base follows this arc (see waxBottomPath())
// instead of a flat line, so it reads as resting ON the curved plate rather
// than cutting straight through it. Re-measure these if the stand picture or
// its placement ever changes.
//
// That 0.495 is as large as the stand can be drawn: bigger, and the candle
// standing on the plate rises far enough that its flame leaves the top of the
// frame. Shortening the stand's neck is what bought the extra size — see the
// note on PILLAR_MAX_DAYS.
const PLATE_RIM_CX = 190, PLATE_RIM_CY = 443.5, PLATE_RIM_RX = 124.1, PLATE_RIM_RY = 22.2;
// the candle sits toward the back of the plate rather than right at its
// front edge, so a visible strip of plate shows in front of it — same
// curve as the plate's true rim, just lifted.
const PILLAR_LIFT = 10;
const PILLAR_RIM_CY = PLATE_RIM_CY - PILLAR_LIFT;
const PILLAR_BASE_Y = PILLAR_RIM_CY + PLATE_RIM_RY; // the arc's own lowest (front-center) point
function baseY() { return state.pillarMode ? PILLAR_BASE_Y : CUP_BASE_Y; }
const CANDLE_HEIGHT = 260;   // fixed — only thickness (width) varies with size now
const HALF_W_MIN = 26;
const HALF_W_MAX = 60;  // widened so a 24-hour candle looks like it could plausibly hold that much wax
// ---------- real-world burn timing ----------
// A real candle burns anywhere from tens of minutes (a thin taper) up to
// a full day (a wide, dense pillar or emergency candle). These two
// numbers are the single source of truth for "how long a candle
// actually lasts" — change them to retune the whole app.
const MIN_BURN_MINUTES = 30;    // smallest candle, full burn-down
const MAX_BURN_MINUTES = 1440;  // largest candle, full burn-down (24 hours)

// ---------- big pillar mode: an optional second scale, well beyond the
// ordinary candle range, where the candle burns for days rather than
// hours. Uses the exact same "duration scales with wax volume" physics
// as the normal size slider — just extended along the same real rate
// rather than a different formula — but is taller as well as thicker,
// since simply widening at the same fixed height would make a 7-day
// candle wider than it is tall, a squat drum rather than a pillar.
const PILLAR_HEIGHT = 380;
const PILLAR_MIN_DAYS = 2;
// capped at the widest candle the real plate can actually hold. The
// burn-time-from-wax-volume maths gives a 6-day pillar a half-width of 112.6
// and a 7-day one 121.3; the plate's rim measures 116.1, so 6 sits on it and 7
// would hang over the edge resting on nothing.
//
// 116.1 is itself the most plate obtainable here, and it took shortening the
// stand's neck to get it: the stand's width is what limits how large it can be
// drawn, but its HEIGHT is what pushes the candle (and its flame) out of the
// top of the frame. Squeezing 40px out of the plain shaft above and below the
// collar ring — the ring itself untouched, since it is the only detail there —
// made the stand shorter without making it narrower, so it could be drawn
// bigger and the plate grew from 105.5 to 116.1. That bought exactly one more
// day. Reaching 7 needs a taller frame or a narrower pillar, not more neck.
// Changing this number means changing the slider's max attribute to match.
const PILLAR_MAX_DAYS = 7;
// once this fraction of the pillar's total burn has elapsed, the flame
// has sunk below the rim and the hollow-well rendering takes over
const HOLLOW_START_FRACTION = 0.14; // roughly "day 1" of a 7-day burn
function pillarHalfWidth(days) {
  const targetMinutes = days * 24 * 60;
  const minVol = CANDLE_HEIGHT * HALF_W_MIN * HALF_W_MIN;
  const maxVol = CANDLE_HEIGHT * HALF_W_MAX * HALF_W_MAX;
  const rate = (MAX_BURN_MINUTES - MIN_BURN_MINUTES) / (maxVol - minVol); // minutes per volume unit, same real rate as the small-candle range
  const targetVol = minVol + (targetMinutes - MIN_BURN_MINUTES) / rate;
  return Math.sqrt(targetVol / PILLAR_HEIGHT);
}
function smoothstep(edge0, edge1, x) {
  const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
  return t * t * (3 - 2 * t);
}

// ---------- state ----------
let state = {
  size: 1.0,          // 0..1, from sizeSlider (dual meaning: thickness OR duration)
  pillarMode: false,  // when true, overrides size entirely — a big pillar burning over days
  pillarDays: 4,       // 2..7, from pillarSlider
  wind: 0.15,          // 0..1, passive mode only
  timerMode: false,
  repeat: false,
  waxFraction: 1.0,    // 1 = full candle, 0 = burned out
  lightedAt: Date.now(), // wall-clock moment this burn started, so progress survives closing the tab
  flicker: 0,
  lean: 0,
  extinguished: false,
  pins: [],             // up to MAX_PINS: { fraction, icon, fallen, firing, el }
  landedSlots: 0,        // how many pins have already come to rest on the plate, for spacing
  repeatTimeoutId: null,
  pitch: 1.0,            // multiplier on the pin-ring's base frequency, adjustable via pitchSlider
};

const REPEAT_INTERVAL_MS = 60_000; // snooze: real 1 minute between chimes
const MAX_PINS = 5;

// ---------- flame turbulence ----------
// Real flame movement is chaotic, not periodic — air currents nudge it
// unevenly and it never quite repeats itself. Stacking a few sine waves
// (the original approach) still has an underlying rhythm you can feel
// after a few cycles, since the frequencies are fixed and their sum
// eventually re-syncs. Instead, each channel below wanders toward a
// randomly-chosen target and eases toward it continuously; when it gets
// close (or a random timer runs out), it picks a new target. That keeps
// the motion smooth (nothing snaps) while staying genuinely non-repeating.
function makeTurbChannel(period) { return { v: 0, target: 0, timer: Math.random() * period }; }
function stepTurb(ch, dt, range, minPeriod, maxPeriod, smooth) {
  ch.timer -= dt;
  if (ch.timer <= 0) {
    ch.target = (Math.random() * 2 - 1) * range;
    ch.timer = minPeriod + Math.random() * (maxPeriod - minPeriod);
  }
  ch.v += (ch.target - ch.v) * Math.min(1, dt * smooth);
}
const turb = {
  lean:   makeTurbChannel(900),   // slow overall drift, side to side
  height: makeTurbChannel(350),   // flame stretching/shrinking
  tip:    makeTurbChannel(260),   // tip flicking independently
  edgeL:  makeTurbChannel(300),   // left silhouette wobble
  edgeR:  makeTurbChannel(320),   // right silhouette wobble
};
function stepFlameTurbulence(dt, burnWind) {
  const speed = 1 + burnWind * 1.6; // wind makes it more restless, not just bigger
  stepTurb(turb.lean,   dt, 1,    700,  1600, 0.0045 * speed);
  stepTurb(turb.height, dt, 1,    260,  620,  0.008  * speed);
  stepTurb(turb.tip,    dt, 1,    180,  460,  0.011  * speed);
  stepTurb(turb.edgeL,  dt, 1,    220,  520,  0.010  * speed);
  stepTurb(turb.edgeR,  dt, 1,    240,  540,  0.010  * speed);
}

// ---------- derived geometry ----------
function candleHeight(sizeVal) {
  // height no longer varies with size — only thickness does. A thin
  // taper burning fast next to a thick pillar burning slow, both the
  // same height, is a more honest read of "faster" than just "smaller
  // overall" was. Pillar mode is taller still — see the note above.
  if (state.pillarMode) return PILLAR_HEIGHT;
  return CANDLE_HEIGHT;
}
function candleHalfWidth(sizeVal) {
  if (state.pillarMode) return pillarHalfWidth(state.pillarDays);
  return HALF_W_MIN + sizeVal * (HALF_W_MAX - HALF_W_MIN);
}
// Burn duration scales with wax volume (height * width^2). Height is now
// fixed, so duration is really just a function of thickness — a thinner
// candle has less wax across its cross-section and burns faster, the
// same physical logic as before, just no longer also shrinking overall.
// Returns real milliseconds, linearly interpolated between
// MIN_BURN_MINUTES and MAX_BURN_MINUTES by normalized wax volume.
// Pillar mode bypasses all of this and returns the selected day count
// directly — it's the thing being solved for, not derived.
function burnDurationMs(sizeVal) {
  if (state.pillarMode) return state.pillarDays * 24 * 60 * 60_000;
  const h = candleHeight(sizeVal);
  const w = candleHalfWidth(sizeVal);
  const volume = h * w * w;
  const minVol = CANDLE_HEIGHT * HALF_W_MIN * HALF_W_MIN;
  const maxVol = CANDLE_HEIGHT * HALF_W_MAX * HALF_W_MAX;
  const t = (volume - minVol) / (maxVol - minVol);
  const minutes = MIN_BURN_MINUTES + t * (MAX_BURN_MINUTES - MIN_BURN_MINUTES);
  return minutes * 60_000;
}

// ---------- audio: synthesized metallic pin-ring, no external asset ----------
let audioCtx = null;
function ring() {
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  const now = audioCtx.currentTime;
  // a small cluster of inharmonic partials = "metallic" character,
  // fast attack, slow-ish decay = "ring"
  const partials = [1, 2.41, 3.88, 5.13];
  partials.forEach((mult, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 1046 * mult * state.pitch; // C6-ish fundamental, adjustable
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.22 / (i + 1), now + 0.005);
    // a longer, gentler taper instead of a hard cutoff — the ring still
    // announces itself clearly, then fades out over a few seconds rather
    // than stopping abruptly
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 3.2 - i * 0.3);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 3.4);
  });
}

// when two pins land within the same instant, two full rings starting at
// the exact same moment just blur into one thicker tone rather than
// reading as "two things happened" — so landings are coalesced over a
// brief window, and two-or-more within it get a deliberate rapid double
// ping instead, spaced far enough apart to actually be heard as two
let pinLandings = [];
let pinLandTimer = null;
const SIMULTANEOUS_LANDING_MS = 80;
function pinLanded() {
  pinLandings.push(Date.now());
  clearTimeout(pinLandTimer);
  pinLandTimer = setTimeout(() => {
    const count = pinLandings.length;
    pinLandings = [];
    ring();
    if (count > 1) setTimeout(ring, 150);
  }, SIMULTANEOUS_LANDING_MS);
}

// tiny extinguish sound — a short filtered noise burst, not a bell.
// "Tiny fssst sound — it's just the visible end of the candle"
function fssst() {
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  const now = audioCtx.currentTime;
  const bufferSize = audioCtx.sampleRate * 0.25;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
  }
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'highpass';
  filter.frequency.value = 2200;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.12, now);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.25);
  noise.connect(filter).connect(gain).connect(audioCtx.destination);
  noise.start(now);
}

// ---------- ambient candle crackle (synthesized, either mode) ----------
let crackleOn = false;
let crackleTimeoutId = null;
function scheduleCrackle() {
  if (!crackleOn || state.extinguished) return;
  // timer mode locks burn rate to the candle's true, unaided speed —
  // the crackle should reflect that same still-air pace, not whatever
  // the wind slider happened to be left at before switching modes
  const wind = state.timerMode ? 0 : state.wind;
  const gapMs = 700 - wind * 400 + Math.random() * 500;
  crackleTimeoutId = setTimeout(() => {
    pop(0.03 + wind * 0.05);
    scheduleCrackle();
  }, gapMs);
}
function pop(volume) {
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  const now = audioCtx.currentTime;
  const len = audioCtx.sampleRate * 0.05;
  const buffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 1200 + Math.random() * 1800;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(volume, now);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.05);
  noise.connect(filter).connect(gain).connect(audioCtx.destination);
  noise.start(now);
}
soundCheck.addEventListener('change', (e) => {
  crackleOn = e.target.checked;
  clearTimeout(crackleTimeoutId);
  if (crackleOn) scheduleCrackle();
});

// ---------- timer icon picker ----------
// Clicking any pin (new or existing) without dragging it opens this popup
// right next to that pin — wherever it actually is on the candle — so
// there's never any doubt about which pin's icon you're setting.
let activePinIconTarget = null;

function positionIconPopup(anchorRect) {
  const popupW = iconPopup.offsetWidth || 220;
  const popupH = iconPopup.offsetHeight || 90;
  let left = anchorRect.left + anchorRect.width / 2 - popupW / 2;
  let top = anchorRect.top - popupH - 12;
  left = Math.max(8, Math.min(left, window.innerWidth - popupW - 8));
  top = Math.max(8, top);
  iconPopup.style.left = `${left}px`;
  iconPopup.style.top = `${top}px`;
}

iconPopup.querySelectorAll('.icon-option').forEach((btn) => {
  btn.addEventListener('click', () => {
    const icon = btn.dataset.icon || null;
    if (activePinIconTarget) {
      setPinIcon(activePinIconTarget, icon);
      activePinIconTarget = null;
    }
    iconPopup.classList.remove('open');
  });
});

// Updates an already-placed pin's icon in place, without touching its
// position, fall state, or anything else about it.
function setPinIcon(pin, icon) {
  pin.icon = icon;
  const plateFaceX = pin.el.getAttribute('data-plate-x');
  const pinY = pin.el.getAttribute('data-anchor-y');
  const existingText = pin.el.querySelector('text');
  if (existingText) existingText.remove();
  if (icon) {
    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', plateFaceX);
    text.setAttribute('y', pinY);
    text.setAttribute('font-size', '19');
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('dominant-baseline', 'central');
    text.style.userSelect = 'none';
    text.textContent = icon;
    pin.el.appendChild(text);
  }
  renderPinList();
  saveState();
}
document.addEventListener('click', (e) => {
  if (iconPopup.classList.contains('open') && !iconPopup.contains(e.target)) {
    iconPopup.classList.remove('open');
    activePinIconTarget = null;
  }
});

// ---------- status readout ----------
function formatDuration(ms) {
  if (ms < 60_000) {
    return `${Math.max(0, Math.round(ms / 1000))}s`;
  }
  const totalMinutes = Math.max(0, Math.round(ms / 60_000));
  const d = Math.floor(totalMinutes / 1440);
  const h = Math.floor((totalMinutes % 1440) / 60);
  const m = totalMinutes % 60;
  if (d > 0) {
    if (h === 0) return `${d}d`;
    return `${d}d ${h}h`;
  }
  if (h === 0) return `${m}m`;
  if (m === 0) return `${h}h`;
  return `${h}h ${m}m`;
}
function updateReadout() {
  const total = burnDurationMs(state.size);
  const remaining = total * Math.max(state.waxFraction, 0);
  if (state.extinguished) {
    readout.textContent = 'Burned out';
  } else if (state.timerMode && state.pins.length) {
    const next = state.pins.find((p) => !p.fallen);
    if (next) {
      const alarmMs = Math.max(0, state.waxFraction - next.fraction) * total;
      const prefix = next.icon ? `${next.icon} ` : '';
      readout.textContent = `${prefix}Next alarm in ${formatDuration(alarmMs)} · candle burns out in ${formatDuration(remaining)}`;
    } else {
      readout.textContent = '';
    }
  } else {
    readout.textContent = `${formatDuration(remaining)} remaining of ${formatDuration(total)}`;
  }
  renderPinList();
}

// ---------- floating time tooltip (shown while dragging or hovering a pin) ----------
function showPinTooltip(clientX, clientY, text) {
  pinTooltip.textContent = text;
  pinTooltip.style.transform = `translate(${clientX}px, ${clientY}px) translate(-50%, calc(-100% - 10px))`;
  pinTooltip.classList.add('visible');
}
function hidePinTooltip() {
  pinTooltip.classList.remove('visible');
}

// ---------- pin list (the little chips under the panel) ----------
// Index of the chip currently being typed into, or null. The list re-renders
// about once a second as the candle burns; without this guard that redraw
// replaces the input under the cursor and eats the digits as they are typed.
let editingPinIdx = null;

function renderPinList() {
  if (editingPinIdx !== null) return;
  const total = burnDurationMs(state.size);
  pinList.innerHTML = state.pins.map((pin, i) => {
    const icon = pin.icon || '\u{1F4CC}';
    if (pin.fallen) {
      return `<span class="pin-chip fallen" data-snooze="${i}" aria-label="Rung. Tap to ring again in ${SNOOZE_MINUTES} minutes" title="Rung — tap to ring again in ${SNOOZE_MINUTES}m">${icon}</span>`;
    }
    const remainMs = Math.max(0, state.waxFraction - pin.fraction) * total;
    const t = formatDuration(remainMs);
    return `<span class="pin-chip">${icon} <input class="pin-time" type="text" spellcheck="false"
        data-time="${i}" value="${t}" aria-label="Rings in ${t}. Type a new time."
        title="Type a time — 25m, 1h30, 2d">` +
      `<button type="button" data-remove="${i}" aria-label="Remove pin">\u2715</button></span>`;
  }).join('');
}

// Accepts what someone would actually type: 25m, 90, 1h, 1h30, 1h30m, 2d, 45s.
// A bare number means minutes, which is the overwhelmingly common case.
function parsePinDuration(text) {
  const t = String(text).trim().toLowerCase().replace(/\s+/g, '');
  if (!t) return null;
  if (/^\d+(\.\d+)?$/.test(t)) return parseFloat(t) * 60_000;
  const unit = { d: 86_400_000, h: 3_600_000, m: 60_000, s: 1000 };
  const re = /(\d+(?:\.\d+)?)(d|h|m|s)/g;
  let match, ms = 0, any = false, consumed = 0;
  while ((match = re.exec(t))) {
    any = true; consumed = re.lastIndex;
    ms += parseFloat(match[1]) * unit[match[2]];
  }
  // a trailing bare number carries the next unit down, so "1h30" is 90 minutes
  const tail = t.slice(consumed);
  if (/^\d+$/.test(tail)) {
    const last = t[consumed - 1];
    ms += parseFloat(tail) * (last === 'd' ? 3_600_000 : last === 'h' ? 60_000 : 1000);
    any = true;
  }
  return any ? ms : null;
}

// Typing a time runs the chip's own sum backwards: the chip shows
// (waxFraction - pin.fraction) * total, so a wanted wait gives the height the
// pin has to move to. clampPinFraction then applies the same limits dragging
// obeys — a pin cannot sit above the wax that is left, or nearer than the
// minimum wait — so an impossible request lands on the closest honest answer
// rather than being accepted and quietly lied about.
function commitPinTime(idx, text) {
  editingPinIdx = null;
  const pin = state.pins[idx];
  if (!pin || pin.fallen) { renderPinList(); return; }
  const ms = parsePinDuration(text);
  if (ms === null) { renderPinList(); return; }
  const total = burnDurationMs(state.size);
  movePinTo(pin, clampPinFraction(state.waxFraction - ms / total, pin));
  renderPinList();
  saveState();
}

pinList.addEventListener('focusin', (e) => {
  const idx = e.target.getAttribute && e.target.getAttribute('data-time');
  if (idx === null || idx === undefined) return;
  editingPinIdx = parseInt(idx, 10);
  e.target.select();
});
pinList.addEventListener('focusout', (e) => {
  const idx = e.target.getAttribute && e.target.getAttribute('data-time');
  if (idx === null || idx === undefined) return;
  commitPinTime(parseInt(idx, 10), e.target.value);
});
pinList.addEventListener('keydown', (e) => {
  const idx = e.target.getAttribute && e.target.getAttribute('data-time');
  if (idx === null || idx === undefined) return;
  if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); }
  else if (e.key === 'Escape') { e.preventDefault(); editingPinIdx = null; renderPinList(); }
});
pinList.addEventListener('click', (e) => {
  const removeIdx = e.target.getAttribute('data-remove');
  if (removeIdx !== null) { removePin(parseInt(removeIdx, 10)); return; }
  const snoozeIdx = e.target.getAttribute('data-snooze');
  if (snoozeIdx !== null) snoozePin(parseInt(snoozeIdx, 10));
});

// ---------- pins: geometry + lifecycle ----------
// A pin's on-screen height directly IS its wait time: BASE_Y is the plate,
// and pin.fraction (0..1) is how much wax will be left when it fires — so
// higher on the candle = fires sooner, lower = fires later. Dragging a pin
// up/down just recomputes fraction from its new height.
// the real photographed pin (candlerpin-head.png): a hammered-brass ball
// head on a dark iron shaft, pre-rotated horizontal (tip on the left,
// head on the right). These are its own tip/head reference points,
// measured directly from the cutout, in the source image's own pixels.
const PIN_IMG_W = 290, PIN_IMG_H = 95;
const PIN_IMG_TIP_X = 5, PIN_IMG_HEAD_X = 240, PIN_IMG_CENTER_Y = 47.5;

function pinMarkup(pin, pinY, fullH, halfW) {
  // sized up from the original (larger head + thicker rod) so a pin is
  // easier to see, aim for, and grab — especially with a finger on a
  // small phone screen
  const side = pin.side || 1; // 1 = right, -1 = left — alternates per pin so a row of pins doesn't collide on one face
  const insertionDepth = 20;
  const protrusion = 37;
  const surfaceX = CENTER_X + side * halfW;
  const plateFaceX = surfaceX + side * protrusion;

  // build the image as if it were always the side=1 case (tip on the
  // candle's right face, head pointing right) — a left-side pin then
  // just mirrors that same rendering around the candle's own centreline,
  // which flips both its position AND its facing correctly in one move.
  // The icon text is kept out of that mirror (mirrored emoji look wrong)
  // and placed separately at the real, unmirrored plateFaceX.
  const canonicalSurfaceX = CENTER_X + halfW;
  const canonicalTipX = canonicalSurfaceX - insertionDepth;
  const scale = (protrusion + insertionDepth) / (PIN_IMG_HEAD_X - PIN_IMG_TIP_X);
  const renderW = PIN_IMG_W * scale;
  const renderH = PIN_IMG_H * scale;
  const imgX = canonicalTipX - PIN_IMG_TIP_X * scale;
  const imgY = pinY - PIN_IMG_CENTER_Y * scale;
  const mirror = side === -1 ? ` transform="translate(${2 * CENTER_X},0) scale(-1,1)"` : '';

  const html = `
    <image href="candlerpin-head.png" x="${imgX.toFixed(1)}" y="${imgY.toFixed(1)}"
           width="${renderW.toFixed(1)}" height="${renderH.toFixed(1)}"${mirror}/>
    ${pin.icon ? `<text x="${plateFaceX}" y="${pinY}" font-size="19" text-anchor="middle" dominant-baseline="central" style="user-select:none">${pin.icon}</text>` : ''}
  `;
  return { html, surfaceX, plateFaceX };
}

function createPinElement(pin, fullH, halfW) {
  const pinY = baseY() - fullH * pin.fraction;
  const { html, surfaceX, plateFaceX } = pinMarkup(pin, pinY, fullH, halfW);
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.setAttribute('data-anchor-x', surfaceX);
  g.setAttribute('data-anchor-y', pinY);
  g.setAttribute('data-plate-x', plateFaceX);
  g.style.cursor = 'grab';
  g.innerHTML = html;
  return g;
}

// Rewrites an existing pin's element at a new fraction (used while
// dragging) — same look, new height, nothing else about the pin touched.
function movePinTo(pin, fraction) {
  pin.fraction = fraction;
  const fullH = candleHeight(state.size);
  const halfW = candleHalfWidth(state.size);
  const pinY = baseY() - fullH * fraction;
  const { html, surfaceX, plateFaceX } = pinMarkup(pin, pinY, fullH, halfW);
  pin.el.setAttribute('data-anchor-x', surfaceX);
  pin.el.setAttribute('data-anchor-y', pinY);
  pin.el.setAttribute('data-plate-x', plateFaceX);
  pin.el.style.transform = '';
  pin.el.innerHTML = html;
}

// The valid range a pin's fraction can sit in right now: never above the
// current wax top (nothing to stick into up there), never so high it'd
// ring in less than a minute, never so low that ringing it would leave
// less than ALARM_MIN_REMAINING_MINUTES of candle left, and never so low
// that the pin's head would sit down behind the stand's rim where it's
// hard to see or grab — that's a visual floor, independent of (and
// usually stricter than) the timing one above it.
const ALARM_MIN_WAIT_MINUTES = 1;
const ALARM_MIN_REMAINING_MINUTES = 2;
const PIN_MIN_RIM_CLEARANCE = 51; // viewBox units above the candle's base — a little taller now that the pin itself is bigger
function fractionBounds() {
  const totalMinutes = burnDurationMs(state.size) / 60_000;
  const minWaitFraction = ALARM_MIN_WAIT_MINUTES / totalMinutes;
  const minRemainingFraction = ALARM_MIN_REMAINING_MINUTES / totalMinutes;
  const minClearanceFraction = PIN_MIN_RIM_CLEARANCE / candleHeight(state.size);
  let maxFraction = Math.min(state.waxFraction, state.waxFraction - minWaitFraction);
  let minFraction = Math.max(minRemainingFraction, minClearanceFraction);
  if (maxFraction < minFraction) maxFraction = minFraction;
  return { minFraction: Math.max(0.001, minFraction), maxFraction: Math.max(0.001, maxFraction) };
}

// Minimum gap (in wax-fraction units) kept between two pins so they never
// land on, or get dragged onto, the exact same spot on the candle.
const MIN_PIN_GAP = 0.035;

function clampPinFraction(candidate, pin) {
  const { minFraction, maxFraction } = fractionBounds();
  let f = Math.min(maxFraction, Math.max(minFraction, candidate));
  const others = state.pins.filter((p) => p !== pin && !p.fallen);
  for (const other of others) {
    if (Math.abs(f - other.fraction) < MIN_PIN_GAP) {
      f = f >= other.fraction
        ? Math.min(maxFraction, other.fraction + MIN_PIN_GAP)
        : Math.max(minFraction, other.fraction - MIN_PIN_GAP);
    }
  }
  return f;
}

// A sensible starting height for a brand-new pin, close to the shortest
// allowed wait — you then drag it to wherever you actually want it.
function defaultPinFraction() {
  const { minFraction, maxFraction } = fractionBounds();
  let fraction = Math.min(maxFraction, maxFraction - (maxFraction - minFraction) * 0.1);
  const active = state.pins.filter((p) => !p.fallen);
  while (fraction > minFraction && active.some((p) => Math.abs(p.fraction - fraction) < MIN_PIN_GAP)) {
    fraction -= MIN_PIN_GAP;
  }
  return Math.max(minFraction, fraction);
}

function waitMinutesFor(fraction) {
  const totalMinutes = burnDurationMs(state.size) / 60_000;
  return Math.max(0, state.waxFraction - fraction) * totalMinutes;
}

let draggingPin = null;

function attachPinInteractions(pin) {
  pin.el.addEventListener('pointerdown', (e) => {
    if (pin.fallen || pin.firing) return;
    e.preventDefault();
    e.stopPropagation();
    pin.el.setPointerCapture(e.pointerId);
    pin.el.style.cursor = 'grabbing';
    pin._moved = false;
    pin._dragStartClientY = e.clientY;
    pin._dragStartFraction = pin.fraction;
    draggingPin = pin;
  });

  pin.el.addEventListener('pointermove', (e) => {
    if (pin.fallen) return;
    if (draggingPin === pin) {
      if (Math.abs(e.clientY - pin._dragStartClientY) > 3) pin._moved = true;
      const rect = scene.getBoundingClientRect();
      const scale = 660 / rect.height; // viewBox units per on-screen pixel
      const fullH = candleHeight(state.size);
      const deltaSvg = (e.clientY - pin._dragStartClientY) * scale;
      const startPinY = baseY() - fullH * pin._dragStartFraction;
      const candidatePinY = startPinY + deltaSvg;
      const candidateFraction = (baseY() - candidatePinY) / fullH;
      movePinTo(pin, clampPinFraction(candidateFraction, pin));
      renderPinList();
    }
    if (!pin.fallen) {
      showPinTooltip(e.clientX, e.clientY, `Rings in ${formatDuration(waitMinutesFor(pin.fraction) * 60_000)}`);
    }
  });

  pin.el.addEventListener('pointerup', (e) => {
    if (draggingPin === pin) {
      draggingPin = null;
      pin.el.style.cursor = 'grab';
      // always dismiss the floating time popup once the finger/mouse
      // lifts — on touch devices there's no hover to leave afterward,
      // so this can't be left to the pointerleave handler alone
      hidePinTooltip();
      if (!pin._moved) {
        // no real movement happened — treat it as a click, open the icon
        // picker right next to this pin, not down at the bottom toolbar
        activePinIconTarget = pin;
        positionIconPopup(pin.el.getBoundingClientRect());
        iconPopup.classList.add('open');
      }
    }
  });

  pin.el.addEventListener('pointercancel', () => {
    if (draggingPin === pin) {
      draggingPin = null;
      pin.el.style.cursor = 'grab';
      hidePinTooltip();
    }
  });

  pin.el.addEventListener('pointerleave', () => {
    if (draggingPin !== pin) hidePinTooltip();
  });

  // every pointerdown+pointerup also fires a plain 'click' right after —
  // without this, the document-level "click outside closes the popup"
  // listener below sees that click, decides it landed outside the popup,
  // and closes the very popup pointerup just opened, same instant
  pin.el.addEventListener('click', (e) => e.stopPropagation());
}

function addPin(fraction) {
  if (state.pins.length >= MAX_PINS) return null;
  if (fraction === undefined) fraction = defaultPinFraction();
  fraction = clampPinFraction(fraction, null);
  const fullH = candleHeight(state.size);
  const halfW = candleHalfWidth(state.size);
  const pin = { fraction, icon: null, fallen: false, firing: false, el: null, side: state.pins.length % 2 === 0 ? 1 : -1 };
  pin.el = createPinElement(pin, fullH, halfW);
  attachPinInteractions(pin);
  pinsGroup.appendChild(pin.el);
  state.pins.push(pin);
  renderPinList();
  saveState();
  return pin;
}

function removePin(idx) {
  const pin = state.pins[idx];
  if (!pin || pin.fallen || pin.firing) return;
  pin.el.remove();
  state.pins.splice(idx, 1);
  renderPinList();
  saveState();
}

// Tapping the ⟳ on a fallen pin re-arms it a few minutes out, without
// having to place a brand-new pin from scratch. It reappears stuck back
// into the candle at whatever height corresponds to "rings again in
// SNOOZE_MINUTES", same as any other pin from there on.
const SNOOZE_MINUTES = 5;
function snoozePin(idx) {
  const pin = state.pins[idx];
  if (!pin || !pin.fallen) return;
  const totalMinutes = burnDurationMs(state.size) / 60_000;
  const waitFraction = SNOOZE_MINUTES / totalMinutes;
  const { minFraction, maxFraction } = fractionBounds();
  let newFraction = state.waxFraction - waitFraction;
  newFraction = Math.min(maxFraction, Math.max(minFraction, newFraction));
  newFraction = clampPinFraction(newFraction, pin);

  pin.fallen = false;
  pin.firing = false;
  pin.el.style.transition = '';
  movePinTo(pin, newFraction);
  renderPinList();
  saveState();
}

function clearAllPins() {
  state.pins.forEach((p) => p.el && p.el.remove());
  state.pins = [];
  state.landedSlots = 0;
  renderPinList();
}

// Clicking the candle body itself (rather than an existing pin) places a
// brand-new pin right at that height and immediately opens its icon
// popup — this is how additional pins (2nd through 5th) get added, since
// there's no separate toolbar button for it.
candleBody.addEventListener('pointerdown', (e) => {
  if (!state.timerMode || draggingPin) return;
  if (state.pins.length >= MAX_PINS) return;
  const rect = scene.getBoundingClientRect();
  const scale = 660 / rect.height;
  const svgY = (e.clientY - rect.top) * scale;
  const fullH = candleHeight(state.size);
  const rawFraction = (baseY() - svgY) / fullH;
  const pin = addPin(clampPinFraction(rawFraction, null));
  if (pin) {
    activePinIconTarget = pin;
    positionIconPopup(pin.el.getBoundingClientRect());
    iconPopup.classList.add('open');
  }
});
// same race as the pin's own click listener above: the pointerdown that just
// opened the popup is immediately followed by a plain 'click', which the
// document-level "click outside closes it" listener would otherwise treat
// as a click outside the popup and close it right back
candleBody.addEventListener('click', (e) => e.stopPropagation());

// ---------- alarm ----------
// how often a fallen pin turns out to be the bent one, purely cosmetic
const FALLEN_PIN_VARIANT_CHANCE = 0.12;
// Fired once per pin, the moment the candle burns down past it. Once a
// pin starts falling, render() never touches it again — only this
// function and its own timeout own that pin's element from here on,
// so the fall animation actually gets to play instead of being
// overwritten on the very next frame.
function firePin(pin) {
  pin.firing = true;
  const anchorX = parseFloat(pin.el.getAttribute('data-anchor-x')) || CENTER_X;
  const anchorY = parseFloat(pin.el.getAttribute('data-anchor-y')) || 300;
  const plateY = state.pillarMode ? baseY() + 6 : CUP_TRAY_LANDING_Y; // where it actually lands
  const fallDistance = plateY - anchorY;
  // a falling object's time scales with the SQUARE ROOT of the distance
  // (gravity, not a constant speed) — the flat 420ms base plus a linear
  // 0.6/unit this used to be didn't follow that at all, and for a typical
  // drop worked out to roughly 3x slower than an actual short fall
  const fallMs = 17 * Math.sqrt(Math.max(0, fallDistance));

  // every pin falls to the same spot on the rim (same anchorX, same
  // plateY) since they're pinned into whichever side they were placed on —
  // so each landing gets its own slot spaced along the plate, otherwise
  // fallen pins would stack invisibly on top of each other. Direction of
  // both the spread and the rotation has to mirror for left-side pins,
  // or a pin stuck into the left face falls "backwards" and ends up
  // propped at an angle instead of lying flat like its right-side twins.
  const side = pin.side || 1;
  // clamp the pin's actual final resting spot (not just how far it spreads
  // from its own anchor) to the tray/plate's real safe width — a wide
  // candle's own insertion point can already sit close to that edge before
  // any spread is even added, so limiting only the spread isn't enough
  const safeHalfWidth = state.pillarMode ? PILLAR_PLATE_SAFE_HALF_WIDTH : CUP_TRAY_SAFE_HALF_WIDTH;
  const rawSpread = 8 + state.landedSlots * 16;
  const tentativeX = anchorX + rawSpread * side;
  const clampedX = Math.min(CENTER_X + safeHalfWidth, Math.max(CENTER_X - safeHalfWidth, tentativeX));
  const landingOffsetX = clampedX - anchorX;
  state.landedSlots++;

  // the saucer is viewed close to face-on, so a pin has to rotate almost onto
  // its back (~82°) to read as lying flat on it; the wide pillar plate is
  // viewed from almost directly above, where that same rotation instead
  // reads as hanging off the edge like a pendant — it only needs a small
  // tilt to look like it's resting on a surface seen nearly overhead
  const landRotateDeg = state.pillarMode ? 10 : 82;
  pin.el.style.transition = `transform ${fallMs}ms cubic-bezier(.5,0,1,1)`;
  pin.el.style.transformOrigin = `${anchorX}px ${anchorY}px`;
  // pin works loose from where it's stuck in and drops, landing flat on the plate
  pin.el.style.transform = `translate(${landingOffsetX}px, ${fallDistance}px) rotate(${landRotateDeg * side}deg)`;

  // the clink is the sound of it actually hitting the brass plate, not
  // the moment it comes loose — so the ring is timed to land with impact.
  // The pin stays right where it landed afterward, resting on the plate,
  // instead of disappearing.
  setTimeout(() => {
    pinLanded();
    pin.fallen = true;
    // a bent old pin, rarely, once it's actually down on the plate — its
    // dimensions are close enough to the normal pin's that it drops in
    // without needing its own geometry, since this is purely cosmetic on
    // an already-landed, no-longer-interactive pin
    if (Math.random() < FALLEN_PIN_VARIANT_CHANCE) {
      const img = pin.el.querySelector('image');
      if (img) img.setAttribute('href', 'candlerpin-fallen.png');
    }
    renderPinList();
    // once every pin you've set has rung, repeat (if on) keeps chiming
    // on an interval until turned off — there's nothing left to re-arm
    if (state.repeat && state.pins.length && state.pins.every((p) => p.fallen)) {
      clearTimeout(state.repeatTimeoutId);
      state.repeatTimeoutId = setTimeout(repeatRing, REPEAT_INTERVAL_MS);
    }
  }, fallMs);
}

function repeatRing() {
  if (!state.repeat) return;
  // "ding, ding" — two chimes rather than one, so a snoozed alarm is
  // audibly distinct from the original single ring
  ring();
  setTimeout(() => { if (state.repeat) ring(); }, 450);
  state.repeatTimeoutId = setTimeout(repeatRing, REPEAT_INTERVAL_MS);
}

// ---------- mode handling ----------
// seedPins (optional): [{fraction, icon}, ...] restored from a previous
// visit — if given, those exact pins are recreated instead of the usual
// single default pin.
function enterTimerMode(seedPins) {
  state.timerMode = true;
  repeatCtrl.classList.remove('hidden');
  repeatCtrl.style.opacity = 1;
  repeatCtrl.style.width = '';
  repeatCtrl.style.margin = '';
  candleBody.style.cursor = 'copy'; // hints that clicking the wax adds a pin
  clearAllPins();
  if (seedPins && seedPins.length) {
    seedPins.forEach((sp) => {
      const pin = addPin(sp.fraction);
      if (pin && sp.icon) setPinIcon(pin, sp.icon);
    });
  } else {
    addPin(); // seed one pin so just toggling ⏱ on still sets an alarm
  }
}

function exitTimerMode() {
  state.timerMode = false;
  repeatCtrl.style.opacity = 0;
  repeatCtrl.style.width = '0';
  repeatCtrl.style.margin = '0 -11px';
  candleBody.style.cursor = '';
  clearTimeout(state.repeatTimeoutId);
  clearAllPins();
  saveState();
}

// ---------- persistence: remember the last candle size and its pins so
// the app reopens where you left off, instead of resetting fresh every
// time (only the setup — size, mode, pins — is remembered; the burn
// itself always restarts full, since a candle can't un-burn) ----------
const STORAGE_KEY = 'sagneCandleState';
function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      size: state.size,
      pillarMode: state.pillarMode,
      pillarDays: state.pillarDays,
      timerMode: state.timerMode,
      repeat: state.repeat,
      lightedAt: state.lightedAt,
      pins: state.pins.map((p) => ({ fraction: p.fraction, icon: p.icon })),
      pitch: state.pitch,
    }));
  } catch (e) {
    // storage unavailable (private browsing, etc.) — nothing depends on
    // this succeeding, so just skip remembering this time
  }
}
function loadSavedState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

// ---------- events ----------
sizeSlider.addEventListener('input', () => {
  state.size = sizeSlider.value / 100;
  syncFill(sizeSlider);
  resetCandle(); // changing size = a different candle, per brief
  saveState();
});
pillarCheck.addEventListener('change', () => {
  state.pillarMode = pillarCheck.checked;
  sizeSlider.disabled = state.pillarMode;
  sizeCtrl.style.opacity = state.pillarMode ? 0.35 : 1;
  updateStandForMode();
  resetCandle(); // switching in or out of pillar mode = a different candle
  saveState();
});

// swap the WHOLE short-term stand for the WHOLE pillar stand, and back,
// whenever pillar mode is toggled or restored. These are two separate
// photographed objects, so this is a straight either/or — never show one
// stand's parts on top of the other's, which stacks two different bases
// into a single impossible stand. #lipImg belongs to the short-term stand
// too; it only sits outside that group because it has to paint after the
// candle body, so it toggles together with it here.
function updateStandForMode() {
  const pillar = state.pillarMode;
  shortStand.style.display = pillar ? 'none' : '';
  lipImg.style.display     = pillar ? 'none' : '';
  pillarStand.style.display = pillar ? '' : 'none';
}
pillarSlider.addEventListener('input', () => {
  state.pillarDays = parseInt(pillarSlider.value, 10);
  syncFill(pillarSlider);
  if (state.pillarMode) resetCandle(); // only actually a different candle while pillar mode is engaged
  saveState();
});
pitchSlider.addEventListener('input', () => {
  // 0.65..1.65 range, centered on the original tone at the slider's midpoint
  state.pitch = 0.65 + (pitchSlider.value / 100) * 1.0;
  syncFill(pitchSlider);
});
pitchSlider.addEventListener('change', () => {
  ring(); // preview the new tone once the person settles on a value
  saveState();
});
timerCheck.addEventListener('change', () => {
  timerCheck.checked ? enterTimerMode() : exitTimerMode();
  saveState();
});
repeatCheck.addEventListener('change', () => {
  state.repeat = repeatCheck.checked;
  if (!state.repeat) clearTimeout(state.repeatTimeoutId);
  saveState();
});

function resetCandle() {
  state.waxFraction = 1.0;
  state.lightedAt = Date.now();
  state.extinguished = false;
  clearTimeout(state.repeatTimeoutId);
  clearAllPins();
  if (state.timerMode) addPin();
}

function render() {
  const s = state.size;
  const fullH = candleHeight(s);
  const halfW = candleHalfWidth(s);
  const curH = fullH * Math.max(state.waxFraction, 0);
  const topY = baseY() - curH;

  // ---- big-pillar hollow well: once enough of a multi-day burn has
  // elapsed, the flame has sunk below the rim and the top of the candle
  // is a dark, glowing hollow rather than a flat surface. The outer rim
  // still erodes on exactly the same waxFraction the pins already fire
  // against — only the top portion's appearance changes, and the flame's
  // own position moves down into the well instead of sitting at the rim.
  const elapsedFraction = 1 - Math.max(state.waxFraction, 0);
  const hollowT = state.pillarMode
    ? smoothstep(HOLLOW_START_FRACTION, HOLLOW_START_FRACTION + 0.04, elapsedFraction)
    : 0;
  // The flame bores a narrow well straight down into the pillar. The seat
  // only drops a little below the rim — just far enough that the front
  // wall of unburned wax hides the flame's body and only its tip crests
  // the surface. (Earlier this was fullH*0.22, which sank the flame so
  // deep the wax towered above it.)
  const wellDepth = fullH * 0.09 * hollowT;

  // wax body — flat top, slightly rounded corners, subtle pooled-wax lip at top.
  const cornerR = halfW * 0.18;
  const xL = CENTER_X - halfW, xR = CENTER_X + halfW;
  let waxD;
  if (state.pillarMode) {
    // the plate has nothing drawn in front of the candle afterward, so
    // the wax itself has to follow the plate's true front-rim curve —
    // same ellipse math as before, unchanged, this part was already right.
    const rectBottomY = topY + curH;
    const dx = Math.min(halfW, PLATE_RIM_RX);
    const sideY = PILLAR_RIM_CY + PLATE_RIM_RY * Math.sqrt(Math.max(0, 1 - (dx / PLATE_RIM_RX) ** 2));
    waxD = `M ${xL + cornerR} ${topY}
            L ${xR - cornerR} ${topY}
            Q ${xR} ${topY} ${xR} ${topY + cornerR}
            L ${xR} ${sideY}
            A ${PLATE_RIM_RX} ${PLATE_RIM_RY} 0 0 1 ${xL} ${sideY}
            L ${xL} ${topY + cornerR}
            Q ${xL} ${topY} ${xL + cornerR} ${topY} Z`;
  } else {
    // the cup has a real front-lip layer redrawn on top of the candle
    // (see #lipImg below), cut from the cup's own photo — that layer's
    // true shape does the curve-matching, so the wax itself just needs
    // to be a plain rectangle sitting deep enough to be covered by it.
    const rectBottomY = topY + curH;
    waxD = `M ${xL + cornerR} ${topY}
            L ${xR - cornerR} ${topY}
            Q ${xR} ${topY} ${xR} ${topY + cornerR}
            L ${xR} ${rectBottomY - cornerR}
            Q ${xR} ${rectBottomY} ${xR - cornerR} ${rectBottomY}
            L ${xL + cornerR} ${rectBottomY}
            Q ${xL} ${rectBottomY} ${xL} ${rectBottomY - cornerR}
            L ${xL} ${topY + cornerR}
            Q ${xL} ${topY} ${xL + cornerR} ${topY} Z`;
  }

  // the flame's seat, just under the rim once hollowed
  const wellFloorY = topY + wellDepth;
  // Seen straight-on, the hollowed top reads as nothing but a level rim
  // with the flame tip above it — no melt-hole disc, no glow oval on the
  // surface. The wax stays solid across the front; everything below the
  // rim is opaque wax (the flame clip hides the sunk body).
  const wellShape = '';
  // the elliptical pooled-wax lip is a perspective cue for a flat top;
  // once hollowed we want a plain level rim, so fade it out with hollowT
  const rimLipOpacity = 1 - hollowT;

  candleBody.innerHTML = `
    <path d="${waxD}" fill="url(#waxGrad)" />
    <path d="${waxD}" fill="url(#waxToneVertical)" style="mix-blend-mode:multiply"/>
    <path d="${waxD}" fill="none" stroke="#5c4a30" stroke-width="1"
          opacity="0.4" filter="url(#inkWobble)"/>
    <ellipse cx="${CENTER_X}" cy="${topY}" rx="${halfW * 0.94}" ry="${halfW * 0.16}"
             fill="var(--wax-edge)" opacity="${0.9 * rimLipOpacity}"/>
    <ellipse cx="${CENTER_X}" cy="${topY}" rx="${halfW * 0.94}" ry="${halfW * 0.16}"
             fill="none" stroke="#5c4a30" stroke-width="0.7" opacity="${0.35 * rimLipOpacity}" filter="url(#inkWobble)"/>
    ${!state.extinguished ? `<ellipse cx="${CENTER_X}" cy="${topY}" rx="${halfW * 0.94}" ry="${halfW * 0.16}"
             fill="none" stroke="#ffdca8" stroke-width="1.2" opacity="${0.28 * rimLipOpacity}"
             style="mix-blend-mode:screen" filter="url(#inkWobble)"/>` : ''}
    ${!state.extinguished ? `<path d="${waxD}" fill="url(#waxBaseGlow)" style="mix-blend-mode:screen"/>` : ''}
    ${!state.extinguished ? `<path d="${waxD}" fill="url(#waxGlow)" style="mix-blend-mode:screen"/>` : ''}
    <path d="${waxD}" fill="#b09468" filter="url(#waxGrainFilter)"
          style="mix-blend-mode:multiply" opacity="0.34"/>
    ${wellShape}
    ${hollowT > 0.5
        ? '' /* hollowed pillar: wick is down in the wax, hidden behind the rim — show only rim + flame tip */
        : (!state.extinguished ? `<rect x="${CENTER_X - 1.5}" y="${wellFloorY - 12}" width="3" height="14" rx="1.4" fill="var(--wick)"/>`
                               : `<rect x="${CENTER_X - 1.3}" y="${wellFloorY - 4}" width="2.6" height="6" rx="1.2" fill="#1a1512"/>`)}
  `;

  // hide the sunk flame behind the solid wax: clip its bottom exactly to
  // the level rim once hollowed, so only the tip shows above the edge;
  // parked far below otherwise so an ordinary flame is never clipped
  const flameClipBottom = topY + (1 - hollowT) * 10000;
  flameClipRect.setAttribute('y', -60);
  flameClipRect.setAttribute('height', flameClipBottom + 60);

  // on the burned pillar, lift the glow's centre up toward the flame tip
  // so the halo sits higher, above the rim rather than around the body.
  // -20 centres it on the flame's own visible body (weighted toward its
  // wide base, not the midpoint between base and tip — an earlier -35
  // put more than half the halo above the flame entirely). A wide
  // candle's flat top is also lit by its own inner glow (waxGlow/
  // waxBaseGlow below) across a lot more area than a thin candle's,
  // which still pulls the eye's read of the halo's centre down a little
  // further — so it's lifted a bit more in proportion to how wide the
  // candle is, on top of the fix above, not instead of it.
  glowCircle.setAttribute('cy', wellFloorY - 20 - hollowT * 45 - (halfW - HALF_W_MIN) * 0.25);
  // the burned pillar hides most of the flame, so its warm halo above the
  // rim is the main light — make that glow noticeably larger than the
  // ordinary candle's
  glowCircle.setAttribute('r', state.extinguished ? 0 : 90 + (state.timerMode ? 0 : state.wind) * 35 + hollowT * 85);

  // flame — timer mode locks wind to zero: "burn rate locks to the
  // candle's true, unaided speed at its set size"
  const effWind = state.timerMode ? 0 : state.wind;
  if (!state.extinguished) {
    // non-repeating turbulence (see stepFlameTurbulence) rather than
    // stacked sine waves — real flame movement never quite loops
    const leftWobble  = turb.edgeL.v * 0.6;
    const rightWobble = turb.edgeR.v * 0.6;
    const tipWobble    = turb.tip.v;
    const heightPulse = 1 + turb.height.v * (0.07 + effWind * 0.1);

    // real flames are rarely perfectly plumb even in still air — a small
    // constant off-axis bias on top of the genuine turbulence in state.lean
    const idleAsymmetry = 1.4;

    const windLean = state.lean * (10 + effWind * 34) + idleAsymmetry;
    // a flame sunk into the wax is shielded from any draft — barely
    // shrunk, but with most of its body hidden behind the front wall of
    // wax (the flame clip), so only its top crests the rim
    const heightScale = (1 - effWind * 0.35) * heightPulse * (1 - hollowT * 0.12);
    const flameH = 48 * heightScale;
    const flameW = 14 * (1 - effWind * 0.22) * (1 - hollowT * 0.08);
    const baseY = wellFloorY - 12;
    const tipX = CENTER_X + windLean + tipWobble * 3;
    const tipY = baseY - flameH;
    const leftW  = flameW * (1 - effWind * 0.4) * (1 + leftWobble * 0.12);
    const rightW = flameW * (1 + effWind * 0.5) * (1 + rightWobble * 0.12);
    const cx1 = CENTER_X - leftW;
    const cx2 = CENTER_X + rightW;
    const midY = baseY - flameH * 0.42;
    const bulgeY = baseY - flameH * 0.18; // widest point, low, near the wick — where real diffusion flames bulge
    // a slight waist just above the bulge, where a real flame narrows
    // before opening back out toward the tip — breaks up the smooth
    // single-curve "leaf" silhouette
    const waistY = baseY - flameH * 0.62;
    const waistPull = flameW * 0.16;
    // the waist and the tip's control points bend with the same lean the
    // rest of the flame has, just scaled down by how far up they sit —
    // anchored at the base, freest at the tip, like a real flame bending
    // in a draft. Wobble is kept small here and used only as flicker
    // texture, not as its own independent sway, or the mid-section reads
    // as wiggling out of sync with the tip and base.
    const waistLean = windLean * 0.45;
    const midLean = windLean * 0.75;

    const flamePathD = `M ${cx1} ${baseY}
               C ${CENTER_X - leftW * 1.1} ${bulgeY} ${CENTER_X - leftW * 0.55 + waistLean} ${waistY + flameH * 0.1} ${CENTER_X - waistPull + waistLean + leftWobble * 0.4} ${waistY}
               C ${CENTER_X - waistPull * 0.3 + midLean} ${waistY - flameH * 0.12} ${CENTER_X - leftW * 0.3 + midLean} ${midY} ${tipX} ${tipY}
               C ${CENTER_X + rightW * 0.3 + midLean} ${midY} ${CENTER_X + waistPull * 0.3 + midLean} ${waistY - flameH * 0.12} ${CENTER_X + waistPull + waistLean + rightWobble * 0.4} ${waistY}
               C ${CENTER_X + leftW * 0.55 + waistLean} ${waistY + flameH * 0.1} ${CENTER_X + rightW * 1.1} ${bulgeY} ${cx2} ${baseY}
               C ${CENTER_X + rightW * 0.6} ${baseY + 8} ${CENTER_X - leftW * 0.6} ${baseY + 8} ${cx1} ${baseY} Z`;

    flameGroup.innerHTML = `
      <ellipse cx="${CENTER_X + windLean * 0.3}" cy="${baseY - flameH * 0.52}"
               rx="${flameW * 1.9}" ry="${flameH * 0.68}"
               fill="url(#flameHalo)" filter="url(#flameSoften)"/>
      <path d="${flamePathD}" fill="url(#flameGrad)" opacity="0.97" filter="url(#flameSoften)"/>
      <ellipse cx="${CENTER_X + leftWobble * 0.6}" cy="${baseY - flameH * 0.3}"
               rx="${flameW * 0.4}" ry="${flameH * 0.32}"
               fill="url(#flameCore)"/>
      <path d="M ${CENTER_X - flameW * 0.32} ${baseY - 1}
               Q ${CENTER_X} ${baseY - flameH * 0.3} ${CENTER_X + flameW * 0.28} ${baseY - 1}
               Q ${CENTER_X} ${baseY + 3} ${CENTER_X - flameW * 0.32} ${baseY - 1} Z"
            fill="url(#flameHeart)"/>
      <ellipse cx="${CENTER_X}" cy="${baseY + 2}" rx="${(leftW + rightW) * 0.24}" ry="4.5"
               fill="url(#flameBase)" filter="url(#flameSoften)"/>
      <path d="${flamePathD}" fill="none" stroke="#8a4a1e" stroke-width="0.6"
            opacity="0.22" filter="url(#inkWobble)"/>
    `;
  } else {
    flameGroup.innerHTML = `
      <path d="M ${CENTER_X} ${topY - 12} q -2 -10 0 -16 q 2 6 0 16" stroke="#9a9a9a" stroke-width="2.5"
            stroke-linecap="round" fill="none" opacity="0.5"/>
    `;
  }
}

// ---------- restore last visit, if there's anything saved ----------
(function restoreSavedState() {
  const saved = loadSavedState();
  if (!saved) return;
  if (typeof saved.size === 'number' && isFinite(saved.size)) {
    state.size = Math.min(1, Math.max(0, saved.size));
    sizeSlider.value = Math.round(state.size * 100);
    syncFill(sizeSlider);
  }
  if (typeof saved.pillarDays === 'number' && isFinite(saved.pillarDays)) {
    state.pillarDays = Math.min(PILLAR_MAX_DAYS, Math.max(PILLAR_MIN_DAYS, saved.pillarDays));
    pillarSlider.value = state.pillarDays;
    syncFill(pillarSlider);
  }
  if (saved.pillarMode) {
    state.pillarMode = true;
    pillarCheck.checked = true;
    sizeSlider.disabled = true;
    sizeCtrl.style.opacity = 0.35;
    updateStandForMode();
  }
  if (typeof saved.pitch === 'number' && isFinite(saved.pitch)) {
    state.pitch = Math.min(1.65, Math.max(0.65, saved.pitch));
    pitchSlider.value = Math.round(((state.pitch - 0.65) / 1.0) * 100);
    syncFill(pitchSlider);
  }
  if (saved.repeat) {
    state.repeat = true;
    repeatCheck.checked = true;
  }

  // pick up the burn where it actually stands in real time, not where it
  // was left visually — the candle keeps burning at its true, unaided
  // rate whether or not anyone's tab is open, the same way a real one
  // left lit on a table would
  let burnedOutWhileAway = false;
  if (typeof saved.lightedAt === 'number' && isFinite(saved.lightedAt)) {
    const elapsedMs = Math.max(0, Date.now() - saved.lightedAt);
    const duration = burnDurationMs(state.size);
    const fraction = 1 - elapsedMs / duration;
    state.lightedAt = saved.lightedAt;
    if (fraction <= 0) {
      state.waxFraction = 0;
      state.extinguished = true;
      burnedOutWhileAway = true;
    } else {
      state.waxFraction = fraction;
    }
  }

  // Pins whose moment passed while the tab was shut come back bunched, not
  // spread: addPin() clamps each one to fractionBounds(), whose ceiling is the
  // wax level that is actually left, and late in a burn that band is narrower
  // than MIN_PIN_GAP — so several overdue pins land on the same spot and ring
  // together a moment after reopening. That is KNOWN AND DELIBERATE, not an
  // oversight: no alarm is lost, and every one of them does ring. It only
  // shows up in the "came back having missed several" corner, where two pins
  // can draw on top of each other and you see fewer than you set. Separating
  // them would mean either placing overdue pins outside the wax that remains,
  // or ringing them retroactively — both worse lies than the overlap.
  if (saved.timerMode && !burnedOutWhileAway) {
    timerCheck.checked = true;
    enterTimerMode(Array.isArray(saved.pins) ? saved.pins : null);
  } else if (saved.timerMode && burnedOutWhileAway) {
    // still reflect the mode in the UI, but there's nothing left to
    // time — every pin would already have rung while it was away
    timerCheck.checked = true;
    state.timerMode = true;
    repeatCtrl.classList.remove('hidden');
    repeatCtrl.style.opacity = 1;
  }
})();

// ---------- background-safe alarm checking ----------
// The main tick() loop runs on requestAnimationFrame, which browsers
// deliberately pause (or slow to a crawl) the moment a tab isn't the
// active one, to save battery — so a pin waiting to ring would just sit
// there silently until you switched back. Timer mode locks wind to zero,
// which means its burn rate is always exactly wall-clock time, so the
// real remaining fraction can be recomputed directly from lightedAt at
// any moment, with no dependency on the animation loop having run.
function realTimerWaxFraction() {
  const duration = burnDurationMs(state.size);
  return 1 - Math.max(0, Date.now() - state.lightedAt) / duration;
}
function checkPinAlarms() {
  if (!state.timerMode || state.extinguished) return;
  const fraction = realTimerWaxFraction();
  if (fraction <= 0) {
    state.waxFraction = 0;
    state.extinguished = true;
    fssst();
    renderPinList();
    return;
  }
  state.waxFraction = fraction; // stays accurate even while backgrounded
  for (const pin of state.pins) {
    if (!pin.fallen && !pin.firing && fraction <= pin.fraction) firePin(pin);
  }
}
// setInterval is throttled in background tabs too, but far more gently
// than rAF — modern browsers still run it roughly once a second, which
// is close enough for a ring you're meant to hear from another room.
setInterval(checkPinAlarms, 1000);
// and the instant you do switch back, catch up immediately rather than
// waiting for the next interval tick
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) checkPinAlarms();
});

// ---------- main loop ----------
let lastT = performance.now();
let readoutAccumMs = 0;
function tick(t) {
  const dt = t - lastT;
  lastT = t;

  if (!state.extinguished) {
    const burnWind = state.timerMode ? 0 : state.wind;
    state.flicker += dt * (0.0016 + burnWind * 0.0055);
    stepFlameTurbulence(dt, burnWind);
    state.lean = turb.lean.v * (0.5 + burnWind * 1.5);

    // Size sets the candle's total (real-time) burn capacity in both
    // modes. Each pin's fraction was fixed relative to that capacity
    // when it was added.
    const duration = burnDurationMs(state.size);
    // wind feeds the flame -> faster burn; locked to 0 in timer mode so
    // "burn rate locks to the candle's true, unaided speed at its set size"
    const rateMult = 1 + burnWind * 1.8;
    state.waxFraction -= (dt / duration) * rateMult;

    if (state.waxFraction <= 0) {
      state.waxFraction = 0;
      state.extinguished = true;
      fssst(); // tiny sound marking the natural end of the candle
    }

    if (state.timerMode) {
      for (const pin of state.pins) {
        if (!pin.fallen && !pin.firing && state.waxFraction <= pin.fraction) {
          firePin(pin);
        }
      }
    }
  }

  render();

  readoutAccumMs += dt;
  if (readoutAccumMs > 500) {
    readoutAccumMs = 0;
    updateReadout();
  }

  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// ---------- keep the screen on ----------
// The whole point of a candle you can prop up and see across a room is
// defeated if the phone dims and locks itself after a minute of nobody
// touching it. The Wake Lock API tells the browser to leave the display
// on while this page is open. It's well supported on modern phones and
// fails completely silently on anything that doesn't support it — no
// error, no broken behaviour, the candle just works exactly as before.
let wakeLockSentinel = null;
async function requestWakeLock() {
  if (!('wakeLock' in navigator)) return;
  try {
    wakeLockSentinel = await navigator.wakeLock.request('screen');
  } catch (err) {
    // silently ignore — e.g. battery saver mode, or the tab isn't
    // visible yet; nothing to surface to the person lighting a candle
  }
}
requestWakeLock();
// a wake lock is automatically released whenever the tab is hidden
// (switching apps, locking manually), so it has to be re-requested each
// time the page becomes visible again, or it silently stops working
// after the very first app-switch
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') requestWakeLock();
});
</script>
</body>
</html>
