<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sagne</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="A shelf of small interactive pieces.">
<meta name="theme-color" content="#122336">
<link rel="canonical" href="https://sagne.co.uk/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="sagne">
<meta property="og:title" content="sagne">
<meta property="og:description" content="A shelf of small interactive pieces.">
<meta property="og:url" content="https://sagne.co.uk/">
<meta property="og:image" content="https://sagne.co.uk/og/index.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="sagne">
<meta name="twitter:description" content="A shelf of small interactive pieces.">
<meta name="twitter:image" content="https://sagne.co.uk/og/index.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap');
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  /* the exact navy the case was photographed against, so the frame's edge
     disappears and the case simply stands on a wall */
  html,body{ height:100%; margin:0; background:#122336; color:#e2d6bb;
    font-family:'Cormorant Garamond', Georgia, serif; }
  body{ display:flex; align-items:center; justify-content:center; padding:2vh 2vw; }

  /* The frame clips, so a zoomed-in shelf fills it instead of overflowing the page.
     The case must fit the viewport in BOTH directions -- sized by height alone it ran
     off the sides of a phone and the shelves were cut in half. 1088/990 is the case's
     own proportion, so this is the tallest it can be and still fit across. */
  #frame{ position:relative; overflow:hidden; flex:none;
    --h: min(95vh, calc(96vw * 1.09899), 1088px);
    height:var(--h); width:calc(var(--h) / 1.09899); }
  /* Sizes here are fractions of the case's own height, so the lettering keeps its
     proportion to the furniture at every screen size. They cannot be written as
     "unit x px" -- --h is a length, and a length times a length is not a size, so
     that silently fell back to the browser's 16px default and the names collided. */
  #case{ position:absolute; inset:0;
    transform-origin:50% 50%;
    transition:transform .6s cubic-bezier(.22,.66,.24,1); }
  #case > img.wood{ width:100%; height:100%; display:block; }

  /* sagne, engraved into the brass oval at the crown */
  #oval{ position:absolute; display:flex; align-items:center; justify-content:center;
    font-weight:700; letter-spacing:.16em;
    /* engraved: cut dark into the brass, with a bright lip on the lower edge where
       the light catches the cut */
    color:#33230a; text-shadow:0 1px 0 rgba(255,238,196,.5), 0 -1px 1px rgba(0,0,0,.35);
    pointer-events:none; }
  #oval i{ font-style:normal; }

  /* the name of the type, engraved on the plate of the shelf it labels */
  .plate{ position:absolute; display:flex; align-items:center; justify-content:center;
    font-weight:600; letter-spacing:.02em;
    color:#3b2807; text-shadow:0 1px 0 rgba(255,238,196,.42), 0 -1px 1px rgba(0,0,0,.3);
    white-space:nowrap; cursor:pointer; }
  .plate i{ font-style:normal; }

  /* the pieces, standing face front on their shelf */
  .piece{ position:absolute; display:block; text-decoration:none;
    transition:transform .25s cubic-bezier(.2,.7,.3,1), opacity .35s ease;
    transform-origin:50% 100%; }
  .piece img{ width:100%; height:100%; object-fit:cover; display:block;
    border-radius:2px; box-shadow:0 3px 7px rgba(0,0,0,.75), 0 0 0 1px rgba(0,0,0,.5); }
  .piece:hover{ transform:scale(1.14) translateY(calc(var(--h) * -0.0037)); z-index:5; }
  .piece:focus-visible{ outline:2px solid #b8903f; outline-offset:2px; }

  /* zoomed in: the shelf in focus stands forward, the rest steps back */
  #case.zoomed .piece:not(.on){ opacity:.2; pointer-events:none; }
  #case.on-card .piece.picked{ z-index:6; }
  #case.on-card .piece.on:not(.picked){ opacity:.35; }

  #back{ position:absolute; left:50%; bottom:3%; transform:translateX(-50%);
    background:rgba(9,17,28,.72); border:0; border-radius:999px; cursor:pointer;
    padding:.45em 1.3em; font:inherit; color:#d8c9a4;
    font-size:13px; letter-spacing:.2em; opacity:0; pointer-events:none;
    transition:opacity .4s ease; z-index:20;
    box-shadow:0 2px 10px rgba(0,0,0,.5); }
  #frame.zoomed #back{ opacity:.75; pointer-events:auto; }
  #back:hover{ opacity:1; }
  @media (prefers-reduced-motion: reduce){
    #case, .piece{ transition:none; }
  }
</style>
</head>
<body>
  <div id="frame">
    <div id="case">
      <img class="wood" src="shelves.jpg" alt="An apothecary shelf of five open shelves">
      <span id="oval">sagne</span>
    </div>
    <button type="button" id="back">back</button>
  </div>
<script>
(function(){
  // ---------------------------------------------------------------------------
  // One table of measurements, taken off the photograph itself (990 x 1088), and
  // everything else -- where each card stands, where each name is engraved, and
  // where the case has to move to bring a shelf or a card into the middle of the
  // frame -- is worked out from it. The previous version carried forty hand-typed
  // percentages, which had to be retyped by hand every time the picture changed.
  // ---------------------------------------------------------------------------
  var GEO = {
    W:990, H:1088,
    interior:{ left:148, right:845 },     // the opening between the two stiles
    oval:{ x:419, y:70, w:168, h:66 },    // the brass oval on the crown
    plate:{ x:424, w:147, h:22 },         // the engraved area of a brass plate
    card:{ w:76, h:100 },
    // ceil = underside of the shelf above; surf = the surface this shelf's cards
    // stand on; plateY = top of the brass plate on this shelf's front rail
    shelves:[
      { name:'instrumenta', ceil:144, surf:293, plateY:300,
        pieces:[['candler','candler/index.html','candler/candle-card.png'],
                ['conometer','conometer/index.html','conometer/conometer-card.png'],
                ['galileo','galileo/index.html','galileo/galileo-card.png'],
                ['windower','windower/index.html','windower/windower-card.png'],
                ['storm','storm/index.html','storm/storm-card.png']] },
      { name:'tactilia', ceil:330, surf:448, plateY:455,
        pieces:[['warmler','warmler/index.html','warmler/warmler-card.png'],
                ['roller','roller/index.html','roller/roller-card.png'],
                ['kaleidoscope','kaleidoscope/index.html','kaleidoscope/kaleidoscope-card.png']] },
      { name:'systema', ceil:487, surf:602, plateY:609,
        pieces:[['musebox','musebox/index.html','musebox/musebox-card.png'],
                ['gyre','gyre/index.html','gyre/gyre-card.png'],
                ['chimes','chimes/index.html','chimes/chimes-card.png']] },
      { name:'natura', ceil:641, surf:753, plateY:760,
        pieces:[['birds','birds/index.html','birds/birds-card.png'],
                ['fireflies','fireflies/index.html','fireflies/fireflies-card.png'],
                ['ant','ant/index.html','ant/ant-card.png']] },
      { name:'phenomena', ceil:791, surf:903, plateY:910,
        pieces:[['lamp','lamp/index.html','lamp/lamp-card.png'],
                ['rain','rain/index.html','rain/rain-card.png'],
                ['bowl','bowl/index.html','bowl/bowl-card.png'],
                ['pendulum','pendulum/index.html','pendulum/pendulum-card.png'],
                ['chladni','chladni/index.html','chladni/chladni-card.png']] }
    ]
  };

  var W=GEO.W, H=GEO.H;
  var IL=GEO.interior.left, IR=GEO.interior.right, IW=IR-IL, IMID=(IL+IR)/2;
  var pc = function(v,total){ return (v/total*100).toFixed(4)+'%'; };

  // Every shelf uses the same pitch, so a shelf of three sits in the middle three
  // columns of a shelf of five and the cards line up all the way down the case.
  var PITCH = IW/5;
  function slotX(n,i){ return IMID + PITCH*(i-(n-1)/2); }

  var caseEl=document.getElementById('case'), frame=document.getElementById('frame');
  var ovalEl=document.getElementById('oval');
  var BY_SLUG={}, RECT={};

  // --- lay the oval, the plates and the cards onto the photograph ---------------
  ovalEl.style.left=pc(GEO.oval.x,W); ovalEl.style.top=pc(GEO.oval.y,H);
  ovalEl.style.width=pc(GEO.oval.w,W); ovalEl.style.height=pc(GEO.oval.h,H);
  ovalEl.style.fontSize='calc(var(--h) * 0.0404)';

  GEO.shelves.forEach(function(sh,si){
    sh.pieces.forEach(function(p,i){
      var cx=slotX(sh.pieces.length,i);
      var x=cx-GEO.card.w/2, y=sh.surf-GEO.card.h;
      var a=document.createElement('a');
      a.className='piece'; a.href=p[1]; a.setAttribute('aria-label',p[0]);
      a.style.left=pc(x,W); a.style.top=pc(y,H);
      a.style.width=pc(GEO.card.w,W); a.style.height=pc(GEO.card.h,H);
      a.innerHTML='<img src="'+p[2]+'" alt="">';
      caseEl.appendChild(a);
      BY_SLUG[p[0]]={ el:a, shelf:si };
      RECT[p[0]]={ cx:cx, cy:y+GEO.card.h/2 };
    });
    var pl=document.createElement('span');
    pl.className='plate'; pl.id='p-'+sh.name; pl.innerHTML='<i>'+sh.name+'</i>';
    pl.style.left=pc(GEO.plate.x,W); pl.style.top=pc(sh.plateY,H);
    pl.style.width=pc(GEO.plate.w,W); pl.style.height=pc(GEO.plate.h,H);
    pl.style.fontSize='calc(var(--h) * 0.0138)';
    caseEl.appendChild(pl);
    sh.plateEl=pl;
  });

  // --- fit the engraved names to the brass they are cut into --------------------
  // Measure the TEXT, not the box. The plate is a centred flex container, so its
  // scrollWidth just reports the container however far the words overflow it -- an
  // earlier go at this drove every name down to the floor and still called them too
  // wide. Wrapping the words in an <i> lets them be measured directly. This also
  // survives the webfont arriving late, which a guessed character width would not.
  function fit(){
    [].forEach.call(document.querySelectorAll('.plate, #oval'), function(el){
      var inner=el.firstElementChild, box=el.clientWidth*0.90;
      if(!inner || !box) return;
      el.style.fontSize=el.dataset.base || (el.dataset.base=getComputedStyle(el).fontSize);
      var size=parseFloat(getComputedStyle(el).fontSize), guard=0;
      while(inner.offsetWidth>box && size>4 && guard++<80){
        size-=0.3; el.style.fontSize=size+'px';
      }
    });
  }
  if(!ovalEl.firstElementChild) ovalEl.innerHTML='<i>'+ovalEl.textContent+'</i>';

  // --- the zoom ----------------------------------------------------------------
  // On a phone the whole case has to shrink to fit across, which leaves the cards
  // at about thirty pixels. Her idea, and the right one: bring a shelf out to the
  // frame edges rather than shrinking the furniture. First tap zooms the shelf,
  // second zooms the card, third opens it.
  var SHELF_SCALE = W/IW;   // exactly wide enough to bring the opening to both edges
  var CARD_SCALE  = 3.6;

  // Centre a point of the photograph in the frame, but never so far that the case
  // pulls away from an edge and leaves bare background showing beside it.
  function transform(px,py,s){
    var lim=(s-1)/2;
    var tx=-s*(px-W/2)/W, ty=-s*(py-H/2)/H;
    tx=Math.max(-lim,Math.min(lim,tx)); ty=Math.max(-lim,Math.min(lim,ty));
    return 'translate('+(tx*100).toFixed(3)+'%,'+(ty*100).toFixed(3)+'%) scale('+s.toFixed(4)+')';
  }

  var level=0, shelfIx=null, cardSlug=null;

  function paint(){
    caseEl.classList.toggle('zoomed', level>0);
    caseEl.classList.toggle('on-card', level>1);
    frame.classList.toggle('zoomed', level>0);
    [].forEach.call(caseEl.querySelectorAll('.piece'), function(el){
      el.classList.remove('on','picked');
    });
    if(level>0){
      GEO.shelves[shelfIx].pieces.forEach(function(p){
        BY_SLUG[p[0]].el.classList.add('on');
      });
    }
    if(level>1) BY_SLUG[cardSlug].el.classList.add('picked');
    if(level===0){ caseEl.style.transform=''; }
    else if(level===1){
      var sh=GEO.shelves[shelfIx];
      caseEl.style.transform=transform(IMID,(sh.ceil+sh.surf)/2,SHELF_SCALE);
    } else {
      var r=RECT[cardSlug];
      caseEl.style.transform=transform(r.cx,r.cy,CARD_SCALE);
    }
  }

  function toShelf(i){ level=1; shelfIx=i; cardSlug=null; paint(); }
  function toCard(slug){ level=2; shelfIx=BY_SLUG[slug].shelf; cardSlug=slug; paint(); }
  function outOne(){
    if(level===2){ level=1; cardSlug=null; }
    else if(level===1){ level=0; shelfIx=null; }
    paint();
  }

  // The three-step tap exists because a phone cannot show a card big enough to read.
  // A mouse on a big screen has neither problem, and three clicks to reach a piece
  // would just be in the way -- so with a real pointer a card opens on the first
  // click, and the shelf zoom stays available from the name plates.
  var FINE = matchMedia('(hover: hover) and (pointer: fine)');
  Object.keys(BY_SLUG).forEach(function(slug){
    BY_SLUG[slug].el.addEventListener('click', function(ev){
      if(FINE.matches) return;                      // mouse: straight in
      if(level===2 && cardSlug===slug) return;      // third tap: let the link open it
      ev.preventDefault();
      if(level===0) toShelf(BY_SLUG[slug].shelf);
      else toCard(slug);
    });
  });
  GEO.shelves.forEach(function(sh,i){
    sh.plateEl.addEventListener('click', function(){
      if(level===1 && shelfIx===i) outOne(); else toShelf(i);
    });
  });
  document.getElementById('back').addEventListener('click', outOne);
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') outOne(); });

  fit();
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  addEventListener('resize', fit);
})();
</script>
</body>
</html>
