<style>
  :root{ --brass:#c9974e; --parchment:#f2e9d8; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{ height:100%; margin:0; overflow:hidden; font-family: Georgia, serif; color:var(--parchment);
    background: radial-gradient(ellipse at 50% 0%, #2c3c58 0%, #17202f 55%, #0c111c 100%); }
  #backlink{ position:fixed; top:18px; left:22px; z-index:50; color:var(--parchment); opacity:.6; text-decoration:none; font-size:14px; letter-spacing:.04em; text-shadow:0 1px 3px rgba(0,0,0,.5); transition:opacity .3s ease; }
  #backlink:hover{opacity:1;}
  canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }

  #dock{ position:fixed; bottom:0; left:0; right:0; display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:8px 14px;
    padding:10px 16px 18px; background:linear-gradient(to top, rgba(8,11,18,.55), rgba(8,11,18,0)); z-index:40; }
  .group{ display:flex; align-items:center; gap:6px; background:rgba(20,26,38,.4); border:1px solid rgba(242,233,216,.12); border-radius:12px; padding:6px 10px; -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); }
  input[type=range]{ -webkit-appearance:none; appearance:none; width:110px; height:3px; border-radius:3px; background:rgba(242,233,216,.35); outline:none; vertical-align:middle; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:13px; height:13px; border-radius:50%; background:var(--brass); cursor:pointer; box-shadow:0 0 6px rgba(0,0,0,.4); }
  input[type=range]::-moz-range-thumb{ width:13px; height:13px; border-radius:50%; background:var(--brass); border:none; cursor:pointer; }

  .lenPopup{ position:fixed; z-index:55; display:none; flex-direction:column; align-items:center; gap:4px;
    background:rgba(16,20,30,.85); border:1px solid rgba(242,233,216,.18); border-radius:12px; padding:10px 12px;
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); box-shadow:0 6px 18px rgba(0,0,0,.4); }
  .lenPopup.open{ display:flex; }
  .lenPopup input[type=range]{ width:120px; }

  /* a quiet flag, opt-in only (never requests location on its own), for swapping the
     wind slider over to somewhere's real wind speed -- same pattern as galileo's/fireflies' */
  #windGroup{ position:relative; }
  #loc-flag{ appearance:none; border:0; background:none; padding:2px 4px; margin-left:-2px;
    font-size:14px; line-height:1; cursor:pointer; opacity:.5; transition:opacity .3s ease; flex-shrink:0; }
  #loc-flag:hover, #loc-flag.open{ opacity:.9; }
  #loc-flag.live{ opacity:1; }
  #loc-popup{ position:absolute; left:50%; bottom:100%; transform:translateX(-50%); margin-bottom:12px;
    display:none; flex-direction:column; align-items:center; gap:5px; white-space:nowrap;
    background:rgba(16,20,30,.9); border:1px solid rgba(201,151,78,.3); border-radius:10px; padding:9px 11px;
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); z-index:56; }
  #loc-popup.open{ display:flex; }
  #loc-note{ display:none; font-size:11px; letter-spacing:.02em; color:#a89a80; text-align:center;
    max-width:200px; white-space:normal; }
  #loc-note.visible{ display:block; }
  #loc-retry{ appearance:none; border:0; background:none; padding:0; margin-left:2px;
    font:inherit; color:inherit; text-decoration:underline; cursor:pointer; }
  #loc-retry:hover{ color:var(--brass); }
  #loc-retry:disabled{ text-decoration:none; opacity:.6; cursor:default; }
  #loc-search{ display:flex; align-items:center; gap:6px; }
  #loc-search input{ appearance:none; border:0; border-bottom:1px solid rgba(201,151,78,.4); background:none;
    color:var(--parchment); font:13px/1.3 Georgia, serif; letter-spacing:.02em; padding:3px 2px; width:120px; outline:none; }
  #loc-search input::placeholder{ color:#7a6b52; }
  #loc-search input:focus{ border-bottom-color:var(--brass); }
  #loc-search-status{ font-size:10px; letter-spacing:.02em; color:#a89a80; text-align:center;
    min-height:1.1em; white-space:normal; max-width:200px; }

  /* material pickers -- a small swatch trigger that opens a wordless popup list, matching warmler's finish picker */
  .matTrigger{ width:40px; height:30px; border-radius:6px; border:1.5px solid rgba(201,151,78,.5); cursor:pointer; padding:0; overflow:hidden; flex-shrink:0; box-shadow:0 6px 16px rgba(0,0,0,.5); transition:transform .25s ease, border-color .25s ease; }
  .matTrigger:hover{ transform:translateY(-1px); border-color:#e8c383; }
  .matTrigger img{ width:100%; height:100%; object-fit:cover; display:block; }
  .matOverlay{ position:fixed; inset:0; z-index:100; background:rgba(5,7,12,.72); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); display:none; align-items:center; justify-content:center; padding:24px 0; }
  .matOverlay.open{ display:flex; }
  .matPopup{ width:min(80vw,200px); max-height:70vh; max-height:70dvh; background:#0d1420; border:1px solid rgba(201,151,78,.4); border-radius:14px; box-shadow:0 30px 80px rgba(0,0,0,.6); overflow:hidden; }
  .matList{ overflow-y:auto; padding:12px 12px 18px; display:flex; flex-direction:column; gap:9px; }
  .matOption{ background:transparent; border:1.5px solid rgba(201,151,78,.18); border-radius:7px; padding:0; cursor:pointer; overflow:hidden; display:block; transition:border-color .2s ease; }
  .matOption:hover{ border-color:rgba(232,195,131,.6); }
  .matOption.selected{ border-color:#e8c383; }
  .matOption img{ width:100%; height:44px; object-fit:cover; display:block; }
</style>

  /* The way back is the brass disc off the shelf's plinth, with an arrow cut into

<body>
<a id="backlink" href="../index.html" aria-label="sagne"><img src="../shelfdisk.png" alt=""><i>&#8592;</i></a>
<canvas id="c"></canvas>
<div class="lenPopup" id="lenPopup">
  <input type="range" id="lenPopupSlider" aria-label="this rod's length">
</div>

<div class="matOverlay" id="rodMatOverlay">
  <div class="matPopup"><div class="matList" id="rodMatList">
    <button class="matOption" data-key="glass" aria-label="glass rods"><img src="chime-swatch-rod-glass.png" alt=""></button>
    <button class="matOption" data-key="silver" aria-label="brushed silver rods"><img src="chime-swatch-rod-silver.png" alt=""></button>
    <button class="matOption" data-key="brass" aria-label="aged brass rods"><img src="chime-swatch-rod-brass.png" alt=""></button>
    <button class="matOption" data-key="wood" aria-label="polished walnut rods"><img src="chime-swatch-rod-wood.png" alt=""></button>
  </div></div>
</div>
<div class="matOverlay" id="cordMatOverlay">
  <div class="matPopup"><div class="matList" id="cordMatList">
    <button class="matOption" data-key="rope" aria-label="jute rope"><img src="chime-swatch-cord-rope.png" alt=""></button>
    <button class="matOption" data-key="chain" aria-label="silver chain"><img src="chime-swatch-cord-chain.png" alt=""></button>
    <button class="matOption" data-key="string" aria-label="black cord"><img src="chime-swatch-cord-string.png" alt=""></button>
  </div></div>
</div>

<div id="dock">
  <button class="matTrigger" id="rodMatTrigger" aria-label="choose rod material"><img id="rodMatTriggerImg" src="chime-swatch-rod-brass.png" alt=""></button>
  <button class="matTrigger" id="cordMatTrigger" aria-label="choose cord or chain"><img id="cordMatTriggerImg" src="chime-swatch-cord-chain.png" alt=""></button>
  <div class="group">
    <span style="font-size:13px;opacity:.75;" aria-hidden="true">#️⃣</span>
    <input type="range" id="countSlider" min="5" max="9" step="1" value="7" aria-label="number of rods">
  </div>
  <div class="group">
    <span style="font-size:13px;opacity:.75;" aria-hidden="true">🧵</span>
    <input type="range" id="cordLenSlider" min="40" max="170" step="1" value="95" aria-label="hanging length">
  </div>
  <div class="group" id="windGroup">
    <span style="font-size:13px;opacity:.75;" aria-hidden="true">🌀</span>
    <input type="range" id="windSlider" min="0" max="100" step="1" value="35" aria-label="wind strength">
    <button type="button" id="loc-flag" title="use real local wind speed" aria-label="use real local wind speed" aria-expanded="false">🚩</button>
    <div id="loc-popup">
      <div id="loc-note"><span id="loc-note-text">using an approximate location — check that your browser and device allow it, then</span> <button type="button" id="loc-retry">try again</button></div>
      <form id="loc-search" autocomplete="off">
        <input type="text" id="loc-search-input" placeholder="postcode or city" aria-label="postcode or city">
      </form>
      <div id="loc-search-status"></div>
    </div>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  let W=0, H=0, DPR=1;

  const G = 900;
  const WIND_MAX = 250;
  const PITCH_K = 4200000;
  const ROD_LEN_MIN = 70, ROD_LEN_MAX = 180;
  const ROD_THICK = 12;
  const COLLIDE_DIST = ROD_THICK + 2;   // centres this close and the rods are touching
  const SEPARATE = 3;                   // and this much further apart before they can meet again
  const RESTITUTION = 0.45;             // rods are not bouncy; most of the closing speed is lost
  const MIN_STRIKE_SPEED = 5;           // below this they are nudging each other, not striking
  const CORD_THICK = { rope:7, chain:5, string:3 };
  const HANGER_W = 172;

  // ---- assets ----
  // The rod, cord and hanger are drawn (see drawRod/drawCord/drawHanger), so the
  // old sprite PNGs -- which carried a baked light halo and blurred when scaled --
  // are no longer loaded. The small swatch images in the material pickers stay.
  function loadImg(src){ const i=new Image(); i.src=src; return i; }

  // ---- state ----
  const state = {
    rodMaterial: 'brass',
    cordMaterial: 'chain',
    count: 7,
    wind: 0.35,
    cordLength: 95, // shared by every rod, so the tops all hang level
    rods: [],
  };

  function defaultRodLength(i, n){
    const t = n>1 ? i/(n-1) : 0.5;
    return ROD_LEN_MAX - t*(ROD_LEN_MAX-ROD_LEN_MIN); // left = long/low, right = short/high, like a real set
  }

  function rebuildRods(preserve){
    const old = state.rods;
    const rods = [];
    for(let i=0;i<state.count;i++){
      const prev = preserve && old[i];
      rods.push({
        rodLength: prev ? prev.rodLength : defaultRodLength(i, state.count),
        angle: (Math.random()-0.5)*0.2,
        angVel: 0,
        touching: false,
        // a wind signature of its own: three eddy frequencies and phases, so the
        // same breeze pushes each rod differently and neighbours drift apart
        w1: 0.7+Math.random()*0.9,  p1: Math.random()*6.28,
        w2: 1.7+Math.random()*1.6,  p2: Math.random()*6.28,
        w3: 3.1+Math.random()*2.4,  p3: Math.random()*6.28,
        gustResp: 0.75+Math.random()*0.5,   // how much this rod catches the air
      });
    }
    state.rods = rods;
    closePopup();
  }

  // ---- layout ----
  let hangerX=0, hangerTopY=60, hangerDrawH=0, pivotY=0, ringSpan=0;
  function layout(){
    hangerX = W/2;
    hangerDrawH = HANGER_W * 1.02;
    pivotY = hangerTopY + hangerDrawH*0.92;
    ringSpan = HANGER_W*0.85;
  }
  function pivotX(i, n){
    if(n<=1) return hangerX;
    return hangerX + (i - (n-1)/2) * (ringSpan/(n-1));
  }

  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W*DPR; canvas.height = H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    layout();
  }
  window.addEventListener('resize', resize);

  // ---- audio ----
  let audioCtx = null, masterBus = null, voices = 0;
  // A backstop against a runaway, nothing more. Brass rings for 3.4s, so even the
  // busiest honest weather — nine rods in a full wind, 11.6 note-starts a second
  // — leaves about 40 tails overlapping, and that measures 0.22 peak: nowhere
  // near needing a limit. Set this anywhere near the real overlap and it starts
  // swallowing notes instead, which is worse than loud: a rod visibly strikes its
  // neighbour and nothing comes out. At 14 it was dropping two thirds of them.
  const MAX_VOICES = 48;

  function ensureAudio(){
    if(audioCtx) return;
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    // A safety net for a rare pile-up, not a permanent squasher. This used to be
    // a compressor at -18dB (0.126) fed a signal measuring 0.215 rms, so it was
    // in gain reduction essentially all the time, holding every tail flat — that
    // is the deadening. Trimmed first and set at -6dB it now sits over a 0.042
    // rms signal and only moves when something genuinely stacks up.
    masterBus = audioCtx.createGain();
    masterBus.gain.value = 0.5;
    const comp = audioCtx.createDynamicsCompressor();
    comp.threshold.value = -6; comp.ratio.value = 4; comp.knee.value = 10;
    comp.attack.value = 0.006; comp.release.value = 0.35;
    masterBus.connect(comp); comp.connect(audioCtx.destination);
  }

  // A struck rod is a free-free bar, and a free-free bar's overtones are not a
  // harmonic series: they land at 2.756x and 5.404x the fundamental, from the
  // roots of the bar equation. That inharmonic spacing is the whole reason a
  // chime reads as metal being hit rather than as a note being played, and it is
  // the same whatever the bar is made of — material sets the fundamental, the
  // brightness and the length of the ring, not where the overtones sit. Only the
  // glass voice had this right; silver used an invented 3.0 and brass a bandpass
  // at 2.1, which is why they sounded like something other than a chime.
  const PARTIALS = [1, 2.756, 5.404];

  // Pitch follows the material's own speed of sound, sqrt(E/rho), so the same rod
  // cut from different stock rings at a different note. Against brass (E 100GPa,
  // rho 8500 -> 3430 m/s): silver 2690, wood 4140, glass 5290 m/s. Silver to
  // glass is very nearly a fifth. Before this, choosing a material changed the
  // timbre but not one note of the pitch, which is the piece quietly lying about
  // what picking a material means.
  const MATERIAL = {
    brass:  { pitch: 1.00, ring: 3.4,  level: 1.00, attack: 0.004, amps: [1, 0.38, 0.13], noise: 0    },
    silver: { pitch: 0.78, ring: 2.8,  level: 0.95, attack: 0.004, amps: [1, 0.30, 0.09], noise: 0    },
    glass:  { pitch: 1.54, ring: 1.5,  level: 0.85, attack: 0.002, amps: [1, 0.52, 0.24], noise: 0    },
    wood:   { pitch: 1.21, ring: 0.30, level: 0.80, attack: 0.001, amps: [1, 0.16, 0.04], noise: 0.45 },
  };

  function strike(freq, velocity, material){
    window.__strikes=(window.__strikes||0)+1;
    if(!audioCtx || voices >= MAX_VOICES) return;
    const M = MATERIAL[material] || MATERIAL.brass;
    // a few ms ahead, so nothing is ever scheduled into a moment already gone
    const t = audioCtx.currentTime + 0.005;
    const vol = Math.min(0.42, 0.05 + velocity/900) * M.level;
    const out = audioCtx.createGain();
    out.gain.value = vol;
    out.connect(masterBus);
    voices++;
    let last = 0;

    M.amps.forEach((amp, i) => {
      if(amp < 0.02) return;
      const o = audioCtx.createOscillator();
      o.type = 'sine';
      o.frequency.value = freq * PARTIALS[i];
      const g = audioCtx.createGain();
      // Higher modes shed energy faster, which is why a struck bar settles onto
      // its fundamental as it dies away instead of just getting quieter.
      const ring = M.ring / Math.sqrt(PARTIALS[i]);
      // Every voice used to open with setValueAtTime(1) — gain from nothing to
      // full inside one sample. Measured, that mattered less than it looks: the
      // partials all start at zero crossings, so only wood's noise burst really
      // stepped in (1.6x its own running slope, against 1.0x for the metals).
      // A couple of ms of attack costs nothing and removes it either way, and a
      // struck bar does take a moment to load up rather than arriving instantly.
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(amp, t + M.attack);
      g.gain.exponentialRampToValueAtTime(0.0001, t + M.attack + ring);
      o.connect(g); g.connect(out);
      o.start(t); o.stop(t + M.attack + ring + 0.02);
      last = Math.max(last, M.attack + ring + 0.02);
    });

    if(M.noise > 0){
      // wood is mostly the sound of the hit itself rather than a ring after it
      const len = Math.max(1, Math.round(audioCtx.sampleRate * 0.18));
      const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      const data = buf.getChannelData(0);
      for(let i=0;i<len;i++) data[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2);
      const noise = audioCtx.createBufferSource(); noise.buffer = buf;
      const filt = audioCtx.createBiquadFilter();
      filt.type = 'bandpass'; filt.frequency.value = freq*1.6; filt.Q.value = 1.1;
      const gn = audioCtx.createGain();
      gn.gain.setValueAtTime(0, t);
      gn.gain.linearRampToValueAtTime(M.noise, t + 0.001);
      gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
      noise.connect(filt); filt.connect(gn); gn.connect(out);
      noise.start(t);
      last = Math.max(last, 0.2);
    }

    setTimeout(()=>{ out.disconnect(); voices--; }, (last + 0.15)*1000);
  }
  function pitchFor(rodLength, material){
    const M = MATERIAL[material] || MATERIAL.brass;
    return PITCH_K/(rodLength*rodLength) * M.pitch;
  }

  // ---- physics + draw ----
  let lastT = null, elapsed = 0;
  function bobX(r, i, n){
    const eff = state.cordLength + r.rodLength*0.5;
    return pivotX(i,n) + Math.sin(r.angle)*eff;
  }

  function tick(now){
    if(lastT===null) lastT = now;
    const dt = Math.min((now-lastT)/1000, 1/45); lastT = now;
    elapsed += dt;
    const n = state.rods.length;
    const windAmp = state.wind * WIND_MAX;

    // A shared breeze that swells and drops, plus turbulence unique to each rod.
    // The old wind was a single global gust that every rod obeyed together, so they
    // swung as one sheet and rarely met; giving each its own eddies is what makes
    // neighbours drift, cross, and knock into each other the way a real set does.
    const breeze = Math.sin(elapsed*0.42)*0.55 + Math.sin(elapsed*0.97+1.3)*0.45;
    for(let i=0;i<n;i++){
      const r = state.rods[i];
      const turb = Math.sin(elapsed*r.w1+r.p1)*0.5 + Math.sin(elapsed*r.w2+r.p2)*0.32
                 + Math.sin(elapsed*r.w3+r.p3)*0.18;
      r.gust = windAmp * r.gustResp * (0.45*breeze + 0.75*turb);
    }

    // Sub-step the swing and the contacts together. A rod in a full wind can cross
    // the fourteen-pixel contact band in a single frame and, tested once a frame,
    // sail straight through its neighbour without ever registering; four sub-steps
    // shrink that skip below the band so the strike is always caught.
    const STEPS = 4, h = dt/STEPS;
    for(let s2=0;s2<STEPS;s2++){
      for(let i=0;i<n;i++){
        const r = state.rods[i];
        const eff = state.cordLength + r.rodLength*0.5;
        const damping = 0.40 + r.rodLength*0.0004;   // longer rods lose a touch more
        const angAcc = -(G/eff)*Math.sin(r.angle) - damping*r.angVel + (r.gust/eff)*Math.cos(r.angle);
        r.angVel += angAcc*h;
        r.angle  += r.angVel*h;
      }
      // contacts between neighbours, resolved this sub-step
      for(let i=0;i<n-1;i++){
        const a = state.rods[i], b = state.rods[i+1];
        const effA = state.cordLength+a.rodLength*0.5, effB = state.cordLength+b.rodLength*0.5;
        const ax = bobX(a,i,n), bx = bobX(b,i+1,n);
        const gap = Math.abs(ax-bx);
        if(gap >= COLLIDE_DIST + SEPARATE){ a.touching = false; continue; }
        if(gap >= COLLIDE_DIST){ continue; }
        const dir = Math.sign(bx - ax) || 1;

        // separate them so the two solid rods never occupy the same space -- the old
        // code only nudged velocities and let the bodies overlap and pass through
        const overlap = COLLIDE_DIST - gap;
        a.angle -= (overlap*0.5/effA)*dir;
        b.angle += (overlap*0.5/effB)*dir;

        const closing = (a.angVel*effA - b.angVel*effB) * dir;   // >0 = coming together
        if(closing <= 0){ continue; }

        const j = (1 + RESTITUTION) * closing / (1/a.rodLength + 1/b.rodLength);
        a.angVel -= (j/a.rodLength) * dir / effA;
        b.angVel += (j/b.rodLength) * dir / effB;

        if(!a.touching && closing > MIN_STRIKE_SPEED){
          ensureAudio();
          strike(pitchFor(a.rodLength, state.rodMaterial), closing, state.rodMaterial);
          strike(pitchFor(b.rodLength, state.rodMaterial), closing, state.rodMaterial);
        }
        a.touching = true;
      }
    }

    draw();
    if(popupOpenIdx>=0) positionPopupOnRod();
    requestAnimationFrame(tick);
  }

  function drawRodsAndCords(rodMat, cordMat, cordThick, n){
    for(let i=0;i<n;i++){
      const r = state.rods[i];
      const px = pivotX(i,n);
      ctx.save();
      ctx.translate(px, pivotY);
      ctx.rotate(r.angle);
      drawCord(state.cordLength, cordMat);
      drawRod(state.cordLength, r.rodLength, rodMat);
      ctx.restore();
    }
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    const n = state.rods.length;
    drawRodsAndCords(state.rodMaterial, state.cordMaterial, CORD_THICK[state.cordMaterial], n);
    drawHanger(n);   // over the cord tops, so the cords disappear into the bar
  }

  // ---- the parts, drawn ------------------------------------------------------
  // Every piece here is drawn rather than a stretched photo. The sprites carried a
  // soft light halo baked into them and went blurry when scaled; drawing the wood,
  // the cord and the metal keeps every edge crisp and every material under control.

  // Each material has its own shape, not only its own colour: the aged brass a
  // mottled cylinder, the silver a plain one, the wood a flat wide slat with
  // rounded edges and a big drilled hole, the glass a thin, long, triangular rod.
  const ROD_MATS = {
    brass:  { edge:'#4a3413', body:'#a37f34', spec:'#f4e1a2', lip:'#6a4e1e', alpha:1,
              shape:'round', width:12, mottle:true },
    silver: { edge:'#565c61', body:'#a7afb5', spec:'#ffffff', lip:'#6a7075', alpha:1,
              shape:'round', width:12 },
    wood:   { edge:'#3a2410', body:'#8a5a2c', spec:'#c79a5c', lip:'#4a2f16', alpha:1,
              shape:'flat',  width:17, grain:true, hole:3.0 },
    glass:  { edge:'#4f9f96', body:'#cdeee7', spec:'#ffffff', lip:'#8fc9c0', alpha:0.58,
              shape:'prism', width:8,  lenMul:1.16 },
  };

  function drawRod(topY, len0, matKey){
    const M = ROD_MATS[matKey];
    const W = M.width, half = W/2, len = len0*(M.lenMul||1);
    const y0 = topY, y1 = topY+len;
    ctx.save();
    ctx.globalAlpha = M.alpha;

    if(M.shape === 'prism'){
      // GLASS -- a thin triangular rod that comes to points top and bottom, with a
      // bright edge running down its spine where the two faces meet
      ctx.beginPath();
      ctx.moveTo(0, y0);                 // top point
      ctx.lineTo(half, y0+W);
      ctx.lineTo(half, y1-W);
      ctx.lineTo(0, y1);                 // bottom point
      ctx.lineTo(-half, y1-W);
      ctx.lineTo(-half, y0+W);
      ctx.closePath(); ctx.save(); ctx.clip();
      const gx = ctx.createLinearGradient(-half,0,half,0);
      gx.addColorStop(0.0, M.edge); gx.addColorStop(0.42, M.body);
      gx.addColorStop(0.5, M.spec); gx.addColorStop(0.58, M.body); gx.addColorStop(1.0, M.edge);
      ctx.fillStyle = gx; ctx.fillRect(-half-1, y0-1, W+2, len+2);
      ctx.restore();
      // the lit spine
      ctx.globalAlpha = M.alpha*0.9;
      ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, y0+2); ctx.lineTo(0, y1-2); ctx.stroke();
      ctx.restore();
      // a small hanging hole near the top point
      ctx.save(); ctx.globalAlpha = M.alpha; ctx.fillStyle='rgba(20,40,38,0.6)';
      ctx.beginPath(); ctx.ellipse(0, y0+W*0.7, 1.3, 1.0, 0, 0, Math.PI*2); ctx.fill();
      ctx.restore();
      return;
    }

    const r = (M.shape === 'flat') ? Math.min(half*0.55, 5) : half;   // corner round
    // the body outline: a rounded slat (flat) or a capsule (round)
    ctx.beginPath();
    ctx.moveTo(-half, y0+r); ctx.quadraticCurveTo(-half, y0, -half+r, y0);
    ctx.lineTo(half-r, y0); ctx.quadraticCurveTo(half, y0, half, y0+r);
    ctx.lineTo(half, y1-r); ctx.quadraticCurveTo(half, y1, half-r, y1);
    ctx.lineTo(-half+r, y1); ctx.quadraticCurveTo(-half, y1, -half, y1-r);
    ctx.closePath(); ctx.save(); ctx.clip();
    const gx = ctx.createLinearGradient(-half,0,half,0);
    if(M.shape === 'flat'){
      // wood reads flatter and more matte, with a rounded lip catching light at each edge
      gx.addColorStop(0.0, M.edge); gx.addColorStop(0.10, M.spec);
      gx.addColorStop(0.5, M.body); gx.addColorStop(0.90, M.spec); gx.addColorStop(1.0, M.edge);
    } else {
      gx.addColorStop(0.0, M.edge); gx.addColorStop(0.28, M.spec);
      gx.addColorStop(0.5, M.body); gx.addColorStop(1.0, M.edge);
    }
    ctx.fillStyle = gx; ctx.fillRect(-half-1, y0-1, W+2, len+2);
    // length shade
    const gy = ctx.createLinearGradient(0,y0,0,y1);
    gy.addColorStop(0,'rgba(255,255,255,0.10)'); gy.addColorStop(0.15,'rgba(255,255,255,0)');
    gy.addColorStop(0.9,'rgba(0,0,0,0)'); gy.addColorStop(1,'rgba(0,0,0,0.28)');
    ctx.fillStyle = gy; ctx.fillRect(-half-1, y0-1, W+2, len+2);
    if(M.grain){
      ctx.strokeStyle = 'rgba(50,30,12,0.42)'; ctx.lineWidth = 0.8;
      for(let k=0;k<4;k++){ const gxp = -half+W*(0.22+k*0.19);
        ctx.beginPath(); ctx.moveTo(gxp, y0+2);
        ctx.bezierCurveTo(gxp+1.5, y0+len*0.4, gxp-1.5, y0+len*0.7, gxp+(k-1.5), y1-2);
        ctx.stroke(); }
    }
    if(M.mottle){
      // aged brass: soft darker and lighter patches, placed by a fixed pattern so
      // they sit still rather than shimmer frame to frame
      for(let k=0;k<7;k++){
        const yy = y0 + len*((k*0.618)%1);
        const xx = Math.sin(k*2.3)*half*0.5;
        const rr = 2 + (k%3);
        ctx.fillStyle = (k%2) ? 'rgba(60,42,16,0.30)' : 'rgba(245,225,170,0.18)';
        ctx.beginPath(); ctx.ellipse(xx, yy, rr, rr*1.4, 0, 0, Math.PI*2); ctx.fill();
      }
    }
    ctx.restore();

    // top lip + cord hole (a bigger, clearly drilled hole for wood)
    ctx.save(); ctx.globalAlpha = M.alpha;
    ctx.strokeStyle = M.lip; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(0, y0+r, Math.max(1,r-0.5), Math.PI*1.05, Math.PI*1.95); ctx.stroke();
    const hr = M.hole || 1.6;
    ctx.fillStyle = 'rgba(18,12,5,0.72)';
    ctx.beginPath(); ctx.ellipse(0, y0 + hr + 2, hr, hr*0.8, 0, 0, Math.PI*2); ctx.fill();
    if(M.hole){ // a lit rim on the big drilled hole
      ctx.strokeStyle='rgba(210,170,110,0.5)'; ctx.lineWidth=0.8;
      ctx.beginPath(); ctx.ellipse(0, y0+hr+2, hr, hr*0.8, 0, Math.PI*0.9, Math.PI*2.1); ctx.stroke();
    }
    ctx.restore();   // the lip/hole layer
    ctx.restore();   // the outer save opened at the top of drawRod
  }

  function drawCord(len, matKey){
    if(matKey==='chain'){
      const link = 6; ctx.strokeStyle = '#c9cdd2'; ctx.lineWidth = 1.4;
      for(let y=0;y<len-2;y+=link){
        const vert = ((y/link)|0)%2===0;
        ctx.beginPath();
        if(vert) ctx.ellipse(0, y+link/2, 1.7, link*0.46, 0, 0, Math.PI*2);
        else     ctx.ellipse(0, y+link/2, 3.0, link*0.34, 0, 0, Math.PI*2);
        ctx.stroke();
      }
    } else if(matKey==='rope'){
      // two strands twisting round each other
      const amp = 2.2, twist = 0.5;
      for(const off of [0, Math.PI]){
        ctx.beginPath();
        for(let y=0;y<=len;y+=2){ const x = Math.sin(y*twist+off)*amp;
          if(y===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); }
        ctx.strokeStyle = off===0 ? '#b79a68' : '#8f7444'; ctx.lineWidth = 2.6; ctx.stroke();
      }
    } else { // string: a thin taut, faintly fibrous line
      ctx.strokeStyle = 'rgba(226,220,200,0.9)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,len); ctx.stroke();
      ctx.strokeStyle = 'rgba(120,110,90,0.5)'; ctx.lineWidth = 0.7;
      ctx.beginPath(); ctx.moveTo(0.6,0); ctx.lineTo(0.6,len); ctx.stroke();
    }
  }

  function drawHanger(n){
    const cx = hangerX, top = hangerTopY;
    const barH = hangerDrawH*0.15, barBottom = pivotY, barTop = barBottom - barH;
    const barCY = (barTop+barBottom)/2, halfW = HANGER_W/2;
    const ringCY = top + hangerDrawH*0.05, ringR = hangerDrawH*0.045;

    // suspension: two cords from the ring down to the bar ends
    ctx.save(); ctx.lineCap='round';
    for(const sgn of [-1,1]){
      ctx.strokeStyle = 'rgba(60,44,22,0.9)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(cx, ringCY+ringR); ctx.lineTo(cx+sgn*halfW*0.9, barTop+1); ctx.stroke();
      ctx.strokeStyle = 'rgba(150,120,74,0.5)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(cx-1, ringCY+ringR); ctx.lineTo(cx+sgn*halfW*0.9-1, barTop+1); ctx.stroke();
    }
    ctx.restore();

    // the brass hanging ring, up top
    ctx.save();
    const rg = ctx.createRadialGradient(cx-ringR*0.3, ringCY-ringR*0.3, 1, cx, ringCY, ringR);
    rg.addColorStop(0,'#f2dca0'); rg.addColorStop(0.6,'#b8933f'); rg.addColorStop(1,'#6a4e1e');
    ctx.strokeStyle = rg; ctx.lineWidth = ringR*0.5;
    ctx.beginPath(); ctx.arc(cx, ringCY, ringR, 0, Math.PI*2); ctx.stroke();
    ctx.restore();

    // the wooden bar: a rounded lozenge, lit from the top
    ctx.save();
    const br = barH/2;
    ctx.beginPath();
    ctx.moveTo(cx-halfW+br, barTop); ctx.lineTo(cx+halfW-br, barTop);
    ctx.arc(cx+halfW-br, barCY, br, -Math.PI/2, Math.PI/2);
    ctx.lineTo(cx-halfW+br, barBottom); ctx.arc(cx-halfW+br, barCY, br, Math.PI/2, Math.PI*1.5);
    ctx.closePath(); ctx.clip();
    const wg = ctx.createLinearGradient(0, barTop, 0, barBottom);
    wg.addColorStop(0.0, '#7a4f28'); wg.addColorStop(0.35, '#5a3819');
    wg.addColorStop(0.7, '#3f2712'); wg.addColorStop(1.0, '#241407');
    ctx.fillStyle = wg; ctx.fillRect(cx-halfW-2, barTop-2, HANGER_W+4, barH+4);
    // a couple of grain streaks along it
    ctx.strokeStyle='rgba(30,18,8,0.4)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(cx-halfW, barCY+2); ctx.lineTo(cx+halfW, barCY+1); ctx.stroke();
    ctx.restore();
    // the bar's own contact shadow beneath, so it sits over the cords
    ctx.save(); ctx.strokeStyle='rgba(0,0,0,0.3)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(cx-halfW+br, barBottom); ctx.lineTo(cx+halfW-br, barBottom); ctx.stroke();
    ctx.restore();
  }

  // world position of the point midway down a rod's body -- used to anchor its length popup
  function rodMidWorld(i, n){
    const r = state.rods[i];
    const mid = state.cordLength + r.rodLength*0.5;
    const px = pivotX(i,n);
    return { x: px - Math.sin(r.angle)*mid, y: pivotY + Math.cos(r.angle)*mid };
  }
  // inverse of the canvas translate+rotate used to draw rod i, for hit-testing a click point
  function hitTestRod(clientX, clientY, n){
    for(let i=n-1;i>=0;i--){
      const r = state.rods[i];
      const px = pivotX(i,n);
      const dx = clientX-px, dy = clientY-pivotY;
      const cosA = Math.cos(r.angle), sinA = Math.sin(r.angle);
      // inverse of the canvas rotate(angle) transform used to draw this rod
      const lx = dx*cosA + dy*sinA, ly = -dx*sinA + dy*cosA;
      const padX = 12, padTop = 8, padBottom = 12;
      if(lx > -ROD_THICK/2-padX && lx < ROD_THICK/2+padX &&
         ly > state.cordLength-padTop && ly < state.cordLength+r.rodLength+padBottom){
        return i;
      }
    }
    return -1;
  }

  // ---- UI ----
  // material pickers: a small trigger swatch that opens a wordless popup list, same pattern as warmler's finish picker
  function wireMatPicker(stateKey, swatchFile, triggerBtn, triggerImg, overlay, list){
    function apply(key){
      state[stateKey] = key;
      triggerImg.src = swatchFile(key);
      list.querySelectorAll('.matOption').forEach(o => o.classList.toggle('selected', o.dataset.key === key));
    }
    apply(state[stateKey]);
    triggerBtn.addEventListener('click', () => overlay.classList.add('open'));
    overlay.addEventListener('click', (e) => { if(e.target === overlay) overlay.classList.remove('open'); });
    list.querySelectorAll('.matOption').forEach(opt => {
      opt.addEventListener('click', () => { apply(opt.dataset.key); overlay.classList.remove('open'); });
    });
  }
  wireMatPicker('rodMaterial', k => `chime-swatch-rod-${k}.png`,
    document.getElementById('rodMatTrigger'), document.getElementById('rodMatTriggerImg'),
    document.getElementById('rodMatOverlay'), document.getElementById('rodMatList'));
  wireMatPicker('cordMaterial', k => `chime-swatch-cord-${k}.png`,
    document.getElementById('cordMatTrigger'), document.getElementById('cordMatTriggerImg'),
    document.getElementById('cordMatOverlay'), document.getElementById('cordMatList'));

  const countSlider = document.getElementById('countSlider');
  countSlider.addEventListener('input', ()=>{
    state.count = +countSlider.value;
    rebuildRods(true);
  });
  const windSlider = document.getElementById('windSlider');
  windSlider.addEventListener('input', ()=>{
    state.wind = (+windSlider.value)/100;
    if (liveWind!=null){ liveWind=null; windLocFlag.classList.remove('live'); }
  });
  const cordLenSlider = document.getElementById('cordLenSlider');
  cordLenSlider.addEventListener('input', ()=>{ state.cordLength = +cordLenSlider.value; });

  // ---------- optional: swap the wind slider over to somewhere's real wind speed.
  // opt-in only -- never asks for location on its own, only when the flag is used.
  let liveWind=null, windLat=null, windLon=null;
  const windLocFlag=document.getElementById('loc-flag'), windLocPopup=document.getElementById('loc-popup'),
        windLocNote=document.getElementById('loc-note'), windLocNoteText=document.getElementById('loc-note-text'),
        windLocRetry=document.getElementById('loc-retry'), windLocSearch=document.getElementById('loc-search'),
        windLocSearchInput=document.getElementById('loc-search-input'), windLocStatus=document.getElementById('loc-search-status');

  async function fetchLiveWind(){
    if (windLat==null || windLon==null) return;
    try{
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${windLat}&longitude=${windLon}&current=wind_speed_10m`;
      const res = await fetch(url);
      const data = await res.json();
      if (data && data.current && typeof data.current.wind_speed_10m === 'number'){
        const kmh = data.current.wind_speed_10m;
        liveWind = Math.max(0, Math.min(100, kmh*2.2)); // 0-100 slider scale, tuned against the physics range
        state.wind = liveWind/100;
        windSlider.value = Math.round(liveWind);
        windLocFlag.classList.add('live');
        hideWindLocNote();
      } else {
        throw new Error('unexpected response shape');
      }
    } catch(e){
      // silence here would mean quietly keeping the chimes swaying to a wind speed that's
      // no longer real without ever admitting it -- this is opt-in and the popup starts
      // closed anyway, so there's no harm in saying so plainly the first time it happens
      showWindLocNote(liveWind!=null
        ? "couldn't reach the weather just now — still showing the last real reading"
        : "couldn't reach the weather — try again, or type a place below");
    }
  }
  function showWindLocNote(msg){ if(msg) windLocNoteText.textContent = msg; windLocNote.classList.add('visible'); }
  function hideWindLocNote(){ windLocNote.classList.remove('visible'); }

  function tryWindGeolocation(){
    if (!navigator.geolocation){ showWindLocNote("this browser can't share your location — try typing a place instead"); return; }
    if (windLocRetry){ windLocRetry.disabled = true; windLocRetry.textContent = 'checking…'; }
    navigator.geolocation.getCurrentPosition(
      pos => {
        windLat = pos.coords.latitude; windLon = pos.coords.longitude;
        hideWindLocNote();
        if (windLocRetry){ windLocRetry.disabled = false; windLocRetry.textContent = 'try again'; }
        fetchLiveWind();
      },
      () => {
        if (windLocRetry){ windLocRetry.disabled = false; windLocRetry.textContent = 'try again'; }
        showWindLocNote("couldn't get your location — check your browser and device settings, then");
      },
      { timeout: 5000 }
    );
  }
  windLocRetry.addEventListener('click', tryWindGeolocation);

  windLocFlag.addEventListener('click', ()=>{
    const open = windLocPopup.classList.toggle('open');
    windLocFlag.classList.toggle('open', open);
    windLocFlag.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open && windLat==null && liveWind==null) tryWindGeolocation();
  });

  windLocSearch.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const q = windLocSearchInput.value.trim();
    if (!q) return;
    windLocStatus.textContent = 'looking…';
    try{
      const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q)}`;
      const res = await fetch(url);
      const results = await res.json();
      if (!results || !results.length){ windLocStatus.textContent = "couldn't find that"; return; }
      windLat = parseFloat(results[0].lat); windLon = parseFloat(results[0].lon);
      hideWindLocNote();
      await fetchLiveWind();
      windLocStatus.textContent = results[0].display_name.split(',').slice(0, 2).join(', ');
      windLocSearchInput.value = '';
    } catch(e){
      windLocStatus.textContent = "couldn't reach the map — try again";
    }
  });

  setInterval(()=>{ if (liveWind!=null) fetchLiveWind(); }, 10*60*1000);

  // ---- per-rod length popup: tap a rod to tune just its length ----
  const lenPopup = document.getElementById('lenPopup');
  const lenPopupSlider = document.getElementById('lenPopupSlider');
  let popupOpenIdx = -1;

  function positionPopupOnRod(){
    const n = state.rods.length;
    const mid = rodMidWorld(popupOpenIdx, n);
    const popupW = lenPopup.offsetWidth || 150, popupH = lenPopup.offsetHeight || 70;
    let left = mid.x - popupW/2;
    let top = mid.y - popupH - 16;
    left = Math.max(8, Math.min(left, window.innerWidth - popupW - 8));
    top = Math.max(8, top);
    lenPopup.style.left = `${left}px`;
    lenPopup.style.top = `${top}px`;
  }
  function openPopupForRod(i){
    popupOpenIdx = i;
    const r = state.rods[i];
    lenPopupSlider.min = ROD_LEN_MIN; lenPopupSlider.max = ROD_LEN_MAX; lenPopupSlider.value = r.rodLength;
    lenPopup.classList.add('open');
    positionPopupOnRod();
  }
  function closePopup(){
    popupOpenIdx = -1;
    lenPopup.classList.remove('open');
  }
  lenPopupSlider.addEventListener('input', ()=>{
    if(popupOpenIdx<0) return;
    const r = state.rods[popupOpenIdx];
    r.rodLength = +lenPopupSlider.value;
  });
  lenPopup.addEventListener('click', e=> e.stopPropagation());
  canvas.addEventListener('click', (e)=>{
    const hit = hitTestRod(e.clientX, e.clientY, state.rods.length);
    if(hit>=0){
      openPopupForRod(hit);
      e.stopPropagation();
    }
  });
  document.addEventListener('click', (e)=>{
    if(lenPopup.classList.contains('open') && !lenPopup.contains(e.target)){
      closePopup();
    }
  });

  window.addEventListener('pointerdown', ensureAudio, {once:true});

  resize();
  rebuildRods(false);
  window.__chime = { get rods(){return state.rods;}, get count(){return state.rods.length;} };
  requestAnimationFrame(tick);
})();
</script>

<script>
(function(){
  var disc=document.getElementById('shelfdisc'), box=document.getElementById('plates');
  var rows=[].slice.call(box.querySelectorAll('.row'));
  function unroll(){ rows.forEach(function(r){ r.classList.remove('rolled'); }); }
  function shut(){ box.classList.remove('open'); disc.setAttribute('aria-expanded','false'); unroll(); }

  disc.addEventListener('click', function(ev){
    ev.stopPropagation();
    var open=box.classList.toggle('open');
    disc.setAttribute('aria-expanded', open?'true':'false');
    if(!open) unroll();
  });

  // Same bargain the case itself strikes: a mouse can hover, so a plate is a link
  // straight to its shelf. A thumb cannot, so the first tap on a plate rolls its
  // pieces out and only the second one goes to the shelf.
  var FINE=matchMedia('(hover: hover) and (pointer: fine)');
  rows.forEach(function(row){
    row.querySelector('.tag').addEventListener('click', function(ev){
      if(FINE.matches) return;
      if(row.classList.contains('rolled')) return;
      ev.preventDefault();
      unroll(); row.classList.add('rolled');
    });
  });

  document.addEventListener('click', function(ev){
    if(!box.contains(ev.target) && ev.target!==disc) shut();
  });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') shut(); });
})();
</script>
